const dayLabel=t=>{const d=new Date(t);return`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${W[d.getDay()]}요일`};
const hm=t=>{const d=new Date(t);let h=d.getHours(),m=d.getMinutes();const ap=h<12?'오전':'오후';h=h%12||12;return`${ap} ${h}:${String(m).padStart(2,'0')}`};
const minKey=t=>Math.floor(t/60000);
function render(){const c=$('#chat');let h=`<div class="notice"><b>✝ 예수님과의 대화방이에요</b>"너는 내게 부르짖으라 내가 네게 응답하겠고 네가 알지 못하는 크고 비밀한 일을 네게 보이리라"<br>(예레미야 33장 3절)</div>`;
  let lastDay='';M.forEach((m,i)=>{const dk=dayKey(m.t);if(dk!==lastDay){h+=`<div class="day"><span>📅 ${dayLabel(m.t)}</span></div>`;lastDay=dk}
    const prev=M[i-1],next=M[i+1],first=!prev||!prev.j!==!m.j||dayKey(prev.t)!==dk||minKey(prev.t)!==minKey(m.t),showT=true;
    if(m.j){const cont=!first;h+=`<div class="row you${cont?' cont':''}" data-i="${i}"><div class="pf">${PF}</div><div class="col">${cont?'':'<div class="nm">예수님</div>'}<div class="line"><div class="bub">${esc(m.x)}<span class="ref">- ${esc(m.r)}</span></div>${showT?`<div class="meta"><span>${hm(m.t)}</span></div>`:''}</div></div></div>`;return}
    h+=`<div class="row me${first?' first':''}" data-i="${i}"><div class="meta">${m.u?'<span class="u">1</span>':''}${showT?`<span>${hm(m.t)}</span>`:''}</div><div class="bub">${esc(m.x)}</div></div>`});
  if(TYPING)h+=`<div class="row you typing"><div class="pf">${PF}</div><div class="col"><div class="nm">예수님</div><div class="bub"><i></i><i></i><i></i></div></div></div>`;
  if(!M.length)h+=`<div class="day"><span>📅 ${dayLabel(Date.now())}</span></div>`;
  c.innerHTML=h;c.scrollTop=c.scrollHeight}

const ta=$('#msg'),sendB=$('#send');
function grow(){ta.style.height='auto';ta.style.height=Math.min(120,ta.scrollHeight)+'px';sendB.classList.toggle('on',!!ta.value.trim())}
function send(){const x=ta.value.replace(/\s+$/,'');if(!x.trim())return;const m={t:Date.now(),x,u:1};M.push(m);save();ta.value='';grow();render();ta.focus();

let TYPING=false,RT=null;
function pickVerse(text){const s=text.replace(/\s+/g,' ');let best=null,bi=1e9;
  R.forEach(g=>g.k.forEach(k=>{const i=s.indexOf(k);if(i>=0&&i<bi){bi=i;best=g}}));
  /* 가장 먼저 나온 마음보다, 여러 번 나온 마음을 우선해요 */
  let top=null,tc=0;R.forEach(g=>{const c=g.k.reduce((n,k)=>n+(s.split(k).length-1),0);if(c>tc){tc=c;top=g}});
  const g=(top&&tc>1?top:best)||R[R.length-1];
  const used=new Set(M.filter(m=>m.j).slice(-6).map(m=>m.r));const pool=g.v.filter(v=>!used.has(v[1]));const L=pool.length?pool:g.v;return L[Math.floor(Math.random()*L.length)]}
function queueReply(){clearTimeout(RT);RT=setTimeout(()=>{TYPING=true;render();RT=setTimeout(()=>{
    let i=M.length-1;const parts=[];while(i>=0&&!M[i].j){parts.unshift(M[i].x);i--}
    if(!parts.length){TYPING=false;render();return}
    const[v,r]=pickVerse(parts.join(' '));TYPING=false;M.push({t:Date.now(),x:v,r,j:1});save();render()},1300+Math.random()*700)},1100)}
