function parse(txt){const out=[],map={};let total=0;
  String(txt||"").split(/[,\n;、，]+/).forEach(raw=>{const t=raw.trim();if(!t)return;
    const m=t.match(/^(.+?)\s*[*×xX＊✕·]\s*(\d+)\s*(마리|명)?$/);let name=(m?m[1]:t).trim().slice(0,12),n=m?parseInt(m[2],10):1;
    if(!name)return;n=Math.max(0,Math.min(50,n||0));if(!n)return;
    if(map[name])map[name].count+=n;else{map[name]={name,count:n};out.push(map[name])}});
  out.forEach((p,i)=>{p.color=WOOL[i%WOOL.length]});
  total=out.reduce((a,p)=>a+p.count,0);return{people:out,total}}

let R=null,raf=0;
function stopRace(){cancelAnimationFrame(raf);raf=0;if(R&&R.ro)R.ro.disconnect();R=null;closeStage()}
function closeStage(){const st=$("#stage");if(st)st.remove();document.body.style.overflow="";document.body.classList.remove("racing");

function goFull(el){try{const f=el.requestFullscreen||el.webkitRequestFullscreen;if(f){const r=f.call(el);if(r&&r.catch)r.catch(()=>{})}}catch(e){}}
/* 🚧 장애물 종류 (h: 높이 m, crash: 걸려 넘어질 확률, span: 주로 폭 중 차지하는 비율) */
const OB={

/* 🛤️ 특별 구간: 25% 좁은 길 3개 · 50% 낭떠러지와 다리 · 75% 좁아지는 길 */
function makeZones(M){const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  const n3L=cl(M*.05,9,30),gap=cl(M*.025,6,12),nrL=cl(M*.06,9,40);
  return{n3:{m0:M*.25,m1:M*.25+n3L,lanes:[[.08,.24],[.42,.58],[.76,.92]],block:Math.floor(Math.random()*3)},
    cliff:{m0:M*.5-gap/2,m1:M*.5+gap/2,b0:.455,b1:.545},
    narrow:{m0:M*.75,m1:M*.75+nrL,a:.32,b:.68}}}
function makeCourse(M,Z){const list=[];let m=rnd(10,16),id=0;const tot=Object.values(OB).reduce((a,o)=>a+o.w,0);
  const busy=[[Z.n3.m0-10,Z.n3.m1+4],[Z.cliff.m0-14,Z.cliff.m1+5],[Z.narrow.m0-9,Z.narrow.m1+4]];
  while(m<M-8){const bz=busy.find(([a,b])=>m>=a&&m<=b);if(bz){m=bz[1]+rnd(1,4);continue}
let k=Math.random()*tot,type="hurdle";for(const [ty,o] of Object.entries(OB)){if((k-=o.w)<0){type=ty;break}}
    const o=OB[type],ob={id:++id,type,m};
    if(o.full){ob.t0=0;ob.t1=1}
    else if(o.flat){ob.len=o.len?rnd(o.len[0],o.len[1]):rnd(3.5,8);ob.dep=o.dep?rnd(o.dep[0],o.dep[1]):rnd(.07,.14);ob.tc=rnd(ob.dep/2,1-ob.dep/2);ob.t0=ob.tc-ob.dep/2;ob.t1=ob.tc+ob.dep/2}
    else{const w=rnd(o.span[0],o.span[1]);ob.tc=rnd(w/2+.02,1-w/2-.02);ob.t0=ob.tc-w/2;ob.t1=ob.tc+w/2}
    list.push(ob);m+=Math.max(2.5,rnd(6,26)*(1-.7*Math.pow(m/M,1.2))*(Math.random()<.18?.4:1))}  // 들쭉날쭉, 결승선에 가까울수록 촘촘해져요
  // 75% 좁아지는 길: 함정을 촘촘하게
  const NZ=Z.narrow,TR=["pit","banana","honey","mud","ice","pit","banana","honey"];
  for(let q=NZ.m0+1.2;q<NZ.m1-1;q+=rnd(1.8,3.2)){const type=TR[Math.floor(Math.random()*TR.length)],dep=rnd(.1,.17),tc=rnd(NZ.a+dep/2+.01,NZ.b-dep/2-.01);
    list.push({id:++id,type,m:q,len:rnd(1.6,2.8),dep,tc,t0:tc-dep/2,t1:tc+dep/2})}
  return list}
function startRace(r){
  stopRace();
  const sheep=[];r.people.forEach(p=>{for(let i=0;i<p.count;i++)sheep.push({owner:p.name,color:p.color,no:i+1})});
  for(let i=sheep.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sheep[i],sheep[j]]=[sheep[j],sheep[i]]}
  const M=+SET.dist||300,D=durOf(M),n=sheep.length;
  sheep.forEach((s,i)=>{s.lane=i;s.yf=Math.min(.95,Math.max(.05,(i+.5)/n+rnd(-.3,.3)/n));s.ty=s.yf;s.p=0;s.f=rnd(.92,1.08);s.v=0;s.tv=1/D;s.nextT=0;s.passed=new Set();s.tried=0;s.stun=0;s.jump=-9;s.jh=1;s.boost=0;s.done=false;s.dq=false;s.ev=null;s.hole=null;s.cool=rnd(1,3);s.leg=Math.random()*6});
  const Z=makeZones(M),obs=makeCourse(M,Z),clovers=[];
  R={limit:+SET.limit||0,limitStart:null,people:r.people,sheep,D,M,Z,zAnn:{},obs,clovers,t:0,last:0,fin:[],dqN:0,started:false,speed:1,over:false,camC:0,tilt:.5,zoom:1,manual:false,camMode:SET.dir==="back"?"last":"lead",tkOpen:window.innerWidth>700};
  const st=document.createElement("div");st.id="stage";st.className="stage";
  st.innerHTML=`<canvas id="cv"></canvas>
    <div class="hud"><div class="row"><div class="legend sp">${r.people.map(p=>`<span class="chip">${sheepSVG(p.color,24)}${esc(p.name)} ${p.count}</span>`).join("")}<span class="chip">📏 ${M}m</span>${+SET.limit?`<span class="chip clock" id="clock">⏱ ${fmtClock(+SET.limit)} · ${SET.pod}위까지 들어오면 시작</span>`:""}</div>
      <button class="sm" id="cam">🎥 ${R.camMode==="lead"?"선두":"꼴찌"} 따라가기</button><button class="sm" id="zin" title="확대">🔍＋</button><button class="sm" id="zout" title="축소">🔍－</button><button class="sm" id="fast">⏩ 2배속</button><button class="sm" id="snd" title="효과음 켜기/끄기">${SFX.on?"🔊 소리":"🔇 소리"}</button><button class="sm" id="fsb">⛶ 전체화면</button><button class="sm" id="stop">■ 그만하기</button></div>
      <div class="hint camhint">🖱️ 화면을 좌우로 끌면 카메라 이동 · 위아래로 끌면 앵글 높이 · 휠/🔍로 확대</div><div class="cast" id="cast">🎙️ 곧 출발해요! ${n}마리 양들이 ${M}m 출발선에 섰어요</div></div>
    <div class="ticker${R.tkOpen?"":" shut"}" id="tkbox"><h3 id="tkt">🏁 도착 순서 <span class="hint" id="tkc">0/${n}</span></h3><div class="hint">${SET.dir==="back"?"⏪ 뒤에서부터 순위예요. 가장 늦게 도착한 양이 1위!":"⏩ 먼저 도착한 양이 1위예요"}</div><div id="tk"></div></div>
    <div class="cd" id="cd"></div>`;
  document.body.appendChild(st);document.body.style.overflow="hidden";document.body.classList.add("racing");goFull(st);
  $("#stop").onclick=()=>{if(confirm("경주를 그만하고 설정으로 돌아갈까요?"))renderSetup()};
  $("#fast").onclick=()=>{R.speed=R.speed===1?2:1;$("#fast").textContent=R.speed===1?"⏩ 2배속":"▶ 보통 속도"};
  const camLbl=()=>{$("#cam").textContent=R.manual?"🎥 자동으로 따라가기":`🎥 ${R.camMode==="lead"?"선두":"꼴찌"} 따라가기`};
  $("#cam").onclick=()=>{if(R.manual)R.manual=false;else R.camMode=R.camMode==="lead"?"last":"lead";camLbl()};
  const zoomBy=f=>{R.zoom=Math.max(.6,Math.min(1.8,R.zoom*f));const keep=R.camC/R.ppm;layout();R.camC=keep*R.ppm;draw()};
  $("#zin").onclick=()=>zoomBy(1.15);$("#zout").onclick=()=>zoomBy(1/1.15);
  // 화면을 끌면: 좌우 = 카메라 이동, 위아래 = 앵글(높게/낮게)
  const cvEl=$("#cv");let drag=null;
  cvEl.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,c:R.camC,tl:R.tilt,mv:false};try{cvEl.setPointerCapture(e.pointerId)}catch(_){}};
  cvEl.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.mv&&Math.hypot(dx,dy)<4)return;drag.mv=true;
    if(Math.abs(dx)>2){if(!R.manual){R.manual=true;camLbl()}R.camC=drag.c-dx/kOf(.5)}
    const nt=Math.max(0,Math.min(1,drag.tl+dy*.004));if(Math.abs(nt-R.tilt)>.002){const keep=R.camC/R.ppm;R.tilt=nt;layout();R.camC=keep*R.ppm}draw()};
  cvEl.onpointerup=cvEl.onpointercancel=()=>{drag=null};
  cvEl.addEventListener("wheel",e=>{e.preventDefault();zoomBy(e.deltaY<0?1.1:1/1.1)},{passive:false});
  $("#snd").onclick=()=>{$("#snd").textContent=SFX.toggle()?"🔊 소리":"🔇 소리"};
