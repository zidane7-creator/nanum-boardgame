<meta name="description" content="이름 * 숫자로 양을 만들어 장애물 달리기를 시켜요. 먼저(또는 늦게) 도착한 양 순서로 순위를 정하고, 포디움 인원과 등수별 상품, 중복 제거까지 설정할 수 있는 교회 레크리에이션 추첨 게임.">

<style>
:root{--ink:#3b2a20;--cream:#fffaf0;--line:#e3d6c2;--accent:#e8503a;--gold:#f5b82e;--green:#3f9a55;--blue:#2f6fb0;--muted:#7a6a5c;--soft:#f6efe2}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);background:#f7f1e6;font:16px/1.55 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
h1,h2,h3,.j,.top{font-family:"Jua","Apple SD Gothic Neo",sans-serif;font-weight:normal}
button{font:inherit;color:var(--ink);border:2px solid var(--ink);background:var(--cream);border-radius:14px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}button:disabled{opacity:.45;cursor:default;transform:none}
button.pri{background:var(--accent);color:#fff}button.ok{background:var(--green);color:#fff}
button.sm{padding:3px 10px;font-size:14px;border-radius:10px;box-shadow:0 2px 0 var(--ink)}button.big{font-size:23px;padding:12px 30px;font-family:Jua,sans-serif}
input,select,textarea{font:inherit;color:var(--ink);border:2px solid #cdbda6;border-radius:12px;padding:7px 10px;background:#fff;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:rgba(255,255,255,.95);border-bottom:4px solid var(--gold)}
.top a{color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:14px;padding:3px 10px;background:var(--cream)}.top .ttl{flex:1;font-size:19px}
main{max-width:860px;margin:0 auto;padding:14px 12px 90px}
main.wide{max-width:1300px}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.card h2{margin:0 0 8px;font-size:23px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.hint{font-size:14px;color:var(--muted)}.center{text-align:center}
.hero{text-align:center;padding:4px 0 10px}.hero .em{font-size:58px;line-height:1.1}.hero h1{margin:4px 0 0;font-size:clamp(30px,7vw,42px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 6px;background:#fffdf7;font-family:Jua,sans-serif;font-size:17px}
.chip svg{flex:none}
.tot{font-family:Jua,sans-serif;font-size:18px;margin-top:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{background:#fff;border-color:#cdbda6;box-shadow:0 3px 0 #cdbda6;text-align:left;display:flex;flex-direction:column}
.seg button b{font-family:Jua,sans-serif;font-weight:normal;font-size:18px}.seg button span{font-size:13px;color:var(--muted)}
.seg button.on{background:#fff4e0;border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.seg3{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.seg{grid-template-columns:1fr}.seg3{grid-template-columns:repeat(3,1fr)}}
.lbl{font-family:Jua,sans-serif;font-size:17px;margin:14px 0 6px;display:block}
.prizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.prizes label{display:flex;align-items:center;gap:8px;font-family:Jua,sans-serif}
.prizes label span{flex:none;width:3.2em}.prizes input{flex:1}
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:10px 12px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.chk b{font-family:Jua,sans-serif;font-weight:normal;font-size:17px}
/* race */
@media (max-width:860px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.track{position:relative;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#7cc36b;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.track canvas{display:block}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Jua,sans-serif;font-size:clamp(60px,14vw,140px);color:#fff;text-shadow:0 4px 0 var(--ink),0 0 20px rgba(0,0,0,.4);pointer-events:none}
.cast{font-family:Jua,sans-serif;font-size:clamp(17px,2.6vw,22px);background:#fff6d8;border:2px solid var(--gold);border-radius:14px;padding:6px 14px;margin-bottom:8px;min-height:2.1em}
.cast.flash{animation:fl .5s ease-out}@keyframes fl{from{background:#ffe08a;transform:scale(1.02)}}
.ticker{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px;max-height:78vh;overflow:auto;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.ticker h3{margin:0 0 6px;font-size:19px}
.tk{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line);font-family:Jua,sans-serif;font-size:16px;animation:tin .3s ease-out}
.tk .n{flex:none;width:2.6em;color:var(--muted);font-size:14px}
@keyframes tin{from{opacity:0;transform:translateX(10px)}}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.legend .chip{font-size:15px;padding:1px 10px 1px 4px}
/* 전체화면 경주 */
.stage{position:fixed;inset:0;z-index:1000;background:#6fb35f;overflow:hidden}
.stage canvas{position:absolute;inset:0;display:block}
.stage .hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.stage .hud>*{pointer-events:auto}.stage .legend{margin:0}.stage .cast{margin:0;align-self:flex-start;max-width:min(900px,100%);background:rgba(255,246,216,.95)}
.stage .ticker{position:absolute;right:10px;bottom:46px;width:220px;max-height:min(46vh,420px);background:rgba(255,255,255,.92);border-width:2px;padding:10px}
.stage .ticker h3{cursor:pointer;display:flex;gap:6px;align-items:baseline}.stage .ticker.shut{max-height:none;overflow:hidden}.stage .ticker.shut>:not(h3){display:none}.stage .ticker.shut h3{margin:0}
.stage .cd{position:absolute;inset:0}
@media (max-width:600px){.stage .ticker{width:170px}.stage .hud .chip{font-size:13px}}
body.racing #homeFab{display:none!important}
/* result */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:10px 0 4px;min-height:260px}
.pcol{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;text-align:center}
.pcol .who{font-family:Jua,sans-serif;font-size:clamp(20px,4vw,30px);line-height:1.2;word-break:keep-all;animation:pop .6s ease-out both}
.pcol .prz{font-family:Jua,sans-serif;font-size:clamp(15px,2.6vw,19px);color:var(--accent);margin-bottom:6px;animation:pop .6s ease-out both}
.pcol .blk{width:100%;border:3px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:Jua,sans-serif;font-size:clamp(28px,6vw,44px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.pcol.p1 .blk{height:150px;background:linear-gradient(#ffd75e,#e9a91c)}.pcol.p2 .blk{height:110px;background:linear-gradient(#e3e8ee,#a9b4c1)}.pcol.p3 .blk{height:80px;background:linear-gradient(#f1b98a,#c47a3d)}
.pcol.p1 .who,.pcol.p1 .prz{animation-delay:1.1s}.pcol.p2 .who,.pcol.p2 .prz{animation-delay:.65s}.pcol.p3 .who,.pcol.p3 .prz{animation-delay:.2s}
.pcol .sub{font-size:13px;color:var(--muted);font-family:inherit}
.base{height:12px;background:var(--ink);border-radius:6px;margin:0 auto 12px;max-width:700px}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.8)}}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:8px 12px;font-family:Jua,sans-serif;font-size:19px}
.prow .rk{flex:none;width:3em;color:var(--accent)}.prow .pz{margin-left:auto;color:var(--accent);font-size:17px;text-align:right}
.prow .og{font-size:13px;color:var(--muted);font-family:inherit}
table.all{width:100%;border-collapse:collapse;font-size:15px}
table.all th,table.all td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
table.all tr.win td{background:#fff4e0}
table.all td.x{color:var(--muted);font-size:13px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:14px;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.pcol .who,.pcol .prz,.tk{animation:none}.confetti{display:none}}
</style>
</head><body>
<div class="top"><a href="../">← 목장</a><span class="ttl">🐑 양 달리기</span></div>
<main id="app"><div class="card center">불러오는 중…</div></main>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tt;function toast(t,ms){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),ms||2200)}
const rnd=(a,b)=>a+Math.random()*(b-a);
/* 사람마다 다른 양털 색 */
const WOOL=["#fbf7ec","#ffb3c7","#9fd0ff","#b6eda4","#ffd27f","#d3b6ff","#fff07a","#8fe5d4","#ffae8a","#c8ccd2","#a9b9ff","#e5c49b","#f7a6e9","#c2e86d","#7fd9ff","#ff9f9f"];
const MAXN=150;
/* ---------- 설정 ---------- */
let SET={txt:"A * 3, B * 4, C * 5",dir:"front",pod:3,prizes:["10,000원","5,000원","3,000원"],dedup:true,dist:300};
try{Object.assign(SET,JSON.parse(localStorage.getItem("race-setup")||"{}"))}catch(e){}
const saveSet=()=>{try{localStorage.setItem("race-setup",JSON.stringify(SET))}catch(e){}};
/* "A * 3, B * 4" → [{name,count,color}] (같은 이름은 합쳐요) */
function parse(txt){const out=[],map={};let total=0;
  String(txt||"").split(/[,\n;、，]+/).forEach(raw=>{const t=raw.trim();if(!t)return;
    const m=t.match(/^(.+?)\s*[*×xX＊✕·]\s*(\d+)\s*(마리|명)?$/);let name=(m?m[1]:t).trim().slice(0,12),n=m?parseInt(m[2],10):1;
    if(!name)return;n=Math.max(0,Math.min(50,n||0));if(!n)return;
    if(map[name])map[name].count+=n;else{map[name]={name,count:n};out.push(map[name])}});
  out.forEach((p,i)=>{p.color=WOOL[i%WOOL.length]});
  total=out.reduce((a,p)=>a+p.count,0);return{people:out,total}}
const sheepSVG=(c,s)=>`<svg width="${s||28}" height="${(s||28)*.82}" viewBox="0 0 44 36" aria-hidden="true"><g fill="#4a3a30"><rect x="10" y="25" width="3.4" height="8" rx="1.7"/><rect x="16" y="26" width="3.4" height="8" rx="1.7"/><rect x="23" y="26" width="3.4" height="8" rx="1.7"/><rect x="28" y="25" width="3.4" height="8" rx="1.7"/></g><g fill="${c}" stroke="#6b5444" stroke-width="1.4"><circle cx="9" cy="18" r="6.5"/><circle cx="15" cy="11" r="7"/><circle cx="23" cy="10" r="7"/><circle cx="29" cy="17" r="6.5"/><circle cx="22" cy="23" r="7"/><circle cx="13" cy="23" r="6.5"/></g><ellipse cx="19" cy="17" rx="10" ry="7.5" fill="${c}"/><ellipse cx="27.5" cy="14" rx="3" ry="1.8" fill="#e9c3a6" stroke="#6b5444" stroke-width="1"/><ellipse cx="34" cy="16" rx="7" ry="7.4" fill="#fde7d2" stroke="#6b5444" stroke-width="1.4"/><g fill="${c}" stroke="#6b5444" stroke-width="1"><circle cx="31.5" cy="9.5" r="3"/><circle cx="35.5" cy="9" r="3"/></g><circle cx="32.2" cy="16" r="1.4" fill="#2b1d14"/><circle cx="37" cy="16" r="1.4" fill="#2b1d14"/><circle cx="32.6" cy="15.5" r=".5" fill="#fff"/><circle cx="37.4" cy="15.5" r=".5" fill="#fff"/><circle cx="31" cy="19.3" r="1.5" fill="#ff9fb0" opacity=".8"/><circle cx="38.6" cy="19.3" r="1.5" fill="#ff9fb0" opacity=".8"/><path d="M33.6 19.6q1 1 2 0" stroke="#6b5444" stroke-width=".9" fill="none" stroke-linecap="round"/></svg>`;
const DISTS=Array.from({length:20},(_,i)=>(i+1)*100);
const durOf=m=>6+m*.075; // 경주 거리(m) → 대략 걸리는 시간(초)
const fmtSec=x=>x<60?`약 ${Math.round(x)}초`:`약 ${Math.floor(x/60)}분${Math.round(x%60)?" "+Math.round(x%60)+"초":""}`;

/* ---------- 설정 화면 ---------- */
function renderSetup(){stopRace();
  const {people,total}=parse(SET.txt),maxPod=Math.max(1,Math.min(total||1,30));if(SET.pod>maxPod)SET.pod=maxPod;
  while(SET.prizes.length<SET.pod)SET.prizes.push("");
  app.innerHTML=`<div class="hero"><div class="em">🐑🏁</div><h1>양 달리기</h1><div class="hint">양들의 장애물 달리기로 순위와 상품을 정해요</div></div>
  <div class="card"><h2>🐑 참가자와 양</h2>
    <textarea id="txt" rows="3" placeholder="A * 3, B * 4, C * 5">${esc(SET.txt)}</textarea>
    <div class="hint">“이름 * 숫자”를 쉼표나 줄바꿈으로 이어 적어요. 숫자만큼 그 사람의 양이 생기고, 사람마다 양 색깔이 달라요. (숫자를 빼면 1마리)</div>
    <div id="prev"></div></div>
  <div class="card"><h2>🏆 순위와 상품</h2>
    <span class="lbl">순위 매기는 방향</span>
    <div class="seg"><button data-dir="front" class="${SET.dir==="front"?"on":""}"><b>⏩ 앞에서부터</b><span>먼저 도착한 양이 1위</span></button><button data-dir="back" class="${SET.dir==="back"?"on":""}"><b>⏪ 뒤에서부터</b><span>가장 늦게 도착한 양이 1위</span></button></div>
    <span class="lbl">포디움에 올라갈 인원</span>
    <div class="row"><select id="pod">${Array.from({length:maxPod},(_,i)=>`<option value="${i+1}" ${SET.pod===i+1?"selected":""}>${i+1}위까지</option>`).join("")}</select><span class="hint">이 등수까지 상품을 받아요</span></div>
    <span class="lbl">등수별 상품</span>
    <div class="prizes" id="prizes">${Array.from({length:SET.pod},(_,i)=>`<label><span>${i+1}위</span><input data-pz="${i}" maxlength="30" value="${esc(SET.prizes[i]||"")}" placeholder="예: 문화상품권"></label>`).join("")}</div>
    <span class="lbl">중복</span>
    <label class="chk"><input type="checkbox" id="dedup" ${SET.dedup?"checked":""}><span><b>중복 제거 (한 사람은 한 번만 상품 받기)</b><br><span class="hint">같은 사람의 양이 여러 번 순위에 들면 더 높은 순위 하나만 남기고, 다음 사람이 그 자리를 이어받아요.</span></span></label>
    <span class="lbl">경주 거리</span>
    <div class="row"><select id="dist">${DISTS.map(m=>`<option value="${m}" ${+SET.dist===m?"selected":""}>${m}m</option>`).join("")}</select><span class="hint" id="distHint">${fmtSec(durOf(+SET.dist||300))} 동안 달려요 · 100m마다 허들 4개 정도</span></div>
  </div>
  <div class="center"><button class="big pri" id="go">🏁 출발!</button></div>`;
  const prev=()=>{const r=parse($("#txt").value);$("#prev").innerHTML=r.total?`<div class="chips">${r.people.map(p=>`<span class="chip">${sheepSVG(p.color,30)}${esc(p.name)} × ${p.count}</span>`).join("")}</div><div class="tot">총 ${r.people.length}명 · 양 ${r.total}마리${r.total>MAXN?` <span style="color:var(--accent)">(최대 ${MAXN}마리까지 달릴 수 있어요)</span>`:""}</div>`:`<div class="hint" style="margin-top:8px">아직 양이 없어요</div>`;return r};
  prev();
  let tm;$("#txt").oninput=()=>{SET.txt=$("#txt").value;saveSet();prev();clearTimeout(tm);tm=setTimeout(()=>{if(R||!$("#pod"))return;const r=parse(SET.txt),mp=Math.max(1,Math.min(r.total||1,30));if($("#pod").options.length!==mp){const a=document.activeElement===$("#txt"),pos=$("#txt").selectionStart;renderSetup();if(a){$("#txt").focus();$("#txt").setSelectionRange(pos,pos)}}},700)};
  $$("[data-dir]").forEach(b=>b.onclick=()=>{SET.dir=b.dataset.dir;saveSet();$$("[data-dir]").forEach(x=>x.classList.toggle("on",x===b))});

    <table class="all"><thead><tr><th>순위</th><th>양</th><th>도착</th><th></th></tr></thead><tbody>${ranked.concat(dqs.map(s=>({s,dq:true}))).map(r=>`<tr class="${r.place?"win":""}"><td>${r.dq?"실격":r.rank+"위"}</td><td><span class="row" style="gap:6px">${sheepSVG(r.s.color,22)}${esc(r.s.owner)} <span class="hint">#${r.s.no}</span></span></td><td>${r.dq?"🚫":r.s.rank+"착"}</td><td class="x">${r.place?`🏆 ${r.place}위${pz(r.place-1)?" · "+esc(pz(r.place-1)):""}`:r.skip?"중복이라 제외":""}</td></tr>`).join("")}</tbody></table></details>`;
  window.scrollTo(0,0);confetti();
  const text=`[🐑 양 달리기 결과]\n${SET.dir==="back"?"뒤에서부터":"앞에서부터"} · ${SET.pod}위까지${SET.dedup?" · 중복 제거":""}\n\n`+picks.map(r=>`${r.place}위 ${r.s.owner}${pz(r.place-1)?" "+pz(r.place-1):""}`).join("\n");
  $("#again").onclick=()=>startRace({people,total:people.reduce((a,p)=>a+p.count,0)});
  $("#setup").onclick=renderSetup;
  $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(text);toast("결과를 복사했어요")}catch(e){prompt("이 내용을 복사해 주세요",text)}};
  R=null}
function confetti(){const box=document.createElement("div");box.className="confetti";const em=["🎉","🎊","✨","🐑","⭐"];
  for(let i=0;i<40;i++){const e=document.createElement("i");e.textContent=em[i%em.length];e.style.left=Math.random()*100+"%";e.style.animationDuration=rnd(2.2,4)+"s";e.style.animationDelay=rnd(0,1.2)+"s";box.appendChild(e)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),5600)}
window.__raceTest={parse,computeResult,peek:()=>R,redraw:()=>draw(),sim:sec=>{if(!R)return null;R.started=true;for(let i=0;i<sec*30&&R&&!R.over;i++){R.t+=1/30;step(1/30)}if(R){camStep(1);draw()}return R&&{fin:R.fin.length,dq:R.dqN,over:R.over}}};
renderSetup();
})();
