  const go=()=>{S.name=$("nm").value.trim();save();vQ()};

  if($("restart"))$("restart").onclick=()=>{if(!confirm("답한 내용을 지우고 처음부터 할까요?"))return;S.ans={};S.i=0;save();vStart()}}
function vQ(){if(S.i>=72){vResult();return}const qi=ORDER[S.i],q=Q[qi],ar=AREAS.find(a=>a[0]===q[0]),flip=S.i%2===1;
  const opts=[["A",q[3]],["B",q[4]]];if(flip)opts.reverse();const ai=AREAS.indexOf(ar),inArea=S.i-ai*12+1;
  $("app").innerHTML=`<div class="card"><div class="row"><span class="badge">${ar[1]} ${ar[2]} ${inArea}/12</span><span style="flex:1"></span><span class="hint">${S.i+1} / 72</span></div>
   <div class="prog"><i style="width:${S.i/72*100}%"></i></div><div class="q">Q${S.i+1}. ${esc(q[2])}</div>
   <div class="opts">${opts.map(([k,t])=>`<button data-k="${k}" class="${S.ans[qi]===k?"sel":""}">${esc(t)}</button>`).join("")}</div>
   <div class="row" style="margin-top:14px"><button class="sm" id="back" ${S.i?"":"disabled"}>◀ 이전</button><span style="flex:1"></span><button class="sm" id="home">처음 화면</button></div></div>`;
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{S.ans[qi]=b.dataset.k;b.classList.add("sel");S.i++;save();
    if(S.i%12===0&&S.i<72)toast(ar[2]+" 질문 끝! 다음은 "+AREAS[ai+1][1]+" "+AREAS[ai+1][2]);setTimeout(vQ,180)});
  $("back").onclick=()=>{S.i=Math.max(0,S.i-1);save();vQ()};$("home").onclick=vStart}
function dimsHTML(c){return`<div class="dims">${AXES.map(([,a,an,b,bn,ca,cb])=>{const t=c[a]+c[b]||1,pa=Math.round(c[a]/t*100);return`<div class="dim"><span><b>${a}</b> ${an} ${pa}%</span><div class="bar"><i style="width:${pa}%;background:${ca}"></i><i style="width:${100-pa}%;background:${cb}"></i></div><span>${100-pa}% ${bn} <b>${b}</b></span></div>`}).join("")}</div>`}
function typeHTML(type,c,label){const t=T[type];return`<div class="res-top"><div class="nick">${label}</div><div class="ty">${type}</div><div class="who">${esc(t[0])}</div><div class="nick">“${esc(t[1])}”</div></div>${dimsHTML(c)}
  <div class="sec"><h3>📖 성경 속 ${esc(t[0])}</h3><p>${esc(t[2])}</p></div>
  <div class="sec"><h3>💪 이런 점이 닮았어요</h3><ul>${t[3].map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div>
  <div class="sec"><h3>🌱 이건 조심해요</h3><p>${esc(t[4])}</p></div>
  <div class="sec"><h3>🤝 잘 맞는 성경 인물</h3><p>${esc(t[5])} (${Object.keys(T).find(k=>T[k][0]===t[5])})</p></div>
  <div class="sec"><h3>✨ 나에게 주는 말씀</h3><p>${esc(t[6])}</p></div>`}
let RTAB="all";
function vResult(){const all=score(null),nm=S.name?S.name+"님":"나";
  const areaRes=AREAS.map(([k,i,n])=>({k,i,n,...score(k)}));
  const cur=RTAB==="all"?all:areaRes.find(a=>a.k===RTAB),label=RTAB==="all"?`${esc(nm)}의 성경인물 MBTI (전체 72문항)`:`${areaRes.find(a=>a.k===RTAB).i} ${areaRes.find(a=>a.k===RTAB).n}에서의 ${esc(nm)}`;
  $("app").innerHTML=`<div class="card"><div class="tabs"><button class="sm ${RTAB==="all"?"on":""}" data-t="all">🧩 전체</button>${AREAS.map(([k,i,n])=>`<button class="sm ${RTAB===k?"on":""}" data-t="${k}">${i} ${n}</button>`).join("")}</div>
    ${typeHTML(cur.type,cur.c,label)}
    <div class="row" style="justify-content:center;margin-top:14px"><button class="go" id="img">📥 결과 이미지 저장</button><button id="share">📤 결과 공유</button></div></div>
   <div class="card"><h2 style="margin:0 0 8px">🗂️ 상황별로 보면</h2><p class="hint" style="margin-top:0">상황마다 12문항으로 본 결과예요. 누르면 자세히 볼 수 있어요.</p>
    <div class="agrid">${areaRes.map(a=>`<div class="ac ${RTAB===a.k?"on":""}" data-t="${a.k}"><b>${a.i} ${a.n}</b><div class="t">${a.type}</div><div class="n">${esc(T[a.type][0])}</div></div>`).join("")}</div>
    <p class="hint">${(()=>{const set=new Set(areaRes.map(a=>a.type));return set.size===1?"어느 상황에서나 한결같은 사람이에요!":"상황에 따라 "+set.size+"가지 모습이 보여요. 교회와 일상에서 나는 조금 다른 사람일지도?"})()}</p></div>
   <div class="card"><h2 style="margin:0 0 8px">📚 16가지 성경 인물</h2><div class="all16">${Object.keys(T).map(k=>`<div style="${k===all.type?"background:#fff6d8;border-width:3px":""}"><b>${k}</b> ${esc(T[k][0])}<br><span class="hint">${esc(T[k][1])}</span></div>`).join("")}</div>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="sm" id="redo">다시 하기</button><button class="sm" id="home">처음 화면</button></div></div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{RTAB=b.dataset.t;vResult();window.scrollTo({top:0,behavior:"smooth"})});
  $("redo").onclick=()=>{if(!confirm("답한 내용을 지우고 다시 할까요?"))return;S.ans={};S.i=0;save();RTAB="all";vQ()};$("home").onclick=vStart;
  $("img").onclick=()=>saveImg(all,areaRes,nm);
  $("share").onclick=async()=>{const t=`[성경인물 MBTI] ${nm}는 ${all.type} ${T[all.type][0]} — ${T[all.type][1]}\n`+areaRes.map(a=>`${a.i} ${a.n}: ${a.type} ${T[a.type][0]}`).join("\n")+"\n"+location.origin+location.pathname;
    if(navigator.share){try{await navigator.share({text:t})}catch(e){}}else{try{await navigator.clipboard.writeText(t);toast("결과를 복사했어요")}catch(e){prompt("복사해 주세요",t)}}};
  try{gtag("event","bmbti_result",{type:all.type})}catch(e){}}
function saveImg(all,areaRes,nm){const W=720,H=1080,cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d"),F='"Jua", sans-serif',t=T[all.type];
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,"#5b4ba8");g.addColorStop(1,"#2e2468");c.fillStyle=g;c.fillRect(0,0,W,H);
  c.textAlign="center";c.textBaseline="middle";c.fillStyle="#fff";c.font="34px "+F;c.fillText("🧩 "+nm+"의 성경인물 MBTI",W/2,70);
  c.font="110px "+F;c.fillText(all.type,W/2,190);c.font="70px "+F;c.fillText(t[0],W/2,300);c.font="30px "+F;c.fillText("“"+t[1]+"”",W/2,370);
  let y=430;AXES.forEach(([,a,an,b,bn,ca,cb])=>{const tt=all.c[a]+all.c[b]||1,pa=all.c[a]/tt;c.fillStyle="#fff";c.font="24px "+F;c.textAlign="right";c.fillText(a+" "+Math.round(pa*100)+"%",150,y);c.textAlign="left";c.fillText(Math.round((1-pa)*100)+"% "+b,570,y);
    c.fillStyle=ca;c.fillRect(170,y-12,380*pa,24);c.fillStyle=cb;c.fillRect(170+380*pa,y-12,380*(1-pa),24);c.strokeStyle="#fff";c.lineWidth=2;c.strokeRect(170,y-12,380,24);y+=48});
  c.textAlign="center";c.fillStyle="rgba(255,255,255,.95)";c.beginPath();c.roundRect?c.roundRect(50,640,W-100,370,26):c.rect(50,640,W-100,370);c.fill();
  c.fillStyle="#3b2a20";c.font="30px "+F;c.fillText("🗂️ 상황별로 보면",W/2,685);
  areaRes.forEach((a,i)=>{const yy=738+i*47;c.font="27px "+F;c.textAlign="left";c.fillText(a.i+" "+a.n,90,yy);c.textAlign="right";c.fillText(a.type+" · "+T[a.type][0],W-90,yy)});
  c.textAlign="center";c.fillStyle="rgba(255,255,255,.85)";c.font="22px "+F;c.fillText("치영의 교회 생활 즐기기 · 성경인물 MBTI",W/2,H-40);
  cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(nm+"_성경인물MBTI.png").replace(/[\\/:*?"<>|]/g,"");document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("결과 이미지를 저장했어요")},"image/png")}
vStart();
window.__bm={S:()=>S,score,Q,T,vResult};
</script>
