<style>
:root{--ink:#4a3526;--cream:#fff8ee;--card:#fffdf8;--line:#f0d9b8;--accent:#e8603a;--accent2:#f39a3c;--green:#4f9a4a;--muted:#8a7462;--wolf:#c0392b;--sheep:#3f8a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;color:var(--ink);font:16px/1.5 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:linear-gradient(160deg,#8fcf6f,#5aa055 60%,#3f7d42);min-height:100%}
body.ingame{overflow:hidden;position:fixed;inset:0;background:#6aa957}
body.ingame #homeFab,body.ingame #siteNav,body.ingame #siteGuideBtn,body.ingame #menubar{display:none!important}
h1,h2,h3,.j,button{font-family:"Jua","Apple SD Gothic Neo",sans-serif;font-weight:normal}
button{font-size:16px;color:var(--ink);border:2px solid #e9c9a0;background:#fff;border-radius:14px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 #e2bf93;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #e2bf93}button:disabled{opacity:.45;cursor:default;transform:none}
button.go{background:linear-gradient(180deg,#f0743f,#dc5130);color:#fff;border-color:#c0441f;box-shadow:0 4px 0 #a8391a}

input{font:inherit;font-size:17px;padding:10px 12px;border:2px solid #ecd2ad;border-radius:12px;background:#fff;color:var(--ink);width:100%;min-width:0}
input:focus{outline:none;border-color:var(--accent2)}
.wrap{max-width:980px;margin:0 auto;padding:22px 14px 90px}
.card{background:var(--cream);border:2px solid var(--line);border-radius:26px;box-shadow:0 18px 50px rgba(40,60,20,.28);padding:22px}

.sub h3{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:#fde3cf;color:#b8501f}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:64px;height:64px;border-radius:18px;background:#fde6d4;border:2px solid #f3c8a6;display:grid;place-items:center;font-size:38px;flex:none}
.hd h1{margin:0;font-size:34px;line-height:1.1}
.hd .sp{flex:1}
.hint{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mapc{text-align:left;padding:10px;border-radius:16px;background:#fff;display:flex;gap:10px;align-items:center;position:relative;box-shadow:0 3px 0 #ecd2ad;border-color:#ecd2ad}
.mapc canvas{width:86px;height:60px;border-radius:10px;flex:none;border:1px solid #e5d3b8}
.mapc b{display:block;font-size:16px}.mapc small{display:block;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:12px;color:var(--muted);line-height:1.35}
.mapc.on{background:#fde9dc;border-color:var(--accent);box-shadow:0 3px 0 #d35a33}
.mapc.on::after{content:"선택됨";position:absolute;right:8px;top:8px;background:var(--accent);color:#fff;font-size:11px;padding:1px 7px;border-radius:8px}
@media(max-width:520px){.maps{grid-template-columns:1fr}}
#lob .maps{grid-template-columns:1fr;gap:7px}#lob .mapc{padding:7px 9px}.mapc[data-ro]{pointer-events:none}.mapc[data-ro]:not(.on){opacity:.7}

.cnt .t{flex:1}.cnt .t b{display:block}.cnt .t small{color:var(--muted);font-size:12.5px}
.cnt button{width:38px;height:38px;padding:0;font-size:20px}
.cnt .n{min-width:28px;text-align:center;font-family:Jua;font-size:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:5px 11px;font-size:14px;border-radius:10px}
.chips button.on{background:#fde3cf;border-color:var(--accent);box-shadow:0 2px 0 #d35a33}
.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.plc{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #f0e0c8;border-radius:14px;padding:7px 9px;min-width:0}
.plc i{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.28)}
.plc b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Jua;font-weight:normal}

#toast.show{opacity:1;transform:translate(-50%,0)}

.glass{background:rgba(255,250,240,.93);border:2px solid #efd6b2;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.15)}

#tasks .tg.all{background:#dcefd6;color:#2f7a2a}#tasks .tg.car{background:#dbeafb;color:#2a64a8}#tasks .tg.hard{background:#f6d9e6;color:#a32d64}

#topR{right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:230px}
#topR button{padding:6px 10px;font-size:14px}
#roleTag{left:50%;top:10px;transform:translateX(-50%);font-family:Jua;padding:5px 14px;font-size:15px;white-space:nowrap}

#mini{right:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:170px;border-radius:14px;border:3px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.25);background:#9c8;cursor:pointer}
#mini.big{width:min(92vw,700px);right:50%;bottom:50%;transform:translate(50%,50%);z-index:60}

#acts button b{font-size:13px;font-weight:normal}

#aKill{background:linear-gradient(180deg,#e8604a,#c0392b)!important;color:#fff;border-color:#9a2a1e!important}
#aUse.hot{background:linear-gradient(180deg,#ffe27a,#f5b82e);border-color:#d39a12}
#aRep.hot{background:linear-gradient(180deg,#ff9c7a,#ef6a3c);color:#fff}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.6);z-index:15;pointer-events:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.25)}
#joyHint{left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;font-family:Jua;white-space:nowrap}

#lob{left:10px;top:10px;bottom:96px;width:min(420px,calc(100vw - 20px));overflow:auto;padding:14px;background:rgba(255,248,238,.96);border:2px solid var(--line);border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.25)}

#lobTop{display:flex;align-items:center;gap:8px}
#lobTop h2{margin:0;font-size:22px;flex:1}
#readyBar{left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
#fsLob{right:10px;top:10px;padding:7px 12px;font-size:15px}#b3dLob{right:10px;top:56px;padding:7px 12px;font-size:15px}
@media(max-width:620px){#fsLob{top:auto;bottom:calc(150px + env(safe-area-inset-bottom));right:10px;font-size:13px;padding:6px 10px}#b3dLob{top:auto;bottom:calc(192px + env(safe-area-inset-bottom));right:10px;font-size:13px;padding:6px 10px}}
#readyBtn{font-size:22px;padding:12px 34px;border-radius:20px;min-width:220px}
#readyBtn.on{background:linear-gradient(180deg,#7ccf5a,#3f9a3a);border-color:#2f7a2a;box-shadow:0 4px 0 #23621f;color:#fff}
#readyMsg{font-family:Jua;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);font-size:15px}
@media(min-width:900px){#readyBar{left:calc(50% + 215px)}}

.ov{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(30,22,15,.55)}
.ov .box{background:var(--cream);border:3px solid var(--line);border-radius:26px;max-width:640px;width:100%;max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.ov h2{margin:4px 0 8px;font-size:28px}
.big{font-size:60px;line-height:1.1}
#reveal .box{max-width:460px}
#reveal canvas{width:220px;height:200px}
.wolfbox{background:linear-gradient(180deg,#3a2a35,#22161f)!important;color:#fff;border-color:#6b3b48!important}
.wolfbox .hint{color:#e7c9d0}
.meet .box{max-width:760px;text-align:left}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.vgrid button{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;font-size:15px;min-width:0;position:relative}
.vgrid button i{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.28)}
.vgrid button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vgrid button.dead{opacity:.45;text-decoration:line-through}
.vgrid button.mine{background:#fde3cf;border-color:var(--accent)}

.chat{background:#fff;border:2px solid #f0e0c8;border-radius:14px;height:150px;overflow:auto;padding:8px 10px;font-size:14.5px}
.chat div{margin:2px 0}
.mtimer{font-family:Jua;font-size:22px;color:var(--accent)}
#mg .box{max-width:440px;user-select:none;-webkit-user-select:none}
.mgarea{position:relative;margin:12px auto 6px;background:#f6ecd9;border-radius:18px;border:2px solid #ecd6b5;overflow:hidden;touch-action:none}
.holdb{width:170px;height:170px;border-radius:50%;font-size:64px;display:grid;place-items:center;margin:16px auto;border:4px solid #fff;box-shadow:0 6px 0 #d9b98c;background:conic-gradient(#7ccf5a var(--p,0%),#fff 0);touch-action:none}
.tapt{position:absolute;font-size:46px;width:64px;height:64px;padding:0;border-radius:50%;display:grid;place-items:center;background:#fff;transition:left .15s,top .15s}
.gridn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.gridn button{height:70px;font-size:28px;font-family:Jua}
.gridn button.ok{background:#bfe8a8;border-color:#5aa94a}
.gridp{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px}
.gridp button{height:66px;font-size:32px;padding:0;background:#f5b82e;border-color:#d39a12}
.gridp button.up{background:#fff}.gridp button.ok{background:#dff3d3;border-color:#7cbf6a;visibility:visible}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.simon button{height:96px;font-size:40px;opacity:.55;transition:opacity .1s,transform .1s}
.simon button.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 0 5px #fff,0 0 24px 6px rgba(255,230,120,.9)}
.ropes{display:flex;justify-content:space-between;padding:14px 18px;position:relative}

.ropes svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.swipe{height:90px;position:relative;margin:16px 12px}

.code{font-family:Jua;font-size:40px;letter-spacing:6px;color:var(--accent)}

function Builder(W,H){const M={W,H,obs:[],water:[],walk:[],zones:[],props:[],fences:[],bridges:[],paths:[],plazas:[],fields:[],beds:[],tasks:[]};
  const B={M,
    house(x,y,w,roof,o={}){M.props.push({t:'house',x,y,w,roof,wall:o.wall||'#fff3df',h:o.h||62,sign:o.sign||'',wood:o.wood});M.obs.push({r:[x-w/2,y-54,w,54]})},
    hut(x,y,w,roof,sign){M.props.push({t:'house',x,y,w,roof,wall:'#d39a64',h:50,sign:sign||'',wood:1});M.obs.push({r:[x-w/2,y-46,w,46]})},
    trees(a){a.forEach(([x,y,s,k])=>{M.props.push({t:'tree',x,y,s:s||1,k:k||'round'});M.obs.push({c:[x,y-4,11*(s||1)]})})},
    well(x,y){M.props.push({t:'well',x,y});M.obs.push({c:[x,y-8,30]})},
    bell(x,y){M.bell=[x,y+30];M.props.push({t:'bell',x,y});M.obs.push({c:[x,y-4,14]})},
    mill(x,y){M.props.push({t:'mill',x,y});M.obs.push({c:[x,y-24,46]})},
    hay(x,y){M.props.push({t:'hay',x,y});M.obs.push({c:[x,y-10,20]})},
    crate(x,y){M.props.push({t:'crate',x,y});M.obs.push({r:[x-16,y-22,32,22]})},
    stall(x,y,c){M.props.push({t:'stall',x,y,c});M.obs.push({r:[x-42,y-28,84,28]})},
    board(x,y){M.props.push({t:'board',x,y});M.obs.push({r:[x-28,y-10,56,10]})},
    pump(x,y){M.props.push({t:'pump',x,y});M.obs.push({c:[x,y-6,10]})},
    crow(x,y){M.props.push({t:'crow',x,y});M.obs.push({c:[x,y-4,8]})},
    light(x,y){M.props.push({t:'light',x,y});M.obs.push({c:[x,y-10,22]})},
    flag(x,y){M.props.push({t:'flag',x,y});M.obs.push({c:[x,y-3,6]})},
    kite(x,y){M.props.push({t:'kite',x,y})},
    logs(x,y){M.props.push({t:'logs',x,y});M.obs.push({r:[x-34,y-18,68,18]})},
    boat(x,y){M.props.push({t:'boat',x,y,flat:1})},
    bush(x,y,s=1,c){M.props.push({t:'bush',x,y,s,c});M.obs.push({c:[x,y-8,15*s]})},
    rock(x,y,s=1){M.props.push({t:'rock',x,y,s});M.obs.push({c:[x,y-6,16*s]})},
    fence(x1,y1,x2,y2){M.fences.push([x1,y1,x2,y2]);const t=10;M.obs.push({r:x1===x2?[x1-t/2,Math.min(y1,y2),t,Math.abs(y2-y1)]:[Math.min(x1,x2),y1-t/2,Math.abs(x2-x1),t]})},
    lake(e){M.water.push({e})},river(r){M.water.push({r})},
    bridge(r,dock){M.walk.push({r});M.bridges.push({r,dock})},
    island(c){M.walk.push({c});M.island=c},
    zone(k,s){M.zones.push(Object.assign({k},s))},
    path(pts,w){M.paths.push({pts,w:w||58})},plaza(x,y,r){M.plazas.push([x,y,r])},
    field(r){M.fields.push(r);M.zones.push({k:'wheat',r})},
    bed(x,y,r,k){M.beds.push([x,y,r,k])},
    task(o){M.tasks.push(o)}};
  return B}

function coastify(M,bays,seed){const r=srng(seed),C=bays.slice();const step=92;
  for(let x=-20;x<=M.W+20;x+=step){C.push([x+r()*30,-6+r()*14,38+r()*48,28+r()*40]);C.push([x+r()*30,M.H+6-r()*14,38+r()*48,28+r()*40])}
  for(let y=-20;y<=M.H+20;y+=step){C.push([-6+r()*14,y+r()*30,28+r()*40,38+r()*48]);C.push([M.W+6-r()*14,y+r()*30,28+r()*40,38+r()*48])}
  const keep=[];for(const T of M.tasks)(T.k==='carry'?[T.a,T.b]:[[T.x,T.y]]).forEach(q=>keep.push([q[0],q[1],80]));keep.push([M.bell[0],M.bell[1],90]);keep.push([M.spawn[0],M.spawn[1],170]);
  M.props.forEach(q=>{if(!['tree','bush','rock','hay','crate'].includes(q.t))keep.push([q.x,q.y-25,(q.w||60)/2+45])});
  M.bridges.forEach(({r:[x,y,w,h]})=>keep.push([x+w/2,y+h/2,Math.max(w,h)/2+30]));
  const inE=(e,x,y,pad)=>((x-e[0])/(e[2]+pad))**2+((y-e[1])/(e[3]+pad))**2<1;
  const bad=e=>keep.some(([x,y,m])=>inE(e,x,y,m*.5+20));M.coast=[];C.forEach((e,i)=>{let f=1;const big=i<bays.length;for(let k=0;k<14&&bad([e[0],e[1],e[2]*f,e[3]*f]);k++)f*=.86;if(!bad([e[0],e[1],e[2]*f,e[3]*f])&&(!big||f>.28))M.coast.push([e[0],e[1],e[2]*f,e[3]*f])});
  const wet=(x,y)=>M.coast.some(e=>inE(e,x,y,26));
  M.props=M.props.filter(q=>!wet(q.x,q.y));M.obs=M.obs.filter(o=>{const c=o.c?o.c:[o.r[0]+o.r[2]/2,o.r[1]+o.r[3]/2];return o.r&&(o.r[2]>60||o.r[3]>60)||!wet(c[0],c[1])});
  M.coast.forEach(e=>M.water.push({e,coast:1}))}

function howHTML(){const mp=S&&S.ph!=='lobby'&&MAPS[S.map]?MAPS[S.map]:null;
  const ml=m=>`<li><b>${m.em} ${m.name}</b> — ${esc(m.desc)}. <span class="hint">${esc(m.terr)}</span><ul>${m.tasks.map(t=>`<li><span class="pill">${TAG[t.k][0]}</span> ${t.e} ${esc(t.n)}${t.k==='carry'?` <span class="hint">(${esc(t.an)} → ${esc(t.bn)})</span>`:''}</li>`).join('')}</ul></li>`;
  return`<div class="row" style="justify-content:space-between"><h2 style="margin:0">📖 양들의 침묵 게임방법</h2><button data-x="how">닫기</button></div>
  <h3>🐑 어떤 게임인가요?</h3><ul><li>평화로운 양 떼 속에 <b>양의 탈을 쓴 늑대</b>가 숨어 있어요. 겉모습은 모두 똑같은 양이에요!</li><li>🐑 <b>양</b>은 목장을 돌아다니며 미션을 끝내거나, 회의와 투표로 늑대를 모두 찾아내면 이겨요.</li><li>🐺 <b>늑대</b>는 들키지 않게 양을 하나씩 잡아서, 늑대 수가 양 수와 같아지면 이겨요.</li><li>“거짓 선지자들을 삼가라 양의 옷을 입고 너희에게 나아오나 속에는 노략질하는 이리라” (마태복음 7:15)</li></ul>
  <h3>🚪 시작하기</h3><ul><li>한 사람이 <b>방 만들기</b>를 하고, <b>📨 초대하기</b>의 QR·링크·방 코드로 친구들을 불러요. 들어온 사람은 로비 마당에서 돌아다니며 기다려요.</li><li>방장이 <b>맵</b>과 <b>늑대 수</b>(양 수는 나머지 사람), 회의 시간, 잡기 대기 시간을 정해요. 늑대는 양보다 적어야 해서 늑대 1마리면 3명, 2마리면 5명, 3마리면 7명부터 할 수 있어요.</li><li>모두가 <b>🙋 준비</b>를 누르면 3초 뒤에 게임이 시작돼요. 시작할 때 양과 늑대가 <b>무작위로</b> 정해지고, 내 화면에만 내가 양인지 늑대인지 나와요. 늑대는 같은 늑대가 누구인지도 알 수 있어요.</li></ul>
  <h3>🎮 움직이기</h3><ul><li>휴대폰: 화면 왼쪽 아무 곳이나 누른 채 끌면 조이스틱이 나와요. 오른쪽 아래 버튼으로 미션·신고·잡기를 해요.</li><li>컴퓨터: <b>WASD</b>·방향키로 움직이고 <b>E</b>(스페이스) 미션, <b>R</b> 신고·비상 종, <b>Q</b> 잡기, <b>F</b> 안개.</li><li>오른쪽 아래 <b>미니맵</b>에 내 위치(흰 점)와 해야 할 미션(노란 점), 비상 종(🔔)이 나와요. 미니맵을 누르면 크게 볼 수 있어요.</li><li>시야는 내 주변만 밝아요. 먼 곳의 양은 보이지 않아요.</li></ul>
  <h3>📋 양의 미션 6가지</h3><ul><li><span class="pill">모두</span> 2개: <b>모든 양이 한 번씩</b> 해야 끝나는 미션이에요. 한 마리라도 안 하면 완성이 안 돼요.</li><li><span class="pill">옮기기</span> 2개: 어떤 물건을 <b>A에서 주워 B까지</b> 옮겨요. 3번 옮기면 끝나고, 여럿이 나눠서 옮겨도 돼요. 들고 있는 물건은 머리 위에 보여요.</li><li><span class="pill">쉬움</span> 1개 · <span class="pill">어려움</span> 1개: 누군가 한 번 해내면 끝나요. 어려운 미션은 순서·기억·짝 맞추기 퍼즐이에요.</li><li>왼쪽 위 막대가 양 팀 전체 진행도예요. 100%가 되면 양이 이겨요.</li></ul>
  <h3>🐺 늑대가 할 수 있는 것</h3><ul><li><b>잡기</b>: 가까이 있는 양을 잡아요. 잡힌 자리에 <b>양털 뭉치</b>가 남아요. 한 번 잡으면 정해진 시간 동안 기다려야 해요.</li><li><b>🌫️ 안개</b>: 15초 동안 양들의 시야를 아주 좁게 만들어요 (45초마다 한 번, 늑대끼리 같이 써요).</li><li>미션을 <b>하는 척</b>할 수 있지만, 늑대가 한 미션은 진행도에 들어가지 않아요. 물건을 들고 다닐 수도 있어요.</li></ul>
  <h3>📣 신고와 🔔 비상 종</h3><ul><li>양털 뭉치를 발견하면 가까이 가서 <b>📣 신고</b>를 눌러요. 바로 모두가 모이는 회의가 열려요.</li><li>광장의 <b>🔔 비상 종</b>은 한 사람당 게임마다 <b>한 번</b> 울릴 수 있어요. 수상한 걸 봤을 때 써요.</li></ul>
  <h3>🗳️ 회의와 투표</h3><ul><li>회의에서는 채팅으로 이야기하고 (같은 방이면 말로 해도 돼요), 시간 안에 늑대 같은 양에게 투표하거나 <b>건너뛰기</b>를 해요.</li><li>가장 많은 표를 받은 한 명이 목장에서 쫓겨나고, 양이었는지 늑대였는지 공개돼요. 동점이거나 건너뛰기가 많으면 아무도 안 나가요.</li><li>모두 투표하면 바로 끝나요. 회의가 끝나면 모두 광장으로 돌아가고, 남아 있던 양털 뭉치는 치워져요.</li></ul>
  <h3>👻 유령 양</h3><ul><li>잡히거나 쫓겨난 사람은 <b>유령</b>이 되어 벽을 지나다니며 볼 수 있어요. 말하거나 투표할 수는 없지만, 양이었다면 <b>미션은 계속 도울 수 있어요</b>.</li></ul>
  <h3>🏆 이기는 방법</h3><ul><li>🐑 양: 미션 6개 모두 끝내기 · 늑대 모두 쫓아내기</li><li>🐺 늑대: 남은 늑대 수가 남은 양 수와 같아지기</li></ul>
  <h3>🗺️ 맵 4가지 (지형과 미션이 달라요)</h3><ul>${(mp?[mp]:MAPS).map(ml).join('')}</ul>${mp?`<p class="hint">지금 맵만 보여요. 로비에서는 4가지 맵을 모두 볼 수 있어요.</p>`:''}
  <h3>💡 알아 두세요</h3><ul><li>방장 휴대폰이 게임을 진행해요. 방장 화면을 끄거나 나가면 게임이 멈춰요. 화면이 꺼지지 않게 해 주세요.</li><li>혼자 맵을 둘러보며 미션을 연습할 수도 있어요 (처음 화면의 🐑 혼자 둘러보기).</li></ul>`}

function hNew(mode,name,mapId){G={mode,room:ROOM,ph:'lobby',map:mapId||0,set:{wolves:1,meet:90,kcd:25},pl:[],bodies:[],done:null,meet:null,ej:null,over:null,fogU:0,fogR:0,cnt:0,phAt:NOW()};
  hAdd(MY,name,true);if(mode==='solo')hStart();else{dirty=true}setInterval(hTick,100);hSend()}
function hAdd(id,name,host){const used=new Set(G.pl.map(p=>p.col));let col=G.pl.length%COLS.length;for(let i=0;i<COLS.length;i++){if(!used.has(i)){col=i;break}}
  const[x,y]=spawnPt(LOBBY,G.pl.length);const p={id,name,col,host:!!host,ready:false,x,y,d:1,mv:0,carry:-1,alive:true,role:'sheep',seen:NOW(),bell:1,kAt:0,left:false,tpk:1,known:false,bot:false,cm:[0,0]};G.pl.push(p);return p}
const act=()=>G.pl.filter(p=>!p.left);
const sheepN=()=>act().filter(p=>p.role==='sheep').length;
function need(i){const t=MAPS[G.map].tasks[i];return t.k==='all'?Math.max(1,sheepN()):t.k==='carry'?3:1}
function cnt(i){const t=MAPS[G.map].tasks[i];return t.k==='all'?act().filter(p=>p.role==='sheep'&&p.cm[i]).length:G.done[i]}
const allDone=()=>MAPS[G.map].tasks.every((t,i)=>cnt(i)>=need(i));
function tp(p,x,y){p.x=x;p.y=y;p.tpk++}
function hStart(){const A=act(),n=A.length,solo=G.mode==='solo';G.ph='reveal';G.phAt=NOW();G.cnt=0;
  const w=solo?0:clamp(G.set.wolves,1,Math.max(1,Math.floor((n-1)/2)));const ids=shuffle(A.map(p=>p.id));
  G.pl=A;G.pl.forEach((p,i)=>{p.role=ids.indexOf(p.id)<w?'wolf':'sheep';p.alive=true;p.known=false;p.carry=-1;p.bell=1;p.kAt=NOW()+5000+G.set.kcd*600;p.ready=false;p.cm=[0,0];const[x,y]=spawnPt(MAPS[G.map],i);tp(p,x,y)});
  G.done=MAPS[G.map].tasks.map(()=>0);G.bodies=[];G.meet=null;G.ej=null;G.over=null;G.fogU=0;G.fogR=NOW()+25000;
  if(solo){G.ph='play'}dirty=true;hSend()}
function hLobby(){const A=act(),n=A.length,mx=Math.max(1,Math.floor((n-1)/2));const okN=n>=G.set.wolves*2+1;
  if(A.length&&A.every(p=>p.ready)&&okN){if(!G.cnt)G.cnt=NOW()+3500}else G.cnt=0;G.maxW=mx;dirty=true}
function hToLobby(){G.ph='lobby';G.pl=G.pl.filter(p=>!p.left);G.pl.forEach((p,i)=>{p.ready=!!p.bot;p.alive=true;p.role='sheep';p.carry=-1;p.known=false;const[x,y]=spawnPt(LOBBY,i);tp(p,x,y)});G.bodies=[];G.meet=null;G.ej=null;G.over=null;G.cnt=0;hLobby();hSend()}
function hMeet(kind,by,who){const M=MAPS[G.map];G.ph='meet';G.phAt=NOW();G.meet={kind,by,who:who||null,endAt:NOW()+G.set.meet*1000,votes:{},chat:[]};G.bodies=[];
  const A=G.pl.filter(p=>!p.left);A.forEach(p=>{if(!p.alive)p.known=true;p.carry=-1});
  const[bx,by2]=M.bell;A.forEach((p,i)=>{const a=i/A.length*Math.PI*2;const[x,y]=free(M,bx+Math.cos(a)*90,by2+40+Math.sin(a)*60);tp(p,x,y)});dirty=true;hSend()}
function hTally(){const c={};Object.values(G.meet.votes).forEach(v=>c[v]=(c[v]||0)+1);let best=null,bn=0,tie=false;for(const k in c){if(c[k]>bn){bn=c[k];best=k;tie=false}else if(c[k]===bn)tie=true}
  const out=best&&best!=='skip'&&!tie?G.pl.find(p=>p.id===best):null;if(out){out.alive=false;out.known=true;out.carry=-1}
  G.ej={id:out?out.id:null,name:out?out.name:'',col:out?out.col:0,wolf:out?out.role==='wolf':false,tally:c,tie,wl:G.pl.filter(p=>!p.left&&p.alive&&p.role==='wolf').length};G.ph='eject';G.phAt=NOW();dirty=true;hSend()}
function hCheck(){if(!['play','meet','eject'].includes(G.ph))return false;const A=act(),wa=A.filter(p=>p.alive&&p.role==='wolf').length,sa=A.filter(p=>p.alive&&p.role==='sheep').length;let win=null,why='';
  if(G.mode!=='solo'){if(wa===0){win='sheep';why='늑대를 모두 찾아냈어요!'}else if(wa>=sa){win='wolf';why='늑대 수가 양 수와 같아졌어요…'}}
  if(!win&&allDone()){win='sheep';why=G.mode==='solo'?'미션 6개를 모두 끝냈어요! 🎉':'미션 6개를 모두 끝냈어요!'}
  if(win){G.ph='over';G.phAt=NOW();G.over={win,why,roles:Object.fromEntries(G.pl.map(p=>[p.id,p.role]))};dirty=true;hSend();return true}return false}
function nearT(p,x,y,r){return dist(p.x,p.y,x,y)<=r}
function hHandle(f,m){if(!G||!m||typeof m!=='object')return;const t=NOW();
  if(m.t==='join'){const name=clip(m.name,10);let p=G.pl.find(x=>x.id===f);
    if(!p){if(G.mode==='solo')return;if(!name)return hTo(f,{t:'err',msg:'이름을 적어 주세요'});if(G.ph!=='lobby')return hTo(f,{t:'err',msg:'게임이 이미 시작했어요. 이번 판이 끝나면 다시 들어와 주세요'});
      if(G.pl.some(x=>x.name===name))return hTo(f,{t:'err',msg:'같은 이름이 있어요. 다르게 적어 주세요'});if(G.pl.length>=15)return hTo(f,{t:'err',msg:'방이 꽉 찼어요 (15명)'});p=hAdd(f,name);hLobby()}
    p.seen=t;p.left=false;dirty=true;hSend();return}
  const p=G.pl.find(x=>x.id===f);if(!p){if(f!==MY)hTo(f,{t:'err',msg:'방에 다시 들어와 주세요',re:1});return}p.seen=t;
  const M=MAPS[G.map],tk=M.tasks[m.i|0];
  switch(m.t){
  case 'pos':if(G.ph==='lobby'||G.ph==='play'){const L=mapOf();p.x=clamp(+m.x||0,0,L.W);p.y=clamp(+m.y||0,0,L.H);p.d=m.d<0?-1:1;p.mv=m.mv?1:0}break;
  case 'ping':hTo(f,{t:'me',v:priv(p)});break;
  case 'hb':break;
  case 'ready':if(G.ph==='lobby'){p.ready=!!m.v;hLobby()}break;
  case 'col':if(G.ph==='lobby'){const c=m.c|0;if(c>=0&&c<COLS.length&&!G.pl.some(x=>x!==p&&x.col===c)){p.col=c;dirty=true}}break;
  case 'set':if(p.host&&G.ph==='lobby'){if(m.map!=null)G.map=clamp(m.map|0,0,3);if(m.wolves!=null)G.set.wolves=clamp(m.wolves|0,1,3);if([60,90,120,150].includes(m.meet))G.set.meet=m.meet;if([15,20,25,30,40].includes(m.kcd))G.set.kcd=m.kcd;if(m.map!=null||m.wolves!=null)G.pl.forEach(x=>{x.ready=!!x.bot});hLobby()}break;
  case 'kick':if(p.host&&G.ph==='lobby'&&m.id!==MY){const v=G.pl.find(x=>x.id===m.id);if(v){hTo(v.id,{t:'err',msg:'방장이 방에서 내보냈어요',kick:1});G.pl=G.pl.filter(x=>x!==v);hLobby()}}break;
  case 'done':if(G.ph==='play'&&tk&&tk.k!=='carry'&&p.role==='sheep'&&nearT(p,tk.x,tk.y,190)){if(tk.k==='all')p.cm[m.i|0]=1;else G.done[m.i|0]=1;dirty=true;hCheck()}break;
  case 'pick':if(G.ph==='play'&&tk&&tk.k==='carry'&&p.carry<0&&cnt(m.i|0)<need(m.i|0)&&nearT(p,tk.a[0],tk.a[1],190)){p.carry=m.i|0;dirty=true}break;
  case 'drop':if(G.ph==='play'&&tk&&tk.k==='carry'&&p.carry===(m.i|0)&&nearT(p,tk.b[0],tk.b[1],190)){p.carry=-1;if(p.role==='sheep'&&G.done[m.i|0]<need(m.i|0))G.done[m.i|0]++;dirty=true;hCheck()}break;
  case 'kill':{const v=G.pl.find(x=>x.id===m.id);if(G.ph==='play'&&p.alive&&p.role==='wolf'&&t>=p.kAt&&v&&v.alive&&!v.left&&v.role==='sheep'&&dist(p.x,p.y,v.x,v.y)<=120){v.alive=false;v.carry=-1;G.bodies.push({id:v.id,x:Math.round(v.x),y:Math.round(v.y),col:v.col});p.kAt=t+G.set.kcd*1000;dirty=true;hTo(v.id,{t:'me',v:priv(v)});hCheck()}break}
  case 'report':{const b=G.bodies.find(x=>x.id===m.id);if(G.ph==='play'&&p.alive&&b&&dist(p.x,p.y,b.x,b.y)<=170)hMeet('body',p.id,b.id);break}
  case 'bell':{const[bx,by]=M.bell;if(G.ph==='play'&&p.alive&&p.bell>0&&dist(p.x,p.y,bx,by)<=170){p.bell--;hMeet('bell',p.id)}break}
  case 'vote':if(G.ph==='meet'&&p.alive&&!G.meet.votes[f]){const v=m.v==='skip'?'skip':String(m.v);if(v==='skip'||G.pl.some(x=>x.id===v&&x.alive&&!x.left)){G.meet.votes[f]=v;dirty=true;if(act().filter(x=>x.alive).every(x=>G.meet.votes[x.id]))hTally()}}break;
  case 'chat':if(G.ph==='meet'&&p.alive){const x=clip(m.x,80);if(x){G.meet.chat.push([f,x]);G.meet.chat=G.meet.chat.slice(-50);dirty=true}}break;
  case 'fog':if(G.ph==='play'&&p.alive&&p.role==='wolf'&&t>=G.fogR){G.fogU=t+15000;G.fogR=t+45000;dirty=true}break;
  case 'again':if(p.host&&G.ph==='over')hToLobby();break;
  case 'leave':if(f!==MY){if(G.ph==='lobby'){G.pl=G.pl.filter(x=>x!==p);hLobby()}else{p.left=true;p.alive=false;p.known=true;p.carry=-1;dirty=true;hCheck()}}break;
  }}
function pub(){const t=NOW(),ov=G.ph==='over';return{now:t,ph:G.ph,mode:G.mode,room:G.room,map:G.map,set:G.set,cnt:G.cnt,phAt:G.phAt,maxW:G.maxW||1,
  pl:G.pl.map(p=>({id:p.id,name:p.name,col:p.col,host:p.host?1:0,ready:p.ready?1:0,dead:(p.known||ov)&&!p.alive?1:0,left:p.left?1:0})),
  bodies:G.ph==='play'?G.bodies:[],prog:G.done&&G.ph!=='lobby'?MAPS[G.map].tasks.map((x,i)=>[Math.min(cnt(i),need(i)),need(i)]):null,
  meet:G.ph==='meet'?{kind:G.meet.kind,by:G.meet.by,who:G.meet.who,endAt:G.meet.endAt,voted:Object.keys(G.meet.votes),chat:G.meet.chat}:null,
  ej:G.ph==='eject'?G.ej:null,over:ov?G.over:null,fogU:G.fogU>t?G.fogU:0,nW:G.ph==='lobby'?0:G.pl.filter(p=>p.role==='wolf').length}}
function priv(p){return{role:p.role,mates:p.role==='wolf'?G.pl.filter(x=>x.role==='wolf'&&x.id!==p.id).map(x=>x.id):[],dead:!p.alive,cm:p.cm,carry:p.carry,kAt:p.kAt,fogR:G.fogR,bell:p.bell,tp:{x:Math.round(p.x),y:Math.round(p.y),k:p.tpk}}}
function hSend(){const s=pub();onS(s);hPubAll('s',{t:'s',v:s},1);G.pl.forEach(p=>{if(!p.left||p.id===MY)hTo(p.id,{t:'me',v:priv(p)})});dirty=false;lastS=NOW()}
function hTick(){if(!G)return;const t=NOW();
  G.pl.forEach(p=>{if(!p.bot)return;p.seen=t;if(G.ph!=='lobby'&&G.ph!=='play')return;if(!p.alive)return;const L=mapOf();if(!p.bt||t>p.bt){p.bt=t+800+rnd(2000);p.ba=rnd(628)/100;p.bm=rnd(4)>0}if(p.bm){const[nx,ny]=moveTry(L,p.x,p.y,Math.cos(p.ba)*18,Math.sin(p.ba)*18,false);if(nx===p.x&&ny===p.y)p.bt=0;p.d=Math.cos(p.ba)<0?-1:1;p.x=nx;p.y=ny;p.mv=1}else p.mv=0});
  if(t-lastW>=100){const arr=G.pl.filter(p=>!p.left&&(G.ph==='lobby'||p.alive)).map(p=>[p.id,Math.round(p.x),Math.round(p.y),p.d,p.mv,p.carry]);const k=JSON.stringify(arr);if(k!==lastWK||t-lastW>1000){lastWK=k;lastW=t;const msg={t:'w',p:arr};onW(msg);hPubAll('w',msg,0)}}
  if(G.ph==='lobby'&&G.cnt&&t>=G.cnt)hStart();
  else if(G.ph==='reveal'&&t-G.phAt>5000){G.ph='play';G.phAt=t;dirty=true}
  else if(G.ph==='meet'&&t>=G.meet.endAt)hTally();
  else if(G.ph==='eject'&&t-G.phAt>6500){if(!hCheck()){G.ph='play';G.phAt=t;G.pl.forEach(p=>{if(p.role==='wolf')p.kAt=t+G.set.kcd*1000});G.fogR=Math.max(G.fogR,t+15000);dirty=true}}
  if(t-lastChk>1000&&G.mode!=='solo'){lastChk=t;G.pl.slice().forEach(p=>{if(p.id===MY||p.bot||p.left)return;if(t-p.seen>(G.ph==='lobby'?20000:60000)){if(G.ph==='lobby'){G.pl=G.pl.filter(x=>x!==p);hLobby()}else{p.left=true;p.alive=false;p.known=true;p.carry=-1;dirty=true;hCheck()}}})}
  if(dirty||t-lastS>2000)hSend()}

async function joinRoom(name){try{MY=sessionStorage.getItem('sh-id-'+ROOM)}catch(_){}if(!MY){MY='p'+Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('sh-id-'+ROOM,MY)}catch(_){}}

  for(const url of BROKERS){const cl=await mqttOpen(url,7000);if(!cl)continue;let heard=false;const b=base();
    const sub=()=>{cl.subscribe([b+'/s',b+'/w',b+'/c/'+MY],{qos:1})};sub();cl.on('connect',()=>{sub();if(S)toHost({t:'join',name})});

    CL.cl=cl;toHost({t:'join',name});for(let i=0;i<26&&!heard;i++){await new Promise(r=>setTimeout(r,300));if(i===10)toHost({t:'join',name})}
    if(heard){setInterval(()=>toHost({t:'hb'},0),4000);setInterval(()=>{if(S&&NOW()-lastHear>12000){toast('방장과 연결이 끊긴 것 같아요… 다시 연결하는 중',3000);toHost({t:'join',name})}},5000);return}try{cl.end(true)}catch(_){}CL.cl=null}
