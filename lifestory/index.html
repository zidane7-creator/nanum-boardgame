<meta name="description" content="나이에 따라 내 신앙이 어땠는지 점을 찍으면 부드러운 곡선 그래프로 그려 주는 신앙그래프. 셀모임·소그룹 나눔에 전체화면으로 보여 주세요.">
<meta name="keywords" content="신앙그래프, 신앙 그래프, 신앙 간증, 셀모임 나눔, 소그룹 나눔, 인생 그래프">

<style>
:root{--ink:#3b2a20;--cream:#fffaf0;--accent:#e8503a;--gold:#f5b82e;--green:#5aa957;--up:#3f9a45;--down:#d2452f}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;color:inherit;border:2px solid var(--ink);background:var(--cream);border-radius:16px;padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button.pri{background:var(--accent);color:#fff}button.go{background:var(--green);color:#fff}
button.sm{padding:4px 10px;font-size:14px;border-radius:12px;box-shadow:0 2px 0 var(--ink)}
input,select{font:inherit;color:inherit;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:rgba(255,255,255,.92);border-bottom:4px solid var(--gold)}
.top a{color:var(--ink);text-decoration:none;font-size:15px;border:2px solid var(--ink);border-radius:14px;padding:3px 10px;background:var(--cream)}
.top .ttl{flex:1;font-size:19px}
main{max-width:1150px;margin:0 auto;padding:16px 12px 70px}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:22px;padding:16px;margin-bottom:16px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
h1{font-weight:normal;text-align:center;font-size:clamp(30px,7vw,44px);margin:6px 0 2px}
h2{font-weight:normal;margin:0 0 10px;font-size:21px}
.sub{text-align:center;margin:0 0 14px;opacity:.8}
.lay{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.lay{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;opacity:.7}
.gtitle{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.gtitle b{flex:1;font-size:22px}
#graph{display:block;width:100%;height:auto;background:#fff;border:2px solid #e2cfb2;border-radius:16px;touch-action:manipulation;cursor:crosshair}
#graph .ax{stroke:#3b2a20;stroke-width:2.5}
#graph .grid{stroke:#eadbc4;stroke-width:1}
#graph .zero{stroke:#b9a68c;stroke-width:2;stroke-dasharray:6 6}
#graph .tk{font-size:14px;fill:#7a6656;font-family:Jua,sans-serif}
#graph .axl{font-size:16px;fill:#3b2a20;font-family:Jua,sans-serif}
#graph .curve{fill:none;stroke:#3b2a20;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
#graph .pt{stroke:#3b2a20;stroke-width:2.5;cursor:pointer}
#graph .lbl{font-size:15px;font-family:Jua,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
#graph .age{font-size:13px;fill:#7a6656;font-family:Jua,sans-serif}
.f{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.f input[type=range]{width:100%;accent-color:var(--accent);border:0;padding:0}
.pv{font-size:22px;min-width:70px;text-align:right}
.pv.up{color:var(--up)}.pv.down{color:var(--down)}
.list{display:flex;flex-direction:column;gap:6px;max-height:380px;overflow:auto;margin-top:10px}
.it{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #e2cfb2;border-radius:12px;padding:6px 10px}
.it.on{border-color:var(--accent)}
.it .ag{width:46px;font-size:18px}
.it .fv{width:58px;text-align:right}
.it .nt{flex:1;min-width:0;font-size:14px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it button{padding:2px 8px;font-size:13px;box-shadow:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) scale(.9);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-size:17px;opacity:0;transition:.25s;z-index:90;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
/* 전체화면: 그래프만 크게 */
.fs-on .top,.fs-on .side,.fs-on h1,.fs-on .sub,.fs-on .hide-fs{display:none!important}
.fs-on main{max-width:none;padding:12px}
.fs-on .lay{grid-template-columns:1fr}
.fs-on #graph{max-height:calc(100vh - 90px)}
.fs-on .gcard{min-height:calc(100vh - 24px);display:flex;flex-direction:column;justify-content:center}
</style>
</head><body>
<div class="top"><a href="../">← 목장</a><span class="ttl">📈 신앙그래프</span></div>
<main>
  <h1 class="sc-sky">신앙그래프</h1>
  <p class="sub sc-sky">나이마다 내 신앙이 어땠는지 점을 찍어 보세요. 점들을 부드러운 곡선으로 이어 줘요.</p>
  <div class="lay">
    <div class="card gcard">
      <div class="gtitle"><b id="gName">나의 신앙그래프</b><button class="sm" id="fs">⛶ 전체화면</button></div>
      <svg id="graph" viewBox="0 0 900 560" aria-label="신앙 그래프"></svg>
      <p class="hint hide-fs" style="margin:6px 0 0;text-align:center">그래프를 누르면 그 나이·높이가 아래 입력칸에 들어가요 · 점을 누르면 고칠 수 있어요</p>
    </div>
    <div class="side">
      <div class="card">
        <h2>👤 나</h2>
        <div class="f"><span>이름</span><input id="nm" maxlength="12" placeholder="예) 홍길동 (안 적어도 돼요)">
          <span>지금 나이</span><div class="row"><input id="now" type="number" min="1" max="120" inputmode="numeric" style="width:90px"><span>살</span></div></div>
        <div class="row" style="margin-top:10px"><select id="who" aria-label="저장된 신앙그래프"></select><button class="sm" id="newS">＋ 새 사람</button><button class="sm" id="delS">삭제</button></div>
      </div>
      <div class="card">
        <h2 id="fTitle">✏️ 점 찍기</h2>
        <div class="f"><span>몇 살 때</span><div class="row"><input id="age" type="number" min="0" inputmode="numeric" style="width:90px"><span>살</span></div>
          <span>신앙</span><div class="row" style="flex-wrap:nowrap"><input id="fv" type="range" min="-100" max="100" step="5" value="0"><span class="pv" id="pv">0%</span></div>
          <span>내용</span><input id="nt" maxlength="40" placeholder="예) 수련회에서 주님을 만남"></div>
        <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="sm" id="cancel" hidden>취소</button><button class="pri" id="add">＋ 점 추가</button></div>
        <div class="list" id="list"></div>
      </div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tt;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),1800)}

/* ---------- 저장: 이 기기에 여러 사람 것을 보관 ---------- */
let DB={cur:0,list:[{name:"",now:null,pts:[]}]};
try{const o=JSON.parse(localStorage.getItem("lifestory")||"null");if(o&&Array.isArray(o.list)&&o.list.length)DB=o}catch(e){}
const save=()=>{try{localStorage.setItem("lifestory",JSON.stringify(DB))}catch(e){}};
const S=()=>DB.list[DB.cur]||(DB.cur=0,DB.list[0]);
let editIdx=-1;

function drawWho(){$("who").innerHTML=DB.list.map((s,i)=>`<option value="${i}" ${i===DB.cur?"selected":""}>${esc(s.name||("이름 없음 "+(i+1)))}${s.now?" · "+s.now+"살":""}</option>`).join("");
  $("nm").value=S().name||"";$("now").value=S().now||"";$("gName").textContent=(S().name?S().name+"의 ":"나의 ")+"신앙그래프"}
$("who").onchange=()=>{DB.cur=+$("who").value;editIdx=-1;save();drawAll()};
$("newS").onclick=()=>{DB.list.push({name:"",now:null,pts:[]});DB.cur=DB.list.length-1;editIdx=-1;save();drawAll();$("nm").focus()};
$("delS").onclick=()=>{if(!confirm("이 사람의 신앙그래프를 지울까요?"))return;DB.list.splice(DB.cur,1);if(!DB.list.length)DB.list=[{name:"",now:null,pts:[]}];DB.cur=0;editIdx=-1;save();drawAll()};
$("nm").oninput=()=>{S().name=$("nm").value.trim().slice(0,12);save();$("gName").textContent=(S().name?S().name+"의 ":"나의 ")+"신앙그래프";drawWhoOpts()};
function drawWhoOpts(){const o=$("who").options[DB.cur];if(o)o.textContent=(S().name||("이름 없음 "+(DB.cur+1)))+(S().now?" · "+S().now+"살":"")}
$("now").oninput=()=>{const v=Math.round(+$("now").value);S().now=v>0&&v<=120?v:null;save();drawWhoOpts();drawGraph()};

/* ---------- 입력 ---------- */
const fvText=v=>(v>0?"+":"")+v+"%";
function showFv(){const v=+$("fv").value;$("pv").textContent=fvText(v);$("pv").className="pv"+(v>0?" up":v<0?" down":"")}
$("fv").oninput=showFv;
function resetForm(){editIdx=-1;$("age").value="";$("fv").value=0;$("nt").value="";showFv();$("add").textContent="＋ 점 추가";$("cancel").hidden=true;$("fTitle").textContent="✏️ 점 찍기";drawList();drawGraph()}
$("cancel").onclick=resetForm;
$("add").onclick=()=>{const s=S();if(!s.now){toast("먼저 지금 나이를 적어 주세요");$("now").focus();return}
  const age=+$("age").value;if($("age").value===""||!(age>=0&&age<=s.now)){toast(`0살부터 ${s.now}살 사이로 적어 주세요`);$("age").focus();return}
  const p={age:Math.round(age*10)/10,fv:Math.max(-100,Math.min(100,+$("fv").value)),note:$("nt").value.trim().slice(0,40)};
  if(editIdx>=0)s.pts[editIdx]=p;else{const same=s.pts.findIndex(q=>q.age===p.age);if(same>=0){if(!confirm(p.age+"살에 이미 점이 있어요. 바꿀까요?"))return;s.pts[same]=p}else s.pts.push(p)}
  s.pts.sort((a,b)=>a.age-b.age);save();toast(editIdx>=0?"고쳤어요":"점을 찍었어요");resetForm();$("age").focus()};
["age","nt"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)$("add").click()}));
function edit(i){const p=S().pts[i];editIdx=i;$("age").value=p.age;$("fv").value=p.fv;$("nt").value=p.note||"";showFv();$("add").textContent="✔ 고치기";$("cancel").hidden=false;$("fTitle").textContent="✏️ "+p.age+"살 점 고치기";drawList();drawGraph();$("nt").focus()}
function drawList(){const s=S();$("list").innerHTML=s.pts.length?s.pts.map((p,i)=>`<div class="it${i===editIdx?" on":""}"><span class="ag">${p.age}살</span><span class="fv" style="color:${p.fv>0?"var(--up)":p.fv<0?"var(--down)":"inherit"}">${fvText(p.fv)}</span><span class="nt">${esc(p.note||"")}</span><button data-e="${i}">고치기</button><button data-d="${i}">✕</button></div>`).join(""):'<p class="hint" style="text-align:center">아직 찍은 점이 없어요</p>';
  $("list").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(+b.dataset.e));
  $("list").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S().pts.splice(+b.dataset.d,1);save();resetForm()})}

/* ---------- 그래프 ---------- */
const W=900,H=560,ML=70,MR=30,MT=30,MB=60,GW=W-ML-MR,GH=H-MT-MB;
let XMAX=10;
const X=a=>ML+a/XMAX*GW,Y=v=>MT+(100-v)/200*GH;
/* 부드러운 곡선: 점과 점 사이를 넘치지 않게 이어 주는 단조 3차 곡선 */
function smooth(pts){const n=pts.length;if(n<2)return"";const x=pts.map(p=>X(p.age)),y=pts.map(p=>Y(p.fv));
  if(n===2)return`M${x[0]},${y[0]}L${x[1]},${y[1]}`;
  const d=[],m=[];for(let i=0;i<n-1;i++){const dx=x[i+1]-x[i];d.push(dx?(y[i+1]-y[i])/dx:0)}
  m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=0;m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],h=a*a+b*b;if(h>9){const t=3/Math.sqrt(h);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}
  let s=`M${x[0].toFixed(1)},${y[0].toFixed(1)}`;for(let i=0;i<n-1;i++){const dx=(x[i+1]-x[i])/3;s+=`C${(x[i]+dx).toFixed(1)},${(y[i]+m[i]*dx).toFixed(1)} ${(x[i+1]-dx).toFixed(1)},${(y[i+1]-m[i+1]*dx).toFixed(1)} ${x[i+1].toFixed(1)},${y[i+1].toFixed(1)}`}return s}
function drawGraph(){const s=S(),pts=s.pts;XMAX=Math.max(s.now||0,...pts.map(p=>p.age),10);
  const step=XMAX<=20?2:XMAX<=50?5:10;let h=`<defs><linearGradient id="gUp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f9a45" stop-opacity=".22"/><stop offset="1" stop-color="#3f9a45" stop-opacity="0"/></linearGradient>
    <linearGradient id="gDn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2452f" stop-opacity="0"/><stop offset="1" stop-color="#d2452f" stop-opacity=".22"/></linearGradient>
    <clipPath id="cUp"><rect x="${ML}" y="${MT}" width="${GW}" height="${GH/2}"/></clipPath><clipPath id="cDn"><rect x="${ML}" y="${MT+GH/2}" width="${GW}" height="${GH/2}"/></clipPath></defs>`;
  for(let v=-100;v<=100;v+=50)h+=`<line class="grid" x1="${ML}" x2="${ML+GW}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tk" x="${ML-10}" y="${Y(v)+5}" text-anchor="end">${v>0?"+":""}${v}%</text>`;
  for(let a=0;a<=XMAX;a+=step)h+=`<line class="grid" x1="${X(a)}" x2="${X(a)}" y1="${MT}" y2="${MT+GH}"/><line x1="${X(a)}" x2="${X(a)}" y1="${Y(0)-5}" y2="${Y(0)+5}" stroke="#3b2a20" stroke-width="2"/><text class="tk" x="${X(a)}" y="${MT+GH+22}" text-anchor="middle">${a}</text>`;
  h+=`<line class="ax" x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT+GH}"/><line class="ax" x1="${ML}" y1="${Y(0)}" x2="${ML+GW}" y2="${Y(0)}"/>`;
  h+=`<text class="axl" x="${ML+GW}" y="${H-10}" text-anchor="end">나이 (살) →</text><text class="axl" x="16" y="${MT+GH/2}" text-anchor="middle" transform="rotate(-90 16 ${MT+GH/2})">↑ 신앙</text>`;
  if(s.now)h+=`<line x1="${X(s.now)}" x2="${X(s.now)}" y1="${MT}" y2="${MT+GH}" stroke="#f5b82e" stroke-width="3" stroke-dasharray="4 5"/><text class="tk" x="${X(s.now)}" y="${MT-10}" text-anchor="middle" style="fill:#c98a00">지금 ${s.now}살</text>`;
  if(pts.length>=2){const c=smooth(pts),z=Y(0);const area=c+`L${X(pts[pts.length-1].age)},${z}L${X(pts[0].age)},${z}Z`;
    h+=`<path d="${area}" fill="url(#gUp)" clip-path="url(#cUp)"/><path d="${area}" fill="url(#gDn)" clip-path="url(#cDn)"/><path class="curve" d="${c}"/>`}
  pts.forEach((p,i)=>{const x=X(p.age),y=Y(p.fv),col=p.fv>0?"#3f9a45":p.fv<0?"#d2452f":"#f5b82e",up=p.fv>=0;
    h+=`<circle class="pt" data-i="${i}" cx="${x}" cy="${y}" r="${i===editIdx?11:8}" fill="${col}"/>`;
    if(p.note){const ly=up?y-18-(i%2)*18:y+28+(i%2)*18,anchor=x<ML+80?"start":x>ML+GW-80?"end":"middle";
      h+=`<text class="lbl" x="${x}" y="${ly}" text-anchor="${anchor}" fill="${col}">${esc(p.note)}</text>`}
    h+=`<text class="age" x="${x}" y="${up?y+24:y-14}" text-anchor="middle">${p.age}살</text>`});
  if(!pts.length)h+=`<text class="axl" x="${ML+GW/2}" y="${MT+GH/2-14}" text-anchor="middle" style="fill:#a08b75">${s.now?"오른쪽에서 몇 살 때 신앙이 어땠는지 점을 찍어 보세요":"먼저 지금 나이를 적어 주세요"}</text>`;
  $("graph").innerHTML=h;
  $("graph").querySelectorAll(".pt").forEach(c=>c.addEventListener("click",e=>{e.stopPropagation();edit(+c.dataset.i)}))}
/* 그래프를 누르면 그 자리의 나이·신앙을 입력칸에 */
$("graph").addEventListener("click",e=>{const s=S();if(!s.now)return;const r=$("graph").getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
  const gx=(e.clientX-r.left)*sx,gy=(e.clientY-r.top)*sy;if(gx<ML||gx>ML+GW||gy<MT||gy>MT+GH)return;
  const age=Math.round((gx-ML)/GW*XMAX),fv=Math.round((100-(gy-MT)/GH*200)/5)*5;if(age>s.now)return;
  if(editIdx<0){$("age").value=age;$("fv").value=fv;showFv();$("nt").focus();toast(age+"살 · "+fvText(fv)+" — 내용을 적고 추가하세요")}});

/* ---------- 전체화면 ---------- */
function fsToggle(){const d=document;if(!d.fullscreenElement&&!d.webkitFullscreenElement){const el=d.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);d.body.classList.add("fs-on")}
  else{(d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d);d.body.classList.remove("fs-on")}setTimeout(fsLabel,300)}
function fsLabel(){const on=!!(document.fullscreenElement||document.webkitFullscreenElement);document.body.classList.toggle("fs-on",on);$("fs").textContent=on?"✕ 전체화면 끝":"⛶ 전체화면"}
