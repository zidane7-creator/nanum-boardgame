    reply(from,{t:'state',v:viewFor(from)});broadcast();return}
  const p=P(from);if(!p)return reply(from,{t:'err',msg:'방에 다시 들어와 주세요'});
  if(m.t==='ping')return reply(from,{t:'state',v:viewFor(from)});act(p,m)}
function act(p,m){const R=G.r,ph=G.phase;if(!R)return;
  if(m.t==='say'&&ph==='talk'&&R.talkMode==='on'&&R.order[R.ti]===p.id){const text=clip(m.text,80);if(!text)return;R.talks.push({pid:p.id,name:p.name,text,rd:R.rd});nextTurn();return}
  if(m.t==='vote'&&ph==='vote'){if(m.target===p.id||!R.cands.includes(m.target))return;R.votes[p.id]=m.target;
    if(G.players.every(x=>R.votes[x.id]))setTimeout(()=>{if(G.phase==='vote')endVote()},1200);broadcast();return}
  if(m.t==='guess'&&ph==='guess'&&p.id===R.liar){R.guess=clip(m.text,30);finish(norm(R.guess)===norm(R.word)?'liar':'others',`라이어가 ‘${R.guess}’(이)라고 답했어요`);return}}
/* --- 진행 --- */
function startRound(){if(G.players.length<3){toast('3명 이상이 들어와야 해요');return}
  const s=G.set,cat=s.cat==='랜덤'?Object.keys(W)[rnd(8)]:s.cat,grp=W[cat][rnd(10)],word=grp[rnd(4)];const fakes=grp.filter(w=>w!==word);
  const liar=G.players[rnd(G.players.length)].id;
  G.r={cat,mode:s.mode,word,fake:fakes[rnd(fakes.length)],liar,talks:[],order:shuffle(G.players.map(p=>p.id)),ti:0,rd:1,talkMode:s.talk,votes:{},cands:null,accused:null,guess:null,result:null};
  G.round++;G.phase='talk';broadcast()}
function nextTurn(){const R=G.r;R.ti++;if(R.ti>=R.order.length){if(R.rd<G.set.rounds){R.rd++;R.ti=0}else{startVote();return}}broadcast()}
function startVote(cands){const R=G.r;R.votes={};R.cands=cands||G.players.map(p=>p.id);G.phase='vote';broadcast()}
function endVote(){const R=G.r,c={};Object.values(R.votes).forEach(x=>c[x]=(c[x]||0)+1);const max=Math.max(0,...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===max);
  if(!max){toast('아무도 지목하지 않았어요');return}
  if(top.length>1&&R.cands.length>top.length){toast(`동점! ${top.map(nm).join(', ')} 중에서 다시 지목해요`,3500);startVote(top);return}
  R.accused=top.length>1?top[rnd(top.length)]:top[0];G.phase='reveal';broadcast();
  setTimeout(()=>{if(G.phase!=='reveal')return;if(R.accused!==R.liar)finish('liar',`${nm(R.accused)}님은 라이어가 아니었어요!`);else{G.phase='guess';broadcast()}},4500)}
function finish(w,why){const R=G.r;R.result={w,why};G.score[w]=(G.score[w]||0)+1;G.phase='end';broadcast()}

/* =================== 화면 =================== */
let LV=null;
function render(){if(isHost&&G){LV=viewFor(MY);vGame(true);return}if(CL.joined&&LV){vGame(false);return}vEntry()}
function vEntry(){if(ROOM&&!HOSTING){app.innerHTML=`<div class="card center"><div class="big-ico">🤥</div><h2>라이어게임 방 ${esc(ROOM)}</h2><p>내 이름을 적고 들어와요</p><input id="jName" placeholder="내 이름" maxlength="10" style="font-size:22px;text-align:center;width:100%;max-width:300px" value="${esc(CL.name||'')}"><div class="row" style="justify-content:center;margin-top:10px"><button class="pri big" id="jGo">들어가기</button></div><p class="hint" id="jSt"></p></div>`;
    $('#jGo').onclick=()=>{const n=clip($('#jName').value,10);if(!n){toast('이름을 적어 주세요');return}joinRoom(n)};$('#jName').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)$('#jGo').click()};return}
  app.innerHTML=`<div class="card center"><div class="big-ico">🤥</div><h1 style="margin:0">라이어게임</h1><p>모두 같은 제시어를 받는데 <b>한 명만</b> 달라요. 이야기를 나누며 라이어를 찾아요!</p></div>
  <div class="card"><h2>🏠 방 만들기</h2><div class="row"><input id="hName" placeholder="내 이름" maxlength="10" style="flex:1;min-width:160px"><button class="pri" id="mk">방 만들기</button></div><p class="hint">방을 만든 사람(호스트)도 함께 게임해요. 다른 사람은 QR이나 링크로 초대해요.</p></div>
  <div class="card"><h2>🚪 방에 들어가기</h2><div class="row"><input id="code" placeholder="방 코드 4자리" maxlength="6" style="text-transform:uppercase;width:150px"><button id="goCode">들어가기</button></div></div>`;
  $('#mk').onclick=()=>{const n=clip($('#hName').value,10);if(!n){toast('이름을 적어 주세요');$('#hName').focus();return}newGame(n)};
  $('#goCode').onclick=()=>{const c=$('#code').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c)location.href='?room='+c}}
const plist=(v,o)=>`<div class="pl">${v.players.map(p=>{const pick=o&&o.pick&&o.pick(p),cnt=o&&o.cnt?o.cnt(p):0;return `<div class="pp ${pick?'pick':''} ${o&&o.mine===p.id?'mine':''} ${o&&o.turn===p.id?'turn':''} ${o&&o.liar===p.id?'liar':''}" ${pick?`data-pick="${p.id}"`:''}>${esc(p.name)}${o&&o.tag?o.tag(p):''}${cnt?`<span class="cnt">${cnt}</span>`:''}</div>`}).join('')}</div>`;
function wordCard(v){const c=v.card;if(!c)return'';return c.liar?`<div class="word liar"><div class="hint" style="color:#ffd">분야: ${CAT_ICO[v.cat]} ${esc(v.cat)}</div><div style="font-size:48px">🤥</div><div class="w">당신은 라이어!</div><div>들키지 않게 제시어를 아는 척해요</div></div>`
  :`<div class="word"><div class="hint" style="color:#dde">분야: ${CAT_ICO[v.cat]} ${esc(v.cat)}</div><div style="font-size:14px;margin-top:4px">제시어</div><div class="w">${esc(c.word)}</div>${v.mode==='fool'?'<div style="font-size:14px;opacity:.85">혹시 나만 다른 단어일 수도…? 🤔</div>':''}</div>`}
function vGame(host){const v=LV,ph=v.ph;let h='';
  if(ph==='lobby'){const url=location.origin+location.pathname+'?room='+v.room;let qr='';try{const q=qrcode(0,'M');q.addData(url);q.make();qr=q.createSvgTag(5,2)}catch(_){}
    h+=`<div class="card"><div class="row"><h2 style="margin:0">🙋 대기실 · 방 ${esc(v.room)}</h2><span class="sp"></span>${host?'<span class="badge" id="netSt">연결 준비 중…</span>':''}</div>
     ${host?`<div class="row" style="align-items:flex-start;margin-top:8px"><div class="qr">${qr}</div><div style="flex:1;min-width:200px"><p style="margin:0">QR을 찍거나 링크로 들어와서 이름을 적으면 돼요.</p><input readonly value="${esc(url)}" style="width:100%;font-size:13px;margin-top:6px" onclick="this.select()"><div class="row" style="margin-top:6px"><button class="sm" data-a="copy">🔗 링크 복사</button></div></div></div>`:'<p>호스트가 시작하기를 기다리고 있어요…</p>'}
     <h3 style="margin:12px 0 6px">들어온 사람 ${v.players.length}명</h3>${plist(v,{})}</div>`;
    if(G&&G.round)h+=`<div class="card center"><b class="j" style="font-size:19px">🏆 지금까지 · 라이어 ${v.score.liar||0}승 · 시민 ${v.score.others||0}승</b></div>`;
    if(host){const s=G.set;h+=`<div class="card"><h2>⚙️ 게임 설정</h2>
      <div class="pick"><button class="${s.mode==='liar'?'on':''}" data-set="mode" data-v="liar"><b>🤥 라이어게임</b><span>라이어는 자기가 라이어인 걸 알아요 (제시어를 못 받아요)</span></button><button class="${s.mode==='fool'?'on':''}" data-set="mode" data-v="fool"><b>🤪 바보라이어게임</b><span>라이어만 비슷한 다른 단어를 받아서, 자기가 라이어인 줄 몰라요</span></button></div>
      <h3 style="margin:14px 0 6px">단어 분야</h3><div class="cats">${[...Object.keys(W),'랜덤'].map(c=>`<button class="${s.cat===c?'on':''}" data-set="cat" data-v="${c}">${CAT_ICO[c]||'🎲'} ${c}</button>`).join('')}</div>
      <h3 style="margin:14px 0 6px">제시어 설명</h3><div class="pick"><button class="${s.talk==='off'?'on':''}" data-set="talk" data-v="off"><b>🗣️ 오프라인</b><span>모여서 말로 한 명씩 설명해요</span></button><button class="${s.talk==='on'?'on':''}" data-set="talk" data-v="on"><b>💬 온라인</b><span>순서대로 한 명씩 화면에 설명을 적어요</span></button></div>
      ${s.talk==='on'?`<div class="row" style="margin-top:8px"><span>몇 바퀴 돌까요?</span>${[1,2].map(n=>`<button class="sm ${s.rounds==n?'go':''}" data-set="rounds" data-v="${n}">${n}바퀴</button>`).join('')}</div>`:''}
      <div class="row" style="justify-content:center;margin-top:14px"><button class="pri big" data-a="start" ${v.players.length<3?'disabled':''}>🎮 게임 시작</button></div>${v.players.length<3?'<p class="hint center">3명 이상이 들어와야 해요</p>':''}</div>`}
    app.innerHTML=h;bind();return}
  h+=`<div class="row" style="margin-bottom:8px"><span class="badge">${v.mode==='fool'?'🤪 바보라이어':'🤥 라이어게임'}</span><span class="badge">${CAT_ICO[v.cat]} ${esc(v.cat)}</span><span class="sp"></span><span class="badge">👤 ${esc(v.me.name)}</span></div>`;
  if(ph==='talk'){h+=wordCard(v);
    if(v.talkMode==='on'){const myTurn=v.turn===v.me.id;
      h+=`<div class="card" style="margin-top:14px"><h2>💬 제시어 설명 · ${v.round}/${v.rounds}바퀴</h2>${plist(v,{turn:v.turn,tag:p=>{const i=v.order.indexOf(p.id);return `<span class="tag">${i+1}번째</span>`}})}
       <div class="talk" style="margin-top:10px">${v.talks.map(t=>`<div class="t"><b>${esc(t.name)}</b> ${t.rd>1?'<span class="hint">(2바퀴)</span>':''} ${esc(t.text)}</div>`).join('')||'<div class="hint">아직 설명이 없어요</div>'}</div>
       ${myTurn?`<div class="row" style="margin-top:10px"><input id="say" placeholder="제시어를 설명하는 한마디 (너무 쉽게 말하면 라이어가 알아채요!)" maxlength="80" style="flex:1"><button class="pri" data-a="say">말하기</button></div>`:`<p class="center" style="margin-top:10px">🙋 <b>${esc((v.players.find(p=>p.id===v.turn)||{}).name)}</b>님 차례예요</p>`}
       ${host?'<div class="row" style="margin-top:6px"><button class="sm" data-a="skip">⏭ 이 사람 건너뛰기</button><button class="sm" data-a="toVote">👉 바로 지목하기</button></div>':''}</div>`}
    else h+=`<div class="card center" style="margin-top:14px"><h2>🗣️ 돌아가며 제시어를 설명해요</h2><p>한 명씩 제시어에 대해 한마디씩! 라이어는 들키지 않게, 다른 사람은 라이어가 눈치채지 못하게 말해요.</p>${host?'<button class="pri big" data-a="toVote">👉 라이어 지목하기</button>':'<p class="hint">다 말하면 호스트가 지목을 시작해요</p>'}</div>`}
  if(ph==='vote'){h+=`<div class="card"><h2>👉 누가 라이어 같나요?</h2><p class="hint">${v.cands.length<v.players.length?'동점이 나와서 이 사람들 중에서 다시 골라요. ':''}이름을 눌러 지목해요 (바꿀 수 있어요) · ${v.voted}/${v.players.length}명 지목</p>
     ${plist(v,{pick:p=>p.id!==v.me.id&&v.cands.includes(p.id),mine:v.myVote})}${host?'<div class="row" style="margin-top:8px"><button class="sm" data-a="endVote">지목 마감하기</button></div>':''}</div>`;
    if(v.talks&&v.talks.length)h+=`<div class="card"><h3 style="margin:0 0 6px">💬 나온 설명</h3><div class="talk">${v.talks.map(t=>`<div class="t"><b>${esc(t.name)}</b> ${esc(t.text)}</div>`).join('')}</div></div>`;
    h+=`<details class="card"><summary class="j" style="cursor:pointer">내 제시어 다시 보기</summary>${wordCard(v)}</details>`}
  if(ph==='reveal'){const a=v.players.find(p=>p.id===v.accused);const c={};Object.values(v.votes).forEach(x=>c[x]=(c[x]||0)+1);
    h+=`<div class="card center"><div class="big-ico">🫵</div><h2>가장 많이 지목된 사람은…</h2><div class="win">${esc(a&&a.name)}님!</div><p>과연 라이어일까요? 두구두구…</p>${plist(v,{cnt:p=>c[p.id]||0,mine:v.accused})}</div>`}
  if(ph==='guess'){const a=v.players.find(p=>p.id===v.accused);
    h+=`<div class="ann">🎯 ${esc(a&&a.name)}님이 라이어였어요!</div>`;
    if(v.youAreLiar)h+=`<div class="card center"><h2>${v.mode==='fool'?'🤪 사실 당신이 라이어였어요!':'🤥 들켰어요!'}</h2><p>하지만 제시어를 맞히면 라이어가 이겨요! 진짜 제시어는 무엇일까요? (분야: ${esc(v.cat)})</p><div class="row" style="justify-content:center"><input id="guess" placeholder="정답 제시어" maxlength="30" style="font-size:20px;text-align:center"><button class="pri big" data-a="guess">정답 내기</button></div></div>`;
    else h+=`<div class="card center"><div class="big-ico">✍️</div><p>라이어가 진짜 제시어를 맞히는 중이에요…<br>맞히면 라이어 승리, 틀리면 우리 승리!</p></div>`}
  if(ph==='end'){const R=v.result,lw=R.w==='liar',me=v.me.id,iWin=lw?me===v.liarId:me!==v.liarId;
    h+=`<div class="card center"><div class="big-ico">${lw?'🤥':'🎉'}</div><div class="win" style="color:${lw?'var(--red)':'var(--green)'}">${lw?'라이어 승리!':'시민 승리!'}</div><p>${esc(R.why)}</p><p style="font-size:20px">${iWin?'🏆 내가 이긴 편이에요!':'😢 아쉽게 졌어요'}</p>
     <div class="row" style="justify-content:center;gap:14px;margin:10px 0"><div><div class="hint">진짜 제시어</div><div class="j" style="font-size:28px">${esc(v.word)}</div></div>${v.mode==='fool'?`<div><div class="hint">라이어가 받은 단어</div><div class="j" style="font-size:28px">${esc(v.fake)}</div></div>`:''}${v.guess?`<div><div class="hint">라이어의 답</div><div class="j" style="font-size:28px">${esc(v.guess)}</div></div>`:''}</div>
     ${plist(v,{liar:v.liarId,tag:p=>p.id===v.liarId?'<span class="tag">🤥 라이어</span>':''})}
     ${host?'<div class="row" style="justify-content:center;margin-top:12px"><button class="pri big" data-a="again">🔁 한 판 더</button><button data-a="lobby">⚙️ 설정 바꾸기</button></div>':'<p class="hint">호스트가 다음 판을 시작해요</p>'}</div>`}
  app.innerHTML=h;bind()}
function doAct(m){if(isHost){const p=P(MY);if(p)act(p,m)}else CL.send(m)}
function bind(){$$('[data-pick]').forEach(b=>b.onclick=()=>doAct({t:'vote',target:b.dataset.pick}));
  $$('[data-set]').forEach(b=>b.onclick=()=>{const k=b.dataset.set;G.set[k]=k==='rounds'?+b.dataset.v:b.dataset.v;broadcast()});
  const sy=$('#say');if(sy){sy.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)$('[data-a=say]').click()};setTimeout(()=>sy.focus(),50)}
  const gs=$('#guess');if(gs)gs.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)$('[data-a=guess]').click()};
  $$('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==='copy'){navigator.clipboard.writeText(location.origin+location.pathname+'?room='+G.room).then(()=>toast('링크를 복사했어요'));return}
    if(a==='start'||a==='again')return startRound();
    if(a==='lobby'){G.phase='lobby';G.r=null;broadcast();return}
    if(a==='toVote')return startVote();if(a==='endVote')return endVote();if(a==='skip')return nextTurn();
    if(a==='say'){const t=clip($('#say').value,80);if(!t){toast('한마디 적어 주세요');return}doAct({t:'say',text:t});return}
    if(a==='guess'){const t=clip($('#guess').value,30);if(!t){toast('정답을 적어 주세요');return}if(!confirm(`‘${t}’(으)로 낼까요?`))return;doAct({t:'guess',text:t});return}})}

/* =================== 참가자 기기 =================== */
const CL={joined:false,name:'',id:null,cl:null,send(m){if(this.cl)this.cl.publish(base()+'/h',JSON.stringify({from:this.id,m}),{qos:1})}};
async function joinRoom(name){CL.name=name;try{CL.id=sessionStorage.getItem('lr-id-'+ROOM)}catch(_){}if(!CL.id){CL.id='p'+Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('lr-id-'+ROOM,CL.id)}catch(_){}}try{sessionStorage.setItem('lr-name-'+ROOM,name)}catch(_){}
  const st=$('#jSt');if(st)st.textContent='방에 연결하는 중…';
  for(const url of BROKERS){const cl=await mqttOpen(url,7000);if(!cl)continue;let heard=false;
    cl.subscribe(base()+'/c/'+CL.id,{qos:1});cl.on('connect',()=>{cl.subscribe(base()+'/c/'+CL.id,{qos:1});if(CL.joined)CL.send({t:'join',name:CL.name})});
    cl.on('message',(tp,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(_){return}heard=true;
      if(m.t==='state'){const ch=!LV||LV.ph!==m.v.ph;LV=m.v;CL.joined=true;render();if(ch&&navigator.vibrate)try{navigator.vibrate(100)}catch(_){}}
      else if(m.t==='err'){toast(m.msg,3500);const s=$('#jSt');if(s)s.textContent=m.msg}});
    CL.cl=cl;CL.send({t:'join',name});for(let i=0;i<25&&!heard;i++){await new Promise(r=>setTimeout(r,300));if(i===10)CL.send({t:'join',name})}
    if(heard){setInterval(()=>CL.send({t:'ping'}),15000);return}try{cl.end(true)}catch(_){}CL.cl=null}
  const s=$('#jSt');if(s)s.textContent='방에 연결하지 못했어요. 방 코드와 호스트 화면이 켜져 있는지 확인해 주세요'}

if(HOSTING&&ROOM){try{G=JSON.parse(localStorage.getItem(HK())||'null')}catch(_){}if(G){isHost=true;MY=(G.players.find(p=>p.host)||{}).id;hostNet()}else{history.replaceState(null,'','./');ROOM=''}}
else if(ROOM){let n='';try{n=sessionStorage.getItem('lr-name-'+ROOM)||''}catch(_){}if(n)joinRoom(n)}
render();
})();
