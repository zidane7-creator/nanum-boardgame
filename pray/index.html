<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>누가 기도해? | 치영의 교회 생활 즐기기 · 기도 순서 룰렛</title>
<meta name="description" content="셀모임·소그룹에서 시작기도와 마무리기도를 누가 할지 룰렛으로 정해요. 칸 개수와 칸마다 들어갈 이름을 직접 정할 수 있어요.">
<meta name="keywords" content="기도 순서 정하기, 기도 룰렛, 셀모임, 소그룹, 시작기도, 마무리기도, 이름 룰렛">

<meta property="og:title" content="누가 기도해? — 치영의 교회 생활 즐기기">
<meta property="og:description" content="룰렛을 돌려 시작기도·마무리기도할 사람을 정해요">

<style>
:root{--ink:#3b2a20;--cream:#fffaf0;--accent:#e8503a;--gold:#f5b82e;--green:#5aa957}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;color:inherit;border:2px solid var(--ink);background:var(--cream);border-radius:16px;padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.4;cursor:default;transform:none}
button.pri{background:var(--accent);color:#fff}button.go{background:var(--green);color:#fff}
button.sm{padding:4px 10px;font-size:14px;border-radius:12px;box-shadow:0 2px 0 var(--ink)}
input{font:inherit;color:inherit;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:rgba(255,255,255,.92);border-bottom:4px solid var(--gold)}
.top a{color:var(--ink);text-decoration:none;font-size:15px;border:2px solid var(--ink);border-radius:14px;padding:3px 10px;background:var(--cream)}
.top .ttl{flex:1;font-size:19px}
main{max-width:1000px;margin:0 auto;padding:16px 12px 70px}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
h1{font-weight:normal;text-align:center;font-size:clamp(30px,7vw,44px);margin:6px 0 2px}
h2{font-weight:normal;margin:0 0 10px;font-size:22px}
.sub{text-align:center;margin:0 0 14px;opacity:.8}
.lay{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.lay{grid-template-columns:1fr}}
.wheelbox{position:relative;width:min(100%,460px);margin:0 auto;aspect-ratio:1}
#wheel{width:100%;height:100%;display:block}
.pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--accent);filter:drop-shadow(0 3px 0 var(--ink));z-index:2}
.hub{position:absolute;left:50%;top:50%;width:18%;height:18%;transform:translate(-50%,-50%);border-radius:50%;background:var(--cream);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,5vw,30px)}
.which{display:flex;justify-content:center;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.which button.on{background:var(--gold)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.res div{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:10px;text-align:center;min-height:76px}
.res small{display:block;opacity:.7}
.res b{font-size:24px;color:var(--accent)}
.cnt{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px}
.cnt b{font-size:26px;min-width:44px;text-align:center}
.slots{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto;padding:2px}
.slot{display:flex;align-items:center;gap:8px}
.slot .no{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.slot input{flex:1}
.hint{font-size:13px;opacity:.7}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
label.ck{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:10px;font-size:15px}
.big{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.big .card{text-align:center;max-width:440px;width:100%;animation:pop .35s ease-out}
.big .nm{font-size:clamp(40px,12vw,64px);color:var(--accent);margin:6px 0}
@keyframes pop{from{transform:scale(.6);opacity:0}}
</style>
</head><body>
<div class="top"><a href="../">← 목장</a><span class="ttl">🙏 누가 기도해?</span><button class="sm" id="snd" title="소리 켜기/끄기">🔊</button></div>
<main>
  <h1 class="sc-sky">누가 기도해?</h1>
  <p class="sub sc-sky">룰렛을 돌려서 오늘 시작기도와 마무리기도할 사람을 정해요</p>
  <div class="lay">
    <div class="card">
      <div class="wheelbox"><div class="pin"></div><svg id="wheel" viewBox="-210 -210 420 420" aria-label="룰렛판"></svg><div class="hub">🙏</div></div>
      <div class="which" id="which"><button data-k="open" class="on">🌅 시작기도</button><button data-k="close">🌙 마무리기도</button></div>
      <div class="row" style="margin-top:4px"><button class="pri" id="spin" style="font-size:24px;padding:12px 40px">돌리기!</button></div>
      <label class="ck"><input type="checkbox" id="noDup" checked> 시작기도에 걸린 사람은 마무리기도에서 빼기</label>
      <div class="res"><div><small>🌅 시작기도</small><b id="rOpen">?</b></div><div><small>🌙 마무리기도</small><b id="rClose">?</b></div></div>
      <div class="row"><button class="sm" id="clearRes">↺ 결과 지우기</button></div>
    </div>
    <div class="card">
      <h2>🎡 룰렛판 만들기</h2>
      <div class="cnt"><button class="sm" id="minus">－</button><b id="n">6</b><span>칸</span><button class="sm" id="plus">＋</button></div>
      <p class="hint" style="text-align:center;margin:0 0 8px">1번 칸이 맨 위에서 시작해서 시계 방향으로 돌아요. 칸마다 넣을 이름을 적어 주세요.</p>
      <div class="slots" id="slots"></div>
      <div class="row"><button class="sm" id="mix">🔀 이름 섞기</button><button class="sm" id="fillEmpty">빈 칸 지우기</button></div>
    </div>
  </div>
</main>
<div id="pop"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLS=["#f6b3c8","#ffd27a","#a9dc8a","#8fd0f0","#c9b3f0","#f7a072","#9fe0cf","#f3e07a","#f5a6a6","#b8d98c","#a6c8f5","#e3b8e8"];
let S={n:6,names:["철수","영희","민수","지수","하늘","바다"],noDup:true,res:{open:"",close:""},snd:true};
try{const o=JSON.parse(localStorage.getItem("pray:roulette")||"null");if(o)S=Object.assign(S,o)}catch(e){}
const save=()=>{try{localStorage.setItem("pray:roulette",JSON.stringify(S))}catch(e){}};
let which="open",rot=0,spinning=false;

/* ---------- 소리 (따로 파일 없이 기기에서 만들어요) ---------- */
let AC=null;const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC};
function tick(){if(!S.snd)return;const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=1100;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.05)}
function fanfare(){if(!S.snd)return;const a=ac();if(!a)return;[523,659,784,1047].forEach((f,i)=>{const t=a.currentTime+i*.12,o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.4)})}
const sndBtn=()=>$("snd").textContent=S.snd?"🔊":"🔇";$("snd").onclick=()=>{S.snd=!S.snd;sndBtn();save()};sndBtn();

/* ---------- 룰렛판 ---------- */
const names=()=>S.names.slice(0,S.n).map((x,i)=>String(x||"").trim()||(i+1)+"번");
function drawWheel(){const n=S.n,R=200,step=360/n;let h="";const nm=names();
  for(let i=0;i<n;i++){const a0=(-90+i*step)*Math.PI/180,a1=(-90+(i+1)*step)*Math.PI/180;
    const x0=R*Math.cos(a0),y0=R*Math.sin(a0),x1=R*Math.cos(a1),y1=R*Math.sin(a1),lg=step>180?1:0;
    h+=`<path d="M0 0L${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 ${lg} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${COLS[i%COLS.length]}" stroke="#3b2a20" stroke-width="3"/>`;
    const mid=-90+(i+.5)*step,fs=Math.max(14,Math.min(28,220/n+8));
    h+=`<g transform="rotate(${mid})"><text x="${R*.6}" y="0" text-anchor="middle" dominant-baseline="central" font-size="${fs}" fill="#3b2a20" transform="rotate(90 ${R*.6} 0)" style="font-family:Jua,sans-serif">${esc(nm[i].length>6?nm[i].slice(0,6)+"…":nm[i])}</text></g>`}
  h+=`<circle r="${R}" fill="none" stroke="#3b2a20" stroke-width="6"/>`;
  $("wheel").innerHTML=`<g id="rotor" transform="rotate(${rot})">${h}</g>`}
function drawSlots(){$("n").textContent=S.n;while(S.names.length<S.n)S.names.push("");
  $("slots").innerHTML=[...Array(S.n)].map((_,i)=>`<div class="slot"><span class="no" style="background:${COLS[i%COLS.length]}">${i+1}</span><input data-i="${i}" maxlength="12" value="${esc(S.names[i]||"")}" placeholder="${i+1}번 칸 이름"></div>`).join("");
  $("slots").querySelectorAll("input").forEach(inp=>inp.oninput=()=>{S.names[+inp.dataset.i]=inp.value;save();drawWheel()})}
$("minus").onclick=()=>{if(S.n>2){S.n--;save();drawSlots();drawWheel()}};
$("plus").onclick=()=>{if(S.n<16){S.n++;save();drawSlots();drawWheel()}};
$("mix").onclick=()=>{const a=S.names.slice(0,S.n);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}S.names.splice(0,S.n,...a);save();drawSlots();drawWheel()};
$("fillEmpty").onclick=()=>{const a=S.names.slice(0,S.n).filter(x=>String(x||"").trim());if(a.length<2){alert("이름을 2개 이상 적어 주세요");return}S.names=a;S.n=a.length;save();drawSlots();drawWheel()};

/* ---------- 돌리기 ---------- */
$("which").onclick=e=>{const b=e.target.closest("button");if(!b||spinning)return;which=b.dataset.k;document.querySelectorAll("#which button").forEach(x=>x.classList.toggle("on",x===b))};
$("noDup").checked=S.noDup;$("noDup").onchange=()=>{S.noDup=$("noDup").checked;save()};
function showRes(){$("rOpen").textContent=S.res.open||"?";$("rClose").textContent=S.res.close||"?"}
$("clearRes").onclick=()=>{S.res={open:"",close:""};save();showRes()};
$("spin").onclick=()=>{if(spinning)return;ac();const n=S.n,nm=names(),step=360/n;
  /* 뽑을 수 있는 칸: 마무리기도에서 '빼기'가 켜져 있으면 시작기도에 걸린 사람 칸 제외 */
  let ok=[...Array(n).keys()];if(which==="close"&&S.noDup&&S.res.open){const f=ok.filter(i=>nm[i]!==S.res.open);if(f.length)ok=f}
  const pick=ok[Math.floor(Math.random()*ok.length)];
  /* pick번 칸의 가운데가 맨 위(바늘)로 오도록 돌림: 칸 가운데 각도 = (pick+.5)*step, 판 각도 = -그 값 */
  const jitter=(Math.random()-.5)*step*.7,target=-((pick+.5)*step)+jitter;
  const turns=5+Math.floor(Math.random()*3);
  const from=rot,to=from+turns*360+((((target-from)%360)+360)%360),dur=4200+Math.random()*900,t0=performance.now();
  spinning=true;$("spin").disabled=true;let lastSeg=Math.floor(((from%360)+360)%360/step);
  const ease=x=>1-Math.pow(1-x,4);
  const frame=t=>{const p=Math.min(1,(t-t0)/dur);rot=from+(to-from)*ease(p);$("rotor").setAttribute("transform",`rotate(${rot})`);
    const seg=Math.floor(((rot%360)+360)%360/step);if(seg!==lastSeg){lastSeg=seg;tick()}
    if(p<1)requestAnimationFrame(frame);else done(pick)};
  requestAnimationFrame(frame)};
function done(i){spinning=false;$("spin").disabled=false;const who=names()[i];S.res[which]=who;save();showRes();fanfare();
  const k=which==="open"?"🌅 시작기도":"🌙 마무리기도";
  $("pop").innerHTML=`<div class="big"><div class="card"><div style="font-size:46px">🙏</div><div>오늘 ${k}는</div><div class="nm">${esc(who)}</div><div>님이 해 주세요!</div>
    <div class="row">${which==="open"?'<button class="pri" id="goClose">🌙 마무리기도도 정하기</button>':""}<button id="ok">확인</button></div></div></div>`;
  const close=()=>$("pop").innerHTML="";$("ok").onclick=close;$("pop").querySelector(".big").onclick=e=>{if(e.target.classList.contains("big"))close()};
  if($("goClose"))$("goClose").onclick=()=>{close();which="close";document.querySelectorAll("#which button").forEach(x=>x.classList.toggle("on",x.dataset.k==="close"))}}
drawSlots();drawWheel();showRes();
</script>
<script src="../assets/scene.js?v=20261116c"></script><script src="../assets/home.js"></script>
</body></html>
