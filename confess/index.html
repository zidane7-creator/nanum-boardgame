const PTR=new Map();let DRAG=null,PINCH=null;
cv.addEventListener('pointerdown',e=>{PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(PTR.size===2){const[a,b]=[...PTR.values()];PINCH={d:Math.hypot(a.x-b.x,a.y-b.y),dist:DIST};DRAG=null;return}
  DRAG={x:e.clientX,y:e.clientY,yaw:YAW,pitch:PITCH,moved:false}});
cv.addEventListener('pointermove',e=>{if(PTR.has(e.pointerId))PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PINCH&&PTR.size===2){const[a,b]=[...PTR.values()];DIST=Math.max(3.2,Math.min(14,PINCH.dist*PINCH.d/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y))));return}
  if(DRAG&&PTR.size===1){const dx=e.clientX-DRAG.x,dy=e.clientY-DRAG.y;if(!DRAG.moved&&Math.hypot(dx,dy)>7)DRAG.moved=true;
    if(DRAG.moved){YAW=Math.max(-1.25,Math.min(1.25,DRAG.yaw-dx*.006));PITCH=Math.max(-.12,Math.min(.6,DRAG.pitch+dy*.004))}}
  if(PLACE&&e.pointerType==='mouse')hover(e)});
const endP=e=>{const d=DRAG;PTR.delete(e.pointerId);if(PTR.size<2)PINCH=null;if(e.type==='pointerup'&&d&&!d.moved&&PLACE&&PTR.size===0)tryPlace(e);if(PTR.size===0)DRAG=null};
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
cv.addEventListener('wheel',e=>{e.preventDefault();DIST=Math.max(3.2,Math.min(14,DIST*Math.exp(e.deltaY*.001)))},{passive:false});
/* ---------- 못 박을 자리 고르기 ---------- */
let PLACE=false;const RC=new T.Raycaster(),MP=new T.Vector2();
const ghost=new T.Mesh(paperGeo(1),new T.MeshStandardMaterial({map:PT,transparent:true,opacity:.55,side:T.DoubleSide,depthWrite:false}));ghost.visible=false;S.add(ghost);
function pick(e){const r=cv.getBoundingClientRect();MP.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);RC.setFromCamera(MP,CAM);const h=RC.intersectObjects([vb,hb],false)[0];if(!h)return null;
  const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);return{p:h.point.clone(),n}}
function hover(e){const h=pick(e);if(!h){ghost.visible=false;return}ghost.visible=true;const q=frame(h.p,h.n,0);ghost.quaternion.copy(q);ghost.position.copy(h.p).add(new T.Vector3(0,-PH*.3,0).applyQuaternion(q)).add(h.n.clone().multiplyScalar(.01))}
function tryPlace(e){const h=pick(e);if(!h){toast('십자가 위를 눌러 주세요');return}
  const near=PAPERS.filter(d=>new T.Vector3().fromArray(d.p).distanceTo(h.p)<.35).length;
  const d={p:h.p.toArray().map(v=>Math.round(v*1000)/1000),n:h.n.toArray().map(v=>Math.round(v*1000)/1000),r:Math.round((Math.random()-.5)*.36*1000)/1000,s:Math.floor(Math.random()*1e6),k:near};
  PAPERS.push(d);savePapers();
  /* 글자는 이 순간 지워져요 — 어디에도 남지 않아요 */
  $('#sin').value='';
  PLACE=false;cv.classList.remove('place');ghost.visible=false;$('#placeBar').hidden=true;
  addPaper(d,true);updCnt();setTimeout(()=>{$('#dock').hidden=false;$('#words').hidden=false;placeWords();nextVerse()},2200)}
/* ---------- 쓰기 ---------- */
/* 죄 고백 말씀: 십자가 위에서 돌아가며 보여요 (개역한글) */
const VERSES=[['만일 우리가 우리 죄를 자백하면 저는 미쁘시고 의로우사 우리 죄를 사하시며 모든 불의에서 우리를 깨끗케 하실 것이요','요한일서 1:9'],
  ['내가 이르기를 내 허물을 여호와께 자복하리라 하고 주께 내 죄를 아뢰고 내 죄악을 숨기지 아니하였더니 곧 주께서 내 죄의 악을 사하셨나이다','시편 32:5'],
  ['자기의 죄를 숨기는 자는 형통치 못하나 죄를 자복하고 버리는 자는 불쌍히 여김을 받으리라','잠언 28:13'],
  ['하나님이여 내 속에 정한 마음을 창조하시고 내 안에 정직한 영을 새롭게 하소서','시편 51:10'],
  ['우리를 거스리고 우리를 대적하는 의문에 쓴 증서를 도말하시고 제하여 버리사 십자가에 못 박으시고','골로새서 2:14'],
  ['친히 나무에 달려 그 몸으로 우리 죄를 담당하셨으니 이는 우리로 죄에 대하여 죽고 의에 대하여 살게 하려 하심이라','베드로전서 2:24'],
  ['동이 서에서 먼 것 같이 우리 죄과를 우리에게서 멀리 옮기셨으며','시편 103:12'],
  ['너희 죄가 주홍 같을지라도 눈과 같이 희어질 것이요 진홍 같이 붉을지라도 양털 같이 되리라','이사야 1:18'],
  ['내가 너의 허물을 빽빽한 구름의 사라짐 같이, 너의 죄를 안개의 사라짐 같이 도말하였으니 너는 내게로 돌아오라 내가 너를 구속하였음이니라','이사야 44:22'],
  ['그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니','로마서 8:1']];
let VI=0,VT=null;
function setVerse(i){const[v,r]=VERSES[i%VERSES.length];$('#vt').textContent='"'+v+'"';$('#vr').textContent='('+r+')'}
function nextVerse(){clearTimeout(VT);const el=$('#words');el.classList.add('fade');setTimeout(()=>{setVerse(++VI);el.classList.remove('fade')},1400);VT=setTimeout(nextVerse,15000)}
setVerse(0);VT=setTimeout(nextVerse,15000);
function openPaper(){const m=$('#modal'),p=$('#paper');p.classList.remove('fly');p.style.transition='none';void p.offsetWidth;p.style.transition='';$('#pno').textContent=`나의 ${PAPERS.length+1}번째 죄 고백`;m.hidden=false;$('#dock').hidden=true;setTimeout(()=>$('#sin').focus(),60)}
$('#write').onclick=openPaper;
$('#cancel').onclick=()=>{if($('#sin').value.trim()&&!confirm('적은 내용을 지우고 닫을까요?'))return;$('#sin').value='';$('#modal').hidden=true;$('#dock').hidden=false;placeWords()};
$('#nail').onclick=()=>{if(!$('#sin').value.trim()){toast('종이에 죄를 적어 주세요');$('#sin').focus();return}
  document.activeElement&&document.activeElement.blur();const p=$('#paper');p.classList.add('fly');
  setTimeout(()=>{$('#modal').hidden=true;PLACE=true;cv.classList.add('place');$('#placeBar').hidden=false;$('#words').hidden=true},1150)};
$('#back').onclick=()=>{PLACE=false;cv.classList.remove('place');ghost.visible=false;$('#placeBar').hidden=true;$('#words').hidden=false;openPaper()};
/* ---------- 그리기 ---------- */
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);CAM.aspect=w/h;CAM.fov=w<h?52:42;CAM.updateProjectionMatrix();if(!size.done){DIST=w<h?14.5:12.5;size.done=1}}
function placeWords(){const d=$('#dock');if(d.hidden)return;const b=d.getBoundingClientRect().bottom;$('#words').style.top=Math.round(b+14)+'px'}
addEventListener('resize',()=>{size();placeWords()});size();placeWords();if(document.fonts)document.fonts.ready.then(placeWords);
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  CANDLES.forEach(c=>{const f=.82+Math.sin(now*.011+c.ph)*.08+Math.sin(now*.027+c.ph*2)*.06+Math.random()*.05;c.pl.intensity=c.b*f;c.fl.scale.set(.13*(.9+f*.1),.26*f,1)});
  const a=dg.attributes.position;for(let i=0;i<DN;i++){let y=a.getY(i)+dt*.06;if(y>7)y=0;a.setY(i,y);a.setX(i,a.getX(i)+Math.sin(now*.0004+i)*.0008)}a.needsUpdate=true;
  for(let i=ANIMS.length-1;i>=0;i--)if(!ANIMS[i](now))ANIMS.splice(i,1);
  placeCam(SHAKE);SHAKE*=.82;if(SHAKE<.002)SHAKE=0;R.render(S,CAM);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

})();
