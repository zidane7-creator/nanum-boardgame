<style>

*{box-sizing:border-box}

.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(0,0,0,.12)}

.rset .img.has{border-style:solid;border-color:var(--ink)}
.rset .img .rm{position:absolute;top:4px;right:4px;padding:0 7px;font-size:12px;box-shadow:none}
.rset input.nm{width:100%;font-family:Jua,sans-serif;font-size:18px;margin-bottom:6px}
.lim{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:14px}.lim input{width:100%;padding:4px 8px}

.sx-m{color:var(--blue)}.sx-f{color:var(--red)}

.door:active{transform:none;box-shadow:none}

.door:nth-child(even) .paper{transform:rotate(2deg)}

.rv .body{padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}

.rv .lf{left:0;transform-origin:left center}.rv .rt{right:0;transform-origin:right center}
.rv .lf::after,.rv .rt::after{content:"";position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid #5a3412}
.rv .lf::after{right:8px}.rv .rt::after{left:8px}
.rv.open .lf{transform:rotateY(-105deg)}.rv.open .rt{transform:rotateY(105deg)}

.toast.show{opacity:1}

  $$("[data-room]").forEach(b=>b.onclick=()=>{const r=v.rooms.find(x=>x.id===b.dataset.room);if(!r.ok){denyFx(b,fullMsg(r.name,r.why));return}if(!confirm(`‘${r.name}’에 들어갈까요?`))return;b.classList.add("open");SFX.play("creak");$$("[data-room]").forEach(x=>x.disabled=true);setTimeout(()=>CL.send({t:"pick",room:r.id}),700);setTimeout(()=>SFX.play("doorClose"),1500)})}
/* =========== 라우팅 =========== */
function render(){
  if(ROOM&&!HOSTING){if(CL.joined&&LV){vClient();return}vJoin();return}
  if(G&&G.mode==="online"&&!(STEP==="rooms"&&G.editRooms)){if(G.phase==="lobby")return vLobbyHost();if(G.phase==="pick")return vPickHost();return vDoneHost()}
  if(G&&G.mode==="local"){if(G.phase==="people")return vPeopleLocal();if(G.phase==="pick")return vPickLocal();return vDoneLocal()}
  if(STEP==="mode")return vMode();
  vRooms();
  if(G&&G.editRooms){const nx=$("#next");nx.textContent="저장하고 대기실로 ▶";nx.onclick=()=>{G.rooms=finalRooms();G.topic=clip(SET.topic,20);G.editRooms=false;G.players.forEach(p=>sendImgs(p.id));broadcast()}}}
/* 시작 */
if(HOSTING&&ROOM){try{G=JSON.parse(localStorage.getItem(HK())||"null")}catch(_){}if(G){hostNet()}else{history.replaceState(null,"","./");ROOM=""}}
else if(ROOM){let me=null;try{me=JSON.parse(sessionStorage.getItem("tm-me-"+ROOM)||"null")}catch(_){}if(me&&me.name)joinRoom(me.name,me.gender||"")}
else{try{const L=JSON.parse(localStorage.getItem(LK)||"null");if(L&&L.mode==="local")G=L}catch(_){}}
{const sb=$("#snd");sb.textContent=SFX.on?"🔊 소리":"🔇 소리";sb.onclick=()=>{sb.textContent=SFX.toggle()?"🔊 소리":"🔇 소리"}}
document.addEventListener("pointerdown",()=>SFX.unlock(),{passive:true});
window.__teamsTest={peek:()=>G,doPick,render};
render();
})();
