<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clip=(s,n)=>String(s??'').replace(/[\u0000-\u001f]/g,' ').trim().slice(0,n);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
let tt;function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms||2400)}
const COL=[['#e8503a','빨강'],['#2f78d0','파랑'],['#3f9a55','초록'],['#f5b82e','노랑'],['#8e5bd0','보라'],['#ff8a2a','주황']];

/* =================== 책상 =================== */
const W=440,L=960,CR=15,START=L-118,SHOTY=L-64,TC={x:0,y:250};
const SHAPES={rect:['직사각형','네모 반듯한 책상'],tri:['역삼각형','멀리 갈수록 넓어지고, 출발선 쪽이 좁아요'],oval:['타원형','둥근 책상, 가장자리가 휘어 있어요']};
const OPTS=[['hole','🕳️ 구멍','빠지면 낙'],['block','⛰ 장애물','바닥에서 솟아올라 병뚜껑을 튕겨 내요'],['wall','🧱 반사판','부딪히면 그대로 튕겨 나와요'],['slow','🐢 느림 구간','지나가면 확 느려져요']];
const BOARDS=[['circle','⭕ 원형'],['check','♟️ 체크형'],['square','⬜ 사각형'],['star','⭐ 별'],['donut','🍩 도넛'],['random','🎲 랜덤 모양']];
function hw(y,sh){if(sh==='tri')return 220*(1-.6*clamp(y,0,L)/L);if(sh==='oval'){const t=(y-L/2)/(L/2);return t*t>=1?0:220*Math.sqrt(1-t*t)}return 220}
function fv(x,y,sh){if(sh==='oval')return (x/220)**2+((y-L/2)/(L/2))**2-1;return Math.max(Math.abs(x)-hw(y,sh),-y,y-L)}
function grad(x,y,sh){const gx=(fv(x+1,y,sh)-fv(x-1,y,sh))/2,gy=(fv(x,y+1,sh)-fv(x,y-1,sh))/2,l=Math.sqrt(gx*gx+gy*gy)||1;return[gx/l,gy/l]}
/* 구멍·느림 구간·반사 벽은 게임마다 책상 전체에서 랜덤 자리 (점수판·특별 원·출발선과 겹치지 않게) */
function specialsOf(sh){const sp=[];for(const[dy,v]of[[sh==='oval'?-172:-150,120],[150,-20]])for(const s of[-1,1]){const y=TC.y+dy,x=s*Math.min(178,hw(y,sh)-30);sp.push({x,y,r:22,v})}return sp}
function makeLayout(set){return{blob:set.board==='random'?Array.from({length:4},(_,i)=>[i+2,+(0.05+Math.random()*0.14).toFixed(3),+(Math.random()*6.283).toFixed(3)]):null}}
function geo(set,lay){const opts=set.opts||[],board=set.board||'circle';return{holes:[],slows:[],walls:[],board,checker:board==='check',blob:lay&&lay.blob,opts,dyn:opts.length>0,specials:specialsOf(set.shape)}}
/* 점수판 모양: 가운데에서의 '거리'를 모양에 맞게 재요 (값이 30·60·90·120·150 안이면 100·80·60·40·20점) */
const BLOBMAX=new WeakMap();function blobRaw(blob,th){let s=1;for(const[k,a,ph]of blob)s+=a*Math.cos(k*th+ph);return s}
function blobF(blob,th){let m=BLOBMAX.get(blob);if(!m){m=0;for(let i=0;i<180;i++)m=Math.max(m,blobRaw(blob,i/180*Math.PI*2));BLOBMAX.set(blob,m)}return blobRaw(blob,th)/m}
function shapeF(G,th){if(G.board==='star')return .68+.32*Math.cos(5*(th+Math.PI/2));if(G.board==='random'&&G.blob)return blobF(G.blob,th);return 1}
function lvlDist(G,x,y){const dx=x-TC.x,dy=y-TC.y;if(G.board==='square')return Math.max(Math.abs(dx),Math.abs(dy));const d=Math.sqrt(dx*dx+dy*dy);return d/shapeF(G,Math.atan2(dy,dx))}
function scoreAt(x,y,G){for(const s of G.specials)if((x-s.x)**2+(y-s.y)**2<=s.r*s.r)return s.v;
  if(G.checker){const i=Math.floor((x-TC.x+140)/56),j=Math.floor((y-TC.y+140)/56);if(i<0||j<0||i>4||j>4)return 0;const ring=Math.max(Math.abs(i-2),Math.abs(j-2));return (i+j)%2===0?100-20*ring:60-20*ring}
  const d=lvlDist(G,x,y);if(G.board==='donut')return d<24?0:d<=50?100:d<=76?80:d<=102?60:d<=128?40:d<=150?20:0;
  return d<=30?100:d<=60?80:d<=90?60:d<=120?40:d<=150?20:0}

/* =================== 물리 =================== */
const FR=250,FR_SLOW=1150,RE=.9,WALL_E=.82;
function stepPhys(caps,set,G,dt){let moving=false;
  for(const c of caps){if(c.out)continue;const sp=Math.sqrt(c.vx*c.vx+c.vy*c.vy);if(sp<1){c.vx=c.vy=0;continue}moving=true;
    const slow=G.slows.some(z=>(c.x-z.x)**2+(c.y-z.y)**2<z.r*z.r),dec=(slow?FR_SLOW:FR)*dt,k=Math.max(0,sp-dec)/sp;c.vx*=k;c.vy*=k;c.x+=c.vx*dt;c.y+=c.vy*dt;
    for(const h of G.holes)if((c.x-h.x)**2+(c.y-h.y)**2<(h.r-4)**2){c.out=1;c.fall={x:h.x,y:h.y,t:0,hole:1};c.vx=c.vy=0}
    if(c.out)continue;
    const[nx,ny]=grad(c.x,c.y,set.shape),edge=fv(c.x+nx*CR,c.y+ny*CR,set.shape)>0,onWall=G.walls.some(w=>w.s*c.x>0&&c.y>=w.y0&&c.y<=w.y1);
    if(edge&&(!set.drop||onWall)){const vn=c.vx*nx+c.vy*ny;if(vn>0){const e=onWall?1:WALL_E;c.vx-=(1+e)*vn*nx;c.vy-=(1+e)*vn*ny}for(let i=0;i<8&&fv(c.x+nx*CR,c.y+ny*CR,set.shape)>0;i++){c.x-=nx*1.5;c.y-=ny*1.5}c.bump=onWall?1:0}
    else if(set.drop&&fv(c.x,c.y,set.shape)>0){c.out=1;c.fall={x:c.x,y:c.y,t:0,vx:c.vx*.4,vy:c.vy*.4};c.vx=c.vy=0}}
  for(let i=0;i<caps.length;i++){const a=caps[i];if(a.out)continue;for(let j=i+1;j<caps.length;j++){const b=caps[j];if(b.out)continue;const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2>=4*CR*CR||d2===0)continue;
    const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=2*CR-d;a.x-=nx*ov/2;a.y-=ny*ov/2;b.x+=nx*ov/2;b.y+=ny*ov/2;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const j2=-(1+RE)*rv/2;a.vx-=j2*nx;a.vy-=j2*ny;b.vx+=j2*nx;b.vy+=j2*ny;moving=true;a.hit=b.hit=performance.now()}}}
  return moving}


/* =================== 깜짝 책상: 1초마다 구멍이 뚫리거나 장애물이 솟아요 (1초 유지) =================== */
const EV_LIFE=5000,EV_OPEN=220,EV_PERIOD=3000;
function evScale(age){return age<EV_OPEN?age/EV_OPEN:age>EV_LIFE-EV_OPEN?Math.max(0,(EV_LIFE-age)/EV_OPEN):1}
function spawnEvents(st,now){const sh=st.set.shape,act=(st.ev||[]).filter(e=>now-e.t0<EV_LIFE);const add=[];
  for(const k of st.set.opts||[]){for(let i=0;i<80;i++){const r=k==='hole'?24+Math.random()*10:k==='block'?22+Math.random()*9:k==='slow'?40+Math.random()*16:48+Math.random()*28,y=20+r+Math.random()*(START-60-2*r),h=hw(y,sh)-r-8;if(h<=0)continue;const x=(Math.random()*2-1)*h;
    if(act.concat(add).some(e=>Math.hypot(e.x-x,e.y-y)<e.r+r+14))continue;add.push({id:(st.evId=(st.evId||0)+1),k,x:Math.round(x),y:Math.round(y),r:Math.round(r),a:k==='wall'?+(Math.random()*Math.PI).toFixed(3):0,t0:now});break}}
  st.ev=act.concat(add)}
function dynPhys(caps,evs,now,dt){let mv=false;for(const e of evs){const age=now-e.t0,sc=evScale(age);if(sc<=.05)continue;const r=e.r*sc;
  for(const c of caps){if(c.out)continue;const dx=c.x-e.x,dy=c.y-e.y,d=Math.sqrt(dx*dx+dy*dy);
    if(e.k==='hole'){if(sc>.8&&d<r-5){c.out=1;c.fall={x:e.x,y:e.y,t:0,hole:1};c.vx=c.vy=0;mv=true}}
    else if(e.k==='slow'){if(sc>.5&&d<r){const sp=Math.sqrt(c.vx*c.vx+c.vy*c.vy);if(sp>0){const k=Math.max(0,sp-(FR_SLOW-FR)*dt)/sp;c.vx*=k;c.vy*=k}}}
    else if(e.k==='wall'){if(sc<.3)continue;const ux=Math.cos(e.a),uy=Math.sin(e.a),pr=Math.max(-r,Math.min(r,dx*ux+dy*uy)),qx=e.x+ux*pr,qy=e.y+uy*pr,wx=c.x-qx,wy=c.y-qy,wd=Math.sqrt(wx*wx+wy*wy);
      if(wd<CR+6){const nx=wd?wx/wd:-uy,ny=wd?wy/wd:ux;c.x=qx+nx*(CR+6);c.y=qy+ny*(CR+6);const vn=c.vx*nx+c.vy*ny;if(vn<0){c.vx-=2*vn*nx;c.vy-=2*vn*ny}mv=true}}
    else if(d<r+CR){const nx=d?dx/d:1,ny=d?dy/d:0,ov=r+CR-d;c.x+=nx*ov;c.y+=ny*ov;const vn=c.vx*nx+c.vy*ny;if(vn<0){c.vx-=1.8*vn*nx;c.vy-=1.8*vn*ny}if(age<EV_OPEN+60){c.vx+=nx*120;c.vy+=ny*120}mv=true}}}
  return mv}

const blankSet=()=>({teams:2,caps:4,drop:true,shape:'rect',opts:['hole','block'],board:'circle'});

function shooterAt(st,n){const T=st.tOrder.length;const ti=st.tOrder[n%T],k=Math.floor(n/T),P=membersOf(st,ti);return{ti,p:P.length?P[k%P.length]:null,k}}
function newState(mode){return{mode,ph:'setup',set:blankSet(),teams:COL.slice(0,6).map((c,i)=>({name:(i+1)+'팀',col:c[0]})),tOrder:[0,1],players:[],caps:[],n:0,moving:false,seq:0,round:0}}
function fitTeams(st){const T=st.set.teams;st.tOrder=st.tOrder.filter(t=>t<T);for(let i=0;i<T;i++)if(!st.tOrder.includes(i))st.tOrder.push(i);st.players.forEach(p=>{if(p.team!=null&&p.team>=T)p.team=null})}
function totals(st){const Gg=geo(st.set,st.layout),S={};st.tOrder.forEach(t=>S[t]=0);st.caps.forEach(c=>{if(!c.out&&S[c.t]!=null)S[c.t]+=scoreAt(c.x,c.y,Gg)});return S}
function throwsLeft(st,ti){const T=st.tOrder.length,total=T*st.set.caps;let used=0;for(let n=0;n<st.n;n++)if(st.tOrder[n%T]===ti)used++;return st.set.caps-used}

function startGame(){GL=null;fitTeams(G);const empty=G.tOrder.filter(t=>!membersOf(G,t).length);if(empty.length){toast(G.teams[empty[0]].name+'에 사람이 없어요');return false}

  G.caps.push({id:G.n,t:G.cur.ti,x:clamp(x,-hw(SHOTY,G.set.shape)+CR+4,hw(SHOTY,G.set.shape)-CR-4),y:SHOTY,vx:vx*m,vy:vy*m,out:0});G.n++;G.moving=true;G.cur.shot=1;sync()}

function hostHandle(f,m){if(!G)return;let p=G.players.find(x=>x.id===f);
  if(m.t==='join'){const name=clip(m.name,10);if(!p){if(!name)return;if(G.players.some(x=>x.name===name))return pubAll({t:'err',to:f,msg:'같은 이름이 있어요. 다르게 적어 주세요'},1);if(G.players.length>=40)return;p={id:f,name,team:null};G.players.push(p)}sync();return}

  else if(m.t==='aim'&&G.ph==='play'&&G.cur&&G.cur.pid===f){G.cur.x=clamp(+m.x||0,-200,200);pubAll({t:'aim',x:G.cur.x},0)}}

  for(const e of EVS)if(e.k==='hole'){const sc=evScale(nw-e.t0),r=e.r*sc;if(r<1)continue;const rg=g.createRadialGradient(e.x,e.y,1,e.x,e.y,r);rg.addColorStop(0,'#000');rg.addColorStop(.7,'#140c06');rg.addColorStop(1,'#4a2e18');el(e.x,e.y,r+4,r+4);g.fillStyle='rgba(90,55,25,.6)';g.fill();el(e.x,e.y,r,r);g.fillStyle=rg;g.fill();g.strokeStyle='rgba(255,220,150,.35)';g.lineWidth=2;for(let i=0;i<6;i++){const a=i*1.05+e.x;g.beginPath();g.moveTo(e.x+Math.cos(a)*r,e.y+Math.sin(a)*r);g.lineTo(e.x+Math.cos(a)*(r+9),e.y+Math.sin(a)*(r+9));g.stroke()}}
  for(const c of caps){const col=v.teams[c.t]?v.teams[c.t].col:'#888';if(c.out){const f=c.fall;if(!f||f.t>.6)continue;const k=1-f.t/.6;drawCap(f.x+(f.vx||0)*f.t,f.y+(f.vy||0)*f.t,col,f.hole?k*.8:1+f.t*.3,k);continue}drawCap(c.x,c.y,col,1,1,false)}

    const tg=g.createRadialGradient(e.x+ux-r*.3,e.y+uy-r*.3,1,e.x+ux,e.y+uy,r);tg.addColorStop(0,'#dfe3e7');tg.addColorStop(1,'#959ba2');el(e.x+ux,e.y+uy,r,r);g.fillStyle=tg;g.fill();g.strokeStyle='#4f555c';g.lineWidth=2;g.stroke();g.fillStyle='rgba(255,255,255,.75)';g.font='16px Jua';g.textAlign='center';g.fillText('⛰',e.x+ux,e.y+uy+6)}
  for(const e of EVS)if(e.k==='wall'){const sc=evScale(nw-e.t0),L2=e.r*sc;if(L2<2)continue;const ux=Math.cos(e.a),uy=Math.sin(e.a),[vx0,vy0]=upVec(),hh=10*Math.min(1,sc*1.5),vx=vx0*hh,vy=vy0*hh;g.lineCap='round';
    g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=14;g.beginPath();g.moveTo(e.x-ux*L2+3,e.y-uy*L2+4);g.lineTo(e.x+ux*L2+3,e.y+uy*L2+4);g.stroke();
    const n=Math.max(2,Math.ceil(Math.hypot(vx,vy)/1.5));for(let i=0;i<=n;i++){const f=i/n;g.strokeStyle=i===n?'#ff9a3c':'#c4621a';g.lineWidth=12;g.beginPath();g.moveTo(e.x-ux*L2+vx*f,e.y-uy*L2+vy*f);g.lineTo(e.x+ux*L2+vx*f,e.y+uy*L2+vy*f);g.stroke()}
    g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=3;g.beginPath();g.moveTo(e.x-ux*L2*.9+vx,e.y-uy*L2*.9+vy-2);g.lineTo(e.x+ux*L2*.9+vx,e.y+uy*L2*.9+vy-2);g.stroke()}
  // 다음에 칠 병뚜껑
  if(v.ph==='play'&&!v.moving&&v.cur){const col=v.teams[v.cur.ti].col,x=v.cur.x||0;
    if(AIM){const dx=AIM.sx-AIM.ex,dy=AIM.sy-AIM.ey,len=Math.min(220,Math.sqrt(dx*dx+dy*dy)),a=Math.atan2(dy,dx),pw=len/220;

/* 치기 입력: 병뚜껑을 누른 채 뒤로 끌었다 놓기 */
const PTR=new Map();let PAN=null,PINCH=null;
cv.addEventListener('pointerdown',e=>{PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(PTR.size===2){AIM=null;PAN=null;const[a,b]=[...PTR.values()];PINCH={d:Math.hypot(a.x-b.x,a.y-b.y),z:VIEW.zoom};return}
  if(myTurn()){const[wx,wy]=toW(e.clientX,e.clientY);const cx=LV.cur.x||0;
    if(Math.sqrt((wx-cx)**2+(wy-SHOTY)**2)<CR*3.2){AIM={sx:wx,sy:wy,ex:wx,ey:wy,id:e.pointerId};return}
    if(wy>START-10&&wy<L+20&&Math.abs(wx)<hw(SHOTY,LV.set.shape)+20){setCurX(wx);return}}
  PAN={id:e.pointerId,x:e.clientX,y:e.clientY,px:VIEW.px,py:VIEW.py}});
cv.addEventListener('pointermove',e=>{if(PTR.has(e.pointerId))PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PINCH&&PTR.size===2){const[a,b]=[...PTR.values()];VIEW.zoom=Math.max(.6,Math.min(3.5,PINCH.z*Math.hypot(a.x-b.x,a.y-b.y)/PINCH.d));applyView();return}
  if(PAN&&e.pointerId===PAN.id){VIEW.px=PAN.px+(e.clientX-PAN.x);VIEW.py=PAN.py+(e.clientY-PAN.y);applyView()}});

cv.addEventListener('pointermove',e=>{if(!AIM||e.pointerId!==AIM.id)return;const[wx,wy]=toW(e.clientX,e.clientY);AIM.ex=wx;AIM.ey=wy});
const endAim=e=>{if(!AIM||e.pointerId!==AIM.id)return;const dx=AIM.sx-AIM.ex,dy=AIM.sy-AIM.ey,len=Math.min(220,Math.sqrt(dx*dx+dy*dy));AIM=null;if(len<10)return;const k=len*5/Math.sqrt(dx*dx+dy*dy),vx=dx*k,vy=dy*k,x=LV.cur.x||0;
  if(isHost)doShot(x,vx,vy);else CL.send({t:'shot',x,vx,vy})};cv.addEventListener('pointerup',endAim);cv.addEventListener('pointercancel',e=>{if(AIM&&e.pointerId===AIM.id)AIM=null});
function setCurX(wx){const h=hw(SHOTY,LV.set.shape)-CR-6,x=clamp(wx,-h,h);LV.cur.x=x;if(isHost){G.cur.x=x;if(G.mode==='net')pubAll({t:'aim',x},0)}else CL.send({t:'aim',x},0)}
/* 결과 */
function showResult(){const v=LV;if(!v||v.ph!=='over')return;const S=v.final||{},R=v.tOrder.slice().sort((a,b)=>(S[b]||0)-(S[a]||0));const md=['🥇','🥈','🥉'];
  const o=$('#ov');o.dataset.k='res';$('#ovb').innerHTML=`<h2 style="margin:0 0 8px;text-align:center">🏁 경기 끝!</h2>${R.map((ti,i)=>`<div class="rank" style="border-color:${v.teams[ti].col}"><span>${md[i]||(i+1)+'위'}</span><i style="background:${v.teams[ti].col}"></i>${esc(v.teams[ti].name)}<span class="s">${S[ti]||0}점</span></div>`).join('')}
    <div class="row" style="justify-content:center;margin-top:12px">${isHost?'<button class="go" id="rAgain">🔁 같은 설정으로 다시</button><button id="rSet">⚙️ 설정으로</button>':'<span class="hint">방장이 다시 시작하면 이어서 해요</span>'}<button id="rClose">책상 보기</button></div>`;o.hidden=false;

function how(){const o=$('#ov');o.dataset.k='how';$('#ovb').innerHTML=`<div class="row"><h2 style="margin:0;flex:1">📖 병뚜껑 컬링 게임방법</h2><button id="hx">닫기</button></div><ul id="how">
  <li><b>시작</b>: 한 기기로 하면 팀마다 이름을 넣고, 초대하면 각자 자기 이름으로 들어와서 팀을 골라요. 팀 순서와 팀 안에서 치는 순서는 ▲▼로 정해요.</li>
  <li><b>치는 순서</b>: 1팀 1번 → 2팀 1번 → 3팀 1번 → 1팀 2번 → 2팀 2번 … 팀마다 정한 병뚜껑 개수를 다 칠 때까지 돌아가요. 팀 사람이 적으면 처음 사람부터 다시 쳐요.</li>
  <li><b>치기</b>: 출발선의 병뚜껑을 손가락(마우스)으로 누른 채 <b>뒤로 끌었다가 놓으면</b> 반대쪽으로 날아가요. 멀리 끌수록 세게, 끄는 방향으로 방향이 정해져요. 치기 전에 출발선 아무 곳이나 누르면 병뚜껑을 옆으로 옮길 수 있어요.</li>
  <li><b>점수</b>: 병뚜껑의 가운데가 들어간 칸의 점수예요. 가운데부터 100 · 80 · 60 · 40 · 20점. 점수판 위 대각선의 노란 작은 원은 <b>+120점</b>, 아래 대각선의 회색 작은 원은 <b>-20점</b>이에요.</li>
  <li><b>부딪히기</b>: 병뚜껑끼리 부딪혀 밀려나요. 상대 병뚜껑을 밀어내거나, 내 병뚜껑을 밀어 넣어 점수를 바꿀 수 있어요. 점수는 병뚜껑이 멈춘 자리로 실시간 계산돼요.</li>
  <li><b>낙</b>: 낙 있음이면 책상 밖으로 떨어진 병뚜껑은 0점이에요. 낙 없음이면 가장자리에서 튕겨요. 구멍에 빠지면 낙 설정과 상관없이 떨어져요.</li>
  <li><b>책상 모양</b>: 직사각형 · 역삼각형(출발선 쪽이 좁아요) · 타원형</li>
  <li><b>책상 옵션</b> (여러 개 고르기): ${OPTS.map(o=>o[1]+' — '+o[2]).join(' / ')}. 고른 것들이 3초마다 책상 곳곳에 랜덤으로 생겨서 5초 동안 있어요. 아무것도 안 고르면 일반 책상이에요.</li>
  <li><b>점수판 모양</b>: ${BOARDS.map(b=>b[1]).join(' · ')}. 도넛은 가운데 구멍이 0점이고, 랜덤 모양은 게임마다 모양이 달라져요.</li>
