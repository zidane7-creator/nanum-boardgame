/* ---------- write form ---------- */
let wtype="sermon",editId=null;
function typeChips(el,cur,onPick,withAll){el.innerHTML=(withAll?'<button type="button" class="tchip t-all'+(cur.size===0?" on":"")+'" data-k="">전체</button>':"")+TK.map(k=>'<button type="button" class="tchip t-'+k+((withAll?cur.has(k):cur===k)?" on":"")+'" data-k="'+k+'">'+T[k].e+" "+T[k].n+'</button>').join("");
  el.querySelectorAll(".tchip").forEach(b=>b.onclick=()=>onPick(b.dataset.k))}
function passageHTML(){const og=(a,b,lab)=>'<optgroup label="'+lab+'">'+BOOKS.slice(a,b).map((n,i)=>'<option value="'+(a+i)+'">'+n+'</option>').join("")+'</optgroup>';
  return '<div class="passage"><select id="pb" aria-label="성경"><option value="">책 선택</option>'+og(0,39,"구약")+og(39,66,"신약")+'</select><select id="pc" aria-label="장"></select><select id="pv1" aria-label="시작 절"></select><span>~</span><select id="pv2" aria-label="끝 절"></select></div><div class="pv" id="pvText"></div>'}
function drawForm(e){const t=T[wtype],v=e||{};
  let h='<label>날짜 <input type="date" id="fdate" value="'+(v.date||today())+'" required></label>';
  t.f.forEach(f=>{const L=t.L[f];
    if(f==="title")h+='<label>'+L+' <input id="ftitle" maxlength="120" placeholder="'+L+'을 적어 주세요" value="'+esc(v.title)+'"></label>';
    if(f==="preacher")h+='<label>'+L+' <input id="fpreacher" maxlength="40" placeholder="예) 홍길동 목사" value="'+esc(v.preacher)+'"></label>';
    if(f==="passage")h+='<label>'+L+' '+passageHTML()+'</label>';
    if(f==="body")h+='<label>'+L+' <textarea id="fbody" placeholder="'+(wtype==="sermon"?"설교를 들으며 기억하고 싶은 내용을 적어 보세요":"오늘 주신 마음을 적어 보세요")+'">'+esc(v.body)+'</textarea></label>'});
  h+='<div class="factions"><button type="button" class="sm" id="fclear">비우기</button><button type="submit" class="go">💾 '+(editId?"수정한 내용 저장":"저장")+'</button></div>';
  $("form").innerHTML=h;
  if($("pb"))setupPassage(v.passage)}
function opts(n,sel,first){let h=first?'<option value="">'+first+'</option>':"";for(let i=1;i<=n;i++)h+='<option'+(i==sel?" selected":"")+'>'+i+'</option>';return h}
function setupPassage(p){const pb=$("pb"),pc=$("pc"),v1=$("pv1"),v2=$("pv2");
  const fillC=()=>{const b=pb.value;pc.innerHTML=b===""?'<option value="">장</option>':opts(VERSES[b].length,null,"장");pc.disabled=b==="";fillV()};
  const fillV=()=>{const b=pb.value,c=+pc.value;if(b===""||!c){v1.innerHTML='<option value="">절</option>';v2.innerHTML='<option value="">절</option>';v1.disabled=v2.disabled=true;show();return}
    const n=VERSES[b][c-1];v1.disabled=v2.disabled=false;v1.innerHTML=opts(n,null,"시작 절");fillV2()};
  const fillV2=()=>{const b=pb.value,c=+pc.value,s=+v1.value||1;if(b===""||!c)return;const n=VERSES[b][c-1];let h='<option value="">끝 절</option>';for(let i=s;i<=n;i++)h+='<option>'+i+'</option>';const keep=v2.value;v2.innerHTML=h;if(keep&&+keep>=s)v2.value=keep;show()};
  const show=()=>{const t=pText(readPassage());$("pvText").textContent=t?"📜 "+t:"책 → 장 → 절 순서로 골라 주세요 (절은 비워도 돼요)"};
  pb.onchange=fillC;pc.onchange=fillV;v1.onchange=fillV2;v2.onchange=show;
  if(p&&p.b!==""&&p.b!=null){pb.value=p.b;fillC();if(p.c){pc.value=p.c;fillV();if(p.v1){v1.value=p.v1;fillV2();if(p.v2)v2.value=p.v2}}show()}else fillC()}
function readPassage(){if(!$("pb")||$("pb").value==="")return null;const p={b:+$("pb").value,c:+$("pc").value||0,v1:+$("pv1").value||0,v2:+$("pv2").value||0};if(p.v1&&!p.v2)p.v2=p.v1;return p}
function pickW(k){if(!k)return;const keep=collect();wtype=k;typeChips($("wtypes"),wtype,pickW);drawForm({date:keep.date,title:keep.title,preacher:keep.preacher,body:keep.body,passage:keep.passage})}
function collect(){const g=id=>$(id)?$(id).value.trim():"";return{date:g("fdate")||today(),title:g("ftitle"),preacher:g("fpreacher"),body:$("fbody")?$("fbody").value:"",passage:readPassage()}}
$("form").addEventListener("submit",ev=>{ev.preventDefault();const v=collect();const t=T[wtype];
  if(!v.body.trim()&&!v.title&&!v.passage){toast("내용을 조금이라도 적어 주세요");return}
  const rec={type:wtype,date:v.date};t.f.forEach(f=>{if(f==="passage")rec.passage=v.passage;else rec[f]=v[f]});
  if(editId){const i=DB.findIndex(x=>x.id===editId);if(i>=0){DB[i]=Object.assign({id:editId,created:DB[i].created},rec,{updated:Date.now()})}const id=editId;endEdit();persist();refresh();toast("수정했어요");openView(id)}
  else{const r=Object.assign({id:uid(),created:Date.now()},rec);DB.push(r);persist();drawForm({});refresh();toast("저장했어요 🙏");openView(r.id)}
  try{gtag("event","meditation_save",{type:wtype})}catch(e){}});
$("form").addEventListener("click",e=>{if(e.target.id==="fclear"){if(confirm("입력한 내용을 비울까요?"))drawForm({})}});
function startEdit(id){const r=DB.find(x=>x.id===id);if(!r)return;editId=id;wtype=r.type;typeChips($("wtypes"),wtype,pickW);drawForm(r);$("editing").classList.add("show");closeView();$("writeCard").scrollIntoView({behavior:"smooth",block:"start"})}
function endEdit(){editId=null;$("editing").classList.remove("show")}
$("cancelEdit").onclick=()=>{endEdit();drawForm({})};

/* ---------- archive: filter / search / sort / period ---------- */
let FT=new Set();
const hay=r=>[T[r.type].n,r.title,r.preacher,r.body,pText(r.passage),r.passage?BOOKS[r.passage.b]:"",r.date,r.date&&r.date.replace(/-/g,".")].join(" \n ").toLowerCase();
function filtered(){const q=$("q").value.trim().toLowerCase(),words=q.split(/\s+/).filter(Boolean),from=$("from").value,to=$("to").value,dir=$("sort").value;
  return DB.filter(r=>(!FT.size||FT.has(r.type))&&(!from||r.date>=from)&&(!to||r.date<=to)&&(!words.length||(h=>words.every(w=>h.includes(w)))(hay(r))))
    .sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:a.created-b.created)*(dir==="asc"?1:-1))}
function hl(s,words){let o=esc(s);words.forEach(w=>{if(!w)return;const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");o=o.replace(re,m=>"<mark>"+m+"</mark>")});return o}
function itemHTML(r,words=[]){const t=T[r.type],head=r.title||pText(r.passage)||(r.body||"").split("\n")[0].slice(0,40)||t.n,sub=[r.title&&pText(r.passage),r.preacher].filter(Boolean).join(" · ");
  let sn=(r.body||"").replace(/\s+/g," ").trim();if(words.length){const i=sn.toLowerCase().indexOf(words[0]);if(i>40)sn="…"+sn.slice(i-30)}
  return '<button class="item" data-id="'+r.id+'" style="border-left-color:'+C(r.type+"-d")+'"><div class="meta"><span class="tag t-'+r.type+'">'+t.e+" "+t.n+'</span><span>'+fmtDate(r.date)+'</span>'+(r.updated?'<span style="opacity:.6">수정됨</span>':"")+'</div><div class="ti">'+hl(head,words)+'</div>'+(sub?'<div class="sn" style="opacity:.85">'+hl(sub,words)+'</div>':"")+(sn&&head!==sn?'<div class="sn">'+hl(sn.slice(0,160),words)+'</div>':"")+'</button>'}
function drawList(){const L=filtered(),words=$("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  $("total").textContent="전체 "+DB.length+"개";
  $("count").textContent=DB.length?(L.length+"개 찾았어요"+(FT.size||words.length||$("from").value||$("to").value?" (필터 적용 중)":"")):"";
  $("list").innerHTML=L.length?L.map(r=>itemHTML(r,words)).join(""):'<div class="empty">'+(DB.length?"조건에 맞는 묵상이 없어요.":"아직 저장한 묵상이 없어요. 위에서 첫 묵상을 적어 보세요 ✍️")+'</div>'}
function pickF(k){if(!k)FT.clear();else FT.has(k)?FT.delete(k):FT.add(k);typeChips($("ftypes"),FT,pickF,true);drawList()}
$("q").addEventListener("input",drawList);["from","to","sort"].forEach(id=>$(id).addEventListener("change",drawList));
document.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{const n=+b.dataset.range;if(!n){$("from").value="";$("to").value=""}else{const d=new Date();d.setDate(d.getDate()-n+1);$("from").value=ymd(d);$("to").value=today()}drawList()});

/* ---------- calendar ---------- */
let cy=new Date().getFullYear(),cm=new Date().getMonth(),selDay=null;
function drawCal(){const first=new Date(cy,cm,1),start=new Date(cy,cm,1-first.getDay()),by={};
  DB.forEach(r=>(by[r.date]=by[r.date]||[]).push(r));
  $("ym").textContent=cy+"년 "+(cm+1)+"월";
  let h=[..."일월화수목금토"].map(d=>'<div class="dow">'+d+'</div>').join("");
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=ymd(d),L=(by[k]||[]).sort((a,b)=>TK.indexOf(a.type)-TK.indexOf(b.type));
    if(i>=35&&d.getMonth()!==cm)break;
    h+='<button class="day'+(d.getMonth()!==cm?" out":"")+(k===today()?" today":"")+(k===selDay?" sel":"")+(d.getDay()===0?" sun":d.getDay()===6?" sat":"")+'" data-d="'+k+'" aria-label="'+k+' 묵상 '+L.length+'개"><span class="n">'+d.getDate()+'</span><span class="bars">'+L.slice(0,3).map(r=>'<i style="background:'+C(r.type)+'" title="'+T[r.type].n+'"></i>').join("")+'</span>'+(L.length>3?'<span class="more">+'+(L.length-3)+'</span>':"")+'</button>'}
  $("cal").innerHTML=h;
  $("legend").innerHTML=TK.map(k=>'<span><i style="background:'+C(k)+'"></i>'+T[k].n+'</span>').join("");
  drawDay()}
function drawDay(){if(!selDay){$("daylist").innerHTML="";return}const L=DB.filter(r=>r.date===selDay).sort((a,b)=>a.created-b.created);
  $("daylist").innerHTML='<div style="margin-bottom:6px">📌 '+fmtDate(selDay)+' — '+(L.length?L.length+"개":"기록 없음")+' <button class="sm" id="writeOn">이 날짜로 쓰기</button></div>'+L.map(r=>itemHTML(r)).join("");
  $("daylist").querySelectorAll(".item").forEach(b=>b.onclick=()=>openView(b.dataset.id));
  $("writeOn").onclick=()=>{if($("fdate"))$("fdate").value=selDay;$("writeCard").scrollIntoView({behavior:"smooth"});setTimeout(()=>$("fbody")&&$("fbody").focus(),400)}}
$("cal").addEventListener("click",e=>{const b=e.target.closest(".day");if(!b)return;selDay=selDay===b.dataset.d?null:b.dataset.d;const d=new Date(b.dataset.d+"T00:00:00");if(d.getMonth()!==cm){cy=d.getFullYear();cm=d.getMonth()}drawCal()});
$("prevM").onclick=()=>{cm--;if(cm<0){cm=11;cy--}drawCal()};$("nextM").onclick=()=>{cm++;if(cm>11){cm=0;cy++}drawCal()};
$("todayM").onclick=()=>{const d=new Date();cy=d.getFullYear();cm=d.getMonth();selDay=today();drawCal()};

/* ---------- view modal ---------- */
let viewId=null;
function fields(r){const t=T[r.type],out=[];t.f.forEach(f=>{if(f==="body")return;const v=f==="passage"?pText(r.passage):r[f];if(v)out.push([t.L[f],v])});return out}
function openView(id){const r=DB.find(x=>x.id===id);if(!r)return;viewId=id;const t=T[r.type];
  $("mhead").style.background=C(r.type);$("mtitle").textContent=t.e+" "+t.n+" · "+fmtDate(r.date);
  $("mbody").innerHTML='<dl>'+fields(r).map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>').join("")+'</dl>'+(r.body?'<div style="font-family:Jua;opacity:.7;margin-bottom:4px">'+esc(t.L.body)+'</div><div class="txt">'+esc(r.body)+'</div>':"");
  $("back").classList.add("show")}
function closeView(){$("back").classList.remove("show");viewId=null}
$("mclose").onclick=closeView;$("back").onclick=e=>{if(e.target.id==="back")closeView()};addEventListener("keydown",e=>{if(e.key==="Escape"&&viewId)closeView()});
$("mEdit").onclick=()=>startEdit(viewId);
$("mDel").onclick=()=>{const r=DB.find(x=>x.id===viewId);if(!r)return;if(!confirm("이 묵상을 삭제할까요? 삭제하면 되돌릴 수 없어요.\n(필요하면 먼저 내보내기나 전체 백업을 해 두세요)"))return;DB=DB.filter(x=>x.id!==viewId);persist();if(editId===r.id){endEdit();drawForm({})}closeView();refresh();toast("삭제했어요")};
document.querySelector(".mfoot").addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(!b)return;const r=DB.find(x=>x.id===viewId);if(r)exportAs(b.dataset.x,r)});

/* ---------- export ---------- */
function plain(r){const t=T[r.type];let s="["+t.n+"] "+fmtDate(r.date)+"\n";
  const icon={title:r.type==="praise"?"🎵":"📌",passage:"📜",preacher:"🙏"};
  t.f.forEach(f=>{if(f==="body")return;const v=f==="passage"?pText(r.passage):r[f];if(v)s+=icon[f]+" "+t.L[f]+": "+v+"\n"});
  if(r.body)s+="\n"+(r.type==="sermon"?"✏️ 메모":"✏️ 묵상")+"\n"+r.body.trim()+"\n";return s}
const fname=(r,ext)=>("묵상_"+T[r.type].n+"_"+r.date+(r.title?"_"+r.title:r.passage?"_"+pText(r.passage):"")).replace(/[\\/:*?"<>|\n\r]+/g," ").slice(0,80).trim()+"."+ext;
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
async function copyText(s){try{await navigator.clipboard.writeText(s);return true}catch(e){const ta=document.createElement("textarea");ta.value=s;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();return ok}}
async function renderCard(r){const t=T[r.type],x=$("xcard");
  x.innerHTML='<div class="xh" style="background:'+C(r.type)+'"><div class="k">'+t.e+" "+t.n+" · "+fmtDate(r.date)+'</div><div class="tt">'+esc(r.title||pText(r.passage)||t.n)+'</div></div><div class="xb"><dl>'+fields(r).map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>').join("")+'</dl><div class="xt">'+esc((r.body||"").trim())+'</div></div><div class="xf">치영의 교회 생활 즐기기 · 묵상저장소</div>';
  await document.fonts.ready;return html2canvas(x,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false})}
const xmlEsc=s=>String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let HWPX=null;
async function hwpxBlob(r){
  if(!HWPX){const files=["version.xml","settings.xml","Contents/header.xml","Contents/section0.xml","Contents/content.hpf","META-INF/container.xml","META-INF/container.rdf","META-INF/manifest.xml"];
    HWPX={};for(const f of files){const res=await fetch("hwpx/"+f);if(!res.ok)throw new Error(f);HWPX[f]=await res.text()}}
  const t=T[r.type],paras=[[t.e+" "+t.n+" · "+fmtDate(r.date),6],[r.title||pText(r.passage)||t.n,5],["",0]];
  fields(r).forEach(([k,v])=>paras.push([k+" : "+v,0]));
  if(r.body){paras.push(["",0],[t.L.body,6]);r.body.replace(/\r/g,"").split("\n").forEach(l=>paras.push([l,0]))}
  let id=1;const P=paras.map(([s,cp])=>'<hp:p id="'+(id++)+'" paraPrIDRef="0" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="'+cp+'">'+(s?'<hp:t>'+xmlEsc(s)+'</hp:t>':'<hp:t/>')+'</hp:run></hp:p>').join("");
  const sec=HWPX["Contents/section0.xml"].replace("</hs:sec>",P+"</hs:sec>");
  const now=new Date().toISOString().replace(/\.\d+Z$/,"Z");
  const hpf=HWPX["Contents/content.hpf"].replace(/synthetic-fixture-author/g,"치영의 교회 생활 즐기기").replace(/<opf:title\/>/,"<opf:title>"+xmlEsc(r.title||t.n)+"</opf:title>").replace(/(CreatedDate" content="text">)[^<]*/,"$1"+now).replace(/(ModifiedDate" content="text">)[^<]*/,"$1"+now).replace(/(name="date" content="text">)[^<]*/,"$1"+xmlEsc(fmtDate(r.date)));
  const z=new JSZip(),NF={createFolders:false};z.file("mimetype","application/hwp+zip",{compression:"STORE",createFolders:false});
  z.file("version.xml",HWPX["version.xml"],NF);z.file("Contents/header.xml",HWPX["Contents/header.xml"],NF);z.file("Contents/section0.xml",sec,NF);
  z.file("Preview/PrvText.txt",plain(r).slice(0,1000),NF);z.file("settings.xml",HWPX["settings.xml"],NF);
  z.file("META-INF/container.rdf",HWPX["META-INF/container.rdf"],NF);z.file("Contents/content.hpf",hpf,NF);z.file("META-INF/container.xml",HWPX["META-INF/container.xml"],NF);z.file("META-INF/manifest.xml",HWPX["META-INF/manifest.xml"],NF);
  return z.generateAsync({type:"blob",mimeType:"application/hwp+zip",compression:"DEFLATE"})}
async function exportAs(kind,r){try{
  if(kind==="kakao"){toast(await copyText(plain(r))?"복사했어요! 카톡 대화창에 붙여 넣으세요 💬":"복사하지 못했어요");return}
  if(kind==="txt"){download(new Blob(["\ufeff"+plain(r).replace(/\n/g,"\r\n")],{type:"text/plain;charset=utf-8"}),fname(r,"txt"));return}
  if(kind==="hwp"){toast("한글 문서를 만드는 중…");download(await hwpxBlob(r),fname(r,"hwpx"));toast("한글 파일(.hwpx)을 저장했어요");return}
  toast(kind==="pdf"?"PDF를 만드는 중…":"이미지를 만드는 중…");const cv=await renderCard(r);
  if(kind==="jpg"){cv.toBlob(b=>download(b,fname(r,"jpg")),"image/jpeg",.92);return}
  if(kind==="pdf"){const{jsPDF}=window.jspdf,pdf=new jsPDF({unit:"mm",format:"a4"}),W=210,H=297,m=12,iw=W-m*2,pagePx=Math.floor(cv.width*(H-m*2)/iw);
    for(let y=0,pg=0;y<cv.height;y+=pagePx,pg++){const h=Math.min(pagePx,cv.height-y),c=document.createElement("canvas");c.width=cv.width;c.height=h;c.getContext("2d").drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      if(pg)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",m,m,iw,h*iw/cv.width)}
    pdf.save(fname(r,"pdf"))}
  try{gtag("event","meditation_export",{kind})}catch(e){}
}catch(e){console.error(e);toast("내보내기에 실패했어요. 다시 시도해 주세요")}}

/* ---------- backup ---------- */
$("backup").onclick=()=>download(new Blob([JSON.stringify({app:"meditations",v:1,items:DB},null,1)],{type:"application/json"}),"묵상저장소-백업-"+today()+".json");
$("restore").onclick=()=>$("file").click();
$("file").onchange=async()=>{const f=$("file").files[0];$("file").value="";if(!f)return;try{const o=JSON.parse(await f.text()),items=Array.isArray(o)?o:o.items;if(!Array.isArray(items))throw 0;
  const ok=items.filter(r=>r&&T[r.type]&&/^\d{4}-\d{2}-\d{2}$/.test(r.date));const have=new Set(DB.map(r=>r.id));let n=0;ok.forEach(r=>{if(!r.id)r.id=uid();if(!have.has(r.id)){DB.push(r);n++}});persist();refresh();toast(n+"개를 불러왔어요 (겹치는 글은 건너뛰었어요)")}catch(e){alert("묵상저장소 백업 파일이 아니에요.")}};

function refresh(){drawList();drawCal()}
typeChips($("wtypes"),wtype,pickW);typeChips($("ftypes"),FT,pickF,true);drawForm({});refresh();
</script>
