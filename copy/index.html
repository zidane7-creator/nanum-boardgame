  if(type==="palm"){const th=50+150*Math.pow(p,.85),tw=6+8*p,top=G-th;
    let seg="";for(let y=G;y>top;y-=10)seg+=`<path d="M${cx-tw} ${y} q${tw} 5 ${tw*2} 0" stroke="#7a5534" stroke-width="1.5" fill="none"/>`;
    h+=`<path d="M${cx-tw} ${G} Q${cx-tw*.6} ${(G+top)/2} ${cx-tw*.5} ${top} L${cx+tw*.5} ${top} Q${cx+tw*.6} ${(G+top)/2} ${cx+tw} ${G}Z" fill="${T.trunk}" stroke="#5b3a1e" stroke-width="2"/>${seg}`;
    const nf=Math.round(4+6*p),L=30+70*p;for(let i=0;i<nf;i++){const a=-Math.PI+i*Math.PI/(nf-1)+(R()-.5)*.2,ex=cx+Math.cos(a)*L,ey=top+Math.sin(a)*L*.55+L*.25;
      h+=`<path d="M${cx} ${top} Q${(cx+ex)/2} ${top-L*.35} ${ex} ${ey}" stroke="${T.leaf[i%3]}" stroke-width="${6+6*p}" fill="none" stroke-linecap="round"/>`}
    if(p>=.75&&p<1)for(let i=0;i<5;i++)h+=`<circle cx="${cx-14+i*7}" cy="${top+8}" r="3" fill="${T.blossom}"/>`;
    if(p>=1)for(let i=0;i<14;i++)h+=`<circle cx="${cx-18+(i%7)*6+R()*3}" cy="${top+10+Math.floor(i/7)*7}" r="4" fill="${T.fruit}" stroke="#4a2a10" stroke-width="1"/>`;
    return wrap(h)}
  /* 줄기와 가지 */
  const th=40+100*Math.pow(p,.8),tw=4+13*p,top=G-th;
  h+=`<path d="M${cx-tw} ${G} C${cx-tw*.7} ${G-th*.4} ${cx-tw*.4} ${G-th*.7} ${cx-tw*.3} ${top} L${cx+tw*.3} ${top} C${cx+tw*.4} ${G-th*.7} ${cx+tw*.7} ${G-th*.4} ${cx+tw} ${G}Z" fill="${T.trunk}" stroke="#4a3220" stroke-width="2"/>`;
  if(p>.25){const bl=20+60*p;h+=`<path d="M${cx} ${top+th*.25} q${-bl*.5} ${-bl*.2} ${-bl} ${-bl*.6}" stroke="${T.trunk}" stroke-width="${3+5*p}" fill="none" stroke-linecap="round"/><path d="M${cx} ${top+th*.35} q${bl*.5} ${-bl*.2} ${bl} ${-bl*.55}" stroke="${T.trunk}" stroke-width="${3+5*p}" fill="none" stroke-linecap="round"/>`}
  /* 잎 덩어리: 자랄수록 크고 많아져요 */
  const cr=18+74*p,ccy=top-cr*.3,blobs=Math.round(5+16*p),pts=[];
  for(let i=0;i<blobs;i++){const a=R()*Math.PI*2,d=Math.sqrt(R())*cr*.75;pts.push([cx+Math.cos(a)*d*1.15,ccy+Math.sin(a)*d*.8,cr*(.32+R()*.2)])}
  pts.sort((a,b)=>a[1]-b[1]);
  h+=`<g stroke="#2f5a26" stroke-width="2">${pts.map((q,i)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${q[2].toFixed(1)}" fill="${T.leaf[i%3]}"/>`).join("")}</g>`;
  h+=`<g stroke="none">${pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${q[2].toFixed(1)}" fill="${T.leaf[(Math.round(q[0])+1)%3]}"/>`).join("")}</g>`;
  /* 꽃(거의 다 자랐을 때), 열매(다 썼을 때) */
  const spots=[];const R2=rnd(type.length*331+11);for(let i=0;i<T.fr+4;i++){const a=R2()*Math.PI*2,d=Math.sqrt(R2())*cr*.7;spots.push([cx+Math.cos(a)*d*1.1,ccy+Math.sin(a)*d*.75])}
  if(p>=.75&&p<1)h+=spots.map(s=>`<g transform="translate(${s[0].toFixed(1)} ${s[1].toFixed(1)})">${[0,72,144,216,288].map(r=>`<ellipse rx="3" ry="5" transform="rotate(${r}) translate(0 -4)" fill="${T.blossom}" stroke="#fff" stroke-width=".5"/>`).join("")}<circle r="2.2" fill="#f5b82e"/></g>`).join("");
  if(p>=1)h+=spots.map(s=>fruit(type,s[0],s[1],T)).join("");
  return wrap(h);
  function wrap(x){return`<svg viewBox="0 0 ${W} ${H}" aria-label="${T.n} ${Math.round(p*100)}% 자람">${x}</svg>`}}
function fruit(type,x,y,T){x=x.toFixed(1);y=y.toFixed(1);
  if(type==="olive")return`<ellipse cx="${x}" cy="${y}" rx="4" ry="5.5" fill="${T.fruit}" stroke="#2a1f33" stroke-width="1"/>`;
  if(type==="fig")return`<path d="M${x} ${+y-7} q-7 4 -6 9 q2 6 6 6 q4 0 6 -6 q1 -5 -6 -9z" fill="${T.fruit}" stroke="#3d1f36" stroke-width="1.2"/>`;
  if(type==="pomegranate")return`<circle cx="${x}" cy="${y}" r="7" fill="${T.fruit}" stroke="#7a1c22" stroke-width="1.2"/><path d="M${+x-3} ${+y-6} l1.5 -3 l1.5 2 l1.5 -2 l1.5 3z" fill="#a8242c"/><ellipse cx="${+x-2.5}" cy="${+y-2.5}" rx="2" ry="1.3" fill="#fff" opacity=".5"/>`;
  return`<circle cx="${x}" cy="${y}" r="6.5" fill="${T.fruit}" stroke="#7a1c22" stroke-width="1.2"/><path d="M${x} ${+y-6} q1 -4 3 -5" stroke="#5b3a1e" stroke-width="1.5" fill="none"/><ellipse cx="${+x-2.2}" cy="${+y-2}" rx="2" ry="1.3" fill="#fff" opacity=".55"/>`}

/* ---------- 저장 (이 기기) ---------- */
let DB={list:[]};try{const o=JSON.parse(localStorage.getItem("copy-trees")||"null");if(o&&Array.isArray(o.list))DB=o}catch(e){}
const save=()=>{try{localStorage.setItem("copy-trees",JSON.stringify(DB))}catch(e){toast("기기 저장 공간이 모자라요")}};
const txKey=(id,c)=>"copy-tx:"+id+":"+c;
const getTx=(id,c)=>{try{return localStorage.getItem(txKey(id,c))||""}catch(e){return""}};
const setTx=(id,c,v)=>{try{localStorage.setItem(txKey(id,c),v)}catch(e){toast("기기 저장 공간이 모자라요")}};
const need=(b,c)=>Math.max(30,((VERSES[b]&&VERSES[b][c-1])||20)*12); /* 이만큼은 써야 '다 썼어요'를 누를 수 있어요 (대략 한 절 12자) */

/* ---------- 화면 ---------- */
let pickT="olive",pickB=42,cur=null,curC=1,ver="GAE";
function home(){cur=null;const L=DB.list;
  $("app").innerHTML=`<h1 class="sc-sky">필사나무 키우기</h1><p class="sub sc-sky">한 장을 쓸 때마다 나무가 자라고, 한 권을 다 쓰면 열매를 맺어요</p>
  <div class="card"><h2>🌱 새 필사 시작하기</h2>
    <div class="row"><b>어떤 책을 쓸까요?</b><select id="bk">${BOOKS.map((b,i)=>`<option value="${i}" ${i===pickB?"selected":""}>${b[0]} (${b[1]}장)</option>`).join("")}</select></div>
    <div style="margin-top:10px"><b>어떤 나무를 키울까요?</b></div>
    <div class="trees">${Object.keys(TREES).map(k=>`<button data-t="${k}" class="${k===pickT?"on":""}">${treeSVG(k,1)}<span>${TREES[k].n}</span></button>`).join("")}</div>
    <div class="row" style="justify-content:center"><button class="go" id="mk" style="font-size:20px;padding:10px 26px">🌱 씨앗 심기</button></div></div>
  ${L.length?`<div class="card"><h2>🌳 내 필사나무 (${L.length})</h2><div class="list">${L.map((p,i)=>{const N=BOOKS[p.b][1],d=p.done.length;
    return`<div class="item" data-i="${i}">${treeSVG(p.tree,d/N)}<div style="flex:1;min-width:0"><div style="font-size:18px">${esc(BOOKS[p.b][0])}</div><div class="hint">${TREES[p.tree].n} · ${d}/${N}장${d===N?" · 🎉 열매":""}</div><div class="bar"><i style="width:${Math.round(d/N*100)}%"></i></div></div></div>`}).join("")}</div></div>`:""}`;
  document.querySelectorAll(".trees [data-t]").forEach(b=>b.onclick=()=>{pickT=b.dataset.t;document.querySelectorAll(".trees [data-t]").forEach(x=>x.classList.toggle("on",x===b))});
  $("bk").onchange=()=>pickB=+$("bk").value;
  $("mk").onclick=()=>{const b=+$("bk").value;DB.list.unshift({id:Date.now().toString(36),b,tree:pickT,done:[],at:Date.now()});save();openP(0)};
  document.querySelectorAll(".item").forEach(el=>el.onclick=()=>openP(+el.dataset.i))}
function nextChap(p){const N=BOOKS[p.b][1];for(let c=1;c<=N;c++)if(!p.done.includes(c))return c;return 1}
function openP(i,c,grew){cur=i;const p=DB.list[i];if(!p){home();return}const N=BOOKS[p.b][1],d=p.done.length;curC=c||nextChap(p);
  const T=TREES[p.tree],stage=d===0?"씨앗":d/N<.08?"새싹":d/N<.3?"어린 나무":d/N<.75?"자라는 나무":d<N?"꽃이 핀 나무":"열매 맺은 나무";
  $("app").innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="sm" id="back">← 내 필사나무</button><span class="hint">${esc(BOOKS[p.b][0])} 필사 · ${T.n}</span></div>
  <div class="lay"><div>
    <div class="card"><div class="treebox${grew?" grow":""}">${treeSVG(p.tree,d/N,true)}</div>
      <div class="stat">${esc(BOOKS[p.b][0])} <b>${d}</b>/${N}장 · ${stage}</div>
      ${d===N?`<p style="text-align:center;margin:0">🎉 한 권을 다 썼어요! ${T.n}가 열매를 맺었어요<br><span class="hint">“${esc(T.verse)}”</span></p>`:`<p class="hint" style="text-align:center;margin:0">한 장을 쓸 때마다 나무가 자라요</p>`}</div>
    <div class="card"><h2>📖 장 고르기</h2><div class="chaps">${Array.from({length:N},(_,k)=>k+1).map(k=>`<button data-c="${k}" class="${p.done.includes(k)?"done":""}${k===curC?" cur":""}">${k}</button>`).join("")}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="sm" id="del">이 필사나무 지우기</button></div></div>
  </div><div>
    <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">✍️ ${esc(BOOKS[p.b][0])} ${curC}장 ${p.done.includes(curC)?'<span class="hint">· 다 쓴 장</span>':""}</h2>
      <div class="vers"><button data-v="GAE" class="${ver==="GAE"?"on":""}">개역개정</button><button data-v="SAENEW" class="${ver==="SAENEW"?"on":""}">새번역</button></div></div>
      <p class="hint" style="margin:6px 0">위의 본문을 보며 아래에 따라 써요. <b>장·절 번호는 쓰지 않고 말씀만</b> 적으면 돼요.</p>
      <div class="ref" id="ref"><iframe id="rf" title="성경 본문" referrerpolicy="no-referrer" scrolling="no"></iframe></div>
      <div class="vnow"><span>✍️ 지금 <b id="vNow">1</b>절 쓰는 중 <span class="hint" id="vTot"></span></span><span class="hint">한 절을 다 쓰면 Enter로 줄을 바꿔요</span></div>
      <div class="ed"><div class="bd" id="bd" aria-hidden="true"></div><textarea id="tx" spellcheck="false" placeholder="1절부터 말씀을 적어 보세요. 한 절이 끝나면 Enter를 눌러요"></textarea></div>
      <div class="prog"><i id="pg"></i></div><div class="row" style="justify-content:space-between"><span class="hint" id="cnt"></span>
      <div class="row"><button class="sm" id="prevC">◀ 이전 장</button><button class="go" id="doneC"></button><button class="sm" id="nextC">다음 장 ▶</button></div></div></div>
  </div></div>`;
  $("back").onclick=home;
  $("del").onclick=()=>{if(!confirm(`${BOOKS[p.b][0]} 필사나무와 쓴 글을 모두 지울까요?`))return;for(let k=1;k<=N;k++){try{localStorage.removeItem(txKey(p.id,k))}catch(e){}}DB.list.splice(i,1);save();home()};
  document.querySelectorAll(".chaps [data-c]").forEach(b=>b.onclick=()=>openP(i,+b.dataset.c));
  document.querySelectorAll(".vers [data-v]").forEach(b=>b.onclick=()=>{ver=b.dataset.v;openP(i,curC)});
  $("prevC").disabled=curC<=1;$("nextC").disabled=curC>=N;$("prevC").onclick=()=>openP(i,curC-1);$("nextC").onclick=()=>openP(i,curC+1);
  /* 본문: 대한성서공회 성경 읽기 페이지에서 본문 칸만 잘라 보여 줘요 */
  const rf=$("rf"),ref=$("ref"),vn=(VERSES[p.b]&&VERSES[p.b][curC-1])||30,HH=337+vn*110+900;
  const fit=()=>{const sc=ref.clientWidth/647;rf.style.height=HH+"px";rf.style.transform=`translate(${-30*sc}px,${-337*sc}px) scale(${sc})`;let z=ref.querySelector(".sz");if(!z){z=document.createElement("div");z.className="sz";ref.appendChild(z)}z.style.height=(HH-337)*sc+"px"};
  rf.src=`https://www.bskorea.or.kr/bible/korbibReadpage.php?version=${ver}&book=${BSK[p.b]}&chap=${curC}`;fit();addEventListener("resize",fit);
  const tx=$("tx"),nd=need(p.b,curC);tx.value=getTx(p.id,curC);
  const upd=()=>{/* 장·절 번호는 빼고 글자만 세요 */const n=tx.value.replace(/[0-9\s.,:;'"“”‘’!?·\-()]/g,"").length,r=Math.min(1,n/nd);$("pg").style.width=r*100+"%";
    $("cnt").textContent=`${n.toLocaleString()}자 · ${r>=1?"다 쓸 만큼 썼어요":"조금 더 써 주세요"}`;const dn=p.done.includes(curC);
    $("doneC").textContent=dn?"✔ 다 쓴 장":"🌱 이 장 다 썼어요";$("doneC").disabled=dn||r<1};
  /* 줄마다 절 번호: Enter로 나눈 줄 하나가 한 절이에요. 커서가 있는 줄이 지금 쓰는 절 */
  const bd=$("bd");$("vTot").textContent=`(${curC}장은 ${vn}절까지)`;let lastV=0;
  const curLine=()=>tx.value.slice(0,tx.selectionStart).split("\n").length;
  /* 본문은 지금 쓰는 절 근처로 자동 스크롤 (공식 페이지라 위치는 대략이에요) */
  
  /* 공식 페이지 배치: 1절이 위에서 약 612px, 한 줄 32px, 한 줄에 한글 약 42자.
     이미 쓴 절은 내가 쓴 글 길이로 몇 줄인지 어림하고, 아직 안 쓴 절은 두 줄로 쳐요 */
  const units=t=>{let u=0;for(const ch of t)u+=/\s/.test(ch)?.35:/[0-9]/.test(ch)?.55:/[.,:;!?'"“”‘’()·\-]/.test(ch)?.4:1;return u};
  const linesOf=(t,k)=>t&&t.trim()?Math.max(1,Math.ceil((units(t.trim())+String(k).length*.55+1.1)/42)):2;
  const scrollRef=v=>{const sc=ref.clientWidth/647,L=tx.value.split("\n");let y=612;for(let k=1;k<Math.min(v,vn);k++)y+=linesOf(L[k-1],k)*32;
    const top=(y-337)*sc;
    ref.scrollTo({top:Math.max(0,top-40),behavior:"smooth"})};
  const paint=()=>{const lines=tx.value.split("\n"),cv=curLine();
    bd.innerHTML=lines.map((l,k)=>`<div class="vl${k+1===cv?" cur":k+1<cv&&l.trim()?" dn":""}${k+1>vn?" over":""}"><span class="vn">${k+1<cv&&l.trim()?"✓":""}${k+1}</span>${esc(l)||"&#8203;"}</div>`).join("");
    bd.scrollTop=tx.scrollTop;const v=Math.min(cv,vn);$("vNow").textContent=cv>vn?`${vn}절 다음`:cv;if(v!==lastV){lastV=v;scrollRef(v)}else{clearTimeout(paint.t);paint.t=setTimeout(()=>scrollRef(v),600)}};
  let st;tx.oninput=()=>{upd();paint();clearTimeout(st);st=setTimeout(()=>setTx(p.id,curC,tx.value),400)};
  /* 필사는 직접 쳐서 써요: 붙여넣기·끌어다 놓기는 막아요 */
  const noPaste=e=>{e.preventDefault();toast("필사는 한 글자씩 직접 쳐서 써요 ✍️ (붙여넣기는 안 돼요)",2600)};
  tx.addEventListener("paste",noPaste);tx.addEventListener("drop",noPaste);tx.addEventListener("dragover",e=>e.preventDefault());
  tx.addEventListener("beforeinput",e=>{if(/^insertFrom(Paste|Drop|Yank)/.test(e.inputType))noPaste(e)});
  ["keyup","click","select"].forEach(ev=>tx.addEventListener(ev,paint));tx.addEventListener("scroll",()=>{bd.scrollTop=tx.scrollTop});
  new ResizeObserver(paint).observe(tx);upd();paint();
  $("doneC").onclick=()=>{setTx(p.id,curC,tx.value);if(!p.done.includes(curC))p.done.push(curC);p.done.sort((a,b)=>a-b);save();
    const d2=p.done.length;toast(d2===N?`🎉 ${BOOKS[p.b][0]}를 다 썼어요! 나무에 열매가 맺혔어요`:`🌱 ${curC}장 완료! 나무가 자랐어요 (${d2}/${N})`,3000);openP(i,nextChap(p),true)}}
home();
</script>
<script src="../assets/scene.js?v=20261116d"></script><script src="../assets/home.js?v=20261118"></script>
