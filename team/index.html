*{box-sizing:border-box}

@media (max-width:520px){.blk.l2{padding-left:14px}.blk.l3{padding-left:28px}.blk.l4{padding-left:42px}.toolbar .hint{display:none}}

/* calendar */
.calttl{font-family:var(--f-mono);font-weight:500;min-width:7.5em;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:10px}

.cell{min-height:96px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);padding:4px 5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.cell:nth-child(7n+1){border-left:0}
.cell:hover{background:var(--sunk)}
.cell.out{background:color-mix(in srgb,var(--sunk) 55%,var(--surface))}.cell.out .dn{opacity:.45}
.cell.wed{box-shadow:inset 0 3px 0 var(--accent)}
.cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
.dn{font-family:var(--f-mono);font-size:.82rem;line-height:1.3}
.attc{display:block;font-size:.68rem;line-height:1.35;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.attc .short{display:none;font-family:var(--f-mono)}
@media (max-width:900px){.attc .full{display:none}.attc .short{display:inline}}
.cs-att{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;margin-bottom:10px;border-radius:6px;background:color-mix(in srgb,var(--accent) 10%,transparent);font-size:.9rem}
.cs-att b{color:var(--accent)}
.lg.bday{padding:0;border-bottom:0}
.cs-att .btn{padding:3px 8px;font-size:.8rem}
.cell.today .dn{background:var(--accent);color:var(--accent-ink)!important;border-radius:999px;padding:0 6px;align-self:flex-start}
.pill{display:block;font-size:.7rem;line-height:1.35;padding:1px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pill.bday{background:color-mix(in srgb,var(--c-bday) 16%,transparent);color:var(--c-bday)}
.pill.meet{background:color-mix(in srgb,var(--c-meet) 16%,transparent);color:var(--c-meet)}
.pill.ev{background:color-mix(in srgb,var(--c-ev) 18%,transparent);color:var(--c-ev)}
.more{font-size:.68rem;color:var(--muted)}
.dots{display:none;gap:2px;flex-wrap:wrap}
@media (max-width:640px){.cell{min-height:58px}.pill,.more{display:none}.dots{display:flex}.dots .lg{width:6px;height:6px;border-radius:50%}}
.cside{padding:14px 16px}
.cs-h{font-weight:600;font-family:var(--f-mono);margin-bottom:8px}
.cs-h2{font-weight:600;font-size:.9rem;margin-bottom:2px}
.cs-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.cs-it{display:flex;gap:8px;align-items:flex-start}
.cs-it .lg{margin-top:7px}
.cs-t{flex:1;min-width:0;overflow-wrap:anywhere}
.cs-it .btn{padding:3px 8px;font-size:.8rem}
.evform{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.ev2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,6px)}}}

<script>
(function(){
'use strict';
const TEAMS=['싱어팀','세션팀','방송팀'];
const ROLES=['팀장','회계','서기','싱어팀장','세션팀장','방송팀장'];
const TCLS={'싱어팀':'t1','세션팀':'t2','방송팀':'t3'};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const DAY=864e5;
const toT=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const fromT=t=>new Date(t).toISOString().slice(0,10);
const WEDS=[];
const todayStr=()=>{const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())};
const DOW='일월화수목금토';
/* ---------- 여러 사역팀: 목록(홈) → 팀마다 따로 저장 ---------- */
const TL_KEY='team-admin-list';
function loadTeams(){let L=[];try{L=JSON.parse(localStorage.getItem(TL_KEY)||'[]')||[]}catch(e){}
  // 예전(팀 목록 이전)에 쓰던 기록이 있으면 첫 팀으로 이어 줌
  try{if(!L.length&&localStorage.getItem('team-admin-v1')){L=[{id:'t0',name:'우리 사역팀',year:2027,start:'2026-11-09',key:'team-admin-v1',created:Date.now()}];localStorage.setItem(TL_KEY,JSON.stringify(L))}}catch(e){}
  return L}
function saveTeams(L){try{localStorage.setItem(TL_KEY,JSON.stringify(L))}catch(e){}}
const TID=new URLSearchParams(location.search).get('t');
const TEAM=TID?loadTeams().find(x=>x.id===TID):null;
if(TID&&!TEAM){location.replace('./');return}
if(!TEAM){teamHome();return}
const TNAME=TEAM.name,TYEAR=+TEAM.year||2027,TSTART=TEAM.start||(TYEAR+'-01-01'),TEND=TYEAR+'-12-31';
document.title=TNAME+' '+TYEAR+' | 사역팀 관리부';$('#teamName').innerHTML=esc(TNAME)+'<span class="yr">'+TYEAR+'</span>';$('#backHome').hidden=false;
const LS_KEY=TEAM.key;
const fmtLong=s=>{const[y,m,d]=s.split('-');return `${y}. ${+m}. ${+d}. (${DOW[new Date(toT(s)).getUTCDay()]})`};
const fmtShort=s=>{const[,m,d]=s.split('-');return `${+m}/${+d}`};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const clone=o=>JSON.parse(JSON.stringify(o));
/* 출석일 = 고른 요일(매주) + 실제로 출석 기록이 있는 날 + 지금 보고 있는 날 */
function buildDates(){const day=+((S.cfg&&S.cfg.day)??3),set=new Set();
  let t=toT(TSTART);while(new Date(t).getUTCDay()!==day)t+=DAY;for(;t<=toT(TEND);t+=7*DAY)set.add(fromT(t));
  Object.keys(S.att||{}).forEach(d=>{const r=S.att[d]&&S.att[d].records;if(r&&Object.keys(r).length)set.add(d)});
  try{if(UI.attDate)set.add(UI.attDate)}catch(e){}
  const ds=[...set].sort();WEDS.length=0;WEDS.push(...ds);
  const ms=[...new Set(ds.map(w=>w.slice(0,7)))];MONTHS.length=0;MONTHS.push(...ms);
  const ys=[...new Set(ms.map(m=>m.slice(0,4)))];YEARS.length=0;YEARS.push(...ys)}
const dayName=()=>DOW[+((S.cfg&&S.cfg.day)??3)]+'요일';
function defaultWed(){const t=todayStr();let c=WEDS[0];for(const w of WEDS){if(w<=t)c=w;else break}return c}
const MONTHS=[],YEARS=[];

/* ---------- state ---------- */
const S={cfg:{day:3},members:[],att:{},minutes:[],events:[],worship:{},dues:{},ledger:[],acct:{fee:10000,carry:0},mode:'init',readOnly:false,loaded:false,loadNote:''};
buildDates();
const UI={view:'attendance',statFormer:true,calMonth:todayStr().slice(0,7),calSel:todayStr(),calDel:null,attDate:defaultWed(),attTeam:'all',statMode:'month',statMonth:defaultWed().slice(0,7),statYear:defaultWed().slice(0,4),statTeam:'all',
  edId:null,confirmDel:null,confirmMin:false,mEdit:null,mErr:''};
let ED=null; // minutes draft
let DB=null;
try{const ms=JSON.parse(localStorage.getItem('team-msort')||'null');if(ms&&ms.k)UI.mSort=ms}catch(e){}

function sortedMembers(team,who){
  who=who||'active';
  return S.members.filter(m=>(who==='all'||(who==='former')===!!m.former)&&(!team||team==='all'||m.team===team))
    .sort((a,b)=>(TEAMS.indexOf(a.team)-TEAMS.indexOf(b.team))||String(a.name).localeCompare(String(b.name),'ko'));
}

/* ---------- persistence ---------- */
const timers={},chains={},inflight={};let failed=false;
function setSync(){
  const el=$('#sync'),tx=$('#syncText');const busy=Object.values(inflight).some(Boolean);
  el.className='sync '+(failed?'err':busy?'saving':'ok');
  if(S.mode==='init'){el.className='sync';tx.textContent='연결 중…';return}
  tx.textContent=failed?'저장 실패 — 다시 시도해 주세요':busy?'저장 중…':S.mode==='db'?(S.readOnly?'읽기 전용':'저장됨'):'이 브라우저에 저장됨';
}
let lastErr=null;
function errText(e){
  const c=(e&&e.code)||'unknown',msg=(e&&e.message)||String(e||'');
  const why={
    invalid_argument:'저장 권한이 없다고 거부됐어요. 이 페이지를 만든 계정으로 로그인해서 열었는지 확인해 주세요.',
    revoked:'페이지 연결이 끊겼어요. 새로고침(F5)한 뒤 다시 저장해 주세요.',
    not_granted:'이 화면에서는 저장소를 쓸 수 없어요. 새로고침(F5)한 뒤 다시 해 주세요.',
    capability_disabled:'이 화면에서는 저장소를 쓸 수 없어요. 새로고침(F5)한 뒤 다시 해 주세요.',
    capability_removed:'이 화면에서는 저장소를 쓸 수 없어요. 새로고침(F5)한 뒤 다시 해 주세요.',
    quota_exceeded:'저장 공간이 가득 찼어요.',
    resource_exhausted:'짧은 시간에 저장이 너무 많았어요. 잠시 후 다시 눌러 주세요.',
    unavailable:'저장소가 잠시 응답하지 않아요. 잠시 후 다시 눌러 주세요.'
  }[c]||'알 수 없는 오류예요.';
  return `저장하지 못했어요 — ${why} [오류 코드: ${c}${msg&&msg!==c?' / '+msg.slice(0,120):''}]`;
}
function persist(key,fn,delay){
  clearTimeout(timers[key]);inflight[key]=(inflight[key]||0)+1;setSync();
  const run=()=>S.mode==='db'?fn():saveLocal();
  timers[key]=setTimeout(()=>{
    chains[key]=(chains[key]||Promise.resolve()).then(run)
      .catch(e=>{if(e&&e.code==='unavailable')return new Promise(r=>setTimeout(r,600+Math.random()*900)).then(run);throw e})
      .then(()=>{failed=false;lastErr=null;if(S.saveErr){S.saveErr='';requestRender()}},
            e=>{failed=true;lastErr=e;S.saveErr=errText(e);toast(S.saveErr);requestRender();try{console.error('save failed',key,e)}catch(_){}})
      .finally(()=>{inflight[key]=0;setSync()});
  },delay||0);
}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({cfg:S.cfg,members:S.members,att:S.att,minutes:S.minutes,events:S.events,worship:S.worship,dues:S.dues,ledger:S.ledger,acct:S.acct}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(d){if(d.cfg)S.cfg=Object.assign({day:3},d.cfg);S.members=d.members||[];S.att=d.att||{};S.minutes=d.minutes||[];S.events=d.events||[];S.worship=d.worship||{};S.dues=d.dues||{};S.ledger=d.ledger||[];if(d.acct)S.acct=Object.assign({fee:10000,carry:0},d.acct)}}catch(e){}}
function saveEvent(ev){const i=S.events.findIndex(x=>x.id===ev.id);if(i>=0)S.events[i]=ev;else S.events.push(ev);persist('e:'+ev.id,()=>DB.collection('events').doc(ev.id).set(strip(ev)))}
function deleteEvent(id){S.events=S.events.filter(e=>e.id!==id);persist('e:'+id,()=>DB.collection('events').doc(id).delete())}
const duesDirty={};let acctDirty=0;
function saveDues(mo){duesDirty[mo]=(duesDirty[mo]||0)+1;const v=duesDirty[mo];
  persist('d:'+mo,()=>DB.doc('dues/'+mo).set(clone(S.dues[mo])).then(()=>{if(duesDirty[mo]===v)delete duesDirty[mo]}))}
function saveAcct(delay){acctDirty++;const v=acctDirty;persist('acct',()=>DB.doc('settings/acct').set(clone(S.acct)).then(()=>{if(acctDirty===v)acctDirty=0}),delay)}
const ledDirty={};
function saveLedger(it,delay){const i=S.ledger.findIndex(x=>x.id===it.id);if(i>=0)S.ledger[i]=it;else S.ledger.push(it);
  ledDirty[it.id]=(ledDirty[it.id]||0)+1;const v=ledDirty[it.id];
  persist('l:'+it.id,()=>DB.collection('ledger').doc(it.id).set(strip(clone(S.ledger.find(x=>x.id===it.id)||it))).then(()=>{if(ledDirty[it.id]===v)delete ledDirty[it.id]}),delay)}
function deleteLedger(id){S.ledger=S.ledger.filter(x=>x.id!==id);persist('l:'+id,()=>DB.collection('ledger').doc(id).delete())}
const wDirty={};
function saveWorship(date,delay){wDirty[date]=(wDirty[date]||0)+1;const v=wDirty[date];
  persist('w:'+date,()=>DB.doc('worship/'+date).set(clone(S.worship[date])).then(()=>{if(wDirty[date]===v)delete wDirty[date]}),delay)}
function deleteWorship(date){delete S.worship[date];persist('w:'+date,()=>DB.doc('worship/'+date).delete())}

const strip=o=>{const c=clone(o);delete c.id;return c};
function saveMember(m){
  const i=S.members.findIndex(x=>x.id===m.id);if(i>=0)S.members[i]=m;else S.members.push(m);
  persist('m:'+m.id,()=>DB.collection('members').doc(m.id).set(strip(m)));
}
function deleteMember(id){
  S.members=S.members.filter(m=>m.id!==id);
  persist('m:'+id,()=>DB.collection('members').doc(id).delete());
}
const attDirty={};
function saveAtt(date,delay){
  attDirty[date]=(attDirty[date]||0)+1;const v=attDirty[date];
  persist('a:'+date,()=>DB.doc('attendance/'+date).set(clone(S.att[date])).then(()=>{if(attDirty[date]===v)delete attDirty[date]}),delay);
}
function saveMinute(delay){
  if(!ED)return;ED.updatedAt=Date.now();const snap=clone(ED);
  const i=S.minutes.findIndex(x=>x.id===snap.id);if(i>=0)S.minutes[i]=snap;else S.minutes.push(snap);
  persist('n:'+snap.id,()=>DB.collection('minutes').doc(snap.id).set(strip(snap)),delay);
}
function deleteMinute(id){
  S.minutes=S.minutes.filter(m=>m.id!==id);

}

let pendingRender=false;
const editing=()=>{const a=document.activeElement;return a&&$('#view').contains(a)&&a.matches('input:not([type=checkbox]),textarea,select')};

document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!editing()){pendingRender=false;render()}},0));
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,msg.length>40?6000:2600)}

      (UI.confirmDel===m.id?`<span class="sub">기록까지 완전히 지울까요? </span><button class="btn danger" data-act="mdel2" data-id="${m.id}" data-w>완전 삭제</button> <button class="btn" data-act="mdel0">취소</button>`
      :m.former?`<button class="btn ghost" data-act="medit" data-id="${m.id}" data-w>수정</button> <button class="btn ghost" data-act="mback" data-id="${m.id}" data-w>현재 팀원으로 복귀</button> <button class="btn ghost" data-act="mdel" data-id="${m.id}" data-w>삭제</button>`

// member list sorting. 직책 "내림차순" = 팀장 → 회계 → 서기 → 싱어팀장 → 세션팀장 → 방송팀장 → (직책 없음)
const SORT_COLS=[['name','이름','asc'],['team','소속','asc'],['role','직책','desc'],['bday','생일','asc'],['comm','공동체','asc']];
// 공동체: born before Feb 2001 → SM, otherwise VM. YY ≥ 30 is read as 19YY, else 20YY. No birthday → unknown.
function commOf(m){const b=String(m.bday||'').match(/^(\d{2})-(\d{2})-(\d{2})$/);if(!b)return'';
  const y=(+b[1]>=30?1900:2000)+(+b[1]),mo=+b[2];return (y<2001||(y===2001&&mo<2))?'SM':'VM'}
const commChip=m=>{const c=commOf(m);return c?`<span class="comm ${c.toLowerCase()}">${c}</span>`:'<span class="sub" title="생일을 넣으면 자동으로 정해져요">—</span>'};
function roleRank(r){const i=ROLES.indexOf(r);return i<0?(r?ROLES.length:ROLES.length+1):i}
function sortMembers(list){
  const s=UI.mSort;if(!s)return list;const dir=s.dir==='asc'?1:-1;
  const base=(a,b)=>(TEAMS.indexOf(a.team)-TEAMS.indexOf(b.team))||String(a.name).localeCompare(String(b.name),'ko');
  const key={
    name:(a,b)=>String(a.name).localeCompare(String(b.name),'ko'),
    team:(a,b)=>TEAMS.indexOf(a.team)-TEAMS.indexOf(b.team),
    role:(a,b)=>roleRank(b.role)-roleRank(a.role),          // asc = 방송팀장 … 팀장; desc = 팀장 … 방송팀장
    bday:(a,b)=>String(a.bday||'').slice(3).localeCompare(String(b.bday||'').slice(3)), // by month-day
    comm:(a,b)=>commOf(a).localeCompare(commOf(b))
  }[s.k];
  return [...list].sort((a,b)=>{
    if(s.k==='bday'||s.k==='comm'){const ea=!a.bday,eb=!b.bday;if(ea!==eb)return ea?1:-1}
    if(s.k==='role'){const na=!a.role,nb=!b.role;if(na!==nb)return na?1:-1}
    return (key(a,b)*dir)||base(a,b)});
}
function sortHead(){return SORT_COLS.map(([k,l])=>{const on=UI.mSort&&UI.mSort.k===k,d=on?UI.mSort.dir:null;
  return `<th aria-sort="${on?(d==='asc'?'ascending':'descending'):'none'}"><button class="thsort ${on?'on':''}" data-act="msort" data-v="${k}" title="${l} 순으로 정렬">${l}<span class="arr">${on?(d==='asc'?'▲':'▼'):'↕'}</span></button></th>`}).join('')}
function validBday(s){if(!s)return true;const m=s.match(/^(\d{2})-(\d{2})-(\d{2})$/);if(!m)return false;const mo=+m[2],d=+m[3];return mo>=1&&mo<=12&&d>=1&&d<=[31,29,31,30,31,30,31,31,30,31,30,31][mo-1]}

/* ---------- 통계 ---------- */
function statDates(){
  if(UI.statMode==='month')return WEDS.filter(w=>w.startsWith(UI.statMonth));
  if(UI.statMode==='year')return WEDS.filter(w=>w.startsWith(UI.statYear));
  return WEDS;
}
function rateOf(id,dates){let p=0,a=0;for(const d of dates){const r=S.att[d]&&S.att[d].records&&S.att[d].records[id];if(r&&r.s==='p')p++;else if(r&&r.s==='a')a++}return{p,a,r:p+a?p/(p+a):null}}
const pct=r=>r==null?'–':Math.round(r*100)+'%';
function vStats(){
  const dates=statDates(),today=todayStr();
  const all=UI.statFormer?[...sortedMembers(),...sortedMembers('all','former')]:sortedMembers();
  const list=all.filter(m=>UI.statTeam==='all'||m.team===UI.statTeam).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
  const hasFormer=S.members.some(m=>m.former);
  const [mY,mM]=UI.statMonth.split('-');
  let h=`<div class="head"><div><h2>출석 통계</h2><div class="sub">출석률 = 출석 ÷ (출석 + 결석). 체크하지 않은 날은 빼고 계산해요.</div></div>
  <div class="row"><div class="filters">${[['month','월별'],['year','연도별'],['all','전체']].map(([k,l])=>`<button class="chipbtn" data-act="smode" data-v="${k}" aria-pressed="${UI.statMode===k}">${l}</button>`).join('')}</div>
  ${UI.statMode==='month'?`<select class="f" id="s-month" aria-label="월">${MONTHS.map(m=>`<option value="${m}" ${m===UI.statMonth?'selected':''}>${m.slice(0,4)}년 ${+m.slice(5)}월</option>`).join('')}</select>`:''}
  ${UI.statMode==='year'?`<select class="f" id="s-year" aria-label="연도">${YEARS.map(y=>`<option ${y===UI.statYear?'selected':''}>${y}</option>`).join('')}</select>`:''}</div></div>`;
  if(!S.members.length)return h+`<div class="panel empty"><strong>통계를 낼 팀원이 없어요</strong>팀원을 등록하고 출석을 체크하면 여기에 표가 채워져요.</div>`;
  const period=UI.statMode==='month'?`${mY}년 ${+mM}월`:UI.statMode==='year'?`${UI.statYear}년`:'전체 기간';
  const avg=ms=>{let p=0,a=0;ms.forEach(m=>{const x=rateOf(m.id,dates);p+=x.p;a+=x.a});return{r:p+a?p/(p+a):null,n:p+a}};
  const tot=avg(all);
  h+=`<div class="cards"><div class="card"><div class="k">${period} 전체</div><div class="v">${pct(tot.r)}<small>${tot.n}건</small></div></div>
  ${TEAMS.map(t=>{const x=avg(all.filter(m=>m.team===t));return `<div class="card"><div class="k">${t}</div><div class="v">${pct(x.r)}<small>${x.n}건</small></div></div>`}).join('')}</div>
  <div class="row" style="margin-bottom:10px;justify-content:space-between">${teamFilter(UI.statTeam,'steam')}${hasFormer?`<button class="chipbtn" data-act="sformer" aria-pressed="${UI.statFormer}">(구)팀원 함께 보기</button>`:''}</div>
  <div class="grid-wrap"><table class="sg"><thead><tr><th class="nmc">이름</th>${dates.map(d=>`<th class="d ${d>today?'future':''}" title="${fmtLong(d)}">${fmtShort(d)}</th>`).join('')}<th style="text-align:left;border-left:1px solid var(--line)">${period} 출석률</th>${UI.statMode!=='all'?'<th style="text-align:left">누적</th>':''}</tr></thead><tbody>`;
  for(const m of list){
    const x=rateOf(m.id,dates),c=rateOf(m.id,WEDS);
    h+=`<tr class="${m.former?'former':''}"><td class="nmc"><b>${esc(m.name)}</b>${m.former?' <span class="oldtag">(구)</span>':''} ${teamChip(m.team)}</td>`+dates.map(d=>{const r=S.att[d]&&S.att[d].records&&S.att[d].records[m.id];
      const t=r&&r.note?` class="has-note" title="${esc(r.note)}"`:'';
      return `<td class="d">${r&&r.s==='p'?`<span class="mk-p"${t}>○</span>`:r&&r.s==='a'?`<span class="mk-a"${t}>✕</span>`:'<span class="mk-n">·</span>'}</td>`}).join('')+
      `<td class="rate"><div class="bar"><i><b style="width:${x.r==null?0:Math.round(x.r*100)}%"></b></i><span>${pct(x.r)}</span><em>${x.p}/${x.p+x.a}</em></div></td>`+
      (UI.statMode!=='all'?`<td class="mono">${pct(c.r)}</td>`:'')+`</tr>`;
  }
  h+=`</tbody><tfoot><tr><td class="nmc">출석 인원</td>${dates.map(d=>{const rs=(S.att[d]&&S.att[d].records)||{};const n=list.filter(m=>rs[m.id]&&rs[m.id].s==='p').length,k=list.filter(m=>rs[m.id]&&rs[m.id].s).length;return `<td class="d">${k?n:''}</td>`}).join('')}<td style="border-left:1px solid var(--line)"></td>${UI.statMode!=='all'?'<td></td>':''}</tr></tfoot></table></div>
  <p class="sub" style="margin-top:10px">○ 출석 · ✕ 결석 · · 미체크. 밑줄 친 표시에 마우스를 올리면 비고가 보여요.</p>`;
  return h;
}

/* ---------- 캘린더 ---------- */
function itemsOn(d){
  const out=[],md=d.slice(5);
  sortedMembers().forEach(m=>{if(m.bday&&m.bday.slice(3)===md)out.push({k:'bday',t:m.name+' 생일',id:m.id})});
  S.minutes.filter(n=>n.date===d).forEach(n=>out.push({k:'meet',t:'회의'+(n.title?' · '+n.title:''),id:n.id}));
  S.events.filter(e=>e.date<=d&&d<=(e.end||e.date)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>out.push({k:'ev',t:e.title,id:e.id,e}));
  return out;
}
// attendance on a Wednesday: present count among current members / current member count (same basis as 출석부)
function attCount(d){const rec=(S.att[d]&&S.att[d].records)||{},act=sortedMembers();return{p:act.filter(m=>rec[m.id]&&rec[m.id].s==='p').length,n:act.length}}
function attLine(d){if(!WEDS.includes(d))return'';const c=attCount(d);
  return `<span class="attc" title="출석 ${c.p}명 / 전체 ${c.n}명"><span class="full">출석 ${c.p}명 / 전체 ${c.n}명</span><span class="short">${c.p}/${c.n}</span></span>`}
function vCalendar(){
  const [y,mo]=UI.calMonth.split('-').map(Number);
  const first=Date.UTC(y,mo-1,1),dow=new Date(first).getUTCDay(),days=new Date(Date.UTC(y,mo,0)).getUTCDate();
  const n=Math.ceil((dow+days)/7)*7,today=todayStr(),sel=UI.calSel;
  let h=`<div class="head"><div><h2>캘린더</h2><div class="sub">팀원 생일 · 회의 날짜 · 주요 일정</div></div>

    ${it.k==='meet'?`<button class="btn ghost" data-act="copen" data-id="${it.id}">열기</button>`:''}
    ${it.k==='ev'?(UI.calDel===it.id?`<button class="btn danger" data-act="cdel2" data-id="${it.id}" data-w>삭제</button><button class="btn" data-act="cdel0">취소</button>`:`<button class="btn ghost" data-act="cdel" data-id="${it.id}" data-w>삭제</button>`):''}</div>`).join(''):'<div class="sub">이 날에는 표시할 일정이 없어요.</div>'}</div>
  <form id="evform" class="evform" autocomplete="off"><div class="cs-h2">주요 일정 추가</div>

// 찬양인도자: chosen from members flagged as leaders in 팀원 명부. Keeps a past pick visible even if the flag was later removed.
function leaderSelect(r){

function wAddSong(){const t=$('#w-song'),k=$('#w-key');if(!t)return;const title=t.value.trim();if(!title){toast('곡 제목을 입력해 주세요');t.focus();return}

/* ---------- 회계 ---------- */
const won=n=>(Math.round(+n||0)).toLocaleString('ko-KR')+'원';
const parseAmt=s=>+String(s??'').replace(/[^\d]/g,'')||0;
const moLabel=mo=>`${mo.slice(0,4)}.${mo.slice(5)}`;
const IN_CATS=['회비','후원','이자','기타수입'],OUT_CATS=['간식','회식','행사','기타지출'];

// fee rules per year: {monthly, annual}; null = 미정. Amounts are looked up at calculation time,
// so entering a rule later applies to payments already checked.
const rule=(y,k)=>{const r=(S.acct.rules||{})[y]||{};const v=r[k];return v===''||v==null?null:+v};
function duesOf(mo){const d=S.dues[mo],p=(d&&d.paid)||{},fee=rule(mo.slice(0,4),'monthly')||0;let n=0;for(const k in p)if(p[k])n++;return{n,sum:n*fee,paid:p,fee}}
function annualOf(y){const d=S.dues['Y'+y],p=(d&&d.paid)||{},fee=rule(y,'annual')||0;const list=Object.keys(p).filter(k=>p[k]);return{n:list.length,sum:list.length*fee,paid:p,fee}}
// annual dues count as income in the month they were checked
function annualIn(mo){let s=0;YEARS.forEach(y=>{const a=annualOf(y);for(const k in a.paid){const r=a.paid[k];if(r&&(r.at||(y+'-01')).startsWith(mo))s+=a.fee}});return s}
function acctMonths(){const set=new Set(MONTHS);S.ledger.forEach(x=>x.date&&set.add(x.date.slice(0,7)));Object.keys(S.dues).filter(k=>!k.startsWith('Y')).forEach(k=>set.add(k));
  YEARS.forEach(y=>{const p=annualOf(y).paid;for(const k in p)if(p[k]&&p[k].at)set.add(p[k].at.slice(0,7))});return[...set].sort()}
function acctRows(){let bal=+S.acct.carry||0;return acctMonths().map(mo=>{const du=duesOf(mo).sum+annualIn(mo);
  const inc=S.ledger.filter(x=>x.type==='in'&&(x.date||'').startsWith(mo)).reduce((a,x)=>a+(+x.amount||0),0);
  const out=S.ledger.filter(x=>x.type==='out'&&(x.date||'').startsWith(mo)).reduce((a,x)=>a+(+x.amount||0),0);
  bal+=du+inc-out;return{mo,du,inc,out,bal}})}
function vAcct(){
  const rows=acctRows(),cur=todayStr().slice(0,7),cr=rows.find(r=>r.mo===cur)||{du:0,inc:0,out:0};
  const tot=rows.reduce((a,r)=>({du:a.du+r.du,inc:a.inc+r.inc,out:a.out+r.out}),{du:0,inc:0,out:0});
  const balance=(+S.acct.carry||0)+tot.du+tot.inc-tot.out;
  const act=sortedMembers(),curD=duesOf(cur);
  const rpm=UI.rpMonth||cur;
  let h=`<div class="head"><div><h2>회계</h2><div class="sub">월별 회비 납부 · 수입/지출 내역 · 회비 잔액</div></div>
   <div class="row"><select class="f" id="rp-month" aria-label="보고서 월">${acctMonths().map(mo=>`<option value="${mo}" ${mo===rpm?'selected':''}>${moLabel(mo)}</option>`).join('')}</select><button class="btn primary" data-act="rpt">월말 회계보고 JPG</button></div></div>
  <div class="cards"><div class="card"><div class="k">현재 회비 잔액</div><div class="v ${balance<0?'neg':''}">${won(balance)}</div></div>
   <div class="card"><div class="k">${+cur.slice(5)}월 회비 납부</div><div class="v">${act.filter(m=>curD.paid[m.id]).length}<small>/ ${act.length}명 · ${won(curD.sum)}</small></div></div>
   <div class="card"><div class="k">${+cur.slice(5)}월 수입 내역</div><div class="v pos">${won(cr.inc)}</div></div>
   <div class="card"><div class="k">${+cur.slice(5)}월 지출</div><div class="v neg">${won(cr.out)}</div></div></div>`;

  // 1. 월별 회비 납부
  const shown=[...act,...sortedMembers('all','former').filter(m=>MONTHS.some(mo=>duesOf(mo).paid[m.id])||YEARS.some(y=>annualOf(y).paid[m.id]))].sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
  h+=`<h3 class="sech">월별 회비 납부 <span class="sub">칸을 누르면 납부 / 미납이 바뀌어요</span></h3>
  <div class="panel rules"><div class="rules-h"><b>회비 규정</b><span class="sub">비워 두면 ‘미정’이에요. 회의 후 금액을 입력하면 이미 체크한 납부에도 바로 적용돼요.</span></div>
   <div class="rules-g">${YEARS.map(y=>`<div class="ry"><span class="ryl mono">${y}년</span>
     <label class="lb">월회비<input class="f mono amt" id="ac-r-${y}-monthly" inputmode="numeric" placeholder="미정" value="${rule(y,'monthly')==null?'':rule(y,'monthly').toLocaleString('ko-KR')}" data-w></label>
     <label class="lb">연회비<input class="f mono amt" id="ac-r-${y}-annual" inputmode="numeric" placeholder="미정" value="${rule(y,'annual')==null?'':rule(y,'annual').toLocaleString('ko-KR')}" data-w></label></div>`).join('')}
     <div class="ry"><span class="ryl">이월</span><label class="lb">기초 잔액 (이월금)<input class="f mono amt" id="ac-carry" inputmode="numeric" value="${(+S.acct.carry||0).toLocaleString('ko-KR')}" data-w></label></div></div></div>`;
  if(!shown.length)h+=`<div class="panel empty"><strong>팀원이 없어요</strong>팀원 명부에 팀원을 등록하면 회비 납부표가 만들어져요.</div>`;
  else{
    h+=`<div class="grid-wrap"><table class="sg dues"><thead><tr><th class="nmc">이름</th>${MONTHS.map(mo=>`<th class="d ${mo===cur?'curm':''}">${mo.slice(2,4)}.${mo.slice(5)}</th>`).join('')}<th style="border-left:1px solid var(--line)">월회비<br>납부</th>${YEARS.map((y,i)=>`<th class="d yr ${i===0?'ysep':''}">${y.slice(2)}년<br>연회비</th>`).join('')}</tr></thead><tbody>`;
    for(const m of shown){let cnt=0;
      h+=`<tr class="${m.former?'former':''}"><td class="nmc"><b>${esc(m.name)}</b>${m.former?' <span class="oldtag">(구)</span>':''} ${teamChip(m.team)}</td>`+MONTHS.map(mo=>{const p=duesOf(mo).paid[m.id];if(p)cnt++;
        return `<td class="d ${mo===cur?'curm':''}"><button class="dk ${p?'on':''}" data-act="due" data-id="${m.id}" data-v="${mo}" aria-pressed="${!!p}" aria-label="${esc(m.name)} ${moLabel(mo)} ${p?'납부':'미납'}" title="${p?`납부${p.at?' ('+p.at+')':''}`:'미납'}" data-w>${p?'✓':''}</button></td>`}).join('')+
        `<td class="mono" style="border-left:1px solid var(--line)">${cnt}회</td>`+
        YEARS.map((y,i)=>{const p=annualOf(y).paid[m.id];return `<td class="d yr ${i===0?'ysep':''}"><button class="dk ${p?'on':''}" data-act="dueY" data-id="${m.id}" data-v="${y}" aria-pressed="${!!p}" aria-label="${esc(m.name)} ${y}년 연회비 ${p?'납부':'미납'}" title="${p?`납부${p.at?' ('+p.at+')':''}`:'미납'}" data-w>${p?'✓':''}</button></td>`}).join('')+`</tr>`}
    h+=`</tbody><tfoot><tr><td class="nmc">납부 인원 / 금액</td>${MONTHS.map(mo=>{const d=duesOf(mo);return `<td class="d ${mo===cur?'curm':''}">${d.n?`${d.n}명${d.fee?`<br>${(d.sum/10000).toLocaleString('ko-KR',{maximumFractionDigits:1})}만`:''}`:''}</td>`}).join('')}<td style="border-left:1px solid var(--line)"></td>${YEARS.map((y,i)=>{const a=annualOf(y);return `<td class="d yr ${i===0?'ysep':''}">${a.n?`${a.n}명${a.fee?`<br>${(a.sum/10000).toLocaleString('ko-KR',{maximumFractionDigits:1})}만`:''}`:''}</td>`}).join('')}</tr></tfoot></table></div>
    ${YEARS.some(y=>rule(y,'monthly')==null||rule(y,'annual')==null)?`<p class="sub" style="margin-top:8px">금액이 ‘미정’인 회비는 납부 체크만 기록되고 잔액에는 0원으로 계산돼요. 회비 규정에 금액을 넣으면 자동으로 반영돼요.</p>`:''}`;
  }

  // 2. 수입 / 지출 내역
  const months=acctMonths(),f=UI.acFilter||'all';
  const list=t=>S.ledger.filter(x=>x.type===t&&(f==='all'||(x.date||'').startsWith(f))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));
  const form=(t)=>{const cats=t==='in'?IN_CATS:OUT_CATS,dr=ledDraft(t);return `<form class="ledform" id="led-${t}" data-led="${t}" autocomplete="off">
     <div class="lf2"><label class="lb">날짜<input class="f mono" type="date" id="${t}-date" data-ldf="date" value="${esc(dr.date)}"></label>
     <label class="lb">항목<select class="f" id="${t}-cat" data-ldf="cat">${cats.map(c=>`<option ${dr.cat===c?'selected':''}>${c}</option>`).join('')}</select></label></div>

  textRows(m.title||'제목 없음',`700 50px ${SER}`,C.ink,M,CW,68,10);
  const metaF=`400 24px ${SANS}`,labF=`600 24px ${SANS}`;

    const x0=M+dp[i]*44;mc.font=font;const mw=mk[i]?mc.measureText(mk[i]).width+12:0;const tx=x0+mw;
    const gap=first?26:big?24:4;first=false;

    textRows(b.t||' ',font,C.ink,tx,M+CW-tx,lh,gap,mk[i]?(c,y)=>{c.font=font;c.fillStyle=big?C.ink:C.muted;c.fillText(mk[i],x0,y+lh*.78);c.fillStyle=C.ink}:null);

  const N=3+3*nP,xref=off;let x=`xref\n0 ${N}\n0000000000 65535 f \n`;for(let i=1;i<N;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(enc(x+`trailer\n<< /Size ${N} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
  return new Blob(parts,{type:'application/pdf'});
}

    const cw=CW/4;cells.forEach(([k,v,col],i)=>{const x=M+cw*i+28;txt(c,k,x,y0+50,`500 22px ${SANS}`,C.muted);txt(c,(i===2&&v?'−':'')+won(v),x,y0+108,`${i===3?700:500} 34px ${MONO}`,col);
      if(i)c.fillStyle=C.line,c.fillRect(M+cw*i,y0+24,2,boxH-48)})});
  const section=(title,total,color)=>{op(64,(c,y0)=>{txt(c,title,M,y0+40,`600 30px ${SANS}`,C.ink);txt(c,won(total),M+CW,y0+40,`600 28px ${MONO}`,color,'right')});
    op(10,(c,y0)=>{c.fillStyle=C.ink;c.fillRect(M,y0,CW,2)})};
  const line=(date,label,sub,amt,color)=>{const lf=`400 24px ${SANS}`,lines=wrap(label+(sub?`  · ${sub}`:''),lf,CW-360);const h=Math.max(52,lines.length*34+18);

function normBday(s){s=String(s||'').trim();if(!s)return'';

  if(p.length===1){const d=p[0];if(d.length===8)p=[d.slice(2,4),d.slice(4,6),d.slice(6)];else if(d.length===6)p=[d.slice(0,2),d.slice(2,4),d.slice(4)];else return s}

    if(k==='ren'){edit=id;del=null;draw();const r=$('#ren');r.focus();r.select()}
    else if(k==='cancel'){edit=del=null;draw()}
    else if(k==='rensave'){const n=$('#ren').value.trim(),y=+$('#reny').value;if(!n||!(y>=2020&&y<=2100))return;if(L.some(t=>t.name===n&&+t.year===y&&t.id!==id)){toast('같은 이름·연도의 사역팀이 이미 있어요');return}L.forEach(t=>{if(t.id===id){if(+t.year!==y)delete t.start;t.name=n;t.year=y}});saveTeams(L);edit=null;draw();toast('저장했어요')}
    else if(k==='del'){del=id;edit=null;draw()}
    else if(k==='delok'){const t=L.find(x=>x.id===id);if(t)try{localStorage.removeItem(t.key)}catch(_){}saveTeams(L.filter(x=>x.id!==id));del=null;draw();toast('사역팀을 삭제했어요')}});
  $('#view').addEventListener('keydown',e=>{if(e.target.id==='ren'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();const b=document.querySelector('[data-h=rensave]');if(b)b.click()}});
  draw()}
boot();
})();
</script>
