/* Layout: harbor-navy header band with tabs; one working column below. Tables scroll inside their own frame. */

:root[data-theme="dark"]{

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.inner{max-width:1180px;margin:0 auto}

header.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}

.thome{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-bottom:22px}

.team.t4{color:#4f62c4;background:#4f62c422}.team.t5{color:#4c8a2a;background:#4c8a2a22}.team.t6{color:#8a52c0;background:#8a52c022}.team.t7{color:#c0532f;background:#c0532f22}.team.t8{color:#6b6b6b;background:#6b6b6b22}
.cfgbox{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}@media (max-width:700px){.cfgbox{grid-template-columns:1fr}}
.cfgbox .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.cfgbox .ck{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line,#ccc);border-radius:999px;padding:2px 4px 2px 10px}

.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

.datebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

}

/* ===== 목장(홈) 디자인: 하늘·언덕 배경 + 크림색 카드, 굵은 갈색 테두리, 주아체 ===== */
html:root:root{color-scheme:light;
  --bg:transparent;--surface:#fffaf0;--sunk:#fff1d2;--line:#e2cfb2;--ink:#3b2a20;--muted:#7a6656;
  --accent:#e8503a;--accent-ink:#fff;--band:rgba(255,255,255,.93);--band-ink:#3b2a20;--band-muted:#7a6656;
  --ok:#3f9a45;--ok-soft:#dff2d6;--no:#d2452f;--no-soft:#fde3dc;--warn:#b07a12;
  --t1:#c2457a;--t2:#b56d12;--t3:#1d8580;--c-bday:#d0457f;--c-meet:#2f7fb0;--c-ev:#8a5cc0;
  --gold:#f5b82e;--green:#5aa957;--cream:#fffaf0;
  --f-display:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif;--f-body:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif;--r:18px}
body{background:transparent;font-size:16px;letter-spacing:.01em}
body::before{background:#fff}
header.band{background:var(--band);color:var(--ink);border-bottom:4px solid var(--gold);box-shadow:0 2px 0 rgba(0,0,0,.05)}
.brand{padding-block:12px 8px}
.brand h1{font-weight:normal;font-size:1.55rem;display:flex;align-items:center;gap:6px}
.brand h1 .yr{color:#fff;background:var(--accent);border:2px solid var(--ink);border-radius:999px;padding:0 9px;font-size:.78rem;letter-spacing:.04em;margin-left:6px}
.brand h1 .back{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);box-shadow:0 2px 0 var(--ink);margin-right:2px;font-size:1.1rem}
.sync{color:var(--muted)}
nav.tabs{gap:6px;padding-bottom:10px;flex-wrap:nowrap}
nav.tabs a{color:var(--ink);border:2px solid var(--ink);border-radius:14px;background:var(--cream);padding:5px 14px;box-shadow:0 2px 0 var(--ink);font-weight:normal}
nav.tabs a:hover{color:var(--ink);background:#fff}
nav.tabs a[aria-current="page"]{background:var(--gold);border-bottom-color:var(--ink)}
main{padding-block:22px 80px}
.head h2,.sech{font-weight:normal}
.head h2{font-size:1.7rem;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:2px 14px;box-shadow:0 3px 0 rgba(0,0,0,.12);display:inline-block}
.head .sub{margin-top:6px;background:rgba(255,255,255,.82);border-radius:10px;padding:2px 10px;display:inline-flex;color:var(--ink)}
.sech{display:inline-flex;background:var(--cream);border:2px solid var(--ink);border-radius:12px;padding:3px 12px}
.panel,.card,.cb{background:var(--surface);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.panel.tbl-wrap,.grid-wrap{overflow:auto}
.grid-wrap{border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.notice{background:rgba(255,255,255,.88);border:2px dashed var(--ink);border-radius:16px;color:var(--ink)}
.errnote{border-style:solid}
.btn{border:2px solid var(--ink);background:var(--cream);border-radius:14px;box-shadow:0 2px 0 var(--ink);padding:6px 13px}
.btn:hover{border-color:var(--ink);background:#fff}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}

function persist(key,fn,delay){

  const run=()=>S.mode==='db'?fn():saveLocal();
  timers[key]=setTimeout(()=>{
    chains[key]=(chains[key]||Promise.resolve()).then(run)
      .catch(e=>{if(e&&e.code==='unavailable')return new Promise(r=>setTimeout(r,600+Math.random()*900)).then(run);throw e})
      .then(()=>{failed=false;lastErr=null;if(S.saveErr){S.saveErr='';requestRender()}},
            e=>{failed=true;lastErr=e;S.saveErr=errText(e);toast(S.saveErr);requestRender();try{console.error('save failed',key,e)}catch(_){}})
      .finally(()=>{inflight[key]=0;setSync()});
  },delay||0);
}

  </div>`;
  return h;

function cfgAct(act,k,i){if(S.readOnly){toast('보기 권한이라 바꿀 수 없어요');return}

  if(act==='cfgren'){const v=(prompt(`‘${old}’의 새 이름`,old)||'').trim();if(!v||v===old)return;if(list.includes(v)){toast(`‘${v}’ ${name}은 이미 있어요`);return}

// member list sorting. 직책 "내림차순" = 팀장 → 회계 → 서기 → 싱어팀장 → 세션팀장 → 방송팀장 → (직책 없음)
const SORT_COLS=[['name','이름','asc'],['team','소속','asc'],['role','직책','desc'],['bday','생일','asc'],['comm','공동체','asc']];
// 공동체: born before Feb 2001 → SM, otherwise VM. YY ≥ 30 is read as 19YY, else 20YY. No birthday → unknown.
function commOf(m){const b=String(m.bday||'').match(/^(\d{2})-(\d{2})-(\d{2})$/);if(!b)return'';
  const y=(+b[1]>=30?1900:2000)+(+b[1]),mo=+b[2];return (y<2001||(y===2001&&mo<2))?'SM':'VM'}
const commChip=m=>{const c=commOf(m);return c?`<span class="comm ${c.toLowerCase()}">${c}</span>`:'<span class="sub" title="생일을 넣으면 자동으로 정해져요">—</span>'};
function roleRank(r){const i=ROLES.indexOf(r);return i<0?(r?ROLES.length:ROLES.length+1):i}
function sortMembers(list){
  const s=UI.mSort;if(!s)return list;const dir=s.dir==='asc'?1:-1;
  const base=(a,b)=>(TEAMS.indexOf(a.team)-TEAMS.indexOf(b.team))||String(a.name).localeCompare(String(b.name),'ko');
  const key={
    name:(a,b)=>String(a.name).localeCompare(String(b.name),'ko'),
    team:(a,b)=>TEAMS.indexOf(a.team)-TEAMS.indexOf(b.team),
    role:(a,b)=>roleRank(b.role)-roleRank(a.role),          // asc = 방송팀장 … 팀장; desc = 팀장 … 방송팀장
    bday:(a,b)=>String(a.bday||'').slice(3).localeCompare(String(b.bday||'').slice(3)), // by month-day
    comm:(a,b)=>commOf(a).localeCompare(commOf(b))
  }[s.k];
  return [...list].sort((a,b)=>{
    if(s.k==='bday'||s.k==='comm'){const ea=!a.bday,eb=!b.bday;if(ea!==eb)return ea?1:-1}
    if(s.k==='role'){const na=!a.role,nb=!b.role;if(na!==nb)return na?1:-1}
    return (key(a,b)*dir)||base(a,b)});
}
function sortHead(){return SORT_COLS.map(([k,l])=>{const on=UI.mSort&&UI.mSort.k===k,d=on?UI.mSort.dir:null;
  return `<th aria-sort="${on?(d==='asc'?'ascending':'descending'):'none'}"><button class="thsort ${on?'on':''}" data-act="msort" data-v="${k}" title="${l} 순으로 정렬">${l}<span class="arr">${on?(d==='asc'?'▲':'▼'):'↕'}</span></button></th>`}).join('')}
function validBday(s){if(!s)return true;const m=s.match(/^(\d{2})-(\d{2})-(\d{2})$/);if(!m)return false;const mo=+m[2],d=+m[3];return mo>=1&&mo<=12&&d>=1&&d<=[31,29,31,30,31,30,31,31,30,31,30,31][mo-1]}

/* ---------- 통계 ---------- */
function statDates(){
  if(UI.statMode==='month')return WEDS.filter(w=>w.startsWith(UI.statMonth));
  if(UI.statMode==='year')return WEDS.filter(w=>w.startsWith(UI.statYear));

}
function rateOf(id,dates){let p=0,a=0;for(const d of dates){const r=S.att[d]&&S.att[d].records&&S.att[d].records[id];if(r&&r.s==='p')p++;else if(r&&r.s==='a')a++}return{p,a,r:p+a?p/(p+a):null}}
const pct=r=>r==null?'–':Math.round(r*100)+'%';
function vStats(){

  <div class="row"><div class="filters">${[['month','월별'],['year','연도별'],['all','전체']].map(([k,l])=>`<button class="chipbtn" data-act="smode" data-v="${k}" aria-pressed="${UI.statMode===k}">${l}</button>`).join('')}</div>
  ${UI.statMode==='month'?`<select class="f" id="s-month" aria-label="월">${MONTHS.map(m=>`<option value="${m}" ${m===UI.statMonth?'selected':''}>${m.slice(0,4)}년 ${+m.slice(5)}월</option>`).join('')}</select>`:''}
  ${UI.statMode==='year'?`<select class="f" id="s-year" aria-label="연도">${YEARS.map(y=>`<option ${y===UI.statYear?'selected':''}>${y}</option>`).join('')}</select>`:''}</div></div>`;
  if(!S.members.length)return h+`<div class="panel empty"><strong>통계를 낼 팀원이 없어요</strong>팀원을 등록하고 출석을 체크하면 여기에 표가 채워져요.</div>`;

  const avg=ms=>{let p=0,a=0;ms.forEach(m=>{const x=rateOf(m.id,dates);p+=x.p;a+=x.a});return{r:p+a?p/(p+a):null,n:p+a}};
  const tot=avg(all);
  h+=`<div class="cards"><div class="card"><div class="k">${period} 전체</div><div class="v">${pct(tot.r)}<small>${tot.n}건</small></div></div>
  ${TEAMS.map(t=>{const x=avg(all.filter(m=>m.team===t));return `<div class="card"><div class="k">${t}</div><div class="v">${pct(x.r)}<small>${x.n}건</small></div></div>`}).join('')}</div>
  <div class="row" style="margin-bottom:10px;justify-content:space-between">${teamFilter(UI.statTeam,'steam')}${hasFormer?`<button class="chipbtn" data-act="sformer" aria-pressed="${UI.statFormer}">(구)팀원 함께 보기</button>`:''}</div>
  <div class="grid-wrap"><table class="sg"><thead><tr><th class="nmc">이름</th>${dates.map(d=>`<th class="d ${d>today?'future':''}" title="${fmtLong(d)}">${fmtShort(d)}</th>`).join('')}<th style="text-align:left;border-left:1px solid var(--line)">${period} 출석률</th>${UI.statMode!=='all'?'<th style="text-align:left">누적</th>':''}</tr></thead><tbody>`;
  for(const m of list){

      `<td class="rate"><div class="bar"><i><b style="width:${x.r==null?0:Math.round(x.r*100)}%"></b></i><span>${pct(x.r)}</span><em>${x.p}/${x.p+x.a}</em></div></td>`+

  <p class="sub" style="margin-top:10px">○ 출석 · ✕ 결석 · · 미체크. 밑줄 친 표시에 마우스를 올리면 비고가 보여요.</p>`;
  return h;
}

/* ---------- 캘린더 ---------- */
function itemsOn(d){
  const out=[],md=d.slice(5);
  sortedMembers().forEach(m=>{if(m.bday&&m.bday.slice(3)===md)out.push({k:'bday',t:m.name+' 생일',id:m.id})});
  S.minutes.filter(n=>n.date===d).forEach(n=>out.push({k:'meet',t:'회의'+(n.title?' · '+n.title:''),id:n.id}));
  S.events.filter(e=>e.date<=d&&d<=(e.end||e.date)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>out.push({k:'ev',t:e.title,id:e.id,e}));
  return out;
}
// attendance on a Wednesday: present count among current members / current member count (same basis as 출석부)
function attCount(d){const rec=(S.att[d]&&S.att[d].records)||{},act=sortedMembers();return{p:act.filter(m=>rec[m.id]&&rec[m.id].s==='p').length,n:act.length}}

function vCalendar(){

  <div class="clayout"><div class="panel cal"><div class="cal-h">${[...DOW].map((c,i)=>`<div class="${i===0?'sun':i===6?'sat':''}">${c}</div>`).join('')}</div><div class="cal-g">`;
  for(let k=0;k<n;k++){

    h+=`<button class="cell ${inM?'':'out'} ${d===today?'today':''} ${d===sel?'sel':''} ${WEDS.includes(d)?'wed':''} ${wd===0?'sun':wd===6?'sat':''}" data-act="cday" data-v="${d}" aria-label="${fmtLong(d)} 일정 ${its.length}개">
      <span class="dn">${+d.slice(8)}</span>${attLine(d)}${its.slice(0,3).map(it=>`<span class="pill ${it.k}">${esc(it.t)}</span>`).join('')}${its.length>3?`<span class="more">+${its.length-3}</span>`:''}
      <span class="dots">${its.map(it=>`<i class="lg ${it.k}"></i>`).join('')}</span></button>`;
  }

  h+=`</div></div><div class="panel cside"><div class="cs-h">${fmtLong(sel)}${WEDS.includes(sel)?' <span class="sub">· 출석일</span>':''}</div>

// Pasted prayer list → {memberId: text}. Understands
//   "이름 : 기도제목"        (colon, full-width colon)
//   "이름" then "-기도제목" lines  (a line that is only a name starts that person)
// Names may drop the surname ("규완") and carry a title ("형제", "님", "자매" …).
// Lines that are not a name continue the person above; leading "-", "•" bullets are removed.
const P_BULLET=/^[\s\-–—•·*▪◦○●>→✔✅🙏]+/u;
// what may follow a name: nothing, or a title/role
const P_TITLE=/^(이|님|씨|형|누나|언니|오빠|쌤|형제|자매|형제님|자매님|선생님|간사|간사님|전도사|전도사님|목사|목사님|집사|집사님|리더|리더님|팀장|팀장님|회계|서기|싱어팀장|세션팀장|방송팀장)?$/;
function prayerMatcher(){
  const ms=pPeople(),nz=s=>String(s||'').replace(/\s+/g,'');
  const giv={};ms.forEach(m=>{const g=nz(m.name).slice(1);if(g.length>=1)(giv[g]=giv[g]||[]).push(m)});
  // returns {m} on a match, {amb:[names]} when a given name fits several members, or null
  return raw=>{
    let k=nz(String(raw).replace(P_BULLET,'').replace(/^\d+\s*[.)]\s*/,'').replace(/[\[\]()<>「」『』"'“”:：,.!~]/g,''));
    if(!k||k.length>10)return null;
    let m=ms.find(x=>nz(x.name)===k);if(m)return{m};
    // full name + title: "이규완형제", "이규완님"
    let c=ms.filter(x=>{const n=nz(x.name);return k.startsWith(n)&&P_TITLE.test(k.slice(n.length))}).sort((a,b)=>b.name.length-a.name.length);if(c.length)return{m:c[0]};
    // given name only (+ optional title): "규완", "규완이", "수향자매"
    for(let L=Math.min(k.length,4);L>=1;L--){const g=k.slice(0,L);if(!P_TITLE.test(k.slice(L)))continue;const hit=giv[g];
      if(hit&&hit.length===1&&(L>=2||k.length===L))return{m:hit[0]};
      if(hit&&hit.length>1&&L>=2)return{amb:hit.map(x=>x.name)}}
    return null};
}
function parsePrayers(txt){
  const match=prayerMatcher(),out={},unknown=[],amb=[];let cur=null;
  const lines=String(txt).replace(/\r/g,'').split('\n');
  const add=(id,s)=>{s=String(s).replace(P_BULLET,'').trim();if(!s)return;out[id]=(out[id]?out[id]+'\n':'')+s};
  const nextIsBullet=i=>{for(let j=i+1;j<lines.length;j++){if(!lines[j].trim())continue;return /^\s*[\-–—•·*▪◦]/.test(lines[j])}return false};
  for(let i=0;i<lines.length;i++){
    const line=lines[i],t=line.trim();if(!t)continue;
    // 1) "이름 : 기도제목"
    const mm=line.match(/^\s*([^:：\n]{1,20}?)\s*[:：]\s*(.*)$/);
    if(mm){const r=match(mm[1]);
      if(r&&r.m){cur=r.m.id;if(!(cur in out))out[cur]='';add(cur,mm[2]);continue}
      if(r&&r.amb){amb.push(`${mm[1].trim()} (${r.amb.join('/')})`);cur=null;continue}
      if(mm[1].trim().length<=8&&!/\s{2,}/.test(mm[1])&&!P_BULLET.test(mm[1])){const nm=mm[1].trim();unknown.push(nm);cur='?'+nm;if(!(cur in out))out[cur]='';add(cur,mm[2]);continue}}
    // 2) a line that is only a name (no bullet in front)
    if(!/^\s*[\-–—•·*▪◦]/.test(line)){const r=match(t);
      if(r&&r.m){cur=r.m.id;if(!(cur in out))out[cur]='';continue}
      if(r&&r.amb){amb.push(`${t} (${r.amb.join('/')})`);cur=null;continue}
      // short Hangul-only line followed by "-" items → a name that is not in the roster
      if(/^[가-힣]{2,5}$/.test(t.replace(/\s/g,''))&&nextIsBullet(i)&&(!cur||out[cur])){unknown.push(t);cur='?'+t;if(!(cur in out))out[cur]='';continue}}
    // 3) content for the current person
    if(cur)add(cur,line);
  }
  for(const k in out){out[k]=out[k].trim();if(!out[k])delete out[k]}
  return{out,unknown,amb};
}

async function drawPrayer(d,pageH){
  try{await Promise.all(['400 26px "IBM Plex Sans KR"','600 26px "IBM Plex Sans KR"','700 48px "Gowun Batang"'].map(f=>document.fonts.load(f)))}catch(e){}
  const W=1240,M=100,CW=W-2*M,SANS='"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif',SER='"Gowun Batang","Nanum Myeongjo",serif';
  const C={ink:'#13222d',muted:'#5b6d7a',accent:'#1d5e86',line:'#d5dfe6'};
  const mc=document.createElement('canvas').getContext('2d');
  const wrap=(txt,font,maxW)=>{mc.font=font;const out=[];let cur='';for(const ch of String(txt)){if(mc.measureText(cur+ch).width>maxW&&cur){out.push(cur);cur=ch}else cur+=ch}out.push(cur);return out};
  const blocks=[];const txt=(c,s,x,y,font,color)=>{c.font=font;c.fillStyle=color;c.fillText(s,x,y)};
  // header block
  blocks.push({h:178,keep:true,draw:(c,y)=>{txt(c,TNAME+' · 기도제목',M,y+26,`500 22px ${SANS}`,C.accent);txt(c,`${fmtLong(d)} 기도제목`,M,y+92,`700 46px ${SER}`,C.ink);
    c.fillStyle=C.ink;c.fillRect(M,y+132,CW,2)}});
  const rows=pRows(d);
  if(!rows.length)blocks.push({h:60,draw:(c,y)=>txt(c,'이 주에 적은 기도제목이 없어요.',M,y+36,`400 24px ${SANS}`,C.muted)});
  rows.forEach(r=>{const itemF=`400 25px ${SANS}`,lines=[];r.items.forEach(x=>wrap(x,itemF,CW-40).forEach((ln,j)=>lines.push({ln,first:j===0})));
    const h=58+lines.length*38+26;
    blocks.push({h,draw:(c,y)=>{txt(c,r.name,M,y+38,`600 29px ${SANS}`,C.ink);
      lines.forEach((o,j)=>{const yy=y+58+j*38+26;if(o.first)txt(c,'-',M+6,yy,itemF,C.muted);txt(c,o.ln,M+36,yy,itemF,C.ink)});
      c.fillStyle=C.line;c.fillRect(M,y+h-8,CW,1)}});
  });
  // lay out: whole person blocks on a page; tall blocks may still split onto their own page
  const pages=[];let cur=[],y=M;const lim=pageH?pageH-M:Infinity;
  blocks.forEach(b=>{if(cur.length&&y+b.h>lim){pages.push(cur);cur=[];y=M}cur.push({b,y});y+=b.h});if(cur.length)pages.push(cur);
  return pages.map((pg,pi)=>{const last=pg[pg.length-1],H=pageH||last.y+last.b.h+M-20;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
    c.fillStyle='#ffffff';c.fillRect(0,0,W,H);pg.forEach(({b,y})=>b.draw(c,y));
    if(pageH&&pages.length>1){c.font=`400 20px ${SANS}`;c.fillStyle=C.muted;c.textAlign='center';c.fillText(`${pi+1} / ${pages.length}`,W/2,H-50);c.textAlign='left'}return cv});
}

// keep only harmless formatting from stored note HTML
function cleanHTML(html){
  const t=document.createElement('template');t.innerHTML=String(html||'');
  const OK={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,SPAN:1,FONT:1,BR:1,DIV:1,P:1};
  const DROP={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,LINK:1,META:1,SVG:1,MATH:1,TEMPLATE:1,IMG:1,VIDEO:1,AUDIO:1,FORM:1,INPUT:1,BUTTON:1,TEXTAREA:1,SELECT:1};
  const STY=['color','font-family','font-size','font-weight','font-style','text-decoration','text-decoration-line'];
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return}
    if(DROP[c.tagName]){c.remove();return}
    walk(c);
    if(!OK[c.tagName]){c.replaceWith(...c.childNodes);return}
    [...c.attributes].forEach(a=>{const nm=a.name.toLowerCase();
      if(nm==='style'){const keep=STY.map(p=>{const v=c.style.getPropertyValue(p);return v&&!/url\(|expression|javascript/i.test(v)?`${p}:${v}`:''}).filter(Boolean).join(';');keep?c.setAttribute('style',keep):c.removeAttribute('style')}
      else if(!(c.tagName==='FONT'&&(nm==='face'||nm==='color'||nm==='size')))c.removeAttribute(a.name)})})};
  walk(t.content);return t.innerHTML;
}

// fee rules per year: {monthly, annual}; null = 미정. Amounts are looked up at calculation time,

const rule=(y,k)=>{const r=(S.acct.rules||{})[y]||{};const v=r[k];return v===''||v==null?null:+v};
function duesOf(mo){const d=S.dues[mo],p=(d&&d.paid)||{},fee=rule(mo.slice(0,4),'monthly')||0;let n=0;for(const k in p)if(p[k])n++;return{n,sum:n*fee,paid:p,fee}}
function annualOf(y){const d=S.dues['Y'+y],p=(d&&d.paid)||{},fee=rule(y,'annual')||0;const list=Object.keys(p).filter(k=>p[k]);return{n:list.length,sum:list.length*fee,paid:p,fee}}

function annualIn(mo){let s=0;YEARS.forEach(y=>{const a=annualOf(y);for(const k in a.paid){const r=a.paid[k];if(r&&(r.at||(y+'-01')).startsWith(mo))s+=a.fee}});return s}

  YEARS.forEach(y=>{const p=annualOf(y).paid;for(const k in p)if(p[k]&&p[k].at)set.add(p[k].at.slice(0,7))});return[...set].sort()}

  const out=S.ledger.filter(x=>x.type==='out'&&(x.date||'').startsWith(mo)).reduce((a,x)=>a+(+x.amount||0),0);

function savedTime(t){const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}

  const nr=view.querySelector('.nores');if(nr)nr.hidden=any}
function guestCount(s){return (s||'').split(/[,،、]/).map(x=>x.trim()).filter(Boolean).length}
function blocksHTML(){const mk=markers(ED.blocks);return ED.blocks.map((b,i)=>`<div class="blk l${b.l}"><span class="mk">${esc(mk[i])}</span><textarea class="bt" id="bt-${i}" data-i="${i}" rows="1" aria-label="회의 내용 ${i+1}" placeholder="${ED.blocks.length===1&&!b.t?'안건을 입력하세요. Enter로 다음 줄, Tab으로 하위 항목':''}">${esc(b.t)}</textarea></div>`).join('')}

function renderBlocks(fi,caret){const box=$('#blocks');if(!box)return;box.innerHTML=blocksHTML();box.querySelectorAll('textarea').forEach(autosize);

const PREFIX=/^\s*(?:(\d+)\.|\((\d+)\)|(\d+)\)|([-•·]))\s+/;
function parseLine(line){const m=line.match(PREFIX);if(!m)return{l:0,t:line.trim()};return{l:m[1]?1:m[2]?2:m[3]?3:4,t:line.slice(m[0].length)}}
// depth of each block: 1.→0, (1)→1, 1)→2, -→3; plain text sits one step under the item above it
function depths(blocks){let last=-1;return blocks.map(b=>{if(b.l>0){last=b.l-1;return last}return last+1})}
function minuteInfo(m){
  const ms=sortedMembers('all','all').filter(x=>(m.attendees||[]).includes(x.id));
  const names=ms.map(x=>x.name+(x.former?'(구)':''));if(m.guests)names.push(m.guests);
  return {names,n:ms.length+guestCount(m.guests)};
}
const dotDate=s=>s?s.replace(/-/g,'.'):'';
function minuteText(m){
  const bl=m.blocks||[],mk=markers(bl),dp=depths(bl),{names,n}=minuteInfo(m);
  const body=bl.map((b,i)=>{const pre='  '.repeat(dp[i]),lead=mk[i]?mk[i]+' ':'',cont=pre+' '.repeat(lead.length);
    return String(b.t).split('\n').map((ln,j)=>(j?cont:pre+lead)+ln).join('\n')}).join('\n');
  return `회의일 : ${dotDate(m.date)}\n참석자 : ${names.join(', ')}\n회의내용 :\n`+body+'\n';
}
const fileBase=m=>('회의록_'+(m.date||'')+(m.title?'_'+m.title:'')).replace(/[\\/:*?"<>|\n\r]+/g,' ').trim().slice(0,80);

/* --- image/PDF rendering (drawn on canvas so Korean text survives) --- */
async function drawMinute(m,pageH){
  try{await Promise.all(['400 26px "IBM Plex Sans KR"','600 26px "IBM Plex Sans KR"','700 48px "Gowun Batang"'].map(f=>document.fonts.load(f)))}catch(e){}
  const W=1240,M=110,CW=W-2*M,SANS='"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif',SER='"Gowun Batang","Nanum Myeongjo",serif';
  const C={ink:'#13222d',muted:'#5b6d7a',accent:'#1d5e86',line:'#d5dfe6'};
  const mc=document.createElement('canvas').getContext('2d');
  const wrap=(txt,font,maxW)=>{mc.font=font;const out=[];for(const para of String(txt).split('\n')){let cur='';
    for(const tok of para.split(/(\s+)/)){if(!tok)continue;
      if(mc.measureText(cur+tok).width<=maxW){cur+=tok;continue}
      if(cur.trim())out.push(cur.trimEnd());cur=tok.trimStart();
      while(mc.measureText(cur).width>maxW){let k=cur.length;while(k>1&&mc.measureText(cur.slice(0,k)).width>maxW)k--;out.push(cur.slice(0,k));cur=cur.slice(k)}}
    out.push(cur.trimEnd())}return out};
  const rows=[];const add=(h,draw,gap)=>rows.push({h,draw,gap:gap||0});
  const textRows=(txt,font,color,x,maxW,lh,gap,lead)=>{wrap(txt,font,maxW).forEach((ln,i)=>add(lh,(c,y)=>{c.font=font;c.fillStyle=color;if(i===0&&lead)lead(c,y);c.fillText(ln,x,y+lh*.78)},i===0?gap:0))};
  const {names,n}=minuteInfo(m);
  textRows(TNAME+' · 회의록',`500 22px ${SANS}`,C.accent,M,CW,34,0);
  textRows(m.title||'제목 없음',`700 50px ${SER}`,C.ink,M,CW,68,10);
  const metaF=`400 24px ${SANS}`,labF=`600 24px ${SANS}`;
  [['회의일',m.date?dotDate(m.date):'—'],['참석자',names.length?names.join(', '):'—']].forEach(([k,v],i)=>

function copyText(txt){
  const ta=$('#cb-text'),msg=$('#cb-msg');
  const done=ok=>{msg.textContent=ok?'복사됐어요. 카톡 대화창에 길게 눌러(또는 Ctrl+V) 붙여 넣으세요.':'자동 복사가 막혀 있어요. 아래 글이 선택된 상태이니 Ctrl+C(휴대폰은 길게 눌러 복사)로 복사하세요.';msg.style.color=ok?'':'var(--no)';if(ok)toast('복사했어요')};
  const sel=()=>{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length)};
  const legacy=()=>{sel();let ok=false;try{ok=document.execCommand('copy')}catch(e){}done(ok);sel()};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>{done(true);sel()},legacy);else legacy()}catch(e){legacy()}
}
function openCopy(txt,title){
  const box=$('#copybox'),ta=$('#cb-text');$('#cb-title').textContent=title||(/기도제목\]/.test(txt.split('\n')[0])?'카톡에 붙여 넣을 기도제목':'카톡에 붙여 넣을 회의록');ta.value=txt;box.hidden=false;
  ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight+4,window.innerHeight*0.55)+'px';
  copyText(txt);
}
function closeCopy(){$('#copybox').hidden=true}

  if(t.classList.contains('bt')){const i=+t.dataset.i,b=ED.blocks[i];
    if(!e.isComposing){const m=t.value.match(PREFIX);if(m&&t.selectionStart<=m[0].length+0&&t.selectionStart===m[0].length){const p=parseLine(t.value);b.l=p.l;b.t=p.t;renderBlocks(i,0);edChanged();return}}
    b.t=t.value;autosize(t);edChanged()}
});
view.addEventListener('focusin',e=>{if(e.target.classList.contains('bt'))lastBlock=+e.target.dataset.i});
view.addEventListener('keydown',e=>{
  const t=e.target;if(!t.classList||!t.classList.contains('bt'))return;
  if(e.isComposing||e.keyCode===229)return;
  const i=+t.dataset.i,b=ED.blocks[i];const s=t.selectionStart,en=t.selectionEnd;
  if(e.key==='Tab'){e.preventDefault();b.t=t.value;b.l=Math.max(0,Math.min(4,b.l+(e.shiftKey?-1:1)));renderBlocks(i,s);edChanged();return}
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();b.t=t.value;
    if(b.t===''&&b.l>0){b.l=b.l>1?b.l-1:0;renderBlocks(i,0);edChanged();return}
    const after=b.t.slice(en);b.t=b.t.slice(0,s);ED.blocks.splice(i+1,0,{l:b.l,t:after});renderBlocks(i+1,0);edChanged();return}
  if(e.key==='Backspace'&&s===0&&en===0){
    if(b.l>0){e.preventDefault();b.t=t.value;b.l=0;renderBlocks(i,0);edChanged();return}
    if(i>0){e.preventDefault();const p=ED.blocks[i-1],c=p.t.length;p.t+=t.value;ED.blocks.splice(i,1);renderBlocks(i-1,c);edChanged();return}}
  if(e.key==='Delete'&&s===t.value.length&&en===s&&i<ED.blocks.length-1){e.preventDefault();b.t=t.value+ED.blocks[i+1].t;ED.blocks.splice(i+1,1);renderBlocks(i,s);edChanged();return}
  if(e.key==='ArrowUp'&&s===0&&en===0&&i>0){e.preventDefault();const p=view.querySelector(`[data-i="${i-1}"]`);p.focus();p.setSelectionRange(p.value.length,p.value.length);return}
  if(e.key==='ArrowDown'&&s===t.value.length&&i<ED.blocks.length-1){e.preventDefault();const n=view.querySelector(`[data-i="${i+1}"]`);n.focus();n.setSelectionRange(0,0);return}
});
view.addEventListener('paste',e=>{
  const t=e.target;if(!t.classList||!t.classList.contains('bt'))return;
  const txt=(e.clipboardData||window.clipboardData).getData('text');if(!txt||!/\n/.test(txt))return;
  e.preventDefault();const i=+t.dataset.i;ED.blocks[i].t=t.value;
  const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim()).map(parseLine);if(!lines.length)return;
  const replace=!ED.blocks[i].t.trim();ED.blocks.splice(replace?i:i+1,replace?1:0,...lines);
  renderBlocks((replace?i:i+1)+lines.length-1);edChanged();
});
view.addEventListener('submit',e=>{
  if(e.target.id==='led-in'||e.target.id==='led-out'){e.preventDefault();tryAutoAdd(e.target.id.slice(4),true);return}
  if(e.target.id==='evform'){e.preventDefault();

  const old=UI.mEdit&&S.members.find(m=>m.id===UI.mEdit);

    toast(old?`${name} 님 정보를 저장했어요`:`${name} 님을 명부에 저장했어요`);
    if(!old&&UI.view==='members'){const t=$('#m-team');if(t)t.value=team;const n=$('#m-name');if(n)n.focus()}})},20);

// accepts 980321, 98.03.21, 98/3/21, 1998-03-21 → 98-03-21
function normBday(s){s=String(s||'').trim();if(!s)return'';
  let p=s.split(/[^0-9]+/).filter(Boolean);
  if(p.length===1){const d=p[0];if(d.length===8)p=[d.slice(2,4),d.slice(4,6),d.slice(6)];else if(d.length===6)p=[d.slice(0,2),d.slice(2,4),d.slice(4)];else return s}
  if(p.length!==3)return s;let[y,m,d]=p;if(y.length===4)y=y.slice(2);if(y.length!==2)return s;return y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0')}
// birthday auto-format: 980321 -> 98-03-21
view.addEventListener('blur',e=>{if(e.target.id==='m-bday')e.target.value=normBday(e.target.value);
  if(e.target.classList&&e.target.classList.contains('amt')&&e.target.value.trim()){e.target.value=parseAmt(e.target.value).toLocaleString('ko-KR')}},true);

function startLocal(){S.mode='local';loadLocal();UI.attDate=null;buildDates();UI.attDate=defaultWed();UI.statMonth=UI.attDate.slice(0,7);S.loaded=true;render()}
function startDb(db){
  DB=db;S.mode='db';const got={m:0,a:0,n:0,e:0};
  db.doc('settings/cfg').onSnapshot(s=>{if(s.exists){S.cfg=Object.assign({day:3},clone(s.data()));requestRender()}},()=>{});
  db.collection('events').onSnapshot(s=>{S.events=s.docs.map(d=>Object.assign({id:d.id},clone(d.data())));got.e=1;requestRender()},()=>{});
  db.collection('dues').onSnapshot(s=>{const next={};s.docs.forEach(d=>next[d.id]=clone(d.data()));for(const k in duesDirty)if(S.dues[k])next[k]=S.dues[k];S.dues=next;requestRender()},()=>{});
  db.collection('ledger').onSnapshot(s=>{const next=s.docs.map(d=>Object.assign({id:d.id},clone(d.data())));
    for(const k in ledDirty){const loc=S.ledger.find(x=>x.id===k);if(!loc)continue;const i=next.findIndex(x=>x.id===k);if(i>=0)next[i]=loc;else next.push(loc)}
    S.ledger=next;requestRender()},()=>{});
  db.doc('settings/acct').onSnapshot(s=>{if(s.exists&&!acctDirty){S.acct=Object.assign({fee:10000,carry:0},clone(s.data()));requestRender()}},()=>{});
  db.collection('worship').onSnapshot(s=>{const next={};s.docs.forEach(d=>next[d.id]=clone(d.data()));for(const k in wDirty)if(S.worship[k])next[k]=S.worship[k];S.worship=next;requestRender()},()=>{});
  db.collection('prayer').onSnapshot(s=>{const next={};s.docs.forEach(d=>next[d.id]=clone(d.data()));for(const k in pDirty)if(S.prayer[k])next[k]=S.prayer[k];S.prayer=next;requestRender()},()=>{});
  db.doc('settings/prayer').onSnapshot(s=>{if(s.exists&&!pxDirty){S.pextra=clone((s.data()||{}).extras||[]);requestRender()}},()=>{});
  db.collection('groups').onSnapshot(s=>{const next=s.docs.map(d=>Object.assign({id:d.id},clone(d.data())));
    for(const k in gDirty){const loc=S.groups.find(x=>x.id===k);if(!loc)continue;const i=next.findIndex(x=>x.id===k);if(i>=0)next[i]=loc;else next.push(loc)}
    S.groups=next;requestRender()},()=>{});
  db.collection('notes').onSnapshot(s=>{const next=s.docs.map(d=>Object.assign({id:d.id},clone(d.data())));
    for(const k in nDirty){const loc=S.notes.find(x=>x.id===k);if(!loc)continue;const i=next.findIndex(x=>x.id===k);if(i>=0)next[i]=loc;else next.push(loc)}
    S.notes=next;if(UI.view==='minutes'&&!dragNote)refreshBoard()},()=>{});
  const timer=setTimeout(()=>{if(!(got.m&&got.a&&got.n)){S.loadNote='저장소에 아직 연결되지 않았어요. 보이는 내용이 최신이 아닐 수 있어요.';S.loaded=true;requestRender()}},10000);
  const fresh=(k,snap)=>{if(!snap.metadata.fromCache)got[k]=1;S.loaded=true;if(got.m&&got.a&&got.n&&S.loadNote){S.loadNote=''}if(got.m&&got.a&&got.n)clearTimeout(timer)};
  const onErr=e=>{clearTimeout(timer);S.loaded=true;S.loadNote='저장소 연결이 끊겼어요. 페이지를 다시 열어 주세요. ('+(e&&e.code||'')+')';requestRender()};
  db.collection('members').onSnapshot(s=>{S.members=s.docs.map(d=>Object.assign({id:d.id},clone(d.data())));fresh('m',s);requestRender()},onErr);
  db.collection('attendance').onSnapshot(s=>{const next={};s.docs.forEach(d=>next[d.id]=clone(d.data()));for(const k in attDirty)if(S.att[k])next[k]=S.att[k];S.att=next;fresh('a',s);requestRender()},onErr);
  db.collection('minutes').onSnapshot(s=>{S.minutes=s.docs.map(d=>Object.assign({id:d.id},clone(d.data())));if(ED&&inflight['n:'+ED.id]){const i=S.minutes.findIndex(x=>x.id===ED.id);const c=clone(ED);if(i>=0)S.minutes[i]=c;else S.minutes.push(c)}fresh('n',s);requestRender()},onErr);
}
async function boot(){
  route();
  let tries=0;while(!(window.claude&&typeof window.claude.use==='function')&&tries<15){await new Promise(r=>setTimeout(r,100));tries++}
  if(!(window.claude&&typeof window.claude.use==='function')){startLocal();return}
  let db=null;try{db=await window.claude.use('db')}catch(e){}
  if(!db){startLocal();return}
  try{const u=await window.claude.use('user');if(u){const own=await u.isOwner(),cw=await u.can('data.write');S.who=own?'owner':cw===false?'readonly':cw?'writer':'unknown';if(own!==true&&cw===false)S.readOnly=true}}catch(e){}
  startDb(db);
}
function teamHome(){
  let ht;const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(ht);ht=setTimeout(()=>t.hidden=true,2600)};
  $('#tabs').hidden=true;$('#sync').hidden=true;
