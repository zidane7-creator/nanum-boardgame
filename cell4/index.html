function loadFile(f){return new Promise((res,rej)=>{if(!f||!/^image\//.test(f.type)){rej();return}const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const M=1800,s=Math.min(1,M/Math.max(im.width,im.height));

  bind()}
function thumbStyle(t){if(t.pat==="check")return `background:repeating-conic-gradient(${t.c2} 0 25%,${t.bg} 0 50%) 0 0/16px 16px`;if(t.pat==="dot")return `background:radial-gradient(${t.c2} 25%,transparent 27%) 0 0/14px 14px,${t.bg}`;
