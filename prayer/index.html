<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기도 모으기 | 치영의 교회 생활 즐기기 · 21일·30일·40일 기도 포도송이</title>
<meta name="description" content="21일, 30일, 40일 기도를 정하고 매일 기도하면 포도알이 하나씩 채워지는 기도 체크. 기도 제목마다 포도송이를 만들어 보세요.">
<meta name="keywords" content="기도 체크, 21일 기도, 40일 기도, 작정 기도, 포도송이, 기도 습관, 기도 달력">
<link rel="canonical" href="https://zidane7-creator.github.io/nanum-boardgame/prayer/">
<meta property="og:title" content="기도 모으기 — 치영의 교회 생활 즐기기">
<meta property="og:description" content="기도할 때마다 포도알이 하나씩 채워져요">
<meta property="og:url" content="https://zidane7-creator.github.io/nanum-boardgame/prayer/">
<meta property="og:image" content="https://zidane7-creator.github.io/nanum-boardgame/assets/og.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍇</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="../assets/jua.js"></script>
<style>
:root{--ink:#3b2a20;--cream:#fffaf0;--accent:#e8503a;--gold:#f5b82e;--green:#5aa957;--grape:#7b4bb7}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;color:inherit;border:2px solid var(--ink);background:var(--cream);border-radius:16px;padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.pri{background:var(--accent);color:#fff}button.go{background:var(--grape);color:#fff}
button.sm{padding:4px 10px;font-size:14px;border-radius:12px;box-shadow:0 2px 0 var(--ink)}
input{font:inherit;color:inherit;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:rgba(255,255,255,.92);border-bottom:4px solid var(--gold)}
.top a{color:var(--ink);text-decoration:none;font-size:15px;border:2px solid var(--ink);border-radius:14px;padding:3px 10px;background:var(--cream)}
.top .ttl{flex:1;font-size:19px}
main{max-width:900px;margin:0 auto;padding:16px 12px 70px}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
h1{font-weight:normal;text-align:center;font-size:clamp(30px,7vw,44px);margin:6px 0 2px}
h2{font-weight:normal;margin:0 0 10px;font-size:22px}
.sub{text-align:center;margin:0 0 14px;opacity:.8}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:14px;opacity:.7}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.pick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:18px;background:#fff}
.pick button b{font-size:26px}.pick button.on{background:#efe3ff;border-color:var(--grape);box-shadow:0 3px 0 var(--grape)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.item{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.item:hover{background:#fbf6ff}
.item .mini{width:56px;flex:none}
.item .t{font-size:18px}.item .s{font-size:13px;opacity:.7}
.bar{height:10px;background:#eee3d0;border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--grape)}
.stat{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:6px 0 4px;font-size:17px}
.stat b{color:var(--grape);font-size:24px}
#grape{display:block;width:min(100%,520px);margin:0 auto;touch-action:manipulation}
#grape .g{cursor:default}#grape .g.today{cursor:pointer}
#grape .g circle.b{stroke:#4b2a6e;stroke-width:3}
#grape .g text{font-family:Jua,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#grape .g.today circle.b{stroke:#e8503a;stroke-width:5;animation:pul 1.2s ease-in-out infinite}
@keyframes pul{50%{stroke-width:8}}
#grape .g.pop circle.b{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}}
#grape circle.b{transform-box:fill-box;transform-origin:center}
.today-box{text-align:center;margin:10px 0}
.today-box button{font-size:22px;padding:12px 30px}
.done-msg{text-align:center;font-size:20px;color:var(--grape);margin:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) scale(.9);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-size:17px;opacity:0;transition:.25s;z-index:90;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
</style>
</head><body>
<div class="top"><a href="../">← 목장</a><span class="ttl">🍇 기도 모으기</span></div>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tt;function toast(t,ms=2200){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),ms)}

/* ---------- 저장 (이 기기) ---------- */
let DB={list:[]};try{const o=JSON.parse(localStorage.getItem("prayer-grapes")||"null");if(o&&Array.isArray(o.list))DB=o}catch(e){}
const save=()=>{try{localStorage.setItem("prayer-grapes",JSON.stringify(DB))}catch(e){}};
/* 날짜: 이 기기의 날짜 기준 (자정이 지나면 다음 날) */
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const dayNo=(start,today=new Date())=>Math.round((parse(dkey(today))-parse(start))/864e5)+1; /* 시작한 날 = 1일차 */
const fmt=k=>{const d=parse(k);return`${d.getMonth()+1}월 ${d.getDate()}일`};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return dkey(d)};

/* ---------- 포도송이 모양: 위가 넓고 아래로 갈수록 좁아져요 ---------- */
/* 포도송이 모양(줄마다 알 수): 위는 둥근 어깨, 아래로 갈수록 좁아져 끝이 뾰족한 역삼각형 */
const SHAPES={21:[5,6,5,4,1],30:[5,6,7,6,3,2,1],40:[6,7,8,7,6,3,2,1]};
function rows(n){if(SHAPES[n])return SHAPES[n];let w=1;while(w*(w+1)/2<n)w++;const r=[];let left=n;for(let k=w;k>0&&left>0;k--){const t=Math.min(k,left);r.push(t);left-=t}return r}
/* 벌집처럼 엇갈려 쌓기: 윗줄과 알 수 차이가 짝수면 반 칸 옮겨서 알이 서로 사이에 끼이게 */
function rowShift(R){const o=[0];for(let i=1;i<R.length;i++){const d=Math.abs(R[i]-R[i-1]);o.push(d%2?o[i-1]:(o[i-1]>0?o[i-1]-1:o[i-1]+1))}const avg=o.reduce((a,b)=>a+b,0)/o.length;return o.map(v=>v-Math.round(avg))}
function grapeSVG(p,big){const n=p.days,R=rows(n),SH=rowShift(R),RAD=26,DX=50,DY=43,W=(Math.max(...R)+1)*DX+40,top=96,H=top+R.length*DY+RAD+16;
  const today=dayNo(p.start),done=new Set(p.done||[]);let h="",k=0;
  h+=`<path d="M${W/2} 70 C ${W/2-6} 40, ${W/2+8} 26, ${W/2+22} 12" fill="none" stroke="#6b4423" stroke-width="7" stroke-linecap="round"/>`;
  h+=`<path d="M${W/2+4} 52 C ${W/2+40} 22, ${W/2+86} 30, ${W/2+100} 54 C ${W/2+70} 70, ${W/2+30} 70, ${W/2+4} 52 Z" fill="#7cc35a" stroke="#3b6b2a" stroke-width="3"/><path d="M${W/2+12} 54 Q ${W/2+56} 48 ${W/2+92} 54" fill="none" stroke="#3b6b2a" stroke-width="2"/>`;
  h+=`<path d="M${W/2-6} 58 C ${W/2-44} 30, ${W/2-88} 44, ${W/2-96} 66 C ${W/2-64} 80, ${W/2-28} 76, ${W/2-6} 58 Z" fill="#8fd16a" stroke="#3b6b2a" stroke-width="3"/>`;
  R.forEach((cnt,ri)=>{const y=top+ri*DY,x0=W/2-(cnt-1)*DX/2+SH[ri]*DX/2;for(let j=0;j<cnt;j++){k++;const x=x0+j*DX,f=done.has(k),isT=big&&k===today&&k<=n&&!f&&today>=1;
    const past=k<today&&!f;
    h+=`<g class="g${isT?" today":""}${big&&p.justDid===k?" pop":""}" data-k="${k}"><circle class="b" cx="${x}" cy="${y}" r="${RAD}" fill="${f?"url(#gr)":past?"#f1ecf6":"#ffffff"}"/>${f?`<ellipse cx="${x-8}" cy="${y-9}" rx="7" ry="4.5" fill="#fff" opacity=".55"/>`:""}<text x="${x}" y="${y+1}" font-size="${k>=10?19:21}" fill="${f?"#fff":past?"#c9b9dc":"#7b4bb7"}">${k}</text></g>`}});
  return`<svg id="${big?"grape":""}" class="${big?"":"mini"}" viewBox="0 0 ${W} ${H}" aria-label="포도송이 ${n}알"><defs><radialGradient id="gr" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#b98be6"/><stop offset=".55" stop-color="#7b4bb7"/><stop offset="1" stop-color="#4b2a6e"/></radialGradient></defs>${h}</svg>`}

/* ---------- 화면 ---------- */
let cur=null,pickN=21;
function home(){cur=null;const L=DB.list;
  $("app").innerHTML=`<h1 class="sc-sky">기도 모으기</h1><p class="sub sc-sky">기도 제목을 정하고 매일 기도하면 포도알이 하나씩 채워져요</p>
  <div class="card"><h2>🍇 새 포도송이 만들기</h2>
    <div class="row"><input id="ttl" maxlength="30" placeholder="기도 제목 (예: 가정을 위한 기도)" style="flex:1;font-size:18px"></div>
    <div class="pick">${[21,30,40].map(n=>`<button data-n="${n}" class="${n===pickN?"on":""}"><b>${n}일</b><span class="hint">포도 ${n}알</span></button>`).join("")}</div>
    <div class="row"><span>시작하는 날</span><input type="date" id="sd" value="${dkey(new Date())}"><span class="hint">시작한 날이 1일차예요</span></div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="go" id="mk" style="font-size:20px;padding:10px 26px">🍇 포도송이 만들기</button></div></div>
  ${L.length?`<div class="card"><h2>📒 내 포도송이 (${L.length})</h2><div class="list">${L.map((p,i)=>{const d=(p.done||[]).length,t=Math.min(Math.max(dayNo(p.start),0),p.days);
    return`<div class="item" data-i="${i}">${grapeSVG(p,false)}<div style="flex:1;min-width:0"><div class="t">${esc(p.title||"기도")}</div><div class="s">${p.days}일 · ${fmt(p.start)} 시작 · ${dayNo(p.start)>p.days?"끝남":dayNo(p.start)<1?"아직 시작 전":t+"일차"}</div>
      <div class="bar"><i style="width:${Math.round(d/p.days*100)}%"></i></div><div class="s">포도 ${d}/${p.days}알</div></div></div>`}).join("")}</div></div>`:""}`;
  document.querySelectorAll(".pick [data-n]").forEach(b=>b.onclick=()=>{pickN=+b.dataset.n;document.querySelectorAll(".pick [data-n]").forEach(x=>x.classList.toggle("on",x===b))});
  $("mk").onclick=()=>{const title=$("ttl").value.trim()||"나의 기도";const st=$("sd").value||dkey(new Date());DB.list.unshift({id:Date.now().toString(36),title,days:pickN,start:st,done:[]});save();open(0)};
  document.querySelectorAll(".item").forEach(el=>el.onclick=()=>open(+el.dataset.i))}
function open(i){cur=i;const p=DB.list[i];if(!p){home();return}const n=p.days,t=dayNo(p.start),done=(p.done||[]).length,ended=t>n,before=t<1,todayDone=(p.done||[]).includes(t);
  let streak=0;for(let k=Math.min(t,n);k>=1;k--){if(p.done.includes(k))streak++;else if(k===t)continue;else break}
  $("app").innerHTML=`<div class="card">
    <div class="row" style="justify-content:space-between"><button class="sm" id="back">← 목록</button><span class="hint">${n}일 기도 · ${fmt(p.start)} ~ ${fmt(addDays(p.start,n-1))}</span></div>
    <h2 style="text-align:center;margin-top:8px">🙏 ${esc(p.title)}</h2>
    <div class="stat"><span>${before?`시작까지 <b>${1-t}</b>일`:ended?"기도 기간 끝":`오늘은 <b>${t}</b>일차`}</span><span>포도 <b>${done}</b>/${n}알</span><span>연속 <b>${streak}</b>일</span></div>
    ${grapeSVG(p,true)}
    <div class="today-box">${ended?`<div class="done-msg">${done===n?"🎉 포도송이를 다 채웠어요! 끝까지 기도했어요":`기도 기간이 끝났어요 · ${done}알을 채웠어요`}</div>`
      :before?`<div class="hint">${fmt(p.start)}부터 1번 포도알을 채울 수 있어요</div>`
      :todayDone?`<div class="done-msg">✅ 오늘(${t}번) 포도알을 채웠어요!</div><button class="sm" id="undo">오늘 체크 취소</button>`
      :`<button class="go" id="pray">🙏 오늘 기도했어요 (${t}번 알)</button><div class="hint" style="margin-top:6px">반짝이는 ${t}번 포도알을 눌러도 돼요</div>`}</div>
    <p class="hint" style="text-align:center">포도알 번호는 날짜예요. 기도한 날의 알만 채워지고, 지나간 날은 빈 채로 남아요.</p>
    <div class="row" style="justify-content:center"><button class="sm" id="ren">이름 바꾸기</button><button class="sm" id="del">지우기</button></div></div>`;
  delete p.justDid;
  $("back").onclick=home;
  const check=()=>{if(ended||before||todayDone)return;p.done=[...new Set([...(p.done||[]),t])].sort((a,b)=>a-b);p.justDid=t;save();toast(`🍇 ${t}번 포도알이 채워졌어요!`);open(i)};
  if($("pray"))$("pray").onclick=check;
  const g=document.querySelector(`#grape .g.today`);if(g)g.onclick=check;
  if($("undo"))$("undo").onclick=()=>{p.done=p.done.filter(k=>k!==t);save();open(i)};
  $("ren").onclick=()=>{const v=(prompt("기도 제목",p.title)||"").trim();if(v){p.title=v.slice(0,30);save();open(i)}};
  $("del").onclick=()=>{if(confirm(`‘${p.title}’ 포도송이를 지울까요?`)){DB.list.splice(i,1);save();home()}}}
home();
</script>
<script src="../assets/scene.js?v=20261116d"></script><script src="../assets/home.js?v=20261118"></script>
</body></html>
