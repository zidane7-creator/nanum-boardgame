<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clip=(s,n)=>String(s??'').replace(/[\u0000-\u001f]/g,' ').trim().slice(0,n);
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return Math.floor(a[0]/4294967296*n)};
let tt;function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms||2400)}
const app=$('#app');
const ROLE={h:['추수꾼','🌾','추수꾼끼리 의논해 밤마다 한 명을 데려가요'],c:['성도','🙏','추수꾼을 모두 찾아내면 이겨요'],p:['제사장','📜','밤마다 한 명이 추수꾼인지 알아봐요 (성도 편)'],s:['선지자','🕊️','밤마다 한 명을 지켜 살릴 수 있어요 (성도 편)']};
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];
const params=new URLSearchParams(location.search);
let ROOM=(params.get('room')||params.get('host')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
const HOSTING=!!params.get('host');
const base=()=>'chiyoung-harvest/v1/'+ROOM;
function mqttOpen(url,ms){return new Promise(res=>{if(typeof mqtt=='undefined')return res(null);let done=false;
  const cl=mqtt.connect(url,{connectTimeout:ms,reconnectPeriod:3000,clientId:'hv'+Math.random().toString(36).slice(2,12)});
  cl.on('connect',()=>{if(!done){done=true;res(cl)}});setTimeout(()=>{if(!done){done=true;try{cl.end(true)}catch(e){}res(null)}},ms)})}
const fmtT=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const PH={lobby:'대기실',roles:'역할 정하기',day:'아침 · 이야기 나누기',accuse:'의심 가는 사람 지목',trial:'심판 투표',night_h:'추수꾼의 밤',night_p:'제사장의 밤',night_s:'선지자의 밤',morning:'아침',end:'게임 끝'};

/* =====================================================================
   방장(진행) 기기: 게임 상태를 모두 가지고, 사람마다 보여 줄 것만 보내요
   ===================================================================== */
let G=null,isHost=false,MY=null; /* MY: 이 기기의 참가자 id (사회자면 null) */
const HK=()=>'harvest-host-'+ROOM;
const saveG=()=>{try{const c=JSON.parse(JSON.stringify(G,(k,v)=>k==='cl'?undefined:v));localStorage.setItem(HK(),JSON.stringify(c))}catch(e){}};
const P=id=>G.players.find(p=>p.id===id);
const alive=()=>G.players.filter(p=>p.alive);
const aliveRole=r=>G.players.filter(p=>p.alive&&p.role===r);
const nm=id=>(P(id)||{}).name||'?';
function newGame(mod,hostName){ROOM=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[rnd(32)]).join('');
  G={room:ROOM,mod,phase:'lobby',set:{reveal:true,h:1,p:1,s:1,talk:3},players:[],day:0,log:[],votes:{},trial:null,night:{h:{},p:{},s:{}},lock:{},pres:null,mission:null,hint:null,winner:null,timerEnd:0};
  if(!mod){MY='host-'+Math.random().toString(36).slice(2,8);G.players.push({id:MY,name:hostName,role:null,alive:true,host:true})}
  history.replaceState(null,'','?host='+ROOM);isHost=true;saveG();hostNet();render()}
function addLog(t){G.log.push(t);if(G.log.length>80)G.log.shift()}
/* --- 사람마다 보이는 상태 --- */
function viewFor(pid){const me=pid?P(pid):null,role=me&&me.role,ph=G.phase,isMod=!pid,dead=me&&!me.alive;
  const seeAll=isMod||G.phase==='end';
  const v={ph,day:G.day,mod:G.mod,set:{reveal:G.set.reveal},timerLeft:G.timerEnd?G.timerEnd-Date.now():0,log:G.log.slice(-30),hint:G.hint,winner:G.winner,room:G.room,
    me:me?{id:me.id,name:me.name,role:(ph==='lobby'||(ph==='roles'&&!G.rolesSent))?null:role,alive:me.alive,host:!!me.host}:null,
    players:G.players.map(p=>({id:p.id,name:p.name,alive:p.alive,shown:p.shown||null,role:seeAll?p.role:null}))};
  if(role&&ph!=='lobby'&&ph!=='roles'||(role&&ph==='roles'&&G.rolesSent)){
    v.allies=(role==='c'?[]:G.players.filter(p=>p.role===role&&p.id!==pid).map(p=>({id:p.id,name:p.name,alive:p.alive})))}
  if(ph==='accuse'){v.votes=G.votes;v.myVote=pid?G.votes[pid]||null:null}
  if(ph==='trial'){v.trial={target:G.trial.target,name:nm(G.trial.target),my:pid?(G.trial.v[pid]||null):null,done:Object.keys(G.trial.v).length,need:alive().filter(p=>p.id!==G.trial.target).length}}
  if(ph.startsWith('night_')){const g=ph.slice(6);v.turn=g;
    if(isMod||dead||role===g){v.picks=G.night[g];v.lock=G.lock[g]||null}
    if(isMod||dead){v.allNight={h:G.night.h,p:G.night.p,s:G.night.s,lock:G.lock}}}
  if(role==='p'||isMod)v.checks=(G.checks||[]).filter(c=>isMod||true);
  if(role==='h'||isMod||dead){if(G.mission)v.mission={text:G.mission.text,done:isMod||dead?G.mission.done:{[pid]:!!G.mission.done[pid]}}}
  if(G.pres)v.pres=G.pres;
  if(isMod)v.full=true;
  return v}
function broadcast(){if(!G)return;G.players.forEach(p=>{if(p.host)return;send(p,{t:'state',v:viewFor(p.id)})});saveG();render()}
const CONNS={};
function send(p,m){const c=CONNS[p.id];if(c)try{c.cl.publish(base()+'/c/'+p.id,JSON.stringify(m),{qos:1})}catch(e){}}
function hostNet(){BROKERS.forEach(async url=>{const cl=await mqttOpen(url,8000);if(!cl)return;const b=base();
  cl.subscribe(b+'/h',{qos:1});cl.on('connect',()=>cl.subscribe(b+'/h',{qos:1}));
  cl.on('message',(tp,buf)=>{let d;try{d=JSON.parse(buf.toString())}catch(_){return}if(!d||!d.from||!d.m)return;
    const from=String(d.from).replace(/[^a-z0-9-]/gi,'').slice(0,24);CONNS[from]={cl};hostHandle(from,d.m)});
  const s=$('#netSt');if(s)s.textContent='📡 초대 받는 중'})}
function reply(id,m){const c=CONNS[id];if(c)c.cl.publish(base()+'/c/'+id,JSON.stringify(m),{qos:1})}
function hostHandle(from,m){const t=m.t;
  if(t==='join'){const name=clip(m.name,10);let p=P(from);
    if(!p){if(G.phase!=='lobby')return reply(from,{t:'err',msg:'이미 게임이 시작됐어요'});if(!name)return reply(from,{t:'err',msg:'이름을 적어 주세요'});
      if(G.players.some(x=>x.name===name))return reply(from,{t:'err',msg:'같은 이름이 있어요. 성까지 적어 주세요'});
      if(G.players.length>=30)return reply(from,{t:'err',msg:'방이 꽉 찼어요'});
      p={id:from,name,role:null,alive:true};G.players.push(p);addLog(`🙋 ${name}님이 들어왔어요`)}
    reply(from,{t:'state',v:viewFor(from)});broadcast();return}
  const p=P(from);if(!p)return reply(from,{t:'err',msg:'방에 다시 들어와 주세요'});
  if(t==='ping')return reply(from,{t:'state',v:viewFor(from)});act(p,m)}
/* --- 참가자 행동 (방장 기기의 참가자도 이 함수로) --- */
function act(p,m){if(!p.alive)return;const ph=G.phase;
  if(m.t==='accuse'&&ph==='accuse'){const tg=P(m.target);if(m.target&&(!tg||!tg.alive))return;G.votes[p.id]=m.target||'skip';
    if(alive().every(x=>G.votes[x.id]))setTimeout(()=>{if(G.phase==='accuse')endAccuse()},1200);broadcast();return}
  if(m.t==='trial'&&ph==='trial'){if(p.id===G.trial.target)return;G.trial.v[p.id]=m.v==='kill'?'kill':'save';
    if(alive().filter(x=>x.id!==G.trial.target).every(x=>G.trial.v[x.id]))setTimeout(()=>{if(G.phase==='trial')endTrial()},1200);broadcast();return}
  if(m.t==='night'&&ph.startsWith('night_')){const g=ph.slice(6);if(p.role!==g||G.lock[g])return;const tg=P(m.target);if(!tg||!tg.alive)return;
    G.night[g][p.id]=m.target;const team=aliveRole(g);const vals=team.map(x=>G.night[g][x.id]);
    if(vals.length&&vals.every(v=>v&&v===vals[0])){G.lock[g]=vals[0];setTimeout(nextNight,2200)}broadcast();return}}
/* --- 진행 --- */
function canStart(){const n=G.players.length,s=G.set;return n>=3&&s.h>=1&&s.h+s.p+s.s<n&&s.h<n-s.h}
function startGame(){if(!canStart()){toast('인원과 역할 수를 확인해 주세요 (추수꾼은 성도 쪽보다 적어야 해요)',3500);return}
  G.players.forEach(p=>{p.role=null;p.alive=true;p.shown=null});G.day=0;G.log=[];G.mission=null;G.hint=null;G.winner=null;G.checks=[];
  G.phase='roles';G.rolesSent=false;addLog('🌙 밤이 되었어요. 역할을 정해요');
  if(!G.mod)assignRandom();broadcast()}
function assignRandom(){const ids=G.players.map(p=>p.id);for(let i=ids.length-1;i>0;i--){const j=rnd(i+1);[ids[i],ids[j]]=[ids[j],ids[i]]}
  const s=G.set;let k=0;ids.forEach(id=>{const p=P(id);p.role=k<s.h?'h':k<s.h+s.p?'p':k<s.h+s.p+s.s?'s':'c';k++});G.rolesSent=true;addLog('🎭 역할이 정해졌어요. 내 역할을 확인하세요')}
function sendRoles(){const s=G.set,cnt=r=>G.players.filter(p=>p.role===r).length;
  if(G.players.some(p=>!p.role))G.players.forEach(p=>{if(!p.role)p.role='c'});
  if(cnt('h')!==s.h||cnt('p')!==s.p||cnt('s')!==s.s){toast(`추수꾼 ${s.h}·제사장 ${s.p}·선지자 ${s.s}명에 맞춰 주세요`,3000);return}
  G.rolesSent=true;addLog('🎭 역할이 정해졌어요. 내 역할을 확인하세요');broadcast()}
function startDay(){G.day++;G.phase='day';G.votes={};G.trial=null;G.pres=null;const m=+G.set.talk||0;G.timerEnd=m?Date.now()+m*60000:0;
  addLog(`☀️ ${G.day}일째 아침이에요. 추수꾼을 찾아 이야기를 나눠요`);broadcast()}
function startAccuse(){G.phase='accuse';G.votes={};G.timerEnd=0;addLog('👉 의심 가는 사람을 지목해요');broadcast()}
function endAccuse(){const c={};Object.values(G.votes).forEach(v=>{if(v&&v!=='skip')c[v]=(c[v]||0)+1});const max=Math.max(0,...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===max);
  if(!max||top.length>1){addLog(max?`⚖️ ${top.map(nm).join(', ')} 동점이라 심판 없이 밤이 와요`:'🤷 지목된 사람이 없어 밤이 와요');G.pres={t:'notrial',text:max?'동점이라 심판 없이 밤이 와요':'지목된 사람이 없어요'};startNight();return}
  G.phase='trial';G.trial={target:top[0],v:{}};addLog(`⚖️ ${nm(top[0])}님이 ${max}표로 심판대에 올랐어요`);broadcast()}
function endTrial(){const t=G.trial,k=Object.values(t.v).filter(v=>v==='kill').length,s=Object.values(t.v).filter(v=>v==='save').length,p=P(t.target);
  if(k>s){p.alive=false;if(G.set.reveal)p.shown=p.role==='h'?'추수꾼':'성도';
    addLog(`⚰️ 죽이자 ${k} : 살리자 ${s} — ${p.name}님이 심판받았어요${G.set.reveal?` (${p.shown}${p.shown==='추수꾼'?'이었어요':'였어요'})`:''}`);G.pres={t:'exec',text:`${p.name}님이 심판받았어요${G.set.reveal?` · ${p.shown}${p.shown==='추수꾼'?'이었어요':'였어요'}`:''}`}}
  else{addLog(`🕊️ 죽이자 ${k} : 살리자 ${s} — ${p.name}님은 살았어요`);G.pres={t:'spare',text:`${p.name}님은 살았어요`}}
  if(checkWin())return;startNight()}
function startNight(){G.phase='night_h';G.night={h:{},p:{},s:{}};G.lock={};G.timerEnd=0;addLog('🌙 추수꾼의 밤이 찾아왔어요');

function emptyTurn(){const g=G.phase.slice(6);if(!aliveRole(g).length){const ph=G.phase;setTimeout(()=>{if(G.phase===ph)nextNight()},7000+rnd(6000))}}

  else if(G.phase==='night_s'){morning();return}else return;broadcast();emptyTurn()}
function morning(){const k=G.lock.h,sv=G.lock.s;G.phase='morning';
  if(k&&k!==sv){const p=P(k);p.alive=false;addLog(`🌅 밤사이 ${p.name}님이 추수꾼에게 데려가졌어요`);G.pres={t:'night',text:`밤사이 ${p.name}님이 쓰러졌어요`}}
  else{addLog('🌅 밤사이 아무 일도 일어나지 않았어요');G.pres={t:'night',text:'밤사이 아무 일도 일어나지 않았어요'}}

function checkWin(){const h=aliveRole('h').length,o=alive().length-h;let w=null;if(h===0)w='c';else if(h>=o)w='h';
  if(!w)return false;G.phase='end';G.winner=w;G.timerEnd=0;addLog(w==='h'?'🌾 추수꾼이 이겼어요!':'🙏 성도가 이겼어요! 추수꾼을 모두 찾았어요');broadcast();return true}

    h+=`<div class="card"><h2>👉 의심 가는 사람을 지목해요</h2>${me.alive?'<p class="hint">이름을 눌러요. 바꿀 수도 있어요.</p>':deadNote}${plist(v,{pick:p=>me.alive&&p.alive&&p.id!==me.id,mine:v.myVote,cnt:p=>c[p.id]||0})}
     ${me.alive?`<div class="row" style="margin-top:8px"><button class="sm" data-pick="skip">🤐 아무도 지목 안 해요</button>${v.myVote==='skip'?'<span class="badge">기권</span>':''}</div>`:''}<p class="hint">지목 ${Object.keys(v.votes||{}).length}/${v.players.filter(p=>p.alive).length}명 · 다 지목하면 가장 많이 받은 사람이 심판대에 올라요</p>${host&&!v.mod?'<button class="sm" data-a="endAccuse">지목 마감하기</button>':''}</div>`}
  if(ph==='trial'){const T=v.trial;h+=`<div class="card center"><h2>⚖️ ${esc(T.name)}님 심판</h2>${T.target===me.id?'<p>변론해 주세요! (심판받는 사람은 투표하지 않아요)</p>':me.alive?`<p>죽일까요, 살릴까요?</p><div class="row" style="justify-content:center"><button class="${T.my==='kill'?'pri':''} big" data-tv="kill">⚰️ 죽이자</button><button class="${T.my==='save'?'ok':''} big" data-tv="save">🕊️ 살리자</button></div>`:deadNote}<p class="hint">투표 ${T.done}/${T.need}명</p>${host&&!v.mod?'<button class="sm" data-a="endTrial">심판 마감하기</button>':''}</div>`}
  if(ph.startsWith('night_')){const g=v.turn,mine=myRole===g&&me.alive;
    if(mine){const picks=v.picks||{},cnt={};Object.values(picks).forEach(x=>cnt[x]=(cnt[x]||0)+1);
      h+=`<div class="card"><h2>${ROLE[g][1]} ${ROLE[g][0]}의 차례</h2><p>${g==='h'?'누구를 데려갈까요?':g==='p'?'누가 추수꾼인지 알아볼까요?':'누구를 지켜 살릴까요?'} ${v.allies&&v.allies.filter(a=>a.alive).length?'모두 같은 사람을 찍어야 정해져요.':''}</p>
       ${plist(v,{pick:p=>p.alive&&!v.lock,mine:picks[me.id],locked:v.lock,cnt:p=>cnt[p.id]||0,tag:p=>{const who=Object.entries(picks).filter(([a,b])=>b===p.id).map(([a])=>(v.players.find(x=>x.id===a)||{}).name);return who.length?`<span class="tag">👉 ${who.map(esc).join(', ')}</span>`:''}})}
       ${v.lock?`<p class="center j" style="font-size:20px">✔ ${esc((v.players.find(p=>p.id===v.lock)||{}).name)}(으)로 정했어요</p>`:''}</div>`}
    else if(!me.alive&&v.allNight){const A=v.allNight,line=r=>Object.entries(A[r]).map(([a,b])=>`${esc((v.players.find(x=>x.id===a)||{}).name)}→${esc((v.players.find(x=>x.id===b)||{}).name)}`).join(', ')||'-';
      h+=`<div class="card"><h2>👻 ${ROLE[g][0]}의 밤을 지켜봐요</h2>${['h','p','s'].map(r=>`<div><b>${ROLE[r][1]} ${ROLE[r][0]}</b>: ${line(r)}${A.lock[r]?` → <b>${esc((v.players.find(x=>x.id===A.lock[r])||{}).name)}</b>`:''}</div>`).join('')}</div>`}
    else h+=`<div class="card center"><div class="big-ico">🌙</div><h2>${ROLE[g][1]} ${ROLE[g][0]}의 차례예요</h2><p>눈을 감고 조용히 기다려요…</p></div>`}
  if(ph==='morning')h+=`<div class="card center"><div class="big-ico">🌅</div><h2>아침이 밝아요</h2></div>`;
  if(ph==='end')h+=`<div class="card center"><div class="big-ico">${v.winner==='h'?'🌾':'🙏'}</div><h2>${v.winner==='h'?'추수꾼 승리!':'성도 승리!'}</h2>${plist(v,{showRole:true})}${host?'<button class="pri" data-a="again" style="margin-top:10px">같은 사람들로 다시 하기</button>':''}</div>`;
  app.innerHTML=h+logCard(v);bindCommon();
  const pk=$('#peek');if(pk){const show=on=>{$('#peekBox').style.display=on?'block':'none'};['pointerdown'].forEach(e=>pk.addEventListener(e,()=>show(true)));['pointerup','pointerleave','pointercancel'].forEach(e=>pk.addEventListener(e,()=>show(false)))}}
/* ---------- 버튼 ---------- */
function doAct(m){if(isHost){const p=P(MY);if(p)act(p,m)}else CL.send(m)}
function bindCommon(){
  $$('[data-pick]').forEach(b=>b.onclick=()=>{const id=b.dataset.pick,ph=LV.ph;if(ph==='accuse')doAct({t:'accuse',target:id==='skip'?null:id});else if(ph.startsWith('night_'))doAct({t:'night',target:id})});
  $$('[data-tv]').forEach(b=>b.onclick=()=>doAct({t:'trial',v:b.dataset.tv}));
  $$('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==='copy'){navigator.clipboard.writeText(location.origin+location.pathname+'?room='+G.room).then(()=>toast('링크를 복사했어요'));return}
    if(a==='start')return startGame();if(a==='sendRoles')return sendRoles();if(a==='day')return startDay();if(a==='accuse')return startAccuse();
    if(a==='endAccuse')return endAccuse();if(a==='endTrial')return endTrial();
    if(a==='randRole'){G.players.forEach(p=>p.role=null);assignRandom();G.rolesSent=false;broadcast();return}
    if(a==='mission'){const t=clip($('#misT').value,120);if(!t){toast('미션을 적어 주세요');return}G.mission={text:t,day:G.day,done:{}};addLog('🎯 사회자가 추수꾼에게 미션을 보냈어요');broadcast();toast('추수꾼에게 미션을 보냈어요');return}
    if(a==='hint'){const t=clip($('#hintT').value,120);if(!t)return;G.hint=t;G.missionFail=false;addLog('💡 사회자 힌트: '+t);broadcast();return}
    if(a==='again'){G.phase='lobby';G.players.forEach(p=>{p.role=null;p.alive=true;p.shown=null});G.pres=null;G.hint=null;G.mission=null;broadcast();return}});
  $$('[data-s]').forEach(el=>el.onchange=()=>{const k=el.dataset.s;G.set[k]=el.type==='checkbox'?el.checked:+el.value;broadcast()});
  $$('[data-role]').forEach(el=>el.onchange=()=>{P(el.dataset.role).role=el.value;saveG();render()});
  $$('[data-mdone]').forEach(el=>el.onchange=()=>{G.mission.done[el.dataset.mdone]=el.checked;broadcast()})}
let netOnce=false;function hostNet2(){if(netOnce)return;netOnce=true}

/* =====================================================================
   참가자 기기
   ===================================================================== */
const CL={joined:false,name:'',id:null,cl:null,send(m){if(this.cl)this.cl.publish(base()+'/h',JSON.stringify({from:this.id,m}),{qos:1})}};
async function joinRoom(name){CL.name=name;try{CL.id=sessionStorage.getItem('hv-id-'+ROOM)}catch(_){}if(!CL.id){CL.id='p'+Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('hv-id-'+ROOM,CL.id);sessionStorage.setItem('hv-name-'+ROOM,name)}catch(_){}}
  const st=$('#jSt');if(st)st.textContent='방에 연결하는 중…';
  for(const url of BROKERS){const cl=await mqttOpen(url,7000);if(!cl)continue;let heard=false;
    cl.subscribe(base()+'/c/'+CL.id,{qos:1});cl.on('connect',()=>{cl.subscribe(base()+'/c/'+CL.id,{qos:1});if(CL.joined)CL.send({t:'join',name:CL.name})});
    cl.on('message',(tp,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(_){return}heard=true;
      if(m.t==='state'){const first=!LV||LV.ph!==m.v.ph;LV=m.v;LV.timerEnd=m.v.timerLeft>0?Date.now()+m.v.timerLeft:0;CL.joined=true;render();if(first&&navigator.vibrate)try{navigator.vibrate(120)}catch(_){}}
      else if(m.t==='err'){toast(m.msg,3500);const s=$('#jSt');if(s)s.textContent=m.msg}});
    CL.cl=cl;CL.send({t:'join',name});for(let i=0;i<25&&!heard;i++){await new Promise(r=>setTimeout(r,300));if(i===10)CL.send({t:'join',name})}
    if(heard){setInterval(()=>CL.send({t:'ping'}),15000);return}try{cl.end(true)}catch(_){}CL.cl=null}
  const s=$('#jSt');if(s)s.textContent='방에 연결하지 못했어요. 방 코드와 방장 화면이 켜져 있는지 확인해 주세요'}

/* ---------- 시작 ---------- */
if(HOSTING&&ROOM){try{G=JSON.parse(localStorage.getItem(HK())||'null')}catch(_){}if(G){isHost=true;MY=(G.players.find(p=>p.host)||{}).id||null;hostNet()}else{history.replaceState(null,'','./');ROOM=''}}
else if(ROOM){let n='';try{n=sessionStorage.getItem('hv-name-'+ROOM)||''}catch(_){}if(n){CL.name=n;joinRoom(n)}}
render();
})();
</script>
