<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js" integrity="sha384-u4uqeACkFcoKl57rBQJHVGDd1pqhW4w8X3WjTu1ZksPdxoLqdt34jpoNkJisE25W" crossorigin="anonymous"></script>
<script>
"use strict";
/* =====================================================================
   익명질문 — 방장 기기가 방이에요. 참가자는 이름 없이 모두 '누군가'.
   참가자 화면에는 누가 방장인지, 누가 무슨 질문을 했는지 나오지 않아요.
   ===================================================================== */
const PREFIX="chiyoung-anon-",MAX=60,ANON="누군가";
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clip=(s,n)=>String(s??"").replace(/[\u0000-\u0009\u000b-\u001f]/g," ").trim().slice(0,n);
let tt;function toast(t,ms=2200){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),ms)}
const params=new URLSearchParams(location.search);
let ROOM=(params.get("room")||params.get("host")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
const HOSTING=!!params.get("host");
const store={get(k){try{return JSON.parse(sessionStorage.getItem(k))}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let wake=null;async function keepAwake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}}
function fsToggle(){const d=document;if(!d.fullscreenElement&&!d.webkitFullscreenElement){const el=d.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);d.body.classList.add("fs-on")}
  else{(d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d);d.body.classList.remove("fs-on")}setTimeout(fsLabel,300)}
function fsLabel(){const on=!!(document.fullscreenElement||document.webkitFullscreenElement);document.body.classList.toggle("fs-on",on);$("#fsBtn").textContent=on?"✕ 전체화면 끝":"⛶ 전체화면"}
document.addEventListener("fullscreenchange",fsLabel);$("#fsBtn").onclick=fsToggle;

const C={phase:"home",me:null,name:ANON,st:null,lastAsk:0};
let peer=null,conn=null,isHost=false,retry=0;
function toHost(msg){if(isHost)hostHandle("host",msg);else if(conn&&conn.open)conn.send(msg);else toast("연결이 끊겼어요. 다시 연결하는 중…")}

/* ================= 방장 ================= */
const H={players:[],targets:[],cur:null,qs:[]};
try{const o=JSON.parse(localStorage.getItem("anon:targets")||"null");if(Array.isArray(o))H.targets=o.map(n=>({id:Math.random().toString(36).slice(2,8),name:clip(n,12),fin:false}))}catch(e){}
const saveT=()=>{try{localStorage.setItem("anon:targets",JSON.stringify(H.targets.map(t=>t.name)))}catch(e){}};
const P=id=>H.players.find(p=>p.id==id);
function sendTo(p,msg){if(!p||!p.conn||!p.conn.open)return;try{p.conn.send(msg)}catch(e){}}
const broadcast=msg=>H.players.forEach(p=>sendTo(p,msg));
const tName=()=>{const t=H.targets.find(x=>x.id===H.cur);return t?t.name:null};
/* 참가자에게는 지금 대상과 그 대상에게 온 질문만 보내요 (누가 썼는지는 보내지 않아요) */
function stateMsg(){const tg=H.cur;return{t:"state",target:tName(),qs:H.qs.filter(q=>q.to===tg&&!q.hide).map(q=>({id:q.id,text:q.text,done:q.done})),people:H.players.length+1}}
function push(){broadcast(stateMsg());if(C.phase==="host")renderHost()}
function createRoom(code,tries){
  isHost=true;C.me="host";ROOM=code||Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
  renderMsg("방을 만들고 있어요…");
  peer=new Peer(PREFIX+ROOM,PEER_OPTS());
  peer.on("open",()=>{startRelayHost();history.replaceState(null,"","?host="+ROOM);C.phase="host";renderHost();keepAwake()});
  peer.on("error",e=>{if(e.type=="unavailable-id"){peer.destroy();if(code&&(tries||0)<4)setTimeout(()=>createRoom(code,(tries||0)+1),2500);else createRoom()}
    else if(e.type=="network"||e.type=="server-error"||e.type=="socket-error")toast("인터넷 연결을 확인해 주세요")});
  peer.on("disconnected",()=>{setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
  peer.on("connection",c=>{c.on("data",d=>{if(d&&d.t=="join")hostJoin(c,d);else{const p=H.players.find(p=>p.conn===c);if(p)hostHandle(p.id,d)}});c.on("close",()=>{if(C.phase==="host")renderHost()})})}
function hostJoin(c,d){const id=String(d.id||"").replace(/[^a-z0-9]/gi,"").slice(0,20);if(!id)return;let p=P(id);
  if(p)p.conn=c;else{if(H.players.length>=MAX){c.send({t:"err",msg:"방이 꽉 찼어요 (최대 "+MAX+"명)"});return}p={id,conn:c,last:0};H.players.push(p)}
  sendTo(p,stateMsg());push()}
function hostHandle(from,m){if(!m||!m.t)return;
  if(m.t==="ask"){const p=from==="host"?{last:H.hostLast||0}:P(from);if(!p)return;const text=clip(m.text,200);if(!text)return;
    if(!H.cur){if(from!=="host")sendTo(p,{t:"note",msg:"아직 질문 받을 사람이 정해지지 않았어요"});return}
    const now=Date.now();if(now-(from==="host"?H.hostLast||0:p.last)<4000){if(from!=="host")sendTo(p,{t:"note",msg:"조금만 천천히 보내 주세요"});return}
    if(from==="host")H.hostLast=now;else p.last=now;
    H.qs.push({id:now.toString(36)+Math.random().toString(36).slice(2,5),to:H.cur,text,at:now,done:false,hide:false});push();
    if(from!=="host")sendTo(p,{t:"ok"})}}
function PEER_OPTS(){const d=(window.peerjs&&peerjs.util&&peerjs.util.defaultConfig||{}).iceServers||[];
  return{debug:0,config:{iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun.cloudflare.com:3478"]},...d.filter(s=>String(s.urls).includes("turn"))],iceCandidatePoolSize:4,sdpSemantics:"unified-plan"}}}
let warm=null,attempt=0;
function warmPeer(){if(peer&&!peer.destroyed&&warm)return warm;
  peer=new Peer(PEER_OPTS());warm=new Promise(res=>{peer.on("open",()=>res(true));setTimeout(()=>res(false),8000)});
  peer.on("error",e=>{if(e.type=="peer-unavailable"){if(!(C.phase=="home"||C.phase=="msg"))setTimeout(reconnect,2000)}else if(e.type=="network"||e.type=="server-error"||e.type=="socket-error")toast("인터넷 연결을 확인해 주세요")});
  peer.on("disconnected",()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}});return warm}
async function joinRoom(name){
  C.name=name;let id=store.get("anon-id-"+ROOM);if(!id){id="p"+Math.random().toString(36).slice(2,10);store.set("anon-id-"+ROOM,id)}
  C.me=id;store.set("anon-name-"+ROOM,name);renderMsg("방에 들어가는 중… ①");
  let ok=await warmPeer();if(!ok||!peer.open){try{peer.destroy()}catch(e){}warm=null;ok=await warmPeer()}
  attempt=0;usingRelay=false;if(ok)dial(id,name);
  setTimeout(async()=>{if(conn&&conn.open&&!conn.relay)return;
    if(C.phase=="msg")renderMsg("방장 기기와 연결하는 중… ③<br><span class='muted'>다른 길로 연결하고 있어요</span>");
    const r=await relayDial(id,name);
    if(!r&&!(conn&&conn.open))renderMsg("방장 기기와 연결이 잘 안 돼요 😢<br><span class='muted'>· 방장 화면이 켜져 있는지 확인해 주세요<br>· 방 코드가 맞는지 확인해 주세요<br>· 그래도 안 되면 새로고침해 주세요</span>",true)},ok?7000:500)}
function dial(id,name){if(C.phase=="msg"&&!usingRelay)renderMsg("방장 기기와 연결하는 중… ②");
  const c=peer.connect(PREFIX+ROOM,{reliable:true});conn=c;let opened=false;
  const to=setTimeout(()=>{if(opened)return;try{c.close()}catch(e){}if(!usingRelay&&++attempt<=2)dial(id,name)},6000);
  c.on("open",()=>{opened=true;clearTimeout(to);if(usingRelay){try{c.close()}catch(e){}return}retry=0;attempt=0;c.send({t:"join",id,name});keepAwake()});
  c.on("data",client);
  c.on("close",()=>{clearTimeout(to);if(!opened||conn!==c)return;toast("방장과 연결이 끊겼어요. 다시 연결하는 중…",4000);setTimeout(reconnect,1200)})}
function reconnect(){if(isHost||usingRelay||conn&&conn.open)return;if(++retry>20){renderMsg("방장과 다시 연결하지 못했어요.<br><span class='muted'>방장의 화면이 꺼지지 않았는지 확인하고 새로고침해 주세요.</span>",true);return}joinRoom(C.name)}
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];
const relayBase=()=>"chiyoung-anon/v1/"+ROOM;let usingRelay=false;
function mqttOpen(url,ms){return new Promise(res=>{if(typeof mqtt=="undefined")return res(null);let done=false;
  const cl=mqtt.connect(url,{connectTimeout:ms,reconnectPeriod:2000,clientId:"ca"+Math.random().toString(36).slice(2,12)});
  cl.on("connect",()=>{if(!done){done=true;res(cl)}});setTimeout(()=>{if(!done){done=true;try{cl.end(true)}catch(e){}res(null)}},ms)})}
function startRelayHost(){if(typeof mqtt=="undefined")return;
  BROKERS.forEach(async url=>{const cl=await mqttOpen(url,8000);if(!cl)return;const base=relayBase(),conns={};
    cl.subscribe(base+"/h",{qos:1});cl.on("connect",()=>cl.subscribe(base+"/h",{qos:1}));
    cl.on("message",(t,buf)=>{let d;try{d=JSON.parse(buf.toString())}catch(e){return}if(!d||!d.from||!d.m)return;
      const from=String(d.from).replace(/[^a-z0-9]/gi,"").slice(0,20);
      const c=conns[from]||(conns[from]={open:true,relay:true,send:m=>cl.publish(base+"/c/"+from,JSON.stringify(m),{qos:1})});
      if(d.m.t=="join"){d.m.id=from;hostJoin(c,d.m)}else{const pl=P(from);if(pl&&pl.conn===c)hostHandle(pl.id,d.m)}})})}
async function relayDial(id,name){
  for(const url of BROKERS){if(conn&&conn.open&&!conn.relay)return true;
    const cl=await mqttOpen(url,6000);if(!cl)continue;const base=relayBase();
    cl.subscribe(base+"/c/"+id,{qos:1});cl.on("connect",()=>cl.subscribe(base+"/c/"+id,{qos:1}));
    let heard=false;cl.on("message",(t,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(e){return}heard=true;if(usingRelay)client(m)});
    usingRelay=true;const c={open:true,relay:true,send:m=>cl.publish(base+"/h",JSON.stringify({from:id,m}),{qos:1})};conn=c;
    c.send({t:"join",id,name});
    for(let i=0;i<25&&!heard;i++)await new Promise(r=>setTimeout(r,200));
    if(heard){keepAwake();return true}
    usingRelay=false;try{cl.end(true)}catch(e){}}
  return false}


/* ================= 참가자 메시지 ================= */
function client(m){if(!m||!m.t)return;
  if(m.t=="err"){renderMsg(esc(m.msg),true);return}
  if(m.t=="note"){toast(m.msg);return}
  if(m.t=="ok"){toast("질문을 보냈어요 🙌");const ta=$("#qIn");if(ta)ta.value="";return}
  if(m.t=="state"){const prev=C.st&&C.st.target;C.st=m;if(C.phase!=="guest"){C.phase="guest";renderGuest(true)}else renderGuest(prev!==m.target)}}

/* ================= 화면 ================= */
function renderMsg(html,back){C.phase="msg";$("#fsBtn").hidden=true;app.innerHTML='<div class="card center"><p style="font-size:20px">'+html+'</p>'+(back?'<button onclick="location.href=location.pathname">처음으로</button>':'<div class="muted">잠시만요…</div>')+'</div>'}
function renderHome(){C.phase="home";$("#fsBtn").hidden=true;
  if(ROOM&&!HOSTING){app.innerHTML=`<div class="hero"><div class="em">❓</div><h1>익명질문</h1></div><div class="card center"><h2>방 <b style="letter-spacing:4px">${esc(ROOM)}</b> 에 들어가요</h2>
    <p class="muted">이름은 묻지 않아요. 모두 <b>‘${ANON}’</b>로 질문을 올려요.</p><button class="pri" id="join" style="font-size:20px;padding:10px 28px">들어가기</button></div>`;
    $("#join").onclick=()=>joinRoom(ANON);warmPeer();return}
  app.innerHTML=`<div class="hero"><div class="em">❓</div><h1>익명질문</h1><p class="muted">모두 ‘누군가’가 되어 한 사람에게 질문하고, 그 사람은 말로 대답해요</p></div>
    <div class="card center"><h2>🏠 방장으로 시작</h2><p class="muted">QR·링크로 초대하고, 질문 받을 사람을 차례로 골라요. 참가자는 누가 방장인지 알 수 없어요.</p><button class="pri" id="mk" style="font-size:20px;padding:10px 26px">방 만들기</button></div>
    <div class="card center"><h2>🙋 초대받았어요</h2><div class="row" style="justify-content:center"><input id="rc" maxlength="6" placeholder="방 코드" style="text-transform:uppercase;letter-spacing:4px;width:160px;font-size:20px"><button id="go">들어가기</button></div></div>`;
  $("#mk").onclick=()=>createRoom();$("#go").onclick=()=>{const c=$("#rc").value.toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.length<4){toast("방 코드 4자리를 넣어 주세요");return}location.href="?room="+c}}
function renderHost(){$("#fsBtn").hidden=false;$("#ttl").textContent="❓ 익명질문 · 방 "+ROOM;
  const keep=document.activeElement&&document.activeElement.id,val=keep==="hostQ"?$("#hostQ").value:"";
  const url=location.origin+location.pathname+"?room="+ROOM;let qr="";try{const q=qrcode(0,"M");q.addData(url);q.make();qr=q.createSvgTag(5,2)}catch(e){}
  const name=tName(),list=H.qs.filter(q=>q.to===H.cur);
  app.innerHTML=`<div class="hostgrid"><div>
    <div class="target${name?"":" none"}">${name?`<b>[${esc(name)}]</b>님에게 질문해 주세요`:"오른쪽에서 질문 받을 사람을 골라 주세요"}</div>
    <div class="qs">${list.length?list.map((q,i)=>`<div class="q${q.done?" done":""}${q.hide?" done":""}"><div class="who">${ANON} · ${i+1}번째 질문${q.hide?" · 숨김":""}</div><div class="tx">${esc(q.text)}</div>
      <div class="qb hide-fs"><button data-q="${q.id}" data-a="done">${q.done?"되돌리기":"✔ 답함"}</button><button data-q="${q.id}" data-a="hide">${q.hide?"보이기":"숨기기"}</button></div></div>`).join(""):name?'<p class="muted center">아직 질문이 없어요. 모두 휴대폰으로 질문을 보내고 있어요…</p>':""}</div>
    ${name?`<div class="card ask hide-fs" style="margin-top:14px"><b>방장도 ‘${ANON}’로 질문할 수 있어요</b><textarea id="hostQ" maxlength="200" placeholder="질문을 적어 주세요"></textarea><div class="row" style="justify-content:flex-end"><button class="pri" id="hostSend">질문 보내기</button></div></div>`:""}
  </div><div>
    <div class="card"><h2>🎯 질문 받을 사람</h2><div class="plist">${H.targets.map(t=>`<div class="pp${t.id===H.cur?" on":""}${t.fin?" fin":""}" data-t="${t.id}"><span class="nm">${esc(t.name)}</span><span class="c">${H.qs.filter(q=>q.to===t.id&&!q.hide).length}</span><button class="hide-fs" data-del="${t.id}" title="빼기">✕</button></div>`).join("")||'<p class="muted">이름을 적어 추가해 주세요</p>'}</div>
      <div class="row hide-fs" style="margin-top:10px"><input id="tIn" maxlength="12" placeholder="이름" style="flex:1"><button class="sm" id="tAdd">추가</button></div>
      <div class="row" style="margin-top:10px;justify-content:center"><button class="go" id="next" ${H.targets.length?"":"disabled"}>▶ 다음 사람</button></div></div>
    <div class="card center hide-fs"><h2>📷 초대하기</h2><div class="qr">${qr}</div><div class="code">${esc(ROOM)}</div><button class="sm" id="cp">🔗 초대 링크 복사</button><p class="muted">들어온 사람 ${H.players.length}명 · 이 화면을 켜 두세요</p></div>
  </div></div>`;
  app.querySelectorAll("[data-t]").forEach(el=>el.onclick=e=>{if(e.target.closest("[data-del]"))return;H.cur=el.dataset.t;push();toast(`${tName()}님 차례예요`)});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;if(H.qs.some(q=>q.to===id)&&!confirm("이 사람에게 온 질문도 함께 지워져요. 뺄까요?"))return;H.targets=H.targets.filter(t=>t.id!==id);H.qs=H.qs.filter(q=>q.to!==id);if(H.cur===id)H.cur=null;saveT();push()});
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const q=H.qs.find(x=>x.id===b.dataset.q);if(!q)return;if(b.dataset.a==="done")q.done=!q.done;else q.hide=!q.hide;push()});
  const add=()=>{const v=clip($("#tIn").value,12);if(!v)return;H.targets.push({id:Math.random().toString(36).slice(2,8),name:v,fin:false});saveT();renderHost();$("#tIn").focus()};
  $("#tAdd").onclick=add;$("#tIn").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing)add()};
  $("#next").onclick=()=>{const i=H.targets.findIndex(t=>t.id===H.cur);if(i>=0)H.targets[i].fin=true;const nx=H.targets.slice(i+1).find(t=>!t.fin)||H.targets.find(t=>!t.fin);
    if(!nx){H.cur=null;push();toast("모든 사람의 질문 시간이 끝났어요 🎉",3000);return}H.cur=nx.id;push();toast(`${nx.name}님 차례예요`)};
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(url);toast("초대 링크를 복사했어요")}catch(e){prompt("이 링크를 복사해 주세요",url)}};
  const hq=$("#hostQ");if(hq){if(keep==="hostQ"){hq.value=val;hq.focus()}$("#hostSend").onclick=()=>{const v=hq.value.trim();if(!v)return;hostHandle("host",{t:"ask",text:v});hq.value=""}}}
function renderGuest(changed){const s=C.st;$("#fsBtn").hidden=true;$("#ttl").textContent="❓ 익명질문";
  const typing=$("#qIn")?$("#qIn").value:"";
  app.innerHTML=`<div class="target${s.target?"":" none"}">${s.target?`<b>[${esc(s.target)}]</b>님에게 질문해 주세요`:"잠시만 기다려 주세요. 곧 질문 받을 사람이 정해져요"}</div>
    ${s.target?`<div class="card ask" style="margin-top:14px"><div class="muted">내 이름은 보이지 않아요. 모두 <b>‘${ANON}’</b>로 올라가요.</div><textarea id="qIn" maxlength="200" placeholder="${esc(s.target)}님에게 궁금한 것을 적어 주세요"></textarea><div class="row" style="justify-content:flex-end"><button class="pri" id="send">질문 보내기</button></div></div>`:""}
    <div class="qs">${s.qs.map((q,i)=>`<div class="q${q.done?" done":""}"><div class="who">${ANON} · ${i+1}번째 질문${q.done?" · 답함":""}</div><div class="tx">${esc(q.text)}</div></div>`).join("")}</div>`;
  const ta=$("#qIn");if(ta){if(!changed)ta.value=typing;$("#send").onclick=()=>{const v=ta.value.trim();if(!v){toast("질문을 적어 주세요");return}if(Date.now()-C.lastAsk<4000){toast("조금만 천천히 보내 주세요");return}C.lastAsk=Date.now();toHost({t:"ask",text:v})}}
  if(changed&&s.target)toast(`이제 ${s.target}님에게 질문해요`)}
if(HOSTING&&ROOM)createRoom(ROOM);else renderHome();
</script>
