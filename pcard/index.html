:root{--ink:#3d2f4a;--lav:#e6d8f7;--lav2:#cdb6ee;--pink:#ff8fb8;--accent:#8a5cd6;--cream:#fffaf6}

.pc .back::before{content:"";position:absolute;inset:14px;border:2px dashed rgba(255,255,255,.6);border-radius:12px}
.pc .front{transform:rotateY(180deg)}.pc .front img{width:100%;height:100%;display:block}
.pc:not(.tS):not(.tA):not(.tB) .shine{display:none}.pc.tS .shine{animation-duration:2s}
.pocket.tS::before,.pocket.tA::before,.pocket.tB::before{content:"";position:absolute;left:5px;right:5px;top:5px;bottom:24px;border-radius:6px;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.6) 48%,transparent 60%);background-size:260% 100%;animation:shine 3.4s ease-in-out infinite;z-index:1;pointer-events:none;mix-blend-mode:screen}
.pc .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,rgba(255,240,255,.2) 52%,transparent 62%);background-size:250% 100%;mix-blend-mode:screen;animation:shine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.pc.rise{animation:rise 1.1s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rise{0%{transform:translateY(-140px) scale(.35);opacity:0}30%{opacity:1}100%{transform:none}}
.burst{position:absolute;left:50%;top:40%;pointer-events:none}
.burst i{position:absolute;font-style:normal;font-size:22px;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.1);opacity:0}}
.tapme{font-family:Jua;color:var(--accent);margin-top:12px;animation:bob 1s ease-in-out infinite}

.pg{background:#fbf7ff;border-radius:12px;padding:14px;box-shadow:inset 0 0 0 2px #e6dbf7;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;transform-origin:left center}
.pg.turn{animation:turn .45s ease}
@keyframes turn{0%{transform:rotateY(-70deg);opacity:.2}100%{transform:none;opacity:1}}
.pocket{position:relative;aspect-ratio:600/980;border-radius:8px;background:linear-gradient(180deg,rgba(230,220,250,.55),rgba(240,232,255,.3));box-shadow:inset 0 0 0 1.5px rgba(160,130,210,.45);padding:5px 5px 0;display:flex;flex-direction:column;cursor:default}
.pocket img{width:100%;border-radius:6px;display:block;box-shadow:0 2px 5px rgba(60,30,110,.25)}
.pocket.has{cursor:pointer}
.pocket::after{content:"";position:absolute;inset:0;border-radius:8px;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 35%,rgba(255,255,255,0) 70%,rgba(255,255,255,.25));pointer-events:none}
.pocket .dt{font-family:"Nanum Pen Script",cursive;font-size:17px;text-align:center;color:#6d5a80;line-height:1.2;margin-top:2px}
.pocket.empty{display:grid;place-items:center;color:#c9b7e6;font-size:26px}
.pnav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;color:#fff;font-family:Jua}
.empty-al{background:#fbf7ff;border-radius:14px;padding:40px 20px;text-align:center}
.ov{position:fixed;inset:0;z-index:300;background:rgba(40,20,70,.6);display:flex;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:12px}
.ov img{max-width:min(360px,86vw);max-height:72vh;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.ov .dt{color:#fff;font-family:Jua}
</style>

<script>
(function(){

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PEOPLE=window.PC_RAW.trim().split('\n').map((l,i)=>{const[n,t,sx,ag,ro,em,d,ref]=l.split('|');return{i,n,t,sx,ag,ro,em,d,ref:ref||''}});
const BYN=Object.fromEntries(PEOPLE.map(p=>[p.n,p]));
/* 티어별 확률(%) — 카드에는 보이지 않아요 */
const TW={S:.5,A:3.5,B:10,C:18,D:22,E:22,F:24};

const W=600,H=880;

const ROBE=['#7a5ea8','#3f7fbf','#c0504d','#4f9a6a','#d9a441','#8a6a4a','#2f5f8a','#a8486a','#5c7a3a','#b5674a','#4a6a8a'];
function el(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2)}

function star(g,x,y,r){g.beginPath();g.moveTo(x,y-r);g.quadraticCurveTo(x,y,x+r,y);g.quadraticCurveTo(x,y,x,y+r);g.quadraticCurveTo(x,y,x-r,y);g.quadraticCurveTo(x,y,x,y-r);g.fill()}

function portrait(g,p){const h=hs(p.n),r=srng(h);const J=p.ro==='J',old=p.ag==='o',young=p.ag==='y',fem=p.sx==='f';
  const skin=J?'#eab996':['#f3caa6','#ebb892','#e0a77f','#d39672'][h%4],skinD=shade(skin,-.14);
  let hair=old?['#e9e5dd','#d3cec6','#c2bbb2'][h%3]:['#2b1d16','#3b2618','#4a2f1c','#1c1412','#5a3a22','#6b4226'][h%6];if(J)hair='#4e321e';
  let robe=ROBE[h%ROBE.length],robe2=ROBE[(h>>4)%ROBE.length],cloth=['#f3ead8','#e9dcc3','#d8c6a6','#c9d8e8','#efe3f2'][(h>>6)%5];
  if(J){robe='#f7f3ec';robe2='#c0392b'}if(p.ro==='K'||p.ro==='Q'){robe=['#6a3fa0','#a3263a','#2f4f9a'][h%3];robe2='#e2b13c'}if(p.ro==='R'){robe='#f4efe6';robe2='#3f63a8'}
  if(p.n==='세례 요한'){robe='#a8865a';robe2='#7a5a32'}
  const hw=J?'none':(p.ro==='K'||p.ro==='Q')?'crown':p.ro==='R'?'mitre':p.ro==='W'?(r()<.6?'helmet':'band'):(p.ro==='P'||p.ro==='S')?'cloth':fem?(r()<.7?'veil':'none'):p.ro==='F'?(r()<.5?'band':'none'):(r()<.3?'cloth':'none');
  const hs2=fem||J?'long':old?(r()<.45?'bald':'short'):['short','curly','short','wavy'][h%4];
  const beard=fem?0:J?2:young?(r()<.2?1:0):old?(r()<.75?3:2):[1,2,2,0,2][h%5];
  const HX=300,HY=360,HR=96;
  if(J){const gl=g.createRadialGradient(HX,HY-20,40,HX,HY-20,230);gl.addColorStop(0,'rgba(255,240,170,.95)');gl.addColorStop(1,'rgba(255,240,170,0)');g.fillStyle=gl;g.fillRect(0,80,W,560);g.strokeStyle='rgba(255,210,90,.95)';g.lineWidth=8;el(g,HX,HY-30,150,150);g.stroke()}
  // 뒤쪽: 긴 머리 / 두건 / 너울
  if(hw==='cloth'||hw==='veil'){g.fillStyle=hw==='veil'?['#9fc3e8','#f2c3d4','#f4ead8','#cbb8e8','#bfe0cf'][h%5]:cloth;g.beginPath();g.moveTo(HX-120,640);g.bezierCurveTo(HX-150,420,HX-130,240,HX,232);g.bezierCurveTo(HX+130,240,HX+150,420,HX+120,640);g.closePath();g.fill()}

  g.beginPath();g.moveTo(18,H);g.bezierCurveTo(26,660,120,by+26,236,by);g.lineTo(364,by);g.bezierCurveTo(480,by+26,574,660,582,H);g.closePath();g.fill();

  if('SAB'.includes(t)){g.fillStyle='rgba(255,255,255,.95)';const n=t==='S'?16:t==='A'?11:7;for(let i=0;i<n;i++){const side=i%4;let x,y;if(side===0){x=r()*W;y=FR/2}else if(side===1){x=r()*W;y=H-FR/2}else if(side===2){x=FR/2;y=r()*H}else{x=W-FR/2;y=r()*H}star(g,x,y,4+r()*6)}}
  g.restore();
  g.lineWidth=2.5;g.strokeStyle='rgba(0,0,0,.28)';rr(g,FR-1,FR-1,W-2*FR+2,H-2*FR+2,27);g.stroke();
  g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=2;rr(g,2,2,W-4,H-4,38);g.stroke();
  if(t==='F'){g.font='30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif';g.textAlign='center';g.textBaseline='middle';g.fillText('💩',W-34,H-34)}}
const IMG={};function cardURL(p){if(!IMG[p.n])IMG[p.n]=drawCard(p).toDataURL('image/jpeg',.9);return IMG[p.n]}

/* ============ 저장 ============ */
const KEY='pcard-v1';let ST={last:'',album:[]};try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&Array.isArray(o.album))ST=o}catch(_){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(_){}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dotDate=s=>s.replace(/-/g,'.');
const canDraw=()=>ST.last!==today();
function pick(){const tot=Object.values(TW).reduce((a,b)=>a+b,0);let x=rnd()*tot,tier='F';for(const k in TW){if(x<TW[k]){tier=k;break}x-=TW[k]}const L=PEOPLE.filter(p=>p.t===tier);return L[Math.floor(rnd()*L.length)]}
function updCnt(){const u=new Set(ST.album.map(a=>a.n)).size;$('#cnt').textContent=`모은 인물 ${u} / ${PEOPLE.length}`}

/* ============ 뽑기 화면 ============ */
const dome=$('#dome');for(let i=0;i<9;i++){const m=document.createElement('div');m.className='mini';m.style.cssText=`left:${8+(i%5)*18}%;top:${30+Math.floor(i/5)*34+(i%2)*8}%;--r:${-25+i*7}deg;background:linear-gradient(160deg,${BG[i]},${shade(BG[i],-.15)});animation-delay:${-i*.4}s`;dome.appendChild(m)}
let cdT=null;
function status(){const s=$('#status');clearInterval(cdT);
  if(canDraw()){s.innerHTML=`<div class="big">오늘의 기회가 1번 있어요! ✨</div><p class="hint">뽑기 버튼을 누르면 성경 인물 포토카드가 나와요.<br>기회는 매일 밤 0시에 새로 생기고, 쌓이지 않아요.</p>`;$('#knob').disabled=false;return}
  $('#knob').disabled=true;const tick=()=>{const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const d=Math.max(0,m-n),hh=Math.floor(d/3600000),mm=Math.floor(d/60000)%60,ss=Math.floor(d/1000)%60;
    if(d<=0||canDraw()){status();showToday();return}s.innerHTML=`<div class="big">오늘은 이미 뽑았어요 🎴</div><div class="cd">${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}</div><p class="hint">다음 기회까지 남은 시간 (0시에 새 기회)</p>`};tick();cdT=setInterval(tick,1000)}
function cardHTML(p,flip){return`<div class="pc${flip?' flip':''} t${p.t}" id="pc"><div class="face back"><b>✦<br>BIBLE<br>PHOTOCARD<br>✦</b></div><div class="face front"><img alt="${esc(p.n)} 포토카드" src="${cardURL(p)}"><div class="shine"></div></div></div>`}
function showToday(){const o=$('#out');const t=ST.album.filter(a=>a.d===today()).pop();if(!t){o.innerHTML=canDraw()?`<p class="hint" style="margin-top:120px;text-align:center">🎰 기계의 버튼을 눌러 보세요!</p>`:'';return}const p=BYN[t.n];if(!p){o.innerHTML='';return}
  o.innerHTML=`<div class="hint" style="margin-bottom:8px">오늘 뽑은 카드 · ${dotDate(t.d)}</div>${cardHTML(p,true)}<div class="acts"><button id="sv">💾 이미지 저장</button><button id="toAl">📒 앨범 보기</button></div>`;bindActs(p)}
function bindActs(p){$('#sv').onclick=()=>saveImg(p);$('#toAl').onclick=()=>tab('album')}
function saveImg(p){drawCard(p).toBlob(b=>{const name='포토카드_'+p.n.replace(/\s+/g,'')+'.png';if(window.SAVEFILE)window.SAVEFILE(b,name);else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}},'image/png')}
$('#knob').onclick=async()=>{if(!canDraw()){status();return}const p=pick();ST.last=today();ST.album.push({n:p.n,d:today()});save();updCnt();
  $('#knob').disabled=true;const m=$('#mach');m.classList.add('spin');$('#status').innerHTML='<div class="big">두근두근… 🎲</div>';cardURL(p);
  await new Promise(r=>setTimeout(r,1700));m.classList.remove('spin');
  const o=$('#out');o.innerHTML=`<div class="hint" style="margin-bottom:8px">카드가 나왔어요!</div>${cardHTML(p,false)}<div class="tapme">👆 카드를 눌러 뒤집어 보세요</div>`;const pc=$('#pc');pc.classList.add('rise');
  if(innerWidth<=760)o.scrollIntoView({behavior:'smooth',block:'center'});
  pc.onclick=()=>{if(pc.classList.contains('flip'))return;pc.classList.remove('rise');void pc.offsetWidth;pc.classList.add('flip');const b=document.createElement('div');b.className='burst';const em=['✨','⭐','💜','🌟','✦','💖'];for(let i=0;i<18;i++){const a=i/18*Math.PI*2,d=120+Math.random()*80;const s=document.createElement('i');s.textContent=em[i%em.length];s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');b.appendChild(s)}o.appendChild(b);setTimeout(()=>b.remove(),1300);
    setTimeout(()=>{const tm=o.querySelector('.tapme');if(tm)tm.outerHTML=`<div class="tapme" style="animation:none">🎉 ${esc(p.n)} 카드를 얻었어요! 앨범에 쏙 넣었어요</div><div class="acts"><button id="sv">💾 이미지 저장</button><button id="toAl">📒 앨범 보기</button></div>`;bindActs(p)},900)};
  status()};

/* ============ 앨범 ============ */
let PG=0;
function perPage(){return innerWidth<=760?9:18}
function renderAlbum(anim){const A=ST.album,el2=$('#tAlbum');const u=new Set(A.map(a=>a.n)).size;
  if(!A.length){el2.innerHTML=`<div class="binder"><div class="bhead"><h2>📒 나의 포토카드 앨범</h2></div><div class="empty-al"><div style="font-size:50px">🎴</div><p class="j" style="font-size:20px;margin:8px 0">아직 모은 카드가 없어요</p><p class="hint">뽑기에서 오늘의 카드를 뽑으면 이 앨범에 차곡차곡 들어가요.</p><button id="goDraw">🎰 뽑으러 가기</button></div></div>`;$('#goDraw').onclick=()=>tab('draw');return}
  const per=perPage(),pages=Math.max(1,Math.ceil(A.length/per));PG=Math.min(PG,pages-1);const slice=A.slice(PG*per,PG*per+per);
  const pocket=(a,k)=>{if(!a)return`<div class="pocket empty">✦</div>`;const p=BYN[a.n];if(!p)return`<div class="pocket empty">?</div>`;return`<div class="pocket has t${p.t}" data-k="${PG*per+k}"><img loading="lazy" alt="${esc(p.n)}" src="${cardURL(p)}"><div class="dt">${dotDate(a.d)}</div></div>`};
  const half=per===18?[slice.slice(0,9),slice.slice(9,18)]:[slice];
  el2.innerHTML=`<div class="binder"><div class="bhead"><h2>📒 나의 포토카드 앨범</h2><span class="prog">카드 ${A.length}장 · 인물 ${u}/${PEOPLE.length}</span></div>
    <div class="spread">${half.map(s=>`<div class="pg${anim?' turn':''}">${Array.from({length:9},(_,k)=>pocket(s[k],(s===half[1]?9:0)+k)).join('')}</div>`).join('')}</div>
    <div class="pnav"><button id="pp" ${PG<=0?'disabled':''}>◀</button><span>${PG+1} / ${pages} 쪽</span><button id="pn" ${PG>=pages-1?'disabled':''}>▶</button></div></div>
    <p class="hint" style="text-align:center">카드를 누르면 크게 볼 수 있어요 · 뽑은 순서대로 꽂혀요</p>`;
  $('#pp').onclick=()=>{PG--;renderAlbum(true)};$('#pn').onclick=()=>{PG++;renderAlbum(true)};
  el2.querySelectorAll('.pocket.has').forEach(b=>b.onclick=()=>{const a=ST.album[+b.dataset.k],p=BYN[a.n];const o=document.createElement('div');o.className='ov';o.innerHTML=`<img alt="${esc(p.n)}" src="${cardURL(p)}"><div class="dt">${dotDate(a.d)}에 뽑았어요</div><div class="acts"><button class="s">💾 이미지 저장</button><button class="x">닫기</button></div>`;document.body.appendChild(o);o.onclick=e=>{if(e.target===o||e.target.classList.contains('x'))o.remove()};o.querySelector('.s').onclick=()=>saveImg(p)})}
function tab(k){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===k));$('#tDraw').hidden=k!=='draw';$('#tAlbum').hidden=k!=='album';if(k==='album'){PG=Math.max(0,Math.ceil(ST.album.length/perPage())-1);renderAlbum()}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
addEventListener('resize',()=>{if(!$('#tAlbum').hidden)renderAlbum()});

/* 시작: 글꼴이 준비된 뒤 카드 그리기 */
Promise.all(['36px Jua','25px "Gowun Dodum"','72px "Nanum Pen Script"'].map(f=>document.fonts?document.fonts.load(f):0)).catch(()=>{}).then(()=>{updCnt();status();showToday();if(location.hash==='#album')tab('album')});
window.__pc={PEOPLE,drawCard,ST:()=>ST};
})();
</script>
