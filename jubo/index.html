  const col=(x,y,t)=>{if(!x||!y||x.t!=='solid'||y.t!=='solid')return x?clone(x):null;const p=hex2rgb(x.c),q=hex2rgb(y.c);return solid(rgb2hex(...p.map((v,i)=>lerp(v,q[i],t))))};

function regionsOf(items){let regs=[];for(const it of items){const P=toPaper(it.subs),nx=[];let rest=P;for(const r of regs){const a=r.p.intersect(P,{insert:false}),b=r.p.subtract(P,{insert:false});if(paperArea(a)>.5)nx.push({p:a,src:it});if(paperArea(b)>.5)nx.push({p:b,src:r.src});rest=rest.subtract(r.p,{insert:false})}if(paperArea(rest)>.5)nx.push({p:rest,src:it});regs=nx}
 const o=[];for(const r of regs){const ch=r.p.children;if(ch&&ch.length>1){const big=[...ch].sort((a,b)=>Math.abs(b.area)-Math.abs(a.area))[0];const sign=big.clockwise;const outers=ch.filter(c=>c.clockwise===sign),holes=ch.filter(c=>c.clockwise!==sign);if(outers.length>1){for(const c of outers){const subs=fromPaper(c);holes.forEach(q=>{if(c.contains(q.firstSegment.point))subs.push(...fromPaper(q))});o.push({subs,src:r.src})}continue}}o.push({subs:fromPaper(r.p),src:r.src})}return o}
function pathfinder(op){if(!needPaper())return;const its=selPaths();if(its.length<2&&op!=='outlineP')return toast('패스를 2개 이상 선택하세요');try{const Ps=its.map(i=>toPaper(i.subs)),top=its[its.length-1],bottom=its[0];let res=[],opt={insert:false};
 const single=(p,src)=>[mkPath(fromPaper(p),'패스',clone(src.app))];
 switch(op){case'unite':res=single(Ps.reduce((a,b)=>a.unite(b,opt)),top);break;
 case'minusFront':res=single(Ps.slice(1).reduce((a,b)=>a.subtract(b,opt),Ps[0]),bottom);break;
 case'minusBack':res=single(Ps.slice(0,-1).reverse().reduce((a,b)=>a.subtract(b,opt),Ps[Ps.length-1]),top);break;
 case'intersect':res=single(Ps.reduce((a,b)=>a.intersect(b,opt)),top);break;
 case'exclude':res=single(Ps.reduce((a,b)=>a.exclude(b,opt)),top);break;
 case'divide':res=regionsOf(its).map(r=>mkPath(r.subs,'패스',clone(r.src.app)));break;
 case'trim':res=[];{let cover=null;for(let i=its.length-1;i>=0;i--){let vis=Ps[i];if(cover)vis=vis.subtract(cover,opt);if(paperArea(vis)>.5)res.unshift(mkPath(fromPaper(vis),'패스',[fillE(clone(fillOf(its[i])?.paint??null))]));cover=cover?cover.unite(Ps[i],opt):Ps[i]}}break;
 case'merge':{const grp={};let cover=null;for(let i=its.length-1;i>=0;i--){let vis=Ps[i];if(cover)vis=vis.subtract(cover,opt);const k=paintKey(fillOf(its[i]));grp[k]=grp[k]?{p:grp[k].p.unite(vis,opt),src:its[i]}:{p:vis,src:its[i]};cover=cover?cover.unite(Ps[i],opt):Ps[i]}res=Object.values(grp).map(g=>mkPath(fromPaper(g.p),'패스',[fillE(clone(fillOf(g.src)?.paint??null))]));break}
 case'crop':{const T=Ps[Ps.length-1];let cover=null;for(let i=its.length-2;i>=0;i--){let vis=Ps[i].intersect(T,opt);if(cover)vis=vis.subtract(cover,opt);if(paperArea(vis)>.5)res.unshift(mkPath(fromPaper(vis),'패스',[fillE(clone(fillOf(its[i])?.paint??null))]));cover=cover?cover.unite(Ps[i],opt):Ps[i]}break}
 case'outlineP':res=regionsOf(its).flatMap(r=>r.subs.map(s=>mkPath([{...s,closed:true}],'윤곽',[fillE(null),strokeE(solid(firstColor(fillOf(r.src)?.paint)),1)])));break}
 res=res.filter(r=>r.subs.length);if(!res.length)toast('겹치는 영역이 없습니다');const g=res.length>1?[mkGroup(res,'패스파인더')]:res;replaceWith(top,g);its.slice(0,-1).forEach(removeIt);reindex();S.sel=new Set(g.map(i=>i.id));commit('패스파인더')}catch(e){console.error(e);toast('경로를 계산하지 못했습니다. 열린 패스를 닫고 다시 시도하세요.')}}

function alignSel(mode,key){const t=selTops();if(!t.length)return;const useKey=S.alignTo||'sel';const ref=useKey==='ab'?S.doc.artboards[curBoard()]:useKey==='key'&&S.keyObj&&getIt(S.keyObj)?bbox(getIt(S.keyObj)):selBox();for(const i of t){const b=bbox(i);if(!b)continue;let dx=0,dy=0;if(mode==='l')dx=ref.x-b.x;if(mode==='c')dx=ref.x+ref.w/2-b.x-b.w/2;if(mode==='r')dx=ref.x+ref.w-b.x-b.w;if(mode==='t')dy=ref.y-b.y;if(mode==='m')dy=ref.y+ref.h/2-b.y-b.h/2;if(mode==='b')dy=ref.y+ref.h-b.y-b.h;applyM(i,tr(dx,dy))}commit('정렬')}
function distribute(axis,gap){const t=selTops();if(t.length<3&&gap==null)return toast('3개 이상 선택하세요');const k=axis==='x'?'x':'y',s=axis==='x'?'w':'h';const a=t.map(i=>({i,b:bbox(i)})).sort((p,q)=>p.b[k]-q.b[k]);const first=a[0].b,last=a[a.length-1].b;const tot=a.reduce((v,o)=>v+o.b[s],0);const g=gap!=null?gap:(last[k]+last[s]-first[k]-tot)/(a.length-1);let pos=first[k];for(const o of a){const d=pos-o.b[k];applyM(o.i,axis==='x'?tr(d,0):tr(0,d));pos+=o.b[s]+g}commit('분포')}

function makeGraph(b,type,csv){const rows=csv.trim().split('\n').map(l=>l.split(/[,\t]/).map(s=>s.trim()));const heads=rows[0].slice(1),labels=rows.slice(1).map(r=>r[0]),data=rows.slice(1).map(r=>r.slice(1).map(Number));const max=Math.max(...data.flat(),1),o=[],cols=['#5b3fd6','#e8467c','#f09a1a','#2fb86e','#16b6c9','#8a4f2a'];const lab=(x,y,t,al='center',s=12)=>{o.push(mkText(x,y,t,{size:s,align:al,app:[fillE(solid('#26242e'))]}))};
