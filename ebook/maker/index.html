<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전자책 만들기 | 치영의 교회 생활 즐기기 · 전자책 매대 관리자</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gowun+Batang:wght@400;700&display=swap">
</head><body>
<style>
/* Layout: 작업대(책상) 위에 원고 한 장 — 왼쪽 쪽 목록, 가운데 지면, 오른쪽 꾸미기 패널 */
:root{
  --bg:#E4E8EB; --panel:#F7F8F9; --panel-2:#EDF0F2; --line:#D0D6DB; --fg:#1B2126; --muted:#5B6670;
  --accent:#1F6A55; --accent-ink:#FFFFFF; --accent-soft:#D8EBE3; --danger:#B3261E; --desk:#D3D9DE;
  --shadow:0 1px 2px rgba(20,30,40,.14),0 10px 30px rgba(20,30,40,.16);
  --f-ui:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;
  --f-display:'Gowun Batang','Noto Serif KR',Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181B; --panel:#1C2125; --panel-2:#23292E; --line:#323A40; --fg:#E5E9EC; --muted:#97A2AB;
  --accent:#5CC3A0; --accent-ink:#0D1A15; --accent-soft:#1B3A30; --danger:#F08A82; --desk:#0E1113;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181B; --panel:#1C2125; --panel-2:#23292E; --line:#323A40; --fg:#E5E9EC; --muted:#97A2AB;
  --accent:#5CC3A0; --accent-ink:#0D1A15; --accent-soft:#1B3A30; --danger:#F08A82; --desk:#0E1113;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;height:100%;grid-template-columns:168px minmax(0,1fr) 304px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top top" "pages work insp"}

/* 상단 */
.top{grid-area:top;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{color:var(--accent)}
.title-in{flex:1 1 180px;min-width:0;max-width:340px;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;font-size:15px;font-weight:500}
.title-in:hover{border-color:var(--line)}
.title-in:focus{border-color:var(--accent);background:var(--panel-2);outline:none}
.sample-note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.sample-note button{border:0;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:3px 10px;font-size:12px}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{flex:none}
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid;gap:2px}
.menu-pop button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;background:transparent;border-radius:7px;padding:8px 10px}
.menu-pop button:hover{background:var(--panel-2)}
.menu-pop small{color:var(--muted);font-size:11.5px}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* 쪽 목록 */
.pages{grid-area:pages;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line);padding-left:max(0px,env(safe-area-inset-left,0px))}
.page-ops{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 10px 8px}
.page-ops .add{grid-column:1/-1}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel);border-radius:6px;height:30px;padding:0}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn:disabled{opacity:.35;cursor:default}
.plist{flex:1;overflow:auto;padding:4px 10px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.thumb{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.tbox{position:relative;overflow:hidden;border-radius:2px;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.12)}
.tbox .bk-page{pointer-events:none}
.thumb.on .tbox{box-shadow:0 0 0 2.5px var(--accent),0 2px 8px rgba(0,0,0,.18)}
.thumb .lab{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb.on .lab{color:var(--fg);font-weight:600}
.thumb .lab.cover{letter-spacing:.06em}
.add-tile{border:1.5px dashed var(--line);background:transparent;border-radius:4px;color:var(--muted);font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:4px}
.add-tile:hover{border-color:var(--accent);color:var(--accent)}

/* 작업 영역 */
.work{grid-area:work;display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.toolbar .where{margin-left:auto;font-size:12.5px;color:var(--muted)}
.stage{flex:1;min-height:0;overflow:auto;background:var(--desk);display:grid;place-items:center;padding:24px;position:relative}
.stage.drop{box-shadow:inset 0 0 0 3px var(--accent)}
.scaler{position:relative;box-shadow:var(--shadow)}

/* 지면 (책 내용 — 색은 사용자가 정함) */
.bk-page{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;background:#fff}
.bk-dim{position:absolute;inset:0;pointer-events:none}
.bk-el{position:absolute;box-sizing:border-box}
.bk-text{white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;outline:none;min-height:1em}
.is-image{background-position:center;background-repeat:no-repeat}
.is-image.empty{background:repeating-linear-gradient(45deg,#e5e7eb 0 10px,#f3f4f6 10px 20px)}
.bk-pn{position:absolute;white-space:nowrap;pointer-events:none;line-height:1}
.interactive .bk-el{cursor:move;touch-action:none}
.interactive .bk-el:hover{outline:calc(1px / var(--s)) dashed #1F6A55}
.interactive .bk-el.sel{outline:calc(1.5px / var(--s)) solid #1F6A55}
.interactive .bk-el.editing{cursor:text;outline:calc(1.5px / var(--s)) dashed #1F6A55}
.interactive .bk-text:empty::before{content:"글을 입력하세요";opacity:.45}
.bk-h{position:absolute;width:calc(11px / var(--s));height:calc(11px / var(--s));background:#fff;border:calc(1.5px / var(--s)) solid #1F6A55;border-radius:calc(2px / var(--s));transform:translate(-50%,-50%);z-index:5;touch-action:none}
.bk-h[data-dir=nw]{left:0;top:0;cursor:nwse-resize}.bk-h[data-dir=n]{left:50%;top:0;cursor:ns-resize}
.bk-h[data-dir=ne]{left:100%;top:0;cursor:nesw-resize}.bk-h[data-dir=e]{left:100%;top:50%;cursor:ew-resize}
.bk-h[data-dir=se]{left:100%;top:100%;cursor:nwse-resize}.bk-h[data-dir=s]{left:50%;top:100%;cursor:ns-resize}
.bk-h[data-dir=sw]{left:0;top:100%;cursor:nesw-resize}.bk-h[data-dir=w]{left:0;top:50%;cursor:ew-resize}
.guide{position:absolute;background:#E0457B;pointer-events:none;z-index:6}
.guide.v{top:0;bottom:0;width:calc(1px / var(--s))}
.guide.h{left:0;right:0;height:calc(1px / var(--s))}

/* 꾸미기 패널 */
.insp{grid-area:insp;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line);padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:12px 4px 10px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.ibody{flex:1;overflow:auto;padding:4px 16px 24px}
.ibody section{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:12px}
.ibody section:last-child{border-bottom:0}
.ibody h3{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.f{display:grid;gap:6px}
.f>span,.f>label>span{font-size:12.5px;color:var(--muted)}
.meta{margin:0;font-size:13px}
.meta b{font-weight:600}
.hint{margin:0;font-size:12px;color:var(--muted);line-height:1.55}
select.sel-in{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 8px}
.rng{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:8px;align-items:center}
.rng input[type=range]{width:100%;accent-color:var(--accent)}
.num{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 6px;font-variant-numeric:tabular-nums;box-sizing:border-box}
.colrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.colrow input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel)}
.colrow .hex{width:78px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 6px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.sws{display:flex;flex-wrap:wrap;gap:5px;width:100%}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.18);background:var(--c);padding:0}
.sw:hover{transform:scale(1.12)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;font-size:12.5px;min-width:34px}
.seg button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:600}
.grads{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grads button{aspect-ratio:1;max-width:100%;border-radius:6px;border:1px solid rgba(0,0,0,.15);padding:0}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row>.btn{flex:1}
.bgprev{height:70px;border-radius:6px;border:1px solid var(--line);background-size:cover;background-position:center}
.empty{padding:20px 0;display:grid;gap:14px}
.empty p{margin:0;color:var(--muted);line-height:1.6}
.pnlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.pnlist label{display:flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-variant-numeric:tabular-nums}
.pnlist input{accent-color:var(--accent)}

/* 미리보기 */
.preview{position:fixed;inset:0;z-index:50;background:rgba(12,15,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#EEF2F4;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pv-top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.pv-title{font-family:var(--f-display);font-size:17px}
.pv-close{margin-left:auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:7px;padding:6px 12px}
.pv-spread{display:flex;filter:drop-shadow(0 18px 40px rgba(0,0,0,.5))}
.pv-spread.anim{animation:pvIn .28s ease}
@keyframes pvIn{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.pv-slot{position:relative;overflow:hidden}
.pv-slot.has{background:#fff}
.pv-spread.two .pv-slot.has::after{content:"";position:absolute;top:0;bottom:0;width:28px;pointer-events:none}
.pv-spread.two .pv-slot.has:first-child::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.22),transparent)}
.pv-spread.two .pv-slot.has:last-child::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.22),transparent)}
.pv-nav{display:flex;align-items:center;gap:16px}
.pv-nav button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;width:42px;height:42px;display:grid;place-items:center}
.pv-nav button:disabled{opacity:.3;cursor:default}
.pv-lab{min-width:120px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}

/* 알림, 확인 창 */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);border-radius:9px;padding:10px 14px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;padding:0}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,14,18,.5);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px;max-width:360px;width:100%;display:grid;gap:16px}
.modal-card h2{margin:0;font-size:17px}
.modal-card p{margin:0;color:var(--muted);line-height:1.6}
.offscreen{position:fixed;left:-20000px;top:0}

/* 보관함 */
.arch{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.arch-in{max-width:1120px;margin:0 auto;display:grid;gap:16px}
.arch-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.arch-head h2{margin:0;font-family:var(--f-display);font-size:26px}
.arch-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.arch-note{margin:0;color:var(--muted);font-size:13px;line-height:1.65;max-width:72ch}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;align-items:start}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;min-width:0}
.acard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.athumb{display:grid;place-items:center;background:var(--desk);border:0;border-radius:8px;padding:14px;height:198px}
.athumb .tb{position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.athumb .bk-page{pointer-events:none}
.athumb:hover .tb{box-shadow:0 0 0 2px var(--accent),0 2px 10px rgba(0,0,0,.22)}
.ainfo h3{margin:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.ainfo p{margin:3px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;margin-top:6px;font-size:11.5px;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:2px 9px}
.aact{display:flex;gap:6px}
.aact .btn{flex:1;padding:6px 6px;font-size:12.5px}
.aver summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
.aver ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;max-height:240px;overflow:auto}
.aver li{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:6px}
.aver li span{flex:1 1 100%;min-width:0}
.aver li button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 8px;font-size:11.5px}
.aver li button:hover{background:var(--panel-2)}
.anew{border:1.5px dashed var(--line);background:transparent;border-radius:12px;min-height:300px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
.anew:hover{border-color:var(--accent);color:var(--accent)}

/* 선택한 글자 도구 */
.selbar{position:fixed;z-index:40;display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:min(440px,calc(100vw - 16px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.selbar .lbl{font-size:11.5px;color:var(--muted);padding:0 4px;white-space:nowrap}
.selbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;height:28px;min-width:28px;padding:0 7px;font-size:12.5px}
.selbar button:hover{background:var(--panel-2)}
.selbar button.sw{width:18px;height:18px;min-width:0;padding:0;border-radius:50%;border:1px solid rgba(0,0,0,.2);background:var(--c)}
.selbar input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel)}
.selbar .vsep{width:1px;height:20px;background:var(--line);margin:0 2px}

/* 글꼴 고르기 */
.fp{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 10px;font-size:16px;text-align:left}
.fp:hover{background:var(--panel-2)}
.fp small{font-family:var(--f-ui);font-size:11.5px;color:var(--muted);white-space:nowrap}

const OK_TAGS = new Set(['SPAN','B','I','U','STRONG','EM','BR','DIV','P','FONT']);
const OK_CSS = ['color','background-color','font-weight','font-style','text-decoration','text-decoration-line','font-size','font-family'];
function cleanNode(node){
  for (const c of [...node.childNodes]){
    if (c.nodeType === 3) continue;
    if (c.nodeType !== 1 || !OK_TAGS.has(c.tagName)){
      if (c.nodeType === 1) c.replaceWith(document.createTextNode(c.textContent)); else c.remove();
      continue;
    }
    const keep = [];
    for (const p of OK_CSS){ const v = c.style.getPropertyValue(p); if (v && !/url\(|expression|javascript/i.test(v)) keep.push(p + ':' + v); }
    [...c.attributes].forEach(a => c.removeAttribute(a.name));

    cleanNode(c);

function sanitize(html){ const tp = document.createElement('template'); tp.innerHTML = String(html || ''); cleanNode(tp.content); return tp.innerHTML; }

/* ---------- 계산 ---------- */
const pageH = () => { const s = SIZES[book.size] || SIZES.a5; return BASE_W * s.h / s.w; };
const curPage = () => book.pages[cur];
const selEl = () => sel ? curPage().elements.find(e => e.id === sel) || null : null;
const innerCount = () => book.pages.filter(p => p.type === 'inner').length;
function pnFor(idx){
  const p = book.pages[idx];
  if (!p || p.type !== 'inner') return null;
  const ii = idx - 1;
  return {n: book.pn.start + ii, t: book.pn.start + innerCount() - 1, recto: ii % 2 === 0};
}
function pageName(idx){
  const p = book.pages[idx];
  if (p.type === 'front') return '앞표지';
  if (p.type === 'back') return '뒷표지';
  return pnFor(idx).n + '쪽';
}

/* ---------- 지면 그리기 ---------- */
function paintBg(node, bg){
  node.style.backgroundColor = bg.color || '#FFFFFF';
  if (bg.type === 'gradient'){
    node.style.backgroundImage = `linear-gradient(${bg.angle}deg, ${bg.c1}, ${bg.c2})`;
  } else if (bg.type === 'image' && bg.asset && assets[bg.asset]){
    node.style.backgroundImage = `url("${assets[bg.asset]}")`;
    node.style.backgroundSize = bg.fit === 'contain' ? 'contain' : bg.fit === 'tile' ? '160px auto' : 'cover';
    node.style.backgroundRepeat = bg.fit === 'tile' ? 'repeat' : 'no-repeat';
    node.style.backgroundPosition = 'center';
    if (bg.dim > 0){
      const d = document.createElement('div');
      d.className = 'bk-dim';
      d.style.background = `rgba(0,0,0,${bg.dim})`;
      node.appendChild(d);
    }
  }
}
function buildEl(e){
  const d = document.createElement('div');
  d.className = 'bk-el is-' + e.type;
  d.dataset.id = e.id;
  d.style.left = e.x + 'px'; d.style.top = e.y + 'px'; d.style.width = e.w + 'px';
  d.style.opacity = e.opacity;
  if (e.type === 'text'){
    d.style.minHeight = e.h + 'px';
    if (e.bgOn){ d.style.background = e.bg; d.style.padding = '10px 14px'; }
    const t = document.createElement('div');
    t.className = 'bk-text';
    t.innerHTML = e.html;
    Object.assign(t.style, {
      fontFamily: fontStack(e.font), fontSize: e.size + 'px', color: e.color,
      fontWeight: e.bold ? '700' : '400', fontStyle: e.italic ? 'italic' : 'normal',
      textDecoration: e.underline ? 'underline' : 'none', textAlign: e.align,
      lineHeight: e.lh, letterSpacing: e.ls + 'px',
      textShadow: e.shadow ? '0 2px 10px rgba(0,0,0,.45)' : 'none'
    });
    d.appendChild(t);
  } else {
    d.style.height = e.h + 'px';
    const src = e.asset && assets[e.asset];
    if (src){
      d.style.backgroundImage = `url("${src}")`;
      d.style.backgroundSize = e.fit === 'contain' ? 'contain' : 'cover';
    } else d.classList.add('empty');
    d.style.borderRadius = e.radius + 'px';
    if (e.borderW > 0) d.style.border = `${e.borderW}px solid ${e.borderC}`;
  }
  return d;
}
function buildPn(idx, node){
  const info = pnFor(idx), pn = book.pn, p = book.pages[idx];
  if (!info || !pn.show || p.hideNumber) return;
  const d = document.createElement('div');
  d.className = 'bk-pn';
  d.textContent = pn.format.replace('{n}', info.n).replace('{t}', info.t);
  Object.assign(d.style, {fontFamily: fontStack(pn.font), fontSize: pn.size + 'px', color: pn.color});
  const [v, h] = pn.pos.split('-');
  d.style[v === 'top' ? 'top' : 'bottom'] = pn.margin + 'px';
  let side = h;
  if (h === 'outside') side = info.recto ? 'right' : 'left';
  if (h === 'inside') side = info.recto ? 'left' : 'right';
  if (side === 'center'){ d.style.left = '0'; d.style.right = '0'; d.style.textAlign = 'center'; }
  else d.style[side] = Math.max(24, pn.margin + 8) + 'px';
  node.appendChild(d);
}
function buildPage(idx, interactive){
  const p = book.pages[idx];
  const node = document.createElement('div');
  node.className = 'bk-page' + (interactive ? ' interactive' : '');
  node.style.width = BASE_W + 'px';
  node.style.height = pageH() + 'px';
  paintBg(node, p.bg);
  for (const e of p.elements){
    const d = buildEl(e);
    if (interactive){
      if (e.id === sel) d.classList.add('sel');
      if (e.id === editing) d.classList.add('editing');
      if (e.id === sel && e.id !== editing){
        for (const dir of ['nw','n','ne','e','se','s','sw','w']){
          const h = document.createElement('div');
          h.className = 'bk-h'; h.dataset.dir = dir;
          d.appendChild(h);
        }
      }
    }
    node.appendChild(d);
  }
  buildPn(idx, node);
  return node;
}

/* ---------- 작업대 ---------- */
const stage = $('#stage'), scaler = $('#scaler');
let pageNode = null;
function fit(){
  const H = pageH();
  const narrow = matchMedia('(max-width:900px)').matches;
  const availW = stage.clientWidth - (narrow ? 32 : 48);
  const availH = narrow ? Infinity : stage.clientHeight - 48;
  scale = Math.max(0.2, Math.min(availW / BASE_W, availH / H, narrow ? 1 : 1.6));
  scaler.style.width = BASE_W * scale + 'px';
  scaler.style.height = H * scale + 'px';
  if (pageNode){ pageNode.style.transform = `scale(${scale})`; pageNode.style.setProperty('--s', scale); }
}
function renderStage(){
  let keep = null;
  if (editing){ const old = editT(); if (old) keep = {offs: rangeOffsets(old, savedRange), focus: document.activeElement === old}; }
  pageNode = buildPage(cur, true);
  pageNode.style.transform = `scale(${scale})`;
  pageNode.style.setProperty('--s', scale);
  const gv = document.createElement('div'); gv.className = 'guide v'; gv.hidden = true; gv.style.left = BASE_W / 2 + 'px';
  const gh = document.createElement('div'); gh.className = 'guide h'; gh.hidden = true; gh.style.top = pageH() / 2 + 'px';
  pageNode.append(gv, gh);
  scaler.replaceChildren(pageNode);
  pageNode.addEventListener('pointerdown', onPagePointer);
  $('#where').textContent = pageName(cur) + ' 편집 중' + (curPage().type === 'inner' ? ` · 전체 ${book.pages.length}장 중 ${cur + 1}번째` : '');
  if (editing) bindEditing(keep); else hideBar();
}

let lastTap = {id:null, t:0};
function onPagePointer(ev){
  if (ev.button > 0) return;
  const elNode = ev.target.closest('.bk-el');
  const handle = ev.target.closest('.bk-h');
  if (editing){
    if (elNode && elNode.dataset.id === editing) return;
    finishEditing();
  }
  const ae = document.activeElement;
  if (ae && ae !== document.body && !ae.isContentEditable && ae.blur) ae.blur();
  if (!elNode){ if (sel){ sel = null; renderStage(); renderInspector(); } return; }
  ev.preventDefault();
  const id = elNode.dataset.id;
  const e = curPage().elements.find(x => x.id === id);
  const now = Date.now();
  if (e.type === 'text' && lastTap.id === id && now - lastTap.t < 380 && !handle){
    lastTap = {id:null, t:0};
    startEditing(id);
    return;
  }
  lastTap = {id, t:now};
  if (sel !== id){ sel = id; tab = 'el'; renderStage(); renderInspector(); }
  startDrag(ev, e, handle ? handle.dataset.dir : null);
}

function startDrag(ev, e, dir){
  const node = pageNode.querySelector(`[data-id="${e.id}"]`);
  const H = pageH();
  const s0 = {x:e.x, y:e.y, w:e.w, h: e.type === 'text' ? Math.max(e.h, node.offsetHeight) : e.h, px:ev.clientX, py:ev.clientY};
  const ratio = s0.w / s0.h;
  const gv = pageNode.querySelector('.guide.v'), gh = pageNode.querySelector('.guide.h');
  let moved = false;
  const move = m => {
    const dx = (m.clientX - s0.px) / scale, dy = (m.clientY - s0.py) / scale;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 2) return;
    moved = true;
    if (!dir){
      let x = s0.x + dx, y = s0.y + dy;
      const w = node.offsetWidth, h = node.offsetHeight;
      const snapX = Math.abs(x + w / 2 - BASE_W / 2) < 6, snapY = Math.abs(y + h / 2 - H / 2) < 6;
      if (snapX) x = BASE_W / 2 - w / 2;
      if (snapY) y = H / 2 - h / 2;
      gv.hidden = !snapX; gh.hidden = !snapY;
      e.x = Math.round(x * 10) / 10; e.y = Math.round(y * 10) / 10;
    } else {
      let {x, y, w, h} = s0;
      if (dir.includes('e')) w = Math.max(24, s0.w + dx);
      if (dir.includes('s')) h = Math.max(16, s0.h + dy);
      if (dir.includes('w')){ w = Math.max(24, s0.w - dx); x = s0.x + s0.w - w; }
      if (dir.includes('n')){ h = Math.max(16, s0.h - dy); y = s0.y + s0.h - h; }
      if (e.type === 'image' && dir.length === 2 && !m.shiftKey){
        h = w / ratio;
        if (dir.includes('n')) y = s0.y + s0.h - h;
      }
      Object.assign(e, {x:Math.round(x), y:Math.round(y), w:Math.round(w), h:Math.round(h)});
    }
    node.style.left = e.x + 'px'; node.style.top = e.y + 'px'; node.style.width = e.w + 'px';
    if (e.type === 'text') node.style.minHeight = e.h + 'px'; else node.style.height = e.h + 'px';
  };
  const up = () => {
    removeEventListener('pointermove', move);
    removeEventListener('pointerup', up);
    removeEventListener('pointercancel', up);
    gv.hidden = gh.hidden = true;
    if (moved){ commit(); thumbsSoon(); }
  };
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
  addEventListener('pointercancel', up);
}

/* ---------- 글 편집 · 선택한 글자 꾸미기 ---------- */
let savedRange = null, lastWrap = null;
const editT = () => editing && pageNode ? pageNode.querySelector(`[data-id="${editing}"] .bk-text`) : null;
function rangeOffsets(t, r){
  if (!r || !t.contains(r.startContainer) || !t.contains(r.endContainer)) return null;
  const p = document.createRange(); p.selectNodeContents(t);
  p.setEnd(r.startContainer, r.startOffset); const start = p.toString().length;
  p.setEnd(r.endContainer, r.endOffset);
  return {start, end: p.toString().length};
}
function offsetsRange(t, o){
  const r = document.createRange();
  const w = document.createTreeWalker(t, NodeFilter.SHOW_TEXT);
  let n = 0, started = false, node;
  while ((node = w.nextNode())){
    const len = node.data.length;
    if (!started && o.start <= n + len){ r.setStart(node, o.start - n); started = true; }
    if (started && o.end <= n + len){ r.setEnd(node, o.end - n); return r; }
    n += len;
  }
  r.selectNodeContents(t); r.collapse(false);
  return r;
}
function startEditing(id){
  sel = id; editing = id; tab = 'el'; savedRange = null;
  renderStage(); renderInspector();
  const t = editT();
  if (!t) return;
  t.focus();
  const r = document.createRange(); r.selectNodeContents(t);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function bindEditing(keep){
  const e = selEl(), t = editT();
  if (!t || !e){ editing = null; hideBar(); return; }
  t.contentEditable = 'true';
  t.spellcheck = false;
  lastWrap = null;
  t.addEventListener('input', () => { e.html = t.innerHTML; thumbsSoon(); });
  t.addEventListener('paste', ev => {
    if (!ev.clipboardData) return;
    ev.preventDefault();
    document.execCommand('insertText', false, ev.clipboardData.getData('text/plain'));
  });
  t.addEventListener('keydown', ev => {
    if (ev.key === 'Escape'){ ev.preventDefault(); finishEditing(); }
    else if (ev.key === 'Enter' && !ev.isComposing){ ev.preventDefault(); document.execCommand('insertLineBreak'); }
  });
  savedRange = null;
  if (keep && keep.offs){
    savedRange = offsetsRange(t, keep.offs);
    if (keep.focus){ t.focus(); const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
  }
  if (!savedRange || savedRange.collapsed) hideBar(); else placeBar();
}
function finishEditing(){
  if (!editing) return;
  const t = editT(), e = selEl();
  if (t && e) e.html = sanitize(t.innerHTML);
  editing = null; savedRange = null; lastWrap = null;
  hideBar();
  commit(); renderStage(); renderInspector(); thumbsSoon();
}

const selbar = $('#selbar');
const SB_COLORS = ['#1B2126','#FFFFFF','#B3261E','#D9822B','#E8C547','#1F6A55','#3E8FA8','#6B7FD7','#E07A9B'];
$('#sbSw').innerHTML = SB_COLORS.map(c => `<button type="button" class="sw" data-sb="color" data-v="${c}" style="--c:${c}" title="${c}" aria-label="글자 색 ${c}"></button>`).join('');
function hideBar(){ selbar.hidden = true; }
function placeBar(){
  if (!savedRange || savedRange.collapsed){ hideBar(); return; }
  selbar.hidden = false;
  const rect = savedRange.getBoundingClientRect();
  const bw = selbar.offsetWidth, bh = selbar.offsetHeight;
  let top = rect.top - bh - 10;
  if (top < 8) top = rect.bottom + 10;
  let left = rect.left + rect.width / 2 - bw / 2;
  left = Math.max(8, Math.min(innerWidth - bw - 8, left));
  selbar.style.top = top + 'px'; selbar.style.left = left + 'px';
}
document.addEventListener('selectionchange', () => {
  if (!editing) return;
  const t = editT(), s = getSelection();
  if (!t || !s.rangeCount) return;
  const r = s.getRangeAt(0);
  if (!t.contains(r.startContainer) || !t.contains(r.endContainer)) return;
  savedRange = r.cloneRange();
  if (r.collapsed || !r.toString().trim()) hideBar(); else placeBar();
});
stage.addEventListener('scroll', placeBar);
addEventListener('resize', placeBar);

const covers = (r, n) => n && n.isConnected && r.startContainer === n && r.startOffset === 0 && r.endContainer === n && r.endOffset === n.childNodes.length;
function unwrapBare(root){ [...root.querySelectorAll('span:not([style])')].reverse().forEach(sp => sp.replaceWith(...sp.childNodes)); }
function finishInline(t, e, first, last, span){
  const nr = document.createRange();
  if (span){ nr.selectNodeContents(span); lastWrap = span; }
  else if (first && first.isConnected){ nr.setStartBefore(first); nr.setEndAfter(last); lastWrap = null; }
  else { nr.selectNodeContents(t); nr.collapse(false); lastWrap = null; }
  savedRange = nr;
  const s = getSelection(); s.removeAllRanges(); s.addRange(nr);
  e.html = t.innerHTML; thumbsSoon(); commitSoon(); placeBar();
}
function applyInline(styles){
  const t = editT(), e = selEl(), r = savedRange;
  if (!t || !e || !r || r.collapsed || !t.contains(r.startContainer)) return;
  let span;
  if (covers(r, lastWrap)) span = lastWrap;
  else {
    const frag = r.extractContents();
    frag.querySelectorAll('[style]').forEach(n => { for (const k in styles) n.style.removeProperty(k); if (!n.getAttribute('style')) n.removeAttribute('style'); });
    unwrapBare(frag);
    span = document.createElement('span');
    span.appendChild(frag);
    r.insertNode(span);
  }
  for (const [k, v] of Object.entries(styles)) span.style.setProperty(k, v);
  finishInline(t, e, null, null, span);
}
function clearInline(){
  const t = editT(), e = selEl(), r = savedRange;
  if (!t || !e || !r || r.collapsed || !t.contains(r.startContainer)) return;
  let first, last;
  if (covers(r, lastWrap)){
    first = lastWrap.firstChild; last = lastWrap.lastChild;
    lastWrap.querySelectorAll('[style]').forEach(n => n.removeAttribute('style'));
    unwrapBare(lastWrap);
    first = lastWrap.firstChild; last = lastWrap.lastChild;
    lastWrap.replaceWith(...lastWrap.childNodes);
  } else {
    const frag = r.extractContents();
    frag.querySelectorAll('[style]').forEach(n => n.removeAttribute('style'));
    unwrapBare(frag);
    first = frag.firstChild; last = frag.lastChild;
    r.insertNode(frag);
  }
  t.normalize();
  finishInline(t, e, first, last, null);
}
function selStyle(){
  let n = savedRange.startContainer;
  if (n.nodeType === 3){
    if (savedRange.startOffset === n.data.length && n.nextSibling) n = n.nextSibling;
    if (n.nodeType === 3) n = n.parentElement;
  } else if (n.childNodes[savedRange.startOffset]){
    const c = n.childNodes[savedRange.startOffset]; n = c.nodeType === 1 ? c : n;
  }
  return getComputedStyle(n);
}
selbar.addEventListener('pointerdown', ev => { if (ev.target.closest('button')) ev.preventDefault(); });
selbar.addEventListener('click', ev => {
  const b = ev.target.closest('[data-sb]');

  const cs = selStyle();
  switch (b.dataset.sb){
    case 'color': applyInline({color: b.dataset.v}); $('#sbColor').value = b.dataset.v; break;
    case 'bold': applyInline({'font-weight': parseInt(cs.fontWeight, 10) >= 600 ? '400' : '700'}); break;
    case 'italic': applyInline({'font-style': cs.fontStyle === 'italic' ? 'normal' : 'italic'}); break;
    case 'underline': applyInline({'text-decoration': (cs.textDecorationLine || '').includes('underline') ? 'none' : 'underline'}); break;
    case 'mark': applyInline({'background-color': '#FFF27A'}); break;
    case 'smaller': applyInline({'font-size': Math.max(6, parseFloat(cs.fontSize) - 2) + 'px'}); break;
    case 'bigger': applyInline({'font-size': Math.min(200, parseFloat(cs.fontSize) + 2) + 'px'}); break;

});

function renderPages(){
  const list = $('#plist');

  const frag = document.createDocumentFragment();
  book.pages.forEach((p, i) => {
    if (p.type === 'back'){
      const add = document.createElement('button');
      add.type = 'button'; add.className = 'add-tile'; add.dataset.act = 'pageAddEnd';
      add.style.width = tw + 'px'; add.style.height = Math.min(th, 64) + 'px';

      frag.appendChild(add);
    }
    const b = document.createElement('button');

    box.className = 'tbox'; box.style.width = tw + 'px'; box.style.height = th + 'px';
    const pg = buildPage(i, false); pg.style.transform = `scale(${s})`;
    box.appendChild(pg);

    lab.className = 'lab' + (p.type !== 'inner' ? ' cover' : '');
    lab.textContent = pageName(i) + (p.type === 'inner' && (p.hideNumber || !book.pn.show) ? ' · 번호 숨김' : '');
    b.append(box, lab);

  });
  list.replaceChildren(frag);
  const inner = curPage().type === 'inner';
  $('#opUp').disabled = !inner || cur <= 1;

function tgt(t){
  switch (t.dataset.s){
    case 'el': return selEl();
    case 'bg': return curPage().bg;
    case 'page': return curPage();
    case 'pn': return book.pn;
    case 'book': return book;
    case 'pg': return book.pages[+t.dataset.pi];
  }
  return null;
}
function onFieldInput(ev){
  const t = ev.target;
  const k = t.dataset.k;
  if (!k || t.hasAttribute('data-set') || t.hasAttribute('data-toggle')) return;
  const obj = tgt(t);
  if (!obj) return;
  let v;
  if (t.type === 'checkbox') v = t.hasAttribute('data-invert') ? !t.checked : t.checked;
  else if (t.dataset.t === 'num'){ v = parseFloat(t.value); if (isNaN(v)) return; }
  else if (t.dataset.t === 'hex'){ v = t.value.trim(); if (!/^#[0-9a-f]{6}$/i.test(v)) return; }
  else v = t.value;
  if (k === 'start') v = Math.max(0, Math.round(v));
  if (obj[k] === v && ev.type === 'change' && !t.hasAttribute('data-rerender')) return;
  obj[k] = v;
  document.querySelectorAll(`[data-s="${t.dataset.s}"][data-k="${k}"]`).forEach(o => {
    if (o !== t && o.type !== 'checkbox' && !o.hasAttribute('data-set') && (t.dataset.s !== 'pg' || o.dataset.pi === t.dataset.pi)) o.value = v;
  });
  if (t.dataset.s === 'book' && k === 'title'){ commitSoon(); return; }
  if (k === 'size' && t.dataset.s === 'book') fit();
  if (editing && t.dataset.s === 'el'){ /* 편집 중인 글 상자는 스타일만 바로 반영 */ }
  renderStage();
  if (t.dataset.s === 'pn' || t.dataset.s === 'pg' || k === 'hideNumber'){ const n = $('#pnNote'); if (n) n.innerHTML = pnNote(); }
  if (t.hasAttribute('data-rerender')) renderInspector();
  thumbsSoon();
  commitSoon();
}
document.addEventListener('input', onFieldInput);

  const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) < 128;
}

function readImage(file){
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('이미지 파일만 넣을 수 있어요.'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('파일을 읽지 못했어요.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('이미지를 열지 못했어요. 다른 파일로 해 보세요.'));
      img.onload = () => {
        const w = img.naturalWidth || 800, h = img.naturalHeight || 600;
        const k = Math.min(1, 1800 / Math.max(w, h));
        if ((k === 1 && file.size < 1.5e6 && file.type !== 'image/svg+xml') || file.type === 'image/gif') return res({src:fr.result, w, h});
        const c = document.createElement('canvas');
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const keepAlpha = file.type === 'image/png' || file.type === 'image/webp' || file.type === 'image/svg+xml';
        res({src: c.toDataURL(keepAlpha ? 'image/png' : 'image/jpeg', 0.88), w:c.width, h:c.height});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function insertImageFile(file, mode){
  try {
    const {src, w, h} = await readImage(file);
    const id = uid('a'); assets[id] = src;
    if (mode === 'replace' && selEl() && selEl().type === 'image'){
      const e = selEl(); e.asset = id; e.h = Math.round(e.w * h / w); after(); return;
    }
    const H = pageH();
    if (curPage().type !== 'inner'){
      if (editing) finishEditing();
      const c = imgEl({asset:id, x:0, y:0, w:BASE_W, h:H, fit:'cover'});
      curPage().elements.unshift(c);
      sel = c.id; tab = 'el';
      after();
      toast('표지 용지에 꽉 맞춰 넣었어요. 글 상자는 그림 위에 보여요.');
      return;
    }
    let ew = 360, eh = ew * h / w;
    if (eh > H * 0.6){ eh = H * 0.6; ew = eh * w / h; }
    addElement(imgEl({asset:id, w:Math.round(ew), h:Math.round(eh), x:Math.round((BASE_W - ew) / 2), y:Math.round((H - eh) / 2)}));
  } catch(err){ toast(err.message); }
}

let cT, sT;
function commit(){

}

function restore(){

/* 브라우저 보관함 (IndexedDB): books = 책마다 최신 내용, versions = 저장 버튼을 누를 때마다 남는 기록 */
const idb = {
  db: null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => {
    const r = indexedDB.open('chaekgongbang', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if (!d.objectStoreNames.contains('books')) d.createObjectStore('books', {keyPath:'id'});
      if (!d.objectStoreNames.contains('versions')) d.createObjectStore('versions', {keyPath:'vid'}).createIndex('bookId', 'bookId');
    };
    r.onsuccess = () => { this.db = r.result; res(r.result); };
    r.onerror = () => rej(r.error);
  }); },
  async req(store, mode, fn){
    const d = await this.open();
    return new Promise((res, rej) => {
      const tx = d.transaction(store, mode);
      const q = fn(tx.objectStore(store));
      let out;
      if (q) q.onsuccess = () => { out = q.result; };
      tx.oncomplete = () => res(out);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  get(store, k){ return this.req(store, 'readonly', s => s.get(k)); },
  all(store){ return this.req(store, 'readonly', s => s.getAll()); },
  put(store, v, k){ return this.req(store, 'readwrite', s => k === undefined ? s.put(v) : s.put(v, k)); },
  del(store, k){ return this.req(store, 'readwrite', s => s.delete(k)); },
  versionsOf(id){ return this.req('versions', 'readonly', s => s.index('bookId').getAll(id)); }
};
let curId = null, curCreated = Date.now(), lastSavedAt = 0;
function usedAssets(){
  const all = JSON.stringify(book) + hist.join('');
  const out = {};
  for (const k in assets) if (all.includes(k)) out[k] = assets[k];
  return out;
}
const fmtTime = t => new Intl.DateTimeFormat('ko-KR', {year:'numeric', month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit'}).format(t);
async function persist(){
  if (!curId) return;
  assets = usedAssets();
  await idb.put('books', {id:curId, title:book.title || '제목 없는 책', created:curCreated, updated:Date.now(), pages:book.pages.length, data:{book, assets}});
  await idb.put('kv', curId, 'current');
}

    catch(_){ $('#status').textContent = '자동 저장 안 됨 · 작업 파일로 저장하세요'; }

function spreads(){

  const out = [[null, 0]];
  const list = [null, ...inner];

    const pair = [list[i], list[i + 1] ?? null];

  }
  out.push([last, null]);

}

document.addEventListener('keydown', ev => {
  if (!fontPop.hidden){ if (ev.key === 'Escape'){ ev.preventDefault(); closeFontPop(); } return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's'){ ev.preventDefault(); if ($('#modal').hidden && arch.hidden) ACTS.saveNow(); return; }
  if (!arch.hidden && $('#modal').hidden){ if (ev.key === 'Escape') closeArchive(); return; }
  if (!$('#modal').hidden){ if (ev.key === 'Escape') $('#mNo').click(); return; }
  if (!$('#preview').hidden){
    if (ev.key === 'Escape') closePreview();
    if (ev.key === 'ArrowRight' || ev.key === 'PageDown' || ev.key === ' '){ ev.preventDefault(); pvGo(1); }
    if (ev.key === 'ArrowLeft' || ev.key === 'PageUp'){ ev.preventDefault(); pvGo(-1); }
    return;
  }
  const tg = ev.target;
  if (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
  const mod = ev.ctrlKey || ev.metaKey;
  if (mod && ev.key.toLowerCase() === 'z'){ ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if (mod && ev.key.toLowerCase() === 'y'){ ev.preventDefault(); redo(); return; }
  const e = selEl();
  if (!e){
    if (ev.key === 'PageDown'){ ev.preventDefault(); goPage(cur + 1); }
    if (ev.key === 'PageUp'){ ev.preventDefault(); goPage(cur - 1); }
    return;
  }
  if (mod && ev.key.toLowerCase() === 'd'){ ev.preventDefault(); dupEl(); return; }
  if (ev.key === 'Delete' || ev.key === 'Backspace'){ ev.preventDefault(); delEl(); return; }
  if (ev.key === 'Enter' && e.type === 'text'){ ev.preventDefault(); startEditing(e.id); return; }
  if (ev.key === 'Escape'){ sel = null; renderStage(); renderInspector(); return; }
  const step = ev.shiftKey ? 10 : 1;
  const mv = {ArrowLeft:[-step, 0], ArrowRight:[step, 0], ArrowUp:[0, -step], ArrowDown:[0, step]}[ev.key];
  if (mv){ ev.preventDefault(); e.x += mv[0]; e.y += mv[1]; renderStage(); thumbsSoon(); commitSoon(); }
});

      if (old && old.book && Array.isArray(old.book.pages) && old.book.pages.length >= 2){
        const now = Date.now();
        rec = {id:uid('b'), title:old.book.title || '제목 없는 책', created:now, updated:now, pages:old.book.pages.length, data:{book:old.book, assets:old.assets || {}}};
        await idb.put('books', rec);
        await idb.del('kv', 'state');
      }
    }
  } catch(_){ ok = false; }
  if (rec) loadInto(rec.data.book, rec.data.assets, rec.id, rec.created);
  else {
    loadInto(sampleBook(), assets, uid('b'), Date.now());
    if (ok) try { await persist(); } catch(_){}
  }
  $('#status').textContent = ok ? '자동 저장됨' : '이 브라우저에 저장할 수 없어요 · 작업 파일로 저장하세요';
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(_){}
})();
})();
</script>
