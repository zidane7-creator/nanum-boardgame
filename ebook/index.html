<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=(m,ms=2600)=>{const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),ms)};
const busy=m=>{const d=document.createElement("div");d.className="busy";d.textContent=m;document.body.appendChild(d);return()=>d.remove()};
const won=n=>(+n||0).toLocaleString("ko-KR")+"원";
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

/* ---------- 저장소: 이 사이트 GitHub 저장소의 ebook/ 폴더 (찬양 자료실과 같은 관리자 키 사용) ---------- */
const GH={owner:"zidane7-creator",repo:"nanum-boardgame",branch:"main",dir:"ebook/",KEY:"csub:gh-token",
  token(){try{return localStorage.getItem(this.KEY)||""}catch(_){return""}},
  admin(){return!!this.token()},
  async api(path,opt={}){const r=await fetch("https://api.github.com/repos/"+this.owner+"/"+this.repo+path,{...opt,headers:{Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",Authorization:"Bearer "+this.token(),...(opt.body?{"Content-Type":"application/json"}:{}),...(opt.headers||{})}});
    if(!r.ok){let m="";try{m=(await r.json()).message}catch(_){}const e=new Error(m||("GitHub "+r.status));e.status=r.status;throw e}return r},
  raw(file){return this.api("/contents/"+encodeURI(this.dir+file)+"?ref="+this.branch,{headers:{Accept:"application/vnd.github.raw+json"}})},
  async check(tok){const r=await fetch("https://api.github.com/repos/"+this.owner+"/"+this.repo,{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+tok}});if(!r.ok)return{ok:false,status:r.status};const sc=r.headers.get("x-oauth-scopes");if(sc!==null&&!/(^|[ ,])(public_repo|repo)([ ,]|$)/.test(sc))return{ok:false,status:403};let j={};try{j=await r.json()}catch(_){}return{ok:!(j.permissions&&j.permissions.push===false),status:r.status}},
  async commit(message,files,del=[]){
    const ref=await (await this.api("/git/ref/heads/"+this.branch)).json();const base=ref.object.sha;
    const bc=await (await this.api("/git/commits/"+base)).json();const tree=[];
    for(const f of files){const bl=await (await this.api("/git/blobs",{method:"POST",body:JSON.stringify({content:f.b64,encoding:"base64"})})).json();tree.push({path:this.dir+f.path,mode:"100644",type:"blob",sha:bl.sha})}
    for(const d of del)tree.push({path:this.dir+d,mode:"100644",type:"blob",sha:null});
    const t=await (await this.api("/git/trees",{method:"POST",body:JSON.stringify({base_tree:bc.tree.sha,tree})})).json();
    const c=await (await this.api("/git/commits",{method:"POST",body:JSON.stringify({message,tree:t.sha,parents:[base]})})).json();
    await this.api("/git/refs/heads/"+this.branch,{method:"PATCH",body:JSON.stringify({sha:c.sha})});return c.sha}};
const b64txt=s=>b64bytes(new TextEncoder().encode(s));
const b64bytes=u=>{let b="";for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b)};
async function readJSON(file,fallback){
  if(GH.admin()){try{return await (await GH.raw(file)).json()}catch(e){if(e.status===404)return fallback;if(e.status===401){toast("관리자 키가 만료됐거나 틀렸어요. 다시 넣어 주세요",4500);try{localStorage.removeItem(GH.KEY)}catch(_){}}}}
  try{const r=await fetch(file+"?t="+Date.now());if(!r.ok)return fallback;return await r.json()}catch(_){return fallback}}
async function readFile(file){
  if(GH.admin()){try{return await (await GH.raw(file)).arrayBuffer()}catch(_){}}
  const r=await fetch(file+"?v="+Date.now());if(!r.ok)throw new Error("파일을 찾지 못했어요 ("+r.status+")");return r.arrayBuffer()}

/* ---------- 암호화: 책마다 열람 코드로 PDF를 잠금 (PBKDF2 → AES-GCM) ---------- */
const CODE_ABC="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newCode=()=>{const r=crypto.getRandomValues(new Uint8Array(10));let s="";r.forEach(v=>s+=CODE_ABC[v%CODE_ABC.length]);return s.slice(0,5)+"-"+s.slice(5)};
const normCode=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
async function keyFrom(code,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(normCode(code)),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function lock(bytes,code){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await keyFrom(code,salt),bytes));
  const out=new Uint8Array(4+16+12+ct.length);out.set([69,66,75,49]);out.set(salt,4);out.set(iv,20);out.set(ct,32);return out}
async function unlock(buf,code){const u=new Uint8Array(buf);if(u[0]!==69||u[1]!==66||u[2]!==75||u[3]!==49)throw new Error("format");
  return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(20,32)},await keyFrom(code,u.slice(4,20)),u.slice(32))}

/* ---------- 책 모양 ---------- */
const SHADOW='<svg class="ls" viewBox="0 0 110 140" preserveAspectRatio="none" aria-hidden="true"><polygon points="70,0 110,40 110,140 40,140 0,100 70,100" fill="rgba(0,0,0,.22)"/></svg>';
function bookHTML(src,stage){const b='<div class="bk">'+SHADOW+'<div class="bkc">'+(src?'<img src="'+esc(src)+'" alt="">':'<span class="ph">📕</span>')+'</div><div class="bkp"></div><i class="rib"></i></div>';return stage?'<div class="stage">'+b+'</div>':b}
const coverURL=b=>b.cover?(/^(data|blob):/.test(b.cover)?b.cover:b.cover+"?v="+(b.updated||0)):"";
/* ---------- 상태 ---------- */
let BOOKS=[],SET={};
const mine=()=>{try{return JSON.parse(localStorage.getItem("ebook:mine")||"{}")}catch(_){return{}}};
const setMine=(id,code)=>{const m=mine();m[id]=code;try{localStorage.setItem("ebook:mine",JSON.stringify(m))}catch(_){}};
const adminCodes=()=>{try{return JSON.parse(localStorage.getItem("ebook:codes")||"{}")}catch(_){return{}}};
const setAdminCode=(id,code)=>{const m=adminCodes();if(code)m[id]=code;else delete m[id];try{localStorage.setItem("ebook:codes",JSON.stringify(m))}catch(_){}};

async function load(){[BOOKS,SET]=await Promise.all([readJSON("index.json",[]),readJSON("settings.json",{})]);if(!Array.isArray(BOOKS))BOOKS=[];if(!SET||typeof SET!=="object")SET={};render()}
function render(){
  const adm=GH.admin();$("adminbar").hidden=!adm;
  $("footadmin").innerHTML=adm?'관리자로 들어와 있어요 · <a href="#" id="aOut">관리자 로그아웃</a>':'<a href="#" id="aIn">🔑 관리자</a>';
  if($("aOut"))$("aOut").onclick=e=>{e.preventDefault();try{localStorage.removeItem(GH.KEY)}catch(_){}toast("관리자 키를 이 브라우저에서 지웠어요");load()};
  if($("aIn"))$("aIn").onclick=e=>{e.preventDefault();adminLogin(load)};
  const m=mine(),list=[...BOOKS].sort((a,b)=>(b.created||0)-(a.created||0));
  const per=Math.max(2,Math.floor(($("shelves").clientWidth-28)/148)||4);
  if(!list.length){$("shelves").innerHTML='<div class="shelf"><div class="empty">아직 진열된 책이 없어요.'+(adm?'<br>위의 <b>📤 책 올리기</b>로 첫 책을 올려 보세요.':'<br>곧 좋은 책으로 채워질 거예요 🙏')+'</div></div>';return}
  let h="";for(let i=0;i<list.length;i+=per){h+='<div class="shelf">'+list.slice(i,i+per).map(b=>'<button class="book" data-id="'+esc(b.id)+'"><div class="bkwrap">'+bookHTML(coverURL(b))+'</div>'+
    '<span class="price'+(b.price>0?"":" free")+'">'+(b.price>0?won(b.price):"무료")+'</span>'+(m[b.id]?'<span class="mine">내 책</span>':"")+'<span class="btitle">'+esc(b.title)+'</span></button>').join("")+'</div>'}
  $("shelves").innerHTML=h;
  $("shelves").querySelectorAll(".book").forEach(el=>el.onclick=()=>openBook(el.dataset.id))}
addEventListener("resize",()=>{clearTimeout(render.t);render.t=setTimeout(render,200)});

/* ---------- 모달 ---------- */
function modal(html,mount){const m=$("modal");m.innerHTML=html;$("back").classList.add("show");m.scrollTop=0;m.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);mount&&mount(m)}
function closeModal(){$("back").classList.remove("show");$("modal").innerHTML=""}
$("back").onclick=e=>{if(e.target.id==="back")closeModal()};addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

/* ---------- 책 보기 / 구매 ---------- */
function openBook(id){const b=BOOKS.find(x=>x.id===id);if(!b)return;const has=mine()[id],adm=GH.admin(),code=adminCodes()[id];

let PDFJS=null;
async function pdfjs(){if(PDFJS)return PDFJS;await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)});
  /* 다른 사이트의 worker 파일은 브라우저가 막을 수 있어서, 내용을 받아 이 페이지에서 실행 */
  try{const t=await (await fetch("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")).text();window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:"text/javascript"}))}
  catch(_){window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}
  return PDFJS=window.pdfjsLib}
async function pdfCover(bytes){const lib=await pdfjs();const doc=await lib.getDocument({data:bytes.slice(0)}).promise;const pg=await doc.getPage(1);const v=pg.getViewport({scale:1});const sc=600/v.width;const vp=pg.getViewport({scale:sc});
  const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:vp}).promise;
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));return{blob,pages:doc.numPages}}
async function imgToJpeg(file){const url=URL.createObjectURL(file);const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});const s=Math.min(1,600/img.width);const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return new Promise(r=>c.toBlob(r,"image/jpeg",.85))}

       if(price>0)setAdminCode(id,normCode(code).replace(/^(.{5})/,"$1-"));BOOKS=next;done();closeModal();render();
       modal(`<h2>✅ 매대에 올렸어요</h2><p><b>${esc(title)}</b> · ${price>0?won(price):"무료"}</p>${price>0?`<p class="hint">열람 코드</p><div class="codebox">${esc(code)}</div><p class="hint">입금을 확인하면 이 코드를 구매자에게 문자로 보내 주세요. 이 코드는 책을 누르면 다시 볼 수 있어요.</p>`:""}<p class="hint">다른 사람 화면에는 1분쯤 뒤에 보여요.</p><div class="acts"><button class="pri" data-close>확인</button></div>`)}
     catch(e){done();ghErr("책 올리기",e)}}})};
function editBook(b){modal(`<h2>✏️ 책 정보 고치기<button class="sm x" data-close>✕</button></h2><div class="f">
   <label>책 제목 <input id="eTitle" value="${esc(b.title)}" maxlength="80"></label>
   <label>부제 <input id="eSub" value="${esc(b.subtitle||"")}" maxlength="100"></label>
   <label>펴낸 날 <input id="eDate" type="date" value="${esc(b.pubDate||"")}"></label>
   <div class="row2"><label>지은이 <input id="eAuthor" value="${esc(b.author||"")}" maxlength="40"></label><label>가격 (원) <input id="ePrice" type="number" min="${b.price>0?100:0}" step="100" value="${b.price}" ${b.price>0?"":"disabled"}></label></div>
   <label>책 소개 <textarea id="eDesc">${esc(b.desc||"")}</textarea></label>
   <label>목차 <textarea id="eToc">${esc(b.toc||"")}</textarea></label>
   <label>지은이 소개 <textarea id="eBio" style="min-height:70px">${esc(b.bio||"")}</textarea></label>
   <div class="hint">${b.price>0?"유료 책은 가격만 바꿀 수 있어요. 무료로 바꾸려면 내리고 다시 올려 주세요.":"무료 책을 유료로 바꾸려면 내리고 다시 올려 주세요."}</div></div>
   <div class="acts"><button data-close>취소</button><button class="pri" id="eSave">저장</button></div>`,m=>{const q=s=>m.querySelector(s);
   q("#eSave").onclick=async()=>{const done=busy("저장하는 중…");try{const list=await readJSON("index.json",[]);const i=list.findIndex(x=>x.id===b.id);if(i<0)throw new Error("책을 찾지 못했어요");
     const nb={...list[i],title:q("#eTitle").value.trim()||b.title,subtitle:q("#eSub").value.trim(),pubDate:q("#eDate").value,author:q("#eAuthor").value.trim(),desc:q("#eDesc").value.trim(),toc:q("#eToc").value.trim(),bio:q("#eBio").value.trim(),updated:Date.now()};if(b.price>0)nb.price=Math.max(100,Math.round(+q("#ePrice").value||b.price));list[i]=nb;
     await GH.commit("전자책 매대: "+nb.title+" 정보 수정",[{path:"index.json",b64:b64txt(JSON.stringify(list,null,1))}]);BOOKS=list;done();closeModal();render();toast("고쳤어요")}catch(e){done();ghErr("저장",e)}}})}
async function delBook(b){if(!confirm("'"+b.title+"'을(를) 매대에서 내릴까요? 책 파일도 사이트에서 지워져요."))return;const done=busy("내리는 중…");
  try{const list=(await readJSON("index.json",[])).filter(x=>x.id!==b.id);await GH.commit("전자책 매대: "+b.title+" 내리기",[{path:"index.json",b64:b64txt(JSON.stringify(list,null,1))}],[b.file,b.cover].filter(Boolean));setAdminCode(b.id,null);BOOKS=list;done();closeModal();render();toast("매대에서 내렸어요")}catch(e){done();ghErr("내리기",e)}}

load();
</script>
