/* Layout: engraver's desk — a fixed tool rail on top, a white score page floating on a cool slate desk below, scrolled and zoomed only by the user */
:root{

select{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 6px}

.btn:focus-visible,select:focus-visible,.cat:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.formseq.drop{background:var(--accent-soft);outline:2px dashed var(--accent)}
.formseq .lab{letter-spacing:.06em;font-weight:600;margin-right:4px}
.fchip{display:inline-flex;align-items:center;gap:3px;font-family:var(--ui);font-size:12px;color:var(--muted)}
.fchip>button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 2px;opacity:.5}
.fchip:hover>button{opacity:1}
.formseq{position:relative}
.formseq .ph{display:none}
body.formdrag .formseq.empty{outline:2px dashed var(--slot)}
body.formdrag .formseq.empty .ph{display:inline}
.fchip[data-fsidx]{cursor:grab;touch-action:none}
.fchip.sel .fbadge{outline:2px solid var(--accent);outline-offset:2px}

.fclear{margin-left:10px;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:5px;padding:2px 8px;font-size:11.5px;cursor:pointer}
.fclear:hover{color:var(--danger);border-color:var(--danger)}
.formseq.bad{background:color-mix(in srgb,var(--danger) 10%,transparent);outline:2px dashed var(--danger)}
.seqcaret{position:absolute;width:3px;border-radius:2px;background:var(--accent);pointer-events:none}
.lyrbadge{touch-action:none}
.fbars{width:42px;border:1px solid var(--line);border-radius:4px;padding:1px 3px;font-size:12px;background:var(--paper);font-variant-numeric:tabular-nums}
.farrow{color:var(--muted)}
.fbadge{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;height:20px;padding:0 6px;border-radius:4px;font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.02em;white-space:nowrap;line-height:1;cursor:pointer}
.fbadge.big{height:24px;font-size:13px;padding:0 8px}
.fbadge.sel{outline:2px solid var(--accent);outline-offset:2px}
.lyrbadge{position:absolute;z-index:1}
.ftypes{display:flex;flex-wrap:wrap;gap:5px}

.formrow{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}

.toprow{flex-wrap:nowrap;align-items:flex-start;justify-content:space-between}
.topleft{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;min-width:0;flex:1}
.viewcol{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
@media (max-width:640px){.toprow{flex-wrap:wrap}.viewcol{align-items:flex-start}}
.pen{flex-wrap:nowrap}
.cats{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cat{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;cursor:pointer;font-weight:500}
.cat .ic{width:20px;height:20px;display:grid;place-items:center;font-family:var(--music);font-size:17px;line-height:1}
.cat[aria-expanded="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cat .chev{font-size:10px;opacity:.6}
.tie-tool{margin-left:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tray{display:flex;flex-wrap:wrap;gap:8px;max-height:38vh;overflow-y:auto;overscroll-behavior:contain}
.tray:empty{display:none}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;max-width:100%}
.panel h4{margin:0;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.panel h4 button{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px}
.items{display:flex;flex-wrap:wrap;gap:5px}
.item{min-width:44px;height:52px;border:1px solid var(--line);border-radius:7px;background:var(--rail);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:2px 6px}
.item:hover{border-color:var(--accent);background:var(--accent-soft)}
.item small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.item svg{display:block}
.item .gl{font-family:var(--music);font-size:26px;line-height:1;height:30px;display:flex;align-items:center}
.item .tx{font-family:var(--chordf);font-weight:700;font-size:15px;line-height:1.1}
.subtog{display:inline-flex;gap:6px;flex-wrap:wrap}
.panel h4 .subtog .btn{padding:2px 9px;font-size:12.5px;margin:0;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.panel h4 .subtog .btn.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--rail);border-radius:6px;padding:2px 8px;cursor:pointer;font-family:var(--chordf);font-weight:600;font-size:13px}
.chip.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.chordprev{display:flex;align-items:center;gap:10px}
.chordprev .item{flex-direction:row;gap:8px;height:40px;padding:0 14px}
.chordprev .item .tx{font-size:20px}
.hint{font-size:12px;color:var(--muted)}
.editbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-height:32px;padding-top:8px;border-top:1px dashed var(--line)}
.editbar .what{font-weight:600}
.editbar .chipgrp{display:inline-flex;align-items:center;gap:3px;padding:2px 4px 2px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px}
.editbar .chipgrp .btn{padding:1px 6px}
.editbar .sep{width:1px;height:20px;background:var(--line)}
.editbar .btn{padding:3px 8px}
.editbar .mus{font-family:var(--music);font-size:15px}
.viewport{flex:1;overflow:auto;position:relative;overscroll-behavior:contain;touch-action:pan-x pan-y}
.viewport.panning{cursor:grabbing}
.sizer{position:relative;margin:28px auto 80px}
.sheet{position:absolute;left:0;top:0;transform-origin:0 0}
.page{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,50,.12),0 12px 32px rgba(20,30,50,.10);padding:40px 44px 36px;border-radius:2px}
.ptitle{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:12px}
.ptitle input{border:0;background:transparent;text-align:center;font-family:var(--engrave);font-weight:800;font-size:28px;width:100%;outline:none;letter-spacing:-.01em}
.ptitle input:focus{background:var(--accent-soft);border-radius:4px}
.ptitle input::placeholder{color:#b6bcc8;font-weight:500}
.ptitle input:focus::placeholder{color:transparent}
.pmeta{display:flex;justify-content:space-between;width:100%;font-family:var(--engrave);font-size:13px;color:var(--muted)}
.pmeta input{border:0;background:transparent;font:inherit;color:inherit;text-align:right;outline:none;width:220px}
.example{font-family:var(--ui);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:8px}
.row{position:relative;margin-bottom:6px}
.row svg{display:block;overflow:visible}
.rowctl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-family:var(--ui);opacity:.75}
.row:hover .rowctl{opacity:1}
.rowctl select{padding:1px 4px;font-size:11.5px}
.rowctl button{border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;border-radius:5px;font-size:11.5px;padding:1px 6px}
.rowctl button:hover{border-color:var(--line);color:var(--danger)}
.lyr{position:absolute;height:20px;border:0;border-bottom:1px dotted transparent;background:transparent;text-align:center;font-family:var(--engrave);font-size:13.5px;padding:0;outline:none;color:var(--ink)}
.lyr:hover,.lyr:placeholder-shown{border-bottom-color:var(--slot)}
.lyr:focus{background:var(--accent-soft);border-bottom-color:var(--accent)}
.vnum{position:absolute;font-family:var(--engrave);font-size:12px;color:var(--muted)}
.addrow{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:14px;font-family:var(--ui);font-size:13px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:8px}
/* svg */
.st line.staff{stroke:var(--ink);stroke-width:1}
.st .hledger{stroke:currentColor;stroke-width:1.2}
.st .harm{pointer-events:none}
.st .ledger{stroke:var(--ink);stroke-width:1.2}
.st .el{color:var(--ink);cursor:pointer}
.st .el .hit{fill:transparent}
.st .el.hl,.st .el.sel{color:var(--accent)}
.st .el.sel .hit{fill:var(--accent-soft);opacity:.6}
.st .mus{font-family:var(--music);fill:currentColor}
.st .chord{touch-action:none;font-family:var(--chordf);font-weight:600;font-size:16px;fill:var(--ink);cursor:grab}
.st .chord.sel{fill:var(--accent)}
.st .slot{stroke:var(--slot);stroke-dasharray:3 4;stroke-width:1}
.st .bar{color:var(--ink);cursor:pointer}
.st .bar.sel{color:var(--accent)}
.st .hdr{cursor:pointer;color:var(--ink)}
.st .hdr.sel{color:var(--accent)}
.st .hdr .hit,.st .bar .hit{fill:transparent}
.st .mnum{font-family:var(--chordf);font-size:10px;fill:var(--muted);font-style:italic}
.st .over{fill:var(--danger);opacity:.07}
.st .overtx{font-family:var(--ui);font-size:10px;fill:var(--danger)}
.st .placeholder{font-family:var(--ui);font-size:10px;fill:var(--muted)}
.st .slur{fill:var(--ink);cursor:pointer}
.st .slur.sel{fill:var(--accent)}
.st .slurhit{stroke:transparent;stroke-width:10;fill:none;cursor:pointer}
.st .beam{fill:currentColor}
.st .tupn{font-family:var(--chordf);font-style:italic;font-weight:700;font-size:13px;fill:var(--ink)}
.st .guide{pointer-events:none}
.st .guide .g{color:var(--accent);fill:var(--accent)}
.st .guide .gbox{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
.st .guide .bad{fill:var(--danger)}
.st .guide .badbox{fill:none;stroke:var(--danger);stroke-width:1.5;stroke-dasharray:4 3}
.st .guide .tagbg{fill:var(--accent)}
.st .guide .tagbg.bad{fill:var(--danger)}
.st .guide .tag{fill:var(--paper);font-family:var(--ui);font-size:11.5px;font-weight:600}
.st .guide .caret{stroke:var(--accent);stroke-width:2}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;background:var(--paper);border:1px solid var(--accent);border-radius:8px;padding:4px 8px;box-shadow:0 6px 18px rgba(20,30,60,.18);font-size:12px;display:flex;align-items:center;gap:6px;color:var(--ink)}
#ghost.over{opacity:.35}
#ghost .gl{font-family:var(--music);font-size:22px}
#ghost .tx{font-family:var(--chordf);font-weight:700;font-size:15px}
.status{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--paper);padding:7px 12px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.toast.bad{background:var(--danger);color:#fff}
.mode-banner{background:var(--accent);color:var(--paper);padding:6px 12px;border-radius:8px;font-size:13px}
@media (max-width:640px){.page{padding:28px 20px}.brand span{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<script>
"use strict";
/* ---------- constants ---------- */
const HS=5, STAFF_TOP=112, BOT=STAFF_TOP+40, ROW_W=1000, LYR_TOP=BOT+50, LYR_H=22;
const LET="CDEFGAB", SOLF=["도","레","미","파","솔","라","시"], NAT=[0,2,4,5,7,9,11];
const CLEF_BOTTOM={treble:30,bass:18};
const SHARP_ORDER=[3,0,4,1,5,2,6], FLAT_ORDER=[6,2,5,1,4,0,3];
const KS_POS={treble:{sharp:[38,35,39,36,33,37,34],flat:[34,37,33,36,32,35,31]}};
KS_POS.bass={sharp:KS_POS.treble.sharp.map(v=>v-14),flat:KS_POS.treble.flat.map(v=>v-14)};
const DUR_NAME={1:"온음표",2:"2분음표",4:"4분음표",8:"8분음표",16:"16분음표"};
const REST_NAME={1:"온쉼표",2:"2분쉼표",4:"4분쉼표",8:"8분쉼표",16:"16분쉼표"};
const BASEW={1:64,2:48,4:36,8:28,16:23};
const ACC_GLYPH={"2":"\u{1D12A}","1":"♯","0":"♮","-1":"♭","-2":"\u{1D12B}"};
const ACC_TXT={"2":"𝄪","1":"♯","0":"♮","-1":"♭","-2":"𝄫"};
const CHORD_ACC={"2":"𝄪","1":"♯","0":"","-1":"♭","-2":"𝄫"};
const QUALS=[["","메이저"],["m","마이너"],["7",""],["m7",""],["maj7",""],["6",""],["m6",""],["sus4",""],["7sus4",""],["dim",""],["dim7",""],["m7♭5",""],["aug",""],["add9",""],["9",""]];
const TIMESIGS=[[2,4],[3,4],[4,4],[5,4],[6,4],[2,2],[3,8],[6,8],[9,8],[12,8]];
const BARS=[["single","마디선"],["double","겹세로줄"],["final","끝세로줄"],["repeatStart","도돌이(시작)"],["repeatEnd","도돌이(끝)"]];
const REST_GLYPH={1:"\u{1D13B}",2:"\u{1D13C}",4:"\u{1D13D}",8:"\u{1D13E}",16:"\u{1D13F}"};
const uid=()=>Math.random().toString(36).slice(2,9);
const mod=(a,n)=>((a%n)+n)%n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- keys ---------- */
function tonicOf(f,mode){let L=mod(4*f,7),pc=mod(7*f,12);if(mode==="minor"){L=mod(L+5,7);pc=mod(pc+9,12);}let a=mod(pc-NAT[L]+6,12)-6;return{L,a,pc};}
function keyName(f,mode){const t=tonicOf(f,mode);return LET[t.L]+(CHORD_ACC[t.a]||"")+(mode==="minor"?"m":"");}
function keyAlter(f,L){if(f>0)return SHARP_ORDER.slice(0,f).includes(L)?1:0;if(f<0)return FLAT_ORDER.slice(0,-f).includes(L)?-1:0;return 0;}
const rowF=r=>r.keySig?(r.keySig.type==="sharp"?r.keySig.count:-r.keySig.count):0;
const sigFromF=f=>f===0?null:{type:f>0?"sharp":"flat",count:Math.abs(f)};
const natMidi=n=>12*(Math.floor(n/7)+1)+NAT[mod(n,7)];
function pitchName(n,alter){const L=mod(n,7),o=Math.floor(n/7);const a=alter?(ACC_TXT[alter]||""):"";return `${SOLF[L]}${a} (${LET[L]}${a}${o})`;}

/* ---------- state ---------- */
function blankRow(mc,clef,keySig,timeSig){return{id:uid(),clef:clef||null,keySig:keySig||null,timeSig:timeSig||null,measures:Array.from({length:mc},()=>({id:uid(),items:[],end:null,startRepeat:false}))};}
function note(n,dur,chord){return{id:uid(),kind:"note",dur,dot:false,n,acc:null,chord:chord||null,lyrics:[]};}
function example(){
  const r=blankRow(4,"treble",null,{n:4,d:4});

function commit(fn){if(typeof stopPlay==="function")stopPlay();const snap=JSON.stringify(S);const ok=fn();if(ok===false){S=JSON.parse(snap);render();return false;}hist.push(snap);if(hist.length>200)hist.shift();fut=[];if(S.example){S.example=false;}save();render();return true;}

/* ---------- helpers on score ---------- */
function groupMap(){const m={};S.groups.forEach(g=>g.ids.forEach(id=>m[id]=g));return m;}
function ticksOf(e,gm){let t=96/e.dur*(e.dot?1.5:1);const g=(gm||groupMap())[e.id];if(g&&g.t===3)t*=2/3;else if(g&&g.t===2)t*=3/2;return t;}
function tsOf(ri){for(let i=ri;i>=0;i--)if(S.rows[i].timeSig)return S.rows[i].timeSig;return{n:4,d:4};}
const capOf=ri=>{const t=tsOf(ri);return t.n*96/t.d;};
function usedIn(ri,mi,gm,exclude){return S.rows[ri].measures[mi].items.reduce((a,e)=>a+(e.id===exclude?0:ticksOf(e,gm)),0);}
function find(id){for(let ri=0;ri<S.rows.length;ri++){const ms=S.rows[ri].measures;for(let mi=0;mi<ms.length;mi++){const ei=ms[mi].items.findIndex(e=>e.id===id);if(ei>=0)return{ri,mi,ei,e:ms[mi].items[ei]};}}return null;}
function order(){const o=[];S.rows.forEach(r=>r.measures.forEach(m=>m.items.forEach(e=>o.push(e.id))));return o;}
function beats(t,ri){const ts=tsOf(ri);const unit=96/ts.d;const b=t/unit;return (Math.round(b*100)/100)+"박";}
function cleanupRefs(){const ids=new Set(order());S.marks=(S.marks||[]).filter(m=>{if(!ids.has(m.eid)||m.v>=S.verses)return false;const f=find(m.eid);return f&&f.e.kind==="note";});S.slurs=S.slurs.filter(s=>ids.has(s.a)&&ids.has(s.b));S.groups.forEach(g=>g.ids=g.ids.filter(i=>{if(!ids.has(i))return false;const f=find(i);return g.t===3||f.e.dur>=8;}));const o=order();const split=[];S.groups.forEach(g=>{if(g.t!==3){g.ids.sort((a,b)=>o.indexOf(a)-o.indexOf(b));
    let run=[];const runs=[];g.ids.forEach(i=>{if(run.length&&o.indexOf(i)!==o.indexOf(run[run.length-1])+1){runs.push(run);run=[];}run.push(i);});if(run.length)runs.push(run);
    g.ids=trimRests(runs[0]||[]);runs.slice(1).forEach(r=>split.push({id:uid(),ids:trimRests(r),t:0}));}});S.groups.push(...split);S.groups=S.groups.filter(g=>{if(g.t!==3)return g.ids.filter(i=>find(i).e.kind==="note").length>=2;if(g.ids.length!==3)return false;const es=g.ids.map(i=>find(i).e);return es.every(e=>e.dur===es[0].dur&&!!e.dot===!!es[0].dot);});}
function measuresFit(){const gm=groupMap();for(let ri=0;ri<S.rows.length;ri++){const cap=capOf(ri);for(let mi=0;mi<S.rows[ri].measures.length;mi++){if(usedIn(ri,mi,gm)>cap+1e-6)return{ri,mi};}}return null;}

/* ---------- layout ---------- */
let LAY=[];let POS={};
const accCount=e=>e.kind!=="note"?0:Math.min(2,(e.acc!=null?1:0)+(e.more||[]).filter(m=>m.acc!=null).length);
function elemW(e){let w=BASEW[e.dur]*(e.dot?1.25:1);w+=13*accCount(e);if((e.more||[]).length)w+=8;const g=GM[e.id];if(g&&g.t)w+=2;if(MKW[e.id])w+=MKW[e.id];return w;}
let _mc=null;function textW(t){if(!t)return 0;try{_mc=_mc||document.createElement("canvas").getContext("2d");_mc.font='13.5px "Nanum Myeongjo", serif';return _mc.measureText(t).width;}catch(e){return t.length*13;}}
const lyrHalf=(e,v)=>Math.max(15,textW((e.lyrics||[])[v]||"")/2+5);
function lyrW(p,v){return p.mko?lyrHalf(p.e,v)*2:Math.max(30,p.slotW-4,lyrHalf(p.e,v)*2);}
let MKW={};
const FCOL={A:["#e03131","#fff"],B:["#1c6dd0","#fff"],C:["#2b8a3e","#fff"],D:["#e8590c","#fff"],E:["#7048e8","#fff"],BIS:["#3bc9db","#fff"],INTRO:["#111111","#fff"],INTER:["#fcc419","#111"],OUTRO:["#f783ac","#111"]};
const FTYPES=["A","B","C","D","E","BIS","INTRO","INTER","OUTRO"],FNUM=["A","B","C"],FSEQ_ONLY=["INTRO","INTER","OUTRO"];
const fLabel=m=>m.k+(FNUM.includes(m.k)&&m.n?m.n:"")+(FSEQ_ONLY.includes(m.k)&&m.bars?" "+m.bars:"");
const fBadgeW=m=>Math.round(fLabel(m).length*7.6+14);
function fBadge(m,cls,attrs){const c=FCOL[m.k]||["#555","#fff"];return `<span class="fbadge ${cls||""}" style="background:${c[0]};color:${c[1]}" ${attrs||""}>${esc(fLabel(m))}</span>`;}
let GM={};
function layoutAll(){
  GM=groupMap();LAY=[];POS={};MKW={};(S.marks||[]).forEach(m=>{const f=find(m.eid);if(!f)return;const need=fBadgeW(m)+2+lyrHalf(f.e,m.v)+2-8;MKW[m.eid]=Math.max(MKW[m.eid]||0,need);});
  const natOf=(row,ri)=>{const cap=capOf(ri);return row.measures.map(m=>{let sum=0;const ws=m.items.map(e=>{const w=elemW(e);sum+=w;return w;});const used=m.items.reduce((a,e)=>a+ticksOf(e,GM),0);const pad=16+(m.startRepeat?12:0);
      // an empty measure keeps room for a full bar; a measure with notes is only as wide as what it holds (so pickup bars stay short)
      const total=used>0?Math.max(40,pad+sum+16):Math.max(70,pad+cap*1.45+16);return{ws,used,pad,total};});};
  const hdrW=row=>10+38+(row.keySig?row.keySig.count*9+6:0)+(row.timeSig?(row.timeSig.n>9?34:26)+6:0)+8;
  const NATS=S.rows.map((r,ri)=>natOf(r,ri));
  const RW=Math.max(ROW_W,...S.rows.map((r,ri)=>hdrW(r)+NATS[ri].reduce((a,b)=>a+b.total,0)));
  S.rows.forEach((row,ri)=>{
    const clef=row.clef||"treble",cap=capOf(ri),f=rowF(row);
    const L={ri,clef,cap,f,hdr:{}};let x=10;
    L.hdr.clef={x,w:36};x+=38;
    L.hdr.key={x,w:row.keySig?row.keySig.count*9+6:0};x+=L.hdr.key.w;
    L.hdr.time={x:x+2,w:row.timeSig?(row.timeSig.n>9?34:26):0};x+=row.timeSig?L.hdr.time.w+6:0;
    x+=8;L.mStart=x;
    const nat=NATS[ri];
    const sumN=nat.reduce((a,b)=>a+b.total,0);
    const k=(RW-L.mStart)/sumN;
    L.measures=[];L.elems=[];let mx=L.mStart;
    nat.forEach((N,mi)=>{
      const mw=N.total*k;const M={mi,x:mx,w:mw,end:mx+mw,used:N.used,cap};
      let ex=mx+N.pad*k;const carry={};let tAcc=0;
      row.measures[mi].items.forEach((e,ei)=>{
        const sw=N.ws[ei]*k;const accOff=13*accCount(e);const mko=MKW[e.id]||0;
        const cx=ex+mko+accOff+8;
        const it={id:e.id,e,ri,mi,ei,slotX:ex,slotW:sw,cx,mko,t:tAcc};tAcc+=ticksOf(e,GM);
        if(e.kind==="note"){const step=e.n-CLEF_BOTTOM[clef];it.step=step;it.y=BOT-step*HS;
          let alt;if(e.acc!=null){alt=e.acc;carry[e.n]=e.acc;}else alt=(carry[e.n]!=null?carry[e.n]:keyAlter(f,mod(e.n,7)));
          it.alter=alt;it.midi=natMidi(e.n)+alt;
          it.more=(e.more||[]).map(m=>{let a;if(m.acc!=null){a=m.acc;carry[m.n]=m.acc;}else a=(carry[m.n]!=null?carry[m.n]:keyAlter(f,mod(m.n,7)));return{n:m.n,step:m.n-CLEF_BOTTOM[clef],acc:m.acc,alter:a,midi:natMidi(m.n)+a};});}
        L.elems.push(it);POS[e.id]=it;ex+=sw;});
      M.contentEnd=ex;L.measures.push(M);mx+=mw;});
    L.width=RW;
    L.height=LYR_TOP+S.verses*LYR_H+12;
    LAY.push(L);
  });
  // beams
  S.groups.forEach(g=>{
    const o=order();const ids=g.ids.slice().sort((a,b)=>o.indexOf(a)-o.indexOf(b));
    const segs=[];ids.forEach(id=>{const p=POS[id];if(!p)return;const last=segs[segs.length-1];if(last&&last.ri===p.ri)last.ps.push(p);else segs.push({ri:p.ri,ps:[p]});});
    const beamable=ids.filter(id=>POS[id]).every(id=>POS[id].e.dur>=8);
    segs.forEach((sg,si)=>{const ns=sg.ps.filter(p=>p.e.kind==="note");if(!ns.length)ns.push({step:4,y:yS(4),e:{dur:8}});const mean=ns.reduce((a,p)=>a+p.step,0)/ns.length;const up=mean<4;
      sg.g=g;sg.showNum=g.t&&si===0;sg.up=up;
      if(!beamable){sg.bracket=true;sg.by=up?Math.min(yS(8),...ns.map(p=>p.e.dur>=2?p.y-38:p.y-12))-4:Math.max(yS(0),...ns.map(p=>p.e.dur>=2?p.y+38:p.y+12))+4;}
      else{const has16=sg.ps.some(p=>p.e.kind==="note"&&p.e.dur>=16);const restExt=p=>p.e.dur>=16?14:9.5;
        const yTop=p=>Math.min(p.y,...(p.more||[]).map(m=>yS(m.step))),yBot=p=>Math.max(p.y,...(p.more||[]).map(m=>yS(m.step)));
        let by=up?Math.min(...ns.map(yTop))-31:Math.max(...ns.map(yBot))+31;
        // rests stay inside the staff (at most one space off centre); the beam moves away to make room
        const thick=has16?12.1:4.6;
        sg.ps.forEach(p=>{if(p.e.kind!=="rest")return;const ext=restExt(p);
          if(up){const sh=(yS(4)-ext<by+thick+4)?10:0;p.restShift=sh;by=Math.min(by,yS(4)-ext+sh-4-thick);}
          else{const sh=(yS(4)+ext>by-thick-4)?-10:0;p.restShift=sh;by=Math.max(by,yS(4)+ext+sh+4+thick);}});
        sg.by=by;sg.ps.forEach(p=>{if(p.e.kind==="note")p.beam={up,by};});}
      (LAY[sg.ri].beams||(LAY[sg.ri].beams=[])).push(sg);});
  });
}

/* ---------- chords sit in the measure at a beat position (ticks from the measure start; a quarter note is 24) ---------- */
const CHORD_GRID=12; // half a beat in 4/4: an eighth note
function chordPoints(L,mi){const M=L.measures[mi];const pts=L.elems.filter(p=>p.mi===mi).map(p=>[p.t,p.cx-5]);
  if(!pts.length)pts.push([0,M.x+18]);pts.push([Math.max(M.cap,pts[pts.length-1][0]+1),M.end-16]);return pts;}
function chordX(L,mi,t){const pts=chordPoints(L,mi);if(t<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++){const [t1,x1]=pts[i];if(t<=t1){const [t0,x0]=pts[i-1];return x0+(x1-x0)*(t-t0)/((t1-t0)||1);}}return pts[pts.length-1][1];}
function chordTick(L,mi,x){const pts=chordPoints(L,mi);let t=pts[pts.length-1][0];
  if(x<=pts[0][1])t=pts[0][0];else for(let i=1;i<pts.length;i++){const [t1,x1]=pts[i];if(x<=x1){const [t0,x0]=pts[i-1];t=t0+(t1-t0)*(x-x0)/((x1-x0)||1);break;}}
  let best=Math.round(t/CHORD_GRID)*CHORD_GRID;L.elems.filter(p=>p.mi===mi).forEach(p=>{if(Math.abs(p.t-t)<Math.abs(best-t))best=p.t;});
  return Math.max(0,Math.min(best,L.measures[mi].cap-1));}
function findChord(id){for(let ri=0;ri<S.rows.length;ri++){const ms=S.rows[ri].measures;for(let mi=0;mi<ms.length;mi++){const k=(ms[mi].chords||[]).findIndex(c=>c.id===id);if(k>=0)return{ri,mi,k,ch:ms[mi].chords[k]};}}return null;}
function setChord(ri,mi,t,c,id){const m=S.rows[ri].measures[mi];m.chords=(m.chords||[]).filter(x=>Math.abs(x.t-t)>1e-6&&x.id!==id);const ch={id:id||uid(),t,c};m.chords.push(ch);m.chords.sort((a,b)=>a.t-b.t);return ch;}
function chordsToMeasures(){/* older scores and imports keep a chord on a note; move it onto the measure at that note's beat */
  const gm=groupMap();S.rows.forEach(r=>r.measures.forEach(m=>{let t=0;m.chords=m.chords||[];
    m.items.forEach(e=>{if(e.chord&&!m.chords.some(c=>Math.abs(c.t-t)<1e-6))m.chords.push({id:uid(),t,c:e.chord});delete e.chord;t+=ticksOf(e,gm);});m.chords.sort((a,b)=>a.t-b.t);}));}
function beatLabel(ri,t){const b=t/(96/tsOf(ri).d)+1;return (Number.isInteger(b)?b:Math.floor(b)+"½")+"박";}
function moveChord(id,dir){const f=findChord(id);if(!f)return;let ri=f.ri,mi=f.mi,t=f.ch.t;
  const busy=()=>(S.rows[ri].measures[mi].chords||[]).some(x=>Math.abs(x.t-t)<1e-6&&x.id!==id);
  for(let guard=0;guard<400;guard++){t+=dir*CHORD_GRID;
    if(t<0){if(mi>0)mi--;else if(ri>0){ri--;mi=S.rows[ri].measures.length-1;}else{toast("맨 앞이에요",true);return;}t=capOf(ri)-CHORD_GRID;}
    else if(t>=capOf(ri)){if(mi<S.rows[ri].measures.length-1)mi++;else if(ri<S.rows.length-1){ri++;mi=0;}else{toast("맨 끝이에요",true);return;}t=0;}
    if(!busy())break;} // another chord already sits there: hop over it
  commit(()=>{const g=findChord(id);S.rows[g.ri].measures[g.mi].chords.splice(g.k,1);setChord(ri,mi,t,f.ch.c,id);UI.sel={type:"chord",id};});
  toast(`${mi+1}마디 ${beatLabel(ri,t)}`);}

/* ---------- svg drawing ---------- */
const yS=s=>BOT-s*HS;
function ledgers(cx,step,cls){let s="";for(let k=-2;k>=step;k-=2)s+=`<line class="${cls||"ledger"}" x1="${cx-9}" y1="${yS(k)}" x2="${cx+9}" y2="${yS(k)}"/>`;for(let k=10;k<=step;k+=2)s+=`<line class="${cls||"ledger"}" x1="${cx-9}" y1="${yS(k)}" x2="${cx+9}" y2="${yS(k)}"/>`;return s;}
function head(e,cx,y){
  if(e.dur===1)return `<ellipse cx="${cx}" cy="${y}" rx="7" ry="4.5" fill="currentColor"/><ellipse cx="${cx}" cy="${y}" rx="3.2" ry="2.6" transform="rotate(-50 ${cx} ${y})" fill="var(--paper)"/>`;
  if(e.dur===2)return `<ellipse cx="${cx}" cy="${y}" rx="5.9" ry="4.2" transform="rotate(-22 ${cx} ${y})" fill="currentColor"/><ellipse cx="${cx}" cy="${y}" rx="4.6" ry="1.8" transform="rotate(-28 ${cx} ${y})" fill="var(--paper)"/>`;
  return `<ellipse cx="${cx}" cy="${y}" rx="5.9" ry="4.2" transform="rotate(-22 ${cx} ${y})" fill="currentColor"/>`;
}
function flag(sx,ty,up,k){const o=k*7;if(up)return `<path d="M${sx} ${ty+o} c0.6 6 9.5 8.2 8.4 18.5 c-0.4-6.4-4.6-9.6-8.4-10.6z" fill="currentColor"/>`;return `<path d="M${sx} ${ty-o} c0.6-6 9.5-8.2 8.4-18.5 c-0.4 6.4-4.6 9.6-8.4 10.6z" fill="currentColor"/>`;}
function noteBody(e,cx,step,beam,more){
  /* one or more heads on a shared stem; "more" holds the extra pitches of a stacked note */
  const all=[{step,acc:e.acc}].concat((more||[]).map(m=>({step:m.step,acc:m.acc})));
  const lo=Math.min(...all.map(a=>a.step)),hi=Math.max(...all.map(a=>a.step));
  const up=beam?beam.up:(lo+hi)/2<4;
  let s=ledgers(cx,lo)+(hi!==lo?ledgers(cx,hi):"");
  const seq=all.slice().sort((a,b)=>up?a.step-b.step:b.step-a.step);let prev=null,moved=false;
  seq.forEach(a=>{const second=prev!==null&&Math.abs(a.step-prev)===1&&!moved;a.x=cx+(second?(up?11:-11):0);prev=a.step;moved=second;});
  seq.forEach(a=>{s+=head(e,a.x,yS(a.step));});
  if(e.dur>=2){
    if(up){const sx=cx+5.4;let ty=beam?beam.by:yS(hi)-34;if(!beam&&hi<-4)ty=Math.min(ty,yS(4));s+=`<line x1="${sx}" y1="${yS(lo)-1}" x2="${sx}" y2="${ty}" stroke="currentColor" stroke-width="1.3"/>`;if(!beam&&e.dur>=8){s+=flag(sx,ty,true,0);if(e.dur>=16)s+=flag(sx,ty,true,1);}}
    else{const sx=cx-5.4;let ty=beam?beam.by:yS(lo)+34;if(!beam&&lo>12)ty=Math.max(ty,yS(4));s+=`<line x1="${sx}" y1="${yS(hi)+1}" x2="${sx}" y2="${ty}" stroke="currentColor" stroke-width="1.3"/>`;if(!beam&&e.dur>=8){s+=flag(sx,ty,false,0);if(e.dur>=16)s+=flag(sx,ty,false,1);}}}
  if(e.dot){const right=Math.max(...seq.map(a=>a.x));seq.forEach(a=>{const y=yS(a.step);const dy=mod(a.step,2)===0?y-HS:y;s+=`<circle cx="${right+(e.dur===1?11:10)}" cy="${dy}" r="1.9" fill="currentColor"/>`;});}
  const left=Math.min(...seq.map(a=>a.x));let k=0;
  seq.slice().sort((a,b)=>b.step-a.step).forEach(a=>{if(a.acc==null)return;const off={"1":5.2,"-1":3,"0":5.3,"2":2.6,"-2":3}[a.acc];s+=`<text class="mus" x="${left-8.5-(k%2)*10}" y="${yS(a.step)+off}" font-size="40" text-anchor="end">${ACC_GLYPH[a.acc]}</text>`;k++;});
  return s;
}
function restBody(e,cx,shift){
  const base={4:yS(4)+20,8:yS(4)+20,16:yS(4)+20}[e.dur]+(shift||0);
  /* whole rest hangs from the 2nd line from the top; half rest sits on the middle line */
  const block=e.dur===1?STAFF_TOP+2*HS:e.dur===2?STAFF_TOP+3*HS:null;
  let s=block!==null?`<rect x="${cx-7}" y="${block+(shift||0)}" width="14" height="${HS}" fill="currentColor"/>`:`<text class="mus" x="${cx}" y="${base}" font-size="40" text-anchor="middle">${REST_GLYPH[e.dur]}</text>`;
  if(e.dot){s+=`<circle cx="${cx+(e.dur<=2?12:9)}" cy="${yS(5)+(shift||0)}" r="1.9" fill="currentColor"/>`;}
  return s;

function clefSVG(clef,x){return clef==="bass"?`<text class="mus" x="${x+2}" y="${yS(0)}" font-size="40">\u{1D122}</text>`:`<text class="mus" x="${x+1}" y="${yS(0)}" font-size="40">\u{1D11E}</text>`;}

    if(act==="dur")return tryChange(id,x=>{x.dur=val;});
    if(act==="dot")return tryChange(id,x=>{x.dot=!x.dot;});
    if(act==="kind")return tryChange(id,(x,ff)=>{if(x.kind==="note"){x.kind="rest";delete x.n;delete x.more;x.acc=null;}else{x.kind="note";x.n=(S.rows[ff.ri].clef==="bass")?22:34;x.acc=null;x.lyrics=x.lyrics||[];}});
    if(act==="acc")return commit(()=>{find(id).e.acc=val;});
    if(act==="del")return commit(()=>{const ff=find(id);S.rows[ff.ri].measures[ff.mi].items.splice(ff.ei,1);cleanupRefs();UI.sel=null;});
    if(act==="delchord"){const g=findChord(val);if(!g)return;return commit(()=>{S.rows[g.ri].measures[g.mi].chords.splice(g.k,1);});}
    if(act==="ungroup")return commit(()=>{S.groups=S.groups.filter(g=>!g.ids.includes(id));});
    if(act==="copy"){const gm=groupMap();const t=96/e.dur*(e.dot?1.5:1);
      const tryAt=(ri,mi,idx)=>{if(capOf(ri)-usedIn(ri,mi,gm)+1e-6>=t){const c=JSON.parse(JSON.stringify(e));c.id=uid();c.chord=null;c.lyrics=[];S.rows[ri].measures[mi].items.splice(idx,0,c);joinIfInside(c.id);UI.sel={type:"el",id:c.id};return true;}return false;};
      let done=false;commit(()=>{if(tryAt(f.ri,f.mi,f.ei+1))return done=true;return false;});
      if(!done)toast("마디가 꽉 차서 복사할 수 없어요",true);return;}
  }
  if(act==="delchord"&&s.type==="chord"){const g=findChord(s.id);if(!g)return;return commit(()=>{S.rows[g.ri].measures[g.mi].chords.splice(g.k,1);UI.sel=null;});}
  if((act==="chleft"||act==="chright")&&s.type==="chord")return moveChord(s.id,act==="chleft"?-1:1);
  if(act==="delhdr")return commit(()=>{const r=S.rows[s.ri];if(s.what==="clef")r.clef=null;if(s.what==="key"){r.keySig=null;if(s.ri===0)S.key.f=0;}if(s.what==="time")r.timeSig=null;UI.sel=null;});
  if(act==="delbar")return commit(()=>{S.rows[s.ri].measures[s.mi].end=null;UI.sel=null;});
  if(act==="bart")return commit(()=>{S.rows[s.ri].measures[s.mi].end=val;});
  if(act==="delfseq")return commit(()=>{S.formSeq.splice(s.i,1);UI.sel=null;});
  if(act==="delfmark")return commit(()=>{S.marks=(S.marks||[]).filter(m=>m.id!==s.id);UI.sel=null;});
  if(act==="fmk")return commit(()=>{const m=S.marks.find(x=>x.id===s.id);m.k=val;if(!FNUM.includes(val))m.n="";});
  if(act==="delsrep")return commit(()=>{S.rows[s.ri].measures[s.mi].startRepeat=false;UI.sel=null;});
  if(act==="delslur")return commit(()=>{S.slurs=S.slurs.filter(x=>x.id!==s.id);UI.sel=null;});
}

/* ---------- transposition ---------- */
function transposeTo(newF){
  const mode=S.key.mode;const a=tonicOf(S.key.f,mode),b=tonicOf(newF,mode);
  let d=mod(b.L-a.L,7);if(d>3)d-=7;let s=b.pc-a.pc;const target=d*12/7;while(s-target>6)s-=12;while(target-s>6)s+=12;
  const df=newF-S.key.f;
  commit(()=>{
    S.rows.forEach(row=>{const oldF=rowF(row);let nf=oldF+df;if(nf>7)nf-=12;if(nf<-7)nf+=12;
      row.measures.forEach(m=>{const oc={},nc={};(m.chords||[]).forEach(c=>{c.c=tpChord(c.c,d,s);});m.items.forEach(e=>{if(e.kind!=="note")return;
        [e,...(e.more||[])].forEach(x=>{const oldAlt=x.acc!=null?x.acc:(oc[x.n]!=null?oc[x.n]:keyAlter(oldF,mod(x.n,7)));if(x.acc!=null)oc[x.n]=x.acc;
        const midi=natMidi(x.n)+oldAlt+s;const nn=x.n+d;let need=midi-natMidi(nn);need=Math.max(-2,Math.min(2,need));
        const expect=nc[nn]!=null?nc[nn]:keyAlter(nf,mod(nn,7));
        const had=x.acc!=null;x.n=nn;if(had||need!==expect){x.acc=need;nc[nn]=need;}else x.acc=null;});});});
      row.keySig=sigFromF(nf);});
    S.key.f=newF;});
  toast(`${keyName(newF,mode)} 키로 옮겼어요 · 음표와 코드가 함께 바뀌었어요`);
}
function tpRoot(r,d,s){const L=mod(r.L+d,7);const pc=mod(NAT[r.L]+r.a+s,12);let a=mod(pc-NAT[L]+6,12)-6;return{L,a:Math.max(-2,Math.min(2,a))};}
function tpChord(c,d,s){const r=tpRoot(c,d,s);const o={L:r.L,a:r.a,q:c.q};if(c.b)o.b=tpRoot(c.b,d,s);return o;}

function setZoom(z,cx,cy){const vp=$("viewport");z=Math.max(.4,Math.min(2.5,z));const r=vp.getBoundingClientRect();const px=cx==null?r.width/2:cx-r.left,py=cy==null?r.height/2:cy-r.top;
  const sz=$("sizer");const ox=sz.offsetLeft,oy=sz.offsetTop;const contentX=(vp.scrollLeft+px-ox)/UI.zoom,contentY=(vp.scrollTop+py-oy)/UI.zoom;
  UI.zoom=z;sizeSheet();saveUI();const nox=sz.offsetLeft,noy=sz.offsetTop;vp.scrollLeft=contentX*z+nox-px;vp.scrollTop=contentY*z+noy-py;}
$("zoomIn").onclick=()=>setZoom(UI.zoom*1.15);$("zoomOut").onclick=()=>setZoom(UI.zoom/1.15);

{"title":"","composer":"","tempo":null,"clef":"treble","key":{"fifths":0,"mode":"major"},"time":{"n":4,"d":4},

- clef: "treble" or "bass". key.fifths: number of sharps (positive) or flats (negative) in the key signature, -7..7. key.mode: "major" or "minor" (best guess from the music).

        let e;if(it.r||it.p==null){e={id:uid(),kind:"rest",dur,dot:!!it.dot,chord:parseChord(it.c),lyrics:[]};}
        else{const n=parsePitch(it.p);if(n==null)return;const lyr=Array.isArray(it.l)?it.l.map(x=>String(x||"")):(it.l?[String(it.l)]:[]);maxV=Math.max(maxV,lyr.length);
          e={id:uid(),kind:"note",dur,dot:!!it.dot,n,acc:(it.a!=null&&ACC[it.a]!==undefined)?ACC[it.a]:null,chord:parseChord(it.c),lyrics:lyr};
          if(Array.isArray(it.ch)){const more=it.ch.map(q=>{const nn=parsePitch(q);if(nn==null)return null;const am=String(q).match(/^[A-Ga-g](bb|x|#|b|♯|♭|n|♮)/);return{n:nn,acc:am?ACC[am[1]]:null};}).filter(x=>x&&x.n!==n);if(more.length)e.more=more;}}
        mm.items.push(e);seq.push({e,it});
        if(it.tr!=null){(trs[it.tr]||(trs[it.tr]=[])).push(e.id);}else if(it.bm!=null&&dur>=8){(bms[it.bm]||(bms[it.bm]=[])).push(e.id);}});
      row.measures.push(mm);});
    out.rows.push(row);});
  if(!out.rows.length)throw new Error("empty");
  out.verses=Math.min(6,maxV);
  seq.forEach(({e,it},i)=>{if(e.kind!=="note")return;
    if(it.tie){for(let j=i+1;j<seq.length;j++){if(seq[j].e.kind==="note"){out.slurs.push({id:uid(),a:e.id,b:seq[j].e.id});break;}}}
    if(it.sl==="s")slStack.push(e.id);else if(it.sl==="e"&&slStack.length){const a=slStack.pop();if(a!==e.id)out.slurs.push({id:uid(),a,b:e.id});}});
  Object.values(bms).forEach(ids=>{if(ids.length>=2)out.groups.push({id:uid(),ids,t:0});});
  Object.values(trs).forEach(ids=>{if(ids.length===3)out.groups.push({id:uid(),ids,t:3});});
  const prev=S;S=out;try{cleanupRefs();}finally{S=prev;}
  return out;
}
