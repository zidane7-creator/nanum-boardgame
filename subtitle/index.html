function hexRgb(h){h=String(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h.slice(0,6),16)||0;return[n>>16&255,n>>8&255,n&255]}
const rgba=(h,a)=>{const[r,g,b]=hexRgb(h);return`rgba(${r},${g},${b},${a})`};
const mixHex=(h1,h2,t)=>{const a=hexRgb(h1),b=hexRgb(h2);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const lum=h=>{const[r,g,b]=hexRgb(h);return(0.2126*r+0.7152*g+0.0722*b)/255};
const hex6=h=>{const[r,g,b]=hexRgb(h);return[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let toastT;function toast(m,ms=2800){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)}
function busy(msg){const d=document.createElement('div');d.className='busy';d.textContent=msg;document.body.append(d);return()=>d.remove()}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return{canvas:c,ctx:c.getContext('2d')}}

/* ================= capabilities ================= */
const CAP={db:null,assets:null,downloads:null};
async function initCaps(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  const get=n=>window.claude.use(n).catch(()=>null);
  [CAP.db,CAP.assets,CAP.downloads]=await Promise.all([get('db'),get('assets'),get('downloads')]);
}
async function saveFile(name,blob){
  if(CAP.downloads){
    try{await CAP.downloads.save({filename:name,data:blob});toast('저장했습니다: '+name);return}
    catch(e){
      if(e&&e.code==='declined'){toast('저장을 취소했습니다');return}
      if(e&&e.code==='rate_limited'){toast('다른 저장 창이 열려 있습니다. 잠시 후 다시 눌러 주세요');return}
      if(e&&!['unavailable','not_granted','capability_disabled','capability_removed'].includes(e.code)){toast('저장하지 못했습니다: '+(e.message||e.code));return}
    }
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);
}

const FONT_MAP=new Map(FONTS.map(f=>[f[0],f]));
const customFonts=[];
const cssP=new Map();
function ensureCss(name){
  if(!FONT_MAP.has(name))return Promise.resolve();
  if(cssP.has(name))return cssP.get(name);
  const f=FONT_MAP.get(name);
  const p=new Promise(res=>{
    const l=document.createElement('link');l.rel='stylesheet';
    l.href=`https://fonts.googleapis.com/css2?family=${name.replace(/ /g,'+')}${f[1]?':'+f[1]:''}&display=swap`;
    l.onload=()=>{for(const k of [...fontReq.keys()])if(k.startsWith(name+'|'))fontReq.delete(k);bumpFonts();res()};
    l.onerror=()=>res();document.head.append(l);
  });
  cssP.set(name,p);return p;
}
const fontReq=new Map();let fontTimer;
function bumpFonts(){clearTimeout(fontTimer);fontTimer=setTimeout(()=>{epoch++;requestRender(true);refreshTplTiles()},80)}
function needGlyphs(name,weight,italic,text){
  ensureCss(name);
  const k=name+'|'+weight+'|'+(italic?1:0);let set=fontReq.get(k);if(!set){set=new Set();fontReq.set(k,set)}
  let miss='';for(const ch of String(text)+'가A'){if(!set.has(ch)){set.add(ch);miss+=ch}}
  if(miss){document.fonts.load(`${italic?'italic ':''}${weight} 40px "${name}"`,miss).then(r=>{if(r&&r.length)bumpFonts()}).catch(()=>{})}
}

function TPL(i){
  const s=i%20,p=PAL_ORDER[Math.floor(i/20)],pal=PALS[p];
  const bg={kind:'tpl',style:s,a:pal.a,b:pal.b,c:pal.c,seed:i*977+13,color:pal.a,c1:pal.a,c2:pal.b,angle:180,dim:0,dimColor:'#000000',fit:'cover'};
  const font=TPL_FONTS[(p*7+s*3)%TPL_FONTS.length];
  let box={...POS.center},align='center';
  if(s===17)box={...POS.lower};
  if(s===11){box={x:.42,y:.2,w:.52,h:.6};align='left'}
  if(s===14){box={x:.06,y:.2,w:.62,h:.6};align='left'}
  const color=s===17?'#ffffff':pal.t;
  const shadow=(pal.dark&&[3,5,6,12,13,14,15,16,19].includes(s))||s===17?14:0;
  const size=(s===17?62:84)*(font==='Nanum Pen Script'?1.3:1);
  return{id:i,name:`${STYLES[s].name} · ${pal.name}`,bg,text:{font,bold:BOLDY.has(font),italic:false,color,size,align,valign:'middle',shadow,shadowColor:'#000000',stroke:0,box:false,...box}};
}

  const lin=(x0,y0,x1,y1,st)=>{const g=ctx.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,c])=>g.addColorStop(o,c));return g};

  ctx.save();
  switch(s){
    case 0:fill(A);break;
    case 1:fill(lin(0,0,0,H,[[0,A],[1,B]]));break;
    case 2:fill(lin(0,0,W,H,[[0,A],[1,B]]));break;
    case 3:fill(A);glow(W/2,H/2,M*.62,C,.42);glow(W/2,H/2,M*.3,B,.55);break;
    case 4:{const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.08,W/2,H/2,Math.hypot(W,H)*.58);g.addColorStop(0,B);g.addColorStop(1,A);fill(g);break}
    case 5:fill(lin(0,0,0,H,[[0,A],[1,B]]));for(let i=0;i<36;i++){const r=(24+R()*160)*u;glow(R()*W,R()*H,r,R()<.55?C:(dark?'#ffffff':B),.1+R()*.32)}break;
    case 6:{fill(lin(0,0,0,H,[[0,B],[1,A]]));const ox=W*(.3+R()*.4),oy=-H*.18,L=Math.hypot(W,H)*1.4;
      for(let i=0;i<11;i++){const a0=Math.PI*(.18+.64*R()),sp=.015+R()*.045;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+Math.cos(a0-sp)*L,oy+Math.sin(a0-sp)*L);ctx.lineTo(ox+Math.cos(a0+sp)*L,oy+Math.sin(a0+sp)*L);ctx.closePath();ctx.fillStyle=lin(ox,oy,ox,oy+H*1.1,[[0,rgba(C,dark?.3:.4)],[1,rgba(C,0)]]);ctx.fill()}
      glow(ox,0,H*.55,C,.4);break}
    case 7:{fill(lin(0,0,0,H,[[0,A],[1,B]]));for(let k=0;k<3;k++){const base=H*(.6+k*.12),amp=(16+R()*34)*u,fr=(1+R()*1.6)*Math.PI*2/W,ph=R()*6;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+8;x+=8*u)ctx.lineTo(x,base+Math.sin(x*fr+ph)*amp);ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=rgba(k===1?C:(k===0?B:A),k===1?.32:.6);ctx.fill()}break}
    case 8:{fill(A);ctx.strokeStyle=rgba(B,.7);ctx.lineWidth=14*u;for(let x=-H;x<W+H;x+=48*u){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+H,H);ctx.stroke()}glow(W/2,H/2,Math.min(W,H)*.75,A,.92);break}
    case 9:{fill(lin(0,0,W,H,[[0,A],[1,B]]));ctx.fillStyle=rgba(C,.38);const g=34*u;for(let y=g/2;y<H;y+=g)for(let x=g/2;x<W;x+=g){ctx.beginPath();ctx.arc(x,y,3*u,0,7);ctx.fill()}glow(W/2,H/2,Math.min(W,H)*.7,A,.85);break}
    case 10:{fill(lin(0,0,0,H,[[0,A],[1,B]]));const m=40*u;ctx.strokeStyle=C;ctx.lineWidth=3*u;ctx.strokeRect(m,m,W-2*m,H-2*m);ctx.lineWidth=1*u;ctx.strokeRect(m+14*u,m+14*u,W-2*m-28*u,H-2*m-28*u);break}
    case 11:{fill(A);ctx.fillStyle=lin(0,0,0,H,[[0,B],[1,mixHex(B,C,.35)]]);ctx.fillRect(0,0,W*.36,H);ctx.fillStyle=C;ctx.fillRect(W*.36,0,5*u,H);break}
    case 12:{fill(A);for(let i=0;i<6;i++)glow(R()*W,R()*H,M*(.35+R()*.35),i%2?B:C,.55+R()*.25);break}
    case 13:{fill(lin(0,0,0,H,[[0,A],[.62,B],[1,C]]));glow(W/2,H*.92,H*.75,C,.55);ctx.fillStyle=rgba(dark?'#ffffff':C,.85);ctx.beginPath();ctx.arc(W/2,H*.86,H*.1,0,7);ctx.fill();
      ctx.fillStyle=rgba(A,.92);ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+10;x+=10*u)ctx.lineTo(x,H*.86+Math.sin(x/W*Math.PI*2.4+1)*H*.035+Math.sin(x/W*13)*H*.01);ctx.lineTo(W,H);ctx.closePath();ctx.fill();break}
    case 14:{fill(lin(0,0,W,H,[[0,A],[1,B]]));const cx=W*.79,cy=H*.5,ch=Math.min(H*.74,W*.5),cw=ch*.1;glow(cx,cy-ch*.12,ch*.75,C,.38);ctx.fillStyle=rgba(C,dark?.3:.45);ctx.beginPath();ctx.rect(cx-cw/2,cy-ch/2,cw,ch);ctx.rect(cx-ch*.3,cy-ch*.22,ch*.6,cw);ctx.fill();break}
    case 15:{fill(lin(0,0,0,H,[[0,A],[1,B]]));for(let i=0;i<240;i++){const r=(Math.pow(R(),3)*2.6+.4)*u;ctx.fillStyle=rgba(dark?(R()<.8?'#ffffff':C):C,.25+R()*.7);ctx.beginPath();ctx.arc(R()*W,R()*H*.85,r,0,7);ctx.fill()}
      for(let i=0;i<5;i++)glow(R()*W,R()*H*.6,(10+R()*14)*u,'#ffffff',dark?.7:.3);glow(W/2,H*1.1,H*.65,C,.28);break}
    case 16:{const cs=150*u,cols=Math.ceil(W/cs)+1,rows=Math.ceil(H/cs)+1,pts=[];for(let y=0;y<=rows;y++){pts.push([]);for(let x=0;x<=cols;x++)pts[y].push([x*cs+(x&&x<cols?(R()-.5)*cs*.7:0),y*cs+(y&&y<rows?(R()-.5)*cs*.7:0)])}
      ctx.lineWidth=1;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const p=pts[y][x],q=pts[y][x+1],r=pts[y+1][x],t=pts[y+1][x+1];for(const tri of[[p,q,t],[p,t,r]]){const mx=(tri[0][0]+tri[1][0]+tri[2][0])/3,my=(tri[0][1]+tri[1][1]+tri[2][1])/3;const k=clamp((mx/W*.5+my/H*.5)+(R()-.5)*.22,0,1);const col=mixHex(A,B,k);ctx.fillStyle=col;ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(...tri[0]);ctx.lineTo(...tri[1]);ctx.lineTo(...tri[2]);ctx.closePath();ctx.fill();ctx.stroke()}}
      glow(W*.7,H*.3,M*.4,C,.18);break}
    case 17:{fill(lin(0,0,0,H,[[0,B],[1,A]]));glow(W*.5,H*.35,H*.7,C,.3);const y=H*.72,h=H*.23;ctx.fillStyle=dark?'rgba(0,0,0,.58)':rgba(C,.92);ctx.fillRect(0,y,W,h);ctx.fillStyle=C;ctx.fillRect(0,y,W,4*u);break}
    case 18:{fill(A);ctx.fillStyle=rgba(B,dark?.9:1);for(let y=60*u;y<H;y+=56*u)ctx.fillRect(0,y,W,1.5*u);ctx.fillStyle=rgba(C,.6);ctx.fillRect(W*.07,0,2*u,H);break}
    case 19:{fill(lin(0,0,W,H,[[0,A],[1,B]]));let cx=W*.9,cy=H*.98;for(let i=0;i<16;i++){ctx.strokeStyle=rgba(i%4===0?C:mixHex(B,C,.2),i%4===0?.6:.4);ctx.lineWidth=(i%4===0?4:1.5)*u;ctx.beginPath();ctx.arc(cx,cy,(90+i*68)*u,0,7);ctx.stroke()}
      cx=W*.05;cy=H*.02;for(let i=0;i<6;i++){ctx.strokeStyle=rgba(C,.25);ctx.lineWidth=1.5*u;ctx.beginPath();ctx.arc(cx,cy,(60+i*50)*u,0,7);ctx.stroke()}break}
  }
  ctx.restore();
}

/* ================= rendering ================= */
let epoch=0;
function slideSize(r,base=1920){const k=r.w/r.h;return k>=1?{W:base,H:Math.max(1,Math.round(base/k))}:{W:Math.max(1,Math.round(base*k)),H:base}}
const imgCache=new Map();
function resolveSrc(src,media){if(!src)return null;return src.startsWith('m:')?(media||{})[src.slice(2)]:src}
function getImg(src,media){
  const url=resolveSrc(src,media);if(!url)return null;let e=imgCache.get(url);
  if(!e){const img=new Image();e={img,ok:false};e.p=new Promise(res=>{img.onload=()=>{e.ok=true;epoch++;requestRender(true);res()};img.onerror=()=>{e.bad=true;res()}});img.src=url;imgCache.set(url,e)}
  return e.ok?e.img:null;
}
function roundRect(ctx,x,y,w,h,r){r=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawImageFit(ctx,img,x,y,w,h,fit){
  const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;if(!iw||!ih)return;
  if(fit==='fill'){ctx.drawImage(img,x,y,w,h);return}
  if(fit==='cover'){const s=Math.max(w/iw,h/ih),sw=w/s,sh=h/s;ctx.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h);return}
  const s=Math.min(w/iw,h/ih),dw=iw*s,dh=ih*s;ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function drawBg(ctx,bg,W,H,media){
  bg=bg||{kind:'solid',color:'#000000'};ctx.save();
  if(bg.kind==='gradient'){const ang=(bg.angle??180)*Math.PI/180,dx=Math.sin(ang),dy=-Math.cos(ang),L=Math.abs(W/2*dx)+Math.abs(H/2*dy);const g=ctx.createLinearGradient(W/2-dx*L,H/2-dy*L,W/2+dx*L,H/2+dy*L);g.addColorStop(0,bg.c1||'#000');g.addColorStop(1,bg.c2||'#333');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  else if(bg.kind==='tpl')drawTpl(ctx,W,H,bg);
  else if(bg.kind==='image'){ctx.fillStyle=bg.color||'#000';ctx.fillRect(0,0,W,H);const img=getImg(bg.src,media);if(img)drawImageFit(ctx,img,0,0,W,H,bg.fit||'cover')}
  else{ctx.fillStyle=bg.color||'#000';ctx.fillRect(0,0,W,H)}
  if(bg.dim>0){ctx.fillStyle=rgba(bg.dimColor||'#000000',bg.dim);ctx.fillRect(0,0,W,H)}
  ctx.restore();
}
function wrapLines(ctx,text,maxW){
  const out=[];
  for(const para of String(text).split('\n')){
    if(!para.trim()){out.push('');continue}
    const toks=[];for(const t of para.split(/(\s+)/).filter(Boolean)){if(!/^\s+$/.test(t)&&ctx.measureText(t).width>maxW)toks.push(...t);else toks.push(t)}
    let line='';
    for(const t of toks){const sp=/^\s+$/.test(t);if(!line){if(!sp)line=t;continue}
      if(ctx.measureText(line+t).width<=maxW)line+=t;else{out.push(line.trimEnd());line=sp?'':t}}
    out.push(line.trimEnd());
  }
  return out;
}
function textLayout(ctx,el,W,H){
  const u=Math.min(W,H)/1080,x=el.x*W,y=el.y*H,w=el.w*W,h=el.h*H,wt=el.bold?700:400,fs=Math.max(1,el.size*u);
  needGlyphs(el.font,wt,el.italic,el.text||'');
  ctx.font=`${el.italic?'italic ':''}${wt} ${fs}px ${fontStack(el.font)}`;
  if('letterSpacing' in ctx)ctx.letterSpacing=((el.ls||0)*u)+'px';
  const lines=wrapLines(ctx,el.text||'',Math.max(10,w)),lh=fs*(el.lh||1.35),total=lines.length*lh;
  const ty=el.valign==='top'?y:el.valign==='bottom'?y+h-total:y+(h-total)/2;
  let bw=0;for(const l of lines)bw=Math.max(bw,ctx.measureText(l).width);
  const al=el.align||'center',tx=al==='left'?x:al==='right'?x+w:x+w/2;
  const px=fs*.5,py=fs*.22,bx=al==='left'?x-px:al==='right'?x+w-bw-px:x+w/2-bw/2-px;
  const box=el.boxMode==='full'?{x,y,w,h}:{x:bx,y:ty-py,w:bw+px*2,h:total+py*2};
  return{u,fs,lines,lh,ty,tx,al,box};
}
function drawText(ctx,el,W,H){
  const L=textLayout(ctx,el,W,H);const{u,lines,lh,ty,tx,al,box,fs}=L;
  if(el.box&&(el.text||'').trim()){ctx.save();ctx.fillStyle=rgba(el.boxColor||'#000000',el.boxAlpha??.5);ctx.beginPath();roundRect(ctx,box.x,box.y,box.w,box.h,(el.boxRadius??12)*u);ctx.fill();ctx.restore()}
  ctx.textBaseline='middle';ctx.textAlign=al;
  lines.forEach((l,i)=>{if(!l)return;const ly=ty+lh*i+lh/2;
    if(el.shadow>0){ctx.save();ctx.shadowColor=rgba(el.shadowColor||'#000000',.85);ctx.shadowBlur=el.shadow*u;ctx.shadowOffsetY=el.shadow*u*.3;ctx.fillStyle=el.color;ctx.fillText(l,tx,ly);ctx.restore()}
    if(el.stroke>0){ctx.save();ctx.lineJoin='round';ctx.miterLimit=2;ctx.lineWidth=el.stroke*u*2;ctx.strokeStyle=el.strokeColor||'#000';ctx.strokeText(l,tx,ly);ctx.restore()}
    ctx.fillStyle=el.color||'#fff';ctx.fillText(l,tx,ly);
  });
  if('letterSpacing' in ctx)ctx.letterSpacing='0px';
}
function drawEl(ctx,el,W,H,media){
  const u=Math.min(W,H)/1080,x=el.x*W,y=el.y*H,w=el.w*W,h=el.h*H;
  ctx.save();ctx.globalAlpha=el.opacity??1;
  if(el.type==='shape'){ctx.beginPath();if(el.kind==='ellipse')ctx.ellipse(x+w/2,y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2);else roundRect(ctx,x,y,w,h,(el.radius||0)*u);
    ctx.fillStyle=rgba(el.fill||'#000000',el.fillAlpha??1);ctx.fill();if(el.strokeW>0){ctx.lineWidth=el.strokeW*u;ctx.strokeStyle=el.strokeColor||'#ffffff';ctx.stroke()}}
  else if(el.type==='image'){const img=getImg(el.src,media);if(img){if(el.radius){ctx.beginPath();roundRect(ctx,x,y,w,h,el.radius*u);ctx.clip()}drawImageFit(ctx,img,x,y,w,h,el.fit||'contain')}
    else{ctx.fillStyle='rgba(128,128,128,.25)';ctx.fillRect(x,y,w,h)}}
  else if(el.type==='text')drawText(ctx,el,W,H);
  ctx.restore();
}
function drawSlide(ctx,s,W,H,o={}){
  const media=o.media||P.media;ctx.save();ctx.clearRect(0,0,W,H);drawBg(ctx,s.bg,W,H,media);
  if(!o.bgOnly)for(const el of s.els){if(o.skip===el.id)continue;drawEl(ctx,el,W,H,media)}
  ctx.restore();
}
async function prepareProject(proj){
  const jobs=[],groups=new Map();
  for(const s of proj.slides)for(const el of s.els){if(el.type!=='text')continue;const k=el.font+'|'+(el.bold?700:400)+'|'+(el.italic?1:0);groups.set(k,(groups.get(k)||'')+(el.text||''))}
  for(const[k,t]of groups){const[n,w,i]=k.split('|');jobs.push(ensureCss(n).then(()=>document.fonts.load(`${i==='1'?'italic ':''}${w} 40px "${n}"`,t+'가A')).catch(()=>{}))}
  const srcs=new Set();for(const s of proj.slides){if(s.bg&&s.bg.kind==='image'&&s.bg.src)srcs.add(s.bg.src);for(const el of s.els)if(el.type==='image'&&el.src)srcs.add(el.src)}
  for(const src of srcs){getImg(src,proj.media);const e=imgCache.get(resolveSrc(src,proj.media));if(e&&e.p)jobs.push(e.p)}
  await Promise.race([Promise.all(jobs),new Promise(r=>setTimeout(r,12000))]);
}

function newLyricsEl(text,st){return Object.assign({id:uid(),type:'text',role:'lyrics',...POS.center,text:text??'',font:'Noto Sans KR',size:80,bold:true,italic:false,color:'#ffffff',align:'center',valign:'middle',lh:1.4,ls:0,shadow:0,shadowColor:'#000000',stroke:0,strokeColor:'#000000',box:false,boxMode:'text',boxColor:'#000000',boxAlpha:.5,boxRadius:12,opacity:1},st||{})}
function slideFromTpl(i,text){const t=TPL(i);const{font,bold,italic,color,size,align,valign,shadow,shadowColor,stroke,box,x,y,w,h}=t.text;return{id:uid(),bg:clone(t.bg),els:[newLyricsEl(text,{font,bold,italic,color,size,align,valign,shadow,shadowColor,stroke,box,x,y,w,h})]}}

let P,cur=0,selId=null,editingId=null;

const curSlide=()=>P.slides[cur];

/* undo */
const U={stack:[],redo:[]};let lastSnap=0;
const core=()=>JSON.stringify({title:P.title,ratio:P.ratio,slides:P.slides,libId:P.libId||null});
function snap(){U.stack.push(core());if(U.stack.length>80)U.stack.shift();U.redo.length=0;lastSnap=Date.now()}
function snapSoft(){if(Date.now()-lastSnap>900)snap();lastSnap=Date.now()}
function restore(js){const o=JSON.parse(js);P.title=o.title;P.ratio=o.ratio;P.slides=o.slides;P.libId=o.libId||undefined;cur=clamp(cur,0,P.slides.length-1);if(!selEl())selId=null;afterChange(true)}
function undo(){if(!U.stack.length)return;U.redo.push(core());restore(U.stack.pop());lastSnap=0}
function redo(){if(!U.redo.length)return;U.stack.push(core());restore(U.redo.pop());lastSnap=0}
let saveT;
function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('csub:project',JSON.stringify(P))}catch(e){try{localStorage.setItem('csub:project',JSON.stringify({...P,media:{}}))}catch(_){}}},500)}
function afterChange(structural){persist();if(structural){renderSlideList();renderPanel()}syncToolbar();requestRender(true)}
function mutate(fn,structural=true){snap();fn();afterChange(structural)}

/* ================= lyrics ================= */
const SECTION_RE=/^\s*[\[\(]?\s*(\d+\s*절|후렴|후렴구|브릿지|간주|전주|후주|엔딩|코러스|verse\s*\d*|chorus|bridge|intro|outro|pre-?chorus|interlude|tag|ending|v\d|c\d|b)\s*[\]\)]?\s*:?\s*$/i;
function splitLyrics(text,n,blankBreak,skipLabels){
  const groups=[];let g=[];
  const flush=()=>{if(g.length){groups.push(g);g=[]}};
  for(const raw of String(text).split(/\r?\n/)){const t=raw.trim();
    if(!t){if(blankBreak)flush();continue}
    if(skipLabels&&SECTION_RE.test(t)){flush();continue}
    g.push(t);if(g.length>=n)flush();
  }
  flush();return groups.map(x=>x.join('\n'));
}
function buildFromLyrics(texts,base,titleText){
  const bs=clone(base);let le=lyricsEl(bs);if(!le){le=newLyricsEl('');bs.els.push(le)}
  const out=[];
  const make=t=>{const s=clone(bs);s.id=uid();s.els.forEach(e=>e.id=uid());lyricsEl(s).text=t;return s};
  if(titleText){const s=make(titleText);const l=lyricsEl(s);l.size=Math.round(l.size*1.25);out.push(s)}
  texts.forEach(t=>out.push(make(t)));return out;
}

/* ================= stage ================= */
const cv=$('#cv'),cx=cv.getContext('2d'),ov=$('#ov'),stage=$('#stage'),stagewrap=$('#stagewrap');
let renderQ=false,thumbsDirty=false;
function requestRender(all){if(all)thumbsDirty=true;if(renderQ)return;renderQ=true;requestAnimationFrame(()=>{renderQ=false;renderMain();if(thumbsDirty){thumbsDirty=false;scheduleThumbs()}})}
function layoutStage(){
  const r=stagewrap.getBoundingClientRect(),pad=28,{W,H}=slideSize(P.ratio,1000);
  const s=Math.min((r.width-pad*2)/W,(r.height-pad*2)/H);const w=Math.max(40,W*s),h=Math.max(20,H*s);
  stage.style.width=w+'px';stage.style.height=h+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);const cw=Math.round(w*dpr),ch=Math.round(h*dpr);
  if(cv.width!==cw||cv.height!==ch){cv.width=cw;cv.height=ch}
  requestRender();
}
new ResizeObserver(layoutStage).observe(stagewrap);
function renderMain(){

let drag=null;
ov.addEventListener('pointerdown',e=>{
  if(e.target.closest('.inl'))return;
  const b=e.target.closest('.elb');
  if(!b){if(editingId)return;select(null);return}
  const el=curSlide().els.find(x=>x.id===b.dataset.id);if(!el)return;
  if(selId!==el.id)select(el.id);
  const r=stage.getBoundingClientRect();
  drag={id:el.id,h:e.target.dataset.h||null,sx:e.clientX,sy:e.clientY,o:{x:el.x,y:el.y,w:el.w,h:el.h},r,moved:false,snapshot:core()};
  ov.setPointerCapture(e.pointerId);e.preventDefault();
});
ov.addEventListener('pointermove',e=>{
  if(!drag)return;const el=curSlide().els.find(x=>x.id===drag.id);if(!el)return;
  const dx=(e.clientX-drag.sx)/drag.r.width,dy=(e.clientY-drag.sy)/drag.r.height;
  if(!drag.moved&&Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<3)return;drag.moved=true;
  const o=drag.o;let gv=false,gh=false;
  if(!drag.h){el.x=o.x+dx;el.y=o.y+dy;
    const tx=6/drag.r.width,ty=6/drag.r.height;
    if(Math.abs(el.x+el.w/2-.5)<tx){el.x=.5-el.w/2;gv=true}
    if(Math.abs(el.y+el.h/2-.5)<ty){el.y=.5-el.h/2;gh=true}
  }else{const h=drag.h,min=.02;let{x,y,w,h:hh}=o;
    if(h.includes('e'))w=Math.max(min,o.w+dx);
    if(h.includes('s'))hh=Math.max(min,o.h+dy);
    if(h.includes('w')){w=Math.max(min,o.w-dx);x=o.x+o.w-w}
    if(h.includes('n')){hh=Math.max(min,o.h-dy);y=o.y+o.h-hh}
    Object.assign(el,{x,y,w,h:hh});
  }

  requestRender();
});

function toHex(c){if(!c)return'#000000';if(/^#[0-9a-f]{6}$/i.test(c))return c.toLowerCase();if(/^#[0-9a-f]{3}$/i.test(c))return'#'+c.slice(1).split('').map(x=>x+x).join('');const m=String(c).match(/\d+/g);return m?'#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join(''):'#000000'}
function readInput(t){if(t.type==='checkbox')return t.checked;if(t.type==='range'||t.type==='number'){const s=+(t.dataset.s||1);return(+t.value)/s}return t.value}
function bindFields(pb,get,set){
  pb.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;let v=readInput(t);if((t.type==='number')&&isNaN(v))return;
    set({[k]:v});$$(`[data-k="${k}"]`,pb).forEach(o=>{if(o!==t&&o.type!=='checkbox')o.value=o.type==='color'?v:+(v*(+(o.dataset.s||1))).toFixed(2)})});

  for(const n of Object.keys(z.files)){if(!/\.rels$/.test(n))continue;let s=await z.file(n).async('string');let ch=false;for(const[a,b]of Object.entries(ren)){if(s.includes('/'+a+'"')){s=s.split('/'+a+'"').join('/'+b+'"');ch=true}}if(ch)z.file(n,s)}

    <div class="acts"><button class="btn" data-close>취소</button><button class="btn" id="mEdit">편집기에서 열기</button><button class="btn" id="mJpg">JPG (ZIP)</button><button class="btn pri" id="mPptx">PPT로 받기</button></div>`,m=>{
    const draw=()=>{$('#mList',m).innerHTML=items().map((it,i)=>`<div class="mrow" data-id="${esc(it.id)}"><span class="n">${i+1}</span><span class="t">${esc(it.title)}</span><small>${it.slides||0}장</small>
      <button class="btn sm" data-mv="-1" ${i===0?'disabled':''} aria-label="위로">↑</button><button class="btn sm" data-mv="1" ${i===picked.length-1?'disabled':''} aria-label="아래로">↓</button><button class="btn sm ghost" data-mv="x" aria-label="빼기">✕</button></div>`).join('')};
    draw();
    $('#mList',m).addEventListener('click',e=>{const b=e.target.closest('[data-mv]');if(!b)return;const id=b.closest('.mrow').dataset.id,i=picked.indexOf(id);
      if(b.dataset.mv==='x'){picked.splice(i,1);if(!picked.length){closeModal();renderLib();return}}
      else{const j=i+(+b.dataset.mv);[picked[i],picked[j]]=[picked[j],picked[i]]}
      draw();renderLib()});
    const run=async kind=>{
      const r=$('#mRatio',m).value.split(':').map(Number);const opts={ratio:{w:r[0]||16,h:r[1]||9},gap:$('#mGap',m).checked,titles:$('#mTitle',m).checked,name:$('#mName',m).value.trim()||'찬양 모음'};
      const list=items();closeModal();
      let proj;const done=busy(`${list.length}곡을 불러오는 중…`);
      try{proj=await mergeSongs(list,opts)}catch(err){done();console.error(err);toast('곡 자료를 불러오지 못했습니다: '+(err?.message||''));return}
      done();
      if(kind==='pptx')await exportPptx(proj);
      else if(kind==='jpg')await exportJpg(proj,'all');
      else{loadProject(proj);setView('editor');toast(`${list.length}곡, ${proj.slides.length}장을 편집기로 열었습니다`)}
    };
    $('#mPptx',m).onclick=()=>run('pptx');$('#mJpg',m).onclick=()=>run('jpg');$('#mEdit',m).onclick=()=>run('edit');
  });
}
async function mergeSongs(list,{ratio,gap,titles,name}){
  const out={v:1,title:name,ratio,slides:[],media:{}};
  const projs=await Promise.all(list.map(fetchLibProject));
  projs.forEach((p,k)=>{
    for(const[id,url]of Object.entries(p.media||{}))out.media[id]=url;
    if(k&&gap)out.slides.push({id:uid(),bg:{kind:'solid',color:'#000000'},els:[]});
    const first=p.slides.find(s=>(lyricsEl(s)?.text||'').trim())||p.slides[0];
    if(titles&&first){const t=cloneSlide(first);const l=lyricsEl(t);if(l){l.text=list[k].title;l.size=Math.round(l.size*1.25)}out.slides.push(t)}
    p.slides.forEach(s=>out.slides.push(cloneSlide(s)));
  });
  return out;
}
$('#libQ').addEventListener('input',renderLib);$('#libSort').addEventListener('change',renderLib);
/* 카드형 / 목록형 보기 (이 브라우저에 기억) */
let libView=(()=>{try{return localStorage.getItem('csub:libView')||'card'}catch(_){return'card'}})();
$$('.vtog [data-view]').forEach(b=>b.onclick=()=>{libView=b.dataset.view;try{localStorage.setItem('csub:libView',libView)}catch(_){}renderLib()});
async function fetchLibProject(it){let r;if(GH.admin()){try{r=await GH.raw(it.data)}catch(_){r=null}}if(!r)r=await fetch(libURL(it.data));if(!r.ok)throw new Error('fetch '+r.status);return normalizeProject(await r.json())}
$('#libGrid').addEventListener('click',async e=>{
  const b=e.target.closest('[data-la]');if(!b)return;const id=b.closest('[data-id]').dataset.id;const it=LIB.find(x=>x.id===id);if(!it)return;const a=b.dataset.la;
  if(a==='del'){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='정말 삭제할까요?';setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent='삭제'}},4000);return}
    const done=busy('자료실에서 지우는 중…');try{const idx=(await loadIndex()).filter(x=>x.id!==id);await GH.commit('자료실: '+it.title+' 삭제',[{path:'index.json',b64:b64txt(JSON.stringify(idx,null,1))}],[it.data,it.thumb].filter(Boolean));LIB=idx;done();renderLib();toast(`'${it.title}'을(를) 자료실에서 지웠습니다`)}catch(err){done();showGhError('삭제',err)}return}
  let proj;const done=busy('자료를 불러오는 중…');
  try{proj=await fetchLibProject(it)}catch(err){done();toast('자료 파일을 불러오지 못했습니다');return}
  done();proj.title=it.title;
  if(a==='edit'){proj.libId=it.id;loadProject(proj);setView('editor');toast(`'${it.title}'을(를) 열었습니다`)}
  if(a==='pptx')await exportPptx(proj);
  if(a==='jpg'){const c0=cur;cur=0;await exportJpg(proj,'all');cur=c0}
});
$('#libUpPptx').onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.pptx,.json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const done=busy('PPT를 읽는 중…');
  try{const proj=/\.json$/i.test(f.name)?normalizeProject(JSON.parse(await f.text())):await importPptx(f);done();openUploadModal(proj)}catch(err){done();console.error(err);toast('PPT 파일을 읽지 못했습니다')}};inp.click()};
$('#libGoEd').onclick=()=>setView('editor');
function allLyrics(proj){return proj.slides.map(s=>lyricsEl(s)?.text||'').filter(Boolean).join('\n')}
function openUploadModal(proj){
  if(!GH.admin()){openAdminLogin(()=>openUploadModal(proj));return}
  const existing=proj.libId&&LIB.find(x=>x.id===proj.libId);
  modal(`<h2>자료실로 보내기</h2><p class="note">슬라이드 ${proj.slides.length}장 · ${ratioLabel(proj.ratio)}. 올리면 바로 자료실에 생기고, 사이트에 들어오는 누구나 검색해서 받을 수 있어요. (다른 사람 화면에는 1분쯤 뒤에 보여요)</p>
    <label>곡 제목<input type="text" id="upTitle" value="${esc(existing?.title||proj.title||'')}"></label>
    <label>부른 이 / 작곡 (선택)<input type="text" id="upArtist" value="${esc(existing?.artist||'')}"></label>
    <label>태그 (쉼표로 구분, 선택)<input type="text" id="upTags" placeholder="예: 경배, 성탄, 주일예배" value="${esc((existing?.tags||[]).join(', '))}"></label>
    ${existing?`<label class="ck"><input type="checkbox" id="upReplace" checked>자료실의 '${esc(existing.title)}'을(를) 이 내용으로 바꾸기</label>`:''}
    <div class="acts"><button class="btn" data-close>취소</button><button class="btn pri" id="upGo">자료실로 보내기</button></div>`,m=>{
    $('#upGo',m).onclick=async()=>{const title=$('#upTitle',m).value.trim();if(!title){toast('곡 제목을 적어 주세요');$('#upTitle',m).focus();return}
      const meta={title,artist:$('#upArtist',m).value.trim(),tags:$('#upTags',m).value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,12)};
      const replace=existing&&$('#upReplace',m)?.checked;closeModal();await uploadToLibrary(proj,meta,replace?existing:null)};
  });
}
async function uploadToLibrary(proj,meta,existing){
  const done=busy('자료실에 올리는 중…');
  try{
    await prepareProject(proj);const ts=proj.slides.find(s=>(lyricsEl(s)?.text||'').trim())||proj.slides[0];const{W,H}=slideSize(proj.ratio,640);const{canvas,ctx}=mkCanvas(W,H);drawSlide(ctx,ts,W,H,{media:proj.media});
    const thumbBlob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.85));
    const data={...proj,title:meta.title};delete data.libId;
    const id=existing?existing.id:(Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    const dataPath='songs/'+id+'.json',thumbPath='thumbs/'+id+'.jpg';
    const idx=(await loadIndex()).filter(x=>x.id!==id);
    const doc={id,...meta,lyrics:allLyrics(proj).slice(0,6000),slides:proj.slides.length,ratio:ratioLabel(proj.ratio),thumb:thumbPath,data:dataPath,created:existing?.created||Date.now(),updated:Date.now()};
    idx.unshift(doc);
    await GH.commit((existing?'자료실 수정: ':'자료실 올리기: ')+meta.title,[{path:dataPath,b64:b64txt(JSON.stringify(data))},{path:thumbPath,b64:await b64blob(thumbBlob)},{path:'index.json',b64:b64txt(JSON.stringify(idx,null,1))}]);
    freshThumb[thumbPath]=URL.createObjectURL(thumbBlob);LIB=idx;libReady=true;renderLib();
    if(proj===P){P.libId=id;P.title=meta.title;persist();syncToolbar()}
    done();try{localStorage.removeItem('csub:lastErr')}catch(_){}
    modal(`<h2>✅ 자료실에 저장했어요</h2><p><b>${esc(meta.title)}</b> (슬라이드 ${proj.slides.length}장)</p><p class="note">내 화면 자료실에는 바로 보이고, 다른 사람 화면에는 1분쯤 뒤에 보여요.</p><div class="acts"><button class="btn" data-close>계속 만들기</button><button class="btn pri" id="okLib">자료실 보기</button></div>`,m=>{$('#okLib',m).onclick=()=>{closeModal();setView('library')}});
  }catch(err){done();console.error(err);showGhError('자료실로 보내기',err)}
}
function initLibrary(){
  const adm=GH.admin();$('#libAdmin').hidden=!adm;$('#bUpload').hidden=false;
  let out=$('#libLogout');if(!out){out=document.createElement('p');out.id='libLogout';out.className='note';out.style.cssText='text-align:center;margin-top:18px';$('#view-library').append(out)}
  out.innerHTML=adm?'관리자로 들어와 있어요 · <a href="#" id="ghOut">관리자 로그아웃</a>':'<a href="#" id="ghIn" style="opacity:.6">🔑 관리자</a>';
  const o=$('#ghOut'),i=$('#ghIn');if(o)o.onclick=e=>{e.preventDefault();try{localStorage.removeItem(GH.KEY)}catch(_){}toast('관리자 키를 이 브라우저에서 지웠어요');initLibrary()};if(i)i.onclick=e=>{e.preventDefault();openAdminLogin()};
  libReady=false;renderLib();
  loadIndex().then(idx=>{LIB=Array.isArray(idx)?idx:[];libReady=true;renderLib()}).catch(()=>{libReady=true;LIB=[];libStatus('자료실을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요')})}

/* ================= views ================= */
function setView(v){
  $('#view-library').hidden=v!=='library';$('#view-editor').hidden=v!=='editor';
  $('#tabLib').classList.toggle('on',v==='library');$('#tabEd').classList.toggle('on',v==='editor');
  if(location.hash!=='#'+v)try{history.replaceState(null,'','#'+v)}catch(_){}
  if(v==='editor')layoutStage();else renderLib();
}
$$('.tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='library'||h==='editor')setView(h)});

/* ================= boot ================= */
(function boot(){
  let saved=null;try{const s=localStorage.getItem('csub:project');if(s)saved=normalizeProject(JSON.parse(s))}catch(_){}
  P=saved||sampleProject();
  afterChange(true);layoutStage();
  setView(location.hash==='#library'?'library':'editor');
  initCaps();initLibrary();
})();
</script>
