const styleOf=v=>{const ti=TK.indexOf(v.k);return{pal:PALS[(v.i*5+ti*3)%PALS.length],pat:PATS[(v.i*7+ti)%PATS.length],font:FONTS[(v.i*3+ti)%FONTS.length]}};
function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function wrap(x,t,max){const out=[];let line='';for(const w of t.split(' ')){const test=line?line+' '+w:w;if(x.measureText(test).width>max&&line){out.push(line);line=w}else line=test}if(line)out.push(line);
  return out.flatMap(l=>{if(x.measureText(l).width<=max)return[l];const r=[];let s='';for(const ch of l){if(x.measureText(s+ch).width>max&&s){r.push(s);s=ch}else s+=ch}if(s)r.push(s);return r})}
function drawCard(c,v){const W=1080,H=1350,x=c.getContext('2d');c.width=W;c.height=H;const st=styleOf(v),[c1,c2,ink,acc]=st.pal,R=seeded(v.i*9973+7);
  const g=x.createLinearGradient(0,0,W*.4,H);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.22;x.fillStyle=acc;x.strokeStyle=acc;
  switch(st.pat){
    case'dots':for(let yy=40;yy<H;yy+=54)for(let xx=40+(yy/54%2)*27;xx<W;xx+=54){x.beginPath();x.arc(xx,yy,5,0,7);x.fill()}break;
    case'rings':x.lineWidth=10;for(let r=120;r<760;r+=90){x.beginPath();x.arc(W,0,r,0,7);x.stroke()}x.globalAlpha=.14;for(let r=80;r<420;r+=70){x.beginPath();x.arc(0,H,r,0,7);x.stroke()}break;

    case'rays':x.globalAlpha=.13;for(let k=0;k<16;k++){const a=Math.PI*(k/15)+Math.PI;x.beginPath();x.moveTo(W/2,-60);x.lineTo(W/2+Math.cos(a-.06)*2200,-60-Math.sin(a-.06)*2200);x.lineTo(W/2+Math.cos(a+.06)*2200,-60-Math.sin(a+.06)*2200);x.closePath();if(k%2)x.fill()}break;
    case'stars':for(let k=0;k<70;k++){const xx=R()*W,yy=R()*H,s=4+R()*12;x.beginPath();for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,rr=j%2?s*.45:s;x.lineTo(xx+Math.cos(a)*rr,yy+Math.sin(a)*rr)}x.fill()}break;
    case'leaves':for(let k=0;k<16;k++){const cx=k<8?R()*260:W-R()*260,cy=k%2?R()*300:H-R()*300;x.save();x.translate(cx,cy);x.rotate(R()*6);x.beginPath();x.ellipse(0,0,70,26,0,0,7);x.fill();x.restore()}break;
    case'confetti':for(let k=0;k<90;k++){x.save();x.translate(R()*W,R()*H);x.rotate(R()*6);x.fillRect(-12,-5,24,10);x.restore()}break;

/* ---------- 말씀 앨범 (이 기기에 저장) ---------- */
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

/* ---------- 카드를 원으로 쭉 펼치기 ---------- */
let THEME='all',DECK=[],ROT=0,HOT=-1,GEO=null,BUSY=false;
function themesUI(){$('#themes').innerHTML=`<button data-t="all" class="${THEME==='all'?'on':''}">✨ 전체</button>`+TK.map(k=>`<button data-t="${k}" class="${THEME===k?'on':''}">${TH[k][1]} ${TH[k][0]}</button>`).join('');
  $('#themes').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(BUSY)return;THEME=b.dataset.t;themesUI();deal()})}
const pool=()=>V.filter(v=>THEME==='all'||v.k===THEME);
function geo(){const box=$('#table').querySelector('.ring');const S=box.clientWidth,n=DECK.length;const R=S*.355,cw=Math.max(22,Math.min(S*.09,n>200?S*.075:S*.1)),ch=cw*1.42;return{S,R,cw,ch,n}}
const tf=(i,lift)=>`rotate(${i/DECK.length*360}deg) translateY(${-(GEO.R+(lift||0))}px)`;
function deal(){if(picked()){doneUI();return}DECK=shuffle(pool().map(v=>v.i));ROT=rnd(360);HOT=-1;
  const el=$('#table');el.className='ringwrap';el.innerHTML=`<div class="ring"><div class="spin" style="transform:rotate(${ROT}deg)">${DECK.map((_,n)=>`<div class="rc" data-n="${n}"></div>`).join('')}</div><div class="mid"><div class="big">🎴 카드 ${DECK.length}장</div><small>마음 가는 카드를 눌러 뽑아요<br>끌면 카드가 돌아가요</small></div></div>`;
  GEO=geo();const ring=el.querySelector('.ring');ring.style.setProperty('--cw',GEO.cw+'px');ring.style.setProperty('--ch',GEO.ch+'px');
  const cs=[...el.querySelectorAll('.rc')];cs.forEach((c,n)=>{c.style.transform=`rotate(0deg) translateY(${-GEO.R}px)`;c.style.zIndex=n});
  BUSY=true;requestAnimationFrame(()=>requestAnimationFrame(()=>{cs.forEach((c,n)=>{c.style.transitionDelay=(n/cs.length*.85).toFixed(3)+'s';c.style.transform=tf(n)});
    setTimeout(()=>{cs.forEach(c=>c.style.transitionDelay='');BUSY=false},1800)}));bindRing()}
function setHot(n){if(n===HOT)return;const el=$('#table');if(HOT>=0){const o=el.querySelector(`.rc[data-n="${HOT}"]`);if(o){o.classList.remove('hot');o.style.transform=tf(HOT);o.style.zIndex=HOT}}
  HOT=n;if(n>=0){const c=el.querySelector(`.rc[data-n="${n}"]`);if(c){c.classList.add('hot');c.style.transform=tf(n,GEO.ch*.35);c.style.zIndex=DECK.length+5}}}
function hit(e){const r=$('#table').querySelector('.ring').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy);
  if(d<GEO.R-GEO.ch*.75||d>GEO.R+GEO.ch*1.1)return -1;let a=Math.atan2(dx,-dy)*180/Math.PI-ROT;a=((a%360)+360)%360;return Math.round(a/360*DECK.length)%DECK.length}
function bindRing(){const el=$('#table'),ring=el.querySelector('.ring'),spin=el.querySelector('.spin');let D=null;
  const ang=e=>{const r=ring.getBoundingClientRect();return Math.atan2(e.clientX-r.left-r.width/2,-(e.clientY-r.top-r.height/2))*180/Math.PI};
  ring.onpointerdown=e=>{if(BUSY||el.classList.contains('off'))return;try{ring.setPointerCapture(e.pointerId)}catch(_){}D={x:e.clientX,y:e.clientY,a:ang(e),rot:ROT,moved:false};if(e.pointerType!=='mouse')setHot(hit(e))};
  ring.onpointermove=e=>{if(BUSY||el.classList.contains('off'))return;if(D){if(!D.moved&&Math.hypot(e.clientX-D.x,e.clientY-D.y)>8){D.moved=true;setHot(-1)}
      if(D.moved){let da=ang(e)-D.a;ROT=D.rot+da;spin.style.transform=`rotate(${ROT}deg)`;return}}
    setHot(hit(e))};
  ring.onpointerup=e=>{const d=D;D=null;if(!d||d.moved||BUSY)return;const n=hit(e);if(n<0)return;setHot(n);pickCard(n)};
  ring.onpointerleave=()=>{if(!D)setHot(-1)};ring.onpointercancel=()=>{D=null;setHot(-1)}}
/* 🎁 하루에 한 번 · 복원추출: 이미 앨범에 있는 말씀이 나오면 한 번 더 뽑아요 */
const picked=()=>{try{const o=JSON.parse(localStorage.getItem('words-today')||'null');return o&&o.d===today()&&V[o.i]?V[o.i]:null}catch(_){return null}};
function doneUI(){const v=picked();if(!v)return false;$('#shuffle').hidden=true;$('#themes').hidden=true;
  $('#table').className='ringwrap';$('#table').innerHTML=`<div class="done" style="color:#fff;text-align:center;font-family:Jua,sans-serif;padding:40px 12px"><div style="font-size:56px">🎁</div><h2 style="margin:6px 0;font-size:26px">오늘의 말씀을 이미 뽑았어요</h2><p style="opacity:.85;margin:4px 0 14px">말씀뽑기는 하루에 한 번이에요. 내일 다시 뽑을 수 있어요 🌅</p><button class="pri" id="seeToday">📜 오늘 뽑은 말씀 보기 · ${esc(v.r)}</button> <button id="seeAlb">📒 말씀 앨범</button></div>`;$('#seeToday').onclick=()=>show(v,false);$('#seeAlb').onclick=()=>tab('album');return true}
function pickCard(n){if(picked()){doneUI();return}BUSY=true;const el=$('#table'),c=el.querySelector(`.rc[data-n="${n}"]`);
  const P=pool(),v=V[P[rnd(P.length)].i];const allOwned=P.every(x=>owns(x.i));
  c.classList.remove('hot');c.classList.add('out');c.style.transform=tf(n,GEO.ch*2.2);
  setTimeout(()=>{c.remove();BUSY=false;
    if(owns(v.i)&&!allOwned){showDup(v);if(!el.querySelector('.rc'))deal();return}
    try{localStorage.setItem('words-today',JSON.stringify({d:today(),i:v.i}))}catch(_){}
    if(!owns(v.i)){ALB.push({i:v.i,d:today()});saveAlb()}updCnt();show(v,true);doneUI()},520)}
function showDup(v){const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div><div style="color:#fff;font-family:Jua,sans-serif;font-size:22px;margin-bottom:8px">🔁 이미 앨범에 있는 말씀이에요!</div><canvas style="max-height:calc(100vh - 230px)"></canvas><p style="color:#fff;margin:10px 0 0">${esc(v.r)} · 같은 말씀이 나왔으니 한 번 더 뽑아요</p><div class="acts"><button class="pri" data-a="again">🎴 한 번 더 뽑기</button></div></div>`;
  document.body.appendChild(m);const c=m.querySelector('canvas');drawCard(c,v);const close=()=>m.remove();m.querySelector('[data-a="again"]').onclick=close;m.addEventListener('click',e=>{if(e.target===m)close()})}
$('#shuffle').onclick=()=>{if(BUSY)return;deal();toast('🔀 카드를 다시 섞어 펼쳤어요')};
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{if($('#tDraw').hidden||!$('#table').querySelector('.ring'))return;const ring=$('#table').querySelector('.ring');GEO=geo();ring.style.setProperty('--cw',GEO.cw+'px');ring.style.setProperty('--ch',GEO.ch+'px');ring.querySelectorAll('.rc').forEach(c=>{const n=+c.dataset.n;c.style.transform=tf(n,n===HOT?GEO.ch*.35:0)})},150)});
/* ---------- 말씀 앨범 화면 ---------- */
let AF='all';
function renderAlbum(){const el=$('#tAlbum');updCnt();
  if(!ALB.length){el.innerHTML=`<div class="binder"><div class="bhead"><h2 class="j">📒 나의 말씀 앨범</h2></div><div class="empty-al"><div style="font-size:50px">📜</div><p class="j" style="font-size:20px;margin:8px 0">아직 모은 말씀이 없어요</p><p class="hint">뽑기에서 오늘의 말씀을 뽑으면 이 앨범에 차곡차곡 모여요.</p><button id="goDraw">🎁 뽑으러 가기</button></div></div>`;$('#goDraw').onclick=()=>tab('draw');return}
  const cnt={};ALB.forEach(a=>{const k=V[a.i].k;cnt[k]=(cnt[k]||0)+1});const tot={};V.forEach(v=>tot[v.k]=(tot[v.k]||0)+1);
  const L=ALB.slice().reverse().filter(a=>AF==='all'||V[a.i].k===AF);
  el.innerHTML=`<div class="binder"><div class="bhead"><h2 class="j">📒 나의 말씀 앨범</h2><span class="prog">모은 말씀 ${ALB.length} / ${V.length}</span></div><div class="bar"><i style="width:${(ALB.length/V.length*100).toFixed(1)}%"></i></div>
    <div class="chips"><button data-af="all" class="${AF==='all'?'on':''}">✨ 전체 ${ALB.length}</button>${TK.map(k=>`<button data-af="${k}" class="${AF===k?'on':''}" ${cnt[k]?'':'disabled'}>${TH[k][1]} ${TH[k][0]} ${cnt[k]||0}/${tot[k]}</button>`).join('')}</div>
    <div class="al">${L.map(a=>{const v=V[a.i],[c1,c2,ink,acc]=styleOf(v).pal;return`<div class="mc" data-i="${v.i}" style="background:linear-gradient(160deg,${c1},${c2});color:${ink}"><div class="k">${TH[v.k][1]} ${TH[v.k][0]}</div><div class="t">${esc(v.t)}</div><div class="r" style="color:${acc}">${esc(v.r)}</div><div class="d">${a.d?dotDate(a.d)+' 뽑음':''}</div></div>`}).join('')}</div>
    <p class="hint" style="text-align:center;margin:12px 0 0">카드를 누르면 크게 보고 저장할 수 있어요 · 새로 뽑은 말씀이 앞에 와요</p></div>`;
  el.querySelectorAll('[data-af]').forEach(b=>b.onclick=()=>{AF=b.dataset.af;renderAlbum()});
  el.querySelectorAll('.mc').forEach(b=>b.onclick=()=>show(V[+b.dataset.i],false))}
function tab(k){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===k));$('#tDraw').hidden=k!=='draw';$('#tAlbum').hidden=k!=='album';if(k==='album'){AF='all';renderAlbum()}else if(!picked()&&!$('#table').querySelector('.ring'))deal();scrollTo(0,0)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
/* ---------- 뽑은 카드 보기 ---------- */
const BOOKOF=r=>{const i=r.lastIndexOf(' ');return[r.slice(0,i),r.slice(i+1).split(':')[0]]};
function show(v,save){const m=document.createElement('div');m.className='modal';const[b,ch]=BOOKOF(v.r);
  m.innerHTML=`<div><canvas></canvas><div class="acts"><button class="pri" data-a="save">📥 이미지 저장</button><button data-a="copy">📋 말씀 복사</button><a href="../bible/?b=${encodeURIComponent(b)}&c=${ch}" target="_blank">📖 성경에서 보기</a><button data-a="x">닫기</button></div></div>`;
  document.body.appendChild(m);const c=m.querySelector('canvas');const st=styleOf(v);
  const go=()=>drawCard(c,v);go();(document.fonts?Promise.all([document.fonts.load(`700 60px "${st.font}"`,'가나다'),document.fonts.load('40px Jua','가'),document.fonts.load('600 40px "Gowun Dodum"','가')]):Promise.resolve()).then(go,go);
  const close=()=>m.remove();m.addEventListener('click',e=>{if(e.target===m)close()});
  m.querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{const a=btn.dataset.a;
    if(a==='x')close();
    if(a==='copy'){const t=v.t+'\n('+v.r+')';navigator.clipboard.writeText(t).then(()=>toast('📋 말씀을 복사했어요'),()=>prompt('복사해 주세요',t))}
    if(a==='save')c.toBlob(bl=>{const n='말씀_'+v.r.replace(/[:\s]/g,'_')+'.png';if(window.SAVEFILE)SAVEFILE(bl,n);else{const u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download=n;document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(u);l.remove()},1500)}toast('📥 말씀 카드를 저장했어요')},'image/png')});
}
themesUI();updCnt();if(!doneUI())deal();if(location.hash==='#album')tab('album');
const q=new URLSearchParams(location.search).get('v');if(q!=null&&V[+q])show(V[+q],false);
window.__words={V,drawCard,show};
})();
</script>
