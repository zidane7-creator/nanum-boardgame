<style>
:root{--ink:#3b2a20;--cream:#fffaf0;--line:#e3d6c2;--accent:#e8503a;--gold:#f5b82e;--muted:#7a6a5c}
*{box-sizing:border-box}[hidden]{display:none!important}

.pc{aspect-ratio:4/5.6;border-radius:12px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.3,1.2);border:0;padding:0;box-shadow:none;background:none}

.pc .bk small{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;color:#f5e6c4;opacity:.75;z-index:1}

 <div class="card hero"><h1>🎁 말씀뽑기</h1><p>마음이 가는 카드를 하나 골라 보세요. 오늘 하나님이 주시는 말씀이에요.</p>
  <div class="chips" id="themes"></div>

 <p class="hint" style="text-align:center">말씀 ${N}구절 · 성경 개역한글판 · 📖 성경에서 보기로 앞뒤 말씀을 함께 읽어요</p>

<script>
(function(){"use strict";
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)};
const TH=window.WORD_THEMES,TK=Object.keys(TH);
const V=window.WORD_LIST.split("\n").map(l=>l.split("|")).filter(x=>x.length===3).map(([k,r,t],i)=>({i,k,r,t}));
document.querySelector('main p.hint:last-child').textContent=`말씀 ${V.length}구절 · 성경 개역한글판 · 📖 성경에서 보기로 앞뒤 말씀을 함께 읽어요`;
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return Math.floor(a[0]/4294967296*n)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
/* ---------- 말씀 카드 디자인 (구절마다 정해진 디자인) ---------- */
const PALS=[["#fde2e4","#fad2e1","#7a2f45","#e05780"],["#e2ece9","#bee1e6","#24525a","#2a9d8f"],["#fff1d6","#ffd6a5","#6b3e12","#f4a261"],["#e8e1f7","#cdb4db","#3e2b63","#7a4fb0"],["#dbeafe","#bfdbfe","#1e3a5f","#2f6fb0"],["#e9f5db","#b5e48c","#2d4a1e","#52b788"],["#1f2a44","#3a4a7a","#fdf6e3","#f5d27a"],["#2d1b33","#5b3a6b","#fff4e6","#ffb4a2"],["#0f3d3e","#1d6a5a","#f1faee","#a8dadc"],["#fefae0","#e9edc9","#4a4a2a","#bc6c25"],["#f8edeb","#fcd5ce","#5e3023","#e07a5f"],["#edf2fb","#d7e3fc","#2b2d42","#8d99ae"],["#3d0f16","#7a1f2a","#fff5e1","#f5d27a"],["#fff8e7","#ffe5b4","#5c4033","#d4a373"],["#e3f2fd","#fce4ec","#37474f","#ec407a"],["#263238","#455a64","#eceff1","#80cbc4"]];
const PATS=['dots','rings','waves','rays','stars','leaves','confetti','frame','arch','blobs'];
const FONTS=['Gowun Batang','Nanum Myeongjo','Song Myung','Hahmlet','Gowun Dodum','Gowun Batang','Nanum Myeongjo','Jua'];
const styleOf=v=>{const ti=TK.indexOf(v.k);return{pal:PALS[(v.i*5+ti*3)%PALS.length],pat:PATS[(v.i*7+ti)%PATS.length],font:FONTS[(v.i*3+ti)%FONTS.length]}};
function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function wrap(x,t,max){const out=[];let line='';for(const w of t.split(' ')){const test=line?line+' '+w:w;if(x.measureText(test).width>max&&line){out.push(line);line=w}else line=test}if(line)out.push(line);
  return out.flatMap(l=>{if(x.measureText(l).width<=max)return[l];const r=[];let s='';for(const ch of l){if(x.measureText(s+ch).width>max&&s){r.push(s);s=ch}else s+=ch}if(s)r.push(s);return r})}
function drawCard(c,v){const W=1080,H=1350,x=c.getContext('2d');c.width=W;c.height=H;const st=styleOf(v),[c1,c2,ink,acc]=st.pal,R=seeded(v.i*9973+7);
  const g=x.createLinearGradient(0,0,W*.4,H);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.22;x.fillStyle=acc;x.strokeStyle=acc;
  switch(st.pat){
    case'dots':for(let yy=40;yy<H;yy+=54)for(let xx=40+(yy/54%2)*27;xx<W;xx+=54){x.beginPath();x.arc(xx,yy,5,0,7);x.fill()}break;
    case'rings':x.lineWidth=10;for(let r=120;r<760;r+=90){x.beginPath();x.arc(W,0,r,0,7);x.stroke()}x.globalAlpha=.14;for(let r=80;r<420;r+=70){x.beginPath();x.arc(0,H,r,0,7);x.stroke()}break;
    case'waves':for(let k=0;k<4;k++){x.globalAlpha=.12+k*.05;x.beginPath();x.moveTo(0,H);for(let xx=0;xx<=W;xx+=20)x.lineTo(xx,H-160-k*70+Math.sin(xx/120+k)*34);x.lineTo(W,H);x.fill()}break;
    case'rays':x.globalAlpha=.13;for(let k=0;k<16;k++){const a=Math.PI*(k/15)+Math.PI;x.beginPath();x.moveTo(W/2,-60);x.lineTo(W/2+Math.cos(a-.06)*2200,-60-Math.sin(a-.06)*2200);x.lineTo(W/2+Math.cos(a+.06)*2200,-60-Math.sin(a+.06)*2200);x.closePath();if(k%2)x.fill()}break;
    case'stars':for(let k=0;k<70;k++){const xx=R()*W,yy=R()*H,s=4+R()*12;x.beginPath();for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,rr=j%2?s*.45:s;x.lineTo(xx+Math.cos(a)*rr,yy+Math.sin(a)*rr)}x.fill()}break;
    case'leaves':for(let k=0;k<16;k++){const cx=k<8?R()*260:W-R()*260,cy=k%2?R()*300:H-R()*300;x.save();x.translate(cx,cy);x.rotate(R()*6);x.beginPath();x.ellipse(0,0,70,26,0,0,7);x.fill();x.restore()}break;
    case'confetti':for(let k=0;k<90;k++){x.save();x.translate(R()*W,R()*H);x.rotate(R()*6);x.fillRect(-12,-5,24,10);x.restore()}break;
    case'frame':x.globalAlpha=.55;x.lineWidth=8;x.strokeRect(46,46,W-92,H-92);x.lineWidth=3;x.strokeRect(70,70,W-140,H-140);break;
    case'arch':x.globalAlpha=.35;x.fillStyle='#ffffff';x.beginPath();x.moveTo(150,H-130);x.lineTo(150,520);x.arc(W/2,520,W/2-150,Math.PI,0);x.lineTo(W-150,H-130);x.closePath();x.fill();break;
    case'blobs':x.filter='blur(60px)';for(let k=0;k<6;k++){x.beginPath();x.arc(R()*W,R()*H,140+R()*160,0,7);x.fill()}x.filter='none';break}
  x.restore();
  const T=TH[v.k];x.textAlign='center';x.textBaseline='middle';x.fillStyle=ink;
  x.font='44px Jua, sans-serif';x.globalAlpha=.75;x.fillText(T[1]+'  '+T[0],W/2,150);x.globalAlpha=1;
  x.fillStyle=acc;x.fillRect(W/2-40,196,80,6);
  /* 본문: 칸에 맞게 크기 */
  let fs=76,lines,lh;const maxW=W-220,maxH=H-560;
  for(;fs>=34;fs-=2){x.font=`${st.font==='Jua'?'':'700 '}${fs}px "${st.font}", "Gowun Batang", serif`;lines=wrap(x,v.t,maxW);lh=fs*1.55;if(lines.length*lh<=maxH)break}
  x.fillStyle=ink;const y0=H/2+20-(lines.length*lh)/2+lh/2;lines.forEach((l,k)=>x.fillText(l,W/2,y0+k*lh));
  x.font='600 46px "Gowun Dodum", sans-serif';x.fillStyle=acc;x.fillText('— '+v.r+' —',W/2,H-200);
  x.font='28px Jua, sans-serif';x.globalAlpha=.5;x.fillStyle=ink;x.fillText('치영의 교회 생활 즐기기 · 말씀뽑기',W/2,H-90);x.globalAlpha=1}
/* ---------- 카드 깔기 ---------- */
let THEME='all',DECK=[],SHOWN=0;const PER=()=>innerWidth<600?16:24;
function themesUI(){$('#themes').innerHTML=`<button data-t="all" class="${THEME==='all'?'on':''}">✨ 전체</button>`+TK.map(k=>`<button data-t="${k}" class="${THEME===k?'on':''}">${TH[k][1]} ${TH[k][0]}</button>`).join('');
  $('#themes').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{THEME=b.dataset.t;themesUI();deal()})}
function deal(){DECK=shuffle(V.filter(v=>THEME==='all'||v.k===THEME));SHOWN=Math.min(PER(),DECK.length);lay()}
function lay(){$('#table').innerHTML=DECK.slice(0,SHOWN).map((v,n)=>`<button class="pc" data-n="${n}" style="transform:rotate(${(rnd(9)-4)*1.2}deg)" aria-label="카드 뽑기"><span class="bk"><i>✝</i><small>말씀</small></span></button>`).join('');$('#more').hidden=SHOWN>=DECK.length}
$('#shuffle').onclick=()=>{deal();toast('🔀 카드를 다시 섞었어요')};
$('#more').onclick=()=>{SHOWN=Math.min(DECK.length,SHOWN+PER());lay()};
$('#table').addEventListener('click',e=>{const b=e.target.closest('.pc');if(!b||b.classList.contains('gone'))return;const v=DECK[+b.dataset.n];b.classList.add('pick');setTimeout(()=>{b.classList.remove('pick');b.classList.add('gone');show(v,true)},520)});
/* ---------- 뽑은 카드 보기 ---------- */
const BOOKOF=r=>{const i=r.lastIndexOf(' ');return[r.slice(0,i),r.slice(i+1).split(':')[0]]};
function show(v,save){const m=document.createElement('div');m.className='modal';const[b,ch]=BOOKOF(v.r);
  m.innerHTML=`<div><canvas></canvas><div class="acts"><button class="pri" data-a="save">📥 이미지 저장</button><button data-a="copy">📋 말씀 복사</button><a href="../bible/?b=${encodeURIComponent(b)}&c=${ch}" target="_blank">📖 성경에서 보기</a><button data-a="again">🎁 다시 뽑기</button><button data-a="x">닫기</button></div></div>`;
  document.body.appendChild(m);const c=m.querySelector('canvas');const st=styleOf(v);
  const go=()=>drawCard(c,v);go();(document.fonts?Promise.all([document.fonts.load(`700 60px "${st.font}"`,'가나다'),document.fonts.load('40px Jua','가'),document.fonts.load('600 40px "Gowun Dodum"','가')]):Promise.resolve()).then(go,go);
  const close=()=>m.remove();m.addEventListener('click',e=>{if(e.target===m)close()});
  m.querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{const a=btn.dataset.a;
    if(a==='x')close();if(a==='again'){close();if($('#table').querySelectorAll('.pc:not(.gone)').length===0)deal();$('#table').scrollIntoView({behavior:'smooth',block:'center'})}
    if(a==='copy'){const t=v.t+'\n('+v.r+')';navigator.clipboard.writeText(t).then(()=>toast('📋 말씀을 복사했어요'),()=>prompt('복사해 주세요',t))}
    if(a==='save')c.toBlob(bl=>{const u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download='말씀_'+v.r.replace(/[:\s]/g,'_')+'.png';document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(u);l.remove()},1500);toast('📥 말씀 카드를 저장했어요')},'image/png')});
  if(save){try{const H=JSON.parse(localStorage.getItem('words-hist')||'[]').filter(x=>x!==v.i);H.unshift(v.i);localStorage.setItem('words-hist',JSON.stringify(H.slice(0,24)))}catch(_){}hist()}}
function hist(){let H=[];try{H=JSON.parse(localStorage.getItem('words-hist')||'[]')}catch(_){}$('#histCard').hidden=!H.length;
  $('#hist').innerHTML=H.map(i=>V[i]).filter(Boolean).map(v=>`<button data-h="${v.i}" title="${esc(v.t)}">${TH[v.k][1]} ${esc(v.r)} · ${esc(v.t)}</button>`).join('');$('#hist').querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>show(V[+b.dataset.h],false))}
themesUI();deal();hist();
const q=new URLSearchParams(location.search).get('v');if(q!=null&&V[+q])show(V[+q],false);
window.__words={V,drawCard,show};
})();
</script>
