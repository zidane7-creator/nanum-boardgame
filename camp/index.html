<style>

.mvr{display:flex;flex-wrap:wrap;gap:4px}.prow .mvr select,.prow .mvr input{width:auto;font-size:13px;padding:3px 4px}

 .prow .c::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}.prow .del{grid-column:1/-1}}
.meth{font-size:12px;white-space:nowrap}.m-c{background:#fff3c4;border-color:#ebc95f}.m-b{background:#e3efff;border-color:#9bbde3}.m-k{background:#f1e4ff;border-color:#c9a9ec}
select.pm{font-size:12px;padding:1px 3px;margin-top:3px;width:100%}

.ptools select{font-size:13px;padding:3px 4px;max-width:170px}.ptools select.pfon{background:#fff1cc;border-color:#ebc95f;font-weight:600}
.sortk{cursor:pointer;border-radius:6px;padding:0 3px}.sortk:hover{background:#fff}.sortk.on{background:#fff1cc;color:var(--ink)}
.phead .w4{display:flex;flex-wrap:wrap;gap:2px;align-items:center}.phead .w4>div{display:inline}
.prow.phi{background:#fff1cc!important;outline:2px solid var(--gold)}
.chip[data-pid]{cursor:pointer}

.toast.show{opacity:1}

.camp{border:2.5px solid var(--ink);border-radius:16px;padding:12px;background:#fff;cursor:pointer}
.camp:hover{background:#fff8e6}
.camp .n{font-family:Jua,sans-serif;font-size:20px}
.kv{display:grid;grid-template-columns:110px 1fr auto;gap:6px 10px;align-items:start}
.kv>b{font-family:Jua,sans-serif;font-weight:normal;font-size:16px;padding-top:4px}
.stars button{border:0;background:none;padding:0 1px;font-size:17px;color:#d8cbb5}
.stars button.on{color:var(--gold)}
@media (max-width:640px){.kv{grid-template-columns:1fr}.glab{width:110px}.head h1{font-size:21px}.pool{top:56px}}
@media print{.top,.tabs,.no-print,#siteGuideBtn,#homeFab{display:none!important}body{background:#fff}.card{border:0}}

</head><body>
<div class="top"><a href="../">← 목장</a><span class="ttl">⛺ 수련회 준비 패키지</span></div>
<div class="wrap" id="app"><div class="empty">불러오는 중…</div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileUp" hidden multiple>
<input type="file" id="xlsUp" hidden accept=".xlsx,.xls,.csv">
<input type="file" id="bakUp" hidden accept=".json">
<input type="file" id="rcpUp" hidden accept="image/*,.pdf">
<script>
(function(){
"use strict";
/* ============ 기본 도구 ============ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const toT=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const fromT=t=>new Date(t).toISOString().slice(0,10);
const addD=(s,n)=>fromT(toT(s)+n*864e5);
const diffD=(a,b)=>Math.round((toT(b)-toT(a))/864e5);
const DOW='일월화수목금토';
const fmtD=s=>{if(!s)return'';const[,m,d]=s.split('-');return `${+m}/${+d}(${DOW[new Date(toT(s)).getUTCDay()]})`};
const won=n=>(Math.round(+n||0)).toLocaleString('ko-KR');
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2300)}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mc" role="dialog">${html}</div>`;document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m||e.target.dataset.close!==undefined)m.remove()});return m}
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const PAL=['#2f6fb0','#3f9a55','#c8507a','#d9822b','#7a4fb0','#167a7a','#b5361f','#5b6d7a'];

/* ============ 저장소 (이 기기 브라우저의 IndexedDB) ============ */
const idb={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('camp-pack',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('camps');d.createObjectStore('files')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(st,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(st,mode),q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(st,k){return this.tx(st,'readonly',s=>s.get(k))},put(st,k,v){return this.tx(st,'readwrite',s=>s.put(v,k))},
  del(st,k){return this.tx(st,'readwrite',s=>s.delete(k))},all(st){return this.tx(st,'readonly',s=>s.getAll())}};

let R=null,TAB='staff';const SUB={dir:'in',folder:'',min:null,ledEdit:null};
let saveT;function save(){clearTimeout(saveT);const s=$('#sync');if(s)s.textContent='저장 중…';saveT=setTimeout(async()=>{try{R.updated=Date.now();await idb.put('camps',R.id,R);const s=$('#sync');if(s)s.textContent='✔ 이 기기에 저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}catch(e){toast('저장하지 못했어요: '+(e&&e.message||e))}},250)}
addEventListener('pagehide',()=>{if(R&&saveT){clearTimeout(saveT);try{idb.put('camps',R.id,R)}catch(e){}}});

const METHODS={'온라인':['구입필요','구입완료','배송완료','준비완료'],'오프라인':['구입필요','구입완료','준비완료'],'챙기기':['준비필요','준비완료'],'제작':['준비전','시안제작완료','발주완료','배송완료','준비완료'],'인쇄':['준비전','작성완료','인쇄완료','준비완료']};
const SPK_ST=['후보','연락 예정','연락함','답변 대기','수락','확정','거절'];
function fill(R){
  const d=(k,v)=>{if(R[k]==null)R[k]=v};
  d('nights',2);d('start','');
  d('cfg',{});const c=R.cfg;
  if(!c.minRoles)c.minRoles=['목사','전도사','간사'];
  if(!c.staffRoles)c.staffRoles=['회장','총무','스탭'];
  if(!c.parts)c.parts=['찬양인도자','싱어','메인건반','세컨건반','일렉기타','어쿠스틱기타','베이스','드럼'];
  d('people',[]);d('minutes',[]);d('sched',[]);
  d('theme',{});const t=R.theme;['hearts','verses','cands'].forEach(k=>{if(!t[k])t[k]=[]});
  d('venue',{});const v=R.venue;if(v.expected==null)v.expected=null;if(!v.list)v.list=[];if(!v.crit)v.crit=[{id:'c_snd',name:'음향'},{id:'c_use',name:'용도(프로그램 공간)'}];
  if(!v.w){v.w={fixed:20,var:25,cap:20,loc:15};const r=20/v.crit.length;v.crit.forEach(x=>v.w[x.id]=Math.round(r))}
  if(!v.rules){v.rules={};RULE_KEYS.forEach(k=>v.rules[k]=RULE_DEF[k].rows.map(([f,t,sc])=>({id:uid(),from:f,to:t,s:sc})));
    const w={fixed:15,loc:15,lodge:15,meal:15,dens:15},rest=100-75,n=v.crit.length;v.crit.forEach((x,i)=>w[x.id]=Math.floor(rest/n)+(i<rest%n?1:0));if(!n)w.fixed+=25;v.w=w;
    v.list.forEach(x=>{if(x.mealPrice==null&&x.meal!=null)x.mealPrice=x.meal;if(!x.rooms)x.rooms=[]})}
  v.list.forEach(x=>{if(!x.rooms)x.rooms=[]});
  if(!v.mealPP){v.rules.meal=RULE_DEF.meal.rows.map(([f,t,sc])=>({id:uid(),from:f,to:t,s:sc}));v.mealPP=1}
  d('speakers',[]);d('programs',[]);
  d('tt',{});if(!R.tt.from)R.tt.from='07:00';if(!R.tt.to)R.tt.to='24:00';if(!R.tt.cells)R.tt.cells={};
  d('conf',{});if(R.conf.speaker&&!R.conf.speaker1)R.conf.speaker1=R.conf.speaker;CONF.forEach(([k])=>{if(!R.conf[k])R.conf[k]={v:'',ok:false}});
  if(!R.conf.snack.days){R.conf.snack.days={};if(R.conf.snack.v){R.conf.snack.days[0]=R.conf.snack.v;R.conf.snack.v=''}}
  /* 예전엔 ‘불러오기’로 복사해 둔 값 → 출처와 같으면 비워서 자동으로 */
  d('spkFinal',{});
  d('sup',[]);d('chk',[]);d('folders',[]);d('files',[]);
  d('acc',{});if(!R.acc.cats)R.acc.cats={in:['수련회비','후원','지원금','기타'],out:['준비(데코)','준비(간식)','준비(프로그램)','장소비','강사비','식사','간식','기타']};if(!R.acc.items)R.acc.items=[];
  d('cars',{});if(!R.cars.types)R.cars.types={in:['버스 본대','버스 후발대','자차 본대','자차 후발대','스탭차'],out:['버스 본대','버스 후발대','자차 본대','자차 후발대','스탭차']};if(!R.cars.list)R.cars.list=[];
  d('grp',{});const g=R.grp;if(!g.roles)g.roles=['부조장','서기'];if(g.useLeader==null)g.useLeader=true;if(g.useStaff==null)g.useStaff=true;if(!g.list)g.list=[];
  d('rooms',[]);d('notices',[]);
  d('fee',{});if(R.fee.base===undefined)R.fee.base=null;if(!R.fee.rules)R.fee.rules=[];
  R.cars.list.forEach(c=>{if(c.time&&!/^\d{2}:\d{2}$/.test(c.time)){const dm=String(c.time).match(/(\d+)\s*일차/),tm=String(c.time).match(/(\d{1,2})\s*[:시]\s*(\d{2})?/);if(dm&&c.day==null)c.day=+dm[1]-1;c.time=tm?pad(+tm[1])+':'+pad(+(tm[2]||0)):''}});
  return R}

/* 경로로 객체 찾기: "venue.list#ID>sc" */
function objOf(spec){if(spec==null)return null;if(spec==='.')return R;const[main,post]=spec.split('>');const[path,id]=main.split('#');let o=R;for(const p of path.split('.'))o=o==null?o:o[p];
  if(id!==undefined)o=Array.isArray(o)?o.find(x=>x.id===id):o&&o[id];
  if(post&&o){for(const q of post.split('.')){const[k,pid]=q.split('#');if(o[k]==null)o[k]=pid!==undefined?[]:{};o=o[k];if(pid!==undefined)o=o.find(x=>x.id===pid);if(!o)return null}}return o}

const P=id=>R.people.find(p=>p.id===id);
const pn=id=>{const p=P(id);return p?p.name||'(이름 없음)':'(삭제된 사람)'};
const prepList=()=>R.people.filter(p=>p.prep);
const byName=(a,b)=>String(a.name).localeCompare(String(b.name),'ko');
const campEnd=()=>R.start?addD(R.start,+R.nights||0):'';
const campRange=()=>R.start?`${R.start.replace(/-/g,'.')}(${DOW[new Date(toT(R.start)).getUTCDay()]}) ~ ${fmtD(campEnd())} · ${R.nights}박 ${+R.nights+1}일`:'';
const roleOf=p=>p.prep?(p.role||(p.prep==='min'?'사역자':'준비인원')):'';

/* ============ 공용 위젯 ============ */
function LE(path,ph){const arr=objOf(path)||[];return `<div class="le">${arr.map((x,i)=>`<span class="chip"><span data-act="leRen" data-le="${path}" data-i="${i}" title="눌러서 이름 바꾸기" style="cursor:pointer">${esc(x)}</span>${i?`<button class="x" data-act="leUp" data-le="${path}" data-i="${i}" title="앞으로">‹</button>`:''}<button class="x" data-act="leDel" data-le="${path}" data-i="${i}" title="빼기">×</button></span>`).join('')}<input class="leadd" data-le-add="${path}" placeholder="${esc(ph||'+ 추가 후 Enter')}"></div>`}
const LE_REF={
  'cfg.minRoles':(a,b)=>R.people.forEach(p=>{if(p.prep==='min'&&p.role===a)p.role=b}),
  'cfg.staffRoles':(a,b)=>R.people.forEach(p=>{if(p.prep==='staff'&&p.role===a)p.role=b}),
  'cfg.parts':(a,b)=>R.people.forEach(p=>{if(p.parts)p.parts=p.parts.map(x=>x===a?b:x).filter(Boolean)}),
  'grp.roles':(a,b)=>R.grp.list.forEach(g=>{for(const k in g.roles||{})if(g.roles[k]===a){if(b)g.roles[k]=b;else delete g.roles[k]}}),
  'cars.types.in':(a,b)=>R.cars.list.forEach(c=>{if(c.dir==='in'&&c.type===a)c.type=b}),
  'cars.types.out':(a,b)=>R.cars.list.forEach(c=>{if(c.dir==='out'&&c.type===a)c.type=b}),
  'acc.cats.in':(a,b)=>R.acc.items.forEach(x=>{if(x.type==='in'&&x.cat===a)x.cat=b}),
  'acc.cats.out':(a,b)=>R.acc.items.forEach(x=>{if(x.type==='out'&&x.cat===a)x.cat=b})};
function WHO(spec,key,cands,ph){const o=objOf(spec)||{};const arr=o[key]||[];return `<div class="who">${arr.map(id=>`<span class="chip p">${esc(pn(id))}<button class="x" data-act="rmFrom" data-o="${spec}" data-k="${key}" data-v="${id}">×</button></span>`).join('')}<select data-act="addTo" data-o="${spec}" data-k="${key}"><option value="">${esc(ph||'+ 추가')}</option>${cands.filter(p=>!arr.includes(p.id)).sort(byName).map(p=>`<option value="${p.id}">${esc(p.name)}${p.prep?' · '+esc(roleOf(p)):''}</option>`).join('')}</select></div>`}
const inp=(spec,k,o={})=>{const ob=objOf(spec)||{};const v=ob[k];return `<input data-o="${spec}" data-k="${k}"${o.n?' data-t="n" type="number" inputmode="numeric"':o.type?` type="${o.type}"`:''}${o.rr?' data-rr':''}${o.list?` list="${o.list}"`:''} value="${esc(v??'')}" placeholder="${esc(o.ph||'')}"${o.st?` style="${o.st}"`:''}>`};
const sel=(spec,k,opts,o={})=>{const ob=objOf(spec)||{};const v=ob[k]??'';return `<select data-o="${spec}" data-k="${k}"${o.rr?' data-rr':''}${o.st?` style="${o.st}"`:''}>${o.blank!==undefined?`<option value="">${esc(o.blank)}</option>`:''}${opts.map(x=>{const[val,lab]=Array.isArray(x)?x:[x,x];return `<option value="${esc(val)}"${String(val)===String(v)?' selected':''}>${esc(lab)}</option>`}).join('')}</select>`};
const ta=(spec,k,ph,rows)=>{const ob=objOf(spec)||{};return `<textarea data-o="${spec}" data-k="${k}" rows="${rows||3}" placeholder="${esc(ph||'')}">${esc(ob[k]||'')}</textarea>`};
const peopleOpts=(L,blank)=>[['',blank||'— 선택 —'],...L.slice().sort(byName).map(p=>[p.id,p.name+(p.prep?' · '+roleOf(p):'')])];

/* 배정 칩 (끌어서 옮기기) */
/* 🙋 이름을 누르면 [참석인원]에 적힌 신청정보를 보여 줘요 */
function personInfo(pid){const p=P(pid);if(!p)return;const fe=feeOf(p);
  const car=dir=>{const c=R.cars.list.find(c=>c.dir===dir&&(c.members||[]).includes(pid));return c?`${c.type||'차'}${c.name?' · '+c.name:''}${c.day!=null&&c.day!==''&&c.time?` (${+c.day+1}일차 ${apTxt((+c.time.split(':')[0])*60+(+c.time.split(':')[1]))})`:''}${c.driver===pid?' · 운전':''}`:'없음'};
  const g=R.grp.list.find(g=>(g.members||[]).includes(pid)),rm=R.rooms.find(r=>(r.members||[]).includes(pid));
  const mv=d=>{const m=p[d+'Move'],pl=p[d+'Place'];return `${esc(whenText(p,d)||'시간 미정')}${m?' · '+esc(m):''}${pl?' · 📍'+esc(pl):''}`};
  const rows=[['풀참여부',p.full],['성별',p.gender],['나이',p.age],['소속',p.org],['사는 곳',p.addr],['핸드폰번호',p.phone?`<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>`:''],['보험',p.ins],
    ['들어올 때',mv('in')],['나갈 때',mv('out')],['구분',p.prep?esc(roleOf(p)):'일반'],['찬양팀',p.praise?'🎸 '+esc((p.parts||[]).join(', ')||'찬양팀'):''],['맡은 역할',p.duty],
    ['회비',fe.amt!=null?won(fe.amt)+'원 <span class="hint">('+esc(fe.why)+')</span>':''],['입금',p.paid?`✔ 입금 ${esc(p.payMethod||'')} ${esc(p.paidDate||'')}`:'미입금'],
    ['들어오는 차',esc(car('in'))],['나가는 차',esc(car('out'))],['조',g?esc(g.name)+(g.leader===pid?' 👑 조장':'')+((g.roles||{})[pid]?' · '+esc(g.roles[pid]):''):'없음'],['방',rm?esc([rm.building,rm.floor,rm.name].filter(Boolean).join(' '))+(rm.captain===pid?' 🔑 방장':''):'없음']];
  const raw=k=>['gender','age','org','addr','ins','duty'].includes(k);
  const m=modal(`<h2>🙋 ${esc(p.name||'(이름 없음)')} <span class="hint" style="font-size:14px">신청정보</span></h2><table class="t pinfo">${rows.map(([l,v])=>`<tr><th>${l}</th><td>${v===undefined||v===null||v===''?'<span class="hint">-</span>':(typeof v==='string'&&['풀참여부','성별','나이','소속','사는 곳','보험','맡은 역할'].includes(l)?esc(v):v)}</td></tr>`).join('')}</table>
   <div class="row" style="margin-top:10px"><button class="pri" id="piGo">✏️ 참석인원에서 고치기</button><button data-close>닫기</button></div>`);
  m.querySelector('#piGo').onclick=()=>{m.remove();TAB='people';SUB.pf={};SUB.pHi=pid;render();const r=document.getElementById('prow-'+pid);if(r)r.scrollIntoView({block:'center'});setTimeout(()=>{SUB.pHi=null;const r=document.getElementById('prow-'+pid);if(r)r.classList.remove('phi')},2500)}}
function CHIP(pid,from,extra){const p=P(pid);if(!p)return'';return `<span class="chip p ${p.gender==='여'?'f':p.gender==='남'?'m':''}" draggable="true" data-pid="${pid}" data-from="${from}" title="${esc([p.gender,p.age,p.org].filter(Boolean).join(' · '))}">${esc(p.name||'(이름 없음)')}${extra||''}${from!=='pool'?`<button class="x" data-act="unassign" data-from="${from}" data-pid="${pid}" title="빼기">×</button>`:''}</span>`}
function holder(key){const[k,id]=key.split('#');if(k==='car')return R.cars.list.find(c=>c.id===id);if(k==='grp')return R.grp.list.find(g=>g.id===id);if(k==='room')return R.rooms.find(r=>r.id===id);return null}
function scopeOf(key){const[k,id]=key.split('#');if(k==='car'){const c=holder(key);return R.cars.list.filter(x=>x.dir===(c?c.dir:SUB.dir))}if(k==='grp')return R.grp.list;if(k==='room')return R.rooms;return[]}
function assign(pid,to,from){
  if(from&&from!=='pool'){const h=holder(from);if(h)h.members=(h.members||[]).filter(x=>x!==pid)}
  if(to&&to!=='pool'){scopeOf(to).forEach(h=>h.members=(h.members||[]).filter(x=>x!==pid));const h=holder(to);if(h){(h.members=h.members||[]).push(pid)}}
  [...R.grp.list].forEach(g=>{if(g.leader&&!(g.members||[]).includes(g.leader))g.leader=''});
  R.rooms.forEach(r=>{if(r.captain&&!(r.members||[]).includes(r.captain))r.captain=''});
  save();render()}
function addSel(to,cands){return `<select data-act="assign" data-to="${to}" style="width:100%;margin-top:4px;font-size:13px"><option value="">+ 참석인원에서 추가</option>${cands.slice().sort(byName).map(p=>`<option value="${p.id}">${esc(p.name)}${p.gender?' ('+p.gender+')':''}${p.org?' · '+esc(p.org):''}</option>`).join('')}</select>`}
function poolHTML(cands,label){return `<div class="pool" data-drop="pool"><div class="row" style="margin-bottom:4px"><b class="j">🙋 ${esc(label)} (${cands.length})</b><span class="hint">이름을 끌어다 놓거나, 각 칸의 ‘+ 추가’로 넣어요</span><input id="poolQ" placeholder="이름 찾기" style="margin-left:auto;width:120px" value="${esc(SUB.poolQ||'')}"></div>${cands.length?cands.slice().sort(byName).map(p=>CHIP(p.id,'pool')).join(''):'<span class="hint">모두 배정했어요 👏</span>'}</div>`}

/* ============ 메뉴 ============ */

function render(){
  const ae=document.activeElement,key=ae&&(ae.dataset&&ae.dataset.o!=null?'o:'+ae.dataset.o+'|'+ae.dataset.k:ae.id?'#'+ae.id:null),selS=ae&&ae.selectionStart,keep={};
  $$('[data-keep]').forEach(e=>keep[e.dataset.keep]=[e.scrollLeft,e.scrollTop]);
  const app=$('#app');app.classList.toggle('wide',!!R&&TAB==='people');
  if(!R){app.innerHTML=vHome();return}
  const dd=R.start?diffD(todayStr(),R.start):null;
  if(TAB==='cars'||TAB==='people'){let n=0;while(n<3&&syncCars())n++;if(n)save()}
  const V={staff:vStaff,praise:vPraise,minutes:vMinutes,sched:vSched,theme:vTheme,venue:vVenue,speaker:vSpeaker,program:vProgram,tt:vTT,confirm:vConfirm,sup:vSup,chk:vChk,files:vFiles,acc:vAcc,people:vPeople,cars:vCars,grp:vGrp,rooms:vRooms,notice:vNotice}[TAB]||vPeople;
  app.innerHTML=`<div class="head no-print"><a class="btn" href="./">☰ 수련회 목록</a><h1 class="j">${esc(R.name)}</h1>${dd!=null?`<span class="dday">${dd>0?'D-'+dd:dd===0?'D-DAY':dd>=-(+R.nights)?'수련회 중':'끝났어요'}</span>`:''}<span class="hint">${esc(campRange()||'날짜 미정')}</span><button class="sm" data-act="campSet">⚙️ 설정·백업</button><span class="sync" id="sync">✔ 이 기기에 저장됨</span></div>
  <nav class="tabs">${TABS.map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${k===TAB?'on':''}">${l}</button>`).join('')}</nav>
  <div id="view">${V()}</div>`;
  for(const k in keep){const e=$(`[data-keep="${k}"]`);if(e){e.scrollLeft=keep[k][0];e.scrollTop=keep[k][1]}}
  if(key){let el=null;if(key[0]==='#')el=document.getElementById(key.slice(1));else{const[o,k]=key.slice(2).split('|');el=$$('[data-o]').find(e=>e.dataset.o===o&&e.dataset.k===k)}
    if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{if(selS!=null&&el.setSelectionRange)el.setSelectionRange(selS,selS)}catch(_){}}}
  afterRender()}
let rrT;function rr(){clearTimeout(rrT);rrT=setTimeout(render,0)}

function afterRender(){
  if(TAB==='minutes')updPrev();
  if(TAB==='files'||TAB==='acc')$$('img[data-fid]').forEach(async im=>{try{const f=await idb.get('files',im.dataset.fid);if(f)im.src=URL.createObjectURL(f.blob||f)}catch(e){}});
  if(TAB==='rooms')bindRooms();
  const fd=$('#feeD');if(fd)fd.ontoggle=()=>{SUB.feeOpen=fd.open};
  const rd=$('#rulesD');if(rd)rd.ontoggle=()=>{R.venue.rulesOpen=rd.open;save()};
  if(TAB==='people'){const q=$('#pq');if(q)filterPeople(q.value)}
  const pq=$('#poolQ');if(pq)filterPool(pq.value);
}

/* ---------- 회의록 ---------- */
const MK_RE=/^(\d+\.|\(\d+\)|\d+\)|[-•·])\s*/;
function outline(text){const cnt=[0,0,0,0,0,0,0,0];return String(text||'').split('\n').map(raw=>{if(!raw.trim())return{lv:-1};const ind=raw.match(/^[\t ]*/)[0].replace(/\t/g,'  ').length;const lv=Math.min(7,ind>>1);cnt[lv]++;for(let j=lv+1;j<8;j++)cnt[j]=0;const n=cnt[lv];return{lv,mk:lv===0?n+'.':lv===1?'('+n+')':lv===2?n+')':'-',t:raw.trim().replace(MK_RE,'')}})}
function minText(m){const L=outline(m.body);return `📝 ${m.title||'회의록'}\n일시: ${m.date||''}${m.place?'\n장소: '+m.place:''}\n참석: ${[...(m.att||[]).map(pn),m.etc].filter(Boolean).join(', ')}\n\n`+L.map(x=>x.lv<0?'':' '.repeat(x.lv)+x.mk+' '+x.t).join('\n')}
function updPrev(){const b=$('#mbody'),p=$('#mprev');if(!b||!p)return;const L=outline(b.value);p.innerHTML=L.length&&b.value.trim()?L.map(x=>x.lv<0?'<div>&nbsp;</div>':`<div class="l" style="padding-left:${x.lv*1.2}em"><span class="mk">${esc(x.mk)}</span><span>${esc(x.t)}</span></div>`).join(''):'<span class="hint">여기에 정리된 모양이 보여요</span>'}

/* ---------- 일정 (간트차트) ---------- */
function vSched(){
  const T=R.sched,td=todayStr(),rs=R.start,re=campEnd();
  let a=[td,...T.map(t=>t.start).filter(Boolean)].sort()[0];
  let b=[rs||addD(td,30),re,...T.map(t=>t.end||t.start).filter(Boolean)].filter(Boolean).sort().pop();
  a=addD(a,-2);b=addD(b,2);let n=Math.min(400,diffD(a,b)+1);const w=n>150?10:n>70?16:24,LW=170,W=n*w;
  let hd='',mo='';for(let i=0;i<n;i++){const d=addD(a,i),dw=new Date(toT(d)).getUTCDay(),dd=+d.slice(8);if(d.slice(0,7)!==mo){mo=d.slice(0,7);hd+=`<span class="gm" style="left:${i*w}px;top:0">${+d.slice(5,7)}월</span>`}if(w>=16||dw===1)hd+=`<span class="gd ${dw===0||dw===6?'we':''}" style="left:${i*w}px;width:${w}px;top:18px">${dd}</span>`}
  const over=()=>{let s='';const ti=diffD(a,td);if(ti>=0&&ti<n)s+=`<div class="gtoday" style="left:${ti*w+w/2}px" title="오늘"></div>`;if(rs){const ci=diffD(a,rs);s+=`<div class="gcamp" style="left:${ci*w}px;width:${(diffD(rs,re)+1)*w}px" title="수련회"></div>`}return s};
  const bg=`background-image:linear-gradient(to right,#f1e9da 1px,transparent 1px);background-size:${w}px 100%`;
  const rows=T.map((t,i)=>{let bar='';if(t.start){const s=Math.max(0,diffD(a,t.start)),e=Math.min(n-1,diffD(a,t.end&&t.end>=t.start?t.end:t.start));const who=(t.who||[]).map(pn).join(', ');bar=`<div class="gbar ${t.done?'done':''}" style="left:${s*w}px;width:${Math.max(w,(e-s+1)*w)}px;background:${PAL[i%PAL.length]}" title="${esc(t.name+' '+fmtD(t.start)+'~'+fmtD(t.end||t.start)+(who?' · '+who:''))}">${t.done?'✔ ':''}${esc(t.name)}${who?' · '+esc(who):''}</div>`}
    return `<div class="grow"><div class="glab" title="${esc(t.name)}">${t.done?'✔ ':''}${esc(t.name||'(이름 없음)')}</div><div class="gtrack" style="width:${W}px;${bg}">${over()}${bar}</div></div>`}).join('');
  const cands=prepList().length?prepList():R.people;
  return `<div class="card"><div class="row"><h2 style="margin:0">📅 준비 일정</h2><span class="hint">${rs?`수련회 ${esc(campRange())} · <b style="color:var(--accent)">${diffD(td,rs)>=0?'D-'+diffD(td,rs):'지남'}</b>`:'⚙️ 설정에서 수련회 날짜를 정하면 차트에 노란 띠로 보여요'}</span><span class="sp"></span><button data-act="schedTpl">✨ 기본 일정 넣기</button><button class="pri" data-act="schedAdd">+ 할 일</button></div>
  <div class="gantt hs" data-keep="gantt" style="margin-top:10px"><div class="gin" style="width:${LW+W}px"><div class="grow" style="min-height:38px"><div class="glab"><b>할 일</b></div><div class="gtrack ghd" style="width:${W}px">${hd}</div></div>${rows||`<div class="grow"><div class="glab hint">할 일을 추가해요</div><div class="gtrack" style="width:${W}px;${bg}">${over()}</div></div>`}</div></div>
  <p class="hint">빨간 선 = 오늘, 노란 띠 = 수련회 기간</p></div>

/* ---------- 장소탐색 (ICE) ---------- */
function densInfo(d){if(d==null||!isFinite(d))return['-',null,''];if(d<=1.2)return['매우 쾌적',5,'b-ok'];if(d<=1.5)return['추천',5,'b-ok'];if(d<=2)return['적정',4,'b-mid'];if(d<=2.5)return['가능하지만 불편',2,'b-mid'];if(d<=3)return['비추천',1,'b-no'];return['너무 좁아요',0,'b-no']}
/* 📏 점수 기준: 구간(부터~까지)마다 별 몇 개 */
const RULE_DEF={
  fixed:{name:'고정비',sub:'예배당·다목적실 등 공용공간 대여비 총합',unit:'원',rows:[[0,300000,5],[300000,600000,4],[600000,1000000,3],[1000000,1500000,2],[1500000,null,1]]},
  loc:{name:'이동시간',sub:'교회 → 장소',unit:'분',rows:[[0,60,5],[60,90,4],[90,120,3],[120,180,2],[180,null,1]]},
  lodge:{name:'숙소비',sub:'방 금액×개수 총합',unit:'원',rows:[[0,1500000,5],[1500000,2500000,4],[2500000,3500000,3],[3500000,5000000,2],[5000000,null,1]]},
  meal:{name:'식대 (1인당)',sub:'1인당 식대 금액 (수련회 전체 끼니 합)',unit:'원',rows:[[0,25000,5],[25000,35000,4],[35000,45000,3],[45000,60000,2],[60000,null,1]]},
  dens:{name:'예배당 평당인원',sub:'예상참석인원 ÷ 예배당 면적(평)',unit:'명',rows:[[0,1.2,5],[1.2,1.5,5],[1.5,2,4],[2,2.5,2],[2.5,3,1],[3,null,0]]}};
const RULE_KEYS=Object.keys(RULE_DEF);
function ruleScore(key,x){if(x==null||x===''||!isFinite(x))return null;const L=(R.venue.rules[key]||[]).filter(r=>r.from!=null||r.to!=null);
  const hit=L.find(r=>(r.from==null||x>=r.from)&&(r.to==null||x<=r.to));if(hit)return +hit.s||0;
  const below=L.filter(r=>r.from!=null&&x>=r.from).sort((a,b)=>b.from-a.from)[0];return below?+below.s||0:null}
const nz=v=>v===''||v==null?null:+v;
function expN(){const V=R.venue,N=nz(V.expected);return{N,NL:nz(V.expLodge)??N,NM:nz(V.expMeal)??N}}
function vCalc(v){const{N,NL,NM}=expN(),rooms=(v.rooms||[]).filter(r=>r.price||r.count||r.size);
  const lodge=rooms.length?rooms.reduce((s,r)=>s+(+r.price||0)*(+r.count||0),0):null,cap=rooms.reduce((s,r)=>s+(+r.size||0)*(+r.count||0),0),nrooms=rooms.reduce((s,r)=>s+(+r.count||0),0);
  const meal=v.mealPrice!=null&&v.mealPrice!==''&&NM!=null?(+v.mealPrice)*NM:null;
  const dens=v.area>0&&N?N/v.area:null,tot=(+v.fixed||0)+(lodge||0)+(meal||0);
  let fit=null;if(cap&&NL){const r=cap/NL;fit=r<1?['부족',`${NL-cap}명 모자라요`,'b-no']:r<=1.15?['적당',`${cap-NL}명 남아요`,'b-ok']:['여유',`${cap-NL}명 남아요`,'b-mid']}
  return{N,NL,NM,lodge,cap,nrooms,meal,dens,tot,per:N?tot/N:0,fit}}
function critList(){return[...RULE_KEYS.map(k=>({id:k,name:RULE_DEF[k].name,rule:1})),...R.venue.crit]}
function scores(){const C=critList();const out=R.venue.list.map(v=>{const c=vCalc(v);
    const raw={fixed:nz(v.fixed),loc:nz(v.travel),lodge:c.lodge,meal:nz(v.mealPrice),dens:c.dens};const sc={};
    C.forEach(k=>{sc[k.id]=k.rule?ruleScore(k.id,raw[k.id]):((v.sc||{})[k.id]!=null&&(v.sc||{})[k.id]!==''?+v.sc[k.id]:null)});
    const wsum=C.reduce((s,k)=>s+(+R.venue.w[k.id]||0),0)||1;
    const ice=C.reduce((s,k)=>s+(sc[k.id]||0),0),plus=C.reduce((s,k)=>s+(sc[k.id]||0)*(+R.venue.w[k.id]||0),0)/wsum;return{v,sc,ice,plus,c,max:C.length*5}});
  const rank=key=>{const s=out.map(o=>o[key]).sort((a,b)=>b-a);out.forEach(o=>o[key+'R']=s.indexOf(o[key])+1)};rank('ice');rank('plus');return out}
const starTxt=n=>n==null?'<span class="hint">-</span>':`<span class="sv" title="${n}점">${'★'.repeat(Math.round(n))}<i>${'★'.repeat(5-Math.round(n))}</i></span>`;
const fmtN=(x,u)=>x==null||x===''?'∞':u==='원'?won(x):String(x);
const wBadge=w=>`<span class="wsum badge ${w===100?'b-ok':'b-no'}" style="font-size:15px;padding:3px 10px">${w===100?'✔ 가중치 합계 100%':`⚠️ 가중치 합계 ${w}% · ${w<100?(100-w)+'% 모자라요':(w-100)+'% 넘어요'}`}</span>`;
const venueTxt=v=>(v.name||'(이름 없음)')+(v.addr?' ('+v.addr+')':'');
function setFinal(id){const old=R.venue.list.find(x=>x.id===R.venue.finalId);R.venue.finalId=id||'';const v=R.venue.list.find(x=>x.id===id);
  if(v){R.conf.place.v='';R.conf.place.ok=true;toast(`📌 ${v.name||'장소'}로 최종확정했어요 · [확정사항]에 들어갔어요`)}
  else if(old){R.conf.place.ok=false;toast('최종확정을 취소했어요')}
  save();render()}
function vVenue(){const V=R.venue,C=critList(),S=scores(),wsum=C.reduce((s,k)=>s+(+V.w[k.id]||0),0),E=expN(),SC={};S.forEach(o=>SC[o.v.id]=o);
  const ruleBox=k=>{const D=RULE_DEF[k],L=V.rules[k];return `<div class="rbox"><div class="row"><b class="j" style="font-size:16px">${D.name}</b><span class="hint">${D.sub} · 단위 ${D.unit}</span></div>
    <table class="t rt">${L.map(r=>{const s='venue.rules.'+k+'#'+r.id;return `<tr><td>${inp(s,'from',{n:1,rr:1,ph:'0'})}</td><td class="hint">부터</td><td>${inp(s,'to',{n:1,rr:1,ph:'끝없음'})}</td><td class="hint">까지</td><td class="stars">${[1,2,3,4,5].map(n=>`<button data-act="ruleStar" data-k="${k}" data-v="${r.id}" data-n="${n}" class="${n<=(+r.s||0)?'on':''}">★</button>`).join('')}</td><td><button class="x" data-act="ruleDel" data-k="${k}" data-v="${r.id}" title="구간 빼기">×</button></td></tr>`}).join('')}</table>
    <div class="row"><button class="sm" data-act="ruleAdd" data-k="${k}">+ 구간</button><span class="hint">${D.unit==='원'?'예) 300000 부터 600000 까지 ★★★★':'예) 60 부터 90 까지 ★★★★'} · 칸을 비우면 ‘처음부터/끝없음’</span></div></div>`};
  const card=v=>{const c=vCalc(v),d=densInfo(c.dens),s='venue.list#'+v.id,o=SC[v.id]||{sc:{}},sc=o.sc;const line=(k,txt)=>`<div class="row sline"><span>${txt}</span><span class="sp"></span>${starTxt(sc[k])}</div>`;
   const fin=V.finalId===v.id;return `<div class="box ${fin?'vfinal':''}">${fin?'<div class="vfin-tag">✅ 최종확정 장소</div>':''}<div class="bh">${inp(s,'name',{ph:'장소 이름',rr:1,st:'font-weight:600'})}<span class="bt"><span class="badge ${o.iceR===1?'b-ok':''}" style="font-size:14px">ICE <b>${o.ice??0}</b>/${o.max} · ${o.iceR||'-'}위</span><button class="x" data-act="del" data-c="venue.list" data-v="${v.id}">🗑</button></span></div>
   <button class="sm ${fin?'ok':''}" data-act="vFinal" data-v="${v.id}" style="width:100%;justify-content:center;margin-bottom:6px">${fin?'✅ 최종확정됨 (누르면 취소)':'📌 이 장소로 최종확정'}</button>
   <div class="f2 two"><label class="fld">고정비 (공용공간 총합, 원)${inp(s,'fixed',{n:1,rr:1,ph:'예배당·다목적실 등'})}</label><label class="fld">이동시간 (분)${inp(s,'travel',{n:1,rr:1,ph:'교회→장소'})}</label></div>

   <div class="sec"><b>🛏️ 숙소 방</b><span class="hint"> 몇 인용 방, 1실 금액, 개수</span>
    ${(v.rooms||[]).map(r=>{const rs=`venue.list#${v.id}>rooms#${r.id}`;return `<div class="row room-r">${inp(rs,'size',{n:1,rr:1,st:'width:50px;flex:none',ph:'인원'})}<span>인용</span>${inp(rs,'price',{n:1,rr:1,st:'flex:1 1 90px;min-width:90px',ph:'1실 금액'})}<span>원 ×</span>${inp(rs,'count',{n:1,rr:1,st:'width:46px;flex:none',ph:'개'})}<span>개</span><span class="hint" style="margin-left:auto">=${won((+r.price||0)*(+r.count||0))}</span><button class="x" data-act="vroomDel" data-v="${v.id}" data-r="${r.id}">×</button></div>`}).join('')}
    <button class="sm" data-act="vroomAdd" data-v="${v.id}">+ 방 종류 추가</button>
    ${line('lodge',`총 숙소비 <b>${c.lodge!=null?won(c.lodge)+'원':'-'}</b>${c.nrooms?` <span class="hint">(방 ${c.nrooms}개)</span>`:''}`)}
    <div class="hint" style="font-size:14px">숙소 수용 <b>${c.cap||0}</b>명 / 예상숙박 <b>${c.NL??'?'}</b>명 ${c.fit?`<span class="badge ${c.fit[2]}">${c.fit[0]}</span> ${c.fit[1]}`:''}</div></div>
   <div class="sec"><div class="row"><b>🍚 식대</b>${inp(s,'mealPrice',{n:1,rr:1,st:'width:110px',ph:'1인당 금액'})}<span>원 × ${c.NM??'?'}명</span></div><span class="hint">1인당 수련회 전체 끼니 합계</span>${line('meal',`1인당 <b>${v.mealPrice!=null&&v.mealPrice!==''?won(v.mealPrice)+'원':'-'}</b> · 총 식대 <b>${c.meal!=null?won(c.meal)+'원':'-'}</b>`)}</div>
   <div class="sec"><div class="row"><b>⛪ 예배당</b>${inp(s,'area',{n:1,rr:1,st:'width:80px',ph:'면적'})}<span>평</span></div>${line('dens',`평당 <b>${c.dens==null?'-':c.dens.toFixed(2)}</b>명 ${c.dens!=null?`<span class="badge ${d[2]}">${d[0]}</span>`:''}`)}</div>
   ${V.crit.length?`<div class="sec">${V.crit.map(k=>{const x=+((v.sc||{})[k.id]||0);return `<div class="row sline"><span>${esc(k.name)}</span><span class="sp"></span><span class="stars">${[1,2,3,4,5].map(n=>`<button data-act="star" data-v="${v.id}" data-c="${k.id}" data-n="${n}" class="${n<=x?'on':''}">★</button>`).join('')}</span></div>`}).join('')}</div>`:''}

  return `<div class="card"><div class="row"><h2 style="margin:0">🏕️ 장소탐색</h2><span class="sp"></span><a class="btn pri" href="../retreat/" target="_blank">🔎 수련회 장소찾기 ↗</a></div>

  <p class="hint" style="margin:6px 0 0">참석인원에 ${R.people.length}명 등록됨 · 예상참석 → 예배당 평당인원, 예상숙박 → 숙소 수용(부족·적당·여유), 예상식사 → 식대</p></div>

  ${V.list.length?`<div class="card"><div class="row"><h2 style="margin:0">🏆 의사결정 (ICE / ICE+)</h2><span class="sp"></span>${wBadge(wsum)}</div>
   <div class="row" style="margin:8px 0;padding:8px;border-radius:12px;background:${V.list.find(x=>x.id===V.finalId)?'#dff3e4':'#fff6d8'}"><b class="j" style="font-size:17px">📌 최종확정 장소</b><select id="vFinalSel" style="min-width:180px"><option value="">— 아직 정하지 않았어요 —</option>${S.slice().sort((a,b)=>a.plusR-b.plusR).map(o=>`<option value="${o.v.id}"${V.finalId===o.v.id?' selected':''}>${esc(o.v.name||'(이름 없음)')} · ICE+ ${o.plusR}위</option>`).join('')}</select><span class="hint">고르면 [확정사항]의 ‘장소’에 들어가고 ✔ 확정돼요</span></div>

function vSpeaker(){const L=R.speakers,cnt={};L.forEach(s=>cnt[s.status||'후보']=(cnt[s.status||'후보']||0)+1);
  const cls=s=>s==='확정'||s==='수락'?'b-ok':s==='거절'?'b-no':s==='후보'?'':'b-mid';
  const F=R.spkFinal,fs=(k,l)=>`<label class="fld">${l}<select data-o="spkFinal" data-k="${k}" data-rr><option value="">— 아직 —</option>${L.filter(s=>s.status!=='거절'||F[k]===s.id).map(s=>`<option value="${s.id}"${F[k]===s.id?' selected':''}>${esc(s.name||'(이름 없음)')}${s.org?' · '+esc(s.org):''} (${esc(s.status||'후보')})</option>`).join('')}</select></label>`;
  return `<div class="card" style="border-color:var(--green)"><h2>✅ 확정 강사</h2><div class="f2">${fs('preacher','⛪ 집회설교자')}${fs('s1','🎤 강사1')}${fs('s2','🎤 강사2')}</div><p class="hint" style="margin:6px 0 0">고르면 그 강사는 ‘확정’ 상태가 되고 [확정사항]의 집회설교자·강사1·강사2에 들어가요. 아래 표에 후보를 먼저 추가해 주세요.</p></div>
  <div class="card"><div class="row"><h2 style="margin:0">🎤 강사 섭외 현황</h2><span class="sp"></span>${SPK_ST.filter(s=>cnt[s]).map(s=>`<span class="badge ${cls(s)}">${s} ${cnt[s]}</span>`).join(' ')}<button class="pri" data-act="add" data-c="speakers">+ 강사 후보</button></div>
  ${L.length?`<div class="hs" style="margin-top:10px"><table class="t"><tr><th>이름</th><th>맡을 순서</th><th>소속</th><th>연락처</th><th>주제·분야</th><th>사례비</th><th>상태</th><th>가능 일정</th><th style="min-width:160px">메모</th><th></th></tr>${L.map(s=>{const k='speakers#'+s.id;return `<tr><td>${inp(k,'name',{st:'min-width:80px'})}</td><td>${inp(k,'role',{ph:'예) 집회 설교, 특강',st:'min-width:110px'})}</td><td>${inp(k,'org')}</td><td>${inp(k,'phone',{st:'min-width:110px'})}</td><td>${inp(k,'topic')}</td><td>${inp(k,'fee',{n:1,st:'width:90px'})}</td><td>${sel(k,'status',SPK_ST,{rr:1})} </td><td>${inp(k,'avail',{st:'min-width:90px'})}</td><td>${inp(k,'memo')}</td><td><button class="x" data-act="del" data-c="speakers" data-v="${s.id}">🗑</button></td></tr>`}).join('')}</table></div>`:'<div class="empty" style="margin-top:10px">강사 후보를 추가해서 섭외 상황을 정리해요</div>'}</div>`}

/* ---------- 프로그램 ---------- */
function vProgram(){const cands=prepList().length?prepList():R.people;

  ${R.programs.length?`<div class="grid">${R.programs.map(p=>{const k='programs#'+p.id;return `<div class="box"><div class="bh">${inp(k,'name',{ph:'프로그램 이름 (예: 레크리에이션)',st:'font-weight:600'})}<button class="x" data-act="del" data-c="programs" data-v="${p.id}" title="지우기">🗑</button></div>
   <div class="f2 two"><label class="fld">언제${inp(k,'when',{ph:'예) 1일차 저녁'})}</label><label class="fld">소요 시간${inp(k,'dur',{ph:'예) 90분'})}</label><label class="fld">장소${inp(k,'place')}</label><label class="fld">예산 (원)${inp(k,'budget',{n:1})}</label></div>

   <label class="fld">필요한 것${ta(k,'need','준비물, 음향, 인원 등',2)}</label></div>`}).join('')}</div>`:'<div class="card"><div class="empty">프로그램을 추가해 내용을 정리해요</div></div>'}`}

/* ---------- 시간표 ---------- */
function slots(){const toM=s=>{const[h,m]=String(s).split(':').map(Number);return h*60+(m||0)};let f=toM(R.tt.from),t=toM(R.tt.to);if(t<=f)t=f+60*18;const L=[];for(let m=f;m<t;m+=30)L.push(pad(Math.floor(m/60)%24)+':'+pad(m%60));return L}
function vTT(){const days=(+R.nights||0)+1,S=slots(),C=R.tt.cells;
  const head=Array.from({length:days},(_,d)=>`<th>${d+1}일차${R.start?' · '+fmtD(addD(R.start,d)):''}</th>`).join('');
  const times=Array.from({length:S.length+1},(_,i)=>{const m=S[0].split(':').map(Number);const x=m[0]*60+m[1]+i*30;return pad(Math.floor(x/60)%24)+':'+pad(x%60)});
  const body=S.map((s,i)=>`<tr><td class="tm ${s.endsWith(':00')?'h':''}">${s}~${times[i+1]}</td>${Array.from({length:days},(_,d)=>{const v=C[d+'-'+s]||'',pv=i?C[d+'-'+S[i-1]]||'':'';const cont=v&&v===pv;return `<td class="${cont?'cont':''}" style="${v?`background:hsl(${hue(v)},70%,90%)`:''}"><input data-o="tt.cells" data-k="${d}-${s}" data-rr list="progList" value="${esc(v)}"></td>`}).join('')}</tr>`).join('');
  return `<datalist id="progList">${[...new Set([...R.programs.map(p=>p.name).filter(Boolean),'기상','아침 식사','점심 식사','저녁 식사','간식','자유시간','개회예배','집회','소그룹 나눔','레크리에이션','세면·정리','취침','폐회예배','이동','출발','도착','QT'])].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <div class="card"><div class="row"><h2 style="margin:0">⏰ 시간표</h2><span class="sp"></span><button data-act="ttCopy">📋 텍스트로 복사</button><button data-act="print">🖨️ 인쇄</button></div>
   <div class="row" style="margin-top:8px"><label class="fld">시작일${inp('.','start',{type:'date',rr:1})}</label><label class="fld">기간${sel('.','nights',[0,1,2,3,4,5].map(n=>[n,n+'박 '+(n+1)+'일']),{rr:1})}</label><label class="fld">하루 시작${inp('tt','from',{type:'time',rr:1})}</label><label class="fld">하루 끝${inp('tt','to',{type:'time',rr:1})}</label></div>
   <p class="hint">30분 단위 칸에 일정을 적어요. 이어지는 칸에 같은 내용을 적으면 한 덩어리로 묶여 보여요. [프로그램]에 적은 이름도 골라 쓸 수 있어요.</p>
   <div class="hs" data-keep="tt"><table class="tt"><tr><th>시간</th>${head}</tr>${body}</table></div></div>`}
function ttText(){const days=(+R.nights||0)+1,S=slots(),C=R.tt.cells;let out=`⏰ ${R.name} 시간표\n`;for(let d=0;d<days;d++){out+=`\n[${d+1}일차${R.start?' '+fmtD(addD(R.start,d)):''}]\n`;let i=0;while(i<S.length){const v=C[d+'-'+S[i]];if(!v){i++;continue}let j=i;while(j+1<S.length&&C[d+'-'+S[j+1]]===v)j++;const e=S[j].split(':').map(Number),em=e[0]*60+e[1]+30;out+=`${S[i]}~${pad(Math.floor(em/60)%24)}:${pad(em%60)} ${v}\n`;i=j+1}}return out}

/* ---------- 확정사항 ---------- */
const CONF=[['sched','일정'],['place','장소'],['theme','주제'],['verse','주제말씀'],['song','주제찬양'],['preacher','집회설교자'],['speaker1','강사1'],['speaker2','강사2'],['tt','시간표'],['praise','찬양팀'],['staff','준비인원'],['snack','야식']];
const CONF_FROM={sched:['campSet','⚙️ 설정'],place:['venue','🏕️ 장소탐색'],theme:['theme','💡 주제정하기'],verse:['theme','💡 주제정하기'],song:['theme','💡 주제정하기'],preacher:['speaker','🎤 강사탐색'],speaker1:['speaker','🎤 강사탐색'],speaker2:['speaker','🎤 강사탐색'],tt:['tt','⏰ 시간표'],praise:['praise','🎸 찬양팀'],staff:['staff','👥 준비인원']};
const spkTxt=id=>{const s=R.speakers.find(x=>x.id===id);return s?(s.name||'(이름 없음)')+(s.org?' ('+s.org+')':'')+(s.topic?' · '+s.topic:''):''};
function snackText(){const D=(R.conf.snack&&R.conf.snack.days)||{};return Array.from({length:(+R.nights||0)+1},(_,d)=>D[d]?`${d+1}일차 야식: ${D[d]}`:'').filter(Boolean).join(' / ')}
function confVal(k){if(k==='snack')return snackText();return R.conf[k].v||(k==='place'&&!R.venue.finalId?'':confSrc(k))}
function confSrc(k){const F=R.spkFinal||{};
  switch(k){case'sched':return campRange();case'place':{const f=R.venue.list.find(x=>x.id===R.venue.finalId);if(f)return venueTxt(f);const S=scores().sort((a,b)=>a.plusR-b.plusR);return S[0]?venueTxt(S[0].v)+' (ICE+ 1위 · 아직 최종확정 전)':''}
   case'theme':return R.theme.title||'';case'verse':return[R.theme.verse,R.theme.verseText].filter(Boolean).join(' — ');case'song':return R.theme.song||'';
   case'preacher':return spkTxt(F.preacher);case'speaker1':return spkTxt(F.s1);case'speaker2':return spkTxt(F.s2);
   case'tt':return Object.values(R.tt.cells).some(Boolean)?ttText().split('\n').slice(1).join('\n').trim().split(/\n+(?=\[)/).map(b=>b.trim()).filter(b=>b.includes('\n')).join('\n\n'):'';
   case'praise':return R.cfg.parts.map(x=>{const n=R.people.filter(p=>p.praise&&(p.parts||[]).includes(x));return n.length?x+': '+n.map(p=>p.name).join(', '):''}).filter(Boolean).join('\n');
   case'staff':{const L=prepList();return[['min','사역자'],['staff','준비인원']].map(([t,l])=>{const a=L.filter(p=>p.prep===t);return a.length?l+': '+a.map(p=>`${p.name}(${p.role||l}${p.duty?' · '+p.duty:''})`).join(', '):''}).filter(Boolean).join('\n')}
   default:return''}}
function vConfirm(){const n=CONF.filter(([k])=>R.conf[k].ok).length,days=(+R.nights||0)+1,D=(R.conf.snack.days=R.conf.snack.days||{});
  const row=([k,l])=>{const c=R.conf[k],src=k==='snack'?'':confSrc(k),own=!!c.v,fr=CONF_FROM[k];
    const body=k==='snack'?`<div class="snk">${Array.from({length:days},(_,d)=>`<label class="row"><span class="badge">${d+1}일차 야식</span>${inp('conf.snack>days',String(d),{ph:'예) 치킨·피자',st:'flex:1'})}</label>`).join('')}</div>`
      :`<textarea data-o="conf.${k}" data-k="v" data-rr rows="${k==='tt'?Math.min(14,Math.max(3,(own?c.v:src).split('\n').length)):/praise|staff/.test(k)?3:1}" placeholder="${esc(fr?fr[1]+'에서 정하면 저절로 들어와요':'직접 적어요')}">${esc(own?c.v:src)}</textarea>
       <div class="hint" style="font-size:12px">${own?`✏️ 직접 고친 내용${src?` · <a href="#" data-act="confAuto" data-v="${k}">🔗 ${esc(fr[1])} 내용으로 되돌리기</a>`:''}`:src?`🔗 ${esc(fr[1])}에서 자동으로 들어왔어요`:fr?`${esc(fr[1])}에서 정하면 저절로 들어와요`:''}${fr?` · <a href="#" data-act="${fr[0]==='campSet'?'campSet':'tab'}" data-v="${fr[0]}">가기 →</a>`:''}</div>`;
    return `<b>${l}</b><div>${body}</div><div class="row" style="gap:4px;padding-top:3px"><label class="chip tog ${c.ok?'on':''}"><input type="checkbox" data-o="conf.${k}" data-k="ok" data-rr ${c.ok?'checked':''} style="display:none">✔ 확정</label></div>`};
  return `<div class="card"><div class="row"><h2 style="margin:0">✅ 확정사항</h2><span class="badge ${n===CONF.length?'b-ok':'b-mid'}">${n}/${CONF.length} 확정</span><span class="sp"></span><button class="pri" data-act="confCopy">📋 카톡용 복사</button></div>
  <p class="hint">설정·장소탐색·주제정하기·강사탐색·시간표·찬양팀·준비인원에서 정한 내용이 저절로 들어와요. 칸을 직접 고치면 그 내용이 우선이고, ‘되돌리기’로 다시 자동으로 바꿀 수 있어요. 다 정해지면 ✔ 확정을 눌러요.</p>
  <div class="kv" style="margin-top:8px">${CONF.map(row).join('')}</div></div>`}

/* ---------- 준비물 ---------- */
function vSup(){const L=R.sup,f=SUB.supF||'all',td=todayStr(),cands=prepList().length?prepList():R.people;
  const fin=s=>s.method&&(+s.stage||0)>=METHODS[s.method].length-1;
  const done=L.filter(fin).length;
  const rows=L.filter(s=>f==='all'||(f==='todo'?!fin(s):f==='done'?fin(s):s.method===f));
  return `<div class="card"><div class="row"><h2 style="margin:0">📦 준비물</h2><span class="badge ${done===L.length&&L.length?'b-ok':'b-mid'}">준비완료 ${done}/${L.length}</span><span class="sp"></span>
   <a class="btn" href="../image/" target="_blank">🏷️ 명찰 시안 만들기 ↗</a><a class="btn" href="../image/" target="_blank">🎌 현수막 시안 만들기 ↗</a><button class="pri" data-act="supAdd">+ 준비물</button></div>
   <div class="prog" style="margin:8px 0"><i style="width:${L.length?done/L.length*100:0}%"></i></div>
   <div class="row">${[['all','전체'],['todo','준비 중'],['done','준비완료'],...Object.keys(METHODS).map(m=>[m,m])].map(([k,l])=>`<span class="chip tog ${f===k?'on':''}" data-act="supF" data-v="${k}">${l}</span>`).join('')}</div>
  ${rows.length?`<div class="hs" style="margin-top:8px"><table class="t"><tr><th style="min-width:130px">준비물</th><th>수량</th><th>준비방법</th><th style="min-width:250px">준비도 (단계를 눌러 체크)</th><th>언제까지</th><th>담당</th><th style="min-width:120px">둔 곳</th><th>메모</th><th></th></tr>
   ${rows.map(s=>{const k='sup#'+s.id,st=s.method?METHODS[s.method]:[],cur=+s.stage||0,late=s.due&&s.due<td&&!fin(s),dd=s.due?diffD(td,s.due):null;
    return `<tr class="${late?'late':''}"><td>${inp(k,'name',{ph:'예) 명찰',rr:1})}${/명찰/.test(s.name||'')?'<a class="hint" href="../image/" target="_blank">🏷️ 명찰 시안 ↗</a>':''}${/현수막/.test(s.name||'')?'<a class="hint" href="../image/" target="_blank">🎌 현수막 시안 ↗</a>':''}</td><td>${inp(k,'qty',{st:'width:60px'})}</td><td>${sel(k,'method',Object.keys(METHODS),{rr:1,blank:'— 선택 —'})}</td>

/* ---------- 참석인원 ---------- */
const PF=[['name','이름'],['gender','성별'],['age','나이'],['org','소속'],['addr','사는 곳'],['phone','핸드폰번호'],['ins','보험가입'],['inT','들어오는 시간'],['outT','나가는 시간']];
/* 💰 회비 기준: 위에서부터 처음 맞는 기준의 금액, 없으면 기본 회비. 사람마다 직접 금액을 적으면 그 금액 */
const FEE_F=[['org','소속'],['age','나이'],['gender','성별'],['prep','구분'],['praise','찬양팀'],['addr','사는 곳']];
function ageNum(a){const n=parseInt(String(a||'').replace(/[^0-9]/g,''));if(!n)return null;if(n>=1900){const y=+(R.start||todayStr()).slice(0,4);return y-n+1}return n}
function feeRuleHit(r,p){const v=String(r.value||'').trim();switch(r.field){
  case'org':case'addr':{const x=String(p[r.field]||'');const ks=v.split(/[,，]/).map(z=>z.trim()).filter(Boolean);return ks.length?ks.some(k=>x.includes(k)):false}
  case'age':{const a=ageNum(p.age);if(a==null)return false;return(r.min==null||r.min===''||a>=+r.min)&&(r.max==null||r.max===''||a<=+r.max)}
  case'gender':return!!v&&p.gender===v;
  case'prep':return v==='일반'?!p.prep:v==='사역자'?p.prep==='min':v==='준비인원'?p.prep==='staff':v==='사역자·준비인원'?!!p.prep:false;

function bindRooms(){$$('.room .rhead').forEach(h=>{h.onpointerdown=e=>{if(e.target.closest('button'))return;const box=h.parentElement,fl=box.parentElement,r=R.rooms.find(x=>x.id===box.dataset.room);if(!r)return;e.preventDefault();h.setPointerCapture(e.pointerId);

  h.onpointermove=ev=>{const x=Math.max(0,Math.round((ox+ev.clientX-sx)/10)*10),y=Math.max(24,Math.round((oy+ev.clientY-sy)/10)*10);box.style.left=x+'px';box.style.top=y+'px';r.x=x;r.y=y;const need=y+box.offsetHeight+20;if(need>fl.offsetHeight)fl.style.height=need+'px'};

    <div class="row" style="margin-top:10px"><button class="pri" id="eGo">저장</button><button data-close>취소</button><span class="sp"></span><button class="danger" id="eDel">방 지우기</button></div>`);
    m.querySelector('#eGo').onclick=()=>{Object.assign(r,{building:m.querySelector('#eB').value.trim()||'건물',floor:m.querySelector('#eF').value.trim(),name:m.querySelector('#eN').value.trim()||r.name,cap:+m.querySelector('#eC').value||null,gender:m.querySelector('#eG').value});save();m.remove();render()};
    m.querySelector('#eDel').onclick=()=>{if(!confirm(`${r.name}을(를) 지울까요? 배정된 ${(r.members||[]).length}명은 미배정으로 돌아가요.`))return;R.rooms=R.rooms.filter(x=>x.id!==r.id);save();m.remove();render()}},
  roomCopy:()=>copy(`🛏️ ${R.name} 방 배정\n`+R.rooms.map(r=>`\n[${r.building||''} ${r.floor||''} ${r.name}] ${(r.members||[]).length}/${r.cap||'?'}명${r.captain?' · 방장 '+pn(r.captain):''}\n`+(r.members||[]).map(pn).join(', ')).join('\n')),
};
function fpath(id){const L=[];let c=id;while(c){const f=R.folders.find(x=>x.id===c);if(!f)break;L.unshift(f.name);c=f.parent}return L.join(' › ')}
function purge(id){R.people=R.people.filter(p=>p.id!==id);const rm=a=>(a||[]).filter(x=>x!==id);
  R.sched.forEach(t=>t.who=rm(t.who));R.programs.forEach(t=>t.who=rm(t.who));R.minutes.forEach(m=>m.att=rm(m.att));
  R.cars.list.forEach(c=>{c.members=rm(c.members);if(c.driver===id)c.driver=''});R.grp.list.forEach(g=>{g.members=rm(g.members);g.staff=rm(g.staff);if(g.leader===id)g.leader='';if(g.roles)delete g.roles[id]});
  R.rooms.forEach(r=>{r.members=rm(r.members);if(r.captain===id)r.captain=''});R.sup.forEach(s=>{if(s.owner===id)s.owner=''});R.chk.forEach(c=>{if(c.owner===id)c.owner=''})}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('📋 복사했어요. 카톡에 붙여넣으세요')}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('📋 복사했어요')}catch(_){toast('복사하지 못했어요')}x.remove()}}
function indent(dir){const b=$('#mbody');if(!b)return;const v=b.value,s=b.selectionStart,e=b.selectionEnd;const ls=v.lastIndexOf('\n',s-1)+1;let le=v.indexOf('\n',Math.max(s,e-1));if(le<0)le=v.length;
  const lines=v.slice(ls,le).split('\n');let d0=0,dT=0;const out=lines.map((l,i)=>{if(dir>0){if(i===0)d0=2;dT+=2;return '  '+l}const m=l.match(/^( {1,2}|\t)/);if(!m)return l;if(i===0)d0=-m[0].length;dT-=m[0].length;return l.slice(m[0].length)});
  b.value=v.slice(0,ls)+out.join('\n')+v.slice(le);b.selectionStart=Math.max(ls,s+d0);b.selectionEnd=Math.max(ls,e+dT);b.dispatchEvent(new Event('input',{bubbles:true}));b.focus()}

/* 백업 */
async function backup(){toast('백업 파일을 만드는 중…');const files={};for(const f of R.files){try{const x=await idb.get('files',f.id);if(x){const b=x.blob||x;files[f.id]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}}catch(_){}}
  dl(new Blob([JSON.stringify({app:'camp-pack',v:1,camp:R,files})],{type:'application/json'}),`${R.name}_백업_${todayStr()}.json`)}
async function restore(file){try{const d=JSON.parse(await file.text());if(d.app!=='camp-pack'||!d.camp)throw 0;const c=fill(d.camp);const old=await idb.get('camps',c.id);
  if(old&&!confirm(`‘${old.name}’이(가) 이미 있어요. 백업 내용으로 덮어쓸까요? (취소하면 새 수련회로 추가해요)`)){const map={};c.id=uid();c.name+=' (백업)';for(const f of c.files){const n=uid();map[f.id]=n;f.id=n}c.acc.items.forEach(x=>{if(x.rcp)x.rcp=map[x.rcp]});const F={};for(const k in d.files)F[map[k]||k]=d.files[k];d.files=F}
  for(const id in d.files){const b=await (await fetch(d.files[id])).blob();await idb.put('files',id,{blob:b})}await idb.put('camps',c.id,c);location.href='./?c='+c.id}catch(e){toast('수련회 백업 파일이 아니에요')}}

/* 엑셀·CSV 불러오기 */
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const GUESS={name:/^(이름|성명|성함|name)|이름|성명/i,gender:/성별/,age:/나이|연령|생년|출생|학년/,org:/소속|교구|셀|목장|부서|학교|공동체/,addr:/사는|주소|거주|지역|동네/,phone:/연락처|전화|핸드폰|휴대폰|폰|phone/i,ins:/보험/,inT:/들어오|입소|도착|오는|참석.*시작/,outT:/나가|퇴소|귀가|떠나|가는/};
async function importXls(file){try{await loadXLSX()}catch(e){toast('엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요');return}
  let rows;try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false})}catch(e){toast('파일을 읽지 못했어요');return}
  const hi=rows.findIndex(r=>r.filter(x=>String(x).trim()).length>=2);if(hi<0){toast('내용이 없어요');return}
  const H=rows[hi].map(x=>String(x).trim()),data=rows.slice(hi+1).filter(r=>r.some(x=>String(x).trim()));
  const map={};PF.forEach(([k])=>{const i=H.findIndex((h,j)=>GUESS[k].test(h)&&!Object.values(map).includes(j));map[k]=i});
  const m=modal(`<h2>📊 엑셀·CSV 불러오기</h2><p>${data.length}명의 응답을 찾았어요. 각 항목이 어느 칸(열)인지 확인해 주세요.</p>
   <div class="f2">${PF.map(([k,l])=>`<label class="fld">${l}<select data-map="${k}"><option value="-1">— 없음 —</option>${H.map((h,j)=>`<option value="${j}"${map[k]===j?' selected':''}>${esc(h||('('+(j+1)+'번째 열)'))}</option>`).join('')}</select></label>`).join('')}</div>
   <p class="hint">이미 있는 사람(이름과 핸드폰번호가 같은 사람)은 새 내용으로 채워요.</p>
   <div class="row"><button class="pri" id="xGo">${data.length}명 추가</button><button data-close>취소</button></div>`);
  m.querySelector('#xGo').onclick=()=>{const mp={};m.querySelectorAll('[data-map]').forEach(s=>mp[s.dataset.map]=+s.value);if(mp.name<0){toast('이름 칸을 골라 주세요');return}
    let add=0,upd=0;const norm=s=>String(s||'').replace(/\D/g,'');
    data.forEach(r=>{const g=k=>mp[k]>=0?String(r[mp[k]]??'').trim():'';const name=g('name');if(!name)return;
      const o={name,age:g('age'),org:g('org'),addr:g('addr'),phone:g('phone'),inT:g('inT'),outT:g('outT')};
      const gd=g('gender');o.gender=/여|female|^f$/i.test(gd)?'여':/남|male|^m$/i.test(gd)?'남':'';
      const ins=g('ins');o.ins=/미가입|아니|없|no|x/i.test(ins)?'미가입':/가입|예|네|있|yes|o/i.test(ins)?'가입':'';
      setWhenFromText(o,'in');setWhenFromText(o,'out');
      const ex=R.people.find(p=>p.name===name&&norm(p.phone)===norm(o.phone));
      if(ex){for(const k in o)if(o[k])ex[k]=o[k];upd++}else{R.people.push({id:uid(),...o});add++}});
    save();m.remove();render();toast(`${add}명 추가${upd?`, ${upd}명 갱신`:''}했어요`)}}

/* ============ 이벤트 ============ */
document.addEventListener('click',e=>{const pc=e.target.closest&&e.target.closest('.chip[data-pid]');if(pc&&!e.target.closest('button,select,input')){personInfo(pc.dataset.pid);return}const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT')return;const f=ACT[t.dataset.act];if(f){if(t.tagName==='A'&&t.getAttribute('href')==='#')e.preventDefault();f(t,e)}});
function apply(t){const o=objOf(t.dataset.o);if(!o)return;const k=t.dataset.k;let v=t.type==='checkbox'?t.checked:t.dataset.t==='n'?(t.value===''?null:+t.value):t.value;if(t.dataset.o==='.'&&k==='nights')v=+v;o[k]=v;save()}
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='mq'){SUB.mq=t.value;clearTimeout(t._t);t._t=setTimeout(render,250);return}
  if(t.id==='nq'){SUB.nq=t.value;clearTimeout(t._t);t._t=setTimeout(render,250);return}
  if(t.id==='pq'){filterPeople(t.value);return}if(t.id==='poolQ'){filterPool(t.value);return}
  if(t.dataset.o==null||t.tagName==='SELECT'||t.type==='checkbox')return;apply(t);if(t.id==='mbody')updPrev();if(t.id==='ntcBody'){const l=$('#ntcLen');if(l)l.textContent=t.value.length+'자'}
  if(t.dataset.o==='venue.w'){const w=critList().reduce((s,k)=>s+(+R.venue.w[k.id]||0),0);$$('.wsum').forEach(b=>b.outerHTML=wBadge(w))}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='pSortK'){SUB.ps=t.value;SUB.pd=SUB.pd||'asc';render();return}
  if(t.dataset&&t.dataset.pf){SUB.pf=SUB.pf||{};SUB.pf[t.dataset.pf]=t.value;render();return}
  if(t.id==='vFinalSel'){setFinal(t.value);return}
  if(t.name==='lMeth'){$$('input[name=lMeth]').forEach(r=>r.parentElement.classList.toggle('on',r.checked));return}
  if(t.tagName==='SELECT'&&t.dataset.act==='addTo'){if(!t.value)return;const o=objOf(t.dataset.o);(o[t.dataset.k]=o[t.dataset.k]||[]).push(t.value);save();render();return}
  if(t.tagName==='SELECT'&&t.dataset.act==='assign'){if(t.value)assign(t.value,t.dataset.to,null);return}
  if(t.tagName==='SELECT'&&t.dataset.act==='gRole'){const g=R.grp.list.find(x=>x.id===t.dataset.g);g.roles=g.roles||{};if(t.value)g.roles[t.dataset.pid]=t.value;else delete g.roles[t.dataset.pid];save();return}
  if(t.dataset.o==null)return;if(t.tagName==='SELECT'||t.type==='checkbox')apply(t);
  if(t.dataset.o==='spkFinal'&&t.value){const sp=R.speakers.find(x=>x.id===t.value);if(sp&&sp.status!=='확정'){sp.status='확정';save()}}
  if(t.dataset.o.startsWith('people#')&&t.dataset.k==='prep'){const p=objOf(t.dataset.o);p.role=''}
  if(t.dataset.o.startsWith('people#')&&t.dataset.k==='payMethod'){const p=objOf(t.dataset.o),b=feeBooked(p.id);if(b)b.method=p.payMethod}
  if(t.dataset.o.startsWith('people#')&&t.dataset.k==='paid'){const p=objOf(t.dataset.o);p.paidDate=p.paid?todayStr():'';if(p.paid&&!p.payMethod)p.payMethod='계좌이체';if(p.paid&&feeOf(p).amt)toast(`💰 ${p.name||''} 입금확인 · [회계]에서 수입으로 넣을 수 있어요`)}
  if(t.dataset.rr!==undefined)rr()});
document.addEventListener('keydown',e=>{const t=e.target;
  if(t.dataset&&t.dataset.leAdd&&e.key==='Enter'&&!e.isComposing){e.preventDefault();const v=t.value.trim();if(!v)return;const a=objOf(t.dataset.leAdd);if(a.includes(v)){toast('이미 있어요');return}a.push(v);save();render();const n=$(`[data-le-add="${t.dataset.leAdd}"]`);if(n)n.focus();return}
  if(t.id==='critNew'&&e.key==='Enter'&&!e.isComposing){const v=t.value.trim();if(!v)return;const id='c_'+uid();R.venue.crit.push({id,name:v});R.venue.w[id]=0;save();render();const n=$('#critNew');if(n)n.focus();toast('가중치를 다시 맞춰 주세요 (합계 100%)');return}
  if(t.id==='chkT'&&e.key==='Enter'&&!e.isComposing){ACT.chkAdd();return}
  if(t.id==='rN'&&e.key==='Enter'&&!e.isComposing){ACT.roomAdd();return}
  if(t.id==='mbody'){if(e.key==='Tab'){e.preventDefault();indent(e.shiftKey?-1:1);return}
    if(e.key==='Enter'&&!e.isComposing&&!e.shiftKey){const v=t.value,s=t.selectionStart;const ls=v.lastIndexOf('\n',s-1)+1;const line=v.slice(ls,s);const ind=line.match(/^[\t ]*/)[0];
      if(!ind)return;e.preventDefault();let ins='\n'+ind;if(!line.trim()&&t.selectionEnd===s){/* 빈 줄에서 Enter → 한 단계 위로 */const nw=ind.slice(2);t.value=v.slice(0,ls)+nw+v.slice(s);t.selectionStart=t.selectionEnd=ls+nw.length}else{t.value=v.slice(0,s)+ins+v.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+ins.length}t.dispatchEvent(new Event('input',{bubbles:true}))}}});
/* 끌어다 놓기 */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.chip[data-pid]');if(!c)return;e.dataTransfer.setData('text/plain',JSON.stringify({pid:c.dataset.pid,from:c.dataset.from}));e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();$$('.drop-on').forEach(x=>x!==z&&x.classList.remove('drop-on'));z.classList.add('drop-on')});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('drop-on')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');$$('.drop-on').forEach(x=>x.classList.remove('drop-on'));if(!z)return;e.preventDefault();let d;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){return}if(!d||!d.pid||d.from===z.dataset.drop)return;assign(d.pid,z.dataset.drop,d.from)});
/* 파일 입력 */
$('#fileUp').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;toast('올리는 중…');for(const f of fs){const id=uid();try{await idb.put('files',id,{blob:f});R.files.push({id,folder:SUB.folder||'',name:f.name,size:f.size,type:f.type,date:new Date().toISOString()})}catch(err){toast('저장하지 못한 파일: '+f.name)}}save();render();toast(`${fs.length}개 올렸어요`)};
$('#xlsUp').onchange=e=>{const f=e.target.files[0];if(f)importXls(f)};
$('#bakUp').onchange=e=>{const f=e.target.files[0];if(f)restore(f)};
$('#rcpUp').onchange=e=>{const f=e.target.files[0];if(f){SUB.rcpFile=f;const n=$('#rcpName');if(n)n.textContent='🧾 '+f.name}};

/* ============ 시작 ============ */
(async()=>{try{await idb.open()}catch(e){$('#app').innerHTML='<div class="card"><div class="empty">이 브라우저에서는 저장소를 쓸 수 없어요. (시크릿 창이면 일반 창에서 열어 주세요)</div></div>';return}
  try{TAB=localStorage.getItem('camp-tab')||'people';SUB.carView=localStorage.getItem('camp-carview')||'card'}catch(_){}if(!TABS.some(x=>x[0]===TAB))TAB='people';
  const cid=new URLSearchParams(location.search).get('c');
  if(cid){const c=await idb.get('camps',cid);if(!c){location.replace('./');return}R=fill(c);CONF.forEach(([k])=>{try{if(k!=='snack'&&R.conf[k].v&&R.conf[k].v.trim()===confSrc(k).trim())R.conf[k].v=''}catch(_){}});R.people.forEach(p=>['in','out'].forEach(k=>{if((p[k+'H']==null||p[k+'H']==='')&&p[k+'T'])setWhenFromText(p,k)}));document.title=R.name+' | 수련회 준비 패키지'}
  else CAMPS=(await idb.all('camps'))||[];
  render()})();
})();
