  if(post&&o){for(const p of post.split('.')){if(o[p]==null)o[p]={};o=o[p]}}return o}

const LE_REF={
  'cfg.minRoles':(a,b)=>R.people.forEach(p=>{if(p.prep==='min'&&p.role===a)p.role=b}),

const inp=(spec,k,o={})=>{const ob=objOf(spec)||{};const v=ob[k];return `<input data-o="${spec}" data-k="${k}"${o.n?' data-t="n" type="number" inputmode="numeric"':o.type?` type="${o.type}"`:''}${o.rr?' data-rr':''}${o.list?` list="${o.list}"`:''} value="${esc(v??'')}" placeholder="${esc(o.ph||'')}"${o.st?` style="${o.st}"`:''}>`};
const sel=(spec,k,opts,o={})=>{const ob=objOf(spec)||{};const v=ob[k]??'';return `<select data-o="${spec}" data-k="${k}"${o.rr?' data-rr':''}${o.st?` style="${o.st}"`:''}>${o.blank!==undefined?`<option value="">${esc(o.blank)}</option>`:''}${opts.map(x=>{const[val,lab]=Array.isArray(x)?x:[x,x];return `<option value="${esc(val)}"${String(val)===String(v)?' selected':''}>${esc(lab)}</option>`}).join('')}</select>`};

const MK_RE=/^(\d+\.|\(\d+\)|\d+\)|[-•·])\s*/;
function outline(text){const cnt=[0,0,0,0,0,0,0,0];return String(text||'').split('\n').map(raw=>{if(!raw.trim())return{lv:-1};const ind=raw.match(/^[\t ]*/)[0].replace(/\t/g,'  ').length;const lv=Math.min(7,ind>>1);cnt[lv]++;for(let j=lv+1;j<8;j++)cnt[j]=0;const n=cnt[lv];return{lv,mk:lv===0?n+'.':lv===1?'('+n+')':lv===2?n+')':'-',t:raw.trim().replace(MK_RE,'')}})}
function minText(m){const L=outline(m.body);return `📝 ${m.title||'회의록'}\n일시: ${m.date||''}${m.place?'\n장소: '+m.place:''}\n참석: ${[...(m.att||[]).map(pn),m.etc].filter(Boolean).join(', ')}\n\n`+L.map(x=>x.lv<0?'':' '.repeat(x.lv)+x.mk+' '+x.t).join('\n')}

    <div class="row" style="margin-top:4px"><span class="hint">그 밖의 참석자</span>${inp(s,'etc',{ph:'예) 담임목사님',st:'flex:1'})}</div>

/* ---------- 일정 (간트차트) ---------- */
function vSched(){
  const T=R.sched,td=todayStr(),rs=R.start,re=campEnd();
  let a=[td,...T.map(t=>t.start).filter(Boolean)].sort()[0];
  let b=[rs||addD(td,30),re,...T.map(t=>t.end||t.start).filter(Boolean)].filter(Boolean).sort().pop();
  a=addD(a,-2);b=addD(b,2);let n=Math.min(400,diffD(a,b)+1);const w=n>150?10:n>70?16:24,LW=170,W=n*w;
  let hd='',mo='';for(let i=0;i<n;i++){const d=addD(a,i),dw=new Date(toT(d)).getUTCDay(),dd=+d.slice(8);if(d.slice(0,7)!==mo){mo=d.slice(0,7);hd+=`<span class="gm" style="left:${i*w}px;top:0">${+d.slice(5,7)}월</span>`}if(w>=16||dw===1)hd+=`<span class="gd ${dw===0||dw===6?'we':''}" style="left:${i*w}px;width:${w}px;top:18px">${dd}</span>`}
  const over=()=>{let s='';const ti=diffD(a,td);if(ti>=0&&ti<n)s+=`<div class="gtoday" style="left:${ti*w+w/2}px" title="오늘"></div>`;if(rs){const ci=diffD(a,rs);s+=`<div class="gcamp" style="left:${ci*w}px;width:${(diffD(rs,re)+1)*w}px" title="수련회"></div>`}return s};
  const bg=`background-image:linear-gradient(to right,#f1e9da 1px,transparent 1px);background-size:${w}px 100%`;
  const rows=T.map((t,i)=>{let bar='';if(t.start){const s=Math.max(0,diffD(a,t.start)),e=Math.min(n-1,diffD(a,t.end&&t.end>=t.start?t.end:t.start));const who=(t.who||[]).map(pn).join(', ');bar=`<div class="gbar ${t.done?'done':''}" style="left:${s*w}px;width:${Math.max(w,(e-s+1)*w)}px;background:${PAL[i%PAL.length]}" title="${esc(t.name+' '+fmtD(t.start)+'~'+fmtD(t.end||t.start)+(who?' · '+who:''))}">${t.done?'✔ ':''}${esc(t.name)}${who?' · '+esc(who):''}</div>`}
    return `<div class="grow"><div class="glab" title="${esc(t.name)}">${t.done?'✔ ':''}${esc(t.name||'(이름 없음)')}</div><div class="gtrack" style="width:${W}px;${bg}">${over()}${bar}</div></div>`}).join('');
  const cands=prepList().length?prepList():R.people;
  return `<div class="card"><div class="row"><h2 style="margin:0">📅 준비 일정</h2><span class="hint">${rs?`수련회 ${esc(campRange())} · <b style="color:var(--accent)">${diffD(td,rs)>=0?'D-'+diffD(td,rs):'지남'}</b>`:'⚙️ 설정에서 수련회 날짜를 정하면 차트에 노란 띠로 보여요'}</span><span class="sp"></span><button data-act="schedTpl">✨ 기본 일정 넣기</button><button class="pri" data-act="schedAdd">+ 할 일</button></div>
  <div class="gantt hs" data-keep="gantt" style="margin-top:10px"><div class="gin" style="width:${LW+W}px"><div class="grow" style="min-height:38px"><div class="glab"><b>할 일</b></div><div class="gtrack ghd" style="width:${W}px">${hd}</div></div>${rows||`<div class="grow"><div class="glab hint">할 일을 추가해요</div><div class="gtrack" style="width:${W}px;${bg}">${over()}</div></div>`}</div></div>
  <p class="hint">빨간 선 = 오늘, 노란 띠 = 수련회 기간</p></div>
  <div class="card"><h2>✏️ 할 일 목록</h2>${T.length?`<div class="hs"><table class="t"><tr><th>#</th><th style="min-width:160px">할 일</th><th>시작</th><th>끝</th><th style="min-width:220px">누가 (담당)</th><th>완료</th><th></th></tr>${T.map((t,i)=>`<tr><td><span style="display:inline-block;width:12px;height:12px;border-radius:4px;background:${PAL[i%PAL.length]}"></span></td><td>${inp('sched#'+t.id,'name',{rr:1,ph:'예) 장소 섭외'})}</td><td>${inp('sched#'+t.id,'start',{type:'date',rr:1})}</td><td>${inp('sched#'+t.id,'end',{type:'date',rr:1})}</td><td>${WHO('sched#'+t.id,'who',cands,'+ 담당')}</td><td style="text-align:center"><input type="checkbox" data-o="sched#${t.id}" data-k="done" data-rr ${t.done?'checked':''}></td><td><button class="sm" data-act="mvUp" data-c="sched" data-v="${t.id}" title="위로">↑</button><button class="x" data-act="del" data-c="sched" data-v="${t.id}">🗑</button></td></tr>`).join('')}</table></div>`:'<div class="empty">‘✨ 기본 일정 넣기’로 수련회 날짜에 맞춘 준비 일정을 한 번에 넣을 수 있어요</div>'}</div>`}

  ${t.verses.length?`<div class="hs"><table class="t"><tr><th style="width:150px">본문</th><th>말씀</th><th style="width:200px">왜 이 말씀?</th><th></th></tr>${t.verses.map(v=>`<tr><td>${inp('theme.verses#'+v.id,'ref',{ph:'예) 시 23:1'})}</td><td>${inp('theme.verses#'+v.id,'text')}</td><td>${inp('theme.verses#'+v.id,'note')}</td><td><button class="sm" data-act="useVerse" data-v="${v.id}" title="주제말씀으로">⭐</button><button class="x" data-act="del" data-c="theme.verses" data-v="${v.id}">🗑</button></td></tr>`).join('')}</table></div><p class="hint">⭐를 누르면 주제말씀으로 정해져요.</p>`:'<div class="empty">관련 말씀을 모아 보세요</div>'}</div>
  <div class="card"><div class="row"><h2 style="margin:0">🗳️ 주제 후보</h2><span class="sp"></span><button class="pri" data-act="add" data-c="theme.cands">+ 후보</button></div>
  ${t.cands.length?t.cands.slice().map(c=>`<div class="row" style="margin:4px 0">${inp('theme.cands#'+c.id,'title',{ph:'주제 후보',st:'flex:2'})}${inp('theme.cands#'+c.id,'verse',{ph:'주제말씀',st:'flex:1'})}<button class="sm" data-act="vote" data-v="${c.id}">👍 ${c.votes||0}</button><button class="sm ok" data-act="useCand" data-v="${c.id}">이걸로 정하기</button><button class="x" data-act="del" data-c="theme.cands" data-v="${c.id}">🗑</button></div>`).join(''):'<div class="empty">주제 후보를 적고 👍로 투표해요</div>'}</div>`}

/* ---------- 장소탐색 (ICE) ---------- */
function densInfo(d){if(d==null||!isFinite(d))return['-',null,''];if(d<=1.2)return['매우 쾌적',5,'b-ok'];if(d<=1.5)return['추천',5,'b-ok'];if(d<=2)return['적정',4,'b-mid'];if(d<=2.5)return['가능하지만 불편',2,'b-mid'];if(d<=3)return['비추천',1,'b-no'];return['너무 좁아요',0,'b-no']}
function vCalc(v){const N=+R.venue.expected||0,varc=((+v.lodge||0)+(+v.meal||0))*N,tot=(+v.fixed||0)+varc;const dens=v.area>0&&N?N/v.area:null;return{N,varc,tot,per:N?tot/N:0,dens}}
function critList(){return[{id:'fixed',name:'고정비',auto:1},{id:'var',name:'변동비',auto:1},{id:'cap',name:'수용(평당 인원)',auto:1},{id:'loc',name:'위치(이동시간)',auto:1},...R.venue.crit]}
function scores(){const L=R.venue.list,C=critList();const rel=(vals,v)=>{const xs=vals.filter(x=>x!=null&&x!==''&&!isNaN(x)).map(Number);if(v==null||v===''||isNaN(v)||!xs.length)return null;const mx=Math.max(...xs),mn=Math.min(...xs);return mx===mn?5:Math.round((1+4*(mx-v)/(mx-mn))*10)/10};
  const fx=L.map(v=>v.fixed),vr=L.map(v=>(v.lodge!=null||v.meal!=null)?vCalc(v).varc:null),lc=L.map(v=>v.travel);
  const out=L.map((v,i)=>{const c=vCalc(v);const auto={fixed:rel(fx,v.fixed),var:rel(vr,vr[i]),cap:(()=>{let s=densInfo(c.dens)[1];if(s!=null&&v.cap&&c.N&&+v.cap<c.N)s=Math.min(s,1);return s})(),loc:rel(lc,v.travel)};
    const sc={};C.forEach(k=>{const m=(v.sc||{})[k.id];sc[k.id]={auto:auto[k.id]??null,v:(m!==undefined&&m!==null&&m!=='')?+m:(auto[k.id]??null),manual:m!==undefined&&m!==null&&m!==''}});
    const wsum=C.reduce((s,k)=>s+(+R.venue.w[k.id]||0),0)||1;
    const ice=C.reduce((s,k)=>s+(sc[k.id].v||0),0),plus=C.reduce((s,k)=>s+(sc[k.id].v||0)*(+R.venue.w[k.id]||0),0)/wsum;return{v,sc,ice,plus,c}});
  const rank=(key)=>{const s=out.map(o=>o[key]).sort((a,b)=>b-a);out.forEach(o=>o[key+'R']=s.indexOf(o[key])+1)};rank('ice');rank('plus');return out}
function vVenue(){const V=R.venue,C=critList(),S=scores(),wsum=C.reduce((s,k)=>s+(+V.w[k.id]||0),0);
  const card=v=>{const c=vCalc(v),d=densInfo(c.dens),s='venue.list#'+v.id;return `<div class="box"><div class="bh">${inp(s,'name',{ph:'장소 이름',rr:1,st:'flex:1;font-weight:600'})}<button class="x" data-act="del" data-c="venue.list" data-v="${v.id}">🗑</button></div>
   <div class="f2" style="grid-template-columns:1fr 1fr">
    <label class="fld">고정비 (대여비, 원)${inp(s,'fixed',{n:1,rr:1,ph:'예배당 등 대여비'})}</label>
    <label class="fld">이동시간 (분)${inp(s,'travel',{n:1,rr:1,ph:'교회→장소'})}</label>
    <label class="fld">숙소비 (1인, 원)${inp(s,'lodge',{n:1,rr:1})}</label>
    <label class="fld">식대 (1인 전체, 원)${inp(s,'meal',{n:1,rr:1})}</label>
    <label class="fld">숙소 수용인원 (명)${inp(s,'cap',{n:1,rr:1})}</label>
    <label class="fld">예배당 면적 (평)${inp(s,'area',{n:1,rr:1})}</label></div>
   <div style="margin-top:6px;font-size:14px">변동비 <b>${won(c.varc)}</b>원 <span class="hint">(숙소비+식대)×${c.N}명</span><br>총비용 <b>${won(c.tot)}</b>원 · 1인당 <b>${won(c.per)}</b>원<br>
   예배당 평당 <b>${c.dens==null?'-':c.dens.toFixed(2)}</b>명 ${c.dens!=null?`<span class="dens badge ${d[2]}">${d[0]}</span>`:''}${v.cap&&c.N&&+v.cap<c.N?` <span class="badge b-no">숙소 ${c.N-v.cap}명 부족</span>`:''}</div>
   <label class="fld" style="margin-top:6px">위치·주소${inp(s,'addr',{ph:'주소 또는 지역'})}</label>
   <label class="fld">링크·연락처${inp(s,'link',{ph:'홈페이지, 전화번호'})}</label>
   ${V.crit.length?`<div style="margin-top:6px">${V.crit.map(k=>{const x=+((v.sc||{})[k.id]||0);return `<div class="row" style="gap:4px"><span style="min-width:110px;font-size:13px">${esc(k.name)}</span><span class="stars">${[1,2,3,4,5].map(n=>`<button data-act="star" data-v="${v.id}" data-c="${k.id}" data-n="${n}" class="${n<=x?'on':''}">★</button>`).join('')}</span></div>`}).join('')}</div>`:''}
   <label class="fld" style="margin-top:4px">메모${inp(s,'memo')}</label></div>`};
  return `<div class="card"><div class="row"><h2 style="margin:0">🏕️ 장소탐색</h2><span class="sp"></span><a class="btn pri" href="../retreat/" target="_blank">🔎 수련회 장소찾기 ↗</a></div>
  <div class="row" style="margin-top:8px"><b class="j" style="font-size:17px">예상 참석인원</b>${inp('venue','expected',{n:1,rr:1,st:'width:100px',ph:'명'})}<span>명</span><span class="hint">변동비와 평당 인원 계산에 쓰여요 · 참석인원에 ${R.people.length}명 등록됨</span></div>
  <p class="hint" style="margin:6px 0 0">평당 인원: 1~1.2 매우 쾌적 · 1.3~1.5 추천 · 1.5~2 적정 · 2~2.5 가능하지만 불편 · 2.5~3 비추천</p></div>
  <div class="row" style="margin-bottom:8px"><button class="pri" data-act="add" data-c="venue.list">+ 장소 후보 추가</button></div>
  ${V.list.length?`<div class="grid">${V.list.map(card).join('')}</div>`:'<div class="card"><div class="empty">장소 후보를 추가해 비교해 보세요</div></div>'}
  <div class="card"><h2>⭐ 적합도 항목</h2><p class="hint">음향, 용도, 식사 질, 주차, 화장실 등 비교하고 싶은 항목을 하나씩 추가해요. 각 장소 카드에서 별점(1~5)을 매겨요.</p>
   <div class="row">${V.crit.map(k=>`<span class="chip"><span data-act="critRen" data-v="${k.id}" style="cursor:pointer">${esc(k.name)}</span><button class="x" data-act="critDel" data-v="${k.id}">×</button></span>`).join('')}<input id="critNew" placeholder="+ 적합도 항목 추가 후 Enter" style="width:200px"></div></div>
  ${V.list.length?`<div class="card"><h2>🏆 의사결정 (ICE / ICE+)</h2>
   <p class="hint">점수는 1~5점. 고정비·변동비·이동시간은 장소끼리 비교해 싼/가까운 곳이 5점, 수용은 평당 인원으로 자동 계산돼요. 칸에 숫자를 직접 적으면 그 점수로 바뀌어요(지우면 자동). <b>ICE</b> = 항목 점수 합계 순위, <b>ICE+</b> = 가중치를 곱한 점수 순위.</p>
   <div class="hs" data-keep="ice"><table class="t vrank"><tr><th>장소</th>${C.map(k=>`<th class="num">${esc(k.name)}<br><span style="font-weight:400">가중치 <input data-o="venue.w" data-k="${k.id}" data-t="n" type="number" data-rr value="${esc(V.w[k.id]??0)}" style="width:52px">%</span></th>`).join('')}<th class="num">ICE<br>합계</th><th class="num">ICE<br>순위</th><th class="num">ICE+<br>점수</th><th class="num">ICE+<br>순위</th></tr>
   ${S.map(o=>`<tr><td><b>${esc(o.v.name||'(이름 없음)')}</b></td>${C.map(k=>{const x=o.sc[k.id];return `<td class="num"><input data-o="venue.list#${o.v.id}>sc" data-k="${k.id}" data-t="n" type="number" step="0.5" min="0" max="5" data-rr value="${x.manual?esc(x.v):''}" placeholder="${x.auto==null?'-':x.auto}" style="width:58px;${x.manual?'background:#fff6d8':''}"></td>`}).join('')}<td class="num">${o.ice.toFixed(1)}</td><td class="num ${o.iceR===1?'r1':''}">${o.iceR}위</td><td class="num">${o.plus.toFixed(2)}</td><td class="num ${o.plusR===1?'r1':''}">${o.plusR}위</td></tr>`).join('')}</table></div>
   <div class="row" style="margin-top:6px"><span class="${wsum===100?'badge b-ok':'badge b-no'}">가중치 합계 ${wsum}%${wsum===100?' ✔':' (100%로 맞춰 주세요)'}</span><button class="sm" data-act="wEven">균등하게 나누기</button></div></div>`:''}`}

function vSpeaker(){const L=R.speakers,cnt={};L.forEach(s=>cnt[s.status||'후보']=(cnt[s.status||'후보']||0)+1);
  const cls=s=>s==='확정'||s==='수락'?'b-ok':s==='거절'?'b-no':s==='후보'?'':'b-mid';

  ${L.length?`<div class="hs" style="margin-top:10px"><table class="t"><tr><th>이름</th><th>맡을 순서</th><th>소속</th><th>연락처</th><th>주제·분야</th><th>사례비</th><th>상태</th><th>가능 일정</th><th style="min-width:160px">메모</th><th></th></tr>${L.map(s=>{const k='speakers#'+s.id;return `<tr><td>${inp(k,'name',{st:'min-width:80px'})}</td><td>${inp(k,'role',{ph:'예) 집회 설교, 특강',st:'min-width:110px'})}</td><td>${inp(k,'org')}</td><td>${inp(k,'phone',{st:'min-width:110px'})}</td><td>${inp(k,'topic')}</td><td>${inp(k,'fee',{n:1,st:'width:90px'})}</td><td>${sel(k,'status',SPK_ST,{rr:1})} </td><td>${inp(k,'avail',{st:'min-width:90px'})}</td><td>${inp(k,'memo')}</td><td><button class="x" data-act="del" data-c="speakers" data-v="${s.id}">🗑</button></td></tr>`}).join('')}</table></div>`:'<div class="empty" style="margin-top:10px">강사 후보를 추가해서 섭외 상황을 정리해요</div>'}</div>`}

/* ---------- 프로그램 ---------- */
function vProgram(){const cands=prepList().length?prepList():R.people;
  return `<div class="card"><div class="row"><h2 style="margin:0">🎲 프로그램</h2><span class="sp"></span><button class="pri" data-act="add" data-c="programs">+ 프로그램</button></div><p class="hint">여기에 적은 프로그램 이름은 [시간표]에서 골라 쓸 수 있어요.</p></div>
  ${R.programs.length?`<div class="grid">${R.programs.map(p=>{const k='programs#'+p.id;return `<div class="box"><div class="bh">${inp(k,'name',{ph:'프로그램 이름 (예: 레크리에이션)',st:'flex:1;font-weight:600'})}<button class="x" data-act="del" data-c="programs" data-v="${p.id}">🗑</button></div>
   <div class="f2" style="grid-template-columns:1fr 1fr"><label class="fld">언제${inp(k,'when',{ph:'예) 1일차 저녁'})}</label><label class="fld">소요 시간${inp(k,'dur',{ph:'예) 90분'})}</label><label class="fld">장소${inp(k,'place')}</label><label class="fld">예산 (원)${inp(k,'budget',{n:1})}</label></div>
   <div class="fld" style="margin-top:4px">담당${WHO(k,'who',cands,'+ 담당')}</div>
   <label class="fld" style="margin-top:4px">내용·진행 순서${ta(k,'content','진행 방법, 순서',4)}</label>
   <label class="fld">필요한 것${ta(k,'need','준비물, 음향, 인원 등',2)}</label></div>`}).join('')}</div>`:'<div class="card"><div class="empty">프로그램을 추가해 내용을 정리해요</div></div>'}`}

/* ---------- 시간표 ---------- */
function slots(){const toM=s=>{const[h,m]=String(s).split(':').map(Number);return h*60+(m||0)};let f=toM(R.tt.from),t=toM(R.tt.to);if(t<=f)t=f+60*18;const L=[];for(let m=f;m<t;m+=30)L.push(pad(Math.floor(m/60)%24)+':'+pad(m%60));return L}
function vTT(){const days=(+R.nights||0)+1,S=slots(),C=R.tt.cells;
  const head=Array.from({length:days},(_,d)=>`<th>${d+1}일차${R.start?' · '+fmtD(addD(R.start,d)):''}</th>`).join('');
  const times=Array.from({length:S.length+1},(_,i)=>{const m=S[0].split(':').map(Number);const x=m[0]*60+m[1]+i*30;return pad(Math.floor(x/60)%24)+':'+pad(x%60)});
  const body=S.map((s,i)=>`<tr><td class="tm ${s.endsWith(':00')?'h':''}">${s}~${times[i+1]}</td>${Array.from({length:days},(_,d)=>{const v=C[d+'-'+s]||'',pv=i?C[d+'-'+S[i-1]]||'':'';const cont=v&&v===pv;return `<td class="${cont?'cont':''}" style="${v?`background:hsl(${hue(v)},70%,90%)`:''}"><input data-o="tt.cells" data-k="${d}-${s}" data-rr list="progList" value="${esc(v)}"></td>`}).join('')}</tr>`).join('');
  return `<datalist id="progList">${[...new Set([...R.programs.map(p=>p.name).filter(Boolean),'기상','아침 식사','점심 식사','저녁 식사','간식','자유시간','개회예배','집회','소그룹 나눔','레크리에이션','세면·정리','취침','폐회예배','이동','출발','도착','QT'])].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <div class="card"><div class="row"><h2 style="margin:0">⏰ 시간표</h2><span class="sp"></span><button data-act="ttCopy">📋 텍스트로 복사</button><button data-act="print">🖨️ 인쇄</button></div>
   <div class="row" style="margin-top:8px"><label class="fld">시작일${inp('.','start',{type:'date',rr:1})}</label><label class="fld">기간${sel('.','nights',[0,1,2,3,4,5].map(n=>[n,n+'박 '+(n+1)+'일']),{rr:1})}</label><label class="fld">하루 시작${inp('tt','from',{type:'time',rr:1})}</label><label class="fld">하루 끝${inp('tt','to',{type:'time',rr:1})}</label></div>
   <p class="hint">30분 단위 칸에 일정을 적어요. 이어지는 칸에 같은 내용을 적으면 한 덩어리로 묶여 보여요. [프로그램]에 적은 이름도 골라 쓸 수 있어요.</p>
   <div class="hs" data-keep="tt"><table class="tt"><tr><th>시간</th>${head}</tr>${body}</table></div></div>`}
function ttText(){const days=(+R.nights||0)+1,S=slots(),C=R.tt.cells;let out=`⏰ ${R.name} 시간표\n`;for(let d=0;d<days;d++){out+=`\n[${d+1}일차${R.start?' '+fmtD(addD(R.start,d)):''}]\n`;let i=0;while(i<S.length){const v=C[d+'-'+S[i]];if(!v){i++;continue}let j=i;while(j+1<S.length&&C[d+'-'+S[j+1]]===v)j++;const e=S[j].split(':').map(Number),em=e[0]*60+e[1]+30;out+=`${S[i]}~${pad(Math.floor(em/60)%24)}:${pad(em%60)} ${v}\n`;i=j+1}}return out}

/* ---------- 확정사항 ---------- */
const CONF=[['sched','일정'],['place','장소'],['theme','주제'],['verse','주제말씀'],['song','주제찬양'],['preacher','집회설교자'],['speaker','강사'],['tt','시간표'],['praise','찬양팀'],['staff','스탭'],['snack','간식']];
function confSrc(k){const okS=R.speakers.filter(s=>s.status==='확정'||s.status==='수락');
  switch(k){case'sched':return campRange();case'place':{const S=scores().sort((a,b)=>a.plusR-b.plusR);return S[0]?S[0].v.name+(S[0].v.addr?' ('+S[0].v.addr+')':''):''}
   case'theme':return R.theme.title||'';case'verse':return[R.theme.verse,R.theme.verseText].filter(Boolean).join(' — ');
   case'preacher':return okS.filter(s=>/설교|집회/.test(s.role||'')).map(s=>s.name+(s.org?'('+s.org+')':'')).join(', ');
   case'speaker':return okS.filter(s=>!/설교|집회/.test(s.role||'')).map(s=>s.name+(s.role?' - '+s.role:'')).join(', ');
   case'tt':{const n=Object.values(R.tt.cells).filter(Boolean).length;return n?`[시간표] 메뉴 참고 (${n}칸 작성)`:''}
   case'praise':return R.cfg.parts.map(x=>{const n=R.people.filter(p=>p.praise&&(p.parts||[]).includes(x));return n.length?x+': '+n.map(p=>p.name).join(', '):''}).filter(Boolean).join(' / ');
   case'staff':return prepList().sort((a,b)=>(a.prep===b.prep?0:a.prep==='min'?-1:1)).map(p=>`${p.name}(${roleOf(p)}${p.duty?' · '+p.duty:''})`).join(', ');
   case'snack':return R.programs.filter(p=>/간식/.test(p.name||'')).map(p=>p.content).filter(Boolean).join(' / ');default:return''}}
function vConfirm(){const n=CONF.filter(([k])=>R.conf[k].ok).length;
  return `<div class="card"><div class="row"><h2 style="margin:0">✅ 확정사항</h2><span class="badge ${n===CONF.length?'b-ok':'b-mid'}">${n}/${CONF.length} 확정</span><span class="sp"></span><button data-act="confAll">⤵ 빈 칸 모두 불러오기</button><button class="pri" data-act="confCopy">📋 카톡용 복사</button></div>
  <p class="hint">‘⤵ 불러오기’를 누르면 다른 메뉴에 적어 둔 내용을 가져와요. 확정되면 ✔에 체크해요.</p>
  <div class="kv" style="margin-top:8px">${CONF.map(([k,l])=>{const src=confSrc(k);return `<b>${l}</b><div>${ta('conf.'+k,'v',src?'불러올 내용: '+src:'직접 적어요',/praise|staff|tt/.test(k)?2:1)}</div><div class="row" style="gap:4px;padding-top:3px"><button class="sm" data-act="confFill" data-v="${k}" ${src?'':'disabled'} title="다른 메뉴에서 불러오기">⤵</button><label class="chip tog ${R.conf[k].ok?'on':''}"><input type="checkbox" data-o="conf.${k}" data-k="ok" data-rr ${R.conf[k].ok?'checked':''} style="display:none">✔ 확정</label></div>`}).join('')}</div></div>`}

/* ---------- 준비물 ---------- */
function vSup(){const L=R.sup,f=SUB.supF||'all',td=todayStr(),cands=prepList().length?prepList():R.people;
  const fin=s=>s.method&&(+s.stage||0)>=METHODS[s.method].length-1;
  const done=L.filter(fin).length;
  const rows=L.filter(s=>f==='all'||(f==='todo'?!fin(s):f==='done'?fin(s):s.method===f));
  return `<div class="card"><div class="row"><h2 style="margin:0">📦 준비물</h2><span class="badge ${done===L.length&&L.length?'b-ok':'b-mid'}">준비완료 ${done}/${L.length}</span><span class="sp"></span>
   <a class="btn" href="../image/" target="_blank">🏷️ 명찰 시안 만들기 ↗</a><a class="btn" href="../image/" target="_blank">🎌 현수막 시안 만들기 ↗</a><button class="pri" data-act="supAdd">+ 준비물</button></div>
   <div class="prog" style="margin:8px 0"><i style="width:${L.length?done/L.length*100:0}%"></i></div>
   <div class="row">${[['all','전체'],['todo','준비 중'],['done','준비완료'],...Object.keys(METHODS).map(m=>[m,m])].map(([k,l])=>`<span class="chip tog ${f===k?'on':''}" data-act="supF" data-v="${k}">${l}</span>`).join('')}</div>
  ${rows.length?`<div class="hs" style="margin-top:8px"><table class="t"><tr><th style="min-width:130px">준비물</th><th>수량</th><th>준비방법</th><th style="min-width:250px">준비도 (단계를 눌러 체크)</th><th>언제까지</th><th>담당</th><th style="min-width:120px">둔 곳</th><th>메모</th><th></th></tr>
   ${rows.map(s=>{const k='sup#'+s.id,st=s.method?METHODS[s.method]:[],cur=+s.stage||0,late=s.due&&s.due<td&&!fin(s),dd=s.due?diffD(td,s.due):null;
    return `<tr class="${late?'late':''}"><td>${inp(k,'name',{ph:'예) 명찰',rr:1})}${/명찰/.test(s.name||'')?'<a class="hint" href="../image/" target="_blank">🏷️ 명찰 시안 ↗</a>':''}${/현수막/.test(s.name||'')?'<a class="hint" href="../image/" target="_blank">🎌 현수막 시안 ↗</a>':''}</td><td>${inp(k,'qty',{st:'width:60px'})}</td><td>${sel(k,'method',Object.keys(METHODS),{rr:1,blank:'— 선택 —'})}</td>
    <td>${st.length?`<div class="steps">${st.map((x,i)=>`<button data-act="stage" data-v="${s.id}" data-n="${i}" class="${i<cur?'past':i===cur?'cur':''} ${i===st.length-1?'fin':''}">${i<=cur&&i?'✔ ':''}${x}</button>`).join('')}</div>`:'<span class="hint">준비방법을 고르세요</span>'}</td>
    <td>${inp(k,'due',{type:'date',rr:1})}${dd!=null&&!fin(s)?`<div class="hint" style="${late?'color:#b5361f':''}">${dd>0?'D-'+dd:dd===0?'오늘까지':Math.abs(dd)+'일 지남'}</div>`:''}</td>
    <td>${sel(k,'owner',peopleOpts(cands,'—'),{st:'min-width:90px'})}</td><td>${fin(s)?inp(k,'place',{ph:'예) 교육관 창고'}):'<span class="hint">준비완료 후 적어요</span>'}</td><td>${inp(k,'memo')}</td><td><button class="x" data-act="del" data-c="sup" data-v="${s.id}">🗑</button></td></tr>`}).join('')}</table></div>`:'<div class="empty" style="margin-top:8px">준비물이 없어요</div>'}
  <p class="hint">준비방법별 단계 — 온라인: 구입필요→구입완료→배송완료→준비완료 · 오프라인: 구입필요→구입완료→준비완료 · 챙기기: 준비필요→준비완료 · 제작: 준비전→시안제작완료→발주완료→배송완료→준비완료 · 인쇄: 준비전→작성완료→인쇄완료→준비완료</p></div>`}

/* ---------- 체크리스트 ---------- */
function vChk(){const L=R.chk,cats=[...new Set(L.map(x=>x.cat||'기타'))],done=L.filter(x=>x.done).length;
  return `<datalist id="chkCats">${[...new Set([...cats,'출발 전','장소 도착','예배·집회','식사·간식','안전','정리'])].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <div class="card"><div class="row"><h2 style="margin:0">☑️ 체크리스트</h2><span class="badge ${done===L.length&&L.length?'b-ok':'b-mid'}">${done}/${L.length}</span><span class="sp"></span><button data-act="chkSup">📦 덜 된 준비물 가져오기</button><button data-act="chkReset">체크 모두 풀기</button></div>

/* ---------- 자료실 ---------- */
const fsize=n=>!n?"0KB":n>1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB';
const ficon=f=>/image/.test(f.type)?'🖼️':/pdf/.test(f.type)?'📕':/sheet|excel|csv/.test(f.type+f.name)?'📊':/word|hwp|document/.test(f.type+f.name)?'📄':/presentation|ppt|key/.test(f.type+f.name)?'📽️':/audio/.test(f.type)?'🎵':/video/.test(f.type)?'🎬':/zip/.test(f.type)?'🗜️':'📎';
function vFiles(){const cur=SUB.folder||'',isR=cur==='__rcp';
  const path=[];let c=cur;while(c&&c!=='__rcp'){const f=R.folders.find(x=>x.id===c);if(!f)break;path.unshift(f);c=f.parent||''}
  const subs=isR?[]:R.folders.filter(f=>(f.parent||'')===cur).sort(byName),files=R.files.filter(f=>(f.folder||'')===cur);
  const total=R.files.reduce((s,f)=>s+(f.size||0),0);

   <label class="fld">금액 (원)<input id="lAmt" type="number" inputmode="numeric" value="${esc(f.amount??'')}"></label>
   <label class="fld">${ty==='in'?'입금자·후원자 이름':'사용처·결제자'}<input id="lWho" value="${esc(f.who||'')}" list="pnames2"></label>
   <label class="fld" style="grid-column:span 2">적요<input id="lMemo" value="${esc(f.memo||'')}" placeholder="${ty==='in'?'예) 수련회비 (홍길동 외 3명)':'예) 간식 구입 (코스트코)'}"></label></div>
   <datalist id="pnames2">${R.people.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
   ${ty==='out'?`<div class="row" style="margin-top:6px"><button class="sm" data-act="rcpPick">🧾 영수증 사진·PDF 올리기</button><span class="hint" id="rcpName">${SUB.rcpFile?esc(SUB.rcpFile.name):ed&&ed.rcp?'영수증 있음 (새로 고르면 바뀌어요)':'선택 안 함'}</span></div>`:''}

  <div class="card"><h2>📒 내역</h2>${rows.length?`<div class="hs"><table class="t"><tr><th>날짜</th><th>수입/지출</th><th>항목</th><th class="num">금액</th><th>적요</th><th class="num">현재잔액</th><th>영수증</th><th></th></tr>
   ${rows.map(({x,bal})=>`<tr><td>${esc(x.date||'')}</td><td>${x.type==='in'?'<span class="badge b-ok">수입</span>':'<span class="badge b-no">지출</span>'}</td><td>${esc(x.cat||'')}</td><td class="num" style="color:${x.type==='in'?'#1f6a35':'#a3301a'}">${x.type==='in'?'+':'-'}${won(x.amount)}</td><td>${esc(x.memo||'')}${x.who?` <span class="hint">(${esc(x.who)})</span>`:''}</td><td class="num"><b>${won(bal)}</b></td><td>${x.rcp?`<button class="sm" data-act="fopen" data-v="${x.rcp}">🧾 보기</button>`:x.type==='out'?'<span class="hint">없음</span>':''}</td><td style="white-space:nowrap"><button class="sm" data-act="ledEdit" data-v="${x.id}">✏️</button><button class="x" data-act="ledDel" data-v="${x.id}">🗑</button></td></tr>`).join('')}</table></div>`:'<div class="empty">아직 내역이 없어요</div>'}</div>
  <div class="card"><h2>📊 항목별</h2><div class="grid"><div><h3>수입</h3>${byCat('in').map(([c,v])=>`<div class="row"><span>${esc(c)}</span><span class="sp"></span><b>${won(v)}</b>원</div>`).join('')||'<span class="hint">없음</span>'}</div><div><h3>지출</h3>${byCat('out').map(([c,v])=>`<div class="row"><span>${esc(c)}</span><span class="sp"></span><b>${won(v)}</b>원</div>`).join('')||'<span class="hint">없음</span>'}</div></div>

  <p class="hint" style="margin:0 0 6px">구글폼·네이버폼 응답을 엑셀(.xlsx)이나 CSV로 받아서 ‘📊 엑셀·CSV 불러오기’로 올리면 한 번에 추가돼요. 오른쪽 <b>구분</b>에서 사역자·준비인원을, <b>찬양팀</b> 칸으로 찬양팀을 지정해요.</p>

function vCars(){const dir=SUB.dir,L=R.cars.list.filter(c=>c.dir===dir),used=new Set(L.flatMap(c=>c.members||[])),pool=R.people.filter(p=>!used.has(p.id));

    <div class="f2" style="grid-template-columns:1fr 1fr"><label class="fld">출발시각${inp(k,'time',{ph:dir==='in'?'예) 1일차 13:00':'예) 3일차 14:00'})}</label><label class="fld">${dir==='in'?'출발장소':'도착장소'}${inp(k,'place',{ph:dir==='in'?'예) 교회 앞':'예) 교회 / 강남역'})}</label><label class="fld">탑승가능인원${inp(k,'cap',{n:1,rr:1})}</label><label class="fld">운전자${sel(k,'driver',peopleOpts(R.people,'—'))}</label></div>

   <datalist id="rBl">${blds.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>
   <div class="row" style="margin-top:8px"><button class="pri" data-act="roomAdd">+ 방 추가</button><span class="hint">방 이름표(윗부분)를 끌어서 실제 배치처럼 옮겨요. 이름을 방으로 끌어다 놓거나 ‘+ 추가’로 넣어요.</span></div></div>
  ${poolHTML(pool,'아직 방이 없는 사람')}

    const rows=R.people.map(p=>[...PF.map(([k])=>p[k]||''),p.prep==='min'?'사역자':p.prep==='staff'?'준비인원':'',p.role||'',p.duty||'',p.praise?'O':'',(p.parts||[]).join('/')]);
    dl(new Blob(['﻿'+[H,...rows].map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}),R.name+'_참석인원.csv')},
  /* 배정 */
  dir:t=>{SUB.dir=t.dataset.v;render()},
  carAdd:()=>{R.cars.list.push({id:uid(),dir:SUB.dir,type:R.cars.types[SUB.dir][0]||'',members:[]});save();render()},
  gApply:()=>{const n=Math.max(0,Math.min(60,+$('#gCnt').value||0)),G=R.grp.list;if(n<G.length){const lost=G.slice(n).reduce((s,g)=>s+(g.members||[]).length,0);if(lost&&!confirm(`${G.length-n}개 조를 줄이면 그 조의 ${lost}명이 미배정으로 돌아가요. 할까요?`))return;G.length=n}else for(let i=G.length;i<n;i++)G.push({id:uid(),name:(i+1)+'조',members:[],leader:'',staff:[],roles:{}});save();render()},
  gAuto:()=>{const G=R.grp.list;if(!G.length){toast('조 개수를 먼저 정해 주세요');return}const used=new Set(G.flatMap(g=>g.members||[]));const noPrep=$('#gNoPrep').checked;
    const L=R.people.filter(p=>!used.has(p.id)&&!(noPrep&&p.prep)).sort((a,b)=>String(a.gender||'').localeCompare(String(b.gender||''))||(parseInt(a.age)||0)-(parseInt(b.age)||0));
    L.forEach(p=>{const g=G.slice().sort((a,b)=>(a.members.length-b.members.length)||(a.members.filter(id=>(P(id)||{}).gender===p.gender).length-b.members.filter(id=>(P(id)||{}).gender===p.gender).length))[0];g.members.push(p.id)});save();render();toast(`${L.length}명을 배정했어요`)},
  gClear:()=>{if(!confirm('모든 조의 조원·조장을 비울까요?'))return;R.grp.list.forEach(g=>{g.members=[];g.leader='';g.roles={}});save();render()},
  gCopy:()=>copy(`🧩 ${R.name} 조 편성\n`+R.grp.list.map(g=>`\n[${g.name}] ${(g.members||[]).length}명`+(R.grp.useLeader&&g.leader?`\n조장: ${pn(g.leader)}`:'')+(R.grp.useStaff&&(g.staff||[]).length?`\n담당스탭: ${g.staff.map(pn).join(', ')}`:'')+`\n`+(g.members||[]).map(id=>pn(id)+((g.roles||{})[id]?'('+g.roles[id]+')':'')).join(', ')).join('\n')),
  roomAdd:()=>{const n=$('#rN').value.trim();if(!n){toast('방 이름을 적어 주세요');$('#rN').focus();return}const b=$('#rB').value.trim()||'건물',f=$('#rF').value.trim();SUB.rB=b;SUB.rF=f;
    const same=R.rooms.filter(r=>(r.building||'건물')===b&&(r.floor||'')===f).length;R.rooms.push({id:uid(),building:b,floor:f,name:n,cap:+$('#rC').value||null,gender:$('#rG').value,captain:'',members:[],x:10+(same%4)*215,y:30+Math.floor(same/4)*190});save();render();setTimeout(()=>$('#rN')&&$('#rN').focus(),30)},
  roomEdit:t=>{const r=R.rooms.find(x=>x.id===t.dataset.v);const m=modal(`<h2>✎ 방 고치기</h2><div class="f2"><label class="fld">건물<input id="eB" value="${esc(r.building||'')}"></label><label class="fld">층<input id="eF" value="${esc(r.floor||'')}"></label><label class="fld">방 이름<input id="eN" value="${esc(r.name||'')}"></label><label class="fld">수용인원<input id="eC" type="number" value="${esc(r.cap??'')}"></label><label class="fld">구분<select id="eG">${[['','구분 없음'],['남','남자방'],['여','여자방'],['스탭','스탭방']].map(([v,l])=>`<option value="${v}"${r.gender===v?' selected':''}>${l}</option>`).join('')}</select></label></div>
    <div class="row" style="margin-top:10px"><button class="pri" id="eGo">저장</button><button data-close>취소</button><span class="sp"></span><button class="danger" id="eDel">방 지우기</button></div>`);
    m.querySelector('#eGo').onclick=()=>{Object.assign(r,{building:m.querySelector('#eB').value.trim()||'건물',floor:m.querySelector('#eF').value.trim(),name:m.querySelector('#eN').value.trim()||r.name,cap:+m.querySelector('#eC').value||null,gender:m.querySelector('#eG').value});save();m.remove();render()};
    m.querySelector('#eDel').onclick=()=>{if(!confirm(`${r.name}을(를) 지울까요? 배정된 ${(r.members||[]).length}명은 미배정으로 돌아가요.`))return;R.rooms=R.rooms.filter(x=>x.id!==r.id);save();m.remove();render()}},
  roomCopy:()=>copy(`🛏️ ${R.name} 방 배정\n`+R.rooms.map(r=>`\n[${r.building||''} ${r.floor||''} ${r.name}] ${(r.members||[]).length}/${r.cap||'?'}명${r.captain?' · 방장 '+pn(r.captain):''}\n`+(r.members||[]).map(pn).join(', ')).join('\n')),
};
function fpath(id){const L=[];let c=id;while(c){const f=R.folders.find(x=>x.id===c);if(!f)break;L.unshift(f.name);c=f.parent}return L.join(' › ')}
function purge(id){R.people=R.people.filter(p=>p.id!==id);const rm=a=>(a||[]).filter(x=>x!==id);
  R.sched.forEach(t=>t.who=rm(t.who));R.programs.forEach(t=>t.who=rm(t.who));R.minutes.forEach(m=>m.att=rm(m.att));
  R.cars.list.forEach(c=>{c.members=rm(c.members);if(c.driver===id)c.driver=''});R.grp.list.forEach(g=>{g.members=rm(g.members);g.staff=rm(g.staff);if(g.leader===id)g.leader='';if(g.roles)delete g.roles[id]});
  R.rooms.forEach(r=>{r.members=rm(r.members);if(r.captain===id)r.captain=''});R.sup.forEach(s=>{if(s.owner===id)s.owner=''})}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('📋 복사했어요. 카톡에 붙여넣으세요')}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('📋 복사했어요')}catch(_){toast('복사하지 못했어요')}x.remove()}}
function indent(dir){const b=$('#mbody');if(!b)return;const v=b.value,s=b.selectionStart,e=b.selectionEnd;const ls=v.lastIndexOf('\n',s-1)+1;let le=v.indexOf('\n',Math.max(s,e-1));if(le<0)le=v.length;
  const lines=v.slice(ls,le).split('\n');let d0=0,dT=0;const out=lines.map((l,i)=>{if(dir>0){if(i===0)d0=2;dT+=2;return '  '+l}const m=l.match(/^( {1,2}|\t)/);if(!m)return l;if(i===0)d0=-m[0].length;dT-=m[0].length;return l.slice(m[0].length)});
  b.value=v.slice(0,ls)+out.join('\n')+v.slice(le);b.selectionStart=Math.max(ls,s+d0);b.selectionEnd=Math.max(ls,e+dT);b.dispatchEvent(new Event('input',{bubbles:true}));b.focus()}

/* 백업 */
async function backup(){toast('백업 파일을 만드는 중…');const files={};for(const f of R.files){try{const x=await idb.get('files',f.id);if(x){const b=x.blob||x;files[f.id]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}}catch(_){}}
  dl(new Blob([JSON.stringify({app:'camp-pack',v:1,camp:R,files})],{type:'application/json'}),`${R.name}_백업_${todayStr()}.json`)}
async function restore(file){try{const d=JSON.parse(await file.text());if(d.app!=='camp-pack'||!d.camp)throw 0;const c=fill(d.camp);const old=await idb.get('camps',c.id);
  if(old&&!confirm(`‘${old.name}’이(가) 이미 있어요. 백업 내용으로 덮어쓸까요? (취소하면 새 수련회로 추가해요)`)){const map={};c.id=uid();c.name+=' (백업)';for(const f of c.files){const n=uid();map[f.id]=n;f.id=n}c.acc.items.forEach(x=>{if(x.rcp)x.rcp=map[x.rcp]});const F={};for(const k in d.files)F[map[k]||k]=d.files[k];d.files=F}
  for(const id in d.files){const b=await (await fetch(d.files[id])).blob();await idb.put('files',id,{blob:b})}await idb.put('camps',c.id,c);location.href='./?c='+c.id}catch(e){toast('수련회 백업 파일이 아니에요')}}

/* 엑셀·CSV 불러오기 */
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const GUESS={name:/^(이름|성명|성함|name)|이름|성명/i,gender:/성별/,age:/나이|연령|생년|출생|학년/,org:/소속|교구|셀|목장|부서|학교|공동체/,addr:/사는|주소|거주|지역|동네/,phone:/연락처|전화|핸드폰|휴대폰|폰|phone/i,ins:/보험/,inT:/들어오|입소|도착|오는|참석.*시작/,outT:/나가|퇴소|귀가|떠나|가는/};
async function importXls(file){try{await loadXLSX()}catch(e){toast('엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요');return}
  let rows;try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false})}catch(e){toast('파일을 읽지 못했어요');return}
  const hi=rows.findIndex(r=>r.filter(x=>String(x).trim()).length>=2);if(hi<0){toast('내용이 없어요');return}
  const H=rows[hi].map(x=>String(x).trim()),data=rows.slice(hi+1).filter(r=>r.some(x=>String(x).trim()));
  const map={};PF.forEach(([k])=>{const i=H.findIndex((h,j)=>GUESS[k].test(h)&&!Object.values(map).includes(j));map[k]=i});
  const m=modal(`<h2>📊 엑셀·CSV 불러오기</h2><p>${data.length}명의 응답을 찾았어요. 각 항목이 어느 칸(열)인지 확인해 주세요.</p>
   <div class="f2">${PF.map(([k,l])=>`<label class="fld">${l}<select data-map="${k}"><option value="-1">— 없음 —</option>${H.map((h,j)=>`<option value="${j}"${map[k]===j?' selected':''}>${esc(h||('('+(j+1)+'번째 열)'))}</option>`).join('')}</select></label>`).join('')}</div>
   <p class="hint">이미 있는 사람(이름과 핸드폰번호가 같은 사람)은 새 내용으로 채워요.</p>
   <div class="row"><button class="pri" id="xGo">${data.length}명 추가</button><button data-close>취소</button></div>`);
  m.querySelector('#xGo').onclick=()=>{const mp={};m.querySelectorAll('[data-map]').forEach(s=>mp[s.dataset.map]=+s.value);if(mp.name<0){toast('이름 칸을 골라 주세요');return}
    let add=0,upd=0;const norm=s=>String(s||'').replace(/\D/g,'');
    data.forEach(r=>{const g=k=>mp[k]>=0?String(r[mp[k]]??'').trim():'';const name=g('name');if(!name)return;
      const o={name,age:g('age'),org:g('org'),addr:g('addr'),phone:g('phone'),inT:g('inT'),outT:g('outT')};
      const gd=g('gender');o.gender=/여|female|^f$/i.test(gd)?'여':/남|male|^m$/i.test(gd)?'남':'';
      const ins=g('ins');o.ins=/미가입|아니|없|no|x/i.test(ins)?'미가입':/가입|예|네|있|yes|o/i.test(ins)?'가입':'';
      const ex=R.people.find(p=>p.name===name&&norm(p.phone)===norm(o.phone));
      if(ex){for(const k in o)if(o[k])ex[k]=o[k];upd++}else{R.people.push({id:uid(),...o});add++}});
    save();m.remove();render();toast(`${add}명 추가${upd?`, ${upd}명 갱신`:''}했어요`)}}

/* ============ 이벤트 ============ */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT')return;const f=ACT[t.dataset.act];if(f){if(t.tagName==='A'&&t.getAttribute('href')==='#')e.preventDefault();f(t,e)}});
function apply(t){const o=objOf(t.dataset.o);if(!o)return;const k=t.dataset.k;let v=t.type==='checkbox'?t.checked:t.dataset.t==='n'?(t.value===''?null:+t.value):t.value;if(t.dataset.o==='.'&&k==='nights')v=+v;o[k]=v;save()}
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='mq'){SUB.mq=t.value;clearTimeout(t._t);t._t=setTimeout(render,250);return}
  if(t.id==='pq'){filterPeople(t.value);return}if(t.id==='poolQ'){filterPool(t.value);return}
  if(t.dataset.o==null||t.tagName==='SELECT'||t.type==='checkbox')return;apply(t);if(t.id==='mbody')updPrev()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.tagName==='SELECT'&&t.dataset.act==='addTo'){if(!t.value)return;const o=objOf(t.dataset.o);(o[t.dataset.k]=o[t.dataset.k]||[]).push(t.value);save();render();return}
  if(t.tagName==='SELECT'&&t.dataset.act==='assign'){if(t.value)assign(t.value,t.dataset.to,null);return}
  if(t.tagName==='SELECT'&&t.dataset.act==='gRole'){const g=R.grp.list.find(x=>x.id===t.dataset.g);g.roles=g.roles||{};if(t.value)g.roles[t.dataset.pid]=t.value;else delete g.roles[t.dataset.pid];save();return}
  if(t.dataset.o==null)return;if(t.tagName==='SELECT'||t.type==='checkbox')apply(t);
  if(t.dataset.o.startsWith('people#')&&t.dataset.k==='prep'){const p=objOf(t.dataset.o);p.role=''}
  if(t.dataset.rr!==undefined)rr()});
document.addEventListener('keydown',e=>{const t=e.target;
  if(t.dataset&&t.dataset.leAdd&&e.key==='Enter'&&!e.isComposing){e.preventDefault();const v=t.value.trim();if(!v)return;const a=objOf(t.dataset.leAdd);if(a.includes(v)){toast('이미 있어요');return}a.push(v);save();render();const n=$(`[data-le-add="${t.dataset.leAdd}"]`);if(n)n.focus();return}
  if(t.id==='critNew'&&e.key==='Enter'&&!e.isComposing){const v=t.value.trim();if(!v)return;const id='c_'+uid();R.venue.crit.push({id,name:v});R.venue.w[id]=0;save();render();const n=$('#critNew');if(n)n.focus();toast('가중치를 다시 맞춰 주세요 (합계 100%)');return}
  if(t.id==='chkT'&&e.key==='Enter'&&!e.isComposing){ACT.chkAdd();return}
  if(t.id==='rN'&&e.key==='Enter'&&!e.isComposing){ACT.roomAdd();return}
  if(t.id==='mbody'){if(e.key==='Tab'){e.preventDefault();indent(e.shiftKey?-1:1);return}
    if(e.key==='Enter'&&!e.isComposing&&!e.shiftKey){const v=t.value,s=t.selectionStart;const ls=v.lastIndexOf('\n',s-1)+1;const line=v.slice(ls,s);const ind=line.match(/^[\t ]*/)[0];
      if(!ind)return;e.preventDefault();let ins='\n'+ind;if(!line.trim()&&t.selectionEnd===s){/* 빈 줄에서 Enter → 한 단계 위로 */const nw=ind.slice(2);t.value=v.slice(0,ls)+nw+v.slice(s);t.selectionStart=t.selectionEnd=ls+nw.length}else{t.value=v.slice(0,s)+ins+v.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+ins.length}t.dispatchEvent(new Event('input',{bubbles:true}))}}});
/* 끌어다 놓기 */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.chip[data-pid]');if(!c)return;e.dataTransfer.setData('text/plain',JSON.stringify({pid:c.dataset.pid,from:c.dataset.from}));e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();$$('.drop-on').forEach(x=>x!==z&&x.classList.remove('drop-on'));z.classList.add('drop-on')});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('drop-on')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');$$('.drop-on').forEach(x=>x.classList.remove('drop-on'));if(!z)return;e.preventDefault();let d;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){return}if(!d||!d.pid||d.from===z.dataset.drop)return;assign(d.pid,z.dataset.drop,d.from)});
/* 파일 입력 */
$('#fileUp').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;toast('올리는 중…');for(const f of fs){const id=uid();try{await idb.put('files',id,{blob:f});R.files.push({id,folder:SUB.folder||'',name:f.name,size:f.size,type:f.type,date:new Date().toISOString()})}catch(err){toast('저장하지 못한 파일: '+f.name)}}save();render();toast(`${fs.length}개 올렸어요`)};
$('#xlsUp').onchange=e=>{const f=e.target.files[0];if(f)importXls(f)};
$('#bakUp').onchange=e=>{const f=e.target.files[0];if(f)restore(f)};
$('#rcpUp').onchange=e=>{const f=e.target.files[0];if(f){SUB.rcpFile=f;const n=$('#rcpName');if(n)n.textContent='🧾 '+f.name}};

/* ============ 시작 ============ */
(async()=>{try{await idb.open()}catch(e){$('#app').innerHTML='<div class="card"><div class="empty">이 브라우저에서는 저장소를 쓸 수 없어요. (시크릿 창이면 일반 창에서 열어 주세요)</div></div>';return}
  try{TAB=localStorage.getItem('camp-tab')||'staff'}catch(_){}if(!TABS.some(x=>x[0]===TAB))TAB='staff';
  const cid=new URLSearchParams(location.search).get('c');
  if(cid){const c=await idb.get('camps',cid);if(!c){location.replace('./');return}R=fill(c);document.title=R.name+' | 수련회 준비 패키지'}
  else CAMPS=(await idb.all('camps'))||[];
  render()})();
})();
