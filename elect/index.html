<meta name="description" content="팀장·임원 선출 도구. 추천으로 후보를 등록하고 제비뽑기, 투표(기명/무기명, 부재자 QR 투표), 투표 후 제비뽑기로 뽑아요. 반장선거처럼 바를 정(正)자로 개표해요.">

<style>
:root{--ink:#3b2a20;--cream:#fffaf0;--paper:#fff;--line:#e3d6c2;--accent:#e8503a;--gold:#f5b82e;--green:#3f9a55;--blue:#2f6fb0;--muted:#7a6a5c;--soft:#f6efe2;--red:#d1342a}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);background:#f7f1e6;font:16px/1.55 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
h1,h2,h3,.j,.top,button.big{font-family:"Jua","Apple SD Gothic Neo",sans-serif;font-weight:normal}
button{font:inherit;color:inherit;border:2px solid var(--ink);background:var(--cream);border-radius:14px;padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.pri{background:var(--accent);color:#fff}button.ok{background:var(--green);color:#fff}button.go{background:var(--blue);color:#fff}
button.sm{padding:3px 10px;font-size:14px;border-radius:10px;box-shadow:0 2px 0 var(--ink)}
button.x{border:0;box-shadow:none;background:none;padding:0 4px;color:var(--muted)}
button.big{font-size:22px;padding:12px 26px}
input,select,textarea{font:inherit;color:inherit;border:2px solid #cdbda6;border-radius:12px;padding:6px 10px;background:#fff;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:rgba(255,255,255,.95);border-bottom:4px solid var(--gold)}
.top a{color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:14px;padding:3px 10px;background:var(--cream)}
.top .ttl{flex:1;font-size:19px}
main{max-width:920px;margin:0 auto;padding:14px 12px 80px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.card h2{margin:0 0 10px;font-size:22px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.hint{font-size:14px;color:var(--muted)}
.empty{padding:16px;text-align:center;color:var(--muted);background:var(--soft);border-radius:14px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.pick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;box-shadow:0 3px 0 #cdbda6;border-color:#cdbda6}
.pick button b{font-family:Jua,sans-serif;font-weight:normal;font-size:19px}.pick button span{font-size:13px;color:var(--muted)}
.pick button.on{background:#fff4e0;border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cand{border:2px solid var(--ink);border-radius:16px;padding:10px;background:#fffdf7}
.cand .n{font-family:Jua,sans-serif;font-size:22px}
.badge{display:inline-block;border-radius:10px;padding:0 8px;font-size:13px;background:var(--soft);border:1px solid var(--line)}
/* 기표소 */
.booth{background:#3b2a20;border-radius:22px;padding:16px;color:#fff}
.paper{background:#fffef8;color:var(--ink);border-radius:8px;padding:16px;max-width:560px;margin:0 auto;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.paper h3{text-align:center;margin:0 0 4px;font-size:24px}
.slips{border:2px solid var(--ink);margin-top:10px}
.slip{display:flex;align-items:stretch;border-bottom:2px solid var(--ink);min-height:74px;cursor:pointer;user-select:none}
.slip:last-child{border-bottom:0}
.slip .no{width:46px;display:flex;align-items:center;justify-content:center;border-right:2px solid var(--ink);font-family:Jua,sans-serif;font-size:20px}
.slip .nm{flex:1;display:flex;align-items:center;padding:0 14px;font-family:Jua,sans-serif;font-size:24px;border-right:2px solid var(--ink)}
.slip .st{width:96px;display:flex;align-items:center;justify-content:center}
.slip:hover .st{background:#fff3ec}
.stamp{width:62px;height:62px;animation:stamp .25s ease-out}
@keyframes stamp{0%{transform:scale(1.8);opacity:0}100%{transform:scale(1);opacity:.92}}
.drop{animation:drop .7s ease-in forwards}@keyframes drop{to{transform:translateY(120px) scale(.6);opacity:0}}
/* 개표 */
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tl{border:2px solid var(--ink);border-radius:14px;padding:10px;background:#fff}
.tl .n{font-family:Jua,sans-serif;font-size:22px}
.tl .marks{display:flex;flex-wrap:wrap;gap:2px;min-height:44px;margin-top:4px}
.tl .marks svg{width:40px;height:40px}
.tl .cnt{font-family:Jua,sans-serif;font-size:20px;color:var(--red)}
.tl.win{border-color:var(--red);box-shadow:0 0 0 3px #ffd6cf}
.stroke{stroke:var(--red);stroke-width:4;stroke-linecap:round;fill:none}
.stroke.new{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s forwards}@keyframes draw{to{stroke-dashoffset:0}}
.opened{border:3px dashed var(--gold);border-radius:16px;padding:12px;background:#fffaf0;text-align:center;margin:10px 0}
.opened .who{font-family:Jua,sans-serif;font-size:30px;color:var(--red)}
/* 제비뽑기 */
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.lot{border:3px solid var(--ink);border-radius:16px;padding:14px 8px;text-align:center;background:#fff;font-family:Jua,sans-serif;font-size:24px;transition:transform .08s}
.lot.hl{background:var(--gold);transform:scale(1.06)}
.lot.win{background:var(--accent);color:#fff;transform:scale(1.1)}
.lot .w{display:block;font-size:14px;color:var(--muted)}.lot.win .w,.lot.hl .w{color:inherit}
.winner{text-align:center;padding:18px;border-radius:20px;background:linear-gradient(#fff6d8,#fff);border:3px solid var(--gold)}
.winner .nm{font-family:Jua,sans-serif;font-size:46px;color:var(--red)}
.qr{background:#fff;padding:8px;border-radius:12px;display:inline-block}.qr svg{width:180px;height:180px;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hist{border-bottom:1px dashed var(--line);padding:6px 0}
@media print{.top,#homeFab,#siteGuideBtn{display:none!important}}
</style>
</head><body>
<div class="top"><a href="../">← 목장</a><span class="ttl">🗳️ 팀장선출</span></div>
<main id="app"><div class="empty">불러오는 중…</div></main>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js" integrity="sha384-u4uqeACkFcoKl57rBQJHVGDd1pqhW4w8X3WjTu1ZksPdxoLqdt34jpoNkJisE25W" crossorigin="anonymous"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clip=(s,n)=>String(s??'').replace(/[\u0000-\u0009\u000b-\u001f]/g,' ').trim().slice(0,n);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296*n};
let tt;function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms||2300)}
const app=$('#app');
const STAMP=`<svg class="stamp" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="#d1342a" stroke-width="5"/><path d="M32 13V51M32 31H46" stroke="#d1342a" stroke-width="6" stroke-linecap="round"/></svg>`;
const METHODS={lot:['🎲 제비뽑기','후보 중에서 똑같은 확률(1:1)로 뽑아요'],vote:['🗳️ 투표','가장 많이 받은 사람이 뽑혀요 (동점이면 그 사람들끼리 제비뽑기)'],votelot:['🗳️🎲 투표 후 제비뽑기','받은 표 수만큼 제비를 넣고 뽑아요 (득표수:득표수)']};
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];
const params=new URLSearchParams(location.search);
const VOTE_ROOM=(params.get('v')||'').replace(/[^a-zA-Z0-9]/g,'').slice(0,16);

/* ================= 저장 (진행하는 기기) ================= */
const KEY='elect-v1';let D={cur:null,hist:[]};
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o)D=Object.assign(D,o)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('저장하지 못했어요')}};
const E=()=>D.cur;
function newElection(){D.cur={id:uid(),title:'',cands:[],method:'vote',ballot:'secret',showCount:true,votes:[],phase:'setup',room:Array.from({length:10},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(rnd(31))]).join(''),created:Date.now()};save();render()}
const CN=id=>{const c=E().cands.find(x=>x.id===id);return c?c.name:'(지운 후보)'};

/* ================= 화면 ================= */
let BOOTH=null,COUNT=null,DRAW=null;
function render(){if(VOTE_ROOM){vRemote();return}
  const e=E();if(!e){app.innerHTML=vHome();return}
  ({setup:vSetup,voting:vVoting,counting:vCounting,draw:vDrawView,done:vDone}[e.phase]||vSetup)()}

function vHome(){return `<div class="card" style="text-align:center"><h1 style="margin:0;font-size:34px">🗳️ 팀장선출</h1><p class="hint">추천으로 후보를 정하고 · 제비뽑기 · 투표 · 투표 후 제비뽑기로 뽑아요</p><button class="pri big" data-act="new">새 선출 시작하기</button></div>
 ${D.hist.length?`<div class="card"><h2>📜 지난 선출 기록</h2>${D.hist.slice().reverse().map(h=>`<div class="hist"><b>${esc(h.title||'선출')}</b> <span class="badge">${esc(METHODS[h.method][0])}</span> → <b style="color:var(--red)">${esc(h.winner)}</b> <span class="hint">${new Date(h.at).toLocaleDateString('ko-KR')}${h.summary?' · '+esc(h.summary):''}</span></div>`).join('')}<div class="row" style="margin-top:8px"><button class="sm" data-act="histClear">기록 지우기</button></div></div>`:''}`}

function vSetup(){const e=E();
  app.innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">① 무엇을 뽑나요?</h2><span class="sp"></span><button class="sm" data-act="quit">처음으로</button></div>
   <input id="title" value="${esc(e.title)}" placeholder="예) 찬양팀 팀장 선출" style="width:100%;font-size:20px;margin-top:6px"></div>
  <div class="card"><h2>② 추천으로 후보 등록</h2>
   <div class="row"><input id="cName" placeholder="추천받은 사람 이름" style="width:170px"><input id="cBy" placeholder="추천한 사람 (선택)" style="width:150px"><input id="cWhy" placeholder="추천 이유 (선택)" style="flex:1;min-width:160px"><button class="pri" data-act="addCand">+ 추천</button></div>
   <p class="hint" style="margin:6px 0">같은 이름을 또 추천하면 추천 수가 늘어나요. 본인이 원하지 않으면 ×로 빼 주세요.</p>
   ${e.cands.length?`<div class="cands">${e.cands.map((c,i)=>`<div class="cand"><div class="row"><span class="badge">${i+1}번</span><span class="n">${esc(c.name)}</span><span class="sp"></span><button class="x" data-act="delCand" data-v="${c.id}" title="빼기">✕</button></div><div class="hint">추천 ${c.recs.length}표${c.recs.filter(r=>r.by).length?' · '+c.recs.filter(r=>r.by).map(r=>esc(r.by)).join(', '):''}</div>${c.recs.filter(r=>r.why).map(r=>`<div style="font-size:14px">💬 ${esc(r.why)}</div>`).join('')}</div>`).join('')}</div>`:'<div class="empty">추천받은 후보를 등록해 주세요</div>'}</div>
  <div class="card"><h2>③ 어떻게 뽑을까요?</h2><div class="pick">${Object.entries(METHODS).map(([k,[l,d]])=>`<button class="${e.method===k?'on':''}" data-act="method" data-v="${k}"><b>${l}</b><span>${d}</span></button>`).join('')}</div>
   ${e.method!=='lot'?`<h3 style="margin:14px 0 6px">투표 방식</h3><div class="pick"><button class="${e.ballot==='secret'?'on':''}" data-act="ballot" data-v="secret"><b>🙈 무기명</b><span>누가 누구를 찍었는지 남기지 않아요</span></button><button class="${e.ballot==='named'?'on':''}" data-act="ballot" data-v="named"><b>✍️ 기명</b><span>투표할 때 내 이름을 적어요 (개표 때 보여요)</span></button></div>
   <h3 style="margin:14px 0 6px">득표수 공개</h3><div class="pick"><button class="${e.showCount?'on':''}" data-act="show" data-v="1"><b>👀 공개</b><span>바를 정(正)자로 하나씩 개표하고 표 수를 보여 줘요</span></button><button class="${!e.showCount?'on':''}" data-act="show" data-v="0"><b>🤐 비공개</b><span>${e.method==='votelot'?'표 수를 숨기고 그 비율대로 제비만 뽑아요':'표 수는 숨기고 뽑힌 사람만 알려 줘요'}</span></button></div>`:''}</div>
  <div class="row" style="justify-content:center"><button class="pri big" data-act="start" ${e.cands.length<1?'disabled':''}>${e.method==='lot'?'🎲 제비뽑기 하러 가기':'🗳️ 투표 시작'}</button></div>`;
  const ent=$('#cWhy'),nm=$('#cName');[nm,$('#cBy'),ent].forEach(x=>x.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.isComposing)ACT.addCand()}));
  $('#title').oninput=ev=>{e.title=clip(ev.target.value,40);save()}}

/* ---------- 투표 (기표소) ---------- */
function vVoting(){const e=E(),n=e.votes.length,remote=e.votes.filter(v=>v.remote).length;
  if(BOOTH){vBooth();return}
  const url=location.origin+location.pathname+'?v='+e.room;let qr='';try{const q=qrcode(0,'M');q.addData(url);q.make();qr=q.createSvgTag(5,2)}catch(_){}
  app.innerHTML=`<div class="card" style="text-align:center"><h2>🗳️ ${esc(e.title||'투표')} <span class="badge">${e.ballot==='named'?'✍️ 기명':'🙈 무기명'}</span></h2>
   <div style="font-family:Jua,sans-serif;font-size:42px;color:var(--red)">📮 ${n}표</div><div class="hint">지금까지 들어온 표${remote?` (부재자 ${remote}표 포함)`:''} · 누구를 찍었는지는 개표 전까지 보이지 않아요</div>
   <div class="row" style="justify-content:center;margin-top:14px"><button class="go big" data-act="booth">✍️ 기표소 들어가기</button></div>
   <p class="hint">한 사람씩 기표소에 들어가 투표하고, 투표함에 넣은 뒤 다음 사람에게 넘겨요.</p></div>
  <div class="card"><div class="row"><h2 style="margin:0">📱 부재자 투표 (QR)</h2><span class="sp"></span><span class="badge" id="netSt">연결 준비 중…</span></div>
   <div class="row" style="align-items:flex-start;margin-top:8px"><div class="qr">${qr}</div><div style="flex:1;min-width:220px"><p style="margin:0 0 6px">이 자리에 없는 사람은 QR을 찍거나 링크를 받아 자기 휴대폰으로 투표해요. <b>이 화면(진행 기기)이 켜져 있어야</b> 표가 들어와요.</p>
   <input readonly value="${esc(url)}" style="width:100%;font-size:13px" onclick="this.select()"><div class="row" style="margin-top:6px"><button class="sm" data-act="copyUrl">🔗 링크 복사</button></div><p class="hint">한 휴대폰에서는 한 번만 투표할 수 있어요.</p></div></div></div>
  <div class="row" style="justify-content:center"><button class="sm" data-act="back">← 설정으로</button><span class="sp"></span><button class="pri big" data-act="endVote" ${n?'':'disabled'}>🔒 투표 종료하고 개표하기</button></div>`;
  hostNet()}
function vBooth(){const e=E(),b=BOOTH;
  if(b.step==='name'){app.innerHTML=`<div class="booth"><div class="paper"><h3>✍️ 기명 투표</h3><p style="text-align:center">투표하는 사람의 이름을 적어 주세요</p><input id="voter" placeholder="내 이름" style="width:100%;font-size:22px;text-align:center"><div class="row" style="justify-content:center;margin-top:12px"><button data-act="boothOut">취소</button><button class="pri" data-act="boothName">다음 →</button></div></div></div>`;
    const v=$('#voter');v.focus();v.onkeydown=ev=>{if(ev.key==='Enter'&&!ev.isComposing)ACT.boothName()};return}

/* ---------- 개표 ---------- */
function strokesSVG(k,isNew){const P=['M6 7H34','M20 7V34','M20 20H31','M10 20V34','M4 34H36'];return `<svg viewBox="0 0 40 40">${P.slice(0,k).map((d,i)=>`<path class="stroke${isNew&&i===k-1?' new':''}" d="${d}"/>`).join('')}</svg>`}
function marks(n,anim){let h='';for(let g=0;g<Math.ceil(n/5);g++){const k=Math.min(5,n-g*5);h+=strokesSVG(k,anim&&g===Math.ceil(n/5)-1)}return h}
function vCounting(){const e=E();if(!COUNT){const order=e.votes.map((v,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(rnd(i+1));[order[i],order[j]]=[order[j],order[i]]}COUNT={order,idx:0,tally:{},bad:0,last:null}}
  const C=COUNT,total=e.votes.length,done=C.idx>=total,max=Math.max(0,...Object.values(C.tally));
  const lastV=C.last!=null?e.votes[C.last]:null;
  app.innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">📊 개표 ${C.idx}/${total}</h2><span class="sp"></span>${done?'':`<button class="sm" data-act="countAll">한꺼번에 개표</button>`}</div>
   ${lastV?`<div class="opened"><div class="hint">${C.idx}번째 표</div><div class="who">${lastV.cand?esc(CN(lastV.cand)):'무효표'}</div>${lastV.reason?`<div>💬 ${esc(lastV.reason)}</div>`:''}${e.ballot==='named'&&lastV.voter?`<div class="hint">✍️ ${esc(lastV.voter)}${lastV.remote?' (부재자)':''}</div>`:lastV.remote?'<div class="hint">📱 부재자 투표</div>':''}</div>`:`<div class="opened"><div class="hint">투표함을 열었어요. ‘한 표 열기’를 눌러 하나씩 읽어요</div></div>`}
   <div class="tally">${e.cands.map(c=>{const n=C.tally[c.id]||0;return `<div class="tl ${done&&n===max&&n>0?'win':''}"><div class="row"><span class="n">${esc(c.name)}</span><span class="sp"></span><span class="cnt">${n}표</span></div><div class="marks">${marks(n,lastV&&lastV.cand===c.id)}</div></div>`}).join('')}${C.bad?`<div class="tl"><div class="row"><span class="n">무효</span><span class="sp"></span><span class="cnt">${C.bad}표</span></div><div class="marks">${marks(C.bad)}</div></div>`:''}</div>
   <div class="row" style="justify-content:center;margin-top:14px">${done?`<button class="pri big" data-act="afterCount">${e.method==='votelot'?'🎲 득표수만큼 제비뽑기':'🏆 결과 보기'}</button>`:`<button class="go big" data-act="openOne">📮 한 표 열기</button>`}</div></div>`}

/* ---------- 제비뽑기 ---------- */
function startDraw(pool,note){DRAW={pool,note,hl:null,win:null,running:false};E().phase='draw';save();render()}
function vDrawView(){const e=E(),d=DRAW;if(!d){if(e.method==='lot'){DRAW={pool:e.cands.map(c=>({id:c.id,name:c.name,w:1})),note:'후보 모두 같은 확률이에요 (1:1)',hl:null,win:null,running:false};return vDrawView()}e.phase='counting';COUNT=null;save();render();return}
  const tot=d.pool.reduce((s,x)=>s+x.w,0),showW=d.pool.some(x=>x.w!==1)?(e.showCount!==false):false;
  app.innerHTML=`<div class="card" style="text-align:center"><h2>🎲 제비뽑기</h2><p class="hint" style="margin:0">${esc(d.note||'')}</p>
   ${showW?`<div class="j" style="font-size:20px;margin:6px 0">${d.pool.map(x=>esc(x.name)).join(' : ')} = ${d.pool.map(x=>x.w).join(' : ')}</div>`:''}
   <div class="lots">${d.pool.map(x=>`<div class="lot ${d.win===x.id?'win':d.hl===x.id?'hl':''}" data-id="${x.id}">${esc(x.name)}${showW?`<span class="w">제비 ${x.w}개 · ${Math.round(x.w/tot*100)}%</span>`:''}</div>`).join('')}</div>
   ${d.win?`<div class="winner"><div class="hint">뽑힌 사람</div><div class="nm">🎉 ${esc(d.pool.find(x=>x.id===d.win).name)}</div></div><div class="row" style="justify-content:center;margin-top:12px"><button class="pri big" data-act="toDone">결과 정리</button></div>`:`<button class="pri big" data-act="spin" ${d.running?'disabled':''}>${d.running?'두구두구…':'🎲 제비 뽑기!'}</button>`}</div>`}
function spin(){const d=DRAW;if(!d||d.running)return;d.running=true;
  const tot=d.pool.reduce((s,x)=>s+x.w,0);let r=rnd(tot),win=d.pool[d.pool.length-1].id;for(const x of d.pool){if(r<x.w){win=x.id;break}r-=x.w}
  let i=Math.floor(rnd(d.pool.length)),delay=60,steps=26+Math.floor(rnd(d.pool.length*2));
  const tick=()=>{d.hl=d.pool[i%d.pool.length].id;vDrawView();steps--;
    if(steps<=0&&d.hl===win){d.win=win;d.running=false;setTimeout(vDrawView,450);return}
    if(steps<=0)delay=Math.min(delay*1.08,380);else if(steps<10)delay*=1.18;i++;setTimeout(tick,delay)};tick()}

    e.phase='counting';e.closed=Date.now();save();COUNT=null;
    if(!e.showCount){const t=tallyAll();ACT.afterCount(null,t);return}render()},
  openOne:()=>{const C=COUNT,e=E();if(C.idx>=e.votes.length)return;const v=e.votes[C.order[C.idx]];C.last=C.order[C.idx];C.idx++;if(v.cand&&e.cands.some(c=>c.id===v.cand))C.tally[v.cand]=(C.tally[v.cand]||0)+1;else C.bad++;render()},

    if(e.method==='votelot'){startDraw(cs.map(c=>({id:c.id,name:c.name,w:tally[c.id]})),e.showCount?'받은 표 수만큼 제비를 넣었어요':'받은 표 수만큼 제비를 넣었어요 (표 수는 비공개)');DRAW.summary=sumTxt;return}

/* ================= 부재자 투표 연결 (MQTT 중계) ================= */
let NET=null;
function mqttOpen(url,ms){return new Promise(res=>{if(typeof mqtt=='undefined')return res(null);let done=false;
  const cl=mqtt.connect(url,{connectTimeout:ms,reconnectPeriod:3000,clientId:'el'+Math.random().toString(36).slice(2,12)});
  cl.on('connect',()=>{if(!done){done=true;res(cl)}});setTimeout(()=>{if(!done){done=true;try{cl.end(true)}catch(e){}res(null)}},ms)})}
const base=room=>'chiyoung-elect/v1/'+room;
function ballotMsg(){const e=E();return{t:'ballot',title:e.title,ballot:e.ballot,open:e.phase==='voting',cands:e.cands.map(c=>({id:c.id,name:c.name}))}}
function hostNet(){const st=()=>{const b=$('#netSt');if(b)b.textContent=NET&&NET.n?'📡 부재자 투표 받는 중':'연결 준비 중…'};
  if(NET&&NET.room===E().room){st();return}NET={room:E().room,n:0,seen:{}};const myRoom=NET.room;
  BROKERS.forEach(async url=>{const cl=await mqttOpen(url,8000);if(!cl||!NET||NET.room!==myRoom){try{cl&&cl.end(true)}catch(_){}return}NET.n++;st();
    const b=base(myRoom);cl.subscribe(b+'/h',{qos:1});cl.on('connect',()=>cl.subscribe(b+'/h',{qos:1}));
    cl.on('message',(tp,buf)=>{let d;try{d=JSON.parse(buf.toString())}catch(_){return}if(!d||!d.from||!d.m)return;
      const from=String(d.from).replace(/[^a-z0-9]/gi,'').slice(0,24),reply=m=>cl.publish(b+'/c/'+from,JSON.stringify(m),{qos:1}),e=E();
      if(!e||e.room!==myRoom)return reply({t:'err',msg:'이 투표는 끝났어요'});
      if(d.m.t==='hello')return reply(ballotMsg());
      if(d.m.t==='vote'){const m=d.m,vid=String(m.vid||'').slice(0,30);
        if(e.phase!=='voting')return reply({t:'err',msg:'투표가 이미 끝났어요'});
        if(e.votes.some(v=>v.dev===from)||(vid&&e.votes.some(v=>v.id===vid)))return reply({t:'ok',dup:true});
        if(!e.cands.some(c=>c.id===m.cand))return reply({t:'err',msg:'후보를 다시 골라 주세요'});
        const voter=e.ballot==='named'?clip(m.name,12):'';if(e.ballot==='named'&&!voter)return reply({t:'err',msg:'이름을 적어 주세요'});
        e.votes.push({id:vid||uid(),cand:m.cand,reason:clip(m.reason,200),voter,remote:true,dev:from,at:Date.now()});save();reply({t:'ok'});
        toast('📱 부재자 표가 한 장 들어왔어요');if(e.phase==='voting'&&!BOOTH)render()}})})}

  $('#rSend').onclick=sendVote}
async function remoteConnect(){try{RV.dev=localStorage.getItem('elect-dev')}catch(_){}if(!RV.dev){RV.dev='d'+Math.random().toString(36).slice(2,12);try{localStorage.setItem('elect-dev',RV.dev)}catch(_){}}

    let heard=false;cl.subscribe(b+'/c/'+RV.dev,{qos:1});cl.on('connect',()=>cl.subscribe(b+'/c/'+RV.dev,{qos:1}));
    cl.on('message',(tp,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(_){return}heard=true;
      if(m.t==='ballot'){RV.b=m;if(RV.st==='conn'||RV.st==='closed')RV.st=m.open?'vote':'closed';vRemote()}
      else if(m.t==='ok'){RV.st='sent';try{localStorage.setItem('elect-voted-'+VOTE_ROOM,'1')}catch(_){}vRemote()}
      else if(m.t==='err'){toast(m.msg||'투표하지 못했어요',3500);const btn=$('#rSend');if(btn)btn.disabled=false}});
    const hello=()=>cl.publish(b+'/h',JSON.stringify({from:RV.dev,m:{t:'hello'}}),{qos:1});
    setTimeout(hello,300);for(let i=0;i<30&&!heard;i++){await new Promise(r=>setTimeout(r,300));if(i===10||i===20)hello()}
    if(heard){RV.cl=cl;return}try{cl.end(true)}catch(_){}}
  RV.st='fail';vRemote()}
function sendVote(){if(!RV.cl||!RV.cand)return;const name=$('#rName')?clip($('#rName').value,12):'';if(RV.b.ballot==='named'&&!name){toast('이름을 적어 주세요');return}
  if(!confirm(`${RV.b.cands.find(c=>c.id===RV.cand).name}님에게 투표할까요? 넣으면 바꿀 수 없어요.`))return;
  $('#rSend').disabled=true;RV.vid=RV.vid||uid();
  RV.cl.publish(base(VOTE_ROOM)+'/h',JSON.stringify({from:RV.dev,m:{t:'vote',vid:RV.vid,cand:RV.cand,reason:clip($('#rWhy').value,200),name}}),{qos:1});
  setTimeout(()=>{if(RV.st!=='sent'){toast('아직 확인이 안 왔어요. 잠시 뒤 다시 눌러 주세요',3500);const btn=$('#rSend');if(btn)btn.disabled=false}},8000)}

if(VOTE_ROOM){document.querySelector('.top .ttl').textContent='🗳️ 부재자 투표';remoteConnect()}else render();
})();
</script>
