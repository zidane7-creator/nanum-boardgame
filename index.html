<style>
:root{--ink:#3b2a20;--sky1:#7fd0f3;--sky2:#d6f2fc;--grass:#a9d86e;--grass2:#93c95a;--pen:#c3e78f;--fence:#f4bdb6;--fence2:#d98680;--wood:#c98a4b;--wood2:#8a5528;--cream:#fffaf0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sky2)}
body{font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);overflow-x:hidden;background:var(--grass)}
a{color:inherit}
/* sky */
.sky{position:relative;height:330px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2))}
.sun{position:absolute;top:-20px;right:-10px;width:170px;height:170px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.95;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:150%;left:15%;bottom:20%}
.cloud::after{width:40%;height:120%;right:12%;bottom:25%}
.c1{width:220px;height:60px;top:150px;left:-240px;animation-duration:70s}
.c2{width:160px;height:46px;top:70px;left:-200px;animation-duration:95s;animation-delay:-40s}
.c3{width:260px;height:70px;top:210px;left:-280px;animation-duration:120s;animation-delay:-80s}
@keyframes drift{to{transform:translateX(calc(100vw + 560px))}}
.title{position:absolute;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 12px}
.ttl{display:flex;align-items:center;gap:6px}
.ttl .chick{font-size:clamp(22px,6vw,34px);animation:bob 1.6s ease-in-out infinite}
.ttl .chick:last-child{animation-delay:.4s;transform:scaleX(-1)}
.cells{display:flex;background:#fff;border-top:3px double #6b5a4e;border-bottom:3px double #6b5a4e;padding:2px 0}
.cells span{width:clamp(20px,5.6vw,46px);height:clamp(28px,7.4vw,52px);display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4.6vw,32px);border-right:1.5px solid #6b5a4e}
.cells span:first-child{border-left:1.5px solid #6b5a4e}
.cells span.sp{width:clamp(8px,2vw,18px)}
.cells span.r{color:#e8503a}
.sub{background:rgba(255,255,255,.85);border-radius:20px;padding:6px 16px;font-size:clamp(14px,3.8vw,18px)}
/* hills + trees */
.hills{position:relative;height:90px;margin-top:-90px}
.hills::before,.hills::after{content:"";position:absolute;bottom:0;border-radius:50% 50% 0 0;background:var(--grass2)}
.hills::before{left:-10%;width:70%;height:90px}
.hills::after{right:-12%;width:75%;height:70px;background:var(--grass)}
.tree{position:absolute;bottom:20px;z-index:1}
.t1{left:2%;width:clamp(60px,12vw,120px)}.t2{left:clamp(48px,10vw,110px);width:clamp(46px,9vw,90px)}
.t3{right:3%;width:clamp(70px,13vw,130px)}
/* ranch */
.ranch{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:30px 16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,48px) clamp(14px,3vw,36px)}
.pen{position:relative;min-height:220px;padding:46px 10px 24px;background:var(--pen);background-image:radial-gradient(#b2dc78 18%,transparent 20%),radial-gradient(#b2dc78 18%,transparent 20%);background-size:26px 26px;background-position:0 0,13px 13px;border-radius:4px;box-shadow:inset 0 0 0 6px var(--fence),inset 0 0 0 8px var(--fence2),0 6px 0 rgba(0,0,0,.08)}
.pen::before,.pen::after{content:"";position:absolute;left:-6px;right:-6px;height:22px;background:repeating-linear-gradient(90deg,var(--fence2) 0 2px,var(--fence) 2px 11px,var(--fence2) 11px 13px,transparent 13px 19px);border-radius:3px}
.pen::before{top:-12px}.pen::after{bottom:-12px}
.post{position:absolute;width:14px;height:34px;background:var(--fence);border:2px solid var(--fence2);border-radius:4px 4px 2px 2px;z-index:1}
.post.a{top:-18px;left:-10px}.post.b{top:-18px;right:-10px}.post.c{bottom:-18px;left:-10px}.post.d{bottom:-18px;right:-10px}
.sign{position:absolute;top:-36px;left:50%;transform:translateX(-50%) rotate(-2deg);z-index:3;display:flex;flex-direction:column;align-items:center}
.sign b{display:block;font-weight:normal;background:var(--wood);color:var(--cream);border:3px solid var(--wood2);border-radius:10px;padding:calc(.3em + 1.5px) .9em calc(.3em - 1.5px);line-height:1;font-size:clamp(18px,4.6vw,26px);box-shadow:0 3px 0 var(--wood2);white-space:nowrap;text-shadow:1px 1px 0 var(--wood2)}
.sign i{display:block;width:8px;height:16px;background:var(--wood2)}
.pen:nth-child(2) .sign{transform:translateX(-50%) rotate(2deg)}
.flock{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:6px 4px}
/* sheep */
.sheep{position:relative;background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;width:clamp(74px,19vw,128px);display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent}
.sheep svg{width:100%;display:block;overflow:visible;animation:graze var(--d,3s) ease-in-out var(--dl,0s) infinite}
.sheep.flip svg{scale:-1 1}
.sheep:hover svg,.sheep:focus-visible svg{animation:hopS .5s ease-in-out infinite}
.sheep.jump svg{animation:jumpS .5s ease-out}
.sheep:focus-visible{outline:3px dashed var(--ink);outline-offset:4px;border-radius:12px}
.lb{margin-top:4px;background:var(--cream);border:2px solid var(--ink);border-radius:12px;padding:calc(.31em + 1px) .7em calc(.31em - 1px);font-size:clamp(11px,3vw,15px);line-height:1.15;display:inline-flex;align-items:center;justify-content:center;word-break:keep-all;text-align:center;box-shadow:0 2px 0 var(--ink)}
.open .lb{background:#ffe27a}
.tag{position:absolute;top:17%;right:5%;background:#e8503a;color:#fff;font-size:10px;line-height:1;border-radius:8px;padding:.27em .6em;border:1.5px solid var(--ink);z-index:2;display:inline-flex;align-items:center}
.bubble{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:1px 8px;font-size:13px;white-space:nowrap;animation:pop .5s ease-out forwards;pointer-events:none;z-index:4}
@keyframes graze{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-3px) rotate(-1.5deg)}55%{transform:translateY(0) rotate(1deg)}}
@keyframes hopS{50%{transform:translateY(-10px) rotate(-4deg)}}
@keyframes jumpS{40%{transform:translateY(-26px) rotate(-8deg) scale(1.05)}100%{transform:translateY(0)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}30%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{opacity:1;transform:translate(-50%,-4px) scale(1)}}
/* front fence + footer */
.front{height:44px;margin-top:10px;background:linear-gradient(transparent 14px,var(--fence2) 14px 16px,transparent 16px 28px,var(--fence2) 28px 30px,transparent 30px),repeating-linear-gradient(90deg,var(--fence2) 0 2px,var(--fence) 2px 16px,var(--fence2) 16px 18px,transparent 18px 26px)}
.about{background:var(--grass2);padding:22px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.about .in{max-width:760px;margin:0 auto;background:rgba(255,250,240,.92);border:2px solid var(--ink);border-radius:18px;padding:18px 20px;line-height:1.6;font-size:15px;word-break:keep-all}
.about h2{font-size:19px;margin:0 0 6px}.about ul{margin:6px 0 4px;padding-left:20px}.about li b{font-weight:normal;color:#b0442f}
.about small{display:block;margin-top:10px;opacity:.6;text-align:center}
.vol{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:25;display:flex;align-items:center;gap:6px;background:rgba(255,250,240,.92);border:2px solid var(--ink);border-radius:20px;padding:4px 10px 4px 6px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.vol button{border:0;background:none;font-size:20px;cursor:pointer;padding:0 2px;line-height:1}
.vol input{width:96px;accent-color:#e8503a}
.grp{position:fixed;inset:0;z-index:28;background:rgba(40,30,20,.45);display:none;align-items:center;justify-content:center;padding:40px 18px 18px}
.grp.show{display:flex;animation:gin .25s ease-out}@keyframes gin{from{opacity:0}}
.grp .gbox{width:min(560px,100%);min-height:200px;padding-top:56px}
.grp .gx{position:absolute;top:10px;right:12px;z-index:4;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--cream);font-size:16px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--cream);border:2px solid var(--ink);border-radius:18px;padding:10px 18px;font-size:16px;box-shadow:0 4px 0 var(--ink);transition:.25s;z-index:20;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){.sky{height:300px}.ranch{padding:30px 14px 16px}.pen{padding:42px 4px 22px;min-height:0}.flock{gap:8px 0}.sun{width:120px;height:120px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* day / night (BMNT·EENT, daynight.js) */
.sky .skyL{position:absolute;inset:0;opacity:0;transition:opacity 2.5s;pointer-events:none}
.sky .skyT{background:linear-gradient(#34407e,#8a6fae 35%,#f3a07a 80%,#ffd49a)}
.sky .skyN{background:linear-gradient(#060d27,#14224f 60%,#26386e)}
.sky .stars{position:absolute;inset:0 0 25% 0;opacity:0;transition:opacity 2.5s;pointer-events:none}
.sky .stars i{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.sky .moon{position:absolute;top:20px;right:34px;width:96px;height:96px;opacity:0;transition:opacity 2.5s}
.sun,.cloud,.tree,.hills,.front{transition:opacity 2.5s,filter 2.5s}
html.sc-dusk .sky .skyT{opacity:.85}html.sc-dusk .sun{filter:hue-rotate(-28deg) saturate(1.3)}
html.sc-night{--grass:#577f41;--grass2:#466e3a;--pen:#a9cf7e;--sky2:#26386e}
html.sc-night .sky .skyN,html.sc-night .sky .stars,html.sc-night .sky .moon{opacity:1}
html.sc-night .sun{opacity:0}html.sc-night .cloud{opacity:.12}
html.sc-night .tree,html.sc-night .hills,html.sc-night .front{filter:brightness(.6) saturate(.85)}
/* shepherd parade on the hills */
.parade{position:absolute;left:0;right:0;bottom:4px;height:0;z-index:2}
.parade .pw{position:absolute;bottom:0;transform:translateX(-50%)}
.parade .pw svg,.parade .pw img{display:block;overflow:visible;transform-origin:50% 100%;-webkit-user-drag:none;user-select:none}
.parade .pw.flip svg,.parade .pw.flip img{transform:scaleX(-1)}
.parade .walk svg,.parade .walk img{animation:pwalk .75s ease-in-out infinite}
.parade .graze svg,.parade .graze img{animation:pgraze 2.4s ease-in-out infinite}
.parade .flip.walk svg,.parade .flip.walk img{animation-name:pwalkF}.parade .flip.graze svg,.parade .flip.graze img{animation-name:pgrazeF}
@keyframes pwalk{50%{transform:translateY(-3px) rotate(-1.5deg)}}@keyframes pwalkF{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-3px) rotate(-1.5deg)}}
@keyframes pgraze{50%{transform:translateY(2px) rotate(2deg)}}@keyframes pgrazeF{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(2px) rotate(2deg)}}
.parade .jesus{cursor:pointer}
.parade .say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:3px 10px;font-size:13px;white-space:nowrap;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){.parade .pw svg,.parade .pw img{animation:none!important}}
.parade .jesus .ft,.parade .jesus .armB,.parade .jesus .staff{transform-box:fill-box}
.parade .jesus .armB{transform-origin:20% 5%}.parade .jesus .staff{transform-origin:85% 15%}
.parade .jesus.walk .ftL{animation:jstep .9s ease-in-out infinite}
.parade .jesus.walk .ftR{animation:jstep .9s ease-in-out -.45s infinite}
.parade .jesus.walk .armB{animation:jarm .9s ease-in-out infinite}
.parade .jesus.walk .staff{animation:jstaff 1.8s ease-in-out infinite}
.parade .jesus.graze .staff{animation:jstaff 3.6s ease-in-out infinite}
@keyframes jstep{0%,100%{transform:translate(-7px,0)}25%{transform:translate(0,-7px)}50%{transform:translate(7px,0)}}
@keyframes jarm{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes jstaff{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-7deg)}}
@media (prefers-reduced-motion:reduce){.parade .jesus *{animation:none!important}}

<script>

const $=id=>document.getElementById(id);

$("cells").innerHTML=[...SITE].map((c,i)=>c==" "?'<span class="sp"></span>':'<span'+(c=="교"||c=="회"?' class="r"':'')+'>'+c+'</span>').join("");
/* cute sheep (fluffy scalloped wool, peach face, white tuft) */
const SHEEP=(()=>{const O="#8a776a",W="#fffaf2",F="#f6c58e",E="#eab07a",LEG="#f4d8c9";
 const puff=(cx,cy,rx,ry,n,bump)=>{let d="";for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a);d+=(i?"A"+bump+" "+bump+" 0 0 1 ":"M")+x.toFixed(1)+" "+y.toFixed(1)+" "}return d+"Z"};
 const fluff=[[58,40],[74,52],[48,60],[66,66],[82,40]].map(([x,y])=>'<path d="M'+x+' '+y+'q3 -3 6 0" fill="none" stroke="#e4d8cc" stroke-width="2" stroke-linecap="round"/>').join("");
 return '<svg viewBox="0 0 110 96" aria-hidden="true">'+
  '<g fill="'+LEG+'" stroke="'+O+'" stroke-width="2.5"><rect x="36" y="70" width="9" height="17" rx="4.5"/><rect x="50" y="72" width="9" height="16" rx="4.5"/><rect x="70" y="70" width="9" height="16" rx="4.5"/><rect x="83" y="68" width="9" height="16" rx="4.5"/></g>'+
  '<path d="'+puff(64,50,36,26,16,8)+'" fill="'+W+'" stroke="'+O+'" stroke-width="3" stroke-linejoin="round"/>'+fluff+
  '<g stroke="'+O+'" stroke-width="2.5"><ellipse cx="17" cy="55" rx="8" ry="5" fill="'+E+'" transform="rotate(25 17 55)"/><ellipse cx="51" cy="55" rx="8" ry="5" fill="'+E+'" transform="rotate(-25 51 55)"/></g>'+
  '<ellipse cx="34" cy="62" rx="16" ry="15" fill="'+F+'" stroke="'+O+'" stroke-width="3"/>'+
  '<path d="'+puff(34,47,14,7,9,4.5)+'" fill="'+W+'" stroke="'+O+'" stroke-width="2.5" stroke-linejoin="round"/>'+
  '<circle cx="28" cy="62" r="2" fill="#4a3a30"/><circle cx="40" cy="62" r="2" fill="#4a3a30"/>'+
  '<ellipse cx="24" cy="68" rx="3.2" ry="2" fill="#ff9fa6" opacity=".7"/><ellipse cx="44" cy="68" rx="3.2" ry="2" fill="#ff9fa6" opacity=".7"/>'+
  '<path d="M31 68q3 2.5 6 0" fill="none" stroke="#4a3a30" stroke-width="1.6" stroke-linecap="round"/></svg>'})();
const SAY=["메에~","음메~","매애!","메~ 🎵"];
// ---- sheep bleat "메에에~" (synthesized: buzzy voice + fast vibrato + vowel formants) ----
let AC=null,VOL=.7;try{const v=localStorage.getItem("homeVol");if(v!==null)VOL=+v}catch(e){}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=="suspended")AC.resume();return AC}
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>ac(),{once:true,passive:true}));
function bleat(pitch){const a=AC;if(!a||a.state!="running")return;
 // a grazing adult sheep: nasal "mm" opening into a wavering, breathy "baaa-ah", sometimes twice
 const n=Math.random()<.35?2:1;let t=a.currentTime;for(let k=0;k<n;k++){one(t,pitch*(k?0.94:1),k?.55:1);t+=.62+Math.random()*.1}
 function one(t,p,amp){const dur=.75+Math.random()*.45,f0=(p||220)*.78;
  if(VOL<=0)return;const out=a.createGain();out.gain.value=.95*amp*VOL*1.4;out.connect(a.destination);
  // voice: rich buzzy source with a nasal start
  const o=a.createOscillator();o.type="sawtooth";
  o.frequency.setValueAtTime(f0*.9,t);o.frequency.linearRampToValueAtTime(f0*1.12,t+.16);o.frequency.linearRampToValueAtTime(f0*1.04,t+dur*.6);o.frequency.linearRampToValueAtTime(f0*.86,t+dur);
  // the bleat's wobble: uneven quaver in pitch and loudness
  const q=a.createOscillator(),qg=a.createGain();q.type="triangle";q.frequency.setValueAtTime(7+Math.random()*3,t);q.frequency.linearRampToValueAtTime(10+Math.random()*4,t+dur);qg.gain.value=f0*.05;q.connect(qg).connect(o.frequency);
  const am=a.createGain(),qa=a.createGain();am.gain.value=.7;qa.gain.value=.3;q.connect(qa).connect(am.gain);
  // mouth: closed (mm) -> open (aa)
  const lp=a.createBiquadFilter();lp.type="lowpass";lp.Q.value=2;lp.frequency.setValueAtTime(450,t);lp.frequency.exponentialRampToValueAtTime(3200,t+.14);lp.frequency.exponentialRampToValueAtTime(1600,t+dur);
  const env=a.createGain();env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(.3,t+.07);env.gain.setValueAtTime(.3,t+dur*.55);env.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(am).connect(lp).connect(env);
  [[820,6,1.1],[1350,7,.8],[2650,9,.4],[300,3,.5]].forEach(([fr,qq,g])=>{const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=fr*(.95+Math.random()*.1);f.Q.value=qq;const gg=a.createGain();gg.gain.value=g*2;env.connect(f).connect(gg).connect(out)});
  // breath
  const len=Math.ceil(a.sampleRate*dur),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const ns=a.createBufferSource();ns.buffer=buf;const hp=a.createBiquadFilter();hp.type="bandpass";hp.frequency.value=2200;hp.Q.value=.8;const ng=a.createGain();ng.gain.value=.05;ns.connect(hp).connect(ng).connect(env);
  [o,q,ns].forEach(x=>{x.start(t);x.stop(t+dur+.05)})}}
// ---- sound volume (remembered on this device) ----
{const r=document.getElementById("volr"),b=document.getElementById("volb");let last=VOL||.7;
 const sync=()=>{r.value=Math.round(VOL*100);b.textContent=VOL<=0?"🔇":VOL<.4?"🔉":"🔊"};
 const save=()=>{try{localStorage.setItem("homeVol",VOL)}catch(e){}};
 r.oninput=()=>{VOL=r.value/100;if(VOL>0)last=VOL;sync();save()};
 r.onchange=()=>{ac();setTimeout(()=>bleat(250),30)};
 b.onclick=()=>{ac();VOL=VOL>0?0:last;sync();save();if(VOL>0)setTimeout(()=>bleat(250),30)};sync()}
let ti;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(ti);ti=setTimeout(()=>e.classList.remove("show"),1800)}
/* one sheep button; a sheep with kids opens a small pen (popup) with more sheep */
function makeSheep(label,href,kids){
  const open=!!href||!!(kids&&kids.some(k=>k[1]));
  const b=document.createElement("button");b.className="sheep"+(open?" open":"")+(Math.random()<.35?" flip":"");
  b.style.setProperty("--d",(2.4+Math.random()*1.8).toFixed(2)+"s");b.style.setProperty("--dl",(-Math.random()*3).toFixed(2)+"s");
  b.innerHTML=(open?'<span class="tag">'+(kids?"모음":"OPEN")+'</span>':'')+SHEEP+'<span class="lb">'+label+'</span>';
  b.setAttribute("aria-label",label+(kids?" (모음)":open?"":" (준비 중)"));
  const voice=200+Math.random()*110;let lastB=0;
  const baa=()=>{const n=Date.now();if(n-lastB<1400)return;lastB=n;bleat(voice)};
  b.addEventListener("pointerenter",e=>{if(e.pointerType=="mouse")baa()});
  b.onclick=()=>{
    ac();setTimeout(baa,0);
    try{gtag("event","menu_click",{menu_name:label,menu_type:kids?"모음":href?"열림":"준비 중"})}catch(e){}
    b.classList.remove("jump");void b.offsetWidth;b.classList.add("jump");
    const s=document.createElement("span");s.className="bubble";s.textContent=SAY[Math.floor(Math.random()*SAY.length)];b.appendChild(s);setTimeout(()=>s.remove(),900);
    if(kids)setTimeout(()=>openGroup(label,kids),250);
    else if(href&&/^https?:/.test(href)){window.open(href,"_blank","noopener")}else if(href)setTimeout(()=>location.href=href,450);else toast("🐑 '"+label+"'은(는) 준비 중이에요!");
  };
  return b}
function openGroup(label,kids){const g=$("grp");g.querySelector(".sign b").textContent=label;const fl=g.querySelector(".flock");fl.innerHTML="";
  kids.forEach(([l,h,k])=>fl.appendChild(makeSheep(l,h,k)));g.classList.add("show");g.querySelector(".gx").focus()}
function closeGroup(){$("grp").classList.remove("show")}
$("grp").addEventListener("click",e=>{if(e.target.id=="grp")closeGroup()});
$("grp").querySelector(".gx").onclick=closeGroup;
addEventListener("keydown",e=>{if(e.key=="Escape")closeGroup()});
ZONES.forEach(z=>{
  const pen=document.createElement("section");pen.className="pen";pen.setAttribute("aria-label",z.name);
  pen.innerHTML='<div class="sign"><b>'+z.name+'</b><i></i></div><span class="post a"></span><span class="post b"></span><span class="post c"></span><span class="post d"></span><div class="flock"></div>';
  const fl=pen.querySelector(".flock");
  z.items.forEach(([label,href,kids])=>fl.appendChild(makeSheep(label,href,kids)));
  $("ranch").appendChild(pen);
});
const link=([l,h])=>h?'<a href="'+h+'"'+(/^https?:/.test(h)?' target="_blank" rel="noopener"':'')+'>'+l+'</a>':l;
$("list").innerHTML=ZONES.map(z=>'<li><b>'+z.name+'</b> — '+z.items.map(it=>it[2]?it[0]+"("+it[2].map(link).join(", ")+")":link(it)).join(", ")+'</li>').join("");
</script>

<script>
/* 예수님이 언덕 위에서 양 떼를 몰고 다님 (앞 양이 길을 내고, 나머지 양과 예수님이 그 길을 따라감) */
(function(){
const hills=document.querySelector(".hills");if(!hills)return;
const JESUS='<svg viewBox="-10 0 240 340" aria-hidden="true"><g class="ft ftL"><ellipse cx="88" cy="312" rx="17" ry="8" fill="#8a5528"/><ellipse cx="84" cy="306" rx="11" ry="7" fill="#f2c7a5" stroke="#7d6a5e" stroke-width="3"/></g><g class="ft ftR"><ellipse cx="132" cy="312" rx="17" ry="8" fill="#8a5528"/><ellipse cx="136" cy="306" rx="11" ry="7" fill="#f2c7a5" stroke="#7d6a5e" stroke-width="3"/></g><g class="armB"><path d="M150 162Q178 196 176 238L156 242Q156 204 136 178Z" fill="#eef8fb" stroke="#7d6a5e" stroke-width="5" stroke-linejoin="round"/><circle cx="167" cy="244" r="11" fill="#f2c7a5" stroke="#7d6a5e" stroke-width="4"/></g><path d="M64 150Q110 136 156 150L178 300Q110 314 42 300Z" fill="#eef8fb" stroke="#7d6a5e" stroke-width="5" stroke-linejoin="round"/><path d="M134 146L158 154L80 282L58 270Z" fill="#c8102e"/><path d="M42 300Q110 314 178 300" fill="none" stroke="#7d6a5e" stroke-width="5" stroke-linecap="round"/><g class="staff"><path d="M14 318L4 104" stroke="#a0703f" stroke-width="8" stroke-linecap="round"/><path d="M5 106Q-6 66 22 64Q50 64 44 96" fill="none" stroke="#a0703f" stroke-width="8" stroke-linecap="round"/><path d="M72 164Q40 186 22 214L40 228Q58 200 86 184Z" fill="#eef8fb" stroke="#7d6a5e" stroke-width="5" stroke-linejoin="round"/><circle cx="24" cy="222" r="12" fill="#f2c7a5" stroke="#7d6a5e" stroke-width="4"/></g><image href="assets/jesus-head.png" x="1" y="0" width="218" height="170"/></svg>';
const lane=document.createElement("div");lane.className="parade";hills.appendChild(lane);
const mk=(html,cls,w)=>{const d=document.createElement("div");d.className="pw "+cls;d.innerHTML=html;d.firstChild.style.width=w+"px";lane.appendChild(d);return d};
const small=innerWidth<560,SW=small?40:56,JW=small?58:80,GAP=small?34:46,N=small?3:4,JG=small?50:68;
const flock=[];for(let i=0;i<N;i++){const w=Math.round(SW*(i===N-1?.8:1-.06*i));flock.push({el:mk(SHEEP,"sheep",w)})}
const J={el:mk(JESUS,"jesus",JW)};
flock.forEach((f,i)=>{f.el.style.bottom=((i%2)*5)+"px";f.el.style.zIndex=3+(i%2?0:1)});J.el.style.zIndex=5;
const rnd=(a,b)=>a+Math.random()*(b-a);
/* 양 떼는 줄지어 같은 방향을 보고 걷고, 예수님은 늘 그 뒤에서 몬다.
   오른쪽 끝에 닿으면 양들이 제자리에서 돌아서고 예수님이 반대편(새 뒤쪽)으로 돌아가 다시 몰고 간다. 왼쪽 끝도 마찬가지. */
const SPAN=(N-1)*GAP,M=JG+JW/2+6;
let W=lane.clientWidth,dir=1,H=SPAN+M+10,phase="walk",until=performance.now()+rnd(8000,14000),jx=H-SPAN-JG,jT=0;
const sheepX=i=>H-dir*i*GAP;
function mode(el,m){el.classList.toggle("walk",m==="walk");el.classList.toggle("graze",m==="graze")}
function face(el,d){el.classList.toggle("flip",d>0)}
function draw(){flock.forEach((f,i)=>{f.el.style.left=sheepX(i)+"px";face(f.el,dir)});J.el.style.left=jx+"px"}
function all(m){flock.forEach(f=>mode(f.el,m));mode(J.el,m)}
all("walk");face(J.el,dir);draw();
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;W=lane.clientWidth;const sp=small?13:17;
  if(phase==="walk"){H+=dir*sp*dt;jx=H-dir*(SPAN+JG);face(J.el,dir);
    if((dir>0&&H>=W-M)||(dir<0&&H<=M)){H-=dir*SPAN;dir=-dir;jT=H-dir*(SPAN+JG);phase="turn";flock.forEach(f=>mode(f.el,"graze"));mode(J.el,"walk")}
    else if(t>until){phase="rest";until=t+rnd(2500,4500);all("graze")}}
  else if(phase==="rest"){if(t>until){phase="walk";until=t+rnd(8000,14000);all("walk")}}
  else if(phase==="turn"){const d=jT-jx,st=sp*1.8*dt;
    if(Math.abs(d)<=st){jx=jT;face(J.el,dir);phase="rest";until=t+rnd(1200,2200);mode(J.el,"graze")}else{jx+=Math.sign(d)*st;face(J.el,Math.sign(d))}}
  draw();requestAnimationFrame(frame)}
if(matchMedia("(prefers-reduced-motion: reduce)").matches)all("");else requestAnimationFrame(frame);
const SAYS=["나는 선한 목자라 (요 10:11)","내 양은 내 음성을 듣느니라 (요 10:27)","잃은 양을 찾았노라 (눅 15:6)","여호와는 나의 목자시니 (시 23:1)"];
J.el.addEventListener("click",()=>{const old=J.el.querySelector(".say");if(old)old.remove();const b=document.createElement("span");b.className="say";b.textContent=SAYS[Math.floor(Math.random()*SAYS.length)];J.el.appendChild(b);setTimeout(()=>b.remove(),2600);
  flock.forEach((f,i)=>setTimeout(()=>{f.el.animate([{marginBottom:"0px"},{marginBottom:"12px"},{marginBottom:"0px"}],{duration:420,easing:"ease-out"})},i*90));
  try{if(typeof ac==="function")ac();if(typeof bleat==="function")bleat(240)}catch(e){}});
})();
</script>
</body></html>
