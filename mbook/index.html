    g.querySelectorAll('.tpl').forEach(d=>{io.observe(d);d.onclick=()=>{const p=B.pg[CUR];const t=+d.dataset.t,nd=tpl(ft,t,W,H);delete nd.font;
      if((p.data.els||[]).length&&p.type===ft&&false){}
      Object.keys(p.data).forEach(k=>delete p.data[k]);Object.assign(p.data,nd);p.type=ft;p.t=t;m.remove();ED.setBoards([{id:'p'+CUR,label:`${CUR+1}쪽 · ${TN(ft)}`,w:W,h:H,data:p.data}],true);ED.commit();$('#ptype').value=ft;label();save();toast(`${CUR+1}쪽에 ‘${TN(ft)} ${PAL[t%17].n}’ 템플릿을 넣었어요. 되돌리려면 Ctrl+Z`)}})};
  m.querySelector('#tchips').onclick=e=>{const b=e.target.closest('[data-ft]');if(b){ft=b.dataset.ft;fill()}};fill();
  Promise.all([...fonts].map(D.ensureFont)).then(()=>{if(m.isConnected)fill()})}
/* 책자 설정: 이름·쪽수 */
function setDlg(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div style="max-width:480px"><h2 style="margin:0 0 8px">⚙️ 책자 설정</h2>
  <label class="fld">책자 이름<input id="sN" value="${esc(B.name)}"></label>
  <label class="fld" style="margin-top:8px">쪽수<select id="sP">${Array.from({length:16},(_,i)=>(i+1)*4).map(n=>`<option value="${n}"${n===B.n?' selected':''}>${n}쪽 (종이 ${n/4}장)</option>`).join('')}</select></label>
  <p class="hint">쪽을 늘리면 뒷표지 앞에 빈 메모 쪽이 생기고, 줄이면 뒷표지 앞쪽부터 빠져요.</p>
  <div class="row" style="margin-top:10px"><button class="pri" id="sGo">저장</button><button data-x>닫기</button><span style="flex:1"></span><button id="sDel" style="color:#b5361f;border-color:#b5361f">🗑 책자 지우기</button></div></div>`;document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m||e.target.dataset.x!=null)m.remove()});
  m.querySelector('#sGo').onclick=async()=>{B.name=m.querySelector('#sN').value.trim()||B.name;const N=+m.querySelector('#sP').value;
    if(N>B.n){const add=Array.from({length:N-B.n},()=>({type:'memo',t:B.pg[0].t||0,data:(d=>{delete d.font;return d})(tpl('memo',B.pg[0].t||0,W,H))}));B.pg.splice(B.pg.length-1,0,...add)}
    else if(N<B.n){const rm=B.pg.slice(B.pg.length-1-(B.n-N),B.pg.length-1);if(rm.some(p=>p.data.els.length)&&!confirm(`${B.n-N}쪽을 빼요. 그 쪽의 내용도 지워져요. 할까요?`))return;B.pg.splice(B.pg.length-1-(B.n-N),B.n-N)}
    B.n=N;B.updated=Date.now();await putBook(B);location.reload()};
  m.querySelector('#sDel').onclick=async()=>{if(!confirm(`‘${B.name}’ 책자를 지울까요? 되돌릴 수 없어요.`))return;for(const p of B.pg)for(const a of D.usedAssets(p.data))await AS.del(a);await delBook(B.id);location.href='./'}}
/* PDF: 인쇄용(접는 순서) 또는 쪽 순서 */
function pdfDlg(){const s=SIZES[B.size],m=document.createElement('div');m.className='modal';m.innerHTML=`<div style="max-width:520px"><h2 style="margin:0 0 8px">📄 PDF로 받기</h2>
  <label class="row" style="padding:6px 0"><input type="radio" name="pm" value="print" checked> <b>인쇄용</b> <span class="hint">${s.paper} 종이 ${B.n/4}장 · 양면 · 접는 순서대로</span></label>
  <label class="row" style="padding:6px 0"><input type="radio" name="pm" value="seq"> <b>쪽 순서대로</b> <span class="hint">한 쪽씩 ${B.n}쪽 (화면으로 보거나 나눠 줄 때)</span></label>
  <label class="row" style="padding:6px 0"><input type="checkbox" id="pFold" checked> 가운데 접는 선 살짝 표시 <span class="hint">(인쇄용)</span></label>
  <label class="row" style="padding:6px 0"><input type="checkbox" id="pHi"> 더 선명하게 <span class="hint">(파일이 커져요)</span></label>
  <div class="info" style="font-size:14px">🖨️ 인쇄할 때: <b style="font-size:15px">양면 인쇄 · 짧은 쪽으로 넘기기 · 실제 크기(100%)</b>로 뽑은 뒤, 순서대로 겹쳐 가운데를 접고 스테이플로 찍어요.</div>
  <div class="row" style="margin-top:10px"><button class="pri" id="pGo">📄 PDF 만들기</button><button data-x>닫기</button></div><p class="hint" id="pMsg"></p></div>`;document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m||e.target.dataset.x!=null)m.remove()});
  m.querySelector('#pGo').onclick=async()=>{const btn=m.querySelector('#pGo'),msg=m.querySelector('#pMsg');btn.disabled=true;msg.textContent='⏳ 만드는 중… (쪽이 많으면 조금 걸려요)';
    try{ED.deselect();const mode=m.querySelector('input[name=pm]:checked').value,fold=m.querySelector('#pFold').checked,px=m.querySelector('#pHi').checked?12:8,sc=px/U;
      const boards=B.pg.map(p=>({w:W,h:H,data:p.data}));await ED.ready(boards);const {jsPDF}=await D.loadPdf();
      const img=i=>ED.exportCanvas(boards[i],sc);let pdf;
      if(mode==='seq'){pdf=new jsPDF({orientation:s.w>s.h?'landscape':'portrait',unit:'mm',format:[s.w,s.h]});for(let i=0;i<B.n;i++){if(i)pdf.addPage([s.w,s.h],s.w>s.h?'landscape':'portrait');pdf.addImage(img(i).toDataURL('image/jpeg',.92),'JPEG',0,0,s.w,s.h);msg.textContent=`⏳ ${i+1}/${B.n}쪽`;await new Promise(r=>setTimeout(r,0))}}
      else{pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[s.sw,s.sh]});let first=true;for(const sh of sheets(B.n))for(const side of ['front','back']){if(!first)pdf.addPage([s.sw,s.sh],'landscape');first=false;
        sh[side].forEach((q,j)=>pdf.addImage(img(q-1).toDataURL('image/jpeg',.92),'JPEG',j*s.w,0,s.w,s.h));if(fold){pdf.setDrawColor(200);pdf.setLineWidth(.2);pdf.setLineDashPattern([1.5,1.5],0);pdf.line(s.w,0,s.w,4);pdf.line(s.w,s.h-4,s.w,s.h)}
        msg.textContent=`⏳ 종이 ${sh.k+1} ${side==='front'?'앞면':'뒷면'}`;await new Promise(r=>setTimeout(r,0))}}
      D.download(pdf.output('blob'),`${B.name}_${mode==='seq'?'쪽순서':'인쇄용'}.pdf`);msg.textContent='✅ PDF를 받았어요'}catch(e){msg.textContent='😢 '+(e&&e.message||e)}btn.disabled=false}}
window.__mbook={tpl,sheets,where,B:()=>B,ED:()=>ED,go};
(async()=>{if(MID){MD=await mission(MID);if(MD){$('#backM').hidden=false;$('#backM').href='../mission/?c='+encodeURIComponent(MID)}}if(BID)editor();else home()})();
})();
