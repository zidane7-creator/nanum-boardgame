const N=id=>M().nodes.find(n=>n.id===id),kids=id=>M().nodes.filter(n=>n.parent===id),root=()=>M().nodes.find(n=>!n.parent);

  else{drag={k:'pan',sx:e.clientX,sy:e.clientY,cx:CAM.x,cy:CAM.y,moved:false};sv.classList.add('pan')}});
let LASTTAP=null;
sv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!drag)return;
  if(drag.k==='pinch'&&ptrs.size===2){const[a,b]=[...ptrs.values()];zoomAt(drag.z0*Math.hypot(a.x-b.x,a.y-b.y)/drag.d0,(a.x+b.x)/2,(a.y+b.y)/2);return}
  if(drag.k==='pan'){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;CAM.x=drag.cx-dx/CAM.z;CAM.y=drag.cy-dy/CAM.z;apply(sv,world,CAM);placeEdit();return}
  if(drag.k==='node'){const p=toW(e),dx=p.x-drag.p0.x,dy=p.y-drag.p0.y;if(!drag.moved&&Math.hypot(dx,dy)*CAM.z<4)return;drag.moved=true;LASTTAP=null;drag.orig.forEach(([i,x,y])=>{const n=N(i);n.x=Math.round(x+dx);n.y=Math.round(y+dy)});draw()}});
const up=e=>{ptrs.delete(e.pointerId);sv.classList.remove('pan');if(!drag)return;if(drag.k==='node'&&drag.moved)commit();if(drag.k==='pan'&&!drag.moved&&SEL){SEL=null;draw()}if(ptrs.size<2)drag=null};
sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',up);
/* 가지 만들기: 줄기 방향으로 퍼지게, 겹치지 않게 */
function place(p){const d=depth(p),ks=kids(p.id),k=ks.length,dist=d===0?250:Math.max(150,210-d*25);let base,offs;
  if(!p.parent){base=-90+k*137.5;offs=[0]}else{const gp=N(p.parent);base=Math.atan2(p.y-gp.y,p.x-gp.x)*180/Math.PI;offs=[0,-38,38,-76,76,-114,114,-150,150,180]}
  const far=(x,y)=>M().nodes.every(n=>Math.hypot(n.x-x,n.y-y)>120);
  for(let r=0;r<6;r++)for(const o of (p.parent?offs:[0,20,-20,40,-40])){const a=(base+o+(p.parent?0:0))*Math.PI/180,R=dist+r*70,x=p.x+Math.cos(a)*R,y=p.y+Math.sin(a)*R*.85;if(far(x,y))return{x:Math.round(x),y:Math.round(y)}}
  const a=base*Math.PI/180;return{x:Math.round(p.x+Math.cos(a)*dist),y:Math.round(p.y+Math.sin(a)*dist)}}
function addChild(pid,edit){const p=N(pid||SEL)||root();const pos=place(p),n={id:uid(),parent:p.id,text:'',shape:M().newShape||'circle',x:pos.x,y:pos.y};M().nodes.push(n);SEL=n.id;commit();draw();ensureVisible(n);if(edit!==false)startEdit(n.id,true);return n}
function addSib(){const s=N(SEL);if(!s||!s.parent){addChild(SEL);return}addChild(s.parent)}
function del(){const s=N(SEL);if(!s)return;if(!s.parent){toast('가운데 주제는 지울 수 없어요. 글자를 고쳐 주세요');return}const L=sub(s.id);if(L.length>3&&!confirm(`딸린 가지 ${L.length-1}개도 함께 지울까요?`))return;M().nodes=M().nodes.filter(n=>!L.includes(n.id));SEL=s.parent;commit();draw()}
function ensureVisible(n){const r=sv.getBoundingClientRect(),sx=r.width/2+(n.x-CAM.x)*CAM.z,sy=r.height/2+(n.y-CAM.y)*CAM.z;if(sx<80||sy<60||sx>r.width-80||sy>r.height-60){CAM.x=n.x;CAM.y=n.y;draw()}}
/* 글자 고치기 */
let EDIT=null;
function startEdit(id,isNew){const n=N(id);if(!n)return;SEL=id;draw();const t=document.createElement('textarea');t.id='edit';t.value=n.text||'';t.placeholder='생각을 적어요';$('#stage').appendChild(t);EDIT={id,t,isNew,orig:n.text};placeEdit();t.focus();t.select();
  t.addEventListener('input',()=>{n.text=t.value;draw();placeEdit()});
  t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();finishEdit()}else if(e.key==='Escape'){e.preventDefault();if(EDIT.isNew&&!EDIT.orig&&!t.value.trim()){M().nodes=M().nodes.filter(x=>x.id!==id);SEL=n.parent}else n.text=EDIT.orig;t.remove();EDIT=null;draw()}else if(e.key==='Tab'&&!e.isComposing){e.preventDefault();finishEdit();addChild(id)}e.stopPropagation()});
  t.addEventListener('blur',()=>setTimeout(()=>{if(EDIT&&EDIT.t===t)finishEdit()},120))}
function placeEdit(){if(!EDIT)return;const n=N(EDIT.id);if(!n)return;const r=sv.getBoundingClientRect(),g=geom(n),w=Math.max(160,Math.min(320,g.w*CAM.z*.9)),sx=r.width/2+(n.x-CAM.x)*CAM.z,sy=r.height/2+(n.y-CAM.y)*CAM.z,h=Math.max(46,g.lines.length*28+20);
  Object.assign(EDIT.t.style,{left:(sx-w/2)+'px',top:(sy-h/2)+'px',width:w+'px',height:h+'px'})}
function finishEdit(){if(!EDIT)return;const{id,t}=EDIT;EDIT=null;t.remove();const n=N(id);if(n&&!n.text.trim()){n.text=n.parent?'새 생각':'주제'}commit();draw()}
/* 옆 칸 */
function side(){const n=N(SEL),h=$('#sel');if(!n){h.innerHTML='<h3>✨ 이렇게 써요</h3><p class="hint" style="margin:0">도형을 눌러 고른 뒤 <b>🌿 가지 추가</b>(Tab)로 뻗어 나가요. <b>Enter</b>는 옆 가지, 두 번 누르면 글자 고치기예요. 위 <b>모양</b>에서 원·세모·네모를 골라요.</p>';hl();return}
  h.innerHTML=`<h3>${n.parent?'🌿 가지':'🎯 가운데 주제'}</h3><div class="hint">${esc((n.text||'').replace(/\n/g,' '))}</div><div id="colBox"></div><div id="fillBox"></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button id="cRes">🎨 기본 색으로</button>${n.parent?'<button id="cAll">이 가지 전체에 적용</button>':''}</div>`;
  DESIGN.colorCtl($('#colBox'),'선 색',colorOf(n),c=>{if(c==='none')return;n.color=c;save();draw2()});
  DESIGN.colorCtl($('#fillBox'),'채우기',n.fill||'none',c=>{if(c==='none')delete n.fill;else n.fill=c;save();draw2()},{none:1});
  $('#cRes').onclick=()=>{delete n.color;delete n.fill;commit();draw()};const ca=$('#cAll');if(ca)ca.onclick=()=>{sub(n.id).forEach(i=>{const x=N(i);if(n.color)x.color=n.color;else delete x.color;if(n.fill)x.fill=n.fill;else delete x.fill});commit();draw()};hl()}
function draw2(){GEO=paint(world,{sel:SEL});apply(sv,world,CAM);clearTimeout(draw2.t);draw2.t=setTimeout(commit,400)}
function hl(){const s=N(SEL),cur=s?s.shape:M().newShape;document.querySelectorAll('#shp button').forEach(b=>b.classList.toggle('on',b.dataset.s===cur))}
function upd(){$('#bUndo').disabled=!hist.length;$('#bRedo').disabled=!fut.length;mapsUI()}
document.querySelectorAll('#shp button').forEach(b=>b.onclick=()=>{M().newShape=b.dataset.s;const s=N(SEL);if(s){s.shape=b.dataset.s;commit();draw()}else{save();hl();toast('새 가지를 이 모양으로 만들어요')}});
$('#bChild').onclick=()=>addChild(SEL);$('#bSib').onclick=addSib;$('#bEdit').onclick=()=>{if(!SEL)SEL=root().id;startEdit(SEL)};$('#bDel').onclick=del;$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
document.addEventListener('keydown',e=>{if($('#show').classList.contains('on'))return;const t=e.target;if(t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;const c=e.ctrlKey||e.metaKey;
  if(c&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}if(c&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(e.key==='Tab'){e.preventDefault();addChild(SEL);return}if(e.key==='Enter'&&SEL){e.preventDefault();addSib();return}if(e.key==='F2'&&SEL){e.preventDefault();startEdit(SEL);return}
  if((e.key==='Delete'||e.key==='Backspace')&&SEL){e.preventDefault();del();return}if(e.key==='Escape'){SEL=null;draw()}});
/* 여러 마인드맵 */
function mapsUI(){$('#maps').innerHTML=ST.maps.slice().sort((a,b)=>(b.updated||0)-(a.updated||0)).map(m=>`<button class="${m.id===ST.cur?'on':''}" data-m="${m.id}">🧠 ${esc(m.name)} <span class="hint">· ${m.nodes.length}</span></button>`).join('');$('#maps').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ST.cur=b.dataset.m;save();open()})}
$('#mNew').onclick=()=>{const name=(prompt('마인드맵 주제','')||'').trim();if(!name)return;const m=blank(name);m.nodes[0].text=name;ST.maps.push(m);ST.cur=m.id;save();open();toast('Tab으로 가지를 뻗어 보세요')};
$('#mRen').onclick=()=>{const m=M(),n=(prompt('이름',m.name)||'').trim();if(n){m.name=n;save();mapsUI()}};
$('#mDel').onclick=()=>{if(ST.maps.length<2){toast('마지막 마인드맵은 지울 수 없어요');return}const m=M();if(!confirm(`‘${m.name}’을 지울까요?`))return;ST.maps=ST.maps.filter(x=>x!==m);ST.cur=ST.maps[0].id;save();open()};
function open(){SEL=null;resetHist();GEO=paint(world,{});CAM=fitCam(sv);draw()}
/* ▶ 프레지처럼 보기: 가운데 → 가지 차례로 날아가며 확대 */
const ssv=$('#ssv'),sw=$('#sworld');let SH=null;
function steps(){const L=order();const S=[{ids:null,cur:null}];L.forEach(n=>{const k=kids(n.id).map(x=>x.id);S.push({ids:[n.id,...k],cur:n.id})});return S}
function showGo(i){const S=SH.S;i=Math.max(0,Math.min(S.length-1,i));SH.i=i;const st=S[i];paint(sw,{cur:st.cur});const to=fitCam(ssv,st.ids,st.ids?Math.min(140,innerWidth*.12):60);if(st.ids&&st.ids.length===1)to.z=Math.min(to.z,2.2);
  const from=Object.assign({},SH.cam),t0=performance.now(),T=1100,dist=Math.hypot(to.x-from.x,to.y-from.y),dip=Math.min(1.1,dist*Math.min(from.z,to.z)/900);cancelAnimationFrame(SH.raf);
  const step=now=>{let t=Math.min(1,(now-t0)/T);const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;const lz=Math.log(from.z)+(Math.log(to.z)-Math.log(from.z))*e-dip*Math.sin(Math.PI*e);
    SH.cam={x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,z:Math.exp(lz)};apply(ssv,sw,SH.cam);if(t<1)SH.raf=requestAnimationFrame(step)};SH.raf=requestAnimationFrame(step);
  $('#sCnt').textContent=i===0?'전체':`${i} / ${S.length-1}`}
$('#bShow').onclick=()=>{if(EDIT)finishEdit();const el=$('#show');el.classList.add('on');try{el.requestFullscreen&&el.requestFullscreen().catch(()=>{})}catch(_){}SH={S:steps(),i:0,cam:{x:0,y:0,z:.2}};paint(sw,{});setTimeout(()=>{SH.cam=Object.assign(fitCam(ssv),{z:fitCam(ssv).z*.6});showGo(0)},60)};
function endShow(){$('#show').classList.remove('on');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});if(SH)cancelAnimationFrame(SH.raf);SH=null}
$('#sNext').onclick=()=>showGo(SH.i+1);$('#sPrev').onclick=()=>showGo(SH.i-1);$('#sAll').onclick=()=>showGo(0);$('#sEnd').onclick=endShow;
ssv.addEventListener('click',e=>{if(!SH)return;const g=e.target.closest('.nd');if(g){const j=SH.S.findIndex(s=>s.cur===g.dataset.id);if(j>=0){showGo(j);return}}showGo(SH.i+1)});
ssv.addEventListener('wheel',e=>{if(!SH)return;e.preventDefault();if(e.ctrlKey||e.metaKey){const r=ssv.getBoundingClientRect(),c=SH.cam,z=Math.max(.05,Math.min(6,c.z*Math.exp(-e.deltaY*.0018))),wx=c.x+(e.clientX-r.left-r.width/2)/c.z,wy=c.y+(e.clientY-r.top-r.height/2)/c.z;SH.cam={z,x:wx-(e.clientX-r.left-r.width/2)/z,y:wy-(e.clientY-r.top-r.height/2)/z}}else{SH.cam.x+=e.deltaX/SH.cam.z;SH.cam.y+=e.deltaY/SH.cam.z}apply(ssv,sw,SH.cam)},{passive:false});
document.addEventListener('keydown',e=>{if(!SH)return;if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();showGo(SH.i+1)}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();showGo(SH.i-1)}else if(e.key==='Home')showGo(0);else if(e.key==='Escape')endShow()});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&SH)endShow()});
/* 🖼️ 이미지 저장 */
$('#bPng').onclick=async()=>{GEO=paint(world,{});const b=bbox(),pad=60,W=b.x1-b.x0+pad*2,H=b.y1-b.y0+pad*2,sc=Math.min(2,4000/Math.max(W,H));
  const g=world.cloneNode(true);g.setAttribute('transform',`translate(${pad-b.x0} ${pad-b.y0})`);const s=`<svg xmlns="${NS}" width="${W*sc}" height="${H*sc}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="#fffdf7"/>${g.outerHTML}</svg>`;
  const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=W*sc;c.height=H*sc;c.getContext('2d').drawImage(im,0,0);c.toBlob(bl=>DESIGN.download(bl,M().name+'_마인드맵.png'),'image/png');draw()};
  im.onerror=()=>{toast('이미지를 만들지 못했어요');draw()};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)};
addEventListener('resize',()=>{apply(sv,world,CAM);placeEdit()});
(document.fonts?document.fonts.load('20px Jua'):Promise.resolve()).catch(()=>{}).then(()=>open());
window.__mm={ST:()=>ST,addChild,M,N};
})();
