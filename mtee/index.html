<style>

<script>
(function(){"use strict";
const MODE='mission',$=s=>document.querySelector(s),D=DESIGN,esc=D.esc;
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)};
const MID=MODE==='mission'?(new URLSearchParams(location.search).get('m')||''):'';
const KEY=MODE==='mission'?'mtee-v2'+(MID?':'+MID:''):'tshirt-v1';
const AS=D.assetStore('tee-assets');
const W=1000,H=1100;
/* 옷 모양 */
function shirt(front){const p=new Path2D();p.moveTo(372,88);p.quadraticCurveTo(500,front?215:132,628,88);p.lineTo(790,150);p.lineTo(965,335);p.lineTo(848,440);p.lineTo(768,362);p.lineTo(768,1035);p.quadraticCurveTo(500,1058,232,1035);p.lineTo(232,362);p.lineTo(152,440);p.lineTo(35,335);p.lineTo(210,150);p.closePath();return p}
const SH={f:shirt(true),b:shirt(false)};
function shade(hex,k){const n=parseInt((D.normHex(hex)||'#ffffff').slice(1),16),f=x=>Math.max(0,Math.min(255,Math.round(x*k)));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
const lum=hex=>{const n=parseInt((D.normHex(hex)||'#ffffff').slice(1),16);return((n>>16)*.299+(n>>8&255)*.587+(n&255)*.114)/255};
function under(side){return (ctx,w,h)=>{const col=P().color||'#ffffff';ctx.fillStyle='#efe8dc';ctx.fillRect(0,0,w,h);const p=SH[side];
  ctx.save();ctx.shadowColor='rgba(0,0,0,.2)';ctx.shadowBlur=26;ctx.shadowOffsetY=8;ctx.fillStyle=col;ctx.fill(p);ctx.restore();
  ctx.save();ctx.clip(p);const g=ctx.createLinearGradient(0,0,w,0);g.addColorStop(0,'rgba(0,0,0,.08)');g.addColorStop(.26,'rgba(0,0,0,0)');g.addColorStop(.74,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.09)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.restore();
  ctx.lineWidth=4;ctx.strokeStyle=shade(col,lum(col)<.3?1.6:.78);ctx.stroke(p);ctx.beginPath();ctx.moveTo(372,88);ctx.quadraticCurveTo(500,side==='f'?215:132,628,88);ctx.lineWidth=16;ctx.strokeStyle=shade(col,lum(col)<.3?1.35:.86);ctx.stroke();
  ctx.lineWidth=3;ctx.strokeStyle=shade(col,lum(col)<.3?1.5:.74);ctx.beginPath();ctx.moveTo(210,150);ctx.lineTo(232,362);ctx.moveTo(790,150);ctx.lineTo(768,362);ctx.stroke()}}
const over=(ctx)=>{ctx.save();ctx.setLineDash([10,8]);ctx.lineWidth=2;ctx.strokeStyle='rgba(47,111,176,.45)';ctx.strokeRect(310,260,380,560);ctx.restore()};
/* 저장 */
const NAMES='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const plan0=n=>({id:D.uid(),name:n+'안',color:'#ffffff',f:{els:[{id:D.uid(),type:'text',t:'2027',font:'Black Han Sans',size:70,lh:1.2,ls:6,align:'center',color:'#1f2a44',x:310,y:300,w:380,h:84},{id:D.uid(),type:'text',t:'MISSION',font:'Black Han Sans',size:96,lh:1.1,ls:4,align:'center',color:'#e8503a',x:200,y:385,w:600,h:106},{id:D.uid(),type:'text',t:'가서 모든 족속으로 제자를 삼아',font:'Gowun Dodum',size:30,lh:1.3,ls:0,align:'center',color:'#1f2a44',x:280,y:520,w:440,h:39}]},b:{els:[{id:D.uid(),type:'text',t:'우리 교회 청년부',font:'Do Hyeon',size:54,lh:1.2,ls:2,align:'center',color:'#1f2a44',x:280,y:240,w:440,h:65},{id:D.uid(),type:'text',t:'마태복음 28:19',font:'Gowun Dodum',size:30,lh:1.3,ls:0,align:'center',color:'#1f2a44',x:330,y:320,w:340,h:39}]}});
let S={plans:[plan0('A')],cur:null,people:[],price:''};
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.plans&&o.plans.length)S=Object.assign(S,o)}catch(_){}
if(!S.cur||!S.plans.some(p=>p.id===S.cur))S.cur=S.plans[0].id;
const P=()=>S.plans.find(p=>p.id===S.cur);
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 공간이 모자라요: '+e.message)}},200)}
/* 편집기 */
const ED=D.editor({stage:$('#stage'),panel:$('#panel'),tools:$('#tools'),assets:AS,zoom:.45,textDefault:{font:'Black Han Sans',color:'#1f2a44',size:60},shapeFill:'#e8503a',onChange:save});
function boards(){const p=P();return [{id:'f',label:'앞면',w:W,h:H,data:p.f,under:under('f'),over},{id:'b',label:'뒷면',w:W,h:H,data:p.b,under:under('b'),over}]}
async function open(keepZoom){const p=P();const ids=new Set([...D.usedAssets(p.f),...D.usedAssets(p.b)]);await AS.load(ids);ED.setBoards(boards());shirtUI();plansUI();if(!keepZoom)setTimeout(()=>ED.fit(),30)}
function shirtUI(){const h=$('#shirtBox');h.innerHTML='<b class="j" style="font-size:17px">👕 옷 색깔</b> <span class="hint">앞·뒤 모두 바뀌어요</span>';const p=P();
  const quick=document.createElement('div');quick.className='row';quick.style.margin='6px 0';quick.innerHTML=[['#ffffff','흰색'],['#f3ede2','크림'],['#d9d4c7','그레이'],['#2b2b2b','검정'],['#1f2a44','네이비'],['#e8503a','빨강'],['#f5b82e','노랑'],['#3f9a55','초록'],['#6cb4e4','하늘'],['#c8507a','분홍'],['#7a4fb0','보라'],['#8b5a2b','브라운']].map(([c,n])=>`<button title="${n} ${c}" data-sc="${c}" style="width:30px;height:30px;padding:0;border-radius:50%;background:${c};${(p.color||'').toLowerCase()===c?'outline:3px solid #3b2a20;outline-offset:2px':''}"></button>`).join('');h.appendChild(quick);
  quick.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{p.color=b.dataset.sc;save();ED.draw();shirtUI();plansUI()});
  D.colorCtl(h,'옷 색',p.color||'#ffffff',c=>{if(c==='none')return;p.color=c;save();ED.draw();plansUI()})}
function plansUI(){const h=$('#plans');h.innerHTML=S.plans.map(p=>`<button class="pl ${p.id===S.cur?'on':''}" data-pl="${p.id}"><i style="background:${esc(p.color)}"></i>${esc(p.name)}</button>`).join('')+`<button data-new="blank">＋ 새 안</button><button data-new="copy" title="지금 안을 복사해서 새 안으로">📄 지금 안 복사</button><button data-ren>✏️ 이름</button>${S.plans.length>1?'<button data-delp>🗑 이 안 지우기</button>':''}`;
  h.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{if(S.cur===b.dataset.pl)return;S.cur=b.dataset.pl;save();open(true)});
  h.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{const used=new Set(S.plans.map(p=>p.name));let i=0;while(used.has(NAMES[i%26]+(i>=26?Math.floor(i/26):'')+'안'))i++;const nm=NAMES[i%26]+(i>=26?Math.floor(i/26):'');
    let p;if(b.dataset.new==='copy'){p=D.clone(P());p.id=D.uid();p.name=nm+'안';[p.f,p.b].forEach(s=>s.els.forEach(e=>e.id=D.uid()))}else{p={id:D.uid(),name:nm+'안',color:P().color||'#ffffff',f:{els:[]},b:{els:[]}}}
    S.plans.push(p);S.cur=p.id;save();open(true);toast(`${p.name}을 만들었어요`)});
  const rn=h.querySelector('[data-ren]');if(rn)rn.onclick=()=>{const p=P(),n=(prompt('안 이름',p.name)||'').trim();if(n){p.name=n;save();plansUI();ED.setBoards(boards(),true)}};
  const dp=h.querySelector('[data-delp]');if(dp)dp.onclick=()=>{const p=P();if(!confirm(`‘${p.name}’을 지울까요? 되돌릴 수 없어요.`))return;S.plans=S.plans.filter(x=>x!==p);S.cur=S.plans[0].id;save();open(true)}}
/* 내보내기: 안을 골라 PDF·JPG */
function setCanvas(p,scale){const bf={id:'f',w:W,h:H,data:p.f,under:(c,w,h)=>{const keep=S.cur;S.cur=p.id;under('f')(c,w,h);S.cur=keep}},bb={id:'b',w:W,h:H,data:p.b,under:(c,w,h)=>{const keep=S.cur;S.cur=p.id;under('b')(c,w,h);S.cur=keep}};
  const a=ED.exportCanvas(bf,scale),b=ED.exportCanvas(bb,scale),gap=Math.round(30*scale),top=Math.round(90*scale),c=document.createElement('canvas');c.width=a.width*2+gap*3;c.height=a.height+top+gap;const x=c.getContext('2d');
  x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(a,gap,top);x.drawImage(b,gap*2+a.width,top);x.fillStyle='#3b2a20';x.textBaseline='middle';x.font=`${Math.round(44*scale)}px Jua, sans-serif`;x.textAlign='left';x.fillText(p.name+(MODE==='mission'?' · 선교티':' · 단체티'),gap,top/2);
  x.font=`${Math.round(26*scale)}px Jua, sans-serif`;x.textAlign='center';x.fillStyle='#7a6a5c';x.fillText('앞면',gap+a.width/2,top-14*scale);x.fillText('뒷면',gap*2+a.width*1.5,top-14*scale);x.textAlign='right';x.fillText('옷 색 '+(p.color||'').toUpperCase(),c.width-gap,top/2);return c}
$('#expBtn').onclick=async()=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><h2 style="margin:0 0 6px">📤 내보내기</h2><p class="hint" style="margin:0 0 8px">내보낼 안을 골라요. 안마다 앞·뒤가 한 장에 나란히 들어가요.</p><div class="row" style="margin-bottom:6px"><button class="sm" data-all="1">모두 고르기</button><button class="sm" data-all="0">모두 풀기</button></div>${S.plans.map(p=>`<label class="ck"><input type="checkbox" value="${p.id}" ${p.id===S.cur?'checked':''} style="width:20px;height:20px"><canvas width="240" height="132" data-th="${p.id}"></canvas><b class="j">${esc(p.name)}</b></label>`).join('')}
   <div class="row" style="margin-top:12px"><button class="pri" data-go="pdf">📄 PDF로 받기</button><button class="pri" data-go="jpg">🖼️ JPG로 받기</button><button data-x>닫기</button></div><p class="hint" id="expMsg"></p></div>`;document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m||e.target.dataset.x!=null)m.remove();if(e.target.dataset.all!=null)m.querySelectorAll('input[type=checkbox]').forEach(i=>i.checked=e.target.dataset.all==='1')});
  await ED.ready(S.plans.flatMap(p=>[{data:p.f},{data:p.b}]).map(b=>Object.assign({w:W,h:H},b)));for(const p of S.plans){await AS.load(new Set([...D.usedAssets(p.f),...D.usedAssets(p.b)]))}
  m.querySelectorAll('[data-th]').forEach(c=>{const p=S.plans.find(x=>x.id===c.dataset.th),s=setCanvas(p,.12);c.getContext('2d').drawImage(s,0,0,c.width,c.height)});
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=async()=>{const ids=[...m.querySelectorAll('input[type=checkbox]:checked')].map(i=>i.value),L=S.plans.filter(p=>ids.includes(p.id));if(!L.length){toast('내보낼 안을 골라 주세요');return}
    const msg=m.querySelector('#expMsg');msg.textContent='⏳ 만드는 중…';b.disabled=true;
    try{await ED.ready(L.flatMap(p=>[{data:p.f,w:W,h:H},{data:p.b,w:W,h:H}]));const base=MODE==='mission'?'선교티':'단체티';
      if(b.dataset.go==='jpg'){for(const p of L){const c=setCanvas(p,1.6);await new Promise(r=>c.toBlob(bl=>{D.download(bl,`${base}_${p.name}.jpg`);r()},'image/jpeg',.93));await new Promise(r=>setTimeout(r,350))}msg.textContent=`✅ JPG ${L.length}장을 받았어요`}
      else{const {jsPDF}=await D.loadPdf();const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});L.forEach((p,i)=>{const c=setCanvas(p,1.4);if(i)pdf.addPage('a4','landscape');const r=Math.min(277/c.width,190/c.height),w=c.width*r,h=c.height*r;pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',(297-w)/2,(210-h)/2,w,h)});pdf.save(`${base}_시안.pdf`);msg.textContent=`✅ PDF(${L.length}쪽)를 받았어요`}}
    catch(e){msg.textContent='😢 '+(e&&e.message||e)}b.disabled=false})};
/* ---------- 선교티: 사이즈 주문표 ---------- */
const SIZES=['아동 S','아동 M','아동 L','XS','S','M','L','XL','2XL','3XL'];
function table(){const L=S.people;$('#ptbl').innerHTML=`<tr><th>#</th><th>이름</th><th>사이즈</th><th>수량</th><th>메모</th><th></th></tr>`+(L.length?L.map((p,i)=>`<tr><td class="hint">${i+1}</td><td><input data-p="${i}" data-pk="name" value="${esc(p.name||'')}" style="width:110px"></td><td><select data-p="${i}" data-pk="size"><option value="">—</option>${SIZES.map(z=>`<option${p.size===z?' selected':''}>${z}</option>`).join('')}</select></td><td><input type="number" min="1" data-p="${i}" data-pk="n" value="${p.n||1}" style="width:60px"></td><td><input data-p="${i}" data-pk="memo" value="${esc(p.memo||'')}" placeholder="예) 여유분"></td><td><button class="sm" data-prm="${i}">🗑</button></td></tr>`).join(''):'<tr><td colspan="6" class="hint">‘+ 사람’으로 적거나 팀원 명부를 불러와요</td></tr>');tot()}
function tot(){const c={};let n=0;S.people.forEach(p=>{if(!p.size)return;const k=+p.n||1;c[p.size]=(c[p.size]||0)+k;n+=k});const none=S.people.filter(p=>!p.size).length;
  $('#tot').innerHTML=SIZES.filter(z=>c[z]).map(z=>`<span>${z} ${c[z]}</span>`).join('')+`<span style="background:#e6f6df">합계 ${n}장</span>${S.price?`<span>${(n*+S.price).toLocaleString('ko-KR')}원</span>`:''}${none?`<span style="background:#fde3dd">사이즈 미정 ${none}명</span>`:''}`;$('#price').value=S.price||''}
function orderText(){const c={};let n=0;S.people.forEach(p=>{if(p.size){c[p.size]=(c[p.size]||0)+(+p.n||1);n+=+p.n||1}});return `👕 선교티 주문표\n`+SIZES.filter(z=>c[z]).map(z=>`${z}: ${c[z]}장`).join('\n')+`\n합계 ${n}장${S.price?` · ${(n*+S.price).toLocaleString('ko-KR')}원`:''}\n\n`+S.people.map(p=>`${p.name||'(이름)'} ${p.size||'미정'}${(+p.n||1)>1?' ×'+p.n:''}${p.memo?' ('+p.memo+')':''}`).join('\n')}
async function mission(){if(!MID)return null;try{const d=await new Promise((res,rej)=>{const r=indexedDB.open('mission-pack');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(!d.objectStoreNames.contains('camps')){d.close();return null}
  const m=await new Promise(r=>{const q=d.transaction('camps').objectStore('camps').get(MID);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});d.close();return m}catch(_){return null}}
if(MODE==='mission'){$('#orderCard').hidden=false;
  document.addEventListener('input',e=>{const t=e.target;if(t.dataset.p!=null){S.people[+t.dataset.p][t.dataset.pk]=t.value;save();tot()}if(t.id==='price'){S.price=t.value;save();tot()}});
  document.addEventListener('change',e=>{if(e.target.dataset.pk==='size')tot()});
  document.addEventListener('click',e=>{const t=e.target;if(t.dataset&&t.dataset.prm!=null){S.people.splice(+t.dataset.prm,1);save();table()}});
  $('#addP').onclick=()=>{S.people.push({name:'',size:'',n:1});save();table();const L=document.querySelectorAll('[data-pk=name]');L[L.length-1].focus()};
  $('#copyO').onclick=async()=>{try{await navigator.clipboard.writeText(orderText());toast('📋 복사했어요. 카톡에 붙여넣으세요')}catch(_){prompt('복사해 주세요',orderText())}};
  $('#csvO').onclick=()=>{const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};const rows=[['이름','사이즈','수량','메모'],...S.people.map(p=>[p.name,p.size,p.n||1,p.memo||''])];D.download(new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}),'선교티_주문표.csv')};
  $('#namesIn').onclick=()=>{const N=S.people.map(p=>(p.name||'').trim()).filter(Boolean);if(!N.length){toast('주문표에 이름을 먼저 적거나 불러와 주세요');return}const cols=N.length>24?4:N.length>10?3:2,rows=[];for(let i=0;i<N.length;i+=cols)rows.push(N.slice(i,i+cols).join('   '));
    const p=P();p.b.els.push({id:D.uid(),type:'text',t:rows.join('\n'),font:'Do Hyeon',size:28,lh:1.5,ls:1,align:'center',color:'#1f2a44',x:300,y:420,w:400,h:42*rows.length});save();open(true);toast('🙋 뒷면에 이름을 넣었어요. 끌어서 옮기고 크기를 바꿔요')};
  $('#loadM').onclick=async()=>{const m=await mission();if(!m){toast('선교를 찾지 못했어요');return}let add=0;(m.people||[]).forEach(p=>{if(p.name&&!S.people.some(x=>x.name===p.name)){S.people.push({name:p.name,size:'',n:1});add++}});save();table();toast(add?`🙋 ${add}명을 불러왔어요`:'새로 불러올 사람이 없어요')};
  table()}
(async()=>{if(MODE==='mission'){const m=await mission();if(m){$('#loadM').hidden=false;$('#backM').hidden=false;$('#backM').href='../mission/?c='+encodeURIComponent(MID);document.title=m.name+' 선교티 | 치영의 교회 생활 즐기기';
   if(!localStorage.getItem(KEY)){S.people=(m.people||[]).filter(p=>p.name).map(p=>({name:p.name,size:'',n:1}));const t=S.plans[0].b.els[0];if(t&&m.name)t.t=m.name;save();table()}}}
  open()})();
window.__tee={S:()=>S,ED};
})();
</script>
