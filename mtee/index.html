/* ---------- 선교티: 사이즈 주문표 ---------- */
const SIZES=['아동 S','아동 M','아동 L','XS','S','M','L','XL','2XL','3XL'];
function table(){const L=S.people;$('#ptbl').innerHTML=`<tr><th>#</th><th>이름</th><th>사이즈</th><th>수량</th><th>메모</th><th></th></tr>`+(L.length?L.map((p,i)=>`<tr><td class="hint">${i+1}</td><td><input data-p="${i}" data-pk="name" value="${esc(p.name||'')}" style="width:110px"></td><td><select data-p="${i}" data-pk="size"><option value="">—</option>${SIZES.map(z=>`<option${p.size===z?' selected':''}>${z}</option>`).join('')}</select></td><td><input type="number" min="1" data-p="${i}" data-pk="n" value="${p.n||1}" style="width:60px"></td><td><input data-p="${i}" data-pk="memo" value="${esc(p.memo||'')}" placeholder="예) 여유분"></td><td><button class="sm" data-prm="${i}">🗑</button></td></tr>`).join(''):'<tr><td colspan="6" class="hint">‘+ 사람’으로 적거나 팀원 명부를 불러와요</td></tr>');tot()}
function tot(){const c={};let n=0;S.people.forEach(p=>{if(!p.size)return;const k=+p.n||1;c[p.size]=(c[p.size]||0)+k;n+=k});const none=S.people.filter(p=>!p.size).length;
  $('#tot').innerHTML=SIZES.filter(z=>c[z]).map(z=>`<span>${z} ${c[z]}</span>`).join('')+`<span style="background:#e6f6df">합계 ${n}장</span>${S.price?`<span>${(n*+S.price).toLocaleString('ko-KR')}원</span>`:''}${none?`<span style="background:#fde3dd">사이즈 미정 ${none}명</span>`:''}`;$('#price').value=S.price||''}
function orderText(){const c={};let n=0;S.people.forEach(p=>{if(p.size){c[p.size]=(c[p.size]||0)+(+p.n||1);n+=+p.n||1}});return `👕 선교티 주문표\n`+SIZES.filter(z=>c[z]).map(z=>`${z}: ${c[z]}장`).join('\n')+`\n합계 ${n}장${S.price?` · ${(n*+S.price).toLocaleString('ko-KR')}원`:''}\n\n`+S.people.map(p=>`${p.name||'(이름)'} ${p.size||'미정'}${(+p.n||1)>1?' ×'+p.n:''}${p.memo?' ('+p.memo+')':''}`).join('\n')}
async function mission(){if(!MID)return null;try{const d=await new Promise((res,rej)=>{const r=indexedDB.open('mission-pack');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(!d.objectStoreNames.contains('camps')){d.close();return null}
  const m=await new Promise(r=>{const q=d.transaction('camps').objectStore('camps').get(MID);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});d.close();return m}catch(_){return null}}
if(MODE==='mission'){$('#orderCard').hidden=false;
  document.addEventListener('input',e=>{const t=e.target;if(t.dataset.p!=null){S.people[+t.dataset.p][t.dataset.pk]=t.value;save();tot()}if(t.id==='price'){S.price=t.value;save();tot()}});
  document.addEventListener('change',e=>{if(e.target.dataset.pk==='size')tot()});
  document.addEventListener('click',e=>{const t=e.target;if(t.dataset&&t.dataset.prm!=null){S.people.splice(+t.dataset.prm,1);save();table()}});
  $('#addP').onclick=()=>{S.people.push({name:'',size:'',n:1});save();table();const L=document.querySelectorAll('[data-pk=name]');L[L.length-1].focus()};
  $('#copyO').onclick=async()=>{try{await navigator.clipboard.writeText(orderText());toast('📋 복사했어요. 카톡에 붙여넣으세요')}catch(_){prompt('복사해 주세요',orderText())}};
  $('#csvO').onclick=()=>{const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};const rows=[['이름','사이즈','수량','메모'],...S.people.map(p=>[p.name,p.size,p.n||1,p.memo||''])];D.download(new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}),'선교티_주문표.csv')};
  $('#namesIn').onclick=()=>{const N=S.people.map(p=>(p.name||'').trim()).filter(Boolean);if(!N.length){toast('주문표에 이름을 먼저 적거나 불러와 주세요');return}const cols=N.length>24?4:N.length>10?3:2,rows=[];for(let i=0;i<N.length;i+=cols)rows.push(N.slice(i,i+cols).join('   '));
    const p=P();p.b.els.push({id:D.uid(),type:'text',t:rows.join('\n'),font:'Do Hyeon',size:28,lh:1.5,ls:1,align:'center',color:'#1f2a44',x:300,y:420,w:400,h:42*rows.length});save();open(true);toast('🙋 뒷면에 이름을 넣었어요. 끌어서 옮기고 크기를 바꿔요')};
  $('#loadM').onclick=async()=>{const m=await mission();if(!m){toast('선교를 찾지 못했어요');return}let add=0;(m.people||[]).forEach(p=>{if(p.name&&!S.people.some(x=>x.name===p.name)){S.people.push({name:p.name,size:'',n:1});add++}});save();table();toast(add?`🙋 ${add}명을 불러왔어요`:'새로 불러올 사람이 없어요')};
  table()}
(async()=>{if(MODE==='mission'){const m=await mission();if(m){$('#loadM').hidden=false;$('#backM').hidden=false;$('#backM').href='../mission/?c='+encodeURIComponent(MID);document.title=m.name+' 선교티 | 치영의 교회 생활 즐기기';
   if(!localStorage.getItem(KEY)){S.people=(m.people||[]).filter(p=>p.name).map(p=>({name:p.name,size:'',n:1}));save();table()}}}
  open()})();
window.__tee={S:()=>S,ED};
})();
</script>
