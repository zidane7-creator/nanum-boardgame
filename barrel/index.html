<title>깜짝통 게임 | 치영의 교회 생활 즐기기 · 칼 꽂다 양이 튀어나오면 걸리는 게임</title>
<meta name="description" content="참가자 이름을 순서대로 적고 차례대로 통에 칼을 꽂아요. 숨은 구멍에 꽂으면 통 속 양이 깜짝 튀어나와 걸려요. 칼 개수도 정할 수 있는 교회 레크리에이션·벌칙 정하기 게임.">
<meta name="keywords" content="깜짝통 게임, 칼 꽂기 게임, 벌칙 정하기, 교회 레크리에이션, 아이스브레이킹 게임">

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>
:root{--ink:#3b2a20;--cream:#fffaf0;--line:#e3d6c2;--accent:#e8503a;--gold:#f5b82e;--green:#3f9a55;--muted:#7a6a5c;--soft:#f6efe2}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);background:#f7f1e6;font:16px/1.55 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
h1,h2,h3,.j,.top{font-family:"Jua","Apple SD Gothic Neo",sans-serif;font-weight:normal}
button{font:inherit;color:var(--ink);border:2px solid var(--ink);background:var(--cream);border-radius:14px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}button:disabled{opacity:.45;cursor:default;transform:none}
button.pri{background:var(--accent);color:#fff}button.ok{background:var(--green);color:#fff}
button.sm{padding:3px 10px;font-size:14px;border-radius:10px;box-shadow:0 2px 0 var(--ink)}button.big{font-size:23px;padding:12px 30px;font-family:Jua,sans-serif}
input,select,textarea{font:inherit;color:var(--ink);border:2px solid #cdbda6;border-radius:12px;padding:7px 10px;background:#fff;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:rgba(255,255,255,.95);border-bottom:4px solid var(--gold)}
.top a{color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:14px;padding:3px 10px;background:var(--cream)}.top .ttl{flex:1;font-size:19px}
main{max-width:860px;margin:0 auto;padding:14px 12px 90px}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.card h2{margin:0 0 8px;font-size:23px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.hint{font-size:14px;color:var(--muted)}.center{text-align:center}
.hero{text-align:center;padding:4px 0 10px}.hero .em{font-size:58px;line-height:1.1}.hero h1{margin:4px 0 0;font-size:clamp(30px,7vw,42px)}
.lbl{font-family:Jua,sans-serif;font-size:17px;margin:14px 0 6px;display:block}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pchip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:#fff7e6;font-family:Jua,sans-serif;font-size:16px}
.pchip b{font-weight:normal;color:var(--muted);font-size:13px}
/* 게임 */
.turn{font-family:Jua,sans-serif;font-size:clamp(22px,5vw,32px);text-align:center;padding:10px;border-radius:16px;background:#fff6d8;border:2px solid var(--gold);margin-bottom:10px}
.turn b{font-weight:normal;color:var(--accent)}
.order{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
.order .pchip.now{background:var(--gold);transform:scale(1.08)}
.order .pchip.out{opacity:.4}
.scene{position:relative;height:clamp(420px,66vw,540px);display:flex;align-items:flex-end;justify-content:center;overflow:visible}
.barrel{position:relative;width:min(92vw,440px);height:clamp(260px,46vw,330px);border-radius:46% 46% 40% 40%/14% 14% 12% 12%;
  background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 18%,rgba(255,255,255,.15) 45%,transparent 70%,rgba(0,0,0,.28)),repeating-linear-gradient(90deg,#b8763b 0 38px,#a5652f 38px 41px);
  border:4px solid #5a3412;box-shadow:0 12px 0 rgba(0,0,0,.15)}
.barrel.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px) rotate(-1.5deg)}40%{transform:translateX(6px) rotate(1.5deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.band{position:absolute;left:-4px;right:-4px;height:16px;background:linear-gradient(#9aa3ab,#5d666e);border:2px solid #3e454b;border-radius:8px}
.mouth{position:absolute;left:8%;right:8%;top:-22px;height:44px;border-radius:50%;background:radial-gradient(ellipse at 50% 60%,#2a1708 55%,#6b4220 57%,#8a5528 70%);border:4px solid #5a3412;z-index:1}
.holes{position:absolute;inset:44px 20px 30px;display:grid;gap:6px;z-index:2;align-content:space-evenly}
.hole{position:relative;width:100%;aspect-ratio:1;max-width:44px;justify-self:center;border-radius:50%;border:none;padding:0;cursor:pointer;
  background:radial-gradient(circle at 50% 45%,#1d0f05 52%,#3d2410 60%,#c58a50 64%,#8a5528 72%);box-shadow:none}
.hole:hover:not(:disabled){transform:scale(1.15);filter:brightness(1.25)}
.hole:disabled{cursor:default;opacity:1}
.hole .sw{position:absolute;left:50%;top:50%;width:14px;height:58px;margin-left:-7px;margin-top:-62px;border-radius:6px 6px 3px 3px;background:var(--c);border:2px solid #2b1b10;transform-origin:50% 100%;animation:stab .25s ease-out;pointer-events:none}
.hole .sw::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-4px;height:7px;border-radius:4px;background:#d9d9d9;border:2px solid #2b1b10}
@keyframes stab{from{transform:translateY(-30px) scale(1.2);opacity:0}}
.sheep{position:absolute;left:50%;bottom:calc(100% - 26px);width:120px;margin-left:-60px;z-index:0;transition:transform .2s}
.sheep.peek{animation:peek 2.6s ease-in-out infinite}
@keyframes peek{0%,100%{transform:translateY(18px)}50%{transform:translateY(8px)}}
.sheep.pop{animation:pop 1.6s cubic-bezier(.2,.9,.3,1.2) forwards;z-index:5}
@keyframes pop{0%{transform:translateY(20px) rotate(0)}35%{transform:translateY(-170px) rotate(-200deg) scale(1.25)}60%{transform:translateY(-110px) rotate(-340deg) scale(1.2)}100%{transform:translateY(-125px) rotate(-360deg) scale(1.25)}}
.boom{position:absolute;left:50%;top:10%;transform:translateX(-50%);font-family:Jua,sans-serif;font-size:clamp(34px,8vw,56px);color:var(--accent);text-shadow:0 3px 0 #fff,0 0 12px #fff;z-index:6;animation:boom .6s ease-out both;white-space:nowrap}
@keyframes boom{from{transform:translateX(-50%) scale(.3);opacity:0}}
.log{font-size:14px;color:var(--muted);text-align:center;margin-top:8px;min-height:1.5em}
.res{text-align:center}
.res .who{font-family:Jua,sans-serif;font-size:clamp(34px,9vw,58px);color:var(--accent);line-height:1.2}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:14px;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.barrel.shake,.sheep.peek{animation:none}}
</style>
</head><body>
<div class="top"><a href="../">← 목장</a><span class="ttl">🛢️ 깜짝통 게임</span></div>
<main id="app"><div class="card center">불러오는 중…</div></main>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tt;function toast(t,ms){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),ms||2200)}
const COLS=["#e8503a","#3b82c4","#3f9a55","#f5b82e","#8e5cc8","#e86fa4","#1fa3a3","#ff8a3d","#6b7a8f","#b5532a"];
/* 통 안의 양 (이 사이트의 양 캐릭터) */
const SHEEP=`<svg viewBox="0 0 120 110" aria-hidden="true"><g fill="#fffaf2" stroke="#6b5444" stroke-width="3"><circle cx="30" cy="62" r="20"/><circle cx="50" cy="44" r="22"/><circle cx="74" cy="44" r="22"/><circle cx="92" cy="64" r="20"/><circle cx="60" cy="78" r="26"/></g>
  <ellipse cx="60" cy="66" rx="30" ry="28" fill="#fde7d2" stroke="#6b5444" stroke-width="3"/>
  <g fill="#fffaf2" stroke="#6b5444" stroke-width="2.5"><circle cx="46" cy="40" r="10"/><circle cx="60" cy="36" r="11"/><circle cx="74" cy="40" r="10"/></g>
  <ellipse cx="28" cy="62" rx="10" ry="6" fill="#e9c3a6" stroke="#6b5444" stroke-width="2.5" transform="rotate(-25 28 62)"/><ellipse cx="92" cy="62" rx="10" ry="6" fill="#e9c3a6" stroke="#6b5444" stroke-width="2.5" transform="rotate(25 92 62)"/>
  <g class="eyes"><circle cx="50" cy="64" r="4.5" fill="#2b1d14"/><circle cx="70" cy="64" r="4.5" fill="#2b1d14"/><circle cx="51.5" cy="62.5" r="1.5" fill="#fff"/><circle cx="71.5" cy="62.5" r="1.5" fill="#fff"/></g>
  <circle cx="44" cy="74" r="4" fill="#ff9fb0" opacity=".8"/><circle cx="76" cy="74" r="4" fill="#ff9fb0" opacity=".8"/><path d="M54 76 Q60 82 66 76" stroke="#6b5444" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
/* ---------- 설정 ---------- */
let SET={names:"",holes:24};try{Object.assign(SET,JSON.parse(localStorage.getItem("barrel-setup")||"{}"))}catch(e){}
const saveSet=()=>{try{localStorage.setItem("barrel-setup",JSON.stringify(SET))}catch(e){}};
const names=()=>String(SET.names||"").split(/[\n,，、]+/).map(x=>x.trim()).filter(Boolean).slice(0,40);
function renderSetup(){
  const L=names();
  app.innerHTML=`<div class="hero"><div class="em">🛢️🗡️</div><h1>깜짝통 게임</h1><div class="hint">차례대로 통에 칼을 꽂다가, 통 속 양이 깜짝 튀어나오면 걸려요!</div></div>
  <div class="card"><h2>👥 참가자 (순서대로)</h2>
    <textarea id="nm" rows="4" placeholder="한 줄에 한 명씩, 또는 쉼표로 (적은 순서대로 칼을 꽂아요)&#10;예) 철수, 영희, 민수, 지연">${esc(SET.names)}</textarea>
    <div class="row" style="margin-top:6px"><span class="hint" id="cnt">${L.length}명</span><span class="sp"></span><button class="sm" id="shuf">🔀 순서 섞기</button></div>
    <div class="plist" id="pl">${L.map((n,i)=>`<span class="pchip"><b>${i+1}</b>${esc(n)}</span>`).join("")}</div>
    <span class="lbl">🗡️ 칼 개수 (통의 구멍 수)</span>
    <div class="row"><select id="holes">${[8,10,12,16,20,24,28,32,36,40].map(n=>`<option value="${n}" ${+SET.holes===n?"selected":""}>${n}개</option>`).join("")}</select>
      <span class="hint">구멍 중 딱 하나가 ‘깜짝 구멍’이에요. 칼이 많을수록 오래 버텨요.</span></div>
  </div>
  <div class="center"><button class="big pri" id="go">🛢️ 시작!</button></div>`;
  const upd=()=>{SET.names=$("#nm").value;saveSet();const L=names();$("#cnt").textContent=L.length+"명";$("#pl").innerHTML=L.map((n,i)=>`<span class="pchip"><b>${i+1}</b>${esc(n)}</span>`).join("")};
  $("#nm").oninput=upd;
  $("#shuf").onclick=()=>{const L=names();for(let i=L.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[L[i],L[j]]=[L[j],L[i]]}$("#nm").value=L.join("\n");upd();toast("순서를 섞었어요 🔀")};
  $("#holes").onchange=e=>{SET.holes=+e.target.value;saveSet()};
  $("#go").onclick=()=>{const L=names();if(L.length<2){toast("참가자를 2명 이상 적어 주세요");$("#nm").focus();return}start(L,0)}}
/* ---------- 게임 ---------- */
let G=null;
function start(L,first){const n=+SET.holes||24;G={L,n,turn:first%L.length,trap:Math.floor(Math.random()*n),filled:{},count:{},over:false};render()}
/* 구멍 수가 줄마다 딱 떨어지게: 한 줄 4~9개, 3~4줄에 가깝게 */
function gridCols(n){let best=null;for(let c=4;c<=9;c++){if(n%c)continue;const r=n/c,sc=Math.abs(r-3.5)+(c>8?.5:0);if(!best||sc<best.sc||(sc===best.sc&&c<best.c))best={c,sc}}return best?best.c:Math.min(8,Math.ceil(n/4))}
function render(){const{L,n,turn}=G;const cols=gridCols(n);
  app.innerHTML=`<div class="order">${L.map((x,i)=>`<span class="pchip ${i===turn&&!G.over?"now":""}"><b>${i+1}</b>${esc(x)}${G.count[i]?` 🗡️${G.count[i]}`:""}</span>`).join("")}</div>
  <div class="turn" id="turn">${G.over?`😱 <b>${esc(L[G.loser])}</b>님 걸렸어요!`:`🗡️ <b>${esc(L[turn])}</b>님 차례! 칼을 꽂을 구멍을 골라요`}</div>
  <div class="scene"><div class="barrel" id="barrel"><div class="sheep peek" id="sheep">${SHEEP}</div><div class="mouth"></div>
    <div class="band" style="top:22%"></div><div class="band" style="top:78%"></div>
    <div class="holes" style="grid-template-columns:repeat(${cols},1fr)">${Array.from({length:n},(_,i)=>{const f=G.filled[i];return `<button class="hole" data-h="${i}" ${f!=null||G.over?"disabled":""} aria-label="${i+1}번 구멍">${f!=null?`<span class="sw" style="--c:${COLS[f%COLS.length]}"></span>`:""}</button>`}).join("")}</div></div></div>
  <div class="log" id="log">${Object.keys(G.filled).length}개 꽂음 · 남은 구멍 ${n-Object.keys(G.filled).length}개</div>
  <div class="row" style="justify-content:center;margin-top:10px"><button class="sm" id="back">⚙️ 설정으로</button></div>`;
  $$(".hole").forEach(b=>b.onclick=()=>stab(+b.dataset.h));
  $("#back").onclick=()=>{if(G.over||confirm("게임을 그만하고 설정으로 갈까요?")){G=null;renderSetup()}}}
function stab(h){if(!G||G.over||G.filled[h]!=null)return;ac();const p=G.turn;G.filled[h]=p;G.count[p]=(G.count[p]||0)+1;
  if(h===G.trap){G.over=true;G.loser=p;render();snd("boing");const sh=$("#sheep");sh.classList.remove("peek");void sh.offsetWidth;sh.classList.add("pop");
    $("#barrel").classList.add("shake");const b=document.createElement("div");b.className="boom";b.textContent="깜짝!! 🐑";$(".scene").appendChild(b);confetti();
    setTimeout(result,1700);return}
  snd("thunk");G.turn=(G.turn+1)%G.L.length;render();const br=$("#barrel");br.classList.add("shake");
  const left=G.n-Object.keys(G.filled).length;if(left<=3)toast(`남은 구멍 ${left}개! 두근두근…`)}
function result(){if(!G)return;const{L,loser}=G;
  const box=document.createElement("div");box.className="card res";box.style.marginTop="14px";
  box.innerHTML=`<div class="hint">🛢️ 깜짝 구멍에 칼을 꽂은 사람</div><div class="who">${esc(L[loser])}</div><div class="hint">칼 ${Object.keys(G.filled).length}번째에 양이 튀어나왔어요</div>
   <div class="row" style="justify-content:center;margin-top:12px"><button class="pri" id="again">🔁 다시 하기 (${esc(L[(loser+1)%L.length])}님부터)</button><button id="again1">🔁 1번부터 다시</button><button id="setup">⚙️ 설정 바꾸기</button></div>`;
  app.appendChild(box);box.scrollIntoView({behavior:"smooth",block:"nearest"});
  $("#again").onclick=()=>start(L,loser+1);$("#again1").onclick=()=>start(L,0);$("#setup").onclick=()=>{G=null;renderSetup()}}
/* ---------- 소리 · 꽃가루 ---------- */
let AC=null;function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function snd(k){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  if(k==="thunk"){o.type="triangle";o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(70,t+.12);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.start(t);o.stop(t+.18)}
  else{o.type="square";o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(900,t+.25);o.frequency.exponentialRampToValueAtTime(300,t+.6);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);o.start(t);o.stop(t+.72)}}
function confetti(){const box=document.createElement("div");box.className="confetti";const em=["🎉","💥","✨","🐑","⭐"];
  for(let i=0;i<36;i++){const e=document.createElement("i");e.textContent=em[i%em.length];e.style.left=Math.random()*100+"%";e.style.animationDuration=(2+Math.random()*2)+"s";e.style.animationDelay=(Math.random()*.8)+"s";box.appendChild(e)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),5000)}
window.__barrelTest={peek:()=>G,stab};
renderSetup();
})();
</script>
