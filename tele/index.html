<style>
:root{--ink:#3b2a20;--cream:#fffaf0;--paper:#fff;--accent:#e8503a;--green:#5aa957;--sky:#d6f2fc;--line:#d9cbb8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sky);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(#a9e2f8,#d6f2fc 260px,#c3e78f 261px)}
button{font:inherit;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:16px;padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}

input[type=text]{font:inherit;font-size:20px;padding:10px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);width:100%}

.top .ttl{flex:1;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer{font-size:22px;min-width:64px;text-align:right}#timer.low{color:var(--accent);animation:blink .6s infinite}
@keyframes blink{50%{opacity:.4}}
#bar{position:sticky;top:0;height:5px;background:var(--accent);width:0;transition:width 1s linear;z-index:21}
main{max-width:980px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:22px;padding:20px;margin:0 auto 16px;max-width:620px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.card h2{margin:0 0 10px;font-size:24px;font-weight:normal}

.hero{text-align:center;padding:10px 0 4px}.hero .em{font-size:64px;line-height:1}
.hero h1{font-weight:normal;font-size:clamp(30px,7vw,44px);margin:6px 0}
.note{background:#fff3c4;border:2px dashed #c9a227;border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.5;margin:10px 0}
/* lobby */
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:760px){.lobby{grid-template-columns:1fr}}
.qr{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px;display:inline-block}

.code{font-size:40px;letter-spacing:6px}

.seat .nm{font-size:13px;background:var(--cream);border:1.5px solid var(--ink);border-radius:10px;padding:1px 6px;max-width:84px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:6px}

/* sketchbook */
.book{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:10px 10px 18px 18px;padding:34px 14px 14px;box-shadow:0 6px 0 rgba(0,0,0,.15);max-width:900px;margin:0 auto}
.book::before{content:"";position:absolute;left:18px;right:18px;top:-12px;height:24px;background:repeating-linear-gradient(90deg,transparent 0 14px,#9aa3ad 14px 22px,transparent 22px 30px);border-radius:6px}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:8px}

.step{font-size:14px;opacity:.65;flex:1}
.lenbox{display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px}
.lenbox .bx{width:52px;height:52px;border:3px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;background:#fff}
.lenbox select{font:inherit;font-size:26px;width:58px;height:54px;border:3px solid var(--ink);border-radius:8px;text-align:center;text-align-last:center;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
.prompt{background:#f6f1e7;border:2px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:18px}

.tools input[type=range]{width:140px;accent-color:var(--accent)}

.prevpic .lenbox{position:absolute;top:8px;right:8px}
.ansrow{display:flex;gap:8px;align-items:center;margin:10px 0}
.tabs{display:flex;gap:6px;margin:6px 0}
.ready{display:flex;justify-content:center;gap:10px;margin-top:12px}
.ready button{font-size:22px;padding:10px 40px}
.wait{position:fixed;inset:0;background:rgba(40,30,20,.55);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
.wait.show{display:flex}

/* reveal */
.rv .pg{min-height:240px}
.rv .who{font-size:15px;opacity:.75;margin-bottom:6px}
.rv .ans{font-size:clamp(30px,7vw,48px);text-align:center;margin:10px 0}
.rv img{display:block;width:100%;border:2px solid var(--line);border-radius:10px;background:#fff}
.dots{display:flex;gap:5px;justify-content:center;margin:10px 0}.dots i{width:9px;height:9px;border-radius:50%;background:#ccc}.dots i.on{background:var(--accent)}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;font-size:clamp(22px,5vw,34px);margin:12px 0}
.score{display:flex;flex-direction:column;gap:6px}
.score .s{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:18px}
.score .s .n{flex:1}.score .s b{font-weight:normal;font-size:24px;color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--cream);border:2px solid var(--ink);border-radius:16px;padding:10px 18px;z-index:40;transition:.25s;box-shadow:0 4px 0 var(--ink);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.about{max-width:620px;margin:20px auto 0;font-size:14px;line-height:1.6;opacity:.8}
</style></head><body>
<div class="top"><a href="../">← 목장</a><div class="ttl" id="ttl">🎨 텔레스트레이션</div><div id="timer"></div></div>
<div id="bar"></div>
<main id="app"></main>
<div class="wait" id="wait"><div class="card center" style="max-width:420px"><div style="font-size:44px">✋</div><h2>준비 완료!</h2><p class="muted" id="waitTxt">다른 사람을 기다리고 있어요</p><button id="unready">다시 고치기</button></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="words.js"></script>
<script>
"use strict";
/* =====================================================================
   텔레스트레이션 — no server: the room maker's device is the "host" and
   every other device connects to it directly (WebRTC via PeerJS).
   ===================================================================== */
const PREFIX="chiyoung-tele-",SECS=90,MAX=10,GRACE=3;
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").replace(/\s+/g,"").trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let tt;function toast(t,ms=2200){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),ms)}
const params=new URLSearchParams(location.search);
let ROOM=(params.get("room")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const store={get(k){try{return JSON.parse(sessionStorage.getItem(k))}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* keep the screen awake during a game (where supported) */
let wake=null;async function keepAwake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible"&&C.phase&&C.phase!="home")keepAwake()});

/* ---------------- client state (every device, host included) ---------------- */
const C={phase:"home",me:null,name:"",lobby:null,task:null,submitted:false,deadline:0,book:null,pg:0,verdictSent:false,scores:null};
let peer=null,conn=null,isHost=false,retry=0;

function toHost(msg){if(isHost)hostHandle("host",msg);else if(conn&&conn.open)conn.send(msg);else toast("연결이 끊겼어요. 다시 연결하는 중…")}

/* ================= HOST ================= */
const H={players:[],seats:[],phase:"lobby",r:0,N:0,books:{},sub:{},timer:null,deadline:0,verdicts:{},scores:{},games:0};
const P=id=>H.players.find(p=>p.id==id);
const pname=id=>(P(id)||{}).name||"?";
function sendTo(p,msg){if(!p)return;if(p.id=="host")setTimeout(()=>client(msg),0);else if(p.conn&&p.conn.open){try{p.conn.send(msg)}catch(e){}}}
const broadcast=msg=>H.players.forEach(p=>sendTo(p,msg));
function lobbyMsg(){return{t:"lobby",room:ROOM,players:H.players.map(p=>({id:p.id,name:p.name,online:p.id=="host"||!!(p.conn&&p.conn.open)})),seats:H.seats,scores:H.scores,phase:H.phase}}
function pushLobby(){broadcast(lobbyMsg())}

function createRoom(name){
  isHost=true;C.me="host";C.name=name;
  const code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
  ROOM=code;renderMsg("방을 만들고 있어요…");
  peer=new Peer(PREFIX+code,{debug:0});
  peer.on("open",()=>{H.players=[{id:"host",name,conn:null}];H.seats=["host"];history.replaceState(null,"","?host="+code);pushLobby();keepAwake()});
  peer.on("error",e=>{if(e.type=="unavailable-id"){peer.destroy();createRoom(name)}else if(e.type=="network"||e.type=="server-error"||e.type=="socket-error"){toast("인터넷 연결을 확인해 주세요")}else console.warn(e)});
  peer.on("disconnected",()=>{setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
  peer.on("connection",c=>{
    c.on("data",d=>{if(d&&d.t=="join")hostJoin(c,d);else{const p=H.players.find(p=>p.conn===c);if(p)hostHandle(p.id,d)}});
    c.on("close",()=>{if(H.phase=="lobby")pushLobby()});
  });
}
/* only accept well-formed pages from other devices */
function cleanPage(p){p=p||{};const img=typeof p.img=="string"&&p.img.length<1500000&&/^data:image\/(jpeg|png);base64,[A-Za-z0-9+/=]+$/.test(p.img)?p.img:null;
  const len=Number.isInteger(p.len)&&p.len>=1&&p.len<=7?p.len:null;return{img,len,text:typeof p.text=="string"?p.text.trim().slice(0,30):""}}
function hostJoin(c,d){
  d.id=String(d.id||"").replace(/[^a-z0-9]/gi,"").slice(0,20);if(!d.id)return;
  const name=String(d.name||"").trim().slice(0,10)||"이름없음";let p=P(d.id);
  if(p){p.conn=c;if(H.phase=="lobby")p.name=name}
  else{
    if(H.phase!="lobby"){c.send({t:"err",msg:"게임이 이미 시작됐어요. 이번 판이 끝나면 들어와 주세요."});return}
    if(H.players.length>=MAX){c.send({t:"err",msg:"방이 꽉 찼어요 (최대 "+MAX+"명)"});return}
    p={id:d.id,name,conn:c};H.players.push(p);H.seats.push(p.id);
  }
  pushLobby();syncOne(p);
}
/* resend whatever this player should be looking at (used after a reconnect) */
function syncOne(p){
  if(H.phase=="play"){const t=taskFor(p.id);if(t){t.done=!!H.sub[p.id];sendTo(p,t)}}
  else if(H.phase=="reveal"){sendTo(p,revealFor(p.id));if(H.verdicts[p.id]!=null)sendTo(p,{t:"verdictOk"})}
  else if(H.phase=="score")sendTo(p,scoreMsg());
}
function hostHandle(from,m){
  if(!m||!m.t)return;
  if(m.t=="seats"&&from=="host"&&H.phase=="lobby"){H.seats=m.seats.filter(id=>P(id));pushLobby()}
  else if(m.t=="kick"&&from=="host"&&H.phase=="lobby"&&m.id!="host"){const p=P(m.id);if(p){sendTo(p,{t:"err",msg:"방장이 내보냈어요"});H.players=H.players.filter(x=>x!==p);H.seats=H.seats.filter(x=>x!=m.id);pushLobby()}}
  else if(m.t=="start"&&from=="host"&&(H.phase=="lobby"||H.phase=="score"))startGame();
  else if(m.t=="toLobby"&&from=="host"){clearTimeout(H.timer);H.phase="lobby";pushLobby()}
  else if(m.t=="submit"&&H.phase=="play"&&m.r==H.r){H.sub[from]=cleanPage(m.page);progress();if(H.seats.every(id=>H.sub[id]))endRound()}
  else if(m.t=="unready"&&H.phase=="play"&&m.r==H.r){delete H.sub[from];progress()}
  else if(m.t=="verdict"&&H.phase=="reveal"){H.verdicts[from]=!!m.ok;sendTo(P(from),{t:"verdictOk"});revealProgress();if(H.seats.every(id=>H.verdicts[id]!=null))finishGame()}
  else if(m.t=="finish"&&from=="host"&&H.phase=="reveal")finishGame();
}
function startGame(){
  H.seats=H.seats.filter(id=>P(id));H.N=H.seats.length;if(H.N<2){toast("2명 이상 있어야 시작할 수 있어요");return}
  const ws=shuffle(WORDS).slice(0,H.N);H.books={};H.seats.forEach((id,i)=>H.books[id]={word:ws[i],pages:[{kind:"word",text:ws[i],by:id}]});
  H.phase="play";H.r=0;H.verdicts={};H.games++;startRound();
}
/* round r: the player in seat s holds the sketchbook of the player r seats before them */
function actionAt(r){return(H.N%2==1&&r==0)?"view":((r+H.N)%2==0?"draw":"guess")}
function ownerAt(seat,r){return H.seats[((seat-r)%H.N+H.N)%H.N]}
function taskFor(id){const s=H.seats.indexOf(id);if(s<0)return null;const owner=ownerAt(s,H.r),b=H.books[owner],prev=b.pages[b.pages.length-1];
  return{t:"task",r:H.r,N:H.N,action:actionAt(H.r),owner:pname(owner),ownerId:owner,prev:{...prev,byName:pname(prev.by)},secs:Math.max(1,Math.round((H.deadline-Date.now())/1000)-GRACE)}}
function startRound(){H.sub={};H.deadline=Date.now()+(SECS+GRACE)*1000;H.seats.forEach(id=>sendTo(P(id),taskFor(id)));progress();clearTimeout(H.timer);H.timer=setTimeout(endRound,(SECS+GRACE)*1000)}
function progress(){broadcast({t:"progress",r:H.r,done:H.seats.filter(id=>H.sub[id]).length,total:H.N,waiting:H.seats.filter(id=>!H.sub[id]).map(pname)})}
function endRound(){
  if(H.phase!="play")return;clearTimeout(H.timer);const act=actionAt(H.r);
  if(act!="view")H.seats.forEach((id,s)=>{const owner=ownerAt(s,H.r),pg=H.sub[id]||{kind:act,missing:true};pg.kind=act;pg.by=id;H.books[owner].pages.push(pg)});
  H.r++;if(H.r<H.N)startRound();else{H.phase="reveal";H.seats.forEach(id=>sendTo(P(id),revealFor(id)));revealProgress()}
}
function revealFor(id){const b=H.books[id];return{t:"reveal",book:{owner:pname(id),word:b.word,pages:b.pages.map(p=>({...p,byName:pname(p.by)}))}}}
function revealProgress(){broadcast({t:"rprogress",done:H.seats.filter(id=>H.verdicts[id]!=null).length,total:H.N,waiting:H.seats.filter(id=>H.verdicts[id]==null).map(pname)})}
function finishGame(){
  if(H.phase!="reveal")return;H.seats.forEach(id=>{if(H.verdicts[id])H.scores[id]=(H.scores[id]||0)+1});H.phase="score";broadcast(scoreMsg());
}
function scoreMsg(){return{t:"scores",games:H.games,list:H.players.map(p=>({name:p.name,score:H.scores[p.id]||0,ok:H.verdicts[p.id],word:(H.books[p.id]||{}).word,last:lastAnswer(H.books[p.id])})).sort((a,b)=>b.score-a.score)}}
function lastAnswer(b){if(!b)return"";const g=[...b.pages].reverse().find(p=>p.kind=="guess");return g?(g.text||(g.img?"(손글씨)":"")):""}

/* ================= GUEST connection ================= */
function joinRoom(name){
  C.name=name;let id=store.get("tele-id-"+ROOM);if(!id){id="p"+Math.random().toString(36).slice(2,10);store.set("tele-id-"+ROOM,id)}
  C.me=id;store.set("tele-name-"+ROOM,name);renderMsg("방에 들어가는 중…");
  const go=()=>{conn=peer.connect(PREFIX+ROOM,{reliable:true});
    conn.on("open",()=>{retry=0;conn.send({t:"join",id,name});keepAwake()});
    conn.on("data",client);
    conn.on("close",()=>{toast("방장과 연결이 끊겼어요. 다시 연결하는 중…",4000);setTimeout(reconnect,1500)});};
  if(peer&&!peer.destroyed&&peer.open)go();
  else{peer=new Peer({debug:0});peer.on("open",go);
    peer.on("error",e=>{if(e.type=="peer-unavailable"){if(C.phase=="home"||C.phase=="msg")renderMsg("방을 찾을 수 없어요 😢<br><span class='muted'>방 코드가 맞는지, 방장의 화면이 켜져 있는지 확인해 주세요.</span>",true);else setTimeout(reconnect,2500)}else if(e.type=="network")toast("인터넷 연결을 확인해 주세요")});
    peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}})}
}

/* ================= CLIENT message handling ================= */
function client(m){
  if(m.t=="lobby"){C.lobby=m;if(m.phase=="lobby"){C.phase="lobby";renderLobby()}}
  else if(m.t=="err"){renderMsg(esc(m.msg),true)}
  else if(m.t=="task"){if(C.task&&C.task.r==m.r&&C.phase=="task"){if(m.done)showWait(true);return}C.task=m;C.submitted=!!m.done;C.deadline=Date.now()+m.secs*1000;C.phase="task";renderTask();showWait(C.submitted)}
  else if(m.t=="progress"){if(C.task&&m.r==C.task.r){$("#waitTxt").innerHTML=m.done+" / "+m.total+"명 준비 완료"+(m.waiting.length?"<br><span style='font-size:14px'>기다리는 중: "+m.waiting.map(esc).join(", ")+"</span>":"")}}
  else if(m.t=="reveal"){C.phase="reveal";C.book=m.book;C.pg=0;C.verdictSent=false;showWait(false);stopTimer();renderReveal()}
  else if(m.t=="verdictOk"){C.verdictSent=true;if(C.phase=="reveal")renderReveal()}
  else if(m.t=="rprogress"){C.rp=m;const e=$("#rprog");if(e)e.innerHTML=rpText()}
  else if(m.t=="scores"){C.phase="score";C.scores=m;showWait(false);stopTimer();renderScores()}
}

/* ---------- drawing pad ---------- */
function makePad(cv,w,h){
  cv.width=w;cv.height=h;const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.lineCap="round";ctx.lineJoin="round";
  const pad={tool:"pen",size:{pen:6,eraser:34},dirty:false,on:true};let last=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*w/r.width,(e.clientY-r.top)*h/r.height]};
  const style=()=>{ctx.strokeStyle=ctx.fillStyle=pad.tool=="pen"?"#1f1a17":"#fff";ctx.lineWidth=pad.size[pad.tool]};
  const dot=p=>{style();ctx.beginPath();ctx.arc(p[0],p[1],pad.size[pad.tool]/2,0,7);ctx.fill()};
  const seg=(a,b)=>{style();ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()};
  cv.onpointerdown=e=>{if(!pad.on)return;e.preventDefault();cv.setPointerCapture(e.pointerId);last=pt(e);dot(last);pad.dirty=true};
  cv.onpointermove=e=>{if(!last||!pad.on)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){const p=pt(ev);seg(last,p);last=p}};
  cv.onpointerup=cv.onpointercancel=()=>{last=null};
  pad.clear=()=>{ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);pad.dirty=false};
  pad.data=()=>pad.dirty?cv.toDataURL("image/jpeg",.6):null;
  return pad}
function toolsHTML(id){return'<div class="tools" id="'+id+'"><button class="sm on" data-tool="pen">✏️ 펜</button><button class="sm" data-tool="eraser">🧽 지우개</button><label class="row" style="gap:4px;font-size:14px">굵기 <input type="range" min="2" max="24" value="6" data-size></label><span style="flex:1"></span><button class="sm" data-clear>🗑 모두 지우기</button></div>'}
function bindTools(id,pad){const t=$("#"+id),rng=t.querySelector("[data-size]");
  const sync=()=>{t.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("on",b.dataset.tool==pad.tool));if(pad.tool=="pen"){rng.min=2;rng.max=24}else{rng.min=10;rng.max=90}rng.value=pad.size[pad.tool]};
  t.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{pad.tool=b.dataset.tool;sync()});
  rng.oninput=()=>pad.size[pad.tool]=+rng.value;
  t.querySelector("[data-clear]").onclick=()=>{if(!pad.dirty||confirm("모두 지울까요?"))pad.clear()};sync()}

function renderReveal(){
  const B=C.book,n=B.pages.length,end=C.pg>=n;$("#ttl").textContent="📒 내 스케치북 돌아보기";
  let h='<div class="book rv"><div class="bh"><span class="owner">📒 '+esc(B.owner)+'의 스케치북</span><span class="step">'+(end?"결과":(C.pg+1)+" / "+n)+'</span></div>';

  if(!end)h+='<div class="pg">'+pageHTML(B.pages[C.pg],C.pg)+'</div>';
  else{const last=[...B.pages].reverse().find(p=>p.kind=="guess")||{},auto=!!last.text&&norm(last.text)==norm(B.word);
    h+='<div class="center"><div class="muted">처음 제시어와 마지막 답을 비교해요</div><div class="cmp"><div><div class="muted" style="font-size:14px">처음</div>'+esc(B.word)+'</div><div>'+(auto?"=":"?")+'</div><div><div class="muted" style="font-size:14px">마지막 ('+esc(last.byName||"")+')</div>'+(last.text?esc(last.text):last.img?'<img src="'+esc(last.img)+'" style="max-height:90px">':'—')+'</div></div>'+
      (C.verdictSent?'<p style="font-size:20px">확인했어요! 다른 사람을 기다리는 중…</p><p class="muted" id="rprog">'+rpText()+'</p>':
       '<p>'+(auto?'똑같아요! 🎉':'같은 답인가요? 다 같이 보고 정해 주세요')+'</p><div class="row" style="justify-content:center"><button class="go" id="vy">✅ 같아요 (+1점)</button><button id="vn">❌ 달라요</button></div>')+'</div>';}
  h+='</div><div class="ready">'+(C.pg>0?'<button id="pv">◀ 이전</button>':'')+(!end?'<button class="pri" id="nx">'+(C.pg==n-1?"결과 보기 ▶":"다음 장 ▶")+'</button>':'')+'</div>';
  if(isHost)h+='<div class="center" style="margin-top:14px"><p class="muted" id="rprog2">'+rpText()+'</p><button class="sm" id="fin">모두 확인 안 해도 점수 보기</button></div>';
  app.innerHTML=h;
  const pv=$("#pv"),nx=$("#nx");if(pv)pv.onclick=()=>{C.pg--;renderReveal()};if(nx)nx.onclick=()=>{C.pg++;renderReveal()};
  const vy=$("#vy"),vn=$("#vn");if(vy)vy.onclick=()=>toHost({t:"verdict",ok:true});if(vn)vn.onclick=()=>toHost({t:"verdict",ok:false});
  const fin=$("#fin");if(fin)fin.onclick=()=>{if(confirm("아직 확인 안 한 사람은 0점으로 처리돼요. 점수를 볼까요?"))toHost({t:"finish"})};
}
/* keep the host's own progress line fresh */
setInterval(()=>{const e=$("#rprog2");if(e&&C.rp)e.innerHTML=rpText()},800);

/* ---------- scores ---------- */
function renderScores(){
  const S=C.scores;$("#ttl").textContent="🏆 점수";
  let h='<div class="card"><h2 class="center">🏆 '+S.games+'번째 게임 결과</h2><div class="score">'+S.list.map((s,i)=>'<div class="s"><span>'+(i==0&&s.score>0?"👑":(i+1)+".")+'</span><span class="n">'+esc(s.name)+(s.word?' <span class="muted" style="font-size:14px">· '+esc(s.word)+' → '+esc(s.last||"—")+' '+(s.ok?"✅":"❌")+'</span>':'')+'</span><b>'+s.score+'점</b></div>').join("")+'</div>';
  h+=isHost?'<div class="ready"><button class="go" id="again">같은 자리로 다음 게임 ▶</button></div><div class="center"><button class="sm" id="lob">자리 다시 정하기 / 사람 더 받기</button></div>':'<p class="muted center" style="margin-top:12px">방장이 다음 게임을 시작하면 바로 이어져요</p>';
  app.innerHTML=h+'</div>';
  if(isHost){$("#again").onclick=()=>toHost({t:"start"});$("#lob").onclick=()=>toHost({t:"toLobby"})}
}

/* warn before leaving mid-game (especially the host) */
addEventListener("beforeunload",e=>{if(isHost&&H.phase!="lobby"||C.phase=="task"){e.preventDefault();e.returnValue=""}});
/* host page reloaded: the room is gone */
if(params.get("host")){history.replaceState(null,"",location.pathname);toast("새로고침해서 방이 닫혔어요. 다시 만들어 주세요.",4000)}
if(typeof Peer=="undefined")renderMsg("게임 연결 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.",true);else renderHome();
</script>
</body></html>
