<script>
(function(){

/* ============ 기본 도구 ============ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const idb={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('mission-pack',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('camps');d.createObjectStore('files')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},

const SPK_ST=['후보','연락 예정','연락함','답변 대기','수락','확정','거절'];

  d('people',[]);d('minutes',[]);d('sched',[]);d('stages',[]);if(R.stage&&!R.stages.length){const it=(R.stage.items||[]).filter(x=>x.pid);if(it.length)R.stages.push({id:'st1',name:'배치 1',items:it})}delete R.stage;if(!R.stages.length)R.stages.push({id:'st1',name:'배치 1',items:[]});

  d('venue',{});const v=R.venue;if(v.expected==null)v.expected=null;if(!v.list)v.list=[];if(!v.crit)v.crit=[{id:'c_snd',name:'음향'},{id:'c_use',name:'용도(프로그램 공간)'}];
  if(!v.w){v.w={fixed:20,var:25,cap:20,loc:15};const r=20/v.crit.length;v.crit.forEach(x=>v.w[x.id]=Math.round(r))}
  if(!v.rules){v.rules={};RULE_KEYS.forEach(k=>v.rules[k]=RULE_DEF[k].rows.map(([f,t,sc])=>({id:uid(),from:f,to:t,s:sc})));
    const w={fixed:15,loc:15,lodge:15,meal:15,dens:15},rest=100-75,n=v.crit.length;v.crit.forEach((x,i)=>w[x.id]=Math.floor(rest/n)+(i<rest%n?1:0));if(!n)w.fixed+=25;v.w=w;
    v.list.forEach(x=>{if(x.mealPrice==null&&x.meal!=null)x.mealPrice=x.meal;if(!x.rooms)x.rooms=[]})}
  v.list.forEach(x=>{if(!x.rooms)x.rooms=[]});

  d('speakers',[]);d('programs',[]);

    [['preacher','c1'],['speaker1','l1'],['speaker2','l2']].forEach(([a,b])=>{if(R.conf[a]){R.conf['slot_'+b]=R.conf[a];delete R.conf[a]}});

  d('spkFinal',{});

  d('acc',{});if(!R.acc.cats)R.acc.cats={in:['선교비','후원','지원금','기타'],out:['준비(데코)','준비(간식)','준비(프로그램)','장소비','강사비','식사','간식','기타']};if(!R.acc.items)R.acc.items=[];

/* 경로로 객체 찾기: "venue.list#ID>sc" */
function objOf(spec){if(spec==null)return null;if(spec==='.')return R;const[main,post]=spec.split('>');const[path,id]=main.split('#');let o=R;for(const p of path.split('.'))o=o==null?o:o[p];

const campRange=()=>R.start?`${R.start.replace(/-/g,'.')}(${DOW[new Date(toT(R.start)).getUTCDay()]}) ~ ${fmtD(campEnd())} · ${R.nights}박 ${+R.nights+1}일`:'';

const LE_REF={
  'cfg.minRoles':(a,b)=>R.people.forEach(p=>{if(p.prep==='min'&&p.role===a)p.role=b}),
  'cfg.staffRoles':(a,b)=>R.people.forEach(p=>{if(p.prep==='staff'&&p.role===a)p.role=b}),
  'cfg.parts':(a,b)=>R.people.forEach(p=>{if(p.parts)p.parts=p.parts.map(x=>x===a?b:x).filter(Boolean)}),
  'grp.roles':(a,b)=>R.grp.list.forEach(g=>{for(const k in g.roles||{})if(g.roles[k]===a){if(b)g.roles[k]=b;else delete g.roles[k]}}),
  'cars.types.in':(a,b)=>R.cars.list.forEach(c=>{if(c.dir==='in'&&c.type===a)c.type=b}),
  'cars.types.out':(a,b)=>R.cars.list.forEach(c=>{if(c.dir==='out'&&c.type===a)c.type=b}),
  'acc.cats.in':(a,b)=>R.acc.items.forEach(x=>{if(x.type==='in'&&x.cat===a)x.cat=b}),
  'acc.cats.out':(a,b)=>R.acc.items.forEach(x=>{if(x.type==='out'&&x.cat===a)x.cat=b})};
function WHO(spec,key,cands,ph){const o=objOf(spec)||{};const arr=o[key]||[];return `<div class="who">${arr.map(id=>`<span class="chip p">${esc(pn(id))}<button class="x" data-act="rmFrom" data-o="${spec}" data-k="${key}" data-v="${id}">×</button></span>`).join('')}<select data-act="addTo" data-o="${spec}" data-k="${key}"><option value="">${esc(ph||'+ 추가')}</option>${cands.filter(p=>!arr.includes(p.id)).sort(byName).map(p=>`<option value="${p.id}">${esc(p.name)}${p.prep?' · '+esc(roleOf(p)):''}</option>`).join('')}</select></div>`}
const inp=(spec,k,o={})=>{const ob=objOf(spec)||{};const v=ob[k];return `<input data-o="${spec}" data-k="${k}"${o.n?' data-t="n" type="number" inputmode="numeric"':o.type?` type="${o.type}"`:''}${o.rr?' data-rr':''}${o.list?` list="${o.list}"`:''} value="${esc(v??'')}" placeholder="${esc(o.ph||'')}"${o.st?` style="${o.st}"`:''}>`};
const sel=(spec,k,opts,o={})=>{const ob=objOf(spec)||{};const v=ob[k]??'';return `<select data-o="${spec}" data-k="${k}"${o.rr?' data-rr':''}${o.st?` style="${o.st}"`:''}>${o.blank!==undefined?`<option value="">${esc(o.blank)}</option>`:''}${opts.map(x=>{const[val,lab]=Array.isArray(x)?x:[x,x];return `<option value="${esc(val)}"${String(val)===String(v)?' selected':''}>${esc(lab)}</option>`}).join('')}</select>`};
const ta=(spec,k,ph,rows)=>{const ob=objOf(spec)||{};return `<textarea data-o="${spec}" data-k="${k}" rows="${rows||3}" placeholder="${esc(ph||'')}">${esc(ob[k]||'')}</textarea>`};
const peopleOpts=(L,blank)=>[['',blank||'— 선택 —'],...L.slice().sort(byName).map(p=>[p.id,p.name+(p.prep?' · '+roleOf(p):'')])];

/* 🙋 이름을 누르면 [참석인원]에 적힌 신청정보를 보여 줘요 */
function CHIP(pid,from,extra){const p=P(pid);if(!p)return'';return `<span class="chip p ${pCls(p)}" draggable="true" data-pid="${pid}" data-from="${from}" title="${esc([p.gender,p.age,p.org].filter(Boolean).join(' · '))}">${esc(p.name||'(이름 없음)')}${extra||''}${from!=='pool'?`<button class="x" data-act="unassign" data-from="${from}" data-pid="${pid}" title="빼기">×</button>`:''}</span>`}
function holder(key){const[k,id]=key.split('#');if(k==='car')return R.cars.list.find(c=>c.id===id);if(k==='grp')return R.grp.list.find(g=>g.id===id);if(k==='room')return R.rooms.find(r=>r.id===id);return null}
function scopeOf(key){const[k,id]=key.split('#');if(k==='car'){const c=holder(key);return R.cars.list.filter(x=>x.dir===(c?c.dir:SUB.dir))}if(k==='grp')return R.grp.list;if(k==='room')return R.rooms;return[]}
function addSel(to,cands){return `<select data-act="assign" data-to="${to}" style="width:100%;margin-top:4px;font-size:13px"><option value="">+ 팀원 명부에서 추가</option>${cands.slice().sort(byName).map(p=>`<option value="${p.id}">${esc(p.name)}${p.gender?' ('+p.gender+')':''}${p.org?' · '+esc(p.org):''}</option>`).join('')}</select>`}
const pCls=p=>(p.prep==='min'?'k-min':p.prep==='staff'?'k-staff':p.praise?'k-praise':'')+' '+(p.gender==='남'?'sx-m':p.gender==='여'?'sx-f':'');
const chipLegend=()=>`<span class="chiplg"><span class="chip k-min">사역자</span><span class="chip k-staff">준비인원</span><span class="chip k-praise">찬양팀</span><span class="chip">일반</span><span class="chip sx-m">남</span><span class="chip sx-f">여</span></span>`;
function poolHTML(cands,label){return `<div class="pool" data-drop="pool"><div class="row" style="margin-bottom:4px"><b class="j">🙋 ${esc(label)} (${cands.length})</b><span class="hint">이름을 끌어다 놓거나, 각 칸의 ‘+ 추가’로 넣어요</span>${chipLegend()}<input id="poolQ" placeholder="이름 찾기" style="margin-left:auto;width:120px" value="${esc(SUB.poolQ||'')}"></div>${cands.length?cands.slice().sort(byName).map(p=>CHIP(p.id,'pool')).join(''):'<span class="hint">모두 배정했어요 👏</span>'}</div>`}

const TABS=[['people','🙋 팀원 명부'],['minutes','📝 회의록'],['sched','📅 일정'],['roles','🧑‍🤝‍🧑 역할팀배정'],['mins','🙏 사역'],['tt','⏰ 시간표'],['sup','📦 준비물'],['chk','☑️ 체크리스트'],['files','📁 자료실'],['acc','💰 회계'],['cars','🚗 차량배정'],['grp','🧩 나눔조배정'],['set','⚙️ 설정']];

function render(){
  const ae=document.activeElement,key=ae&&(ae.dataset&&ae.dataset.o!=null?'o:'+ae.dataset.o+'|'+ae.dataset.k:ae.id?'#'+ae.id:null),selS=ae&&ae.selectionStart,keep={};

  const app=$('#app');app.classList.toggle('wide',!!R&&['people','sup','roles','minutes','mins'].includes(TAB));
  if(!R){app.innerHTML=vHome();return}
  const dd=R.start?diffD(todayStr(),R.start):null;
  if(TAB==='cars'||TAB==='people'){let n=0;while(n<3&&syncCars())n++;if(n)save()}
  const V={people:vPeople,minutes:vMinutes,sched:vSched,roles:vRoles,mins:vMins,tt:vTT,sup:vSup,chk:vChk,files:vFiles,acc:vAcc,cars:vCars,grp:vGrp,set:vSet}[TAB]||vPeople;if(TAB==='files')ensureFolders();
  app.innerHTML=`<div class="head no-print"><a class="btn" href="./">☰ 선교 목록</a><h1 class="j">${esc(R.name)}</h1>${dd!=null?`<span class="dday">${dd>0?'D-'+dd:dd===0?'D-DAY':dd>=-(+R.nights)?'선교 중':'끝났어요'}</span>`:''}<span class="hint">${esc(campRange()||'날짜 미정')}</span><button class="sm" data-act="tab" data-v="set">⚙️ 설정</button>${(window.SHARE&&SHARE.enabled())||R.shareId?`<button class="sm" data-act="campShare" style="${R.shareId?"background:#e6f6df":""}">${R.shareId?(R.shareLock?"🔒 함께 쓰는 중":"🔗 함께 쓰는 중"):"🔗 함께 쓰기"}</button>`:""}<span class="sync" id="sync">${R.shareId?"🔗 함께 쓰는 중":"✔ 이 기기에 저장됨"}</span></div>
  <nav class="tabs">${TABS.map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${k===TAB?'on':''}">${l}</button>`).join('')}</nav>
  <div id="view">${V()}</div>`;
  for(const k in keep){const e=$(`[data-keep="${k}"]`);if(e){e.scrollLeft=keep[k][0];e.scrollTop=keep[k][1]}}
  if(TAB==='praise')initStage();
  if(key){let el=null;if(key[0]==='#')el=document.getElementById(key.slice(1));else{const[o,k]=key.slice(2).split('|');el=$$('[data-o]').find(e=>e.dataset.o===o&&e.dataset.k===k)}
    if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{if(selS!=null&&el.setSelectionRange)el.setSelectionRange(selS,selS)}catch(_){}}}
  afterRender()}
let rrT;function rr(){clearTimeout(rrT);rrT=setTimeout(render,0)}

function afterRender(){
  if(TAB==='minutes'){updPrev();initBoard()}
  if(TAB==='files'||TAB==='acc')$$('img[data-fid]').forEach(async im=>{try{const f=await idb.get('files',im.dataset.fid);if(f)im.src=URL.createObjectURL(f.blob||f)}catch(e){}});
  if(TAB==='rooms')bindRooms();
  const fs=$('#fsD');if(fs)fs.ontoggle=()=>{SUB.fsOpen=fs.open};
  const fd=$('#feeD');if(fd)fd.ontoggle=()=>{SUB.feeOpen=fd.open};
  const rd=$('#rulesD');if(rd)rd.ontoggle=()=>{R.venue.rulesOpen=rd.open;save()};
  if(TAB==='people'){const q=$('#pq');if(q)filterPeople(q.value);fitPeople()}

}

   <div class="slots">${SL.map(x=>`<div class="slot"><div class="row" style="gap:4px"><b class="j" style="font-size:16px">${x.kind==='집회'?'⛪':'🎤'} ${esc(x.name)}</b><span class="sp"></span><button class="x" data-act="slotRen" data-v="${x.id}" title="이름 바꾸기">✎</button><button class="x" data-act="slotDel" data-v="${x.id}" title="빼기">×</button></div>

  <div class="card"><div class="row"><h2 style="margin:0">🎤 강사 섭외 현황</h2><span class="sp"></span><button class="pri" data-act="add" data-c="speakers">+ 강사 후보</button></div>

const spName=id=>{const x=R.spaces.find(y=>y.id===id);return x?(x.name||'(이름 없음)'):''};
function spUse(id){const tt=Object.values(R.tt.places||{}).filter(v=>v===id).length,pg=R.programs.filter(p=>(p.spaces||[]).includes(id)).length;return[tt,pg]}
function vSpaces(){const L=R.spaces;

  <div class="card"><div class="row"><h2 style="margin:0">🏠 사용공간</h2><span class="hint">선교 장소에서 우리가 쓸 수 있는 공간을 정리해요. 여기 적은 공간은 [시간표]와 [프로그램]에서 골라 쓸 수 있어요.</span><span class="sp"></span><button class="pri" data-act="spAdd">+ 공간 추가</button></div>
  ${L.length?`<div class="hs" style="margin-top:10px"><table class="t spt"><tr><th>장소명</th><th>위치</th><th>용도</th><th>사용자</th><th>인원</th><th>사용가능시간</th><th>메모</th><th>쓰이는 곳</th><th></th></tr>
   ${L.map(x=>{const k='spaces#'+x.id,[tt,pg]=spUse(x.id);return `<tr><td>${inp(k,'name',{ph:'예) OO홀',st:'width:130px;font-weight:600'})}</td><td>${inp(k,'loc',{ph:'예) 본관 2층',st:'width:120px'})}</td><td>${inp(k,'use',{ph:'예) 예배당',list:'spUse',st:'width:110px'})}</td><td>${inp(k,'user',{ph:'예) 전체',list:'spUser',st:'width:90px'})}</td><td>${inp(k,'cap',{ph:'예) 100명',st:'width:80px'})}</td><td>${inp(k,'time',{ph:'예) 새벽2시까지',st:'width:150px'})}</td><td>${inp(k,'memo',{st:'width:200px'})}</td><td class="hint" style="white-space:nowrap">${tt?`⏰ 시간표 ${tt}칸`:''}${tt&&pg?' · ':''}${pg?`🎲 프로그램 ${pg}개`:''}${!tt&&!pg?'-':''}</td><td><button class="sm" data-act="mvUp" data-c="spaces" data-v="${x.id}" title="위로">↑</button><button class="x" data-act="spDel" data-v="${x.id}" title="지우기">🗑</button></td></tr>`}).join('')}</table></div>`:'<div class="empty" style="margin-top:10px">‘+ 공간 추가’로 예배당·숙소·프로그램실 등을 적어요</div>'}</div>`}
/* 공간 여러 개 고르기 (프로그램 장소) */
function SPC(spec,key){const o=objOf(spec)||{},arr=o[key]||[];return `<div class="who">${arr.map(id=>`<span class="chip p">🏠 ${esc(spName(id)||'(지운 공간)')}<button class="x" data-act="rmFrom" data-o="${spec}" data-k="${key}" data-v="${id}">×</button></span>`).join('')}<select data-act="addTo" data-o="${spec}" data-k="${key}"><option value="">+ 사용공간에서 고르기</option>${R.spaces.filter(x=>!arr.includes(x.id)).map(x=>`<option value="${x.id}">${esc(x.name||'(이름 없음)')}${x.loc?' · '+esc(x.loc):''}${x.use?' · '+esc(x.use):''}</option>`).join('')}</select>${R.spaces.length?'':'<span class="hint">[🏠 사용공간]에 먼저 공간을 적어 주세요</span>'}</div>`}

/* ---------- 시간표 ---------- */
function slots(){const toM=s=>{const[h,m]=String(s).split(':').map(Number);return h*60+(m||0)};let f=toM(R.tt.from),t=toM(R.tt.to);if(t<=f)t=f+60*18;const L=[];for(let m=f;m<t;m+=30)L.push(pad(Math.floor(m/60)%24)+':'+pad(m%60));return L}
function vTT(){const days=(+R.nights||0)+1,S=slots(),C=R.tt.cells;
  const head=Array.from({length:days},(_,d)=>`<th>${d+1}일차${R.start?' · '+fmtD(addD(R.start,d)):''}</th>`).join('');
  const times=Array.from({length:S.length+1},(_,i)=>{const m=S[0].split(':').map(Number);const x=m[0]*60+m[1]+i*30;return pad(Math.floor(x/60)%24)+':'+pad(x%60)});
  /* 같은 일정이 이어지는 칸은 하나로 합쳐서(병합) 가운데에 보여 줘요 */
  const PL=R.tt.places||{},runs={},skip={};
  for(let d=0;d<days;d++){let i=0;while(i<S.length){const v=C[d+'-'+S[i]]||'';let n=1;if(v)while(i+n<S.length&&C[d+'-'+S[i+n]]===v)n++;runs[d+'-'+i]=n;for(let j=1;j<n;j++)skip[d+'-'+(i+j)]=1;i+=n}}
  const spSel=(run,pl)=>R.spaces.length?`<select class="ttp" data-run="${run}" data-rk="place" title="장소"><option value="">장소</option>${R.spaces.map(x=>`<option value="${x.id}"${pl===x.id?' selected':''}>${esc(x.name||'(이름 없음)')}</option>`).join('')}</select>`:'';
  const body=S.map((s,i)=>`<tr><td class="tm ${s.endsWith(':00')?'h':''}">${s}~${times[i+1]}</td>${Array.from({length:days},(_,d)=>{if(skip[d+'-'+i])return'';const n=runs[d+'-'+i]||1,v=C[d+'-'+s]||'',pl=PL[d+'-'+s]||'',run=`${d}|${i}|${n}`;
    return `<td${n>1?` rowspan="${n}"`:''} class="${v?'filled':''}${n>1?' mg':''}" style="${v?`background:hsl(${hue(v)},70%,90%)`:''}"><div class="ttc"><input data-run="${run}" data-rk="cell" list="progList" value="${esc(v)}" placeholder="${v?'':''}">${spSel(run,pl)}</div>${v?`<div class="ttb">${i+n<S.length?`<button class="sm" data-act="ttGrow" data-v="${run}" title="아래 30분 칸과 합치기">⬇ 칸 합치기</button>`:''}${n>1?`<button class="sm" data-act="ttShrink" data-v="${run}" title="맨 아래 30분 칸 떼어내기">⬆ 줄이기</button>`:''}${n>1?`<span class="hint">${n*30}분</span>`:''}</div>`:''}</td>`}).join('')}</tr>`).join('');
  return `<datalist id="progList">${[...new Set([...R.programs.map(p=>p.name).filter(Boolean),...(R.mins||[]).map(m=>(m.title||'').trim()).filter(Boolean),'기상','아침 식사','점심 식사','저녁 식사','간식','자유시간','개회예배','집회','소그룹 나눔','레크리에이션','세면·정리','취침','폐회예배','이동','출발','도착','QT'])].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <div class="card"><div class="row"><h2 style="margin:0">⏰ 시간표</h2><span class="sp"></span><button data-act="ttCopy">📋 텍스트로 복사</button><button data-act="print">🖨️ 인쇄</button></div>

function fmtPhone(v){const d=String(v||'').replace(/\D/g,'');if(!d)return String(v||'').trim();
  if(d.startsWith('02')){if(d.length<=2)return d;if(d.length<=5)return d.slice(0,2)+'-'+d.slice(2);if(d.length<=9)return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5);return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10)}
  if(d.length===8&&/^1[5-9]/.test(d))return d.slice(0,4)+'-'+d.slice(4);
  if(d.length<=3)return d;if(d.length<=7)return d.slice(0,3)+'-'+d.slice(3);if(d.length<=10)return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7,11)}

function stackOv(){document.querySelectorAll('table.tl').forEach(tb=>{let need=0;tb.style.marginBottom='';const T0=tb.getBoundingClientRect().top;['cv','pv'].forEach(cls=>{let lastB=-1e9;

function parseWhen(t,kind){t=String(t||'').trim();if(!t)return null;const last=+R.nights||0;let d=null;
  const dm=t.match(/(\d+)\s*일\s*차/);if(dm)d=+dm[1]-1;
  else if(/첫\s*(째)?\s*날/.test(t))d=0;else if(/둘\s*(째)?\s*날/.test(t))d=1;else if(/셋\s*(째)?\s*날/.test(t))d=2;else if(/넷\s*(째)?\s*날/.test(t))d=3;else if(/마지막\s*날/.test(t))d=last;
  else{const m=t.match(/(\d{1,2})\s*[\/.월]\s*(\d{1,2})\s*일?/);if(m&&R.start){d=diffD(R.start,R.start.slice(0,4)+'-'+pad(+m[1])+'-'+pad(+m[2]));t=t.replace(m[0],' ')}}
  if(d==null)d=kind==='in'?0:last;
  const tm=t.replace(/\d+\s*일\s*차/,' ').match(/(\d{1,2})\s*(?::|시)\s*(\d{1,2})?/);if(!tm)return{d,m:null};
  let h=+tm[1],mi=+(tm[2]||0);if(!tm[2]&&/반/.test(t.slice(tm.index)))mi=30;if((/오후|점심|저녁|밤/.test(t)||(h<6&&!/오전|새벽|아침/.test(t)))&&h<12)h+=12;return{d,m:h*60+mi}}

function mvBlock(p,k,dir){const days=(+R.nights||0)+1,mv=p[dir+'Move'],legacy=!(p[dir+'H']!=null&&p[dir+'H']!=='')&&p[dir+'T'];

function peopleMoves(){const L=[];R.people.forEach(p=>{[['in','inT'],['out','outT']].forEach(([k,f])=>{let w=pWhen(p,k),src='';

    L.push({p,k,w,src,raw:p[f]||''})})});return L}
/* 사람이 많으면 앞의 몇 명만 보이고 ‘더보기’로 펼쳐요 */

function carTimeline(){const days=(+R.nights||0)+1,S=slots(),C=R.tt.cells,toM=t=>{const[h,m]=String(t).split(':').map(Number);return h*60+(m||0)};

    if(!open)return `<div class="cbadge k-${kindOf(c)} fold" data-act="tlCar" data-id="${c.id}" title="${esc(c.time+' '+(c.dir==='in'?'들어오는 차':'집에 가는 차'))} · 눌러서 펼치기">${ic} ${esc(whoCar(c))} <span class="tg">▸</span></div>`;

  let out='';

function fpath(id){const L=[];let c=id;while(c){const f=R.folders.find(x=>x.id===c);if(!f)break;L.unshift(f.name);c=f.parent}return L.join(' › ')}
function dl(blob,name){if(window.SAVEFILE)return SAVEFILE(blob,name);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('📋 복사했어요. 카톡에 붙여넣으세요')}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('📋 복사했어요')}catch(_){toast('복사하지 못했어요')}x.remove()}}
function indent(dir){const b=$('#mbody');if(!b)return;const v=b.value,s=b.selectionStart,e=b.selectionEnd;const ls=v.lastIndexOf('\n',s-1)+1;let le=v.indexOf('\n',Math.max(s,e-1));if(le<0)le=v.length;
  const lines=v.slice(ls,le).split('\n');let d0=0,dT=0;const out=lines.map((l,i)=>{if(dir>0){if(i===0)d0=2;dT+=2;return '  '+l}const m=l.match(/^( {1,2}|\t)/);if(!m)return l;if(i===0)d0=-m[0].length;dT-=m[0].length;return l.slice(m[0].length)});
  b.value=v.slice(0,ls)+out.join('\n')+v.slice(le);b.selectionStart=Math.max(ls,s+d0);b.selectionEnd=Math.max(ls,e+dT);b.dispatchEvent(new Event('input',{bubbles:true}));b.focus()}

async function restore(file){try{const d=JSON.parse(await file.text());if(d.app!=='mission-pack'||!d.camp)throw 0;const c=fill(d.camp);const old=await idb.get('camps',c.id);
  if(old&&!confirm(`‘${old.name}’이(가) 이미 있어요. 백업 내용으로 덮어쓸까요? (취소하면 새 선교로 추가해요)`)){const map={};c.id=uid();c.name+=' (백업)';for(const f of c.files){const n=uid();map[f.id]=n;f.id=n}c.acc.items.forEach(x=>{if(x.rcp)x.rcp=map[x.rcp]});const F={};for(const k in d.files)F[map[k]||k]=d.files[k];d.files=F}
  for(const id in d.files){const b=await (await fetch(d.files[id])).blob();await idb.put('files',id,{blob:b})}await idb.put('camps',c.id,c);location.href='./?c='+c.id}catch(e){toast('선교 백업 파일이 아니에요')}}

/* 엑셀·CSV 불러오기 */
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const GUESS={name:/^(이름|성명|성함|name)|이름|성명/i,gender:/성별/,age:/나이|연령|생년|출생|학년/,org:/소속|교구|부서|학교|공동체/,cell:/셀|목장|구역|다락방|순모임/,addr:/사는|주소|거주|지역|동네/,phone:/연락처|전화|핸드폰|휴대폰|폰|phone/i,ins:/보험/,inT:/들어오|입소|도착|오는|참석.*시작/,outT:/나가|퇴소|귀가|떠나|가는/};
async function importXls(file){try{await loadXLSX()}catch(e){toast('엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요');return}
  let rows;try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false})}catch(e){toast('파일을 읽지 못했어요');return}
  const hi=rows.findIndex(r=>r.filter(x=>String(x).trim()).length>=2);if(hi<0){toast('내용이 없어요');return}
  const H=rows[hi].map(x=>String(x).trim()),data=rows.slice(hi+1).filter(r=>r.some(x=>String(x).trim()));
  const map={};PF.forEach(([k])=>{const i=H.findIndex((h,j)=>GUESS[k].test(h)&&!Object.values(map).includes(j));map[k]=i});
  const m=modal(`<h2>📊 엑셀·CSV 불러오기</h2><p>${data.length}명의 응답을 찾았어요. 각 항목이 어느 칸(열)인지 확인해 주세요.</p>
   <div class="f2">${PF.map(([k,l])=>`<label class="fld">${l}<select data-map="${k}"><option value="-1">— 없음 —</option>${H.map((h,j)=>`<option value="${j}"${map[k]===j?' selected':''}>${esc(h||('('+(j+1)+'번째 열)'))}</option>`).join('')}</select></label>`).join('')}</div>
   <p class="hint">이미 있는 사람(이름과 핸드폰번호가 같은 사람)은 새 내용으로 채워요.</p>
   <div class="row"><button class="pri" id="xGo">${data.length}명 추가</button><button data-close>취소</button></div>`);
  m.querySelector('#xGo').onclick=()=>{const mp={};m.querySelectorAll('[data-map]').forEach(s=>mp[s.dataset.map]=+s.value);if(mp.name<0){toast('이름 칸을 골라 주세요');return}
    let add=0,upd=0;const norm=s=>String(s||'').replace(/\D/g,'');
    data.forEach(r=>{const g=k=>mp[k]>=0?String(r[mp[k]]??'').trim():'';const name=g('name');if(!name)return;
      const o={name,age:g('age'),org:g('org'),addr:g('addr'),cell:g('cell'),phone:fmtPhone(g('phone')),inT:g('inT'),outT:g('outT')};
      const gd=g('gender');o.gender=/여|female|^f$/i.test(gd)?'여':/남|male|^m$/i.test(gd)?'남':'';
      const ins=g('ins');o.ins=/미가입|아니|없|no|x/i.test(ins)?'미가입':/가입|예|네|있|yes|o/i.test(ins)?'가입':'';
      setWhenFromText(o,'in');setWhenFromText(o,'out');
      const ex=R.people.find(p=>p.name===name&&norm(p.phone)===norm(o.phone));
      if(ex){for(const k in o)if(o[k])ex[k]=o[k];upd++}else{R.people.push({id:uid(),...o});add++}});
    save();m.remove();render();toast(`${add}명 추가${upd?`, ${upd}명 갱신`:''}했어요`)}}

const toMin=t=>{const[h,m]=String(t||'').split(':').map(Number);return (h||0)*60+(m||0)};

function feeOf(p){if(p.fee!=null&&p.fee!=='')return{amt:+p.fee,why:'직접 입력'};return R.fee.base!=null&&R.fee.base!==''?{amt:+R.fee.base,why:'선교비'}:{amt:null,why:'금액 미정'}}

/* 🎂 생일: 차트 기간 안에 오는 생일 (해마다) */
const bdMD=p=>{const m=String(p.bday||'').match(/(\d{1,2})[-./월\s]+(\d{1,2})\s*일?$/);return m?pad(+m[1])+'-'+pad(+m[2]):''};
function bdays(a,b){const L=[];R.people.forEach(p=>{const md=bdMD(p);if(!md)return;for(let y=+a.slice(0,4);y<=+b.slice(0,4);y++){const d=y+'-'+md;if(d>=a&&d<=b)L.push({p,d})}});return L.sort((x,y)=>x.d.localeCompare(y.d))}
const fmtBd=p=>{const md=bdMD(p);return md?`${+md.slice(0,2)}월 ${+md.slice(3)}일`:''};

function pfVal(p,k){switch(k){case'late':return p.late?'후발대':'아님';case'early':return p.early?'일찍 나옴':'아님';case'ins':return p.ins==='가입'?'가입':'미가입';case'paid':return p.paid?'입금':'미입금';default:return String(p[k]||'').trim()||'(비어 있음)'}}
function psKey(p,k){switch(k){case'age':return ageNum(p.age)??1e9;case'in':case'out':{const w=pWhen(p,k);return w?w.d*1440+w.m:1e9}
  case'fee':return feeOf(p).amt??1e12;case'late':return p.late?0:1;case'early':return p.early?0:1;case'paid':return p.paid?0:1;case'ins':return p.ins==='가입'?0:1;
  case'bday':return bdMD(p);case'role':{const i=(p.roles||[]).map(r=>R.roles.indexOf(r)).filter(i=>i>=0);return i.length?Math.min(...i):1e9}default:return String(p[k]||'')}}

function assign(pid,to,from){
  const isR=k=>k&&k.startsWith('role#'),rn=k=>R.roles[+k.slice(5)];
  if(isR(to)||isR(from)){const p=P(pid);if(!p)return;p.roles=p.roles||[];
    if(isR(from)&&(to==='pool'||isR(to)))p.roles=p.roles.filter(r=>r!==rn(from));
    if(isR(to)){const r=rn(to);if(r&&!p.roles.includes(r))p.roles.push(r)}
    p.roles.sort((a,b)=>R.roles.indexOf(a)-R.roles.indexOf(b));save();render();return}
  if(from&&from!=='pool'){const h=holder(from);if(h)h.members=(h.members||[]).filter(x=>x!==pid)}
  if(to&&to!=='pool'){scopeOf(to).forEach(h=>h.members=(h.members||[]).filter(x=>x!==pid));const h=holder(to);if(h){(h.members=h.members||[]).push(pid)}}
  R.grp.list.forEach(g=>{if(g.leader&&!(g.members||[]).includes(g.leader))g.leader=''});
  save();render()}

/* ---------- 📅 일정 (간트차트: 전체 + 역할팀별) ---------- */
function gantt(T,a,b,key,bd){const td=todayStr(),rs=R.start,re=campEnd();let n=Math.min(400,diffD(a,b)+1);const w=n>150?10:n>70?16:24,LW=170,W=n*w;
  let hd='',mo='';for(let i=0;i<n;i++){const d=addD(a,i),dw=new Date(toT(d)).getUTCDay(),dd=+d.slice(8);if(d.slice(0,7)!==mo){mo=d.slice(0,7);hd+=`<span class="gm" style="left:${i*w}px;top:0">${+d.slice(5,7)}월</span>`}if(w>=16||dw===1)hd+=`<span class="gd ${dw===0||dw===6?'we':''}" style="left:${i*w}px;width:${w}px;top:18px">${dd}</span>`}
  const over=()=>{let s='';const ti=diffD(a,td);if(ti>=0&&ti<n)s+=`<div class="gtoday" style="left:${ti*w+w/2}px" title="오늘"></div>`;if(rs){const ci=diffD(a,rs);s+=`<div class="gcamp" style="left:${ci*w}px;width:${(diffD(rs,re)+1)*w}px" title="선교 기간"></div>`}return s};
  const bg=`background-image:linear-gradient(to right,#f1e9da 1px,transparent 1px);background-size:${w}px 100%`;
  const rows=T.map(t=>{const i=R.sched.indexOf(t);let bar='';if(t.start){const s=Math.max(0,diffD(a,t.start)),e=Math.min(n-1,diffD(a,t.end&&t.end>=t.start?t.end:t.start));const who=(t.who||[]).map(pn).join(', ');bar=`<div class="gbar ${t.done?'done':''}" style="left:${s*w}px;width:${Math.max(w,(e-s+1)*w)}px;background:${PAL[i%PAL.length]}" title="${esc(t.name+' '+fmtD(t.start)+'~'+fmtD(t.end||t.start)+(who?' · '+who:''))}">${t.done?'✔ ':''}${esc(t.name)}${who?' · '+esc(who):''}</div>`}
    return `<div class="grow"><div class="glab" title="${esc(t.name)}">${t.done?'✔ ':''}${esc(t.name||'(이름 없음)')}${t.team?` <span class="hint">${esc(t.team)}</span>`:''}</div><div class="gtrack" style="width:${W}px;${bg}">${over()}${bar}</div></div>`}).join('');
  return `<div class="gantt hs" data-keep="${key}" style="margin-top:10px"><div class="gin" style="width:${LW+W}px"><div class="grow" style="min-height:38px"><div class="glab"><b>할 일</b></div><div class="gtrack ghd" style="width:${W}px">${hd}</div></div>${bd&&bd.length?`<div class="grow"><div class="glab" title="팀원 생일">🎂 생일</div><div class="gtrack" style="width:${W}px;${bg}">${over()}${bd.map((x,j)=>{const i=diffD(a,x.d),inM=R.start&&x.d>=R.start&&x.d<=campEnd();return `<div class="gbar" style="left:${i*w}px;width:auto;min-width:${w}px;padding:0 5px;white-space:nowrap;background:${inM?'#e0567c':'#f9c6d3'};color:${inM?'#fff':'#5a2333'};z-index:${2+j%2}" title="${esc((x.p.name||'')+' 생일 '+fmtD(x.d)+(inM?' · 선교 중!':''))}">🎂 ${esc(x.p.name||'')}</div>`}).join('')}</div></div>`:''}${rows||(bd&&bd.length?'':`<div class="grow"><div class="glab hint">할 일을 추가해요</div><div class="gtrack" style="width:${W}px;${bg}">${over()}</div></div>`)}</div></div>`}
const phaseOf=t=>{if(!R.start||!t.start)return'';const e=t.end||t.start;return e<R.start?'선교 전':t.start>campEnd()?'선교 후':'선교 중'};
function vSched(){const T=R.sched,td=todayStr(),rs=R.start,re=campEnd();
  let a=[td,...T.map(t=>t.start).filter(Boolean),...(rs?[rs]:[])].sort()[0];let b=[rs||addD(td,30),re,...T.map(t=>t.end||t.start).filter(Boolean)].filter(Boolean).sort().pop();a=addD(a,-2);b=addD(b,2);
  const teams=R.roles.filter(r=>T.some(t=>t.team===r)),cands=R.people;

   ${gantt(T,a,b,'g0',bdays(a,b))}<p class="hint">빨간 선 = 오늘, 노란 띠 = 선교 기간 · 🎂 = 팀원 생일 (진한 분홍은 선교 중 생일) · [팀원 명부]에 생일을 적으면 여기에 나와요</p></div>

/* ---------- 🚗 차량배정 ---------- */
function syncCars(){const C=R.cars;let ch=false;
  [['in','late','후발대'],['out','early','일찍 나감']].forEach(([dir,flag,ty])=>{
    if(!C.types[dir].includes(ty)){C.types[dir].push(ty);ch=true}
    R.people.forEach(p=>{let c=C.list.find(x=>x.dir===dir&&x.autoPid===p.id);const inCar=C.list.find(x=>x.dir===dir&&(x.members||[]).includes(p.id));
      if(!p[flag]){if(c){C.list=C.list.filter(x=>x!==c);ch=true}return}

function initBoard(){const b=$('#board');if(!b)return;b.onpointerdown=e=>{const el=e.target.closest('.pnote');if(!el||e.button>0)return;e.preventDefault();const n=R.notes.find(x=>x.id===el.dataset.nid);if(!n)return;const r=b.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=+n.x||5,oy=+n.y||5;let moved=false;
  const mv=ev=>{if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>5)moved=true;if(!moved)return;n.x=Math.max(0,Math.min(82,ox+(ev.clientX-sx)/r.width*100));n.y=Math.max(0,Math.min(85,oy+(ev.clientY-sy)/r.height*100));el.style.left=n.x+'%';el.style.top=n.y+'%'};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(moved){const mx=Math.max(0,...R.notes.map(x=>+x.z||0));n.z=mx+1;save();return}const now=Date.now();if(el._t&&now-el._t<380){clearTimeout(el._tm);el._t=0;noteEdit(n.id)}else{el._t=now;el._tm=setTimeout(()=>{el._t=0;noteView(n.id)},390)}};
  addEventListener('pointermove',mv);addEventListener('pointerup',up)}}

  if(t.dataset.o.startsWith('people#')&&t.dataset.k==='prep'){const p=objOf(t.dataset.o);p.role=''}
  if(t.dataset.o.startsWith('people#')&&t.dataset.k==='payMethod'){const p=objOf(t.dataset.o),b=feeBooked(p.id);if(b)b.method=p.payMethod}
  if(t.dataset.o.startsWith('people#')&&t.dataset.k==='paid'){const p=objOf(t.dataset.o);p.paidDate=p.paid?todayStr():'';if(p.paid&&!p.payMethod)p.payMethod='계좌이체';if(p.paid&&feeOf(p).amt)toast(`💰 ${p.name||''} 입금확인 · [회계]에서 수입으로 넣을 수 있어요`)}
  if(t.dataset.rr!==undefined)rr()});
document.addEventListener('keydown',e=>{const t=e.target;
  if(t.dataset&&t.dataset.leAdd&&e.key==='Enter'&&!e.isComposing){e.preventDefault();const v=t.value.trim();if(!v)return;const a=objOf(t.dataset.leAdd);if(a.includes(v)){toast('이미 있어요');return}a.push(v);save();render();const n=$(`[data-le-add="${t.dataset.leAdd}"]`);if(n)n.focus();return}
  if(t.id==='critNew'&&e.key==='Enter'&&!e.isComposing){const v=t.value.trim();if(!v)return;const id='c_'+uid();R.venue.crit.push({id,name:v});R.venue.w[id]=0;save();render();const n=$('#critNew');if(n)n.focus();toast('가중치를 다시 맞춰 주세요 (합계 100%)');return}
  if(t.id==='chkT'&&e.key==='Enter'&&!e.isComposing){ACT.chkAdd();return}
  if(t.id==='rN'&&e.key==='Enter'&&!e.isComposing){ACT.roomAdd();return}
  if(t.id==='mbody'){if(e.key==='Tab'){e.preventDefault();indent(e.shiftKey?-1:1);return}
    if(e.key==='Enter'&&!e.isComposing&&!e.shiftKey){const v=t.value,s=t.selectionStart;const ls=v.lastIndexOf('\n',s-1)+1;const line=v.slice(ls,s);const ind=line.match(/^[\t ]*/)[0];
      if(!ind)return;e.preventDefault();let ins='\n'+ind;if(!line.trim()&&t.selectionEnd===s){/* 빈 줄에서 Enter → 한 단계 위로 */const nw=ind.slice(2);t.value=v.slice(0,ls)+nw+v.slice(s);t.selectionStart=t.selectionEnd=ls+nw.length}else{t.value=v.slice(0,s)+ins+v.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+ins.length}t.dispatchEvent(new Event('input',{bubbles:true}))}}});
/* 끌어다 놓기 */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.chip[data-pid]');if(!c)return;e.dataTransfer.setData('text/plain',JSON.stringify({pid:c.dataset.pid,from:c.dataset.from}));e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();$$('.drop-on').forEach(x=>x!==z&&x.classList.remove('drop-on'));z.classList.add('drop-on')});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('drop-on')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');$$('.drop-on').forEach(x=>x.classList.remove('drop-on'));if(!z)return;e.preventDefault();let d;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){return}if(!d||!d.pid||d.from===z.dataset.drop)return;assign(d.pid,z.dataset.drop,d.from)});
/* 파일 입력 */
$('#fileUp').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;toast('올리는 중…');for(const f of fs){const id=uid();try{await idb.put('files',id,{blob:f});R.files.push({id,folder:SUB.folder||'',name:f.name,size:f.size,type:f.type,date:new Date().toISOString()})}catch(err){toast('저장하지 못한 파일: '+f.name)}}save();render();toast(`${fs.length}개 올렸어요`)};
$('#xlsUp').onchange=e=>{const f=e.target.files[0];if(f)importXls(f)};
$('#bakUp').onchange=e=>{const f=e.target.files[0];if(f)restore(f)};
$('#rcpUp').onchange=e=>{const f=e.target.files[0];if(f){SUB.rcpFile=f;const n=$('#rcpName');if(n)n.textContent='🧾 '+f.name}};

/* ============ 시작 ============ */
(async()=>{try{await idb.open()}catch(e){$('#app').innerHTML='<div class="card"><div class="empty">이 브라우저에서는 저장소를 쓸 수 없어요. (시크릿 창이면 일반 창에서 열어 주세요)</div></div>';return}
  try{TAB=localStorage.getItem('mission-tab')||'people';SUB.carView=localStorage.getItem('mission-carview')||'card';SUB.pFit=localStorage.getItem('mission-pfit')!=='0'}catch(_){}if(!TABS.some(x=>x[0]===TAB))TAB='people';
  const SHID=new URLSearchParams(location.search).get('share');
  if(SHID){app.innerHTML='<div class="card" style="text-align:center;font-size:20px;padding:30px">🔗 함께 쓰는 선교에 들어가는 중…</div>';
    try{const all=(await idb.all('camps'))||[],ex=all.find(c=>c.shareId===SHID);if(ex){location.replace('?c='+ex.id);return}
      if(!window.SHARE||!SHARE.enabled())throw new Error('함께 쓰기가 아직 준비되지 않았어요');
      const J=await SHARE.join(SHID,'camp/main');
      if(J&&J.cancel){app.innerHTML='<div class="card" style="text-align:center;font-size:20px;padding:30px">🔒 비밀번호를 적어야 들어갈 수 있어요<br><a href="">다시 시도</a> · <a href="./">목록으로</a></div>';return}
      const snap=J&&J.snap;
      if(!snap){app.innerHTML='<div class="card" style="text-align:center;font-size:20px;padding:30px">😢 링크가 잘못됐거나 공유가 끝났어요<br><a href="./">선교 목록으로</a></div>';return}
      const d=snap.data(),c={};for(const k in d){if(k[0]!=='_')try{c[k]=JSON.parse(d[k])}catch(_){}}c.shareId=SHID;c.shareKey=J.key;c.shareLock=J.locked;c.sharePw=J.pw;c.id=uid();c.created=c.created||Date.now();
      await idb.put('camps',c.id,c);location.replace('?c='+c.id);return}
    catch(e){app.innerHTML='<div class="card" style="text-align:center;font-size:18px;padding:30px">😢 연결하지 못했어요<br><small>'+esc(String(e&&e.message||e))+'</small><br><a href="./">선교 목록으로</a></div>';return}}
  const cid=new URLSearchParams(location.search).get('c');
  if(cid){const c=await idb.get('camps',cid);if(!c){location.replace('./');return}R=fill(c);confList().forEach(([k])=>{try{if(k!=='snack'&&R.conf[k].v&&R.conf[k].v.trim()===confSrc(k).trim())R.conf[k].v=''}catch(_){}});R.people.forEach(p=>['in','out'].forEach(k=>{if((p[k+'H']==null||p[k+'H']==='')&&p[k+'T'])setWhenFromText(p,k)}));document.title=R.name+' | 선교 준비 패키지'}
  else CAMPS=(await idb.all('camps'))||[];
  render();if(R&&R.shareId)campSync()})();
/* 🔗 함께 쓰기: 선교 기록을 항목(명단·일정·차량·회의록…)별로 나눠 온라인에 저장해서, 서로 다른 탭을 고쳐도 덮어쓰지 않아요 */
const CS_SKIP=new Set(['id','updated','shareId','created','shareKey','sharePw','shareLock']);let CS=null,csHold=false;
async function campSync(){try{const sp=await SHARE.space(R.shareKey||R.shareId),d=sp.doc('camp/main');CS={d,base:{},pend:new Set(),first:true};
    d.onSnapshot(s=>{if(!s.exists){if(!s.metadata.fromCache){toast('이 함께 쓰기는 끝났거나 새 링크로 옮겨졌어요. 새 링크를 받아 주세요');const el=$('#sync');if(el)el.textContent='⚠️ 함께 쓰기가 끝났어요 · 새 링크를 받아 주세요'}return}const data=s.data()||{};let ch=false;
      for(const k in data){if(k[0]==='_'||CS_SKIP.has(k)||CS.pend.has(k)||CS.base[k]===data[k])continue;CS.base[k]=data[k];
        const cur=JSON.stringify(R[k]===undefined?null:R[k]);if(cur!==data[k]){try{R[k]=JSON.parse(data[k]);ch=true}catch(_){}}}
      const first=CS.first;CS.first=false;if(ch)campApply();if(first)campPush();
      const el=$('#sync');if(el&&!CS.pend.size)el.textContent='🔗 함께 쓰는 중 · 최신';},e=>{toast('함께 쓰기 연결이 끊겼어요. 새로고침해 주세요 ('+(e&&e.code||'')+')')})}
  catch(e){toast('함께 쓰기 저장소에 연결하지 못했어요: '+(e&&e.message||e))}}
function campApply(){fill(R);idb.put('camps',R.id,R).catch(()=>{});
  const a=document.activeElement;if(a&&a!==document.body&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&app.contains(a)){if(!csHold){csHold=true;a.addEventListener('blur',()=>setTimeout(()=>{csHold=false;campApply()},250),{once:true})}return}
  const y=window.scrollY;render();window.scrollTo(0,y)}
function campPush(){if(!CS||CS.first)return;const upd={};let size=0;
  for(const k in R){if(CS_SKIP.has(k))continue;const j=JSON.stringify(R[k]===undefined?null:R[k]);size+=j.length;if(CS.base[k]!==j)upd[k]=j}
  const ks=Object.keys(upd);if(!ks.length)return;if(size>950000){toast('⚠️ 선교 기록이 너무 커서 온라인에 다 올리지 못할 수 있어요');}
  ks.forEach(k=>CS.pend.add(k));upd._t=Date.now();const el=$('#sync');if(el)el.textContent='🔗 함께 저장 중…';
  CS.d.update(upd).then(()=>{ks.forEach(k=>{CS.base[k]=upd[k];CS.pend.delete(k)});const e2=$('#sync');if(e2&&!CS.pend.size)e2.textContent='🔗 함께 저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})})
    .catch(e=>{ks.forEach(k=>CS.pend.delete(k));toast('온라인에 저장하지 못했어요: '+(e&&e.message||e))})}
function campShareDialog(){const E=esc,H3='<h3 style="margin:0 0 8px;font-size:22px">',PP='<p style="margin:0 0 10px;font-size:15px;line-height:1.5">';
  const upload=async m=>{const d={_t:Date.now(),_name:R.name};for(const k in R){if(!CS_SKIP.has(k))d[k]=JSON.stringify(R[k]===undefined?null:R[k])}await m.sp.doc('camp/main').set(d);await SHARE.finish(m)};
  const switchTo=async m=>{R.shareId=m.id;R.shareKey=m.key;R.shareLock=m.locked;R.sharePw=m.pw;await idb.put('camps',R.id,R);location.reload()};
  if(R.shareId){const url=SHARE.link(R.shareId);
    SHARE.dialog({html:H3+'🔗 함께 쓰는 중이에요</h3>'+PP+'이 링크'+(R.shareLock?'와 비밀번호':'')+'를 받은 사람은 <b>'+E(R.name)+'</b>의 기록을 함께 보고 고칠 수 있어요. 서로 다른 메뉴를 고치면 각자 반영되고, 같은 메뉴를 동시에 고치면 나중에 저장한 쪽이 남아요.</p><input readonly value="'+E(url)+'" style="width:100%;font-size:13px;padding:8px;border:2px solid #cdbda6;border-radius:10px" onclick="this.select()">'+SHARE.pwInfo(R.sharePw,R.shareLock)+'<p style="font-size:13px;color:#7a6a5c;margin:8px 0 0;line-height:1.5">⚠️ '+(R.shareLock?'링크와 비밀번호를 아는 사람만 들어와요.':'링크를 아는 사람은 누구나 볼 수 있으니 함께 준비하는 사람에게만 나눠 주세요.')+' 첨부한 사진·영수증 파일은 올린 기기에만 저장돼요.</p>',
      buttons:[['🔗 링크 복사',async()=>{try{await navigator.clipboard.writeText(url);toast('링크를 복사했어요')}catch(e){prompt('복사해 주세요',url)}return true},true],
        [R.shareLock?'🔒 비밀번호 바꾸기':'🔒 비밀번호 걸기',async()=>{const pw=await SHARE.askPw('새 비밀번호를 정해 주세요. <b>새 링크</b>가 만들어지고 지금 링크는 더 이상 쓸 수 없어요. 함께 쓰는 사람들에게 새 링크와 비밀번호를 다시 보내 주세요.','🔒 '+(R.shareLock?'비밀번호 바꾸기':'비밀번호 걸기'),true);if(pw==null||!pw.trim())return true;
          const old=R.shareKey||R.shareId,m=await SHARE.make(pw);await upload(m);try{await SHARE.wipe(old,['camp/main'])}catch(_){}toast('새 링크로 옮겼어요');await switchTo(m)}],
        ['이 기기에서 함께 쓰기 끄기',async()=>{if(!confirm('이 기기에서는 함께 쓰기를 끄고 지금 내용을 이 기기에만 저장할까요? (다른 사람은 계속 함께 써요)'))return true;['shareId','shareKey','shareLock','sharePw'].forEach(k=>delete R[k]);await idb.put('camps',R.id,R);location.reload()}]]});return}
  SHARE.dialog({html:H3+'🔗 여러 사람과 함께 쓰기</h3><p style="margin:0 0 8px;font-size:15px;line-height:1.6">지금 이 기기에 있는 <b>'+E(R.name)+'</b> 기록을 온라인 저장소에 올리고, 함께 쓸 수 있는 링크를 만들어요.</p><ul style="font-size:14px;line-height:1.6;margin:0;padding-left:18px"><li>링크를 받은 사람은 같은 기록을 실시간으로 보고 고쳐요</li><li>링크를 아는 사람만 들어올 수 있어요</li><li>첨부한 사진·영수증 파일은 올린 기기에만 남아요</li></ul>'+SHARE.pwField(),
    buttons:[['함께 쓰기 시작',async w=>{const pw=w.querySelector('#__newPw').value;w.querySelector('h3').textContent='⏳ 올리는 중…';const m=await SHARE.make(pw);await upload(m);await switchTo(m)},true]]})}
})();
